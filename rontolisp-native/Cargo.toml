[workspace]
resolver = "3"
members = ["abi", "precomp", "runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# wasmtime 49's MSRV; an older toolchain resolves at most wasmtime 45, whose copying
# collector cannot satisfy the wasm-GC backend's 16 MiB heap pregrow.
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned EXACTLY: a module precompiled by one wasmtime version is refused by every other.
wasmtime = { version = "=49.0.0", default-features = false, features = ["runtime", "std", "gc", "gc-copying"] }
wasmtime-wasi = { version = "=49.0.0", default-features = false, features = ["p1"] }
rlabi = { path = "abi" }

# The precompile shim is loaded into the JVM: a panic must unwind to its catch_unwind
# and come back as an error code, never abort the host process.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The runner stub has no host to protect; abort keeps it small.
# Not one codegen unit: under one, LLVM leaves wasmtime's `GcHeap::index` out of line in
# the copying collector, +12% instructions on a GC-heavy program. Any count from 2 up
# inlines it; 4 was the smallest stub (.kb/native-output.md, "Traps"). The shim keeps one:
# four made precompiling 2% more instructions.
[profile.release-runner]
inherits = "release"
panic = "abort"
codegen-units = 4

# Tests precompile in-process: an unoptimized Cranelift would dominate their run time.
[profile.dev.package."*"]
opt-level = 3
