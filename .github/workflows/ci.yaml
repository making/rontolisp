name: Java CI with Maven

on:
  push:
    branches:
    - develop
    - main
    paths:
    - src/**
    - pom.xml
    - .github/workflows/ci.yaml
  pull_request:
    branches:
    - develop
    - main
    paths:
    - src/**
    - pom.xml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
    - name: Unit Tests
      run: ./mvnw -V --no-transfer-progress clean test
  native-image:
    needs: test
    strategy:
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"ubuntu-latest","artifact-name":"rontolisp-linux-amd64"}]') || fromJSON('[{"os":"ubuntu-latest","artifact-name":"rontolisp-linux-amd64"},{"os":"ubuntu-24.04-arm","artifact-name":"rontolisp-linux-arm64"},{"os":"macos-latest","artifact-name":"rontolisp-darwin-arm64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
    - name: Build native image
      run: ./mvnw -V --no-transfer-progress -Pnative clean package -DskipTests
    - name: Install wasmtime
      uses: bytecodealliance/actions/wasmtime/setup@v1
      with:
        version: "latest"
    - name: Verify native image
      run: |
        set -e
        ./target/rontolisp -v
        # Test interpreter mode
        ./target/rontolisp src/test/resources/ci-test.lisp > /tmp/actual-interp.txt
        diff src/test/resources/ci-test-expected.txt /tmp/actual-interp.txt
        # Test JVM compilation mode
        cd /tmp && $GITHUB_WORKSPACE/target/rontolisp $GITHUB_WORKSPACE/src/test/resources/ci-test.lisp -o Test.class && java Test > /tmp/actual-jvm.txt
        diff $GITHUB_WORKSPACE/src/test/resources/ci-test-expected.txt /tmp/actual-jvm.txt
        # Test WASM compilation mode
        cd /tmp && $GITHUB_WORKSPACE/target/rontolisp $GITHUB_WORKSPACE/src/test/resources/ci-test.lisp -o test.wasm && wasmtime --wasm gc test.wasm > /tmp/actual-wasm.txt
        diff $GITHUB_WORKSPACE/src/test/resources/ci-test-expected.txt /tmp/actual-wasm.txt
    - name: Rename binary
      if: github.event_name != 'pull_request'
      run: mv target/rontolisp target/${{ matrix.artifact-name }}
    - name: Upload artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact-name }}
        path: target/${{ matrix.artifact-name }}
  release:
    needs: native-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
    - name: Extract version
      id: version
      run: |
        VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          IS_SNAPSHOT=true
        else
          IS_SNAPSHOT=false
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "is_snapshot=$IS_SNAPSHOT" >> "$GITHUB_OUTPUT"
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Delete existing snapshot release
      if: steps.version.outputs.is_snapshot == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release delete ${{ steps.version.outputs.version }} --yes --cleanup-tag || true
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        prerelease: ${{ steps.version.outputs.is_snapshot }}
        name: ${{ steps.version.outputs.is_snapshot == 'true' && format('{0} (snapshot)', steps.version.outputs.version) || steps.version.outputs.version }}
        files: |
          artifacts/rontolisp-linux-amd64/rontolisp-linux-amd64
          artifacts/rontolisp-linux-arm64/rontolisp-linux-arm64
          artifacts/rontolisp-darwin-arm64/rontolisp-darwin-arm64
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
    - name: Import Secrets
      id: secrets
      uses: hashicorp/vault-action@v3.4.0
      with:
        exportToken: true
        method: jwt
        url: ${{ secrets.VAULT_ADDR }}
        role: cicd
        secrets: |
          kv/data/cicd/maven_central username | MAVEN_CENTRAL_USERNAME ;
          kv/data/cicd/maven_central password | MAVEN_CENTRAL_PASSWORD ;
          kv/data/cicd/gpg secring | GPG_SECRING ;
          kv/data/cicd/gpg passphrase | GPG_PASSPHRASE ;
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
        gpg-private-key: ${{ steps.secrets.outputs.GPG_SECRING }}
        gpg-passphrase: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
    - name: Generates Maven Settings
      uses: s4u/maven-settings-action@v4.0.0
      with:
        servers: |
          [{
              "id": "central",
              "username": "${{ steps.secrets.outputs.MAVEN_CENTRAL_USERNAME }}",
              "password": "${{ steps.secrets.outputs.MAVEN_CENTRAL_PASSWORD }}"
          }]
    - name: Deploy to Maven Central
      run: |
        set -e
        mvn -V \
            javadoc:jar \
            source:jar \
            package \
            org.apache.maven.plugins:maven-gpg-plugin:3.0.1:sign \
            deploy \
            --no-transfer-progress \
            -Dgpg.passphrase=${GPG_PASSPHRASE} \
            -DskipTests=true
    - name: Revoke token
      if: always()
      run: |
        curl -X POST -s -H "X-Vault-Token: ${VAULT_TOKEN}" ${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self || true
