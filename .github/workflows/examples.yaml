name: Examples

# Run every example in examples/examples.yaml on every backend it declares
# (ExamplesE2eTest), so a broken example is found by CI rather than by whoever
# next opens the directory.
#
# Nothing ran this suite before: ci.yaml's `test` job runs `clean test`, where
# no exec jar exists so the class aborts, and the native job runs only
# CiSpecE2eTest -- which is why a Clack :raw-body change left one Worker example
# answering 500 unnoticed. The suite itself is not the gate for that: it takes
# ~22 minutes on 64 cores and its slowest legs compile WASM modules, so a
# 4 vCPU runner is a different order of magnitude and a per-push job would be
# betting the pipeline on it.
#
# Daily instead, like the ANSI and size reports, plus a push trigger for the
# files whose edit is ABOUT an example. A regression driven by a compiler change
# (the one above) is caught by the next scheduled run, not by its own commit;
# trigger this by hand after a change expected to move an example.
# Re-evaluation trigger: measure a scheduled run's wall clock. If a runner
# finishes it well inside the `test` job's own time, promote it to `push` on
# src/main/** and it becomes a real per-commit gate.
on:
  schedule:
  - cron: '23 2 * * *'
  workflow_dispatch: {}
  push:
    branches:
    - develop
    paths:
    - examples/**
    - src/test/java/am/ik/rontolisp/e2e/ExamplesE2eTest.java
    - .github/workflows/examples.yaml

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: maven
    # The `wasm` RUN backend executes the compiled module; the compile-only
    # backends do not need it. Same pin as ci.yaml so a failure here means the
    # example, not the runtime.
    - name: Install wasmtime
      uses: bytecodealliance/actions/wasmtime/setup@v1
      with:
        version: "v47.0.3"
    # The Clack / lack / tiny-routes / ningle examples ql:quickload their
    # systems. Carrying the cache keeps the run off the network, so a red job
    # means an example broke rather than that a dist moved under it.
    - name: Cache the Quicklisp dist
      uses: actions/cache@v6
      with:
        path: ~/.rontolisp/quicklisp
        key: quicklisp-${{ runner.os }}-${{ hashFiles('examples/examples.yaml') }}
        restore-keys: |
          quicklisp-${{ runner.os }}-
    # The driver runs the exec jar (-Drontolisp.examples=true opts in); the
    # native binary would cost a native-image build for the same coverage.
    - name: Build the exec jar
      run: ./mvnw -V --no-transfer-progress -DskipTests clean package
    - name: Run every example
      run: |
        ./mvnw -V --no-transfer-progress \
          -Dtest=ExamplesE2eTest -DfailIfNoTests=false \
          -Drontolisp.examples=true \
          test
