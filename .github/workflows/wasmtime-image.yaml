name: Build wasmtime test image

# Builds the Debian + pinned-wasmtime image the WASM integration tests run against
# and pushes it to GHCR, so the test job pulls a ready image instead of installing
# wasmtime on every run. Rebuilds only when the Dockerfile or this workflow change;
# also runnable on demand. WasmtimeSupport.IMAGE tracks :latest, so it needs no edit
# when the version moves -- but this workflow must be RE-RUN, or :latest keeps serving
# the old wasmtime.
on:
  push:
    branches:
    - develop
    - main
    paths:
    - .github/docker/wasmtime/**
    - .github/workflows/wasmtime-image.yaml
  workflow_dispatch: {}

env:
  # The image tag = the wasmtime version (with its leading 'v'). This is passed as the
  # build-arg below, so it OVERRIDES the Dockerfile ARG default: bumping the Dockerfile
  # alone publishes the OLD wasmtime under the new :latest. The three pins that must move
  # together are this one, the Dockerfile ARG default, and the `version:` the ci.yaml test
  # job installs on the host for WasmLispCompilerIntegrationTest.
  WASMTIME_VERSION: v47.0.3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Compute image name
      id: image
      run: echo "name=ghcr.io/${{ github.repository_owner }}/rontolisp-wasmtime" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .github/docker/wasmtime
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          WASMTIME_VERSION=${{ env.WASMTIME_VERSION }}
        tags: |
          ${{ steps.image.outputs.name }}:${{ env.WASMTIME_VERSION }}
          ${{ steps.image.outputs.name }}:latest
