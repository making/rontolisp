name: Build wasmtime test image

# Builds the Debian + pinned-wasmtime image the WASM integration tests run against
# and pushes it to GHCR, so the test job pulls a ready image instead of installing
# wasmtime on every run. Rebuilds only when the Dockerfile or this workflow change;
# also runnable on demand. Keep the pushed tag in sync with WasmtimeSupport.IMAGE.
on:
  push:
    branches:
    - develop
    - main
    paths:
    - .github/docker/wasmtime/**
    - .github/workflows/wasmtime-image.yaml
  workflow_dispatch: {}

env:
  # The image tag = the wasmtime version (with its leading 'v'). Bump this, the
  # Dockerfile ARG default and WasmtimeSupport.IMAGE together.
  WASMTIME_VERSION: v46.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Compute image name
      id: image
      run: echo "name=ghcr.io/${{ github.repository_owner }}/rontolisp-wasmtime" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .github/docker/wasmtime
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          WASMTIME_VERSION=${{ env.WASMTIME_VERSION }}
        tags: |
          ${{ steps.image.outputs.name }}:${{ env.WASMTIME_VERSION }}
          ${{ steps.image.outputs.name }}:latest
