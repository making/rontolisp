  # --- net: sockets / HTTP servers & clients (blocking -> compile-only) -------
  - path: net/echo-server.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/echo-client.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/http-hello.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/http-handler.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/http-handler-cl-who.lisp
    backends: [jvm-compile, wasm-component]
    systemPath: src/test/resources/cl-who
  - path: net/httpbin.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/hello-clack.lisp
    backends: [jvm-compile, war-compile, wasm-component, wasm-reactor]
    note: >-
      the smallest Clack application, and the ONE source for every transport
      :server :rontolisp picks between: a socket the program binds itself
      (interpreter / JVM), a Servlet container that owns the port
      (-o app.war), the wasi:http host under `wasmtime serve` (--component),
      and a host that CALLS an export rather than handing over a socket
      (--no-wasi -- what cloudflare-workers/hello-clack-one-source deploys,
      unedited). All four legs are COMPILE legs: two bind a port and two are
      never run as a program at all, a war being deployed and a reactor called.
      So what this pins is that the file every one of those hosts ships stays
      ONE file -- the JVM class, the war, the component and the reactor built
      from it in the same run, which is the only place a per-target edit could
      hide. The interpreter leg is the same program under `rontolisp` and blocks
      like the others here. :port is read from the PORT environment variable,
      which only the two socket transports look at.
  - path: net/hello-clack-accesslog.lisp
    backends: [jvm-compile, war-compile, wasm-component]
    note: >-
      the same application with lack's OWN accesslog middleware composed around
      it by lack:builder -- the middleware quickloaded unpatched, so what this
      pins is that a `(:accesslog ...)` builder keyword resolves on the compile
      path at all: lack.util:find-middleware loads the middleware's system at
      RUN time through quicklisp, which a compiled program has no way to do, so
      the explicit `lack-middleware-accesslog` in the quickload list is what
      makes the package exist before the builder form is expanded. The log line
      itself goes to the transport's standard output on every leg here -- the
      terminal, the Servlet container's log, and `stdout [0] ::` under
      `wasmtime serve`, where the request carries no peer address and the line
      opens with NIL. No wasm-reactor leg, and not because it fails to compile:
      a --no-wasi module's standard output is a discarding sink, so the default
      logger would write nowhere on a Worker.
  - path: net/httpbin-clack.lisp
    backends: [jvm-compile, war-compile, wasm-component, wasm-reactor]
    note: >-
      plain Clack, and the ONE source for every host:
      cloudflare-workers/httpbin-clack-one-source compiles THIS file (not a
      copy) as its deployed Worker, because :server :rontolisp takes the reactor
      shape under --no-wasi. What this pins is that the file the Worker ships is
      still a portable Clack application -- an application FUNCTION plus a
      middleware applied directly, which is also the spelling that keeps
      clackup's pathname branch provably dead -- on every transport
      :server :rontolisp picks between: the two that bind a socket (a blocking
      server, hence compile-only; Preview 1 has no incoming TCP), the Servlet
      war a container deploys, and the reactor a host calls. Its --no-wasi leg
      is the wasm-reactor token, the shape the Worker's own build.sh then
      compiles --optimize=size with the streaming boundary its echoed bodies
      need. Like net/hello-clack.lisp it takes :port from the PORT environment
      variable -- the same file, five hosts, the endpoints being the only
      difference.
  - path: net/httpbin-tiny-routes.lisp
    backends: [jvm-compile, wasm-component]
    note: >-
      the same endpoints composed with tiny-routes instead: route macros, a
      /status/:code template, the decline protocol, and `pipe` threading the
      table through wrap-request-body / wrap-query-parameters /
      wrap-response-content-type -- so what this pins beyond the clack case is
      that the library's own middleware stack compiles and that the lite
      system's ql:quickload spelling resolves on both compile paths. Blocking
      server, hence compile-only.
  - path: net/httpbin-ningle.lisp
    backends: [jvm-compile, wasm-component]
    note: >-
      the same endpoints a third way, on a ningle application OBJECT: routes
      assigned in a loop with an :ANY fallback per path for the 405, a
      controller that returns a STRING and mutates ningle:*response*, a
      `:regexp t` /status rule whose :captures bind, and an overridden
      ningle:not-found METHOD for the 404. What it pins beyond the tiny-routes
      case is the other routing model on the two backends where clackup can bind
      -- a `defmethod` on a CLOS library generic,
      requirement closures compiled when the route is defined, and the whole
      lack-request chain (http-body / fast-http / smart-buffer) compiling, which
      ningle reads every request through.
  - path: net/httpbin-clos.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/httpbin-jzon.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/magic-8-ball.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/dog-fetcher.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/linalg-api.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/kv-server.lisp
    backends: [jvm-compile, wasm-component]
  - path: net/https-hello.lisp
