  - path: llm-from-scratch/chapter02/section5.lisp
    backends: [interpreter, jvm, wasm]
    simd: true
    note: notebook 2.5 -- the masks, the vocabulary, and a Transformer trained on the in-file 12-pair ja->en corpus then decoded greedily. Under --simd for the margin - the interpreter leg is 40.9 s scalar against the 240 s cap and 5.4 s with the flag, and every leg prints the same bytes either way (verified on all three)
