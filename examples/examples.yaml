  # bucketed histogram, which the WASM exp approximation cannot flip). The
  # MNIST scripts read dataset/*-ubyte (a one-time ./download-mnist.sh) and
  # ch03/sample-weight.bin relative to the example root, which the throwaway
  # test workdir does not have -- so they get compile-only legs; run them
  # manually per the README.
