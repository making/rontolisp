  # --- cloudflare-workers: a wasm-export handler driven by a JavaScript host ---
  - path: cloudflare-workers/hello/worker.lisp
    backends: [no-gc, wasm-component]
    note: >-
      the simplest Worker: three wasm-export'ed functions a JavaScript host calls
      directly. Host-invoked, so the harness only compiles it. no-gc pins the
      563-byte MVP module the Worker imports; wasm-component pins that the same
      three exports lower through the canonical ABI, which is what
      cloudflare-workers/httpbin-component transpiles with jco.
  - path: cloudflare-workers/hello-clack/check.lisp
    backends: [interpreter, jvm, wasm]
    note: >-
      the smallest Clack application on a Worker, and the counterpart of
      hello/: worker.lisp is THREE forms -- quickload, the application defun,
      clackup with :server :cloudflare-workers -- and contains no
      Worker-specific code at all, because the handler backend stores the app
      and the compiler synthesizes the exported entry point. The demo drives it
      through that backend's `dispatch`, the same function the synthesized
      wasm-export calls, so what this pins is the clackup route itself on every
      backend the compiler has. Checked with contains, not equals: the demo
      prints clackup's own start-up banner, and the JSON key ORDER follows
      hash-table iteration order, which differs per backend.
    expect:
      contains:
        - 'Hello from Clack on Cloudflare Workers'
        - 'GET /anything'
        - '"status":200'
  - path: cloudflare-workers/hello-tiny-routes/check.lisp
    backends: [interpreter, jvm, wasm]
    note: >-
      the same Worker with the application COMPOSED instead of written: three
      routes through tiny-routes/lite (loaded by ql:quickload, so the lite
      system resolves on the compile paths too) handed to clackup with
      :server :cloudflare-workers. What it pins beyond hello-clack's case is
      the routing itself on every backend the compiler has -- the
      "/hello/:name" path template binding a parameter through the ppcre-free
      matcher, and a path no route claims declining into the catch-all 404.
      Checked with contains, not equals: the demo prints clackup's own
      start-up banner, and JSON key order differs per backend.
    expect:
      contains:
        - 'Hello from tiny-routes on Cloudflare Workers'
        - 'Hello, rontolisp!'
        - 'no route for /anything'
        - '"status":404'
  - path: cloudflare-workers/httpbin/check.lisp
    backends: [interpreter, jvm, wasm]
    note: >-
      loads worker.lisp -- the CLACK-FREE flavour of the Worker: the application
      down to `app` is net/httpbin-clack.lisp VERBATIM (the same text
      cloudflare-workers/httpbin-clack/worker.lisp deploys), and what puts it on
      a reactor is thirty lines written out under it rather than
      clack:clackup -- and drives it over the requests the README curls. So the
      two directories differ in exactly one thing, and this case is the
      clackup-free half of the pair: the adapter calls the same
      rontolisp::%http-make-env / %http-normalize-response entry points the
      handler backend does, so what it pins is that a hand-written adapter
      builds the same environment on every backend -- the "?" split and the
      percent-decoding of the raw target (/%67et answers "path":"/get"), the
      content-length the buffered :raw-body needs, and the response header ALIST
      crossing as a JSON array of pairs rather than an object. The Worker itself
      calls the wasm-export'ed handle-request from JavaScript and is built by the
      directory's build.sh (--no-wasi --optimize, a shape no backend token here
      covers). Checked with contains, not equals: the key ORDER inside a JSON
      object follows hash-table iteration order, which differs per backend.
    expect:
      contains:
        # The response body is a JSON string nested in the outer JSON, so its
        # own quotes arrive backslash-escaped. One key per needle: a needle
        # spanning two keys would depend on their order.
        - '\"path\":\"/get\"'
        - '\"json\":{\"name\":\"rontolisp\"}'
        - '\"json\":null'
        - '\"allowed\":\"POST\"'
        - '"status":404'
  - path: cloudflare-workers/httpbin-clack/check.lisp
    backends: [interpreter, jvm, wasm]
    note: >-
      loads worker.lisp -- the CLACK flavour of the Worker, and the whole of it:
      everything from the quickload down to `app` is net/httpbin-clack.lisp
      VERBATIM (a Clack environment in, a Clack response out), and the Cloudflare
      port is that file's clackup line with different ARGUMENTS -- :server
      :cloudflare-workers, the built-in handler backend that stores the app and
      whose exported entry point the compiler synthesizes. What this pins is
      that the adapter builds the same environment on every backend: the "?"
      split and the percent-decoding of the raw target (/%67et answers
      "path":"/get"), the content-length the buffered :raw-body needs, and the
      response header ALIST crossing as a JSON array of pairs rather than an
      object. It also pins the clackup route itself, since the demo drives the
      handler backend's `dispatch` -- the same function the synthesized
      wasm-export calls -- on all three backends. The Worker calls that export
      (handle-request) from JavaScript and is built by the directory's build.sh
      (--no-wasi --optimize). Checked with contains, not equals: the key ORDER
      inside a JSON object follows hash-table iteration order, which differs per
      backend.
    expect:
      contains:
        # The response body is a JSON string nested in the outer JSON, so its
        # own quotes arrive backslash-escaped. One key per needle: a needle
        # spanning two keys would depend on their order.
        - '\"path\":\"/get\"'
        - '\"a\":\"1\"'
        - '\"b\":\"two\"'
        - '\"json\":{\"name\":\"rontolisp\"}'
        - '\"json\":null'
        - '\"allowed\":\"POST\"'
        - '"status":404'
        - '[["content-type","application/json"]]'

  - path: cloudflare-workers/httpbin-tiny-routes/check.lisp
    backends: [interpreter, jvm, wasm]
    note: >-
      loads worker.lisp -- httpbin-clack's endpoints routed through the REAL
      tiny-routes API, loaded as "tiny-routes/lite": the opt-in system whose
      ppcre-free path-template matcher keeps cl-ppcre out of the module
      (.kb/asdf.md; the corpus pinning lite == full is TinyRoutesLiteE2eTest).
      What this pins beyond httpbin-clack's case is the routed Worker end to
      end on every backend the compiler has: a method-specific route
      (define-get, define-post, ... and wrap-request-matches-method for the
      PATCH one) DECLINING on the wrong method so the single catch-all answers
      httpbin's own 405, the /status/:code path template binding a parameter
      through the lite matcher, a non-numeric :code declining into the
      catch-all's 404 instead, and the ql:quickload spelling of the lite system
      resolving on the compile paths. Checked with contains, not equals: JSON
      key order follows hash-table iteration order, which differs per backend.
    expect:
      contains:
        - '\"path\":\"/get\"'
        - '\"json\":{\"name\":\"rontolisp\"}'
        - '\"allowed\":\"POST\"'
        - '"status":418'
        - '\"path\":\"/status/teapot\"'
        - '"status":404'
        - '[["content-type","text/plain; charset=utf-8"]]'

  # --- wasm-size: the same two programs the cross-language size table measures ---
  - path: wasm-size/hello_world/hello_world.lisp
    backends: [interpreter, jvm, wasm, wasm-component]
    note: >-
      the size-comparison floor. What matters in its directory is the size of the
      compiled module (518 bytes with --optimize), but the number only means
      something if the module still prints, so the run legs pin the output and the
      wasm-component leg pins that the WASI 0.3 build of it compiles too.
    expect:
      equals: |
        Hello, World!
  - path: wasm-size/pi_approx/pi_approx.lisp
    backends: [interpreter, jvm, wasm, wasm-component]
    note: >-
      a million Leibniz terms in f64 and one ~,15F. The equals check is the point:
      the 15 decimal places must be identical on every backend, or the size table
      would be comparing modules that do not agree on what they compute.
    expect:
      equals: |
        pi = 3.141591653589774
  - path: wasm-size/hello_world/hello_world-nogc.lisp
    backends: [no-gc]
    note: >-
      the --no-gc floor, 406 bytes: a plain MVP core module that prints through
      fd_write with no wasm-GC at all. Host-invoked (wasmtime run --invoke
      say-hello), so the harness only compiles it.
  - path: wasm-size/pi_approx/pi_approx-nogc.lisp
    backends: [no-gc]
    note: >-
      the same Leibniz loop as a 1,042-byte MVP core module -- the smallest
      artifact in the directory. It prints with princ rather than ~,15F, so the
      gap to the wasm-GC build is what the GC value model and the fixed-decimal
      rendering cost, not the loop. Host-invoked (wasmtime run --invoke
      approx-pi), so the harness only compiles it.
