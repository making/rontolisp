    note: per-contact listing order follows hash-table iteration, which varies by backend
    expect:
      contains:
        - "Contact Book (3 entries):"
        - "Alice -> alice@newdomain.com"
        - "Alice (alice@newdomain.com)"
  - path: console/error-handling.lisp
