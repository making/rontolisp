      it is the one whose OUTPUT can be checked, which is what os: [mac] is for:
      the Objective-C runtime is macOS-only and this harness runs everywhere, so
      the RUN legs gate on the platform and the jvm-compile leg does not. That
      compile leg pins what minesweeper-macos cannot: a program that gates the
      embedded am.ik.objc blob on through the bare objc: verbs, with no appkit:
      reference and so no AppKitLibrary splice. The check is `contains` rather
      than a whole expected file because section 2 prints the PRIVATE class the
      runtime chose (__NSCFString, __NSArrayM, NSTaggedPointerString) -- true
      today, Apple's to rename -- so the needles pin the stable tail of the
      chain and every other section verbatim.
