      (let [r (http/post (url "/multipart") {:multipart [{:name "a" :content "x"}]})
            ct (get-in r [:request :headers "content-type"])]
        (prn (sort (keys (:request r))))
        (prn [(subs ct 0 30) (boolean (re-matches #"multipart/form-data; boundary=babashka_http_client_Boundary[0-9a-f-]{36}" ct))]))
      (prn (try (http/post (url "/multipart") {:multipart [{:name "n" :content nil}]})
