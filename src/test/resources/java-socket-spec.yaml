  # what only the host's socket shows: urgent data, out of band or inline, and a close that
  # lingers for no time; a component's host has neither (doc/*/java/deviations.md, "Sockets")
  - name: urgent
    file: Urgent.java
    skip:
      component: wasi:sockets has no urgent data and no linger
    source: |
      import java.io.InputStream;
      import java.io.OutputStream;
      import java.net.InetAddress;
      import java.net.ServerSocket;
      import java.net.Socket;

      public class Urgent {

          // what the peer reads up to the byte b, one byte a read
          static String through(InputStream in, int b) throws Exception {
              StringBuilder text = new StringBuilder();
              int c;
              do {
                  c = in.read();
                  text.append(text.length() == 0 ? "" : " ").append(c);
              } while (c != b && c >= 0);
              return text.toString();
          }

          public static void main(String[] args) throws Exception {
              ServerSocket server = new ServerSocket(0, 50, InetAddress.getByName("127.0.0.1"));
              Socket client = new Socket("127.0.0.1", server.getLocalPort());
              client.setTcpNoDelay(true);
              Socket served = server.accept();
              OutputStream out = client.getOutputStream();
              InputStream in = served.getInputStream();

              System.out.println("== urgent-data-is-out-of-band-unless-the-peer-takes-it-inline");
              out.write('a');
              client.sendUrgentData('U');
              out.write('b');
              System.out.println("apart: " + through(in, 'b'));
              served.setOOBInline(true);
              out.write('a');
              client.sendUrgentData(0x155);
              out.write('b');
              System.out.println("inline: " + through(in, 'b'));

              System.out.println("== a-close-that-lingers-for-no-time-resets-the-connection");
              client.setSoLinger(true, 0);
              client.close();
              try {
                  System.out.println("read: " + in.read());
              }
              catch (Exception e) {
                  System.out.println("read: " + e);
              }
              served.close();
              server.close();
          }
      }
    expected: |
      == urgent-data-is-out-of-band-unless-the-peer-takes-it-inline
      apart: 97 98
      inline: 97 85 98
      == a-close-that-lingers-for-no-time-resets-the-connection
      read: java.net.SocketException: Connection reset
