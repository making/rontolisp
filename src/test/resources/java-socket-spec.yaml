  # the options: what a socket and a server socket keep and refuse in each state, the
  # standard options by name, a connected socket's given to the host
  - name: options
    file: Options.java
    source: |
      import java.io.IOException;
      import java.net.InetAddress;
      import java.net.InetSocketAddress;
      import java.net.ServerSocket;
      import java.net.Socket;
      import java.net.SocketOption;
      import java.net.StandardSocketOptions;
      import java.util.List;
      import java.util.Set;

      public class Options {

          interface Asked {
              Object run() throws Exception;
          }

          static void ask(String what, Asked asked) {
              try {
                  System.out.println(what + ": " + asked.run());
              }
              catch (Exception e) {
                  System.out.println(what + ": " + e);
              }
          }

          static final List<SocketOption<?>> STANDARD = List.of(StandardSocketOptions.IP_MULTICAST_LOOP,
                  StandardSocketOptions.IP_MULTICAST_TTL, StandardSocketOptions.IP_TOS, StandardSocketOptions.SO_BROADCAST,
                  StandardSocketOptions.SO_KEEPALIVE, StandardSocketOptions.SO_LINGER, StandardSocketOptions.SO_RCVBUF,
                  StandardSocketOptions.SO_REUSEADDR, StandardSocketOptions.SO_REUSEPORT, StandardSocketOptions.SO_SNDBUF,
                  StandardSocketOptions.TCP_NODELAY);

          // which of the standard options a set holds
          static String held(Set<SocketOption<?>> set) {
              StringBuilder text = new StringBuilder();
              for (SocketOption<?> option : STANDARD) {
                  if (set.contains(option)) {
                      text.append(text.length() == 0 ? "" : " ").append(option.name());
                  }
              }
              return text.toString();
          }

          static String getters(Socket s) throws IOException {
              return s.getTcpNoDelay() + " " + s.getKeepAlive() + " " + s.getSoLinger() + " " + s.getOOBInline() + " "
                      + s.getTrafficClass() + " " + s.getReuseAddress();
          }

          static String options(Socket s) throws IOException {
              return s.getOption(StandardSocketOptions.TCP_NODELAY) + " " + s.getOption(StandardSocketOptions.SO_KEEPALIVE)
                      + " " + s.getOption(StandardSocketOptions.SO_LINGER) + " " + s.getOption(StandardSocketOptions.IP_TOS)
                      + " " + s.getOption(StandardSocketOptions.SO_REUSEADDR) + " "
                      + s.getOption(StandardSocketOptions.SO_REUSEPORT);
          }

          static void constants() {
              System.out.println("== the-standard-options-are-named-and-typed");
              for (SocketOption<?> option : STANDARD) {
                  System.out.println(option + " " + option.name() + " " + option.type().getName() + " "
                          + (option == StandardSocketOptions.TCP_NODELAY) + " " + option.equals(StandardSocketOptions.SO_LINGER));
              }
          }

          @SuppressWarnings({ "unchecked", "rawtypes" })
          static void unconnected() throws Exception {
              System.out.println("== an-unconnected-socket-keeps-its-options-and-refuses-what-is-out-of-range");
              Socket s = new Socket();
              ask("getters", () -> getters(s));
              ask("options", () -> options(s));
              ask("linger -1", () -> { s.setSoLinger(true, -1); return "set"; });
              ask("linger 0", () -> { s.setSoLinger(true, 0); return s.getSoLinger(); });
              ask("linger 65536", () -> { s.setSoLinger(true, 65536); return s.getSoLinger(); });
              ask("linger off", () -> { s.setSoLinger(false, 5); return s.getSoLinger(); });
              ask("inline", () -> { s.setOOBInline(true); return s.getOOBInline(); });
              ask("class -1", () -> { s.setTrafficClass(-1); return "set"; });
              ask("class 256", () -> { s.setTrafficClass(256); return "set"; });
              ask("class 184", () -> { s.setTrafficClass(184); return s.getTrafficClass(); });
              ask("supported", () -> held(s.supportedOptions()));
              ask("supported same", () -> s.supportedOptions() == s.supportedOptions());
              ask("supported add", () -> s.supportedOptions().add(StandardSocketOptions.SO_BROADCAST));
              ask("get null", () -> s.getOption(null));
              ask("set null", () -> s.setOption((SocketOption) null, 1));
              ask("get broadcast", () -> s.getOption(StandardSocketOptions.SO_BROADCAST));
              ask("set ttl", () -> s.setOption(StandardSocketOptions.IP_MULTICAST_TTL, 1));
              ask("set loop null", () -> s.setOption(StandardSocketOptions.IP_MULTICAST_LOOP, null));
              ask("set no delay null", () -> s.setOption(StandardSocketOptions.TCP_NODELAY, null));
              ask("set no delay 1", () -> s.setOption((SocketOption) StandardSocketOptions.TCP_NODELAY, 1));
              ask("set linger true", () -> s.setOption((SocketOption) StandardSocketOptions.SO_LINGER, true));
              SocketOption<Integer> own = new SocketOption<>() {
                  public String name() {
                      return "OWN";
                  }

                  public Class<Integer> type() {
                      return Integer.class;
                  }

                  public String toString() {
                      return "own";
                  }
              };
              ask("set own", () -> s.setOption(own, 1));
              ask("get own", () -> s.getOption(own));
              ask("tos -1", () -> s.setOption(StandardSocketOptions.IP_TOS, -1));
              ask("tos 256", () -> s.setOption(StandardSocketOptions.IP_TOS, 256));
              ask("send size -1", () -> s.setOption(StandardSocketOptions.SO_SNDBUF, -1));
              ask("receive size -1", () -> s.setOption(StandardSocketOptions.SO_RCVBUF, -1));
              ask("send size 4096", () -> s.setOption(StandardSocketOptions.SO_SNDBUF, 4096).getSendBufferSize());
              ask("receive size 4096", () -> s.setOption(StandardSocketOptions.SO_RCVBUF, 4096).getOption(StandardSocketOptions.SO_RCVBUF));
              ask("linger option -2", () -> s.setOption(StandardSocketOptions.SO_LINGER, -2).getSoLinger());
              ask("linger option 70000", () -> s.setOption(StandardSocketOptions.SO_LINGER, 70000).getSoLinger());
              s.setOption(StandardSocketOptions.TCP_NODELAY, true).setOption(StandardSocketOptions.SO_KEEPALIVE, true)
                  .setOption(StandardSocketOptions.SO_LINGER, 3).setOption(StandardSocketOptions.IP_TOS, 8)
                  .setOption(StandardSocketOptions.SO_REUSEADDR, true).setOption(StandardSocketOptions.SO_REUSEPORT, true);
              ask("options set", () -> options(s));
              ask("getters set", () -> getters(s));
              ask("urgent", () -> { s.sendUrgentData(1); return "sent"; });
              s.close();
              ask("closed getters", () -> getters(s));
              ask("closed class", s::getTrafficClass);
              ask("closed linger", s::getSoLinger);
              ask("closed set linger", () -> { s.setSoLinger(true, 1); return "set"; });
              ask("closed class 256", () -> { s.setTrafficClass(256); return "set"; });
              ask("closed class 8", () -> { s.setTrafficClass(8); return "set"; });
              ask("closed inline", () -> { s.setOOBInline(true); return "set"; });
              ask("closed supported", () -> held(s.supportedOptions()));
              ask("closed get null", () -> s.getOption(null));
              ask("closed get broadcast", () -> s.getOption(StandardSocketOptions.SO_BROADCAST));
              ask("closed set no delay null", () -> s.setOption(StandardSocketOptions.TCP_NODELAY, null));
              ask("closed set own", () -> s.setOption(own, 1));
              ask("closed urgent", () -> { s.sendUrgentData(1); return "sent"; });
          }

          @SuppressWarnings({ "unchecked", "rawtypes" })
          static void server() throws Exception {
              System.out.println("== a-server-socket-answers-its-own-options");
              ServerSocket server = new ServerSocket();
              ask("supported", () -> held(server.supportedOptions()));
              ask("supported same", () -> server.supportedOptions() == server.supportedOptions());
              ask("options", () -> server.getOption(StandardSocketOptions.SO_REUSEADDR) + " "
                      + server.getOption(StandardSocketOptions.SO_REUSEPORT) + " " + server.getOption(StandardSocketOptions.IP_TOS)
                      + " " + (server.getOption(StandardSocketOptions.SO_RCVBUF) > 0));
              ask("get no delay", () -> server.getOption(StandardSocketOptions.TCP_NODELAY));
              ask("set linger", () -> server.setOption(StandardSocketOptions.SO_LINGER, 1));
              ask("get null", () -> server.getOption(null));
              ask("set null", () -> server.setOption((SocketOption) null, 1));
              ask("set reuse null", () -> server.setOption(StandardSocketOptions.SO_REUSEADDR, null));
              ask("set receive -1", () -> server.setOption(StandardSocketOptions.SO_RCVBUF, -1));
              ask("set tos 256", () -> server.setOption(StandardSocketOptions.IP_TOS, 256));
              ask("set", () -> server.setOption(StandardSocketOptions.SO_REUSEADDR, false)
                  .setOption(StandardSocketOptions.SO_REUSEPORT, true).setOption(StandardSocketOptions.IP_TOS, 8)
                  .setOption(StandardSocketOptions.SO_RCVBUF, 4096).getReceiveBufferSize());
              ask("options set", () -> server.getOption(StandardSocketOptions.SO_REUSEADDR) + " " + server.getReuseAddress()
                      + " " + server.getOption(StandardSocketOptions.SO_REUSEPORT) + " "
                      + server.getOption(StandardSocketOptions.IP_TOS));
              server.close();
              ask("closed supported", () -> held(server.supportedOptions()));
              ask("closed get no delay", () -> server.getOption(StandardSocketOptions.TCP_NODELAY));
              ask("closed set reuse null", () -> server.setOption(StandardSocketOptions.SO_REUSEADDR, null));
              ask("closed get null", () -> server.getOption(null));
          }

          static void connected() throws Exception {
              System.out.println("== a-connected-socket-gives-its-options-to-the-host");
              ServerSocket server = new ServerSocket(0, 50, InetAddress.getByName("127.0.0.1"));
              Socket before = new Socket();
              before.setTcpNoDelay(true);
              before.setKeepAlive(true);
              before.setSoLinger(true, 7);
              before.setOOBInline(true);
              before.setTrafficClass(32);
              before.connect(new InetSocketAddress("127.0.0.1", server.getLocalPort()));
              Socket served = server.accept();
              ask("set before", () -> getters(before));
              ask("served", () -> getters(served));
              ask("served options", () -> options(served));
              ask("set after", () -> {
                  served.setTcpNoDelay(true);
                  served.setKeepAlive(true);
                  served.setSoLinger(true, 0);
                  served.setOOBInline(true);
                  served.setTrafficClass(184);
                  return getters(served);
              });
              ask("unset", () -> {
                  served.setTcpNoDelay(false);
                  served.setKeepAlive(false);
                  served.setSoLinger(false, 0);
                  served.setOOBInline(false);
                  served.setTrafficClass(0);
                  return getters(served);
