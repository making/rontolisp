              ask("no delay after the output's end", () -> { before.setTcpNoDelay(false); return before.getTcpNoDelay(); });
              before.close();
              served.close();
              server.close();
          }

          public static void main(String[] args) throws Exception {
              constants();
              unconnected();
              server();
              connected();
          }
      }
