  # threads: a server thread answering a client of the same program, a thread waiting for
  # its bytes while the others go on, a socket and a server socket closed under the threads
  # waiting in them -- on one stack each wait is a thread's, never the program's
  - name: threads
    file: Threads.java
    source: |
      import java.io.BufferedReader;
      import java.io.InputStream;
      import java.io.InputStreamReader;
      import java.io.PrintWriter;
      import java.net.InetAddress;
      import java.net.InetSocketAddress;
      import java.net.ServerSocket;
      import java.net.Socket;
      import java.nio.charset.StandardCharsets;
      import java.util.concurrent.CountDownLatch;

      public class Threads {

          // a listener whose queue is full: a connect to it waits
          static final InetSocketAddress HELD = new InetSocketAddress("127.0.0.1", Integer.parseInt("@HELD@"));

          static ServerSocket loopback() throws Exception {
              return new ServerSocket(0, 50, InetAddress.getByName("127.0.0.1"));
          }

          // A server of the program's own answers each line until its client closes.
          static void echo() throws Exception {
              System.out.println("== a-server-thread-answers-a-client-of-the-same-program");
              ServerSocket server = loopback();
              String[] said = new String[1];
              Thread serving = new Thread(() -> {
                  try (Socket s = server.accept()) {
                      BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
                      PrintWriter out = new PrintWriter(s.getOutputStream(), true);
                      String line;
                      int lines = 0;
                      while ((line = in.readLine()) != null) {
                          out.println(line.toUpperCase());
                          lines++;
                      }
                      said[0] = lines + " lines";
                  }
                  catch (Exception e) {
                      said[0] = e.toString();
                  }
              });
              serving.start();
              // the client waits before it connects: the server's accept is no wait of the program's
              Thread.sleep(20);
              try (Socket c = new Socket("127.0.0.1", server.getLocalPort())) {
                  PrintWriter out = new PrintWriter(c.getOutputStream(), true);
                  BufferedReader in = new BufferedReader(new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8));
                  for (String word : new String[] { "one", "two", "three" }) {
                      out.println(word);
                      System.out.println(in.readLine());
                  }
              }
              serving.join();
              System.out.println("server: " + said[0]);
              server.close();
          }

          // A thread reading waits while the others go on; the bytes another thread sends
          // after a sleep end its wait.
          static void waiting() throws Exception {
              System.out.println("== a-thread-waits-for-its-bytes-while-the-others-go-on");
              ServerSocket server = loopback();
              Socket client = new Socket("127.0.0.1", server.getLocalPort());
              Socket served = server.accept();
              CountDownLatch reading = new CountDownLatch(1);
              int[] got = new int[2];
              Thread reader = new Thread(() -> {
                  try {
                      InputStream in = served.getInputStream();
                      reading.countDown();
                      got[0] = in.read();
                      got[1] = in.read();
                  }
                  catch (Exception e) {
                      got[0] = -2;
                  }
              });
              reader.start();
              reading.await();
              int counted = 0;
              for (int i = 0; i < 5; i++) {
                  Thread.sleep(5);
                  counted++;
              }
              System.out.println("counted " + counted + " while it waited");
              client.getOutputStream().write(new byte[] { 42, 43 });
              reader.join();
              System.out.println("read " + got[0] + " " + got[1]);
              client.close();
              served.close();
              server.close();
          }

          // A socket closed under a read, a server socket under an accept: each wait ends
          // with the exception of a closed socket, whichever came first.
          static void closedUnder() throws Exception {
              System.out.println("== a-socket-closed-under-a-thread-that-waits-in-it");
              ServerSocket server = loopback();
              Socket client = new Socket("127.0.0.1", server.getLocalPort());
              Socket served = server.accept();
              // each thread notes what it saw in its own element of one array
              String[] seen = new String[2];
              CountDownLatch waiting = new CountDownLatch(2);
              Thread reader = new Thread(() -> {
                  try {
                      InputStream in = client.getInputStream();
                      waiting.countDown();
                      seen[0] = "read " + in.read();
                  }
                  catch (Exception e) {
                      seen[0] = e.getClass().getName();
                  }
              });
              ServerSocket idle = loopback();
              Thread acceptor = new Thread(() -> {
                  try {
                      waiting.countDown();
                      seen[1] = "accepted " + idle.accept();
                  }
                  catch (Exception e) {
                      seen[1] = e.getClass().getName();
                  }
              });
              reader.start();
              acceptor.start();
              waiting.await();
              Thread.sleep(100);
              client.close();
              idle.close();
              reader.join();
              acceptor.join();
              System.out.println("read: " + seen[0]);
              System.out.println("accept: " + seen[1]);
              served.close();
              server.close();
          }

          // A read past its deadline, a connect past its limit and an accept past its
          // deadline, each a thread's: the others go on meanwhile, and each ends at its
          // own time.
          static void limits() throws Exception {
              System.out.println("== a-thread-waits-for-a-socket-until-its-time-while-the-others-go-on");
              ServerSocket server = loopback();
              Socket client = new Socket("127.0.0.1", server.getLocalPort());
              Socket served = server.accept();
              client.setSoTimeout(100);
              server.setSoTimeout(100);
              String[] seen = new String[3];
              Thread reader = new Thread(() -> {
                  try {
                      seen[0] = "read " + client.getInputStream().read();
                  }
                  catch (Exception e) {
                      seen[0] = e.toString();
                  }
              });
              Socket late = new Socket();
              Thread connecting = new Thread(() -> {
                  try {
                      late.connect(HELD, 100);
                      seen[1] = "connected";
                  }
                  catch (Exception e) {
                      seen[1] = e + " " + late.isClosed();
                  }
              });
              Thread accepting = new Thread(() -> {
                  try {
                      seen[2] = "accepted " + server.accept();
                  }
                  catch (Exception e) {
                      seen[2] = e.toString();
                  }
              });
              reader.start();
              connecting.start();
              accepting.start();
              int counted = 0;
              while (reader.isAlive() || connecting.isAlive() || accepting.isAlive()) {
                  Thread.sleep(5);
                  counted++;
              }
              System.out.println("read: " + seen[0]);
              System.out.println("connect: " + seen[1]);
              System.out.println("accept: " + seen[2]);
              System.out.println("counted meanwhile: " + (counted > 0));
              client.close();
              served.close();
              server.close();
          }

          // A read another thread waits in answers the end once the input is shut.
          static void shutUnder() throws Exception {
              System.out.println("== an-input-shut-under-a-thread-that-reads-it");
              ServerSocket server = loopback();
              Socket client = new Socket("127.0.0.1", server.getLocalPort());
              Socket served = server.accept();
              String[] seen = new String[1];
              CountDownLatch reading = new CountDownLatch(1);
              Thread reader = new Thread(() -> {
                  try {
                      InputStream in = client.getInputStream();
                      reading.countDown();
                      seen[0] = "read " + in.read();
                  }
                  catch (Exception e) {
                      seen[0] = e.toString();
                  }
              });
              reader.start();
              reading.await();
              Thread.sleep(100);
              client.shutdownInput();
              reader.join();
              System.out.println("read: " + seen[0] + " " + client.isClosed());
              client.close();
              served.close();
              server.close();
          }

          // A connect with no limit ends with the close another thread makes.
          static void closedConnecting() throws Exception {
              System.out.println("== a-socket-closed-under-a-thread-that-connects-in-it");
              Socket under = new Socket();
              under.bind(new InetSocketAddress("127.0.0.1", 0));
              String[] seen = new String[1];
              CountDownLatch going = new CountDownLatch(1);
              Thread connecting = new Thread(() -> {
                  try {
                      going.countDown();
                      under.connect(HELD);
                      seen[0] = "connected";
                  }
                  catch (Exception e) {
                      seen[0] = e + " " + under.isClosed();
                  }
              });
              connecting.start();
              going.await();
              int counted = 0;
              for (int i = 0; i < 5; i++) {
                  Thread.sleep(20);
                  counted++;
              }
              System.out.println("counted " + counted + " while it connected");
              under.close();
              connecting.join();
              System.out.println("connect: " + seen[0]);
          }

          public static void main(String[] args) throws Exception {
              echo();
              waiting();
              closedUnder();
              limits();
              closedConnecting();
              shutUnder();
          }
      }
