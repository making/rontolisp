# The corpus of the experimental Java subset's sockets, java.net.Socket and ServerSocket
# (FetchSpecE2eTest#javaSockets): each program is a Java file run under the JDK running the
# test and on every target with sockets -- the interpreter, the JVM, a --native output and a
# --component -- each its own server in the same program, on the loopback. Written here;
# nothing is copied or translated from a JDK or its tests (.kb/java-frontend-provenance.md).
#
# A program prints a line `== name` ahead of each case, and its output is cut into cases at
# those lines, so a failure names its case and its leg. `expected` is what a JDK 25 prints,
# and the JDK leg checks that it still is; a port, which differs from run to run, is shown
# as <n>. @HELD@ is the port of a loopback listener of the test's whose queue is full: a
# connect to it waits until its time limit or a close. A plain Preview 1 module has no
# socket: every program is also run there, and must end at its first socket with the
# refusal's words (doc/*/java/deviations.md, "Sockets").
programs:
  # one thread: an unconnected socket, a server socket in each state, a connection whose
  # server end the same thread accepts (the connection waits in the backlog), a deadline
  - name: sockets
    file: Sockets.java
    source: |
      import java.io.BufferedReader;
      import java.io.DataInputStream;
      import java.io.DataOutputStream;
      import java.io.IOException;
      import java.io.InputStream;
      import java.io.InputStreamReader;
      import java.io.InterruptedIOException;
      import java.io.OutputStream;
      import java.io.PrintWriter;
      import java.net.InetAddress;
      import java.net.InetSocketAddress;
      import java.net.ServerSocket;
      import java.net.Socket;
      import java.net.SocketAddress;
      import java.net.SocketTimeoutException;
      import java.nio.charset.StandardCharsets;
      import javax.net.ServerSocketFactory;
      import javax.net.SocketFactory;

      public class Sockets {

          // a listener whose queue is full: a connect to it waits
          static final InetSocketAddress HELD = new InetSocketAddress("127.0.0.1", Integer.parseInt("@HELD@"));

          interface Asked {
              Object run() throws Exception;
          }

          static String ports(Object value, int... ports) {
              String text = String.valueOf(value);
              for (int i = 0; i < ports.length; i++) {
                  text = text.replace(":" + ports[i], ":<" + i + ">").replace("=" + ports[i], "=<" + i + ">");
              }
              return text.replaceAll("@[0-9a-f]+$", "@");
          }

          static void ask(String what, Asked asked, int... ports) {
              try {
                  System.out.println(what + ": " + ports(asked.run(), ports));
              }
              catch (Exception e) {
                  System.out.println(what + ": " + ports(e, ports));
              }
          }

          static ServerSocket loopback() throws IOException {
              return new ServerSocket(0, 50, InetAddress.getByName("127.0.0.1"));
          }

          static void unconnected() throws Exception {
              System.out.println("== an-unconnected-socket-answers-keeps-its-options-and-refuses");
              Socket s = new Socket();
              ask("text", () -> s);
              ask("states", () -> s.isConnected() + " " + s.isBound() + " " + s.isClosed() + " " + s.isInputShutdown() + " "
                      + s.isOutputShutdown());
              ask("ends", () -> s.getInetAddress() + " " + s.getPort() + " " + s.getLocalPort() + " " + s.getLocalAddress()
                      + " " + s.getRemoteSocketAddress() + " " + s.getLocalSocketAddress());
              ask("options", () -> s.getSoTimeout() + " " + s.getTcpNoDelay() + " " + s.getKeepAlive() + " "
                      + s.getReuseAddress() + " " + (s.getSendBufferSize() > 0) + " " + (s.getReceiveBufferSize() > 0));
              ask("input", s::getInputStream);
              ask("output", s::getOutputStream);
              ask("timeout -1", () -> { s.setSoTimeout(-1); return "set"; });
              ask("send size 0", () -> { s.setSendBufferSize(0); return "set"; });
              ask("receive size -5", () -> { s.setReceiveBufferSize(-5); return "set"; });
              s.setSoTimeout(250);
              s.setTcpNoDelay(true);
              s.setKeepAlive(true);
              s.setReuseAddress(true);
              s.setSendBufferSize(4096);
              s.setReceiveBufferSize(4096);
              ask("options set", () -> s.getSoTimeout() + " " + s.getTcpNoDelay() + " " + s.getKeepAlive() + " "
                      + s.getReuseAddress());
              ask("connect null", () -> { s.connect(null); return "connected"; });
              ask("connect -1", () -> { s.connect(new InetSocketAddress("127.0.0.1", 1), -1); return "connected"; });
              ask("connect another kind", () -> { s.connect(new SocketAddress() { }); return "connected"; });
              ask("still open", s::isClosed);
              ask("connect unresolved", () -> { s.connect(InetSocketAddress.createUnresolved("db.invalid", 5432)); return "connected"; });
              ask("closed by it", s::isClosed);
              Socket t = new Socket();
              t.close();
              t.close();
              ask("closed text", () -> t + " " + t.isClosed() + " " + t.getLocalAddress() + " " + t.getLocalSocketAddress());
              ask("closed timeout", t::getSoTimeout);
              ask("closed no delay", () -> { t.setTcpNoDelay(true); return "set"; });
              ask("closed send size 0", () -> { t.setSendBufferSize(0); return "set"; });
              ask("closed send size", () -> { t.setSendBufferSize(10); return "set"; });
              ask("closed input", t::getInputStream);
              ask("closed connect", () -> { t.connect(new InetSocketAddress("127.0.0.1", 1)); return "connected"; });
              ask("closed connect null", () -> { t.connect(null); return "connected"; });
              ask("closed bind", () -> { t.bind(null); return "bound"; });
              ask("port past", () -> new Socket("127.0.0.1", 65536));
              ask("address null", () -> new Socket((InetAddress) null, 1));
          }

          static void listener() throws Exception {
              System.out.println("== a-server-socket-unbound-bound-and-closed");
              ServerSocket server = new ServerSocket();
              ask("unbound", () -> server + " " + server.isBound() + " " + server.isClosed() + " " + server.getInetAddress()
                      + " " + server.getLocalPort() + " " + server.getLocalSocketAddress() + " " + server.getReuseAddress()
                      + " " + (server.getReceiveBufferSize() > 0));
              ask("accept unbound", server::accept);
              ask("bind another kind", () -> { server.bind(new SocketAddress() { }); return "bound"; });
              ask("bind unresolved", () -> { server.bind(InetSocketAddress.createUnresolved("db.invalid", 0)); return "bound"; });
              ask("receive size 0", () -> { server.setReceiveBufferSize(0); return "set"; });
              server.bind(new InetSocketAddress("127.0.0.1", 0));
              int port = server.getLocalPort();
              ask("bound", () -> server + " " + server.isBound() + " " + server.getInetAddress() + " "
                      + server.getLocalSocketAddress(), port);
              ask("bind again", () -> { server.bind(new InetSocketAddress("127.0.0.1", 0)); return "bound"; });
              ask("in use", () -> new ServerSocket(port, 50, InetAddress.getByName("127.0.0.1")), port);
              server.setReuseAddress(false);
              ask("reuse", server::getReuseAddress);
              server.close();
              ask("closed", () -> server + " " + server.isBound() + " " + server.isClosed() + " " + server.getInetAddress(),
                      port);
              ask("closed accept", server::accept);
              ask("closed bind", () -> { server.bind(null); return "bound"; });
              ask("closed reuse", server::getReuseAddress);
              ask("port -1", () -> new ServerSocket(-1));
              ask("port past", () -> new ServerSocket(65536));
              ServerSocket named = new ServerSocket();
              named.bind(new InetSocketAddress("localhost", 0), 5);
              ask("by name", () -> named + " " + named.getInetAddress(), named.getLocalPort());
              named.close();
              ServerSocket made = ServerSocketFactory.getDefault().createServerSocket(0, 50, InetAddress.getByName("127.0.0.1"));
              ask("factories", () -> SocketFactory.getDefault().getClass().getName() + " "
                      + ServerSocketFactory.getDefault().getClass().getName() + " "
                      + (SocketFactory.getDefault() == SocketFactory.getDefault()) + " "
                      + SocketFactory.getDefault().createSocket() + " " + made, made.getLocalPort());
              made.close();
              ask("unbound from a factory", () -> ServerSocketFactory.getDefault().createServerSocket());
              SocketFactory plain = new SocketFactory() {
                  public Socket createSocket(String host, int port) {
                      return null;
                  }

                  public Socket createSocket(String host, int port, InetAddress local, int localPort) {
                      return null;
                  }

                  public Socket createSocket(InetAddress host, int port) {
                      return null;
                  }

                  public Socket createSocket(InetAddress host, int port, InetAddress local, int localPort) {
                      return null;
                  }
              };
              ask("unconnected not made", plain::createSocket);
          }

          static void carried() throws Exception {
              System.out.println("== a-connection-carries-bytes-both-ways");
              ServerSocket server = loopback();
              int port = server.getLocalPort();
              Socket client = SocketFactory.getDefault().createSocket("127.0.0.1", port);
              Socket served = server.accept();
              int local = client.getLocalPort();
              ask("client", () -> client + " " + client.getInetAddress() + " " + client.getRemoteSocketAddress() + " "
                      + client.getLocalSocketAddress() + " " + client.isConnected() + " " + client.isBound(), port, local);
              ask("served", () -> served + " " + served.getInetAddress() + " " + served.getLocalAddress() + " "
                      + (served.getPort() == local) + " " + (served.getLocalPort() == port), local, port);
              ask("connect again", () -> { client.connect(new InetSocketAddress("127.0.0.1", port)); return "connected"; });
              ask("bind connected", () -> { client.bind(null); return "bound"; });
              InputStream in = client.getInputStream();
              OutputStream out = client.getOutputStream();
              ask("same streams", () -> (in == client.getInputStream()) + " " + (out == client.getOutputStream()));
              InputStream sin = served.getInputStream();
              OutputStream sout = served.getOutputStream();
              sout.write("hello".getBytes(StandardCharsets.UTF_8));
              ask("first", in::read);
              byte[] buffer = new byte[100];
              ask("what is there", () -> {
                  int n = in.read(buffer, 10, 50);
                  return n + " " + new String(buffer, 10, n, StandardCharsets.UTF_8);
              });
              ask("nothing there", in::available);
              ask("none asked", () -> in.read(buffer, 0, 0));
              ask("read off -1", () -> in.read(buffer, -1, 1));
              ask("read past", () -> in.read(buffer, 99, 2));
              ask("write past", () -> { out.write(buffer, 99, 2); return "written"; });
              sout.write(new byte[] { (byte) 0xff, (byte) 0x80, 0, 0x7f });
              sout.write(0x141);
              ask("octets", () -> in.read() + " " + in.read() + " " + in.read() + " " + in.read() + " " + in.read());
              sout.write("abcdef".getBytes(StandardCharsets.UTF_8));
              ask("one of six", in::read);
              ask("five there", () -> {
                  long deadline = System.currentTimeMillis() + 60000;
                  while (in.available() < 5 && System.currentTimeMillis() < deadline) {
                      Thread.sleep(1);
                  }
                  return in.available();
              });
              ask("skip 2", () -> in.skip(2));
              ask("skip none", () -> in.skip(-1));
              ask("rest", () -> {
                  int n = in.read(buffer);
                  return n + " " + new String(buffer, 0, n, StandardCharsets.UTF_8);
              });
              PrintWriter writer = new PrintWriter(sout, true);
              writer.println("one line");
              writer.println("two");
              BufferedReader reader = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8));
              ask("lines", () -> reader.readLine() + " | " + reader.readLine());
              DataOutputStream data = new DataOutputStream(out);
              data.writeInt(123456789);
              data.writeUTF("héllo");
              DataInputStream read = new DataInputStream(sin);
              ask("data", () -> read.readInt() + " " + read.readUTF());
              served.close();
              ask("end", () -> in.read() + " " + in.read(buffer, 0, 5) + " " + in.available());
              client.close();
              ask("end after close", () -> in.read() + " " + in.read(buffer, 0, 5) + " " + in.skip(3));
              ask("available after close", in::available);
              ask("write after close", () -> { out.write(1); return "written"; });
              ask("flush after close", () -> { out.flush(); return "flushed"; });
              ask("closed", () -> client + " " + client.isConnected() + " " + client.getLocalAddress() + " "
                      + client.getLocalSocketAddress() + " " + client.getRemoteSocketAddress(), port, local);
              Socket other = new Socket("127.0.0.1", port);
              Socket otherServed = server.accept();
              InputStream otherIn = other.getInputStream();
              otherServed.getOutputStream().write(new byte[] { 1, 2, 3 });
              ask("one of three", otherIn::read);
              other.close();
              ask("bytes left after close", otherIn::read);
              Socket third = new Socket(InetAddress.getByName("127.0.0.1"), port);
              Socket thirdServed = server.accept();
              third.getInputStream().close();
              ask("its stream closes it", () -> third.isClosed() + " " + thirdServed.getInputStream().read());
              otherServed.close();
              thirdServed.close();
              server.close();
          }

          static void deadline() throws Exception {
              System.out.println("== a-read-past-its-deadline-and-after-it");
              ServerSocket server = loopback();
              Socket client = new Socket("127.0.0.1", server.getLocalPort());
              Socket served = server.accept();
              InputStream in = client.getInputStream();
              client.setSoTimeout(50);
              ask("timed", in::read);
              ask("timed array", () -> in.read(new byte[4]));
              ask("open", client::isClosed);
              served.getOutputStream().write(7);
              ask("after it", in::read);
              ask("what it is", () -> {
                  try {
                      in.read();
                      return "read";
                  }
                  catch (SocketTimeoutException e) {
                      InterruptedIOException interrupted = e;
                      return interrupted.bytesTransferred + " " + e.getMessage() + " " + (e instanceof IOException);
                  }
              });
              client.setSoTimeout(0);
              ask("cleared", client::getSoTimeout);
              client.close();
              served.close();
              server.close();
          }

          // what failed, by its class alone: the words of some failures are the host's
          static void kind(String what, Asked asked) {
              try {
                  System.out.println(what + ": " + asked.run());
              }
              catch (Exception e) {
                  System.out.println(what + ": " + e.getClass().getName());
              }
          }

          static void bound() throws Exception {
              System.out.println("== a-socket-bound-before-it-connects");
              ServerSocket server = loopback();
              int port = server.getLocalPort();
              Socket s = new Socket();
              s.bind(new InetSocketAddress("127.0.0.1", 0));
              int local = s.getLocalPort();
              ask("bound", () -> s + " " + s.isBound() + " " + s.isConnected() + " " + s.getLocalAddress() + " "
                      + s.getLocalSocketAddress() + " " + s.getInetAddress() + " " + (local > 0), local);
              ask("bind again", () -> { s.bind(null); return "bound"; });
              s.connect(new InetSocketAddress("127.0.0.1", port));
              Socket served = server.accept();
              ask("connected from it", () -> (s.getLocalPort() == local) + " " + (served.getPort() == local) + " " + s,
                      port, local);
              s.close();
              served.close();
              ask("closed", () -> s.isBound() + " " + s.getLocalSocketAddress(), local);
              Socket wild = new Socket();
              wild.bind(null);
              int wildPort = wild.getLocalPort();
              ask("every interface", () -> wild.getLocalAddress() + " " + wild.getLocalSocketAddress() + " "
                      + (wildPort > 0), wildPort);
              wild.connect(new InetSocketAddress("127.0.0.1", port));
              Socket wildServed = server.accept();
              ask("its address once connected", () -> wild.getLocalAddress() + " " + (wild.getLocalPort() == wildPort)
                      + " " + (wildServed.getPort() == wildPort));
              wild.close();
              wildServed.close();
              Socket taken = new Socket();
              ask("in use", () -> { taken.bind(new InetSocketAddress("127.0.0.1", port)); return "bound"; });
              ask("left open and unbound", () -> taken.isClosed() + " " + taken.isBound() + " " + taken.getLocalPort());
              kind("an address no interface has", () -> { taken.bind(new InetSocketAddress("192.0.2.1", 0)); return "bound"; });
              ask("bound after", () -> { taken.bind(new InetSocketAddress("localhost", 0)); return taken.getLocalAddress(); });
              taken.close();
              ask("a local port in use", () -> new Socket("127.0.0.1", port, InetAddress.getByName("127.0.0.1"), port));
              Socket from = new Socket(InetAddress.getByName("127.0.0.1"), port, InetAddress.getByName("127.0.0.1"), 0);
              Socket fromServed = server.accept();
              ask("from a local address", () -> from.isConnected() + " " + from.getLocalAddress() + " "
                      + (fromServed.getPort() == from.getLocalPort()));
              from.close();
              fromServed.close();
              server.close();
          }

          static void limited() throws Exception {
              System.out.println("== a-connect-within-a-time-limit");
              Socket late = new Socket();
              ask("past it", () -> { late.connect(HELD, 200); return "connected"; });
              ask("closed by it", () -> late.isClosed() + " " + late.isConnected() + " " + late.isBound() + " " + late);
              ask("what it is", () -> {
                  Socket again = new Socket();
                  try {
                      again.connect(HELD, 50);
                      return "connected";
                  }
                  catch (SocketTimeoutException e) {
                      InterruptedIOException interrupted = e;
                      return interrupted.bytesTransferred + " " + e.getMessage() + " " + again.isClosed();
                  }
              });
              Socket bound = new Socket();
              bound.bind(new InetSocketAddress("127.0.0.1", 0));
              int local = bound.getLocalPort();
              ask("bound past it", () -> { bound.connect(HELD, 50); return "connected"; });
              ask("its port kept", () -> bound.isBound() + " " + bound.isClosed() + " " + (bound.getLocalPort() == local)
                      + " " + bound.getLocalSocketAddress(), local);
              ServerSocket server = loopback();
              Socket within = new Socket();
              within.connect(server.getLocalSocketAddress(), 5000);
              Socket served = server.accept();
              ask("within it", () -> within.isConnected() + " " + within.getSoTimeout() + " "
                      + (served.getPort() == within.getLocalPort()));
              within.close();
              served.close();
              Socket longest = new Socket();
              longest.connect(new InetSocketAddress("127.0.0.1", server.getLocalPort()), Integer.MAX_VALUE);
              server.accept().close();
              longest.setSoTimeout(Integer.MAX_VALUE);
              ask("the longest", () -> longest.isConnected() + " " + longest.getSoTimeout());
              longest.close();
              server.close();
          }

          static void halves() throws Exception {
              System.out.println("== half-a-connection-ended");
              ServerSocket server = loopback();
              Socket client = new Socket("127.0.0.1", server.getLocalPort());
              Socket served = server.accept();
              OutputStream out = client.getOutputStream();
              InputStream in = client.getInputStream();
              InputStream sin = served.getInputStream();
              out.write(new byte[] { 1, 2, 3 });
              client.shutdownOutput();
              ask("output ended", () -> client.isOutputShutdown() + " " + client.isInputShutdown() + " "
                      + client.isClosed() + " " + client.isConnected());
              ask("the peer reads what came and the end", () -> sin.read() + " " + sin.read() + " " + sin.read() + " "
                      + sin.read() + " " + sin.read());
              ask("output again", () -> { client.shutdownOutput(); return "shut"; });
              ask("its output stream", client::getOutputStream);
              ask("a write after it", () -> { out.write(9); return "written"; });
              ask("an array after it", () -> { out.write(new byte[] { 9, 9 }); return "written"; });
              ask("a flush after it", () -> { out.flush(); return "flushed"; });
              OutputStream sout = served.getOutputStream();
              sout.write(new byte[] { 7, 8 });
              ask("the other half carries on", () -> in.read() + " " + in.read());
              sout.write(new byte[] { 4, 5 });
              ask("come before the input ends", () -> {
                  long deadline = System.currentTimeMillis() + 60000;
                  while (in.available() < 2 && System.currentTimeMillis() < deadline) {
                      Thread.sleep(1);
                  }
                  return in.available();
              });
              client.shutdownInput();
              ask("input ended", () -> client.isInputShutdown() + " " + in.available() + " " + in.read() + " "
                      + in.read(new byte[4]) + " " + in.skip(3) + " " + in.read(new byte[4], 0, 0));
              ask("input again", () -> { client.shutdownInput(); return "shut"; });
              ask("its input stream", client::getInputStream);
              client.close();
              ask("closed", () -> client.isInputShutdown() + " " + client.isOutputShutdown() + " " + in.read());
              ask("closed output", () -> { client.shutdownOutput(); return "shut"; });
              ask("closed input", () -> { client.shutdownInput(); return "shut"; });
              Socket unconnected = new Socket();
              ask("unconnected input", () -> { unconnected.shutdownInput(); return "shut"; });
              ask("unconnected output", () -> { unconnected.shutdownOutput(); return "shut"; });
              served.close();
              Socket other = new Socket("127.0.0.1", server.getLocalPort());
              Socket otherServed = server.accept();
              InputStream otherIn = other.getInputStream();
              other.shutdownInput();
              other.close();
              ask("closed before the end was read", otherIn::read);
              otherServed.close();
              server.close();
          }

          static void acceptDeadline() throws Exception {
              System.out.println("== an-accept-past-its-deadline");
              ServerSocket server = loopback();
              ask("none", server::getSoTimeout);
              ask("less than none", () -> { server.setSoTimeout(-1); return "set"; });
              server.setSoTimeout(100);
              ask("set", server::getSoTimeout);
              ask("past it", server::accept);
              ask("what it is", () -> {
                  try {
                      server.accept();
                      return "accepted";
                  }
                  catch (SocketTimeoutException e) {
                      InterruptedIOException interrupted = e;
                      return interrupted.bytesTransferred + " " + e.getMessage() + " " + server.isClosed();
                  }
              });
              Socket client = new Socket("127.0.0.1", server.getLocalPort());
              Socket served = server.accept();
              ask("a connection within it", () -> (served.getPort() == client.getLocalPort()) + " "
                      + served.getSoTimeout());
              client.close();
              served.close();
              ServerSocket later = new ServerSocket();
              later.setSoTimeout(50);
              later.bind(new InetSocketAddress("127.0.0.1", 0));
              ask("set before the bind", later::accept);
              later.close();
              server.close();
              ask("closed", server::getSoTimeout);
              ask("closed set", () -> { server.setSoTimeout(-1); return "set"; });
          }

          public static void main(String[] args) throws Exception {
              unconnected();
              listener();
              carried();
              deadline();
              bound();
              limited();
              halves();
              acceptDeadline();
          }
      }
