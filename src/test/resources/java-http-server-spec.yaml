    requests:
      - name: a-body-of-a-length-told
        request: GET /hello
        show: [content-type]
        expected: |
          200
          content-type: text/plain; charset=utf-8
          hello
      - name: the-longest-context-a-path-starts-with
        request: GET /a/b/c?q=1
        expected: |
          200
          context /a/b uri /a/b/c?q=1
      - name: a-context-is-a-prefix-of-the-path-not-a-segment
        request: GET /ab
        expected: |
          200
          context /a uri /ab
      - name: a-context-is-found-by-the-decoded-path
        request: GET /a%2Fb
        expected: |
          200
          context /a/b uri /a%2Fb
      - name: a-path-of-no-context
        request: GET /nowhere
        show: [content-type]
        expected: |
          404
          content-type: text/html
          <h1>404 Not Found</h1>No context found for request
      - name: a-context-removed
        request: GET /gone
        expected: |
          404
          <h1>404 Not Found</h1>No context found for request
      - name: a-context-with-no-handler
        request: GET /unhandled
        expected: |
          500
          <h1>500 Internal Server Error</h1>No handler for context
      - name: the-request-as-a-handler-reads-it-and-fields-both-ways
        request: POST /request/x%20y?q=a%20b&r=%C3%A9
        headers: {X-Probe: p1, Content-Type: text/plain}
        body: "héllo"
        show: [x-multi, x-single, content-type]
        expected: |
          201
          x-multi: one
          x-multi: two
          x-single: new
          content-type: text/plain; charset=utf-8
          method POST
          uri /request/x%20y?q=a%20b&r=%C3%A9
          path /request/x y raw /request/x%20y
          query q=a b&r=é raw q=a%20b&r=%C3%A9
          protocol HTTP/1.1
          code -1
          length java.lang.IllegalArgumentException: Content-Length: -2
          field [p1] p1 true true
          no field null null
          type text/plain
          fixed java.lang.UnsupportedOperationException: unsupported operation
          body 104 éllo -1 0
          answered [one, two] new true
      - name: octets-both-ways
        request: POST /echo
        hex: fffe4100807f
        show: [content-type]
        expected: |
          200
          content-type: application/octet-stream
          fffe4100807f
      - name: no-body-either-way
        request: GET /echo
        expected: |
          200
      - name: a-status-with-no-body
        request: GET /nothing
        show: [x-nothing]
        expected: |
          204
          x-nothing: here
      - name: a-body-in-chunks
        request: GET /chunked
        show: [x-early]
        expected: |
          200
          x-early: java.io.IOException: response headers not sent yet
          first-second
      - name: a-head-request
        request: HEAD /hello
        show: [content-type]
        expected: |
          200
          content-type: text/plain; charset=utf-8
      - name: a-handler-runs-on-a-thread-of-the-executor
        request: GET /thread
        expected: |
          200
          the thread main ran on false, the executor's true
      - name: a-handler-waits-for-a-thread-that-answers
        request: GET /worker
        expected: |
          200
          answered by worker
      - name: the-two-ends-of-the-connection
        request: GET /peer
        skip:
          component: wasi:http tells a handler neither the peer nor the port it is served on
        expected: |
          200
          127.0.0.1 true 127.0.0.1 true
      # /stream writes "first|", then asks the origin whether the test has read it yet
      # and writes the answer: "seen" only where a chunk is on its way when its write
      # returns. The origin waits for the test's reader, briefly on a leg said to
      # deviate.
      - name: a-chunk-is-on-its-way-when-its-write-returns
        request: GET /stream
        first: "first|"
        expected: |
          200
          first|seen
        deviates:
          interpreter: |
            200
            first|unseen
          jvm: |
            200
            first|unseen
          native: |
            200
            first|unseen
      - name: handlers-at-once-under-an-executor
        request: GET /count
        times: 16
        expected: |
          200
          counted
      - name: what-the-handlers-counted-under-one-lock
        request: GET /counted
        skip:
          component: the host starts an instance for the requests it likes, and each counts its own
        expected: |
          200
          count 32000 within the pool's bound true
      - name: filters-around-a-handler-in-their-order
        request: GET /filtered
        headers: {X-Probe: p1}
        show: [x-trail]
        expected: |
          200
          x-trail: a
          x-trail: b
          trail [a in, before, b in, handler] attribute yes added [one, two] probe [p1] fixed java.lang.UnsupportedOperationException: unsupported operation
      - name: a-filter-that-answers-itself
        request: GET /blocked
        expected: |
          403
          stopped by the filter
      - name: a-filter-that-runs-its-chain
        request: GET /blocked?through
        expected: |
          200
          reached
      - name: a-handler-of-a-response-told-ahead
        request: POST /canned
        body: "abc"
        show: [x-canned, x-late]
        expected: |
          203
          x-canned: yes
          canned héllo
      - name: a-handler-by-a-test-of-the-request
        request: GET /either
        expected: |
          200
          a get
      - name: the-other-handler
        request: POST /either
        body: "x"
        show: [allow]
        expected: |
          405
          allow: GET
      - name: no-credentials-are-asked-for
        request: GET /basic
        show: [www-authenticate]
        expected: |
          401
          www-authenticate: Basic realm="the realm", charset="UTF-8"
      - name: credentials-a-colon-in-the-password
        request: GET /basic
        headers: {Authorization: "basic dXNlcjpwYXNzOndvcmQ"}
        expected: |
          200
          principal the realm:user name the realm:user user user realm the realm equal true false true
      - name: credentials-refused-are-asked-for-again
        request: GET /basic
        headers: {Authorization: "Basic dXNlcjo="}
        show: [www-authenticate]
        expected: |
          401
          www-authenticate: Basic realm="the realm", charset="UTF-8"
      - name: another-scheme-is-refused
        request: GET /basic
        headers: {Authorization: "Bearer abc"}
        show: [www-authenticate]
        expected: |
          401
      - name: credentials-in-another-charset
        request: GET /latin
        headers: {Authorization: "Basic /HNlcjpw5HNz"}
        expected: |
          200
          principal a\"b:üser
      - name: a-realm-as-it-is-quoted
        request: GET /latin
        show: [www-authenticate]
        expected: |
          401
          www-authenticate: Basic realm="a\"b"
      - name: an-authenticator-after-the-filters
        request: GET /custom
        show: [x-ahead]
        expected: |
          200
          x-ahead: the filter saw null
          principal where:who
      - name: an-authenticator-that-refuses
        request: GET /custom?fail
        show: [x-ahead]
        expected: |
          403
          x-ahead: the filter saw null
      - name: an-authenticator-that-asks-again
        request: GET /custom?retry
        show: [x-retry]
        expected: |
          407
          x-retry: again
      - name: no-authenticator-no-principal
        request: GET /anonymous
        expected: |
          200
          principal null
      - name: a-body-cut-short
        request: POST /short
        unanswered: 3
        expected: |
          (no response)
        deviates:
          interpreter: "500"
          jvm: "500"
          native: "500"
          component: "500"
      - name: a-handler-that-throws
        request: POST /throws
        expected: |
          (no response)
        deviates:
          interpreter: "500"
          jvm: "500"
          native: "500"
          component: "500"
      - name: a-handler-that-answers-nothing
        request: POST /silent
        unanswered: 3
        expected: |
          (no response)
        deviates:
          interpreter: "500"
          jvm: "500"
          native: "500"
          component: "500"
      - name: a-stop-by-a-handler-answers-the-request-in-hand
        request: GET /stop
        expected: |
          200
          bye
  # examples/java/httpbin: the five echo endpoints, a wrong method and a path of
  # none. The fields the client and the transports add on their own are left out --
  # Host, which wasi:http does not hand a handler, and the client's User-Agent -- so
  # the field before them keeps its comma.
  - name: httpbin
    file: httpbin/Httpbin.java
    example: java/httpbin/Httpbin.java
    endless: true
    listening: "^Listening on http://localhost:(\\d+)/$"
    unshown: ['^    "Host": ', '^    "User-agent": ']
    requests:
      - name: get-with-a-query
        request: GET /get?b=two&a=1&a=x%20y&c+d=%C3%A9&empty=&flag
        headers: {X-Probe: "one, two"}
        show: [content-type]
        expected: |
          200
          content-type: application/json
          {
            "args": {
              "a": ["1", "x y"],
              "b": "two",
              "c d": "é",
              "empty": "",
              "flag": ""
            },
            "headers": {
              "Content-length": "0",
              "X-probe": "one, two"
            },
            "method": "GET",
            "path": "/get"
          }
      - name: json-comes-back-as-it-came
        request: POST /post
        headers: {Content-Type: application/json}
        body: '{"name": "rontolisp", "n": 1.50e3, "s": "\u00e9\n"}'
        expected: |
          200
          {
            "args": {},
            "data": "{\"name\": \"rontolisp\", \"n\": 1.50e3, \"s\": \"\\u00e9\\n\"}",
            "headers": {
              "Content-length": "51",
              "Content-type": "application/json",
            },
            "json": {"name": "rontolisp", "n": 1.50e3, "s": "\u00e9\n"},
            "method": "POST",
            "path": "/post"
          }
      - name: a-body-that-is-no-json
        request: PUT /put?q=1
        headers: {Content-Type: "text/plain; charset=utf-8"}
        body: "h\u00e9llo \"q\" \\ \t{"
        expected: |
          200
          {
            "args": {
              "q": "1"
            },
            "data": "héllo \"q\" \\ \t{",
            "headers": {
              "Content-length": "15",
              "Content-type": "text/plain; charset=utf-8",
            },
            "json": null,
            "method": "PUT",
            "path": "/put"
          }
      - name: json-over-lines-between-blanks
        request: PATCH /patch
        body: "\n  [1, -0.5e-3,\n   {\"a\": [true, false, null], \"\": {}}]\n"
        expected: |
          200
          {
            "args": {},
            "data": "\n  [1, -0.5e-3,\n   {\"a\": [true, false, null], \"\": {}}]\n",
            "headers": {
              "Content-length": "55",
            },
            "json": [1, -0.5e-3,
             {"a": [true, false, null], "": {}}],
            "method": "PATCH",
            "path": "/patch"
          }
      - name: no-body
        request: DELETE /delete
        expected: |
          200
          {
            "args": {},
            "data": "",
            "headers": {
              "Content-length": "0",
            },
            "json": null,
            "method": "DELETE",
            "path": "/delete"
          }
      - name: a-wrong-method
        request: GET /post
        show: [allow, content-type]
        expected: |
          405
          allow: POST
          content-type: application/json
          {
            "allowed": "POST",
            "error": "method not allowed"
          }
      - name: a-path-of-no-endpoint
        request: POST /get/more
        expected: |
          404
          {
            "error": "not found",
            "path": "/get/more"
          }
