      # a Worker's socket ends with the request that opened it
      - name: and-used-by-the-next-request
        request: GET /kept
        skip:
          component: the host starts an instance for the requests it likes, and each keeps its own
        expected: |
          200
          kept again
        deviates:
          reactor: |
            200
            java.net.SocketException: Socket closed: the request that opened it has ended
      # the host of a reactor only connects
      - name: a-listener
        request: GET /listen
        expected: |
          200
          listening true
        deviates:
          reactor: |
            200
            java.net.BindException: the host of a --no-wasi module only connects (--host-sockets)
