    sourceDep: [jakarta.servlet:jakarta.servlet-api:6.1.0]
    skip:
      native: a native executable imports no WIT interface, and the program is refused at its WIT line
    keyvalue: true
    source: |
      import java.io.IOException;
      import java.io.PrintWriter;
      import java.net.InetSocketAddress;
      import java.util.ArrayList;
      import java.util.Arrays;
      import java.util.Collections;
      import java.util.LinkedHashMap;
      import java.util.LinkedHashSet;
      import java.util.List;
      import java.util.Map;

      import am.ik.servlet.httpserver.ServletHttpServer;
      import jakarta.servlet.http.HttpServlet;
      import jakarta.servlet.http.HttpServletRequest;
      import jakarta.servlet.http.HttpServletResponse;
      import jakarta.servlet.http.HttpSession;

      // Sessions in wasi:keyvalue: servlet-httpserver-keyvalue on the source path is the
      // store the server finds; the program names none.
      public class KeyValueSessions {

          static class Session extends HttpServlet {

              @Override
              protected void doGet(HttpServletRequest request, HttpServletResponse response) throws IOException {
                  response.setContentType("text/plain;charset=UTF-8");
                  PrintWriter out = response.getWriter();
                  String asked = request.getPathInfo();
                  if (asked.equals("/invalidate")) {
                      request.getSession().invalidate();
                      out.println("invalidated");
                      return;
                  }
                  HttpSession session = request.getSession();
                  if (asked.equals("/count")) {
                      Integer n = (Integer) session.getAttribute("n");
                      session.setAttribute("n", n == null ? 1 : n + 1);
                      out.println("n " + session.getAttribute("n") + " new " + session.isNew());
                  }
                  else if (asked.equals("/set")) {
                      List<Object> list = new ArrayList<>(Arrays.asList("x", null, 2));
                      Map<Object, Object> map = new LinkedHashMap<>();
                      map.put("k", List.of(1L, 2.5));
                      map.put(7, "v");
                      session.setAttribute("text", "é ü 😀");
                      session.setAttribute("yes", true);
                      session.setAttribute("char", 'q');
                      session.setAttribute("byte", (byte) -56);
                      session.setAttribute("short", (short) 300);
                      session.setAttribute("long", 1L << 40);
                      session.setAttribute("float", 1.5f);
                      session.setAttribute("double", -0.25);
                      session.setAttribute("octets", new byte[] { 0, -1, 127 });
                      session.setAttribute("list", list);
                      session.setAttribute("set", new LinkedHashSet<>(List.of("b", "a")));
                      session.setAttribute("map", map);
                      out.println("set");
                  }
                  else if (asked.equals("/get")) {
                      List<String> names = Collections.list(session.getAttributeNames());
                      Collections.sort(names);
                      for (String name : names) {
                          Object value = session.getAttribute(name);
                          out.println(name + " " + value.getClass().getSimpleName() + " "
                                  + (value instanceof byte[] ? Arrays.toString((byte[]) value) : value));
                      }
                  }
                  else if (asked.equals("/refused")) {
                      try {
                          session.setAttribute("n", new Object());
                      }
                      catch (IllegalArgumentException ex) {
                          out.println(ex.getMessage());
                      }
                      out.println("n " + session.getAttribute("n"));
                  }
              }

          }

          public static void main(String[] args) throws Exception {
              ServletHttpServer server = ServletHttpServer.builder()
                  .address(new InetSocketAddress("127.0.0.1", @PORT@))
                  .servlet("session", new Session(), servlet -> servlet.urlPatterns("/session/*"))
                  .start();
              System.out.println("listening " + server.port());
          }

      }
    requests:
      - name: a-session-is-made
        request: GET /session/count
        expected: |
