        expected: |
          200
          n 1 new true
  # A handler's own sockets, to the test's peer: a connection made, written to and read
  # in one request -- a JDBC connection's shape -- on every leg; under a host that calls
  # the program for each request (the reactor: a Cloudflare Worker's connect()) a socket
  # is waited for suspended in the host, only connects, and ends with its request.
  - name: peers
    file: Peers.java
    endless: true
    tcp: true
    source: |
      import com.sun.net.httpserver.HttpExchange;
      import com.sun.net.httpserver.HttpServer;
      import java.io.DataInputStream;
      import java.io.IOException;
      import java.io.InputStream;
      import java.io.OutputStream;
      import java.net.InetAddress;
      import java.net.InetSocketAddress;
      import java.net.ServerSocket;
      import java.net.Socket;
      import java.net.SocketTimeoutException;
      import java.nio.charset.StandardCharsets;

      public class Peers {

          static final int PEER = Integer.parseInt("@PEER@");

          // a listener whose queue is full: a connect to it waits
          static final int HELD = Integer.parseInt("@HELD@");

          static Socket kept;

          interface Asked {
              String run() throws Exception;
          }

          static void answer(HttpExchange exchange, Asked asked) throws IOException {
              String said;
              try {
                  said = asked.run();
              }
              catch (Exception e) {
                  said = e.toString();
              }
              byte[] body = said.getBytes(StandardCharsets.UTF_8);
              exchange.sendResponseHeaders(200, body.length);
              try (OutputStream out = exchange.getResponseBody()) {
                  out.write(body);
              }
          }

          static Socket peer() throws IOException {
              return new Socket("127.0.0.1", PEER);
          }

          static void say(Socket socket, String line) throws IOException {
              socket.getOutputStream().write((line + "\n").getBytes(StandardCharsets.UTF_8));
          }

          // the next line, an octet at a time: nothing past it is taken
          static String line(Socket socket) throws IOException {
              InputStream in = socket.getInputStream();
              byte[] octets = new byte[256];
              int count = 0;
              int octet;
              while ((octet = in.read()) >= 0 && octet != '\n') {
                  octets[count++] = (byte) octet;
              }
              return octet < 0 && count == 0 ? null : new String(octets, 0, count, StandardCharsets.UTF_8);
          }

          public static void main(String[] args) throws IOException {
              HttpServer server = HttpServer.create(new InetSocketAddress("127.0.0.1", @PORT@), 0);
              server.createContext("/echo", exchange -> answer(exchange, () -> {
                  try (Socket socket = peer()) {
                      say(socket, "echo héllo");
                      return line(socket) + " " + socket.isConnected() + " " + (socket.getPort() == PEER) + " "
                              + socket.getInetAddress();
                  }
              }));
              server.createContext("/octets", exchange -> answer(exchange, () -> {
                  try (Socket socket = peer()) {
                      say(socket, "octets");
                      byte[] all = new byte[256];
                      new DataInputStream(socket.getInputStream()).readFully(all);
                      int sum = 0;
                      for (byte octet : all) {
                          sum += octet & 0xff;
                      }
                      return all.length + " " + sum + " " + all[0] + " " + all[128] + " " + all[255];
                  }
              }));
              // more than a read takes at once, to the peer's end
              server.createContext("/big", exchange -> answer(exchange, () -> {
                  try (Socket socket = peer()) {
                      say(socket, "big 300000");
                      InputStream in = socket.getInputStream();
                      byte[] some = new byte[8192];
                      long total = 0;
                      long sum = 0;
                      int count;
                      while ((count = in.read(some)) > 0) {
                          total += count;
                          for (int i = 0; i < count; i++) {
                              sum += some[i] & 0xff;
                          }
                      }
                      return total + " " + sum + " " + in.read();
                  }
              }));
              // a read past its deadline, after which the socket reads on
              server.createContext("/deadline", exchange -> answer(exchange, () -> {
                  try (Socket socket = peer()) {
                      socket.setSoTimeout(200);
                      say(socket, "quiet");
                      try {
                          return "read " + line(socket);
                      }
                      catch (SocketTimeoutException e) {
                          socket.setSoTimeout(0);
                          say(socket, "echo after");
                          return e + " then " + line(socket);
                      }
                  }
              }));
              // a reply that comes within the deadline
              server.createContext("/later", exchange -> answer(exchange, () -> {
                  try (Socket socket = peer()) {
                      socket.setSoTimeout(30000);
                      say(socket, "later 100");
                      return line(socket);
                  }
              }));
              // one thread reads what another writes for
              server.createContext("/threads", exchange -> answer(exchange, () -> {
                  try (Socket socket = peer()) {
                      String[] read = new String[1];
                      Thread reader = new Thread(() -> {
                          try {
                              read[0] = line(socket);
                          }
                          catch (IOException e) {
                              read[0] = e.toString();
                          }
                      });
                      reader.start();
                      Thread.yield();
                      say(socket, "echo from the writer");
                      reader.join();
                      return read[0];
                  }
              }));
              server.createContext("/half", exchange -> answer(exchange, () -> {
                  try (Socket socket = peer()) {
                      say(socket, "echo one");
                      socket.shutdownOutput();
                      return line(socket) + " " + line(socket) + " " + socket.isOutputShutdown();
                  }
              }));
              server.createContext("/refused", exchange -> answer(exchange, () -> {
                  try (Socket socket = new Socket("127.0.0.1", 0)) {
                      return "connected";
                  }
                  catch (IOException e) {
                      return "an IOException";
                  }
              }));
              server.createContext("/limit", exchange -> answer(exchange, () -> {
                  Socket socket = new Socket();
                  try {
                      socket.connect(new InetSocketAddress("127.0.0.1", HELD), 300);
                      return "connected";
                  }
                  catch (IOException e) {
                      return e + " " + socket.isClosed();
                  }
              }));
              // a socket one request made, used by the next
              server.createContext("/kept", exchange -> answer(exchange, () -> {
                  if (kept == null) {
                      kept = peer();
                      say(kept, "echo first");
                      return "made " + line(kept);
                  }
                  try {
                      say(kept, "echo again");
                      return "kept " + line(kept);
                  }
                  finally {
                      kept.close();
                      kept = null;
                  }
              }));
              server.createContext("/listen", exchange -> answer(exchange, () -> {
                  try (ServerSocket listener = new ServerSocket(0, 50, InetAddress.getByName("127.0.0.1"))) {
                      return "listening " + listener.isBound();
                  }
              }));
              server.start();
              System.out.println("listening " + server.getAddress().getPort());
          }

      }
    requests:
      - name: a-line-written-and-its-reply-read
        request: GET /echo
        expected: |
