  # A Servlet application on the container of servlet-httpserver/ (.kb/servlet-httpserver.md),
  # read as source with the API's sources jar: the JDK leg runs the container javac
  # compiled. Its builder registers the listeners, a filter on every path and a servlet
  # that are lambdas, servlets mapped by an exact path, a
  # prefix and an extension; a form, a forward and an include, the 405 page of the API's
  # message bundle, OPTIONS (which asks the servlet's class the methods it declares), the
  # error page of an exception, a response committed by its buffer, a request's cookies
  # and a cookie of the response, and the parts of a multipart body, kept in memory where there is no java.io.tmpdir. The files of
  # servlet-resources/ under META-INF/resources are the application's resources, which the
  # default servlet serves: on the JDK leg of a directory of the class path, on the others
  # compiled into the program. A query's parameter and sendError's message are the
  # guestbook's, below.
  - name: servlet
    file: Servlets.java
    hostTimer: true
    sourcePath: [servlet-httpserver/src/main/java, src/test/resources/servlet-resources]
    sourceDep: [jakarta.servlet:jakarta.servlet-api:6.1.0]
    unshown: ['^Host: ', '^User-agent: ']
    source: |
      import java.io.IOException;
      import java.io.InputStream;
      import java.io.PrintWriter;
      import java.io.UncheckedIOException;
      import java.net.InetSocketAddress;
      import java.nio.charset.StandardCharsets;
      import java.time.Duration;
      import java.util.Collections;
      import java.util.concurrent.ArrayBlockingQueue;
      import java.util.concurrent.BlockingQueue;
      import java.util.concurrent.CountDownLatch;
      import java.util.concurrent.TimeUnit;

      import am.ik.servlet.httpserver.ServletHttpServer;
      import jakarta.servlet.AsyncContext;
      import jakarta.servlet.AsyncEvent;
      import jakarta.servlet.AsyncListener;
      import jakarta.servlet.DispatcherType;
      import jakarta.servlet.MultipartConfigElement;
      import jakarta.servlet.ReadListener;
      import jakarta.servlet.RequestDispatcher;
      import jakarta.servlet.ServletContext;
      import jakarta.servlet.ServletContextEvent;
      import jakarta.servlet.ServletContextListener;
      import jakarta.servlet.ServletException;
      import jakarta.servlet.ServletInputStream;
      import jakarta.servlet.http.Cookie;
      import jakarta.servlet.http.HttpServlet;
      import jakarta.servlet.http.HttpServletRequest;
      import jakarta.servlet.http.HttpServletResponse;
      import jakarta.servlet.http.HttpSession;
      import jakarta.servlet.http.HttpSessionEvent;
      import jakarta.servlet.http.HttpSessionListener;
      import jakarta.servlet.http.Part;

      public class Servlets {

          static final CountDownLatch STOPPED = new CountDownLatch(1);

          // not log: a servlet's simple name log is GenericServlet.log, the context's
          static synchronized void note(String line) {
              System.out.println("| " + line);
          }

          static class Hello extends HttpServlet {

              @Override
              public void init() {
                  note("init " + getServletName());
              }

              @Override
              protected void doGet(HttpServletRequest request, HttpServletResponse response) throws IOException {
                  String name = request.getParameter("name");
                  response.setContentType("text/plain");
                  response.getWriter().println("Hello, " + (name == null ? "world" : name) + "!");
              }

              @Override
              protected void doPost(HttpServletRequest request, HttpServletResponse response) throws IOException {
                  response.setContentType("text/plain;charset=UTF-8");
                  PrintWriter out = response.getWriter();
                  for (String name : Collections.list(request.getParameterNames())) {
                      out.println(name + " = " + String.join(", ", request.getParameterValues(name)));
                  }
              }

              @Override
              public void destroy() {
                  note("destroy " + getServletName());
              }

          }

          static class Show extends HttpServlet {

              @Override
              protected void doGet(HttpServletRequest request, HttpServletResponse response) throws IOException {
                  response.setContentType("text/plain");
                  PrintWriter out = response.getWriter();
                  out.println(request.getMethod() + " " + request.getRequestURI() + " query " + request.getQueryString());
                  out.println("context " + request.getContextPath() + " servlet " + request.getServletPath() + " info "
                          + request.getPathInfo());
                  out.println("custom " + request.getHeader("X-Custom") + " filtered " + request.getAttribute("filtered"));
                  out.println("mapping " + request.getHttpServletMapping().getMappingMatch() + " "
                          + request.getHttpServletMapping().getPattern());
              }

          }

          static class Dispatch extends HttpServlet {

              @Override
              protected void doGet(HttpServletRequest request, HttpServletResponse response)
                      throws IOException, ServletException {
                  if (request.getPathInfo().equals("/forward")) {
                      request.getRequestDispatcher("/hello?name=forwarded").forward(request, response);
                      return;
                  }
                  response.setContentType("text/plain");
                  PrintWriter out = response.getWriter();
                  out.println("before");
                  request.getRequestDispatcher("/hello?name=included").include(request, response);
                  out.println("after");
              }

          }

          static class Answers extends HttpServlet {

              @Override
              protected void doGet(HttpServletRequest request, HttpServletResponse response)
                      throws IOException, ServletException {
                  switch (request.getPathInfo()) {
                      case "/redirect" -> response.sendRedirect("../hello?name=redirected");
                      case "/thrown" -> throw new ServletException("no answer");
                      // the error pages the server is given answer these two
                      case "/gone" -> response.sendError(HttpServletResponse.SC_GONE, "gone away");
                      case "/refused" -> throw new IllegalStateException("refused");
                      case "/committed" -> {
                          response.setBufferSize(16);
                          response.setContentType("text/plain");
                          PrintWriter out = response.getWriter();
                          out.print("a line longer than the buffer\n");
                          out.println("committed " + response.isCommitted());
                      }
                      // the request's cookies, and one sent back, a copy of it changed
                      case "/cookies" -> {
                          Cookie seen = new Cookie("seen", "yes");
                          seen.setPath("/app/answers/cookies");
                          seen.setHttpOnly(true);
                          Cookie copy = (Cookie) seen.clone();
                          copy.setValue("copied");
                          copy.setAttribute("SameSite", "Strict");
                          response.addCookie(seen);
                          response.setContentType("text/plain");
                          PrintWriter out = response.getWriter();
                          for (Cookie cookie : request.getCookies()) {
                              out.println(cookie.getName() + "=" + cookie.getValue());
                          }
                          out.println(seen.getValue() + " " + copy.getValue() + " " + seen.getAttribute("SameSite") + " "
                                  + copy.isHttpOnly());
                          // and its languages, the preferred first
                          StringBuilder languages = new StringBuilder(request.getLocale().toString());
                          for (java.util.Locale each : Collections.list(request.getLocales())) {
                              languages.append(' ').append(each.toLanguageTag());
                          }
                          out.println(languages);
                      }
                      default -> response.setStatus(HttpServletResponse.SC_NO_CONTENT);
                  }
              }

          }

          static class Visits extends HttpServlet {

              @Override
              protected void doGet(HttpServletRequest request, HttpServletResponse response) throws IOException {
                  response.setContentType("text/plain");
                  PrintWriter out = response.getWriter();
                  String asked = request.getPathInfo();
                  if ("/end".equals(asked)) {
                      request.getSession().invalidate();
                      out.println("ended " + request.getSession(false));
                      return;
                  }
                  HttpSession session = request.getSession();
                  Integer visits = (Integer) session.getAttribute("visits");
                  if ("/renew".equals(asked)) {
                      String before = session.getId();
                      String after = request.changeSessionId();
                      out.println("renewed " + !after.equals(before) + " " + after.length() + " after " + visits + " visits");
                      return;
                  }
                  visits = visits == null ? 1 : visits + 1;
                  session.setAttribute("visits", visits);
                  out.println("visit " + visits + " new " + session.isNew() + " cookie "
                          + request.isRequestedSessionIdFromCookie());
              }

          }

          static class Visitors implements HttpSessionListener {

              @Override
              public void sessionCreated(HttpSessionEvent event) {
                  note("session created");
              }

              @Override
              public void sessionDestroyed(HttpSessionEvent event) {
                  note("session destroyed after " + event.getSession().getAttribute("visits") + " visits");
              }

          }

          // asynchronous: the request is completed after its servlet returned
          static class Later extends HttpServlet {

              static final BlockingQueue<AsyncContext> HELD = new ArrayBlockingQueue<>(1);

              static void answer(AsyncContext async, String line) {
                  try {
                      async.getResponse().getWriter().println(line);
                  }
                  catch (IOException ex) {
                      throw new UncheckedIOException(ex);
                  }
              }

              // notes what an asynchronous cycle hears before its response goes out
              static AsyncListener noting() {
                  return new AsyncListener() {
                      @Override
                      public void onComplete(AsyncEvent event) {
                      }

                      @Override
                      public void onTimeout(AsyncEvent event) {
                          note("async timeout");
                          answer(event.getAsyncContext(), "timed out");
                          event.getAsyncContext().complete();
                      }

                      @Override
                      public void onError(AsyncEvent event) {
                          note("async error " + event.getThrowable().getMessage());
                      }

                      @Override
                      public void onStartAsync(AsyncEvent event) {
                      }
                  };
              }

              @Override
              protected void doGet(HttpServletRequest request, HttpServletResponse response)
                      throws IOException, ServletException {
                  response.setContentType("text/plain");
                  switch (request.getPathInfo()) {
                      case "/start" -> {
                          AsyncContext async = request.startAsync();
                          Thread caller = Thread.currentThread();
                          async.start(() -> {
                              answer(async, "completed by a task, on another thread " + (Thread.currentThread() != caller));
                              async.complete();
                          });
                      }
                      case "/dispatch" -> {
                          AsyncContext async = request.startAsync();
                          async.start(() -> async.dispatch("/hello?name=dispatched"));
                      }
                      case "/held" -> {
                          response.getWriter().print("held|");
                          response.flushBuffer();
                          HELD.add(request.startAsync());
                      }
                      case "/release" -> {
                          AsyncContext held;
                          try {
                              held = HELD.poll(30, TimeUnit.SECONDS);
                          }
                          catch (InterruptedException ex) {
                              throw new ServletException(ex);
                          }
                          answer(held, "released");
                          held.complete();
                          response.getWriter().println("release");
                      }
                      case "/timeout" -> {
                          AsyncContext async = request.startAsync();
                          async.setTimeout(100);
                          async.addListener(noting());
                      }
                      default -> {
                          request.startAsync().addListener(noting());
                          throw new ServletException("thrown while asynchronous");
                      }
                  }
              }

              // echoes the body through a read listener
              @Override
              protected void doPost(HttpServletRequest request, HttpServletResponse response) throws IOException {
                  response.setContentType("text/plain");
                  AsyncContext async = request.startAsync();
                  ServletInputStream in = request.getInputStream();
                  StringBuilder read = new StringBuilder();
                  in.setReadListener(new ReadListener() {
                      @Override
                      public void onDataAvailable() throws IOException {
                          byte[] chunk = new byte[4];
                          while (in.isReady() && !in.isFinished()) {
                              int count = in.read(chunk);
                              if (count < 0) {
                                  break;
                              }
                              read.append(new String(chunk, 0, count, StandardCharsets.US_ASCII));
                          }
                      }

                      @Override
                      public void onAllDataRead() {
                          answer(async, "echo " + read + " finished " + in.isFinished());
                          async.complete();
                      }

                      @Override
                      public void onError(Throwable t) {
                          note("read error " + t);
                      }
                  });
              }

          }

          // the parts of a multipart body: a part past the threshold of 16 octets is in a
          // file of java.io.tmpdir under a JDK; a compiled program has no such directory,
          // and keeps every part in memory
          static class Upload extends HttpServlet {

              @Override
              protected void doPost(HttpServletRequest request, HttpServletResponse response)
                      throws IOException, ServletException {
                  response.setContentType("text/plain;charset=UTF-8");
                  PrintWriter out = response.getWriter();
                  try {
                      for (Part part : request.getParts()) {
                          out.println(part.getName() + " " + part.getSubmittedFileName() + " " + part.getContentType()
                                  + " " + part.getSize() + " "
                                  + new String(part.getInputStream().readAllBytes(), StandardCharsets.UTF_8));
                      }
                      out.println("title = " + request.getParameter("title"));
                  }
                  catch (IllegalStateException ex) {
                      out.println("refused: " + ex.getMessage());
                  }
              }

          }

          // what the context answers of the application's resources
          static class Listing extends HttpServlet {

              @Override
              protected void doGet(HttpServletRequest request, HttpServletResponse response) throws IOException {
                  response.setContentType("text/plain");
                  PrintWriter out = response.getWriter();
                  ServletContext context = getServletContext();
                  out.println("paths " + context.getResourcePaths("/") + " " + context.getResourcePaths("/css"));
                  try (InputStream in = context.getResourceAsStream("/notes.txt")) {
                      out.println("stream " + new String(in.readNBytes(5), StandardCharsets.US_ASCII) + " "
                              + context.getResourceAsStream("/css") + " " + context.getResourceAsStream("/WEB-INF/none"));
                  }
                  out.println("found " + (context.getResource("/css/site.css") != null) + " "
                          + context.getResource("/missing") + " " + context.getRealPath("/notes.txt"));
              }

          }

          static class Life implements ServletContextListener {

              @Override
              public void contextInitialized(ServletContextEvent event) {
                  note("context " + event.getServletContext().getContextPath() + " initialized, its own event's source "
                          + (event.getSource() == event.getServletContext()));
              }

              @Override
              public void contextDestroyed(ServletContextEvent event) {
                  note("context " + event.getServletContext().getContextPath() + " destroyed");
              }

          }

          public static void main(String[] args) throws Exception {
              ServletHttpServer server = ServletHttpServer.builder()
                  .address(new InetSocketAddress("127.0.0.1", @PORT@))
                  .contextPath("/app")
                  .listener(new Life())
                  .listener(new Visitors())
                  // a filter that is a lambda of the request and the response of HTTP
                  .filter("mark", (request, response, chain) -> {
                      response.setHeader("X-Filtered", "yes");
                      request.setAttribute("filtered", "by mark");
                      chain.doFilter(request, response);
                  }, filter -> filter.urlPatterns("/*")
                      .dispatcherTypes(DispatcherType.REQUEST, DispatcherType.ASYNC)
                      .asyncSupported())
                  .servlet("hello", new Hello(), servlet -> servlet.urlPatterns("/hello"))
                  .servlet("show", new Show(), servlet -> servlet.urlPatterns("/show/*", "*.do"))
                  .servlet("dispatch", new Dispatch(), servlet -> servlet.urlPatterns("/dispatch/*"))
                  .servlet("answers", new Answers(), servlet -> servlet.urlPatterns("/answers/*"))
                  .servlet("visits", new Visits(), servlet -> servlet.urlPatterns("/visits/*"))
                  .servlet("listing", new Listing(), servlet -> servlet.urlPatterns("/listing"))
                  // parts of 64 octets at most, in a file past 16
                  .servlet("upload", new Upload(), servlet -> servlet.urlPatterns("/upload")
                      .multipartConfig(new MultipartConfigElement("", 64, -1, 16)))
                  .servlet("later", new Later(), servlet -> servlet.urlPatterns("/later/*").asyncSupported())
                  // an error page: an ERROR dispatch, the error told by the request's attributes
                  .servlet("oops", (request, response) -> {
                      response.setContentType("text/plain");
                      Object type = request.getAttribute(RequestDispatcher.ERROR_EXCEPTION_TYPE);
                      response.getWriter().println(request.getDispatcherType() + " " + response.getStatus() + " "
                              + request.getAttribute(RequestDispatcher.ERROR_STATUS_CODE) + " "
                              + request.getAttribute(RequestDispatcher.ERROR_MESSAGE) + " "
                              + (type == null ? null : ((Class<?>) type).getName()) + " "
                              + request.getAttribute(RequestDispatcher.ERROR_REQUEST_URI) + " "
                              + request.getAttribute(RequestDispatcher.ERROR_SERVLET_NAME));
                  }, servlet -> servlet.urlPatterns("/oops"))
                  .errorPage(HttpServletResponse.SC_GONE, "/oops")
                  .errorPage(IllegalStateException.class, "/oops")
                  // a servlet that is a lambda: what answers its requests
                  .servlet("stop", (request, response) -> {
                      response.setContentType("text/plain");
                      response.getWriter().println("bye");
                      STOPPED.countDown();
                  }, servlet -> servlet.urlPatterns("/stop"))
                  .start();
              System.out.println("listening " + server.port());
              // the program's own thread waits while the server serves
              STOPPED.await();
              server.stop(Duration.ofSeconds(5));
              note("stopped");
          }

      }
