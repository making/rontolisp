# The corpus of the experimental Java subset's HTTP server, com.sun.net.httpserver
# (FetchSpecE2eTest#javaHttpServer): each program is a Java file started under the JDK
# running the test and on every transport a served application has -- the interpreter,
# the JVM, a --native output, a --component under `wasmtime serve`, its network
# granted, and a --no-wasi reactor (`reactor`) a host calls for each request: node,
# through the glue --emit-js-glue writes, as a Cloudflare Worker's runtime does --
# and asked the same requests in turn. @PORT@ stands for the port a leg binds (0: the program tells
# the one it got), @ORIGIN@ for the test's local origin and @LEG@ for the leg's name. Written here; nothing is copied or translated from a JDK or its tests
# (.kb/java-frontend-provenance.md).
#
# `tcp` marks a program whose handlers open sockets: @PEER@ is the port of the test's own
# TCP peer on the loopback, which answers a connection's lines (`echo TEXT`, `later
# MILLIS`, `octets`, `big COUNT`, `bye`; nothing to any other), and @HELD@ the port of a
# listener whose queue is full, which a connect waits on. Its component leg is granted the
# network (`-S cli=y -S inherit-network=y`), and its reactor leg is compiled with
# --host-sockets, the host's connect() one over node:net.
#
# A request's `expected` is what a JDK 25 answers -- the status, the fields `show`
# names, the body -- and the JDK leg checks that it still is. `deviates` holds, by leg,
# what a leg answers instead (each a difference doc/*/java/deviations.md states), and
# `skip` the legs a request is not sent on, with the reason; `unanswered` is how many
# seconds a leg waits for an answer it is not to give. `log` is what the program
# prints on lines starting "| ", in order: not read on the component leg, where the
# host starts the program as often as it likes, and read on the reactor leg once it has
# as many lines, since that host goes on after its last answer; `logDeviates` holds, by
# leg, what a leg logs instead. `reactorReports` are lines the reactor leg's host has on
# its standard error: the glue's report of a request that failed, and the program's
# reports of what ended an instance, which reach the host through --host-output.
#
# A program may be an example instead of a source (`example`, a path under examples/;
# the other .java files of its directory are written beside it),
# which binds the port of its PORT environment variable, says it on the line
# `listening` matches, and is ended once asked when it is `endless`; `unshown` are the
# lines of a body left out, by pattern. `sourcePath` (directories of the repository) and
# `sourceDep` (Maven coordinates) are the libraries a program uses: read as source on every
# leg, the coordinates' sources jars; compiled by javac onto the JDK leg's class path, beside
# the coordinates' jars. An example in a Maven project's src/main/java declares neither:
# its pom's dependencies are both (ExampleProject). `compiled` has the JDK leg compile the program too and start its
# class: a library that looks for the program's classes on the class path finds none of a
# source launcher's. `skip` holds, by leg, the legs a program is not run on, with the
# reason. `keyvalue` marks a program keeping its state in wasi:keyvalue@0.2.0-draft2: its
# component leg runs on sluice-wicket-runtime-wasi, the binary -Drontolisp.wicket names
# (skipped without it; wasmtime 51 links the first draft only), the store in a file of the
# leg's -- a host that runs each request in an instance of its own --; its reactor leg's host
# hands the glue a namespace shaped like Workers KV, under JSPI (skipped where node has none).
# `hostTimer` marks a program whose threads wait for a time, or a request for another: its
# reactor leg is compiled --host-timer, the waits in its host through JSPI (skipped where
# node has none).
programs:
  - name: server
    file: Server.java
    hostTimer: true
    source: |
      import com.sun.net.httpserver.Authenticator;
      import com.sun.net.httpserver.BasicAuthenticator;
      import com.sun.net.httpserver.Filter;
      import com.sun.net.httpserver.Headers;
      import com.sun.net.httpserver.HttpContext;
      import com.sun.net.httpserver.HttpExchange;
      import com.sun.net.httpserver.HttpHandler;
      import com.sun.net.httpserver.HttpHandlers;
      import com.sun.net.httpserver.HttpPrincipal;
      import com.sun.net.httpserver.HttpServer;
      import java.io.IOException;
      import java.io.InputStream;
      import java.io.OutputStream;
      import java.net.InetAddress;
      import java.net.InetSocketAddress;
      import java.net.URI;
      import java.net.http.HttpClient;
      import java.net.http.HttpRequest;
      import java.net.http.HttpResponse;
      import java.nio.charset.StandardCharsets;
      import java.util.ArrayList;
      import java.util.Arrays;
      import java.util.List;
      import java.util.concurrent.CountDownLatch;
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.TimeUnit;
      import java.util.concurrent.atomic.AtomicInteger;

      public class Server {

          static final String ORIGIN = "@ORIGIN@";

          static final Object LOCK = new Object();

          // A handler that logs after its response is out holds ORDER from before the response
          // to its last line: the client sends its next request on the response, and the next
          // handler, on another thread of the executor, would log first.
          static final Object ORDER = new Object();

          static int count;

          static int counting;

          static int most;

          static final Thread MAIN = Thread.currentThread();

          static final CountDownLatch STOPPED = new CountDownLatch(1);

          static final CountDownLatch RELEASED = new CountDownLatch(1);

          static final List<String> TRAIL = new ArrayList<>();

          static class Around extends Filter {

              final String name;

              Around(String name) {
                  this.name = name;
              }

              public void doFilter(HttpExchange exchange, Chain chain) throws IOException {
                  exchange.getResponseHeaders().add("X-Trail", name);
                  TRAIL.add(name + " in");
                  synchronized (ORDER) {
                      chain.doFilter(exchange);
                      System.out.println("| the filter " + name + " after its chain: " + TRAIL);
                  }
              }

              public String description() {
                  return "around " + name;
              }
          }

          static BasicAuthenticator basic(String realm) {
              return new BasicAuthenticator(realm) {
                  public boolean checkCredentials(String username, String password) {
                      System.out.println("| credentials: [" + username + "] [" + password + "]");
                      return username.equals("user") && password.equals("pass:word");
                  }
              };
          }

          interface Attempt {
              Object run() throws Exception;
          }

          static String attempt(Attempt attempt) {
              try {
                  return String.valueOf(attempt.run());
              }
              catch (Exception e) {
                  return e.toString();
              }
          }

          static void log(String what, Attempt attempt) {
              System.out.println("| " + what + ": " + attempt(attempt));
          }

          static void text(HttpExchange exchange, int status, String text) throws IOException {
              byte[] body = text.getBytes(StandardCharsets.UTF_8);
              exchange.getResponseHeaders().set("Content-Type", "text/plain; charset=utf-8");
              exchange.sendResponseHeaders(status, body.length);
              try (OutputStream out = exchange.getResponseBody()) {
                  out.write(body);
              }
          }

          static void where(HttpExchange exchange) throws IOException {
              text(exchange, 200, "context " + exchange.getHttpContext().getPath() + " uri " + exchange.getRequestURI());
          }

          static void request(HttpExchange exchange) throws IOException {
              synchronized (ORDER) {
                  answer(exchange);
              }
          }

          static void answer(HttpExchange exchange) throws IOException {
              URI uri = exchange.getRequestURI();
              Headers asked = exchange.getRequestHeaders();
              StringBuilder seen = new StringBuilder();
              seen.append("method ").append(exchange.getRequestMethod()).append('\n');
              seen.append("uri ").append(uri).append('\n');
              seen.append("path ").append(uri.getPath()).append(" raw ").append(uri.getRawPath()).append('\n');
              seen.append("query ").append(uri.getQuery()).append(" raw ").append(uri.getRawQuery()).append('\n');
              seen.append("protocol ").append(exchange.getProtocol()).append('\n');
              seen.append("code ").append(exchange.getResponseCode()).append('\n');
              seen.append("length ").append(attempt(() -> {
                  exchange.sendResponseHeaders(200, -2);
                  return "sent";
              })).append('\n');
              seen.append("field ").append(asked.get("x-probe")).append(' ').append(asked.getFirst("X-PROBE")).append(' ')
                  .append(asked.containsKey("x-Probe")).append(' ').append(asked.containsKey("X-probe")).append('\n');
              seen.append("no field ").append(asked.get("nope")).append(' ').append(asked.getFirst("nope")).append('\n');
              seen.append("type ").append(asked.getFirst("content-type")).append('\n');
              seen.append("fixed ").append(attempt(() -> {
                  asked.add("x-new", "1");
                  return "added";
              })).append('\n');
              InputStream in = exchange.getRequestBody();
              int first = in.read();
              byte[] rest = in.readAllBytes();
              seen.append("body ").append(first).append(' ').append(new String(rest, StandardCharsets.UTF_8)).append(' ')
                  .append(in.read()).append(' ').append(in.available()).append('\n');
              Headers answered = exchange.getResponseHeaders();
              answered.add("x-multi", "one");
              answered.add("X-Multi", "two");
              answered.set("x-single", "old");
              answered.set("X-SINGLE", "new");
              seen.append("answered ").append(answered.get("X-MULTI")).append(' ').append(answered.getFirst("x-single"))
                  .append(' ').append(answered.containsKey("X-multi")).append('\n');
              text(exchange, 201, seen.toString());
              log("code after the head", () -> exchange.getResponseCode());
              log("a head sent twice", () -> {
                  exchange.sendResponseHeaders(200, -1);
                  return "sent";
              });
              log("a write after the close", () -> {
                  exchange.getResponseBody().write(1);
                  return "written";
              });
          }

          static void echo(HttpExchange exchange) throws IOException {
              synchronized (ORDER) {
                  repeat(exchange);
              }
          }

          static void repeat(HttpExchange exchange) throws IOException {
              byte[] body = exchange.getRequestBody().readAllBytes();
              exchange.getResponseHeaders().add("Content-Type", "application/octet-stream");
              exchange.sendResponseHeaders(200, body.length == 0 ? -1 : body.length);
              OutputStream out = exchange.getResponseBody();
              if (body.length > 0) {
                  log("too many octets", () -> {
                      out.write(new byte[body.length + 1]);
                      return "written";
                  });
                  out.write(body, 0, 1);
                  out.write(body, 1, body.length - 1);
              }
              else {
                  log("an octet of no body", () -> {
                      out.write(1);
                      return "written";
                  });
              }
              exchange.close();
              log("the request body after the close", () -> exchange.getRequestBody().read());
          }

          static void chunked(HttpExchange exchange) throws IOException {
              String early = attempt(() -> {
                  exchange.getResponseBody().write('?');
                  return "written";
              });
              exchange.getResponseHeaders().add("X-Early", early);
              exchange.sendResponseHeaders(200, 0);
              OutputStream out = exchange.getResponseBody();
              out.write("first-".getBytes(StandardCharsets.UTF_8));
              out.flush();
              out.write('s');
              out.write("xecondx".getBytes(StandardCharsets.UTF_8), 1, 5);
              out.close();
              out.close();
          }

          static void stream(HttpExchange exchange) throws IOException {
              exchange.sendResponseHeaders(200, 0);
              OutputStream out = exchange.getResponseBody();
              out.write("first|".getBytes(StandardCharsets.UTF_8));
              out.flush();
              String told = attempt(() -> HttpClient.newHttpClient()
                  .send(HttpRequest.newBuilder(URI.create(ORIGIN + "/seen?stream-@LEG@")).build(),
                          HttpResponse.BodyHandlers.ofString())
                  .body());
              out.write(told.getBytes(StandardCharsets.UTF_8));
              out.close();
          }

          static void count(HttpExchange exchange) throws IOException {
              synchronized (LOCK) {
                  counting++;
                  most = Math.max(most, counting);
              }
              for (int i = 0; i < 2000; i++) {
                  synchronized (LOCK) {
                      int now = count;
                      count = now + 1;
                  }
              }
              synchronized (LOCK) {
                  counting--;
              }
              text(exchange, 200, "counted");
          }

          // The handler writes a chunk and waits, an hour at most, for the request that
          // lets it go on: two requests are in hand at once, and one ends the other's wait.
          static void held(HttpExchange exchange) throws IOException {
              exchange.sendResponseHeaders(200, 0);
              OutputStream out = exchange.getResponseBody();
              out.write("held|".getBytes(StandardCharsets.UTF_8));
              out.flush();
              String ended;
              try {
                  ended = RELEASED.await(1, TimeUnit.HOURS) ? "released" : "never released";
              }
              catch (InterruptedException e) {
                  ended = e.toString();
              }
              out.write(ended.getBytes(StandardCharsets.UTF_8));
              out.close();
          }

          // The handler waits for a thread it starts, which answers the exchange.
          static void worker(HttpExchange exchange) throws IOException {
              Thread worker = new Thread(() -> {
                  try {
                      text(exchange, 200, "answered by " + Thread.currentThread().getName());
                  }
                  catch (IOException e) {
                      System.out.println("| the worker: " + e);
                  }
              }, "worker");
              worker.start();
              try {
                  worker.join();
              }
              catch (InterruptedException e) {
                  System.out.println("| the handler: " + e);
              }
          }

          static void filters(HttpServer server) {
              HttpContext filtered = server.createContext("/filtered", exchange -> {
                  TRAIL.add("handler");
                  text(exchange, 200, "trail " + TRAIL + " attribute " + exchange.getAttribute("seen") + " added "
                          + exchange.getRequestHeaders().get("x-added") + " probe " + exchange.getRequestHeaders().get("X-Probe")
                          + " fixed " + attempt(() -> {
                              exchange.getRequestHeaders().add("a", "b");
                              return "added";
                          }));
              });
              log("no filters", () -> filtered.getFilters());
              Filter before = Filter.beforeHandler("before it", exchange -> {
                  TRAIL.add("before");
                  exchange.setAttribute("seen", "yes");
              });
              Filter after = Filter.afterHandler("after it", exchange -> TRAIL.add("after " + exchange.getResponseCode()));
              Filter adapt = Filter.adaptRequest("adapt it", request -> request.with("X-Added", List.of("one", "two"))
                  .with("X-Probe", List.of("not instead")));
              filtered.getFilters().add(new Around("a"));
              filtered.getFilters().add(before);
              filtered.getFilters().add(after);
              filtered.getFilters().add(adapt);
              filtered.getFilters().add(new Around("b"));
              log("the filters", () -> filtered.getFilters().size() + " " + before.description() + ", " + after.description()
                      + ", " + adapt.description());
              log("a filter of no description", () -> Filter.beforeHandler(null, exchange -> {
              }));
              log("a filter of no operation", () -> Filter.adaptRequest("adapt", null));
              HttpContext blocked = server.createContext("/blocked", exchange -> text(exchange, 200, "reached"));
              blocked.getFilters().add(new Filter() {
                  public void doFilter(HttpExchange exchange, Chain chain) throws IOException {
                      synchronized (ORDER) {
                          if (exchange.getRequestURI().getQuery() == null) {
                              text(exchange, 403, "stopped by the filter");
                              return;
                          }
                          chain.doFilter(exchange);
                          log("a chain run again", () -> {
                              chain.doFilter(exchange);
                              return "ran";
                          });
                      }
                  }

                  public String description() {
                      return "blocks";
                  }
              });
          }

          static void handlers(HttpServer server) {
              log("a status of two digits", () -> HttpHandlers.of(99, null, null));
              log("no fields", () -> HttpHandlers.of(200, null, "body"));
              log("no test", () -> HttpHandlers.handleOrElse(null, exchange -> {
              }, exchange -> {
              }));
              Headers canned = new Headers();
              canned.add("X-Canned", "yes");
              HttpHandler of = HttpHandlers.of(203, canned, "canned h\u00e9llo");
              canned.add("X-Late", "late");
              server.createContext("/canned", of);
              server.createContext("/either", HttpHandlers.handleOrElse(request -> request.getRequestMethod().equals("GET"),
                      exchange -> text(exchange, 200, "a get"), HttpHandlers.of(405, Headers.of("Allow", "GET"), "")));
          }

          static void authenticators(HttpServer server) {
              HttpContext basic = server.createContext("/basic", exchange -> {
                  HttpPrincipal principal = exchange.getPrincipal();
                  text(exchange, 200, "principal " + principal + " name " + principal.getName() + " user "
                          + principal.getUsername() + " realm " + principal.getRealm() + " equal "
                          + principal.equals(new HttpPrincipal("user", "the realm")) + " "
                          + principal.equals(new HttpPrincipal("user", "another")) + " "
                          + (principal.hashCode() == new HttpPrincipal("user", "the realm").hashCode()));
              });
              BasicAuthenticator authenticator = basic("the realm");
              log("no authenticator", () -> basic.getAuthenticator());
              log("an authenticator set", () -> basic.setAuthenticator(authenticator));
              log("an authenticator set again", () -> basic.setAuthenticator(authenticator) == authenticator);
              log("the authenticator", () -> (basic.getAuthenticator() == authenticator) + " " + authenticator.getRealm());
              log("an empty realm", () -> basic(""));
              log("a quote in a realm", () -> basic("a\"b"));
              log("a quote after a backslash", () -> basic("a\\\"b").getRealm());
              log("a realm ending in a backslash", () -> basic("a\\"));
              log("a control in a realm", () -> attempt(() -> basic("a\tb")).replace('\t', '_'));
              log("a character past 0xff in a realm", () -> basic("\u0100").getRealm().length());
              log("no charset", () -> new BasicAuthenticator("realm", null) {
                  public boolean checkCredentials(String username, String password) {
                      return true;
                  }
              });
              HttpContext latin = server.createContext("/latin", exchange -> text(exchange, 200, "principal " + exchange.getPrincipal()));
              latin.setAuthenticator(new BasicAuthenticator("a\\\"b", StandardCharsets.ISO_8859_1) {
                  public boolean checkCredentials(String username, String password) {
                      return true;
                  }
              });
              HttpContext custom = server.createContext("/custom", exchange -> text(exchange, 200, "principal " + exchange.getPrincipal()));
              custom.getFilters()
                  .add(Filter.beforeHandler("ahead", exchange -> exchange.getResponseHeaders()
                      .add("X-Ahead", "the filter saw " + exchange.getPrincipal())));
              custom.setAuthenticator(new Authenticator() {
                  public Result authenticate(HttpExchange exchange) {
                      String how = String.valueOf(exchange.getRequestURI().getQuery());
                      if (how.equals("fail")) {
                          return new Failure(403);
                      }
                      if (how.equals("retry")) {
                          exchange.getResponseHeaders().add("X-Retry", "again");
                          return new Retry(407);
                      }
                      return new Success(new HttpPrincipal("who", "where"));
                  }
              });
              log("the results", () -> new Authenticator.Failure(403).getResponseCode() + " "
                      + new Authenticator.Retry(407).getResponseCode() + " "
                      + new Authenticator.Success(new HttpPrincipal("u", "r")).getPrincipal());
              log("a principal of no name", () -> new HttpPrincipal(null, "r"));
          }

          public static void main(String[] args) throws Exception {
              HttpServer server = HttpServer.create(new InetSocketAddress("127.0.0.1", @PORT@), 0);
              log("no executor", () -> server.getExecutor());
              log("a path with no slash", () -> server.createContext("hello", Server::where));
              log("no path", () -> server.createContext(null, Server::where));
              log("no handler", () -> server.createContext("/none", null));
              HttpContext hello = server.createContext("/hello", exchange -> text(exchange, 200, "hello"));
              log("a context", () -> hello.getPath() + " " + (hello.getServer() == server) + " " + hello.getAttributes()
                      + " " + (hello.getHandler() != null));
              log("a path twice", () -> server.createContext("/hello", Server::where));
              log("a context that is not there", () -> {
                  server.removeContext("/gone");
                  return "removed";
              });
              server.createContext("/gone", Server::where);
              server.removeContext("/gone");
              server.createContext("/a", Server::where);
              server.createContext("/a/b", Server::where);
              server.createContext("/unhandled");
              server.createContext("/request", Server::request);
              server.createContext("/echo", Server::echo);
              server.createContext("/nothing", exchange -> {
                  exchange.getResponseHeaders().add("X-Nothing", "here");
                  exchange.sendResponseHeaders(204, -1);
                  exchange.close();
              });
              server.createContext("/chunked", Server::chunked);
              server.createContext("/stream", Server::stream);
              server.createContext("/count", Server::count);
              server.createContext("/counted", exchange -> text(exchange, 200,
                  "count " + count + " within the pool's bound " + (most >= 1 && most <= 4)));
              server.createContext("/thread", exchange -> text(exchange, 200,
                  "the thread main ran on " + (Thread.currentThread() == MAIN) + ", the executor's "
                          + Thread.currentThread().getName().startsWith("handler-")));
              server.createContext("/worker", Server::worker);
              server.createContext("/held", Server::held);
              server.createContext("/release", exchange -> {
                  RELEASED.countDown();
                  text(exchange, 200, "released");
              });
              server.createContext("/anonymous", exchange -> text(exchange, 200, "principal " + exchange.getPrincipal()));
              filters(server);
              handlers(server);
              authenticators(server);
          server.createContext("/peer", exchange -> text(exchange, 200,
                      exchange.getRemoteAddress().getAddress().getHostAddress() + " "
                              + (exchange.getRemoteAddress().getPort() > 0) + " "
                              + exchange.getLocalAddress().getAddress().getHostAddress() + " "
                              + (exchange.getLocalAddress().getPort() == server.getAddress().getPort())));
              server.createContext("/short", exchange -> {
                  exchange.sendResponseHeaders(200, 5);
                  OutputStream out = exchange.getResponseBody();
                  out.write('a');
                  log("a body cut short", () -> {
                      out.close();
                      return "closed";
                  });
              });
              server.createContext("/throws", exchange -> {
                  throw new IllegalStateException("no answer");
              });
              server.createContext("/committed", exchange -> {
                  exchange.sendResponseHeaders(200, 0);
                  OutputStream out = exchange.getResponseBody();
                  out.write("sent".getBytes(StandardCharsets.UTF_8));
                  out.flush();
                  throw new IOException("after the head");
              });
              server.createContext("/silent", exchange -> {
              });
              server.createContext("/stop", exchange -> {
                  text(exchange, 200, "bye");
                  long before = System.nanoTime();
                  server.stop(1);
                  log("a stop by a handler waits its delay", () -> System.nanoTime() - before >= 900000000L);
                  STOPPED.countDown();
              });
              log("a negative delay", () -> {
                  server.stop(-1);
                  return "stopped";
              });
              AtomicInteger made = new AtomicInteger();
              ExecutorService pool = Executors.newFixedThreadPool(4,
                      task -> new Thread(task, "handler-" + made.incrementAndGet()));
              server.setExecutor(pool);
              log("an executor", () -> server.getExecutor() == pool);
              server.start();
              log("started twice", () -> {
                  server.start();
                  return "started";
              });
              log("an executor once started", () -> {
                  server.setExecutor(null);
                  return "set";
              });
              log("bound twice", () -> {
                  server.bind(new InetSocketAddress("127.0.0.1", 0), 0);
                  return "bound";
              });
              log("the address", () -> server.getAddress().getHostString() + " " + (server.getAddress().getPort() > 0));
              log("a server with a context", () -> {
                  HttpServer.create(null, 0, "/", null);
                  return "made";
              });
              log("an address in numbers", () -> InetAddress.getByName("1.2.3") + " "
                      + InetAddress.getByName("65536").getHostAddress() + " " + InetAddress.getByName("") + " "
                      + InetAddress.getByName(null) + " " + Arrays.toString(InetAddress.getByName("10.1.2.200").getAddress())
                      + " " + InetAddress.getByAddress("h", new byte[] { 10, 1, 2, 3 }) + " "
                      + new InetSocketAddress("01.2.3.4", 80));
              log("numbers that are no address", () -> attempt(() -> InetAddress.getByName("1.2.3.256"))
                  .startsWith("java.net.UnknownHostException: 1.2.3.256: ") + " "
                      + attempt(() -> InetAddress.getByAddress(new byte[3])));
              System.out.println("listening " + server.getAddress().getPort());
              // the program's own thread waits while the server serves
              STOPPED.await();
              pool.shutdown();
              log("main went on once the server stopped", () -> "it did");
          }
      }
    log: |
      | no executor: null
      | a path with no slash: java.lang.IllegalArgumentException: Illegal value for path or protocol
      | no path: java.lang.NullPointerException: null handler, or path parameter
      | no handler: java.lang.NullPointerException: null handler, or path parameter
      | a context: /hello true {} true
      | a path twice: java.lang.IllegalArgumentException: cannot add context to list
      | a context that is not there: java.lang.IllegalArgumentException: cannot remove element from list
      | no filters: []
      | the filters: 5 before it, after it, adapt it
      | a filter of no description: java.lang.NullPointerException
      | a filter of no operation: java.lang.NullPointerException
      | a status of two digits: java.lang.IllegalArgumentException: statusCode must be 3-digit: 99
      | no fields: java.lang.NullPointerException
      | no test: java.lang.NullPointerException
      | no authenticator: null
      | an authenticator set: null
      | an authenticator set again: true
      | the authenticator: true the realm
      | an empty realm: java.lang.IllegalArgumentException: realm must not be empty
      | a quote in a realm: java.lang.IllegalArgumentException: realm invalid: a"b
      | a quote after a backslash: a\"b
      | a realm ending in a backslash: java.lang.IllegalArgumentException: realm invalid: a\
