  # The host's printer has the JDK's digits and layout; a cast to int goes toward zero
  # and stops at the type's ends; a division by zero is an infinity.
  - name: a-double-prints-as-the-shortest-text-that-reads-back
    main: Doubles
    source: |
      class Doubles {
          static double average(int[] xs) {
              double sum = 0;
              for (int x : xs) sum += x;
              return sum / xs.length;
          }

          public static void main(String[] args) {
              double d = 10 / 4 + 10 / 4.0, zero = 0;
              int n = 7;
              System.out.println(d + " " + 7.0 / 2 + " " + n / 2 + " " + n / 2.0 + " " + (0.1 + 0.2) + " " + 1.0 / 3 + " " + average(new int[] {3, 1, 4, 1}));
              System.out.println(1e10 + " " + 100.0 + " " + 0.001 + " " + 1.0E-5 + " " + 1e7 + " " + 9999999.0 + " " + 123456789.125 + " " + 1e23 + " " + .5 + " " + 5. + " " + 1.5e-7 + " " + -0.0 + " " + 4.9e-324);
              System.out.println((int) 3.99 + " " + (int) -3.99 + " " + (int) 1e20 + " " + (int) -1e20 + " " + (long) 1e30 + " " + (long) -2.5 + " " + (char) 97.9 + " " + (double) n + " " + (double) (1L << 53));
              System.out.println(Math.sqrt(2) + " " + Math.sqrt(-1) + " " + Math.pow(2, 10) + " " + Math.floor(-2.5) + " " + Math.abs(-2.5) + " " + Math.max(1.5, n) + " " + Math.min(1.5, n) + " " + Math.PI);
              System.out.println(1 / zero + " " + -1 / zero + " " + zero / zero + " " + 5.5 % 2 + " " + -5.5 % 2 + " " + (d > n) + " " + (n == 7.0) + " " + (d != d));
              d += 1;
              d *= 2;
              d -= n;
              d /= 4;
              d++;
              System.out.println(d + " " + -d + " " + (d < 0 ? -d : d));
          }
      }
    expected: |
      4.5 3.5 3 3.5 0.30000000000000004 0.3333333333333333 2.25
      1.0E10 100.0 0.001 1.0E-5 1.0E7 9999999.0 1.23456789125E8 1.0E23 0.5 5.0 1.5E-7 -0.0 4.9E-324
      3 -3 2147483647 -2147483648 9223372036854775807 -2 a 7.0 9.007199254740992E15
      1.4142135623730951 NaN 1024.0 -3.0 2.5 7.0 1.5 3.141592653589793
      Infinity -Infinity NaN 1.5 -1.5 false true false
      2.0 -2.0 2.0
  # A char is an integer whose static type prints it; arithmetic promotes it to int, and
  # an int constant that fits is a char.
  - name: a-char-is-a-number-printed-as-a-character
    main: Chars
    source: |
      class Chars {
          static final char FIRST = 'a';
          static final char NEXT = FIRST + 1;

          public static void main(String[] args) {
              char c = 'x', sixtyFive = 65, tab = '\t', quote = '\'', e = 'é';
              c++;
              c += 1;
              System.out.println(c + " " + (c + 1) + " " + (char) (c + 1) + " " + 'a' + 'b' + " " + (char) ('a' + 1) + " " + (int) c + " " + sixtyFive + NEXT);
              System.out.println((c > 'b') + " " + (c == 'z') + " " + (c - 'a') + " " + (char) (c - 25) + " " + (c > 100 ? 'y' : 'n') + " " + (c > 200 ? 1 : 'q') + "|" + tab + "|" + quote + e + '\101' + '\\');
              String word = "Zebra";
              int upper = 0;
              for (int i = 0; i < word.length(); i++) {
                  char at = word.charAt(i);
                  if (at >= 'A' && at <= 'Z') upper++;
              }
              char[] letters = {'o', 'k'};
              letters[0] -= 32;
              System.out.println(upper + " " + letters[0] + letters[1] + " " + letters.length + " " + (letters[0] + letters[1]) + " " + (char) 0x263A + " " + (int) (char) -1 + " " + (int) (char) 65536L);
          }
      }
    expected: |
      z 123 { ab b 122 Ab
      true true 25 a y q|	|'éA\
      1 Ok 2 186 ☺ 65535 0
  # && and || are and/or; & | ^ run both operands.
  - name: a-boolean-operator-short-circuits-or-evaluates-both
    main: Booleans
    source: |
      class Booleans {
          static int calls = 0;

          static boolean yes() {
              calls++;
              return true;
          }

          public static void main(String[] args) {
              boolean t = true, f = false;
              System.out.println((t & f) + " " + (t | f) + " " + (t ^ f) + " " + (t ^ t) + " " + !t + " " + (t == f) + " " + (t != f));
              System.out.println((f || yes()) + " " + (f && yes()) + " " + (f & yes()) + " " + (t | yes()) + " " + (t ^ yes()) + " " + calls);
              boolean b = t;
              b &= f;
              b |= yes();
              b ^= t;
              int n = 5;
              boolean big = n > 3 && !(n < 2) || n == 0;
              System.out.println(b + " " + big + " " + (big ? "yes" : "no") + " " + (n > 3 == big) + " " + calls);
          }
      }
    expected: |
      false true true false false false true
      true false false true false 4
      false true yes true 5
  # Each operand's text is made by its static type; the host's string is immutable and
  # its elements are code points.
  - name: a-string-concatenation-converts-by-static-type
    main: Strings
    source: |
      class Strings {
          public static void main(String[] args) {
              String s = "Hello, World", n = null;
              Object o = null;
              System.out.println("null: " + n + " " + null + " " + o + " " + 'c' + 1 + 2L + 1.5 + true + " \t|\"q\"\\ é \101" + (1 + 2) + 1 + 2);
              System.out.println(s.length() + " " + s.charAt(4) + " " + s.substring(7) + " " + s.substring(0, 5) + " " + s.indexOf("World") + " " + s.indexOf("xyz") + " " + s.toUpperCase() + " " + s.toLowerCase());
              System.out.println(s.isEmpty() + " " + "".isEmpty() + " " + s.equals("Hello, World") + " " + s.equals(null) + " " + s.equals(o) + " " + "ab".equals("a" + "b") + " " + s.hashCode() + " " + "".hashCode() + " " + s.toString());
              s += 1;
              s += 'c';
              s += null;
              s += 2.5;
              System.out.println(s + " " + String.valueOf(42) + String.valueOf('x') + String.valueOf(1.0) + String.valueOf(true) + Integer.toString(-7) + Integer.parseInt("-123") + Integer.parseInt("+45"));
              StringBuilder sb = new StringBuilder("seed:");
              sb.append(1).append('c').append("s").append(2.5).append(true).append(n).append(3L);
              String built = sb.toString();
              System.out.println(built + " " + sb.length() + " " + sb.charAt(0) + " " + sb + " " + built.equals("seed:1cs2.5truenull3") + " " + new StringBuilder().append("x").toString().length());
              System.out.print("no newline;");
              System.out.print(1);
              System.out.println();
              System.out.println('c');
              System.out.println(1.5);
              System.out.println(n);
          }
      }
