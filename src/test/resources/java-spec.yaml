      class Functions {
          static <T> void sort(List<T> xs, Comparator<? super T> order) {
              for (int i = 1; i < xs.size(); i++) {
                  T x = xs.get(i);
                  int j = i - 1;
                  while (j >= 0 && order.compare(xs.get(j), x) > 0) {
                      xs.set(j + 1, xs.get(j));
                      j--;
                  }
                  xs.set(j + 1, x);
              }
          }

          static List<String> words() {
              List<String> words = new ArrayList<>();
              words.add("pear");
              words.add("fig");
              words.add("banana");
              words.add("kiwi");
              return words;
          }

          public static void main(String[] args) {
              Function<Integer, Integer> inc = x -> x + 1;
              Function<Integer, Integer> dbl = x -> x * 2;
              BiFunction<Integer, Integer, Integer> add = (x, y) -> x + y;
              BinaryOperator<String> join = (x, y) -> x + y;
              UnaryOperator<String> same = UnaryOperator.identity();
              System.out.println(inc.andThen(dbl).apply(5) + " " + inc.compose(dbl).apply(5) + " " + add.andThen(inc).apply(2, 3) + " " + Function.<Integer>identity().apply(9) + " " + join.apply("a", "b") + " " + same.apply("s"));
              Predicate<String> empty = String::isEmpty;
              Predicate<String> isLong = s -> s.length() > 3;
              BiPredicate<String, Integer> longer = (s, n) -> s.length() > n;
              System.out.println(empty.test("") + " " + empty.negate().test("") + " " + empty.or(isLong).test("long") + " " + empty.and(isLong).test("") + " " + Predicate.not(isLong).test("abc") + " " + Predicate.isEqual("x").test("x") + " " + longer.negate().test("abc", 2));
              IntUnaryOperator next = n -> n + 1;
              IntPredicate even = n -> n % 2 == 0;
              IntSupplier seven = () -> 7;
              ToIntFunction<String> length = String::length;
              IntBinaryOperator times = (x, y) -> x * y;
              DoubleUnaryOperator half = d -> d / 2;
              LongBinaryOperator sum = (x, y) -> x + y;
              BooleanSupplier yes = () -> true;
              System.out.println(next.andThen(next).applyAsInt(1) + " " + next.compose(n -> n * 10).applyAsInt(1) + " " + even.negate().test(3) + " " + seven.getAsInt() + " " + length.applyAsInt("four") + " " + times.applyAsInt(6, 7) + " " + half.applyAsDouble(3) + " " + sum.applyAsLong(1L << 40, 1) + " " + yes.getAsBoolean());
              List<String> seen = new ArrayList<>();
              Consumer<String> keep = seen::add;
              BiConsumer<String, Integer> both = (s, n) -> seen.add(s + n);
              keep.andThen(s -> seen.add(s.toUpperCase())).accept("a");
              both.accept("b", 2);
              Supplier<Integer> size = seen::size;
              System.out.println(seen + " " + size.get());
              List<String> words = words();
              sort(words, Comparator.naturalOrder());
              System.out.println(words);
              sort(words, Comparator.comparingInt(String::length));
              System.out.println(words);
              sort(words, Comparator.comparing((String w) -> w.charAt(w.length() - 1)).thenComparing(Comparator.reverseOrder()));
              System.out.println(words);
              sort(words, Comparator.<String>naturalOrder().reversed());
              System.out.println(words + " " + Comparator.<Integer>reverseOrder().compare(1, 2));
              conversions();
          }

          // the interfaces from one primitive to another and of an object beside a primitive
          static void conversions() {
              IntToDoubleFunction half = i -> i / 2.0;
              IntToLongFunction wide = i -> (long) i << 33;
              LongToIntFunction narrow = l -> (int) (l >> 33);
              LongToDoubleFunction halved = l -> l * 0.5;
              DoubleToIntFunction whole = d -> (int) d;
              DoubleToLongFunction longer = d -> (long) d;
              ObjIntConsumer<String> ints = (text, i) -> System.out.print(text + i + " ");
              ObjLongConsumer<String> longs = (text, l) -> System.out.print(text + l + " ");
              ObjDoubleConsumer<String> doubles = (text, d) -> System.out.print(text + d + " ");
              ints.accept("i", 1);
              longs.accept("l", 2L);
              doubles.accept("d", 3.5);
              System.out.println(half.applyAsDouble(3) + " " + wide.applyAsLong(1) + " " + narrow.applyAsInt(1L << 34) + " " + halved.applyAsDouble(3L) + " " + whole.applyAsInt(3.9) + " " + longer.applyAsLong(-3.9));
          }
      }
