          // a lock whose holder is told by a number; a read that takes nothing is checked after
          static void stamps() throws Exception {
              StampedLock lock = new StampedLock();
              long optimistic = lock.tryOptimisticRead();
              System.out.println(shown(lock) + " " + optimistic + " " + lock.validate(optimistic) + " " + lock.validate(0));
              long write = lock.writeLock();
              System.out.println(write + " " + shown(lock) + " " + lock.validate(optimistic) + " " + lock.tryOptimisticRead()
                      + " " + lock.tryReadLock() + " " + lock.tryWriteLock() + " " + lock.isWriteLocked());
              lock.unlockWrite(write);
              long first = lock.readLock();
              long second = lock.readLock();
              System.out.println(first + " " + second + " " + shown(lock) + " " + lock.getReadLockCount() + " "
                      + lock.tryWriteLock() + " " + lock.tryOptimisticRead() + " " + lock.validate(first));
              attempt(() -> {
                  lock.unlockWrite(write);
                  return "unlocked";
              });
              attempt(() -> {
                  lock.unlockRead(first + 300);
                  return "unlocked";
              });
              lock.unlockRead(first);
              lock.unlock(second);
              attempt(() -> {
                  lock.unlockRead(second);
                  return "unlocked";
              });
              // one hold becomes another when no other thread is in the way
              long read = lock.readLock();
              long converted = lock.tryConvertToWriteLock(read);
              long back = lock.tryConvertToReadLock(converted);
              long also = lock.readLock();
              System.out.println(read + " " + converted + " " + back + " " + also + " " + lock.tryConvertToWriteLock(back)
                      + " " + lock.tryConvertToOptimisticRead(also) + " " + lock.tryConvertToOptimisticRead(back) + " "
                      + lock.tryConvertToWriteLock(read) + " " + shown(lock));
              System.out.println(StampedLock.isWriteLockStamp(converted) + " " + StampedLock.isReadLockStamp(back) + " "
                      + StampedLock.isOptimisticReadStamp(optimistic) + " " + StampedLock.isLockStamp(optimistic) + " "
                      + StampedLock.isOptimisticReadStamp(0));
              // the lock as two locks with no stamp
              Lock reading = lock.asReadLock();
              Lock writing = lock.asReadWriteLock().writeLock();
              reading.lock();
              System.out.println(writing.tryLock() + " " + reading.tryLock(1, TimeUnit.MILLISECONDS) + " "
                      + lock.getReadLockCount() + " " + (reading == lock.asReadWriteLock().readLock()) + " "
                      + named(reading) + " " + named(writing));
              reading.unlock();
              reading.unlock();
              attempt(() -> {
                  reading.unlock();
                  return "unlocked";
              });
              attempt(() -> writing.newCondition());
              // a writer waits for the readers, and an interrupt ends a wait that says so
              List<String> seen = Collections.synchronizedList(new ArrayList<>());
              long held = lock.readLock();
              Thread writer = new Thread(() -> {
                  long stamp = lock.writeLock();
                  seen.add("the writer is in");
                  try {
                      lock.readLockInterruptibly();
                  }
                  catch (InterruptedException e) {
                      seen.add("interrupted " + Thread.currentThread().isInterrupted());
                  }
                  lock.unlockWrite(stamp);
              });
              writer.start();
              while (writer.getState() != Thread.State.WAITING) {
                  Thread.sleep(1);
              }
              seen.add("the reader is out");
              lock.unlockRead(held);
              while (seen.size() < 2 || writer.getState() != Thread.State.WAITING) {
                  Thread.sleep(1);
              }
              writer.interrupt();
              writer.join();
              Thread.currentThread().interrupt();
              try {
                  lock.tryWriteLock(1, TimeUnit.SECONDS);
              }
              catch (InterruptedException e) {
                  seen.add("interrupted though the lock is free");
              }
              System.out.println(seen + " " + shown(lock));
              // two fields written under the write lock are never read torn
              int[] pair = new int[2];
              int[] torn = new int[1];
              Thread writes = new Thread(() -> {
                  for (int i = 1; i <= 2000; i++) {
                      long stamp = lock.writeLock();
                      pair[0] = i;
                      pair[1] = -i;
                      lock.unlockWrite(stamp);
                  }
              });
              Thread reads = new Thread(() -> {
                  for (int i = 0; i < 2000; i++) {
                      long stamp = lock.tryOptimisticRead();
                      int a = pair[0];
                      int b = pair[1];
                      if (!lock.validate(stamp)) {
                          stamp = lock.readLock();
                          a = pair[0];
                          b = pair[1];
                          lock.unlockRead(stamp);
                      }
                      if (a + b != 0) {
                          torn[0]++;
                      }
                  }
              });
              writes.start();
              reads.start();
              writes.join();
              reads.join();
              System.out.println(torn[0] + " " + pair[0] + " " + pair[1]);
          }

          /** The counts a phaser prints. */
          static String counts(Phaser phaser) {
              String text = phaser.toString();
              return text.substring(text.indexOf('['));
          }

          // a barrier whose parties come and go, phase after phase
          static void phases() throws Exception {
              Phaser plain = new Phaser();
              System.out.println(plain.register() + " " + plain.bulkRegister(2) + " " + plain.arrive() + " "
                      + plain.getArrivedParties() + " " + plain.getUnarrivedParties() + " " + plain.arrive() + " "
                      + plain.arrive() + " " + plain.getPhase() + " " + plain.awaitAdvance(0) + " " + plain.awaitAdvance(-7)
                      + " " + plain.arriveAndDeregister() + " " + plain.getRegisteredParties() + " " + shown(plain));
              System.out.println(plain.arriveAndDeregister() + " " + plain.arriveAndDeregister() + " " + plain.isTerminated()
                      + " " + (plain.getPhase() - Integer.MIN_VALUE) + " " + (plain.register() < 0) + " " + counts(plain));
              attempt(() -> new Phaser(-1));
              for (Phaser refusing : List.of(new Phaser(65535), new Phaser())) {
                  try {
                      System.out.println(refusing.getRegisteredParties() == 0 ? refusing.arrive() : refusing.register());
                  }
                  catch (IllegalStateException e) {
                      System.out.println(shown(e.getMessage()));
                  }
              }
              // the root is asked at the end of each phase, on the thread that arrived last
              List<String> seen = Collections.synchronizedList(new ArrayList<>());
              Phaser three = new Phaser(1) {
                  protected boolean onAdvance(int phase, int registeredParties) {
                      seen.add("phase " + phase + " of " + registeredParties + ", " + getArrivedParties() + " arrived");
                      return phase >= 2;
                  }
              };
              Thread[] workers = new Thread[3];
              for (int i = 0; i < workers.length; i++) {
                  three.register();
                  workers[i] = new Thread(() -> {
                      while (three.arriveAndAwaitAdvance() >= 0) {
                          Thread.yield();
                      }
                  });
                  workers[i].start();
              }
              while (three.getArrivedParties() < 3) {
                  Thread.sleep(1);
              }
              System.out.println(counts(three));
              int first = three.arriveAndAwaitAdvance();
              int second = three.arriveAndAwaitAdvance();
              // the last phase: the thread whose arrival ends it is answered 3, any other the end
              int last = three.arriveAndAwaitAdvance();
              for (Thread worker : workers) {
                  worker.join();
              }
              System.out.println(first + " " + second + " " + (last & Integer.MAX_VALUE) + " " + three.isTerminated() + " "
                      + seen + " " + counts(three));
              Phaser alone = new Phaser(1) {
                  protected boolean onAdvance(int phase, int registeredParties) {
                      return phase >= 1;
                  }
              };
              System.out.println(alone.arriveAndAwaitAdvance() + " " + alone.isTerminated() + " "
                      + alone.arriveAndAwaitAdvance() + " " + alone.isTerminated() + " "
                      + (alone.arriveAndAwaitAdvance() - Integer.MIN_VALUE));
              // a tier is one party of the phaser above it while it has parties of its own
              Phaser root = new Phaser();
              Phaser left = new Phaser(root, 2);
              Phaser right = new Phaser(root);
              System.out.println(counts(root) + " " + counts(left) + " " + counts(right) + " " + (left.getParent() == root)
                      + " " + (right.getRoot() == root) + " " + root.getParent());
              right.register();
              System.out.println(left.arrive() + " " + right.arrive() + " " + counts(root) + " " + counts(left) + " "
                      + counts(right));
              System.out.println(left.arrive() + " " + counts(root) + " " + counts(left) + " " + counts(right));
              System.out.println(right.arriveAndDeregister() + " " + counts(root) + " " + left.arriveAndDeregister() + " "
                      + left.arriveAndDeregister() + " " + root.isTerminated() + " " + left.isTerminated() + " "
                      + (root.getPhase() - Integer.MIN_VALUE));
              // an end that is forced wakes who waits; an interrupt ends only a wait that says so
              seen.clear();
              Phaser forced = new Phaser(2);
              Thread waits = new Thread(() -> seen.add("woken with " + (forced.arriveAndAwaitAdvance() - Integer.MIN_VALUE)));
              waits.start();
              while (forced.getArrivedParties() < 1) {
                  Thread.sleep(1);
              }
              forced.forceTermination();
              waits.join();
              Phaser gate = new Phaser(1);
              Thread watcher = new Thread(() -> {
                  try {
                      gate.awaitAdvanceInterruptibly(0);
                  }
                  catch (InterruptedException e) {
                      seen.add("interrupted");
                  }
                  Thread.currentThread().interrupt();
                  seen.add("advanced to " + gate.awaitAdvance(0) + " " + Thread.interrupted());
              });
              watcher.start();
              while (watcher.getState() != Thread.State.WAITING) {
                  Thread.sleep(1);
              }
              watcher.interrupt();
              while (seen.size() < 2 || watcher.getState() != Thread.State.WAITING) {
                  Thread.sleep(1);
              }
              System.out.println(gate.arrive() + " " + counts(forced));
              watcher.join();
              System.out.println(seen);
              attempt(() -> gate.awaitAdvanceInterruptibly(1, 5, TimeUnit.MILLISECONDS));
          }

          // a queue whose producer may wait for its element to be taken
          static void transfers() throws Exception {
