      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.Iterator;
      import java.util.List;
      import java.util.concurrent.ArrayBlockingQueue;
      import java.util.concurrent.BlockingDeque;
      import java.util.concurrent.BlockingQueue;
      import java.util.concurrent.BrokenBarrierException;
      import java.util.concurrent.Callable;
      import java.util.concurrent.CancellationException;
      import java.util.concurrent.CountDownLatch;
      import java.util.concurrent.CyclicBarrier;
      import java.util.concurrent.Exchanger;
      import java.util.concurrent.ExecutionException;
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.Future;
      import java.util.concurrent.FutureTask;
      import java.util.concurrent.LinkedBlockingDeque;
      import java.util.concurrent.LinkedBlockingQueue;
      import java.util.concurrent.LinkedTransferQueue;
      import java.util.concurrent.Phaser;
      import java.util.concurrent.RejectedExecutionException;
      import java.util.concurrent.ScheduledExecutorService;
      import java.util.concurrent.ScheduledThreadPoolExecutor;
      import java.util.concurrent.Semaphore;
      import java.util.concurrent.SynchronousQueue;
      import java.util.concurrent.ThreadPoolExecutor;
      import java.util.concurrent.TimeUnit;
      import java.util.concurrent.TimeoutException;
      import java.util.concurrent.locks.Condition;
      import java.util.concurrent.locks.Lock;
      import java.util.concurrent.locks.ReentrantLock;
      import java.util.concurrent.locks.ReentrantReadWriteLock;
      import java.util.concurrent.locks.StampedLock;

      public class Handing {
          static int total;
          static boolean ready;
          static int inside;
          static int most;

          public static void main(String[] args) throws Exception {
              // a unit converts a duration, and one too long is the longest the unit holds
              System.out.println(TimeUnit.SECONDS.toMillis(3) + " " + TimeUnit.MILLISECONDS.toSeconds(3999) + " "
                      + TimeUnit.HOURS.convert(3, TimeUnit.DAYS) + " " + TimeUnit.NANOSECONDS.toMicros(-1999) + " "
                      + TimeUnit.DAYS.toNanos(Long.MAX_VALUE) + " " + TimeUnit.DAYS.toNanos(-200000) + " "
                      + TimeUnit.valueOf("MINUTES").toSeconds(2) + " " + TimeUnit.MICROSECONDS);

              // a lock is taken again by the thread holding it and refused to any other
              ReentrantLock lock = new ReentrantLock();
              Thread[] adders = new Thread[4];
              for (int i = 0; i < adders.length; i++) {
                  adders[i] = new Thread(() -> {
                      for (int n = 0; n < 2000; n++) {
                          lock.lock();
                          try {
                              lock.lock();
                              total++;
                              lock.unlock();
                          }
                          finally {
                              lock.unlock();
                          }
                      }
                  });
                  adders[i].start();
              }
              for (Thread adder : adders) {
                  adder.join();
              }
              System.out.println(total + " " + lock.isLocked() + " " + lock.getHoldCount());
              lock.lock();
              lock.lock();
              Thread refused = new Thread(() -> {
                  try {
                      System.out.println(lock.tryLock() + " " + lock.tryLock(5, TimeUnit.MILLISECONDS) + " "
                              + lock.isHeldByCurrentThread() + " " + lock.isLocked());
                      lock.unlock();
                  }
                  catch (IllegalMonitorStateException | InterruptedException e) {
                      System.out.println("not the owner: " + e.getClass().getName());
                  }
              });
              refused.start();
              refused.join();
              System.out.println(lock.getHoldCount() + " " + lock.tryLock() + " " + lock.getHoldCount());
              lock.unlock();

              // a condition gives the lock up, however many times it is held, until a signal
              Condition changed = lock.newCondition();
              new Thread(() -> {
                  lock.lock();
                  try {
                      ready = true;
                      changed.signalAll();
                  }
                  finally {
                      lock.unlock();
                  }
              }).start();
              while (!ready) {
                  changed.await();
              }
              System.out.println("signalled " + lock.getHoldCount() + " " + changed.await(5, TimeUnit.MILLISECONDS) + " "
                      + (changed.awaitNanos(1000) <= 0) + " " + lock.getHoldCount());
              lock.unlock();
              lock.unlock();
              try {
                  changed.signal();
              }
              catch (IllegalMonitorStateException e) {
                  System.out.println("signal without the lock");
              }
              try {
                  lock.unlock();
              }
              catch (IllegalMonitorStateException e) {
                  System.out.println("unlock without the lock");
              }
              Lock plain = new ReentrantLock(true);
              plain.lockInterruptibly();
              plain.unlock();

              // a latch opens at zero; a semaphore has so many permits
              CountDownLatch latch = new CountDownLatch(3);
              Semaphore permits = new Semaphore(2);
              Object guard = new Object();
              System.out.println(latch.await(5, TimeUnit.MILLISECONDS) + " " + latch.getCount());
              for (int i = 0; i < 3; i++) {
                  new Thread(() -> {
                      try {
                          permits.acquire();
                          synchronized (guard) {
                              inside++;
                              most = Math.max(most, inside);
                          }
                          synchronized (guard) {
                              inside--;
                          }
                          permits.release();
                      }
                      catch (InterruptedException e) {
                          System.out.println(e);
                      }
                      latch.countDown();
                  }).start();
              }
              latch.await();
              latch.countDown();
              System.out.println(latch.getCount() + " " + (most <= 2) + " " + permits.availablePermits() + " "
                      + permits.tryAcquire(3) + " " + permits.tryAcquire(2) + " "
                      + permits.tryAcquire(5, TimeUnit.MILLISECONDS) + " " + permits.drainPermits());
              permits.release(4);
              System.out.println(permits.availablePermits());

              // a queue hands elements from thread to thread, first in first out
              BlockingQueue<String> queue = new ArrayBlockingQueue<>(3);
              new Thread(() -> {
                  try {
                      for (String word : new String[] { "a", "b", "c" }) {
                          queue.put(word);
                      }
                  }
                  catch (InterruptedException e) {
                      System.out.println(e);
                  }
              }).start();
              System.out.println(queue.take() + queue.take() + queue.take() + " " + queue.poll() + " "
                      + queue.poll(5, TimeUnit.MILLISECONDS) + " " + queue.remainingCapacity());
              System.out.println(queue.offer("x") + " " + queue.offer("y") + " " + queue.add("z") + " " + queue.offer("w")
                      + " " + queue.offer("w", 5, TimeUnit.MILLISECONDS) + " " + queue + " " + queue.peek() + " "
                      + queue.size() + " " + queue.contains("y"));
              try {
                  queue.add("full");
              }
              catch (IllegalStateException e) {
                  System.out.println(e);
              }
              try {
                  queue.offer(null);
              }
              catch (NullPointerException e) {
                  System.out.println("no null");
              }
              List<String> drained = new ArrayList<>();
              BlockingQueue<Integer> numbers = new LinkedBlockingQueue<>(List.of(1, 2, 3));
              System.out.println(queue.drainTo(drained, 2) + " " + drained + " " + queue.remove() + " " + queue.isEmpty()
                      + " " + numbers.remainingCapacity() + " " + numbers.remove(2) + " " + numbers);

              // a pool runs the tasks handed to it on its threads and a future waits for one
              ExecutorService pool = Executors.newFixedThreadPool(2);
              List<Future<String>> names = new ArrayList<>();
              CountDownLatch both = new CountDownLatch(2);
              for (int i = 0; i < 2; i++) {
                  names.add(pool.submit(() -> {
                      both.countDown();
                      return Thread.currentThread().getName() + " " + Thread.currentThread().isDaemon();
                  }));
              }
              List<Callable<Integer>> squares = new ArrayList<>();
              for (int i = 1; i <= 4; i++) {
                  int n = i;
                  squares.add(() -> n * n);
              }
              int sum = 0;
              for (Future<Integer> square : pool.invokeAll(squares)) {
                  sum += square.get();
              }
              System.out.println(names.get(0).get() + ", " + names.get(1).get() + ", " + sum + " " + both.getCount());
              Future<Integer> failing = pool.submit(() -> 1 / (int) both.getCount());
              try {
                  failing.get();
              }
              catch (ExecutionException e) {
                  System.out.println(e + " | " + e.getCause().getMessage() + " " + failing.isDone() + " "
                          + failing.isCancelled());
              }
              pool.shutdown();
              System.out.println(pool.awaitTermination(60, TimeUnit.SECONDS) + " " + pool.isShutdown() + " "
                      + pool.isTerminated());
              try {
                  pool.execute(() -> System.out.println("never"));
              }
              catch (RejectedExecutionException e) {
                  System.out.println("rejected");
              }

              // one thread runs a single executor's tasks in the order given, idle or not between them
              ExecutorService single = Executors.newSingleThreadExecutor();
              StringBuilder order = new StringBuilder();
              for (int i = 0; i < 3; i++) {
                  int n = i;
                  single.execute(() -> order.append(n));
              }
              System.out.println(single.submit(() -> Thread.currentThread().getName()).get() + " " + order + " "
                      + single.submit(() -> order.append('!'), "done").get() + " "
                      + single.submit(() -> Thread.currentThread().getName()).get(60, TimeUnit.SECONDS));
              Future<?> last = single.submit(() -> order.append('?'));
              single.close();
              System.out.println(order + " " + last.isDone() + " " + last.get() + " " + single.isTerminated());

              // what a task leaves uncaught ends its thread, and another takes its place
              ExecutorService replaced = Executors.newSingleThreadExecutor();
              replaced.execute(() -> {
                  throw new IllegalStateException("the task's thread ends");
              });
              System.out.println(replaced.submit(() -> Thread.currentThread().getName()).get());
              replaced.shutdown();
              ExecutorService cached = Executors.newCachedThreadPool();
              String once = cached.submit(() -> Thread.currentThread().getName()).get();
              System.out.println(once + " " + cached.submit(() -> Thread.currentThread().getName()).get().startsWith("pool-4-")
                      + " " + cached.shutdownNow() + " " + cached.awaitTermination(60, TimeUnit.SECONDS));

              // a task is run once; cancelled before, it never is
              FutureTask<String> task = new FutureTask<>(() -> "ran");
              FutureTask<String> dropped = new FutureTask<>(() -> "never");
              System.out.println(task.isDone() + " " + dropped.cancel(true) + " " + dropped.cancel(true));
              task.run();
              dropped.run();
              System.out.println(task.get() + " " + task.cancel(false) + " " + dropped.isCancelled() + " " + dropped.isDone());
              try {
                  dropped.get();
              }
              catch (CancellationException e) {
                  System.out.println(e);
              }
              try {
                  new FutureTask<>(() -> {
                      Thread.sleep(1000);
                      return 1;
                  }).get(5, TimeUnit.MILLISECONDS);
              }
              catch (TimeoutException e) {
                  System.out.println(e);
              }

              // a thread a task, virtual or made by a factory
              List<String> seen = new ArrayList<>();
              try (ExecutorService each = Executors.newVirtualThreadPerTaskExecutor()) {
                  for (int i = 0; i < 3; i++) {
                      each.submit(() -> {
                          synchronized (seen) {
                              seen.add(Thread.currentThread().isVirtual() + "" + Thread.currentThread().isDaemon());
                          }
                      });
                  }
              }
              ExecutorService made = Executors.newThreadPerTaskExecutor(r -> new Thread(r, "made"));
              Future<String> name = made.submit(() -> Thread.currentThread().getName());
              made.shutdown();
              System.out.println(seen + " " + name.get() + " " + made.awaitTermination(60, TimeUnit.SECONDS));
              readersAndAWriter();
              barriersAndExchangers();
              dequesAndHandOffs();
              aPoolOfTheProgramsOwn();
              answers();
              stamps();
              phases();
              transfers();
              hooksAndSizes();
          }

          static boolean turnedOver;

          static int written;

          /** What a lock, a latch, a pool or a future prints, without the number of the object. */
          static String shown(Object object) {
              String text = object.toString();
              return text.substring(0, text.indexOf('@')) + text.substring(text.indexOf('['));
          }

          static void attempt(Callable<Object> asked) {
              try {
                  System.out.println(asked.call());
              }
              catch (Throwable e) {
                  System.out.println(e + (e.getCause() != null ? " <- " + e.getCause() : ""));
              }
          }

          // any number of threads read at once and one writes alone; the writer may read
          static void readersAndAWriter() throws Exception {
              ReentrantReadWriteLock rw = new ReentrantReadWriteLock();
              List<String> seen = Collections.synchronizedList(new ArrayList<>());
              rw.readLock().lock();
              Thread reader = new Thread(() -> {
                  rw.readLock().lock();
                  seen.add("readers " + rw.getReadLockCount() + " held here " + rw.getReadHoldCount() + " write "
                          + rw.writeLock().tryLock());
                  rw.readLock().unlock();
              });
              reader.start();
              reader.join();
              Thread writer = new Thread(() -> {
                  rw.writeLock().lock();
                  written = 1;
                  seen.add("wrote, readers " + rw.getReadLockCount() + " " + rw.isWriteLockedByCurrentThread());
                  rw.writeLock().unlock();
              });
              writer.start();
              rw.readLock().unlock();
              writer.join();
              rw.writeLock().lock();
              rw.writeLock().lock();
              Thread shut = new Thread(() -> {
                  try {
                      seen.add("while written: read " + rw.readLock().tryLock() + " "
                              + rw.readLock().tryLock(5, TimeUnit.MILLISECONDS) + " write " + rw.writeLock().tryLock());
                  }
                  catch (InterruptedException e) {
                      seen.add(e.toString());
                  }
              });
              shut.start();
              shut.join();
              rw.readLock().lock();
              System.out.println(seen + " " + written + " " + rw.getWriteHoldCount() + " " + rw.getReadHoldCount() + " "
                      + rw.isWriteLocked());
              System.out.println(shown(rw) + " " + shown(rw.writeLock()) + " " + shown(rw.readLock()));
              rw.writeLock().unlock();
              rw.writeLock().unlock();
              System.out.println(rw.isWriteLocked() + " " + rw.getReadLockCount() + " " + shown(rw.writeLock()) + " "
                      + rw.isFair() + " " + rw.hasQueuedThreads());
              rw.readLock().unlock();
              Condition turned = rw.writeLock().newCondition();
              Thread awaiting = new Thread(() -> {
                  rw.writeLock().lock();
                  try {
                      while (!turnedOver) {
                          turned.await();
                      }
                      seen.add("turned " + rw.getWriteHoldCount());
                  }
                  catch (InterruptedException e) {
                      seen.add(e.toString());
                  }
                  finally {
                      rw.writeLock().unlock();
                  }
              });
              Thread turning = new Thread(() -> {
                  rw.writeLock().lock();
                  turnedOver = true;
                  turned.signal();
                  rw.writeLock().unlock();
              });
              awaiting.start();
              turning.start();
              awaiting.join();
              turning.join();
              try {
                  rw.readLock().unlock();
              }
              catch (IllegalMonitorStateException e) {
                  System.out.println(seen.get(seen.size() - 1) + ": " + e.getMessage());
              }
              attempt(() -> {
                  rw.writeLock().unlock();
                  return "unlocked";
              });
              attempt(() -> rw.readLock().newCondition());
          }

          // a barrier lets its threads go on together; two threads hand each other an object
          static void barriersAndExchangers() throws Exception {
              int[] rounds = new int[1];
              CyclicBarrier barrier = new CyclicBarrier(3, () -> rounds[0]++);
              List<Integer> arrivals = Collections.synchronizedList(new ArrayList<>());
              Thread[] parties = new Thread[3];
              for (int i = 0; i < parties.length; i++) {
                  parties[i] = new Thread(() -> {
                      try {
                          arrivals.add(barrier.await());
                      }
                      catch (InterruptedException | BrokenBarrierException e) {
                          arrivals.add(-1);
                      }
                  });
                  parties[i].start();
              }
              for (Thread party : parties) {
                  party.join();
              }
              Collections.sort(arrivals);
              System.out.println(arrivals + " " + rounds[0] + " " + barrier.getParties() + " " + barrier.getNumberWaiting()
                      + " " + barrier.isBroken());
              attempt(() -> barrier.await(5, TimeUnit.MILLISECONDS));
              attempt(() -> barrier.await());
              System.out.println(barrier.isBroken());
              barrier.reset();
              CyclicBarrier alone = new CyclicBarrier(1, () -> System.out.println("the barrier's action"));
              System.out.println(barrier.isBroken() + " " + barrier.getNumberWaiting() + " " + alone.await() + " "
                      + alone.await());
              attempt(() -> new CyclicBarrier(0));

              Exchanger<String> exchanger = new Exchanger<>();
              String[] theirs = new String[1];
              Thread other = new Thread(() -> {
                  try {
                      theirs[0] = exchanger.exchange("from the thread");
                  }
                  catch (InterruptedException e) {
                      theirs[0] = e.toString();
                  }
              });
              other.start();
              String mine = exchanger.exchange("from main");
              other.join();
              System.out.println(mine + " / " + theirs[0]);
              attempt(() -> exchanger.exchange("nobody", 5, TimeUnit.MILLISECONDS));
          }

