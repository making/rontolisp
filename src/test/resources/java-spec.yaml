  # ArrayDeque, Optional, Objects, Collections, Arrays over each array type, Vector,
  # Stack, Enumeration, StringBuffer and Hashtable, which walks its keys in its own
  # order; Random gives the specified sequence, so a seeded shuffle is the JDK's.
  - name: a-deque-an-optional-the-utilities-and-the-older-classes
    main: OlderAndUtil
    source: |
      class OlderAndUtil {
          public static void main(String[] args) {
              Deque<Integer> deque = new ArrayDeque<>();
              for (int i = 0; i < 20; i++) {
                  if (i % 2 == 0) {
                      deque.addFirst(i);
                  } else {
                      deque.addLast(i);
                  }
              }
              Queue<Integer> queue = new ArrayDeque<>(List.of(1, 2, 3));
              Deque<String> stack = new ArrayDeque<>();
              stack.push("a");
              stack.push("b");
              System.out.println(deque + " " + deque.pollFirst() + " " + deque.pollLast() + " " + deque.peek() + " " + queue.poll() + queue.peek() + queue.size() + " " + deque.contains(5) + " " + deque.remove(5) + " " + deque.size() + " " + stack.pop() + stack.peekLast() + stack + " " + new ArrayDeque<String>().poll());
              Vector<String> vector = new Vector<>();
              vector.addElement("a");
              vector.add("b");
              Enumeration<String> elements = vector.elements();
              StringBuffer buffer = new StringBuffer();
              while (elements.hasMoreElements()) {
                  buffer.append(elements.nextElement()).append(',');
              }
              Stack<Integer> pile = new Stack<>();
              pile.push(1);
              pile.push(2);
              System.out.println(buffer + " " + vector.firstElement() + vector.lastElement() + " " + pile.pop() + pile.peek() + pile + pile.empty() + pile.search(1));
              Hashtable<String, Integer> table = new Hashtable<>();
              for (String w : "it was the best of times it was the worst of times it was the age of wisdom".split(" ")) {
                  Integer n = table.get(w);
                  table.put(w, n == null ? 1 : n + 1);
              }
              StringBuilder keys = new StringBuilder();
              for (Enumeration<String> each = table.keys(); each.hasMoreElements();) {
                  keys.append(each.nextElement()).append(' ');
              }
              Hashtable<Integer, String> numbered = new Hashtable<>();
              for (int i = 0; i < 20; i++) {
                  numbered.put(i * 7 - 50, "v" + i);
              }
              System.out.println(table + " " + keys + table.contains(3) + " " + table.remove("was") + " " + numbered.keySet() + " " + new Hashtable<>(numbered).keySet() + " " + numbered.equals(new HashMap<>(numbered)));
              Optional<String> none = Optional.ofNullable(null);
              System.out.println(Optional.of("x").map(s -> s + "!").orElse("none") + " " + Optional.empty() + " " + none.isPresent() + " " + none.or(() -> Optional.of("alt")).get() + " " + Optional.of(5).filter(x -> x > 3).map(x -> x * 2) + " " + Optional.of("a").equals(Optional.of("a")) + " " + none.orElseGet(() -> "made") + " " + Optional.of(1).isEmpty());
              try {
                  none.orElseThrow(() -> new IllegalStateException("absent"));
              } catch (IllegalStateException e) {
                  System.out.println(e.getMessage());
              }
              try {
                  Objects.requireNonNull(null, "nope");
              } catch (NullPointerException e) {
                  System.out.println(e.getMessage());
              }
              System.out.println(Objects.equals(null, null) + " " + Objects.equals("a", "a") + " " + Objects.hash(1, "a") + " " + Objects.toString(null) + " " + Objects.requireNonNullElse(null, "d") + " " + Objects.hashCode(null) + " " + Objects.isNull(none) + " " + Objects.toString(null, "dflt"));
              List<Integer> nums = new ArrayList<>(List.of(5, 3, 9, 1));
              Collections.sort(nums);
              Collections.reverse(nums);
              Collections.swap(nums, 0, 3);
              List<String> names = new ArrayList<>();
              Collections.addAll(names, "z", "y");
              Collections.sort(names, Collections.reverseOrder());
              System.out.println(nums + " " + Collections.max(nums) + " " + Collections.min(nums) + " " + names + " " + Collections.nCopies(3, "ab") + Collections.emptyList() + Collections.singletonList(1) + Collections.frequency(List.of(1, 2, 1), 1) + Collections.unmodifiableList(nums) + Collections.emptyMap());
              Integer[] boxed = {3, 1, 2};
              Arrays.sort(boxed, Comparator.reverseOrder());
              String[] words = {"pear", "fig", "apple"};
              Arrays.sort(words);
              double[] ds = {2.5, -1.0, 0.0};
              Arrays.sort(ds);
              int[] ints = {9, 3, 7, 1};
              Arrays.sort(ints, 1, 3);
              int[] copy = Arrays.copyOf(new int[] {1, 2, 3}, 5);
              int[] filled = new int[3];
              Arrays.fill(filled, 7);
              long[] longs = {3L, 1L};
              Arrays.sort(longs);
              char[] letters = {'c', 'a', 'b'};
              Arrays.sort(letters);
              System.out.println(Arrays.toString(boxed) + Arrays.toString(words) + Arrays.toString(ds) + Arrays.toString(ints) + Arrays.toString(copy) + Arrays.toString(filled) + Arrays.equals(copy, filled) + Arrays.binarySearch(new int[] {1, 3, 5}, 3) + Arrays.toString(Arrays.copyOfRange(words, 1, 3)) + Arrays.asList(1, 2) + Arrays.hashCode(new int[] {1, 2}) + Arrays.toString(longs) + Arrays.toString(letters) + Arrays.toString(new boolean[2]) + Arrays.asList(words).indexOf("fig"));
              Random random = new Random(42);
              System.out.println(random.nextInt(100) + " " + random.nextInt() + " " + random.nextDouble() + " " + random.nextBoolean() + " " + random.nextLong() + " " + random.nextGaussian() + " " + random.nextInt(16) + " " + random.nextGaussian());
              Collections.shuffle(nums, new Random(7));
              System.out.println(nums);
          }
      }
