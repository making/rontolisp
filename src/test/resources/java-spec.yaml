      record SourceListsPoint(int x, String label) {
      }

      class SourceListsBag implements Iterable<String> {
          private final List<String> items = new ArrayList<>();

          SourceListsBag add(String item) {
              items.add(item);
              return this;
          }

          public Iterator<String> iterator() {
              return items.iterator();
          }
      }

      class SourceListsSquares extends AbstractList<Integer> {
          public Integer get(int index) {
              return index * index;
          }

          public int size() {
              return 4;
          }
      }

      class SourceListsCountdown implements Iterator<Integer> {
          private int left;

          SourceListsCountdown(int left) {
              this.left = left;
          }

          public boolean hasNext() {
              return left > 0;
          }

          public Integer next() {
              return left--;
          }
      }

      class SourceLists {
          public static void main(String[] args) {
              List<String> xs = new ArrayList<>();
              xs.add("pear");
              xs.add("fig");
              xs.add("apple");
              xs.add(1, "kiwi");
              System.out.println(xs + " " + xs.size() + " " + xs.contains("fig") + " " + xs.indexOf("apple") + " " + xs.remove("fig") + " " + xs.remove(0) + " " + xs + " " + xs.isEmpty());
              xs.sort(null);
              xs.addAll(List.of("zebra", "kiwi"));
              xs.addAll(0, List.of("first"));
              System.out.println(xs + " " + xs.lastIndexOf("kiwi") + " " + xs.equals(List.of("first", "apple", "kiwi", "zebra", "kiwi")) + " " + xs.hashCode() + " " + xs.subList(1, 3) + " " + xs.getFirst() + xs.getLast() + " " + xs.reversed() + " " + String.join("+", xs));
              xs.replaceAll(String::toUpperCase);
              xs.removeIf(s -> s.startsWith("K"));
              Iterator<String> each = xs.iterator();
              each.next();
              each.remove();
              System.out.println(xs + " " + xs.containsAll(List.of("APPLE")) + " " + new ArrayList<>(xs).retainAll(List.of("ZEBRA")) + " " + Arrays.toString(xs.toArray(new String[0])) + " " + xs.toArray().length + " " + List.copyOf(xs) + " " + new ArrayList<String>(4).isEmpty());
              List<SourceListsPoint> points = new ArrayList<>(List.of(new SourceListsPoint(2, "b"), new SourceListsPoint(1, "c"), new SourceListsPoint(2, "a")));
              System.out.println(points.contains(new SourceListsPoint(1, "c")) + " " + points.indexOf(new SourceListsPoint(9, "z")) + " " + points.remove(new SourceListsPoint(2, "b")) + " " + points.size());
              points.sort(Comparator.comparingInt(SourceListsPoint::x).thenComparing(SourceListsPoint::label));
              System.out.println(points + " " + Collections.max(points, Comparator.comparing(SourceListsPoint::label)).label());
              int total = 0;
              for (String item : new SourceListsBag().add("x").add("yz")) {
                  total += item.length();
              }
              StringBuilder seen = new StringBuilder();
              new SourceListsBag().add("p").add("q").forEach(s -> seen.append(s.toUpperCase()));
              Iterator<Integer> down = new SourceListsCountdown(3);
              while (down.hasNext()) {
                  seen.append(down.next());
              }
              List<Integer> squares = new SourceListsSquares();
              System.out.println(total + " " + seen + " " + squares + " " + squares.contains(9) + " " + squares.indexOf(4) + " " + squares.subList(1, 3) + " " + new ArrayList<>(squares).equals(squares) + " " + squares.hashCode());
              List<Integer> fixed = List.of(1, 2, 3);
              List<Integer> nums = new ArrayList<>(fixed);
              try {
                  xs.get(5);
              } catch (IndexOutOfBoundsException e) {
                  System.out.println(e.getMessage());
              }
              try {
                  fixed.add(4);
              } catch (UnsupportedOperationException e) {
                  System.out.println("fixed " + e.getMessage());
              }
              try {
                  for (int n : nums) {
                      nums.add(n);
                  }
              } catch (ConcurrentModificationException e) {
                  System.out.println("changed " + nums);
              }
              try {
                  new ArrayList<Integer>().iterator().next();
              } catch (NoSuchElementException e) {
                  System.out.println("none " + e.getMessage());
              }
              Object asObject = nums;
              System.out.println((asObject instanceof List<?> list ? list.size() : -1) + " " + (asObject instanceof Collection) + " " + (asObject instanceof Set) + " " + nums.getClass().getName() + " " + asObject.equals(List.of(1, 2, 3, 1)));
          }
      }
