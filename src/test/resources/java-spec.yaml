  # A switch is a cond over the selector: an int and a char by eql, a string by equal,
  # an enum constant by eq; cases that run into the next are numbered and each runs
  # when the one picked is no later; a switch expression's value is its clause's, a
  # yield from the middle a block's; a labeled break and continue name their block.
  - name: a-switch-is-a-cond-over-its-selector
    main: Switches
    source: |
      enum SwitchColor { RED, GREEN, BLUE }

      class Switches {
          static String name(int n) {
              switch (n) {
                  case 1: return "one";
                  case 2:
                  case 3: return "few";
                  default: return "many";
              }
          }

          static int fall(int n) {
              int acc = 0;
              switch (n) {
                  case 1: acc += 1;
                  case 2: acc += 10;
                  case 3: acc += 100; break;
                  default: acc = -1;
                  case 9: acc += 1000;
              }
              return acc;
          }

          static String arrow(String s) {
              return switch (s) {
                  case "a", "b" -> "ab";
                  case "c" -> { String t = s + s; yield t; }
                  default -> "other";
              };
          }

          static int color(SwitchColor c) {
              switch (c) {
                  case RED -> { return 1; }
                  case GREEN -> { return 2; }
                  default -> { return 3; }
              }
          }

          static String covered(SwitchColor c) {
              return switch (c) { case RED -> "r"; case GREEN -> "g"; case BLUE -> "b"; };
          }

          static String day(int d) {
              String kind;
              switch (d) {
                  case 6, 7 -> kind = "weekend";
                  case 1, 2, 3, 4, 5 -> {
                      String prefix = d == 5 ? "last " : "";
                      kind = prefix + "weekday";
                  }
                  default -> throw new IllegalArgumentException("day " + d);
              }
              return kind;
          }

          static int nested(int a, String b) {
              return switch (a) {
                  case 1 -> switch (b) { case "x" -> 10; case "y" -> 20; default -> 30; };
                  case 2 -> {
                      int acc = 0;
                      for (int i = 0; i < 5; i++) {
                          if (i == 3) yield acc * 100;
                          acc += i;
                      }
                      yield -1;
                  }
                  default -> { if (b.isEmpty()) yield 0; yield b.length(); }
              };
          }

          static String groups(int k) {
              StringBuilder sb = new StringBuilder();
              loop:
              for (int i = 0; i < 3; i++) {
                  switch (k + i) {
                      case 0:
                          int local = 5;
                          sb.append("zero").append(local);
                          break;
                      case 1:
                          local = 7;
                          sb.append("one").append(local);
                      case 2:
                          sb.append("two");
                          continue loop;
                      case 3:
                          break loop;
                      default:
                          sb.append("d");
                  }
                  sb.append("|");
              }
              return sb.toString();
          }

          static int old(char c) {
              return switch (c) {
                  case 'a':
                  case 'e': yield 1;
                  case 'z': { int v = c - 'a'; yield v; }
                  default: yield 0;
              };
          }

          public static void main(String[] args) {
              for (int i = 0; i < 6; i++) System.out.print(name(i) + " " + fall(i) + (i < 5 ? ", " : "\n"));
              System.out.println(fall(9) + " " + arrow("a") + arrow("c") + arrow("z") + " " + old('e') + old('z') + old('q'));
              for (SwitchColor c : SwitchColor.values()) System.out.print(color(c) + covered(c) + " ");
              System.out.println(day(6) + ", " + day(5) + ", " + day(1) + " " + nested(1, "y") + " " + nested(2, "") + " " + nested(3, "") + " " + nested(3, "abc"));
              try { day(9); } catch (IllegalArgumentException e) { System.out.println(e.getMessage()); }
              System.out.println(groups(0) + " " + groups(1) + " " + groups(2) + " " + groups(5));
              char ch = 'x';
              Integer boxed = 3;
              String word = "b";
              int k = switch (ch) { case 'x' -> 1; case 'y' -> 2; default -> 0; };
              int score = switch (word) { case "a" -> 1; case "b" -> { int twice = k * 2; yield twice * 10; } default -> 0; };
              System.out.println(k + " " + score + " " + switch (score) { case 20 -> "twenty"; default -> "?"; } + "!");
              switch (boxed) { case 3 -> System.out.println("three"); default -> System.out.println("no"); }
              String missing = null;
              SwitchColor none = null;
              try { switch (missing) { case "a" -> System.out.println("a"); default -> System.out.println("default"); } }
              catch (RuntimeException e) { System.out.println("a switch over null throws"); }
              try { switch (none) { case RED: System.out.println("red"); break; default: System.out.println("default"); } }
              catch (RuntimeException e) { System.out.println("so does one over an enum"); }
              outer:
              for (int i = 0; i < 3; i++) {
                  for (int j = 0; j < 3; j++) {
                      if (j == 2) continue outer;
                      if (i == 2) break outer;
                      System.out.print(i + "," + j + " ");
                  }
              }
              block: {
                  if (k == 1) break block;
                  System.out.print("not reached");
              }
              int n = 0;
              do { n++; if (n % 2 == 0) continue; System.out.print("odd" + n + " "); } while (n < 5);
              System.out.println("end");
          }
      }
