    source: |
      public class Uncaught {
          static void check(int balance, int amount) {
              if (amount > balance) {
                  throw new IllegalStateException("insufficient funds: " + (amount - balance));
              }
              System.out.println("withdrew " + amount);
          }

          public static void main(String[] args) {
              check(100, 30);
              try {
                  check(70, 100);
              } finally {
                  System.out.println("finally");
              }
              System.out.println("not reached");
          }
      }
    stdout: |
      withdrew 30
      finally
    error: "java.lang.IllegalStateException: insufficient funds: 30"
  # The report asks the thrown object's own toString().
  - name: an-uncaught-exception-of-the-program-s-own-class
    file: Own.java
    source: |
      class Rejected extends Exception {
          final int code;

          Rejected(int code) {
              this.code = code;
          }

          public String toString() {
              return "Rejected with code " + code;
          }
      }

      public class Own {
          public static void main(String[] args) throws Rejected {
              System.out.println("before");
              throw new Rejected(7);
          }
      }
    stdout: |
      before
    error: "Rejected with code 7"
  # Top-level methods and fields are the members of a class named as the file; java.base
  # is imported, IO is java.lang's.
  - name: a-compact-source-file-starts-at-its-instance-main
    file: Compact.java
    source: |
      int calls;

      int square(int x) {
          calls++;
          return x * x;
      }

      String label() {
          return "sum of squares";
      }

      void main() {
          var total = 0;
          for (var i = 1; i <= 10; i++) total += square(i);
          List<String> parts = new ArrayList<>();
          parts.add(label());
          IO.print(parts.get(0));
          IO.println(": " + total + " in " + calls + " calls");
          IO.println();
          IO.println(this.calls > 0);
          Tally tally = new Tally(2);
          IO.println(tally.twice() + " " + tally.getClass().getName() + " " + Mode.ON.getClass().getName());
      }

      // a class beside the members is a member class of the file's class: an inner class
      class Tally {
          final int factor;

          Tally(int factor) {
              this.factor = factor;
          }

          int twice() {
              return square(factor) * 2 + calls;
          }
      }

      enum Mode { ON, OFF }
    stdout: |
      sum of squares: 385 in 10 calls

      true
      19 Compact$Tally Compact$Mode
