  - name: regular-expressions-run-on-the-engine-the-front-ends-share
    main: RegexSurface
    source: |
      class RegexSurface {
          public static void main(String[] args) {
              Pattern date = Pattern.compile("(?<y>\\d{4})-(?<m>\\d{2})-(\\d{2})");
              Matcher m = date.matcher("from 2026-11-17 to 2026-12-01");
              while (m.find()) {
                  System.out.println(m.group() + " " + m.start() + ".." + m.end() + " y=" + m.group("y") + " m=" + m.group(2) + " d=" + m.group(3) + " groups=" + m.groupCount());
              }
              System.out.println("2026-11-17".matches("\\d+-\\d+-\\d+") + " " + "x2026".matches("\\d+") + " " + Pattern.matches("(?i)hello", "HELLO") + " " + Pattern.quote("a.b") + " " + "a.b".matches(Pattern.quote("a.b")) + " " + Matcher.quoteReplacement("$1\\"));
              System.out.println("a1b22c333".replaceAll("\\d+", "#") + " " + "a1b22c333".replaceFirst("(\\d)", "<$1>") + " " + "2026-10".replaceAll("(?<y>\\d+)-(?<m>\\d+)", "${m}/${y}") + " " + date.matcher("2026-11-17").replaceAll("$3.$2.$1"));
              System.out.println(Arrays.toString("a, b,c ,  d".split("\\s*,\\s*")) + Arrays.toString("to be or not".split(" ")) + Arrays.toString("a,b,,".split(",", -1)) + Arrays.toString(Pattern.compile("(?=b)").split("abab")) + Arrays.toString("x1y22z".split("\\d+", 2)));
              Matcher word = Pattern.compile("\\b\\p{L}+\\b").matcher("h\u00e9llo w\u00f6rld 42");
              StringBuilder words = new StringBuilder();
              while (word.find()) {
                  words.append('[').append(word.group()).append(']');
              }
              System.out.println(words + " " + date + " " + date.flags() + " " + Pattern.compile("a.c", Pattern.DOTALL | Pattern.CASE_INSENSITIVE).matcher("A\nC").matches() + " " + Pattern.compile("a+", Pattern.LITERAL).matcher("aa+").find());
              Matcher look = Pattern.compile("(?<=\\$)\\d+").matcher("$10 20 $30");
              System.out.println(look.find() + " " + look.group() + " " + look.find(4) + " " + look.group() + " " + look.lookingAt() + " " + look.reset().find() + " " + look.start() + " " + look);
              Matcher greedy = Pattern.compile("(a+?)(a*)|((\\w)\\w)*\\w\\w").matcher("aaa bcdef");
              greedy.find();
              System.out.print(greedy.group(1) + "," + greedy.group(2) + "," + greedy.group(3) + " ");
              greedy.find();
              System.out.println(greedy.group() + "," + greedy.group(1) + "," + greedy.group(3) + "," + greedy.group(4) + " " + greedy.start(1) + " " + greedy.end(3));
              Matcher cluster = Pattern.compile("\\X").matcher("e\u0301x");
              cluster.find();
              System.out.println(cluster.end() + " " + "\u65e5\u672c\u8a9e x".replaceAll("\\p{IsHan}", "*") + " " + "A-b".replaceAll("(?i)[a-z]", "_"));
              try {
                  Pattern.compile("(a");
              }
              catch (PatternSyntaxException e) {
                  System.out.println(e.getDescription() + " | " + e.getIndex() + " | " + e.getPattern() + " | " + e.getMessage().replace('\n', '/'));
              }
              try {
                  Pattern.compile("(?<=(?:ab)*)c");
              }
              catch (IllegalArgumentException e) {
                  System.out.println(e.getMessage().replace('\n', '/'));
              }
              try {
                  m.group();
              }
              catch (IllegalStateException e) {
                  System.out.println(e.getMessage());
              }
              try {
                  "a".replaceAll("(a)", "$2");
              }
              catch (IndexOutOfBoundsException e) {
                  System.out.println(e.getMessage());
              }
              try {
                  date.matcher("2026-11-17").replaceFirst("${d}");
              }
              catch (IllegalArgumentException e) {
                  System.out.println(e.getMessage());
              }
          }
      }
