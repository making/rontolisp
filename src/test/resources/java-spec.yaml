      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.HashMap;
      import java.util.HashSet;
      import java.util.Hashtable;
      import java.util.List;
      import java.util.Map;
      import java.util.Set;
      import java.util.Vector;
      import java.util.concurrent.atomic.AtomicBoolean;
      import java.util.concurrent.atomic.AtomicInteger;
      import java.util.concurrent.atomic.AtomicLong;
      import java.util.concurrent.atomic.AtomicReference;

      public class Monitors {
          static final ThreadLocal<Integer> slot = ThreadLocal.withInitial(() -> 7);
          static final Object lock = new Object();
          static int inBlock, inStatic, inLiteral;
          static volatile boolean seen;
          private int inMethod;
          private volatile String label = "none";

          synchronized void add() {
              inMethod++;
              // a monitor is taken again by the thread holding it
              synchronized (this) {
                  inMethod++;
              }
          }

          static synchronized void addStatic() {
              inStatic++;
          }

          static final InheritableThreadLocal<String> scope = new InheritableThreadLocal<>() {
              @Override
              protected String childValue(String parentValue) {
                  return parentValue + ">child";
              }
          };

          // initialized by the thread of main, which waits there for a thread that
          // initializes another class
          static class Loud {
              static int made;
              static {
                  System.out.println("Loud starts");
                  Thread helper = new Thread(new Helper());
                  helper.start();
                  try {
                      helper.join();
                  }
                  catch (InterruptedException e) {
                      throw new IllegalStateException(e);
                  }
                  made = Other.value + 1;
                  System.out.println("Loud ends");
              }
          }

          static class Other {
              static int value;
              static {
                  System.out.println("Other starts on " + Thread.currentThread().getName());
                  value = 41;
              }
          }

          static class Helper implements Runnable {
              public void run() {
                  System.out.println("helper reads " + Other.value);
              }
          }

          static class Summer extends Thread {
              final int from;
              long sum;

              Summer(int from) {
                  super("summer-" + from);
                  this.from = from;
              }

              @Override
              public void run() {
                  for (int i = from; i < from + 1000; i++) {
                      sum += i;
                  }
              }
          }

          public static void main(String[] args) throws InterruptedException {
              Thread main = Thread.currentThread();
              System.out.println(main.getName() + " " + main.isAlive() + " " + main.isDaemon() + " " + main.getPriority()
                      + " " + (main == Thread.currentThread()));
              Monitors shared = new Monitors();
              AtomicInteger hits = new AtomicInteger();
              AtomicLong total = new AtomicLong(10);
              AtomicBoolean once = new AtomicBoolean();
              AtomicReference<String> first = new AtomicReference<>("none");
              Thread[] workers = new Thread[4];
              for (int i = 0; i < workers.length; i++) {
                  int id = i;
                  workers[i] = new Thread(() -> {
                      for (int k = 0; k < 500; k++) {
                          synchronized (lock) {
                              inBlock++;
                          }
                          synchronized (Monitors.class) {
                              inLiteral++;
                          }
                          shared.add();
                          addStatic();
                          hits.incrementAndGet();
                          total.addAndGet(k);
                      }
                      if (once.compareAndSet(false, true)) {
                          first.set("set once");
                      }
                      slot.set(slot.get() + id);
                      if (slot.get() != 7 + id || !Thread.currentThread().getName().equals("worker-" + id)) {
                          hits.set(-1);
                      }
                      shared.label = "written";
                      seen = true;
                  }, "worker-" + i);
              }
              System.out.println(workers[0].getName() + " " + workers[0].isAlive() + " " + workers[0].isDaemon());
              workers[0].join();
              for (Thread worker : workers) {
                  worker.start();
              }
              for (Thread worker : workers) {
                  worker.join();
              }
              System.out.println(inBlock + " " + inLiteral + " " + shared.inMethod + " " + inStatic + " " + hits + " "
                      + total.get() + " " + once.get() + " " + first.get() + " " + seen + " " + shared.label);
              System.out.println(slot.get() + " " + workers[3].isAlive() + " " + Thread.holdsLock(lock));
              synchronized (lock) {
                  System.out.println(Thread.holdsLock(lock) + " " + hits.getAndUpdate(n -> n * 2) + " "
                          + hits.accumulateAndGet(5, (a, b) -> a + b));
              }
              try {
                  workers[0].start();
              }
              catch (IllegalThreadStateException e) {
                  System.out.println(e);
              }
              Summer[] parts = { new Summer(0), new Summer(1000), new Summer(2000) };
              long sum = 0;
              for (Summer part : parts) {
                  part.start();
              }
              for (Summer part : parts) {
                  part.join();
                  sum += part.sum;
              }
              System.out.println(sum + " " + parts[1].getName());
              Thread daemon = new Thread(() -> System.out.println("daemon " + Thread.currentThread().isDaemon() + " "
                      + new Thread(() -> { }).isDaemon()));
              daemon.setDaemon(true);
              daemon.start();
              daemon.join();
              Thread virtual = Thread.ofVirtual().name("virtual").unstarted(() -> System.out.println(
                      Thread.currentThread().getName() + " " + Thread.currentThread().isDaemon() + " "
                              + Thread.currentThread().isVirtual()));
              virtual.start();
              virtual.join();
              Thread.ofPlatform().name("numbered-", 3).start(() -> System.out.println(Thread.currentThread().getName()))
                  .join();
              Thread.startVirtualThread(() -> System.out.println("[" + Thread.currentThread().getName() + "]")).join();
              Object nothing = null;
              try {
                  synchronized (nothing) {
                      System.out.println("not reached");
                  }
              }
              catch (NullPointerException e) {
                  System.out.println("a null has no monitor");
              }
              try {
                  new Thread((String) null);
              }
              catch (NullPointerException e) {
                  System.out.println(e.getMessage());
              }
              // the classes a JDK synchronizes and the wrappers hold their monitor
              Vector<Integer> vector = new Vector<>();
              Hashtable<Integer, Integer> table = new Hashtable<>();
              StringBuffer buffer = new StringBuffer();
              List<Integer> list = Collections.synchronizedList(new ArrayList<>());
              Map<Integer, Integer> map = Collections.synchronizedMap(new HashMap<>());
              Set<Integer> set = Collections.synchronizedSet(new HashSet<>());
              Thread[] sharing = new Thread[4];
              for (int i = 0; i < sharing.length; i++) {
                  int id = i;
                  sharing[i] = new Thread(() -> {
                      for (int n = 0; n < 2000; n++) {
                          vector.add(n);
                          table.put(id * 2000 + n, n);
                          table.merge(-1, 1, Integer::sum);
                          buffer.append('x').append(n % 10);
                          list.add(n);
                          map.put(id * 2000 + n, n);
                          set.add(id * 2000 + n);
                      }
                  });
                  sharing[i].start();
              }
              for (Thread each : sharing) {
                  each.join();
              }
              System.out.println(vector.size() + " " + table.size() + " " + table.get(-1) + " " + buffer.length() + " "
                      + list.size() + " " + map.size() + " " + set.size());
              synchronized (list) {
                  int listed = 0;
                  for (int n : list) {
                      listed += n;
                  }
                  System.out.println(listed + " " + Thread.holdsLock(list) + " " + Thread.holdsLock(map));
              }
              System.out.println(Loud.made);
              // a thread's state, and the values it takes over from the thread making it
              scope.set("main");
              Thread watcher = new Thread(() -> {
                  while (main.getState() != Thread.State.WAITING) {
                      Thread.yield();
                  }
                  System.out.println(scope.get() + " " + slot.get() + " " + Thread.currentThread().getState());
                  scope.set("changed");
              });
              System.out.println(watcher.getState() + " " + main.getState());
              watcher.start();
              watcher.join();
              Thread timed = new Thread(() -> {
                  while (main.getState() != Thread.State.TIMED_WAITING) {
                      Thread.yield();
                  }
              });
              timed.start();
              timed.join(60000);
              System.out.println(watcher.getState() + " " + timed.isAlive() + " " + scope.get() + " "
                      + Thread.State.valueOf("BLOCKED").ordinal());
              // a thread started and not waited for ends before the program does
              new Thread(() -> System.out.println("last")).start();
          }
      }
