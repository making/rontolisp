              System.out.println(kind("s") + " " + kind(o) + " " + kind(new CastsCircle()) + " " + kind(new CastsOther()) + " " + kind(null) + " " + kind(new int[0]) + " " + kind(new StringBuilder()));
              try {
                  CastsCircle circle = (CastsCircle) base;
                  System.out.println("not reached " + circle);
              } catch (ClassCastException e) {
                  System.out.println("a square is no circle");
              }
              try {
                  Object s = "s";
                  CastsShape wrong = (CastsShape) s;
                  System.out.println("not reached " + wrong);
              } catch (ClassCastException e) {
                  System.out.println("a string is no shape");
              }
              try {
                  String wrong = (String) o;
                  System.out.println("not reached " + wrong);
              } catch (RuntimeException e) {
                  System.out.println("a square is no string " + (e instanceof ClassCastException));
              }
          }
      }
