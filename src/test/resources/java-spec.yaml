  - name: a-string-has-its-everyday-surface-and-two-constants-of-a-text-are-one
    main: StringSurface
    source: |
      class StringSurface {
          static final String NAME = "abc";

          public static void main(String[] args) {
              String a = "abc", b = "ab" + "c", c = new String("abc"), part = "ab";
              String e = part + "c";
              System.out.println((a == b) + " " + (a == c) + " " + (a == c.intern()) + " " + (a == NAME) + " " + (a == e) + " " + (a != e) + " " + a.equals(e) + " " + (e.intern() == a));
              System.out.println("Hello".contains("ell") + " " + "Hello".startsWith("He") + " " + "Hello".startsWith("l", 2) + " " + "Hello".endsWith("lo") + " " + "Hello".indexOf('l') + " " + "Hello".indexOf('l', 3) + " " + "Hello".lastIndexOf('l') + " " + "Hello".indexOf("l", 3) + " " + "Hello".lastIndexOf("l") + " " + "Hello".indexOf("z") + " " + "Hello".equalsIgnoreCase("hELLO") + " " + "b".compareToIgnoreCase("A") + " " + " \t".isBlank() + " " + "x".concat("y") + " " + String.join("/", "a", "b", "c") + " " + "abc".charAt(1) + " " + "".isEmpty());
              System.out.println("|" + "  pad ".trim() + "|" + " x ".strip() + "|" + " x ".stripLeading() + "|" + " x ".stripTrailing() + "|" + "ab".repeat(3) + "|" + "a-b-c".replace('-', '+') + "|" + "aXbXc".replace("X", "--") + "|" + "ab".replace("", "-") + "|" + "Hello".toCharArray().length + "|" + String.valueOf(new char[] {'h', 'i'}) + "|" + new String(new char[] {'a', 'b', 'c'}, 1, 2) + "|" + "Hello".substring(1, 3) + "Hello".substring(3) + "|" + "MiXed".toUpperCase() + "MiXed".toLowerCase() + "|" + String.valueOf(3.5) + String.valueOf(true) + String.valueOf('c') + String.valueOf(7L));
              System.out.println(Arrays.toString("a,b,,c,,".split(",")) + Arrays.toString(" a  b ".split("\\s+")) + Arrays.toString("a1b22c".split("[0-9]+")) + Arrays.toString("a.b".split("\\.")) + Arrays.toString("a,b,c".split(",", 2)) + Arrays.toString("a,b,,".split(",", -1)) + Arrays.toString("".split(",")) + Arrays.toString("abc".split("")) + Arrays.toString("k=v; x=y".split("; ")) + Arrays.toString("a-b_c".split("[-_]")));
              StringBuilder sb = new StringBuilder("hello");
              sb.insert(0, "[").append(']').append(1.5).append(true).append(new char[] {'!'}).reverse().setCharAt(0, 'E');
              sb.reverse();
              sb.deleteCharAt(sb.length() - 1).delete(0, 1).replace(0, 1, "J");
              CharSequence chars = sb;
              System.out.println(sb + " " + sb.length() + " " + sb.indexOf("l") + " " + chars.length() + " " + chars.charAt(1) + " " + chars.subSequence(1, 3) + " " + "abc".subSequence(0, 2) + " " + sb.substring(2) + " " + sb.substring(1, 3) + " " + sb.isEmpty() + " " + chars.isEmpty() + " " + sb.charAt(0));
              sb.setLength(2);
              StringBuilder other = new StringBuilder(sb).append(sb).insert(1, 42).insert(0, 'c');
              System.out.println(sb + " " + other + " " + new StringBuilder(8).append("x").append(1L).append((Object) null).append((String) null) + " " + new StringBuffer("buf").reverse());
              rest();
          }

          // a code point, a search from the end, a region, the UTF-16 units, the indentation
          // and the order that ignores case; what a StringBuilder searches, compares and repeats
          static void rest() {
              String s = "hello, world; hello";
              System.out.println(s.codePointAt(4) + " " + s.codePointBefore(4) + " " + s.lastIndexOf('o', 17) + " " + s.lastIndexOf("hello", 13) + " " + s.lastIndexOf("", 100) + " " + s.lastIndexOf('o', -1) + " " + s.regionMatches(7, "a World", 2, 5) + " " + s.regionMatches(true, 7, "a World", 2, 5) + " " + s.regionMatches(0, "hello", 0, -1) + " " + s.regionMatches(15, "hello", 0, 5) + " " + s.contentEquals(new StringBuilder(s)) + " " + s.contentEquals("hello") + " " + String.copyValueOf(new char[] {'a', 'b', 'c'}, 1, 2) + String.copyValueOf(new char[] {'x'}) + String.valueOf(new char[] {'a', 'b', 'c'}, 0, 2));
              char[] into = {'.', '.', '.', '.', '.', '.', '.', '.'};
              s.getChars(7, 12, into, 2);
              System.out.println(new String(into) + "|" + "  a\n    b\r\n\tc\n\nd".indent(2).replace("\n", "/").replace("\t", "T") + "|" + "  a\n    b\n\tc".indent(-3).replace("\n", "/") + "|" + "".indent(4) + "|");
              try {
                  s.getChars(0, 9, into, 0);
              } catch (StringIndexOutOfBoundsException ex) {
                  System.out.println(ex.getMessage());
              }
              try {
                  s.codePointAt(19);
              } catch (StringIndexOutOfBoundsException ex) {
                  System.out.println(ex.getMessage());
              }
              List<String> names = new ArrayList<>(List.of("bob", "Alice", "carol", "Bob", "alice", "Z", "a"));
              names.sort(String.CASE_INSENSITIVE_ORDER);
              Comparator<String> order = String.CASE_INSENSITIVE_ORDER;
              System.out.println(names + " " + order.compare("abc", "ABD") + " " + order.reversed().compare("b", "A") + " " + (order == String.CASE_INSENSITIVE_ORDER));
              StringBuilder t = new StringBuilder("hello world hello");
              System.out.println(t.lastIndexOf("hello") + " " + t.lastIndexOf("hello", 5) + " " + t.indexOf("hello", 1) + " " + t.indexOf("", 50) + " " + t.compareTo(new StringBuilder("hello")) + " " + new StringBuilder("a").compareTo(new StringBuilder("b")) + " " + t.appendCodePoint(65).appendCodePoint(0x1F600) + " " + new StringBuilder().repeat("ab", 3).repeat('x', 2).repeat(0x1F600, 1).repeat((CharSequence) null, 1));
              try {
                  t.appendCodePoint(0x110000);
              } catch (IllegalArgumentException ex) {
                  System.out.println(ex.getMessage());
              }
              try {
                  t.repeat(-1, -1);
              } catch (IllegalArgumentException ex) {
                  System.out.println(ex.getMessage());
              }
              String range = "abcabc";
              System.out.println(range.codePointCount(1, 4) + " " + range.offsetByCodePoints(1, 3) + " " + range.offsetByCodePoints(6, -6) + " " + range.indexOf('c', 3, 5) + " " + range.indexOf('c', 3, 6) + " " + range.indexOf("bc", 2, 5) + " " + range.indexOf("bc", 2, 6) + " " + range.indexOf("", 6, 6));
              Runnable[] outside = {() -> range.codePointCount(4, 1), () -> range.offsetByCodePoints(1, 6), () -> range.indexOf('c', 2, 7), () -> range.indexOf("c", -1, 2)};
              for (Runnable each : outside) {
                  try {
                      each.run();
                  } catch (IndexOutOfBoundsException ex) {
                      System.out.println(ex);
                  }
              }
          }
      }
