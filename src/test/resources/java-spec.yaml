              StringReader sr = new StringReader("hello");
              System.out.println(sr.skip(2) + " " + (char) sr.read() + " " + sr.skip(-10) + " " + (char) sr.read() + sr.ready());
              BufferedInputStream bis = new BufferedInputStream(new ByteArrayInputStream(new byte[] {1, 2, 3, 4, 5, 6, 7}), 2);
