      record HashOrderKey(int id, String name) {
      }

      class HashOrderTag {
          final String text;

          HashOrderTag(String text) {
              this.text = text;
          }

          public boolean equals(Object o) {
              return o instanceof HashOrderTag other && other.text.equalsIgnoreCase(text);
          }

          public int hashCode() {
              return text.toLowerCase().hashCode();
          }

          public String toString() {
              return "#" + text;
          }
      }

      enum HashOrderColor {
          RED, GREEN
      }

      class HashOrder {
          public static void main(String[] args) {
              Map<String, Integer> counts = new HashMap<>();
              for (String w : "it was the best of times it was the worst of times it was the age of wisdom".split(" ")) {
                  counts.put(w, counts.getOrDefault(w, 0) + 1);
              }
              System.out.println(counts + " " + counts.size() + " " + counts.get("the") + " " + counts.get("cat") + " " + counts.containsKey("age") + " " + counts.containsValue(4) + " " + counts.keySet() + " " + counts.values());
              Map<String, Integer> merged = new HashMap<>();
              for (String w : "the quick brown fox jumps over the lazy dog the end".split(" ")) {
                  merged.merge(w, 1, Integer::sum);
              }
              StringBuilder walked = new StringBuilder();
              for (Map.Entry<String, Integer> entry : merged.entrySet()) {
                  walked.append(entry.getKey()).append(entry.getValue());
              }
              System.out.println(merged + " " + walked);
              Map<HashOrderKey, String> byKey = new HashMap<>();
              byKey.put(new HashOrderKey(1, "a"), "one");
              byKey.put(new HashOrderKey(2, "b"), "two");
              Map<HashOrderTag, Integer> byTag = new HashMap<>();
              byTag.put(new HashOrderTag("Java"), 1);
              byTag.put(new HashOrderTag("JAVA"), 2);
              Map<HashOrderColor, Integer> byColor = new HashMap<>();
              byColor.put(HashOrderColor.RED, 1);
              Map<Double, String> byDouble = new HashMap<>();
              byDouble.put(0.5, "half");
              byDouble.put(null, "none");
              System.out.println(byKey.get(new HashOrderKey(1, "a")) + " " + byKey.get(new HashOrderKey(3, "c")) + " " + byKey + " " + byTag + " " + byTag.get(new HashOrderTag("java")) + " " + byColor.get(HashOrderColor.RED) + " " + byColor.get(HashOrderColor.GREEN) + " " + byDouble.get(0.5) + byDouble.get(null) + byDouble.get(1.5));
              // the order tells the table's length: a copy, a putAll and a set are sized
              // from what they take
              for (int size : new int[] {1, 3, 12, 13, 25}) {
                  Map<Integer, Integer> source = new HashMap<>();
                  for (int i = 0; i < size; i++) {
                      source.put(i * 16 + (i % 3), i);
                  }
                  Map<Integer, Integer> filled = new HashMap<>();
                  filled.put(1000, 0);
                  filled.putAll(source);
                  Map<Integer, Integer> sized = new HashMap<>(size);
                  sized.putAll(source);
                  System.out.println(source.keySet() + " " + new HashMap<>(source).keySet() + " " + filled.keySet() + " " + new HashSet<>(source.keySet()) + " " + sized.keySet());
              }
              Set<Long> longs = new HashSet<>();
              for (long i = 0; i < 12; i++) {
                  longs.add(i * 4294967311L);
              }
              Set<Character> chars = new HashSet<>();
              for (char ch : "hello world".toCharArray()) {
                  chars.add(ch);
              }
              Set<Integer> ints = new HashSet<>();
              for (int i = 0; i < 40; i += 3) {
                  ints.add(i * 7 % 50);
              }
              System.out.println(longs + " " + chars + " " + new HashSet<>(List.of(0.5, 1.5, -2.25, 100.0, 1e10)) + " " + new HashSet<>(List.of(true, false)) + " " + ints + " " + ints.contains(21) + ints.remove(21) + ints.add(0) + ints.size());
              Map<String, Integer> m = new HashMap<>();
              m.put("x", 1);
              m.putIfAbsent("x", 5);
              m.putIfAbsent("y", 2);
              m.compute("x", (k, v) -> v + 10);
              m.computeIfPresent("y", (k, v) -> null);
              m.merge("z", 3, Integer::sum);
              m.replaceAll((k, v) -> v * 2);
              Map<String, List<Integer>> groups = new HashMap<>();
              for (int n : new int[] {5, 12, 7, 30}) {
                  groups.computeIfAbsent(n > 10 ? "big" : "small", k -> new ArrayList<>()).add(n);
              }
              StringBuilder each = new StringBuilder();
              m.forEach((k, v) -> each.append(k).append(v));
              m.entrySet().removeIf(e -> e.getValue() > 10);
              m.keySet().remove("nope");
              System.out.println(each + " " + m + " " + m.remove("z") + " " + m.isEmpty() + " " + m.getOrDefault("q", -1) + " " + groups + " " + m.equals(new HashMap<String, Integer>()) + " " + new HashMap<>(Map.of("a", 1)).hashCode() + " " + Map.of("a", 1).equals(new HashMap<>(Map.of("a", 1))));
              Set<String> set = new HashSet<>(List.of("b", "a", "c"));
              set.removeIf(s -> s.equals("b"));
              Iterator<String> it = set.iterator();
              it.next();
              it.remove();
              List<Map.Entry<String, Integer>> entries = new ArrayList<>(Map.of("b", 2).entrySet());
              entries.add(Map.entry("a", 1));
              entries.sort(Map.Entry.comparingByKey());
              System.out.println(set + " " + set.equals(Set.of("c")) + " " + new HashSet<>(List.of(1, 2)).hashCode() + " " + Set.of(1, 2).containsAll(List.of(1)) + " " + entries + " " + Map.of("k", 1).get("k") + " " + Map.of().isEmpty());
              try {
                  Map.of("k", 1).put("j", 2);
              } catch (UnsupportedOperationException e) {
                  System.out.println("fixed");
              }
          }
      }
