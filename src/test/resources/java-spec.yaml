  # A static final field of a primitive type or String with a constant initializer is
  # inlined, so the order of the classes does not matter; any other static field is set
  # before main, in order.
  - name: a-constant-variable-is-its-value-and-static-fields-are-set-in-order
    main: Statics
    source: |
      class StaticsEarly {
          static final int DOUBLE = StaticsLate.BASE * 2;
          static final String LABEL = "n=" + StaticsLate.BASE + StaticsLate.SUFFIX;
      }

      class StaticsLate {
          static final int BASE = 21;
          static final String SUFFIX = "!";
          static final long BIG = 1L << 40;
          static final boolean ON = BASE > 20;
          static final double HALF = BASE / 2.0;
      }

      class Statics {
          static final int LIMIT = 10;
          static int counter = LIMIT * 2;
          static int next = counter + 1;
          static int[] table = {1, 2, 3};
          static String unset;
          static boolean flag;
          static double ratio;

          static int bump() {
              return ++counter;
          }

          public static void main(String[] args) {
              System.out.println(StaticsEarly.DOUBLE + " " + StaticsEarly.LABEL + " " + StaticsLate.BIG + " " + StaticsLate.ON + " " + StaticsLate.HALF);
              System.out.println(counter + " " + next + " " + bump() + " " + Statics.counter + " " + table.length + " " + unset + " " + flag + " " + ratio);
              Statics.counter += 5;
              table[0] = counter;
              unset = "set";
              System.out.println(counter + " " + table[0] + " " + unset);
          }
      }
    expected: |
      42 n=21! 1099511627776 true 10.5
      20 21 21 21 3 null false 0.0
      26 26 set
  # new T[n] is filled with the default of T; an initializer lists the elements, nested
  # for an array of arrays.
  - name: an-array-is-a-vector-with-the-default-of-its-element-type
    main: ArrayBasics
    source: |
      class ArrayBasicsItem {
          int v;
      }

      class ArrayBasics {
          static int sum(int[] xs) {
              int s = 0;
              for (int x : xs) s += x;
              return s;
          }

          public static void main(String[] args) {
              int[] ints = new int[3];
              long[] longs = new long[2];
              double[] doubles = new double[2];
              boolean[] flags = new boolean[2];
              char[] chars = new char[2];
              String[] strings = new String[2];
              ArrayBasicsItem[] items = new ArrayBasicsItem[2];
              System.out.println(ints[0] + " " + longs[1] + " " + doubles[0] + " " + flags[1] + " " + (int) chars[0] + " " + strings[1] + " " + items[0] + " " + args.length);
              int[] xs = {3, 1, 4, 1, 5, 9, 2, 6};
              for (int i = 0; i < xs.length; i++) {
                  for (int j = 0; j + 1 < xs.length - i; j++) {
                      if (xs[j] > xs[j + 1]) {
                          int t = xs[j];
                          xs[j] = xs[j + 1];
                          xs[j + 1] = t;
                      }
                  }
              }
              StringBuilder sb = new StringBuilder();
              for (int x : xs) sb.append(x).append(',');
              int[] alias = xs;
              alias[0] = 100;
              System.out.println(sb + " " + sum(xs) + " " + sum(new int[] {1, 2, 3}) + " " + xs[0] + " " + new int[0].length);
              int[][] grid = {{1, 2, 3}, {4, 5}, {}};
              int[][] rows = new int[2][];
              rows[1] = new int[] {7, 8};
              String[][] names = {{"a"}, {"b", "c"}};
              int cells = 0;
              for (int[] row : grid) cells += row.length;
