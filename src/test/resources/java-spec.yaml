          // a pool of a program's own: so many threads, a queue, and what becomes of a task it cannot take
          static void aPoolOfTheProgramsOwn() throws Exception {
              CountDownLatch gate = new CountDownLatch(1);
              List<String> ran = Collections.synchronizedList(new ArrayList<>());
              ThreadPoolExecutor pool = new ThreadPoolExecutor(1, 2, 1, TimeUnit.SECONDS, new ArrayBlockingQueue<>(1));
              System.out.println(shown(pool));
              Runnable waiting = () -> {
                  try {
                      gate.await();
                  }
                  catch (InterruptedException e) {
                      ran.add(e.toString());
                  }
                  ran.add(Thread.currentThread().getName());
              };
              pool.execute(waiting);
              pool.execute(waiting);
              pool.execute(waiting);
              System.out.println(pool.getPoolSize() + " " + pool.getQueue().size() + " " + pool.getCorePoolSize() + " "
                      + pool.getMaximumPoolSize() + " " + pool.getLargestPoolSize() + " "
                      + pool.getKeepAliveTime(TimeUnit.MILLISECONDS));
              try {
                  pool.execute(waiting);
              }
              catch (RejectedExecutionException e) {
                  System.out.println("no room for a fourth task");
              }
              pool.setRejectedExecutionHandler(new ThreadPoolExecutor.CallerRunsPolicy());
              pool.execute(() -> ran.add("the caller, " + Thread.currentThread().getName()));
              pool.setRejectedExecutionHandler(new ThreadPoolExecutor.DiscardPolicy());
              pool.execute(() -> ran.add("discarded"));
              pool.setRejectedExecutionHandler(new ThreadPoolExecutor.DiscardOldestPolicy());
              pool.execute(() -> ran.add("in the place of the oldest"));
              pool.setRejectedExecutionHandler((task, executor) -> ran.add("the handler, asked by its pool " + (executor == pool)));
              pool.execute(waiting);
              gate.countDown();
              pool.shutdown();
              System.out.println(pool.awaitTermination(60, TimeUnit.SECONDS) + " " + pool.getCompletedTaskCount() + " "
                      + pool.getTaskCount() + " " + shown(pool));
              Collections.sort(ran);
              System.out.println(ran);
              attempt(() -> new ThreadPoolExecutor(2, 1, 0, TimeUnit.SECONDS, new LinkedBlockingQueue<>()));
              attempt(() -> new ThreadPoolExecutor(1, 1, 0, TimeUnit.SECONDS, null));
              attempt(() -> {
                  new ThreadPoolExecutor(1, 1, 0, TimeUnit.SECONDS, new LinkedBlockingQueue<>()).allowCoreThreadTimeOut(true);
                  return "allowed";
              });
              ThreadPoolExecutor direct = new ThreadPoolExecutor(0, 3, 1, TimeUnit.SECONDS, new SynchronousQueue<>());
              CountDownLatch open = new CountDownLatch(1);
              for (int i = 0; i < 3; i++) {
                  direct.execute(() -> {
                      try {
                          open.await();
                      }
                      catch (InterruptedException e) {
                          System.out.println(e);
                      }
                  });
              }
              System.out.println(direct.getPoolSize() + " " + direct.getQueue().size() + " " + direct.getQueue());
              open.countDown();
              direct.shutdown();
              System.out.println(direct.awaitTermination(60, TimeUnit.SECONDS) + " " + direct.getLargestPoolSize());
          }

          // a future answers what it holds with no wait; of several tasks the first answer is the answer
          static void answers() throws Exception {
              ExecutorService one = Executors.newSingleThreadExecutor();
