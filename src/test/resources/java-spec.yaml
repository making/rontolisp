  # throw signals one condition type holding the object; the catch clauses are one
  # handler-case clause testing its class, each with its own parameter, signalling again
  # when none takes it; finally is unwind-protect.
  - name: try-catch-finally-over-one-condition-holding-the-thrown-object
    main: Exceptions
    source: |
      class ExceptionsApp extends Exception {
          final int code;

          ExceptionsApp(String message, int code) {
              super(message);
              this.code = code;
          }
      }

      class ExceptionsFatal extends RuntimeException {
          ExceptionsFatal() {
          }
      }

      class Exceptions {
          static String log = "";

          static int risky(int n) throws ExceptionsApp {
              if (n == 1) throw new ExceptionsApp("one", 11);
              if (n == 2) throw new IllegalStateException("two");
              if (n == 3) throw new ExceptionsFatal();
              if (n == 4) throw new IllegalArgumentException();
              return n;
          }

          static String attempt(int n) {
              try {
                  return "ok " + risky(n);
              } catch (ExceptionsApp e) {
                  return "app " + e.getMessage() + " " + e.code;
              } catch (IllegalStateException ex) {
                  return "ise " + ex.getMessage();
              } catch (RuntimeException re) {
                  return "rt " + (re instanceof ExceptionsFatal) + " " + re.getMessage();
              } finally {
                  log += n;
              }
          }

          static int nested() {
              int r = 0;
              for (int i = 0; i < 5; i++) {
                  try {
                      try {
                          if (i == 1) continue;
                          if (i == 3) break;
                          if (i == 2) throw new IllegalArgumentException("inner");
                          r += 1;
                      } finally {
                          r += 10;
                      }
                  } catch (IllegalArgumentException e) {
                      r += 100;
                  }
              }
              return r;
          }

          static int early() {
              try {
                  return 1;
              } finally {
                  log += "F";
              }
          }

          static String rethrown() {
              try {
                  try {
                      throw new IllegalStateException("first");
                  } catch (IllegalArgumentException e) {
                      return "wrong clause";
                  } finally {
                      log += "G";
                  }
              } catch (RuntimeException e) {
                  try {
                      throw new ExceptionsApp(e.getMessage() + " again", 2);
                  } catch (Exception inner) {
                      return inner.getMessage();
                  }
              }
          }

          public static void main(String[] args) {
              for (int i = 0; i <= 4; i++) System.out.println(attempt(i));
              System.out.println(log + " " + nested() + " " + early() + " " + rethrown() + " " + log);
              try {
                  throw new Error("err");
              } catch (Throwable th) {
                  System.out.println(th + " | " + th.getMessage() + " | " + new ExceptionsFatal() + " | " + new ExceptionsApp("m", 1) + " | " + new RuntimeException().getMessage());
              }
              named();
              System.out.println(checked());
          }

          // what a compiler lets a body throw: what a clause takes or the method declares. A
          // catch parameter thrown again throws what its try left it, a type parameter of a
          // throws clause is what a lambda's body or a method reference's method throws, a
          // resource's close() and a constructor an anonymous class hands its arguments to
          // throw where they stand, and a finally that never completes drops what its try
          // threw -- its own return over the try's, which the JVM compiled without end
          interface Task<X extends Exception> {
              int run() throws X;
          }

          static class Resource implements AutoCloseable {
              final int code;

              Resource(int code) throws ExceptionsApp {
                  this.code = risky(code);
              }

              public void close() throws ExceptionsApp {
                  throw new ExceptionsApp("closed", code);
              }
          }

          static <X extends Exception> int call(Task<X> task) throws X {
              return task.run();
          }

          static int again(int n) throws ExceptionsApp {
              try {
                  return risky(n);
              } catch (Exception e) {
                  log += "R";
                  throw e;
              }
          }

          static int dropped() {
              for (;;) {
                  try {
                      again(1);
                  } finally {
                      break;
                  }
              }
              try {
                  return again(1);
              } finally {
                  return 4;
              }
          }

          static String checked() {
              String out = "" + call(() -> 7) + call(Exceptions::dropped);
              try {
                  out += call(() -> again(5));
                  out += call(() -> again(1));
              } catch (ExceptionsApp e) {
                  out += " " + e.getMessage() + e.code;
              }
              try (Resource first = new Resource(5); Resource second = new Resource(1)) {
                  out += " in" + first.code + second.code;
              } catch (ExceptionsApp e) {
                  out += " " + e.getMessage() + e.code + e.getSuppressed().length;
              }
              try (Resource only = new Resource(6)) {
                  out += " in" + only.code;
              } catch (ExceptionsApp e) {
                  out += " " + e.getMessage() + e.code;
              }
              try {
                  out += " " + new String("ab".getBytes("UTF-8"), "ISO-8859-1").length();
                  java.util.concurrent.Callable<Integer> task = () -> again(2);
                  out += task.call();
              } catch (UnsupportedEncodingException | ExceptionsApp e) {
                  out += " never";
              } catch (Exception e) {
                  out += " " + e.getMessage();
              }
              Object made = new Resource[0];
              try {
                  made = new Resource(1) {
                      int more = again(0);
                  };
              } catch (ExceptionsApp e) {
                  out += " " + (made instanceof Resource[]) + e.code;
              }
              return out + " " + log;
          }

          // the errors and exceptions a program names beside its own, and a frame as a program
          // makes one: no frame of a thrown exception is kept
          static void named() {
              Throwable[] all = {new AssertionError(), new AssertionError("detail"), new AssertionError(5), new AssertionError((Object) null), new AssertionError('c'), new AssertionError(1.5), new AssertionError(7L), new AssertionError("with cause", new RuntimeException("why")), new AssertionError(new RuntimeException("as detail")), new ArrayStoreException("java.lang.Integer"), new StackOverflowError(), new OutOfMemoryError("Java heap space"), new SecurityException("denied", new RuntimeException("c")), new SecurityException(new RuntimeException("c")), new FileNotFoundException("a.txt (No such file or directory)"), new java.util.InputMismatchException("For input string: \"x\"")};
              for (Throwable each : all) {
                  System.out.println(each + " | " + each.getCause() + " | " + (each instanceof RuntimeException) + " " + (each instanceof Error) + " " + (each instanceof IOException) + " " + (each instanceof VirtualMachineError) + " " + (each instanceof NoSuchElementException));
              }
              try {
                  throw new AssertionError("caught");
              } catch (Error e) {
                  StackTraceElement frame = new StackTraceElement("a.B", "run", "B.java", 12);
                  System.out.println(e + " " + frame + " " + frame.getClassName() + " " + frame.getMethodName() + " " + frame.getFileName() + " " + frame.getLineNumber() + " " + new StackTraceElement("a.B", "run", null, -1) + " " + new StackTraceElement("a.B", "run", "B.java", -2) + " " + frame.equals(new StackTraceElement("a.B", "run", "B.java", 12)) + " " + (e.fillInStackTrace() == e));
              }
          }
      }
