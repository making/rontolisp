      public class MainDies {
          public static void main(String[] args) {
              Object lock = new Object();
              synchronized (lock) {
                  new Thread(() -> {
                      synchronized (lock) {
                          System.out.println("the thread ends after main died");
                      }
                  }).start();
                  System.out.println("main dies");
              }
              throw new IllegalStateException("main is gone");
          }
      }
