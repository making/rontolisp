  # ? extends T is read as T and written with nothing but null, ? super T written with a
  # T and read as Object; a method taking List<T> takes a List<?>. A raw type reads its
  # members erased.
  - name: a-wildcard-is-captured-where-a-member-is-read-through-it
    main: Wildcards
    source: |
      class Wildcards {
          interface Shape {
              double area();
          }

          record Circle(double r) implements Shape {
              public double area() {
                  return 3 * r * r;
              }
          }

          static class Holder<T> {
              T held;

              Holder(T held) {
                  this.held = held;
              }
          }

          static double total(List<? extends Shape> shapes) {
              double sum = 0;
              for (Shape s : shapes) {
                  sum += s.area();
              }
              return sum + shapes.get(0).area();
          }

          static void fill(List<? super Integer> out, int n) {
              for (int i = 0; i < n; i++) {
                  out.add(i);
              }
              Object first = out.get(0);
              out.set(0, 9);
          }

          static int count(List<?> xs) {
              Object first = xs.isEmpty() ? null : xs.get(0);
              return xs.size() + (first == null ? 0 : 100);
          }

          static void reverse(List<?> xs) {
              reverseCaptured(xs);
          }

          private static <T> void reverseCaptured(List<T> xs) {
              for (int i = 0, j = xs.size() - 1; i < j; i++, j--) {
                  T t = xs.get(i);
                  xs.set(i, xs.get(j));
                  xs.set(j, t);
              }
          }

          static String peek(Holder<?> holder) {
              Object o = holder.held;
              return "<" + o + ">";
          }

          static <T> void copy(List<? super T> to, List<? extends T> from) {
              for (T each : from) {
                  to.add(each);
              }
          }

          @SuppressWarnings({ "rawtypes", "unchecked" })
          static int raw(List xs, Holder holder) {
              xs.add("raw");
              Object held = holder.held;
              holder.held = xs.get(0);
              return xs.size();
          }

          public static void main(String[] args) {
              List<Circle> circles = new ArrayList<>();
              circles.add(new Circle(1));
              circles.add(new Circle(2));
              List<Object> objects = new ArrayList<>();
              fill(objects, 3);
              objects.add("x");
              System.out.println(total(circles) + " " + objects + " " + count(objects) + " " + count(new ArrayList<String>()));
              reverse(objects);
              List<Shape> shapes = new ArrayList<>();
              copy(shapes, circles);
              Holder<String> holder = new Holder<>("held");
              Holder<? extends Object> any = holder;
              Holder<? super String> lower = holder;
              lower.held = "set";
              System.out.println(objects + " " + shapes.size() + " " + total(shapes) + " " + peek(holder) + " " + peek(new Holder<>(1)) + " " + any.held + " " + raw(objects, holder) + " " + peek(holder));
          }
      }
