  # try-with-resources is the statement the language specifies: the resources closed in
  # reverse, a null one skipped, an exception of close suppressed by the body's, a
  # return leaving through the closing; a finally may return, break and continue.
  - name: try-with-resources-finally-exits-and-causes
    main: Resources
    source: |
      class ResourcesHandle implements AutoCloseable {
          final String name;
          final boolean fails;

          ResourcesHandle(String name, boolean fails) {
              this.name = name;
              this.fails = fails;
              System.out.println("open " + name);
          }

          public void close() {
              System.out.println("close " + name);
              if (fails) {
                  throw new IllegalStateException("close " + name);
              }
          }
      }

      class Resources {
          static String use(boolean bodyFails, boolean closeFails) {
              try (ResourcesHandle a = new ResourcesHandle("a", closeFails); ResourcesHandle none = null;
                   ResourcesHandle b = new ResourcesHandle("b", false)) {
                  if (bodyFails) {
                      throw new IllegalArgumentException("body");
                  }
                  return "returned " + a.name + b.name;
              } catch (RuntimeException e) {
                  return e + " suppressed " + Arrays.toString(e.getSuppressed());
              } finally {
                  System.out.println("finally");
              }
          }

          static int named(ResourcesHandle given) {
              try (given) {
                  return given.name.length();
              }
          }

          static int exits() {
              int total = 0;
              for (int i = 0; i < 6; i++) {
                  try {
                      if (i == 1 || i == 3) {
                          throw new IllegalStateException("lost " + i);
                      }
                      total += 10;
                  } finally {
                      if (i == 1) {
                          continue;
                      }
                      if (i == 3) {
                          break;
                      }
                      total += 1;
                  }
              }
              return total;
          }

          @SuppressWarnings("finally")
          static String overrides() {
              try {
                  throw new IllegalStateException("discarded");
              } finally {
                  return "the finally's";
              }
          }

          public static void main(String[] args) {
              System.out.println(use(false, false));
              System.out.println(use(true, true));
              System.out.println(use(false, true));
              System.out.println(named(new ResourcesHandle("given", false)));
              System.out.println(exits() + " " + overrides());
              RuntimeException outer = new RuntimeException("outer", new IllegalStateException("inner"));
              Exception free = new Exception("free");
              System.out.println(outer.getCause() + " | " + new RuntimeException(new Error("wrapped")).getMessage() + " | " + new RuntimeException((Throwable) null).getMessage() + " | " + free.getCause() + " | " + new IndexOutOfBoundsException(3).getMessage());
              try {
                  free.initCause(free);
              } catch (IllegalArgumentException e) {
                  System.out.println(e.getMessage() + " " + (e.getCause() == free));
              }
              free.initCause(null);
              try {
                  free.initCause(outer);
              } catch (IllegalStateException e) {
                  System.out.println(e.getMessage());
              }
              try {
                  free.addSuppressed(null);
              } catch (NullPointerException e) {
                  System.out.println(e.getMessage());
              }
              free.addSuppressed(outer);
              System.out.println(free.getSuppressed().length + " " + free.getSuppressed()[0].getLocalizedMessage());
          }
      }
