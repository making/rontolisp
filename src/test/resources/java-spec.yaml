      [x, 2, 1, 9] 2 18.0 <set> <1> set 5 <x>
  # A lambda is a function. Where instanceof, a cast or a default method tells which
  # interface a lambda was made for, the lambdas of that interface are structures
  # holding the function, each tested by its own predicate. One cast to an intersection
  # is made for an interface extending each.
  - name: a-lambda-is-a-function-until-the-program-can-tell-its-interface
    main: LambdaKinds
    source: |
      class LambdaKinds {
          interface Named {
              String name();

              default String greet() {
                  return "hello " + name();
              }
          }

          interface Loud extends Named {
              default String greet() {
                  return "HELLO " + name();
              }
          }

          interface Task {
              void run();
          }

          interface Job {
              int run(int x);

              default Job twice() {
                  return x -> run(run(x));
              }
          }

          static class Doubler implements Job {
              public int run(int x) {
                  return x * 2;
              }
          }

          record Person(String name) implements Named {
          }

          interface Marked {
          }

          interface Shouting {
              default String shout() {
                  return "SHOUT";
              }
          }

          static String describe(Object o) {
              if (o instanceof Loud l) {
                  return "loud:" + l.greet();
              }
              if (o instanceof Named n) {
                  return "named:" + n.greet();
              }
              if (o instanceof Task) {
                  return "task";
              }
              if (o instanceof Job j) {
                  return "job:" + j.run(1);
              }
              return "other";
          }

          public static void main(String[] args) {
              Named plain = () -> "ann";
              Loud loud = () -> "bob";
              Named asNamed = loud;
              Task task = () -> System.out.println("ran");
              Job job = x -> x + 1;
              Object[] all = { plain, loud, task, job, new Person("cy"), new Doubler(), "str" };
              for (Object o : all) {
                  System.out.println(describe(o));
              }
              System.out.println(plain.greet() + " " + asNamed.greet() + " " + new Person("di").greet());
              task.run();
              Named back = (Named) all[1];
              try {
                  Task wrong = (Task) all[0];
                  wrong.run();
              }
              catch (ClassCastException e) {
                  System.out.println("a Named is no Task");
              }
              System.out.println(job.twice().run(5) + " " + new Doubler().twice().run(5) + " " + ((Job) all[3]).run(9) + " " + back.greet() + " " + (all[2] instanceof Runnable) + " " + (all[0] == plain) + " " + plain.equals(loud));
              // a lambda cast to an intersection is an instance of each of its interfaces
              Task marked = (Task & Marked) () -> System.out.println("marked ran");
              Object shouting = (Shouting & Job) x -> x * 10;
              Object reference = (Named & Marked) new Person("ed")::name;
              marked.run();
              System.out.println((marked instanceof Marked) + " " + (task instanceof Marked) + " " + describe(marked) + " " + ((Shouting) shouting).shout() + ((Job) shouting).run(4) + " " + describe(shouting) + " " + (reference instanceof Marked m ? describe(m) : "-") + " " + (shouting instanceof Marked));
          }
      }
