    source: |
      class DurationCase {
          static String parts(Duration d) {
              return d + " " + d.getSeconds() + "+" + d.getNano() + " " + d.toDays() + "d" + d.toHours() + "h" + d.toMinutes() + "m" + d.toSeconds() + "s "
                      + d.toDaysPart() + "/" + d.toHoursPart() + "/" + d.toMinutesPart() + "/" + d.toSecondsPart() + "/" + d.toMillisPart() + "/" + d.toNanosPart()
                      + " " + d.isZero() + d.isNegative() + d.isPositive() + " " + d.hashCode();
          }

          static void attempt(String what, Supplier<Object> made) {
              try {
                  System.out.println(what + ": " + made.get());
              }
              catch (DateTimeParseException e) {
                  System.out.println(what + ": " + e + " [" + e.getParsedString() + "] " + e.getErrorIndex() + " / " + e.getCause());
              }
              catch (RuntimeException e) {
                  System.out.println(what + ": " + e);
              }
          }

          public static void main(String[] args) {
              System.out.println(parts(Duration.ZERO) + " | " + parts(Duration.ofSeconds(90061, 123456789)) + " | " + parts(Duration.ofDays(2)));
              System.out.println(parts(Duration.ofMillis(-1500)) + " | " + parts(Duration.ofNanos(-1)) + " | " + parts(Duration.ofSeconds(-3661, -5)));
              System.out.println(Duration.ofHours(25) + " " + Duration.ofMinutes(61) + " " + Duration.ofSeconds(1, 1500000000) + " " + Duration.ofSeconds(3, -1)
                      + " " + Duration.ofMillis(1) + " " + Duration.ofSeconds(Long.MAX_VALUE, 999999999) + " " + Duration.ofSeconds(Long.MIN_VALUE));
              Duration d = Duration.ofSeconds(3661, 5);
              System.out.println(d.plus(Duration.ofMillis(-1500)) + " " + d.minus(d) + " " + d.plusDays(1).plusHours(-1).plusMinutes(2).plusSeconds(-3).plusMillis(1500).plusNanos(-6)
                      + " " + d.minusDays(1).minusHours(-1).minusMinutes(2).minusSeconds(-3).minusMillis(1500).minusNanos(-6) + " " + d.negated() + " " + d.negated().abs()
                      + " " + d.withSeconds(7) + " " + d.withNanos(7) + " " + (d.minus(d) == Duration.ZERO));
              System.out.println(d.multipliedBy(3) + " " + d.multipliedBy(-1000000007L) + " " + Duration.ofNanos(-1).multipliedBy(Long.MIN_VALUE) + " " + d.multipliedBy(0)
                      + " " + d.toMillis() + " " + d.toNanos() + " " + Duration.ofNanos(-1).toMillis() + " " + Duration.ofMillis(-1500).toNanos()
                      + " " + Duration.ofSeconds(9223372036854775L, 807000000).toMillis() + " " + Duration.ofSeconds(-9223372037L, 145224192).toNanos());
              attempt("days", () -> Duration.ofDays(106751991167301L));
              attempt("seconds", () -> Duration.ofSeconds(Long.MAX_VALUE, 1000000000));
              attempt("plus", () -> Duration.ofSeconds(Long.MAX_VALUE).plusNanos(1000000000));
              attempt("times", () -> Duration.ofSeconds(Long.MAX_VALUE, 999999999).multipliedBy(Long.MIN_VALUE));
              attempt("negated", () -> Duration.ofSeconds(Long.MIN_VALUE).negated());
              attempt("millis", () -> Duration.ofSeconds(9223372036854775L, 808000000).toMillis());
              attempt("nanos", () -> Duration.ofSeconds(-9223372037L, 145224191).toNanos());
              attempt("nano of second", () -> Duration.ZERO.withNanos(1000000000));
              Duration half = Duration.ofMillis(500);
              Map<Duration, String> named = new HashMap<>();
              named.put(Duration.ofMinutes(1), "a minute");
              System.out.println(half.compareTo(Duration.ofSeconds(1)) + " " + Duration.ofSeconds(-1).compareTo(Duration.ofMillis(-1500)) + " " + half.compareTo(Duration.ofNanos(500000000))
                      + " " + half.equals(Duration.ofNanos(500000000)) + " " + half.equals("PT0.5S") + " " + named.get(Duration.ofSeconds(60)) + " " + named.get(Duration.ofSeconds(61)));
              for (String text : new String[] { "PT8H6M12.345S", "p2dt3h4m", "-PT-0.5S", "PT-0.5S", "P1DT-24H", "PT1,5S", "PT1.S", "+PT+1H-1M", "PT0.000000001S",
                      "PT.5S", "P1DT", "PT1M1H", "P1H", "PT1.1234567890S", " PT1S", "PT9223372036854775808S", "P106751991167301D", "P106751991167300DT24H",
                      "-PT-9223372036854775808S" }) {
                  attempt(text, () -> parts(Duration.parse(text)));
              }
              attempt("no text", () -> Duration.parse(null));
              attempt("a builder", () -> Duration.parse(new StringBuilder("PT20M")));
          }
      }
