          InitB() { System.out.println("B()"); }
      }

      class InitSnapshot { static int taken = StaticInit.counter * 2; }

      class InitMade {
          static final InitMade ONE = new InitMade("one");
          final String n;

          InitMade(String n) { this.n = n; System.out.println("made " + n); }
      }

      enum InitLoud { X, Y; static { System.out.println("an enum too"); } }

      class InitCycle1 { static int a = InitCycle2.b + 1; }

      class InitCycle2 { static int b = InitCycle1.a + 1; }

      class InitTable {
          static final HashMap<String, Integer> CODES = new HashMap<>();
          static final ArrayList<String> NAMES = new ArrayList<>();
          static final int[] SQUARES = new int[4];
          static final int SIZE;
          static {
              CODES.put("a", 1);
              CODES.put("b", 2);
              NAMES.add("first");
              for (int i = 0; i < SQUARES.length; i++) SQUARES[i] = i * i;
              SIZE = CODES.size() + NAMES.size();
          }
          static final InitTable DEFAULT = new InitTable(SIZE);
          final int n;

          InitTable(int n) { this.n = n; }
      }

      class InitUses {
          static final int FROM = InitTable.SIZE + InitTable.DEFAULT.n;
          static final InitLoud FIRST = InitLoud.X;
