      point 3; other PatternPoint[x=-1, y=0]; string 3; other 3
      null!, big 42, int 7, str s, diag 3, pt 3, shape, ?
      empty text leaf4 other x<y 1 2 done point 1 true done false
      a pattern switch over null throws
