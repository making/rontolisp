  # What a compiler warns of as unchecked is printed on standard error before the
  # program runs, as a JDK prints it, by the interpreter and by a compile; a declaration
  # annotated @SuppressWarnings("unchecked") says none of its own (`warnings`). So is a
  # catch clause that every exception of its try it could take was taken before.
  - name: the-unchecked-warnings-are-printed-before-the-program-runs
    file: Unchecked.java
    source: |
      import java.util.*;

      public class Unchecked {
          static class Box<T> {
              T value;

              Box(T value) {
                  this.value = value;
              }

              void set(T value) {
                  this.value = value;
              }
          }

          static int count(List<String> xs) {
              return xs.size();
          }

          static <T> List<T> listOf(T... xs) {
              return new ArrayList<>(Arrays.asList(xs));
          }

          static <T> T unsafe(Object o) {
              return (T) o;
          }

          @SuppressWarnings("unchecked")
          static <T> T quiet(Object o) {
              return (T) o;
          }

          public static void main(String[] args) {
              List raw = new ArrayList();
              raw.add("x");
              List<String> strings = raw;
              Box box = new Box("b");
              box.set(1);
              box.value = 2;
              @SuppressWarnings("unchecked") List<String> named = raw;
              Map<String, Integer> map = (Map<String, Integer>) new HashMap();
              System.out.println(count(raw) + " " + listOf(strings, named).size() + " " + box.value + " " + map.size() + " " + Unchecked.<String>unsafe("u") + quiet("q"));
              try {
                  if (raw.isEmpty()) {
                      throw new java.io.FileNotFoundException("none");
                  }
              } catch (java.io.FileNotFoundException e) {
              } catch (java.io.IOException e) {
              }
          }
      }
