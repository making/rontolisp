      class BoxMembers {
          public static void main(String[] args) {
              System.out.println(Integer.toBinaryString(10) + " " + Integer.toHexString(-1) + " " + Integer.toOctalString(8) + " " + Integer.toString(255, 16) + " " + Integer.toString(-255, 2) + " " + Integer.parseInt("ff", 16) + " " + Integer.parseInt("+12") + " " + Integer.valueOf("12") + " " + Long.parseLong("-9000000000") + " " + Long.toBinaryString(5L) + " " + Long.toHexString(-1L) + " " + Integer.bitCount(255) + " " + Long.bitCount(-1L) + " " + Integer.signum(-9) + " " + Integer.compare(1, 2) + " " + Integer.sum(1, 2) + Integer.max(1, 2) + Integer.min(1, 2) + " " + Long.MAX_VALUE + " " + Integer.MIN_VALUE);
              System.out.println(Double.parseDouble("3.25e2") + " " + Double.parseDouble("0.1") + " " + Double.parseDouble(" -1.5 ") + " " + Double.parseDouble("1e-320") + " " + Double.parseDouble("1.7976931348623157e308") + " " + Double.parseDouble("123456789012345678901234567890") + " " + Double.valueOf("1.5") + " " + Double.MAX_VALUE + " " + Double.MIN_VALUE + " " + Double.POSITIVE_INFINITY + " " + Double.NEGATIVE_INFINITY + " " + Double.NaN + " " + Double.isNaN(0.0 / 0.0) + " " + Double.isInfinite(1 / 0.0) + " " + Double.isFinite(1.5) + " " + Double.compare(0.0, -0.0) + " " + Double.toString(1e21) + " " + Double.sum(1.5, 2) + " " + Double.max(-0.0, 0.0) + " " + Double.min(-0.0, 0.0));
              System.out.println(Double.doubleToLongBits(1.0) + " " + Double.doubleToLongBits(-0.0) + " " + Double.doubleToLongBits(5e-324) + " " + Double.doubleToLongBits(-2.5) + " " + Double.doubleToLongBits(1e308) + " " + Double.valueOf(2.5).hashCode() + " " + Double.hashCode(0.1) + " " + Double.valueOf(0.0).equals(-0.0) + " " + Double.valueOf(Double.NaN).equals(Double.NaN) + " " + new SourceListsPoint(1, "a").hashCode());
              System.out.println(Boolean.parseBoolean("TRUE") + " " + Boolean.parseBoolean("yes") + " " + Boolean.TRUE + " " + Boolean.valueOf("true").compareTo(false) + " " + Boolean.logicalXor(true, false) + " " + Boolean.toString(false) + " " + Character.isDigit('7') + " " + Character.isLetter('x') + " " + Character.isLetterOrDigit('_') + " " + Character.isWhitespace(' ') + " " + Character.isUpperCase('Q') + " " + Character.isLowerCase('Q') + " " + Character.toUpperCase('q') + Character.toLowerCase('Q') + " " + Character.getNumericValue('9') + " " + Character.digit('f', 16) + " " + (int) Character.forDigit(11, 16) + " " + Character.valueOf('x').compareTo('y') + " " + Character.toString('c') + " " + (int) Character.MAX_VALUE);
              Number n = 42;
              Number m = 2.5;
              Number l = 7L;
