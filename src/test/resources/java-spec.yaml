              Future<String> bad = one.submit(() -> {
                  throw new IllegalArgumentException("b");
              });
              try {
                  bad.get();
              }
              catch (ExecutionException e) {
                  System.out.println(shown(bad));
              }
              FutureTask<String> idle = new FutureTask<>(() -> "i");
              FutureTask<String> dropped = new FutureTask<>(() -> "d");
              dropped.cancel(false);
              ok.get();
              System.out.println(ok.state() + " " + bad.state() + " " + idle.state() + " " + dropped.state() + " "
                      + ok.resultNow() + " " + bad.exceptionNow() + " " + shown(ok) + " " + shown(dropped));
              attempt(() -> idle.resultNow());
              attempt(() -> bad.resultNow());
              attempt(() -> dropped.resultNow());
              attempt(() -> idle.exceptionNow());
              attempt(() -> ok.exceptionNow());
              attempt(() -> dropped.exceptionNow());
              attempt(() -> one.invokeAny(List.of(() -> {
                  throw new IllegalStateException("first");
              }, () -> "second", () -> "third")));
              attempt(() -> one.invokeAny(List.<Callable<String>>of(() -> {
                  throw new IllegalStateException("first");
              }, () -> {
                  throw new IllegalArgumentException("last");
              })));
              attempt(() -> one.invokeAny(new ArrayList<Callable<String>>()));
              attempt(() -> one.invokeAny(List.of(() -> "in time"), 60, TimeUnit.SECONDS));
              one.shutdown();
              ReentrantLock lock = new ReentrantLock();
              lock.lock();
              System.out.println(shown(lock) + " " + shown(new ReentrantLock()) + " " + shown(new CountDownLatch(2)) + " "
                      + shown(new Semaphore(3)));
