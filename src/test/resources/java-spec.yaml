      class ByteStreams {
          public static void main(String[] args) {
              try {
                  run();
              } catch (IOException e) {
                  throw new UncheckedIOException(e);
              }
              wide();
          }

          static void run() throws IOException {
              ByteArrayOutputStream out = new ByteArrayOutputStream();
              out.write(65);
              out.write("héllo€".getBytes());
              out.write(new byte[] {119, 120, 121, 122}, 1, 2);
              System.out.println(out.size());
              System.out.println(Arrays.toString(out.toByteArray()));
              System.out.println(out.toString());
              byte[] bs = "héllo".getBytes(StandardCharsets.UTF_8);
              System.out.println(bs.length + " " + new String(bs, StandardCharsets.UTF_8) + " " + new String(bs, 0, 1));
              System.out.println(Arrays.toString("héllo€".getBytes(StandardCharsets.ISO_8859_1)));
              System.out.println(Arrays.toString("héllo€".getBytes("US-ASCII")));
              System.out.println(new String(new byte[] {104, (byte) 233}, StandardCharsets.ISO_8859_1));
              System.out.println(new String(new byte[] {104, (byte) 233}, "ascii").length());
              ByteArrayInputStream in = new ByteArrayInputStream(out.toByteArray());
              System.out.println(in.read() + " " + in.available());
              byte[] buf = new byte[4];
              System.out.println(in.read(buf) + " " + Arrays.toString(buf));
              in.mark(0);
              System.out.println(in.skip(2) + " " + in.read());
              in.reset();
              System.out.println(in.read() + " " + Arrays.toString(in.readAllBytes()) + " " + in.read() + " " + in.read(buf, 0, 0));
              DataOutputStream data = new DataOutputStream(out);
              out.reset();
              data.writeInt(-2);
              data.writeLong(1L << 40);
              data.writeDouble(-0.5);
              data.writeFloat(1.5f);
              data.writeUTF("aé€\u0000z");
              data.writeBoolean(true);
              data.writeShort(-3);
              data.writeChar('x');
              data.writeByte(200);
              data.writeBytes("ab");
              data.writeChars("cd");
              System.out.println(data.size() + " " + Arrays.toString(out.toByteArray()));
              DataInputStream din = new DataInputStream(new ByteArrayInputStream(out.toByteArray()));
              System.out.println(din.readInt() + " " + din.readLong() + " " + din.readDouble() + " " + din.readFloat());
              String s = din.readUTF();
              System.out.println(s.length() + " " + s.charAt(1) + " " + (int) s.charAt(3));
              System.out.println(din.readBoolean() + " " + din.readShort() + " " + din.readChar() + " " + din.readByte() + " " + din.readUnsignedByte());
              din.skipBytes(1);
              System.out.println(din.readChar() + "" + din.readChar());
              try {
                  din.readInt();
              }
              catch (EOFException e) {
                  System.out.println("eof " + e.getMessage());
              }
              try {
                  in.read(buf, 2, 5);
              }
              catch (IndexOutOfBoundsException e) {
                  System.out.println(e.getMessage());
              }
              try {
                  new String(buf, 2, 5);
              }
              catch (IndexOutOfBoundsException e) {
                  System.out.println(e);
              }
              try {
                  "x".getBytes("nope");
              }
              catch (UnsupportedEncodingException e) {
                  System.out.println(e);
              }
          }

          // UTF-16 writes its mark once, ahead of a text that is not empty, and reads one as
          // the order of what follows; UTF-16BE and UTF-16LE have none. A surrogate with no
          // partner, a byte with none and a high surrogate with the unit after it are U+FFFD,
          // through a string and through a reader given a few bytes at a time alike. A charset
          // named as a constant is the charset: the member taking a Charset.
          static String wideHex(byte[] b) {
              StringBuilder s = new StringBuilder();
              for (byte x : b) {
                  s.append(Integer.toHexString((x & 0xff) | 0x100).substring(1));
              }
              return s.toString();
          }

          static String wideUnits(char[] units, int count) {
              StringBuilder s = new StringBuilder("[");
