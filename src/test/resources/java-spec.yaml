      import java.util.ArrayList;
      import java.util.Collections;
      import java.util.Iterator;
      import java.util.List;
      import java.util.Map;
      import java.util.Queue;
      import java.util.Set;
      import java.util.concurrent.Callable;
      import java.util.concurrent.CancellationException;
      import java.util.concurrent.CompletableFuture;
      import java.util.concurrent.CompletionException;
      import java.util.concurrent.CompletionStage;
      import java.util.concurrent.ConcurrentHashMap;
      import java.util.concurrent.ConcurrentLinkedDeque;
      import java.util.concurrent.ConcurrentLinkedQueue;
      import java.util.concurrent.ConcurrentMap;
      import java.util.concurrent.CopyOnWriteArrayList;
      import java.util.concurrent.CopyOnWriteArraySet;
      import java.util.concurrent.CountedCompleter;
      import java.util.concurrent.ExecutionException;
      import java.util.concurrent.Executor;
      import java.util.concurrent.ExecutorService;
      import java.util.concurrent.Executors;
      import java.util.concurrent.ForkJoinPool;
      import java.util.concurrent.ForkJoinTask;
      import java.util.concurrent.Future;
      import java.util.concurrent.RecursiveAction;
      import java.util.concurrent.RecursiveTask;
      import java.util.concurrent.RejectedExecutionException;
      import java.util.concurrent.TimeUnit;
      import java.util.concurrent.atomic.AtomicIntegerArray;
      import java.util.concurrent.atomic.AtomicLongArray;
      import java.util.concurrent.atomic.AtomicReferenceArray;
      import java.util.concurrent.atomic.DoubleAccumulator;
      import java.util.concurrent.atomic.DoubleAdder;
      import java.util.concurrent.atomic.LongAccumulator;
      import java.util.concurrent.atomic.LongAdder;

      public class Sharing {
          public static void main(String[] args) throws Exception {
              // a map shared by threads: every member is one step, and a walk never refuses
              ConcurrentHashMap<String, Integer> counts = new ConcurrentHashMap<>();
              Thread[] counters = new Thread[4];
              for (int i = 0; i < counters.length; i++) {
                  counters[i] = new Thread(() -> {
                      for (int n = 0; n < 1000; n++) {
                          counts.merge("k" + n % 20, 1, Integer::sum);
                          counts.computeIfAbsent("only", k -> 0);
                          counts.compute("all", (k, v) -> v == null ? 1 : v + 1);
                      }
                  });
                  counters[i].start();
              }
              for (Thread counter : counters) {
                  counter.join();
              }
              System.out.println(counts.size() + " " + counts.get("k7") + " " + counts.get("all") + " " + counts.get("only")
                      + " " + counts.mappingCount() + " " + counts.containsKey("k19") + " " + counts.contains(200));
              System.out.println(counts);
              for (String key : counts.keySet()) {
                  if (key.startsWith("k1")) {
                      counts.remove(key);
                  }
              }
              for (Map.Entry<String, Integer> entry : counts.entrySet()) {
                  entry.setValue(entry.getValue() / 100);
              }
              ConcurrentMap<String, Integer> typed = counts;
              System.out.println(counts + " " + typed.putIfAbsent("k0", 9) + " " + typed.putIfAbsent("new", 9) + " "
                      + typed.remove("new", 8) + " " + typed.remove("new", 9) + " " + typed.replace("k0", 2, 3) + " "
                      + typed.replace("k0", 3) + " " + counts.getOrDefault("none", -1) + " " + counts.values());
              try {
                  counts.put(null, 1);
              }
              catch (NullPointerException e) {
                  System.out.println("no null key");
              }
              try {
                  counts.put("k", null);
              }
              catch (NullPointerException e) {
                  System.out.println("no null value");
              }
              ConcurrentHashMap<Integer, Integer> numbers = new ConcurrentHashMap<>(Map.of(1, 1));
              for (int i = 0; i < 40; i += 3) {
                  numbers.put(i * 16, i);
              }
              Set<Integer> set = ConcurrentHashMap.newKeySet();
              System.out.println(numbers.keySet() + " " + set.add(3) + " " + set.add(3) + " " + set.add(19) + " " + set + " "
                      + set.contains(19) + " " + set.remove(3) + " " + set.size());

              // a list whose walk is of the list there was; a queue no thread waits on
              List<String> words = new CopyOnWriteArrayList<>(List.of("a", "b", "c"));
              for (String word : words) {
                  if (word.equals("b")) {
                      words.add("d");
                      words.remove("a");
                  }
              }
              Iterator<String> each = words.iterator();
              each.next();
              try {
                  each.remove();
              }
              catch (UnsupportedOperationException e) {
                  System.out.println("a walk changes nothing");
              }
              CopyOnWriteArrayList<String> cow = (CopyOnWriteArrayList<String>) words;
              System.out.println(words + " " + cow.addIfAbsent("d") + " " + cow.addIfAbsent("e") + " " + words.set(0, "B") + " "
                      + words.indexOf("e") + " " + words.contains("a") + " " + words.size() + " " + words.get(1));
              try {
                  words.get(9);
              }
              catch (ArrayIndexOutOfBoundsException e) {
                  System.out.println(e.getMessage());
              }
              try {
                  words.add(9, "x");
              }
              catch (IndexOutOfBoundsException e) {
                  System.out.println(e.getMessage());
              }
              Queue<Integer> line = new ConcurrentLinkedQueue<>();
              for (int i = 0; i < 4; i++) {
                  line.offer(i);
              }
              for (int n : line) {
                  line.remove(n + 1);
              }
              System.out.println(line + " " + line.poll() + " " + line.peek() + " " + line.size() + " " + line.poll() + " "
                      + line.poll() + " " + line.isEmpty());

              // a value computed on another thread and what follows from it
              CompletableFuture<Integer> six = CompletableFuture.supplyAsync(() -> 6);
              CompletableFuture<String> text = six.thenApply(n -> n * 7).thenCompose(n -> CompletableFuture.supplyAsync(() -> "=" + n));
              System.out.println(text.join() + " " + six.get() + " " + six.isDone() + " " + six.getNow(0)
                      + " " + six.thenCombine(CompletableFuture.completedFuture(4), (a, b) -> a * b).join()
                      + " " + CompletableFuture.supplyAsync(() -> Thread.currentThread().isDaemon()).join());
              List<String> seen = new ArrayList<>();
              six.thenAccept(n -> seen.add("accept " + n)).thenRun(() -> seen.add("run")).join();
              ExecutorService pool = Executors.newSingleThreadExecutor();
              seen.add(six.thenApplyAsync(n -> Thread.currentThread().getName() + " " + n, pool).join());
              CompletableFuture.runAsync(() -> seen.add("ran"), pool).get();
              pool.shutdown();
              System.out.println(seen);

              // a future is completed once, by whoever gets there first
              CompletableFuture<String> manual = new CompletableFuture<>();
              CompletableFuture<Integer> length = manual.thenApply(String::length);
              System.out.println(manual.isDone() + " " + manual.getNow("not yet") + " " + length.isDone());
              new Thread(() -> manual.complete("late")).start();
              System.out.println(manual.join() + " " + length.join() + " " + manual.complete("again") + " "
                      + manual.completeExceptionally(new IllegalStateException()) + " " + manual.isCompletedExceptionally());

              // an exception goes down the stages until one takes it
              CompletableFuture<Integer> failed = CompletableFuture.supplyAsync(() -> {
                  if (seen.size() > 0) {
                      throw new IllegalStateException("boom");
                  }
                  return 1;
              });
              try {
                  failed.join();
              }
              catch (CompletionException e) {
                  System.out.println("join: " + e.getMessage() + " | " + e.getCause());
              }
              try {
                  failed.get();
              }
              catch (ExecutionException e) {
                  System.out.println("get: " + e.getMessage() + " | " + e.getCause());
              }
              System.out.println(failed.thenApply(n -> n + 1).exceptionally(e -> e.getClass().getSimpleName().length()).join()
                      + " " + failed.handle((n, e) -> n + " " + e.getCause().getMessage()).join() + " "
                      + failed.isCompletedExceptionally() + " " + failed.isCancelled() + " "
                      + failed.exceptionally(e -> -1).thenApply(n -> n * 2).join());
              CompletableFuture<String> raw = new CompletableFuture<>();
              raw.completeExceptionally(new IllegalArgumentException("given"));
              raw.whenComplete((v, e) -> System.out.println("when: " + v + " " + e)).exceptionally(e -> {
                  System.out.println("then: " + e);
                  return "";
              }).join();
              System.out.println(CompletableFuture.completedFuture(2).whenComplete((v, e) -> seen.clear()).join() + " " + seen
                      + " " + CompletableFuture.failedFuture(new ArithmeticException("x")).isCompletedExceptionally());
              CompletableFuture<String> cancelled = new CompletableFuture<>();
              System.out.println(cancelled.cancel(true) + " " + cancelled.isCancelled() + " " + cancelled.isDone());
              try {
                  cancelled.join();
              }
              catch (CancellationException e) {
                  System.out.println(e + " | " + e.getCause());
              }
              try {
                  cancelled.get();
              }
              catch (CancellationException e) {
                  System.out.println(e + " " + cancelled.thenApply(String::length).isCompletedExceptionally());
              }

              // every one of several, and the first of several
              Map<Integer, Integer> squares = new ConcurrentHashMap<>();
              CompletableFuture<?>[] tasks = new CompletableFuture<?>[5];
              for (int i = 0; i < tasks.length; i++) {
                  int n = i;
                  tasks[i] = CompletableFuture.runAsync(() -> squares.put(n, n * n));
              }
              CompletableFuture.allOf(tasks).join();
              System.out.println(squares + " " + CompletableFuture.anyOf(CompletableFuture.completedFuture("first"), new CompletableFuture<String>()).join()
                      + " " + CompletableFuture.allOf().isDone());
              try {
                  CompletableFuture.allOf(six, failed, raw).join();
              }
              catch (CompletionException e) {
                  System.out.println(e.getCause());
              }
              setsDequesAndCounters();
              dependents();
              bothEitherAndLimits();
              splitting();
              accumulated();
              stagesLeft();
              completers();
          }

          static StringBuilder order = new StringBuilder();

          static <T> T note(String name, T value) {
              order.append(name).append(' ');
              return value;
          }

          /** What a future prints, without the number of the object. */
          static String shown(Object object) {
              String text = object.toString();
              return text.substring(0, text.indexOf('@')) + text.substring(text.indexOf('['));
          }

          static void attempt(Callable<Object> asked) {
              try {
                  System.out.println(asked.call());
              }
              catch (Throwable e) {
                  System.out.println(e + (e.getCause() != null ? " <- " + e.getCause() : ""));
              }
          }

          // a set, a deque, the arrays of atomics and a sum many threads change
          static void setsDequesAndCounters() throws Exception {
              CopyOnWriteArraySet<Integer> set = new CopyOnWriteArraySet<>(List.of(3, 1, 3));
              ConcurrentLinkedDeque<Integer> ends = new ConcurrentLinkedDeque<>();
              AtomicIntegerArray counts = new AtomicIntegerArray(3);
              AtomicLongArray longs = new AtomicLongArray(new long[] { 10, 20 });
              AtomicReferenceArray<String> names = new AtomicReferenceArray<>(new String[] { "a", null });
              LongAdder adder = new LongAdder();
              Iterator<Integer> before = set.iterator();
              Thread[] adding = new Thread[4];
              for (int i = 0; i < adding.length; i++) {
                  int base = i;
                  adding[i] = new Thread(() -> {
                      for (int n = 0; n < 500; n++) {
                          set.add(n % 7);
                          counts.incrementAndGet(n % 3);
                          longs.addAndGet(n % 2, 2);
                          adder.increment();
                          if (n % 2 == 0) {
                              ends.addFirst(base);
                          }
                          else {
                              ends.addLast(base);
                          }
                      }
                      adder.add(-10);
                  });
                  adding[i].start();
              }
              for (Thread each : adding) {
                  each.join();
              }
              int walked = 0;
              while (before.hasNext()) {
                  walked += before.next();
              }
              System.out.println(set + " " + set.size() + " " + walked + " " + set.contains(6) + set.remove(3) + set.add(3)
                      + set.add(3) + " " + set + " " + set.equals(Set.of(0, 1, 2, 3, 4, 5, 6)) + " " + ends.size() + " "
                      + counts + " " + longs + " " + adder + " " + adder.sumThenReset() + adder.intValue());
              System.out.println(counts.getAndAdd(0, 5) + " " + counts.compareAndSet(0, 673, 1) + counts.compareAndSet(0, 0, 1)
                      + " " + counts.updateAndGet(1, n -> n * 2) + " " + counts.accumulateAndGet(2, 4, (a, b) -> a - b) + " "
                      + counts.getAndSet(2, 9) + " " + counts.length() + counts + " " + longs.getAndIncrement(0)
                      + longs.decrementAndGet(1) + longs.getAndUpdate(0, n -> -n) + longs + " "
                      + names.compareAndSet(1, null, "b") + names.getAndSet(0, "z") + names.updateAndGet(1, s -> s + s)
                      + names.accumulateAndGet(0, "!", (a, b) -> a + b) + names + names.length());
              ConcurrentLinkedDeque<String> words = new ConcurrentLinkedDeque<>(List.of("b", "c"));
              words.addFirst("a");
              words.offerLast("d");
              words.push("z");
              Iterator<String> reversed = words.descendingIterator();
              System.out.println(words + " " + words.peekFirst() + words.peekLast() + " " + words.pop() + words.pollLast()
                      + words.removeFirst() + words.poll() + " " + words + " " + reversed.next() + reversed.next() + " "
                      + words.contains("c") + words.remove("c") + words.isEmpty() + words.pollFirst() + words.peek());
              attempt(() -> {
                  words.addLast(null);
                  return "added";
              });
          }

          // what depends on a future runs where the future is set: the one added last first,
          // and what depends on that one right after it
          static void dependents() {
              CompletableFuture<String> f = new CompletableFuture<>();
              CompletableFuture<String> d1 = f.thenApply(x -> note("d1", x));
              CompletableFuture<String> d2 = f.thenApply(x -> note("d2", x));
              CompletableFuture<String> d3 = f.thenApply(x -> note("d3", x));
              d1.thenAccept(x -> note("e1a", x));
              d1.thenAccept(x -> note("e1b", x));
              d2.thenAccept(x -> note("e2a", x));
              CompletableFuture<Void> e2b = d2.thenAccept(x -> note("e2b", x));
              d2.thenAccept(x -> note("e2c", x));
              e2b.thenRun(() -> note("g1", 0));
              e2b.thenRun(() -> note("g2", 0));
              d3.thenAccept(x -> note("e3a", x));
              f.complete("v");
              order.append("| ");
              CompletableFuture<String> g = new CompletableFuture<>();
              g.thenApply(x -> note("a", x)).thenApply(x -> note("b", x)).thenAccept(x -> note("c", x));
              g.whenComplete((x, e) -> note("w", x));
              g.handle((x, e) -> note("h", x));
              g.complete("v");
              g.thenAccept(x -> note("late", x));
              order.append("| ");
              CompletableFuture<String> p = new CompletableFuture<>();
              CompletableFuture<String> q = new CompletableFuture<>();
              p.thenCombine(q, (x, y) -> note("combine1", x + y));
              q.thenCombine(p, (x, y) -> note("combine2", x + y));
              p.thenAccept(x -> note("p1", x));
              CompletableFuture.allOf(p, q).thenRun(() -> note("all", 0));
              CompletableFuture.anyOf(p, q).thenRun(() -> note("any", 0));
              q.thenAccept(x -> note("q1", x));
              p.complete("P");
              order.append("then ");
              q.complete("Q");
              System.out.println(order.toString().trim());
          }

          // a stage of two futures waits for both, or for the first; a future may have a limit
          static void bothEitherAndLimits() throws Exception {
              CompletableFuture<String> open = new CompletableFuture<>();
              CompletableFuture<String> done = CompletableFuture.completedFuture("v");
              CompletableFuture<String> failed = CompletableFuture.failedFuture(new IllegalStateException("f"));
              CompletableFuture<String> staged = failed.thenApply(s -> s + "!");
              CompletableFuture<String> cancelled = new CompletableFuture<>();
              cancelled.cancel(true);
              System.out.println(shown(open) + " " + shown(done) + " " + shown(failed) + " " + shown(staged) + " "
                      + shown(cancelled));
              System.out.println(open.state() + " " + done.state() + " " + failed.state() + " " + cancelled.state() + " "
                      + done.resultNow() + " " + failed.exceptionNow() + " " + staged.exceptionNow());
              attempt(() -> open.resultNow());
              attempt(() -> failed.resultNow());
              attempt(() -> done.exceptionNow());
              attempt(() -> cancelled.exceptionNow());
              CompletableFuture<String> a = new CompletableFuture<>();
              CompletableFuture<String> b = new CompletableFuture<>();
              CompletableFuture<Void> both = a.thenAcceptBoth(b, (x, y) -> System.out.println("both " + x + y));
              CompletableFuture<Void> after = a.runAfterBoth(b, () -> System.out.println("after both"));
              CompletableFuture<String> either = a.applyToEither(b, x -> "either " + x);
              CompletableFuture<Void> accepted = a.acceptEither(b, x -> System.out.println("accept " + x));
              CompletableFuture<Void> ran = a.runAfterEither(b, () -> System.out.println("ran after either"));
              System.out.println(a.getNumberOfDependents() + " " + b.getNumberOfDependents() + " " + shown(a));
              b.complete("B");
              System.out.println(either.join() + " " + both.isDone() + " " + accepted.isDone() + " " + ran.isDone());
              a.complete("A");
              System.out.println(both.isDone() + " " + after.isDone() + " " + a.thenCombineAsync(b, (x, y) -> x + y).join()
                      + " " + a.thenAcceptBothAsync(b, (x, y) -> {
                      }).join() + " " + a.applyToEitherAsync(b, x -> x).join().length());
              CompletableFuture<String> never = new CompletableFuture<>();
              attempt(() -> never.orTimeout(30, TimeUnit.MILLISECONDS).join());
              attempt(() -> never.get());
              System.out.println(new CompletableFuture<String>().completeOnTimeout("fallback", 30, TimeUnit.MILLISECONDS).join()
                      + " " + done.orTimeout(1, TimeUnit.HOURS).join() + " "
                      + done.completeOnTimeout("x", 1, TimeUnit.HOURS).join());
              CompletableFuture<String> quick = new CompletableFuture<String>().orTimeout(1, TimeUnit.HOURS);
              quick.complete("in time");
              System.out.println(quick.join() + " " + new CompletableFuture<String>().completeAsync(() -> "async").join() + " "
                      + done.copy().join());
              attempt(() -> new CompletableFuture<String>().completeAsync(() -> {
                  throw new IllegalStateException("x");
              }).exceptionally(e -> e.getClass().getSimpleName() + " " + e.getCause()).join());
              long start = System.nanoTime();
              CompletableFuture<String> delayed = CompletableFuture.supplyAsync(() -> "delayed",
                      CompletableFuture.delayedExecutor(40, TimeUnit.MILLISECONDS));
              System.out.println(delayed.join() + " " + ((System.nanoTime() - start) / 1000000 >= 39));
          }

          static class Sum extends RecursiveTask<Long> {
              final int[] numbers;

              final int from;

              final int to;

              Sum(int[] numbers, int from, int to) {
                  this.numbers = numbers;
                  this.from = from;
                  this.to = to;
              }

              protected Long compute() {
                  if (to - from <= 4) {
                      long sum = 0;
                      for (int i = from; i < to; i++) {
                          sum += numbers[i];
                      }
                      return sum;
                  }
                  int middle = (from + to) / 2;
                  Sum left = new Sum(numbers, from, middle);
                  Sum right = new Sum(numbers, middle, to);
                  left.fork();
                  return right.compute() + left.join();
              }
          }

          static class Fill extends RecursiveAction {
              final int[] numbers;

              final int from;

              final int to;

              Fill(int[] numbers, int from, int to) {
                  this.numbers = numbers;
                  this.from = from;
                  this.to = to;
              }

              protected void compute() {
                  if (to - from <= 3) {
                      for (int i = from; i < to; i++) {
                          numbers[i] = i * i;
                      }
                      return;
                  }
                  int middle = (from + to) / 2;
                  invokeAll(new Fill(numbers, from, middle), new Fill(numbers, middle, to));
              }
          }

          static class Failing extends RecursiveTask<String> {
              protected String compute() {
                  throw new IllegalStateException("no answer");
              }
          }

          // a task splits into tasks, which a pool's threads run
          static void splitting() throws Exception {
              int[] numbers = new int[100];
              ForkJoinPool pool = new ForkJoinPool(3);
              pool.invoke(new Fill(numbers, 0, numbers.length));
              Sum sum = new Sum(numbers, 0, numbers.length);
              System.out.println(pool.invoke(sum) + " " + sum.isDone() + " " + sum.isCompletedNormally() + " "
                      + sum.getRawResult() + " " + pool.getParallelism());
              ForkJoinTask<Long> submitted = pool.submit(new Sum(numbers, 0, 50));
              System.out.println(submitted.get() + " " + submitted.join() + " " + pool.submit(() -> "called").get() + " "
                      + pool.submit(() -> {
                      }, "ran").get());
              Sum inline = new Sum(numbers, 10, 20);
              System.out.println(inline.invoke() + " " + ForkJoinTask.inForkJoinPool() + " " + (ForkJoinTask.getPool() == null));
              boolean[] inside = new boolean[2];
              pool.invoke(new RecursiveAction() {
                  protected void compute() {
                      inside[0] = inForkJoinPool();
                      inside[1] = getPool() == pool;
                  }
              });
              Failing failing = new Failing();
              try {
                  pool.invoke(failing);
              }
              catch (IllegalStateException e) {
                  System.out.println(inside[0] + " " + inside[1] + " " + failing.isCompletedAbnormally() + " "
                          + failing.isCancelled() + " " + failing.getException().getClass().getName() + " " + failing.state());
              }
              try {
                  failing.get();
              }
              catch (ExecutionException e) {
                  System.out.println(e.getCause().getClass().getName());
              }
              attempt(() -> new Failing().invoke());
              Sum never = new Sum(numbers, 0, 4);
              System.out.println(never.cancel(false) + " " + never.isCancelled() + " " + never.isDone() + " "
                      + never.isCompletedAbnormally());
              attempt(() -> never.join());
              attempt(() -> never.get());
              Sum common = new Sum(numbers, 0, numbers.length);
              common.fork();
              System.out.println(common.join() + " " + ForkJoinPool.commonPool().invoke(new Sum(numbers, 0, 10)) + " "
                      + (ForkJoinPool.commonPool() == ForkJoinPool.commonPool()));
              String[] names = new String[2];
              pool.submit(() -> {
                  names[0] = Thread.currentThread().getName().replaceAll("[0-9]+$", "N");
                  names[1] = "" + Thread.currentThread().isDaemon();
              }).get();
              CompletableFuture<String> viaCommon = CompletableFuture.supplyAsync(
                      () -> Thread.currentThread().getName().replaceAll("[0-9]+$", "N"), ForkJoinPool.commonPool());
              System.out.println(names[0] + " " + names[1] + " " + viaCommon.join());
              List<Callable<Integer>> calls = List.of(() -> 1, () -> 2, () -> 3);
              int total = 0;
              for (Future<Integer> each : pool.invokeAll(calls)) {
                  total += each.get();
              }
              System.out.println(total + " " + pool.isShutdown());
              pool.shutdown();
              System.out.println(pool.awaitTermination(60, TimeUnit.SECONDS) + " " + pool.isTerminated());
              try {
                  pool.invoke(new Sum(numbers, 0, 4));
              }
              catch (RejectedExecutionException e) {
                  System.out.println("a pool shut down takes no task");
              }
              ForkJoinPool.commonPool().shutdown();
              System.out.println(ForkJoinPool.commonPool().isShutdown());
          }

          // a value many threads fold their own into, and a sum of doubles
          static void accumulated() throws Exception {
              LongAccumulator most = new LongAccumulator(Long::max, Long.MIN_VALUE);
              LongAccumulator sum = new LongAccumulator((x, y) -> x + y, 0);
              DoubleAdder halves = new DoubleAdder();
              DoubleAccumulator product = new DoubleAccumulator((x, y) -> x * y, 1.0);
              System.out.println(most + " " + most.intValue() + " " + sum + " " + halves + " " + product);
              Thread[] threads = new Thread[4];
              for (int i = 0; i < threads.length; i++) {
                  int id = i;
                  threads[i] = new Thread(() -> {
                      for (int j = 0; j < 500; j++) {
                          most.accumulate(id * 1000 + j);
                          sum.accumulate(1);
                          halves.add(0.5);
                      }
                  });
                  threads[i].start();
              }
              for (Thread thread : threads) {
                  thread.join();
              }
              product.accumulate(1.5);
              product.accumulate(4);
              System.out.println(most.get() + " " + sum.get() + " " + sum.getThenReset() + " " + sum.longValue() + " "
                      + halves.sum() + " " + halves.intValue() + " " + halves.sumThenReset() + " " + halves.doubleValue()
                      + " " + product + " " + product.intValue() + " " + product.getThenReset() + " " + product.get());
              most.reset();
              halves.add(-0.0);
              product.accumulate(Double.NaN);
              product.reset();
              System.out.println(most.get() + " " + most.floatValue() + " " + halves + " " + product.floatValue());
          }

          /** A future whose stages are of its own class. */
          static class Counting<T> extends CompletableFuture<T> {
              static int made;

              @Override
              public <U> CompletableFuture<U> newIncompleteFuture() {
                  made++;
                  return new Counting<U>();
              }

              @Override
              public Executor defaultExecutor() {
                  return task -> {
                      order.append("mine ");
                      task.run();
                  };
              }
          }

          // what is made of a failure, a value set over another, a stage that is no future
          static void stagesLeft() throws Exception {
              ExecutorService one = Executors.newFixedThreadPool(1, r -> new Thread(r, "the one"));
              CompletableFuture<String> open = new CompletableFuture<>();
              CompletableFuture<String> mended = open
                  .exceptionallyAsync(t -> "saw " + t.getMessage() + " on a daemon: " + Thread.currentThread().isDaemon());
              open.completeExceptionally(new IllegalStateException("boom"));
              System.out.println(mended.join());
              CompletableFuture<String> failed = CompletableFuture.failedFuture(new IllegalStateException("x"));
              System.out.println(failed.exceptionallyAsync(t -> Thread.currentThread().getName() + " saw " + t, one).join()
                      + ", " + CompletableFuture.completedFuture("fine").exceptionallyAsync(t -> "never").join() + ", "
                      + failed.thenApply(s -> s + "!").exceptionallyAsync(t -> "taken over as " + t).join());
              attempt(() -> failed.exceptionallyAsync(t -> {
                  throw new IllegalArgumentException("y");
              }).join());
              System.out.println(failed.exceptionallyCompose(t -> CompletableFuture.completedFuture("composed of " + t))
                  .join() + ", "
                      + CompletableFuture.completedFuture("fine")
                          .exceptionallyCompose(t -> CompletableFuture.completedFuture("never"))
                          .join()
                      + ", "
                      + failed
                          .exceptionallyComposeAsync(
                                  t -> CompletableFuture.completedFuture("on " + Thread.currentThread().getName()), one)
                          .join()
                      + ", " + failed
                          .exceptionallyComposeAsync(
                                  t -> CompletableFuture.completedFuture("a daemon: " + Thread.currentThread().isDaemon()))
                          .join());
              attempt(() -> failed.exceptionallyCompose(t -> CompletableFuture.failedFuture(new IllegalStateException("in")))
                  .join());
              attempt(() -> failed.exceptionallyCompose(t -> {
                  throw new IllegalArgumentException("thrown");
              }).join());
              CompletableFuture<String> later = new CompletableFuture<>();
              CompletableFuture<String> through = failed.exceptionallyCompose(t -> later);
              boolean early = through.isDone();
              later.complete("late");
              System.out.println(early + " " + through.join());
              attempt(() -> failed.exceptionallyCompose(null));
              one.shutdown();
              // a value is set over the one a future has; what ran on the old one stays run
              CompletableFuture<String> set = CompletableFuture.completedFuture("first");
              CompletableFuture<String> before = set.thenApply(s -> s + "!");
              set.obtrudeValue("second");
              System.out.println(set.join() + " " + before.join() + " " + set.thenApply(s -> s + "?").join());
              set.obtrudeException(new IllegalStateException("forced"));
              attempt(set::join);
              System.out.println(set.isCompletedExceptionally() + " " + shown(set));
              set.obtrudeValue(null);
              System.out.println(set.join() + " " + set.isCompletedExceptionally() + " " + shown(set));
              CompletableFuture<String> unset = new CompletableFuture<>();
              CompletableFuture<String> waiting = unset.thenApply(s -> s + "!");
              unset.obtrudeValue("set");
              System.out.println(unset.join() + " " + waiting.join() + " " + unset.complete("again"));
              attempt(() -> {
                  unset.obtrudeException(null);
                  return "set";
              });
              // a stage that answers what a stage answers and nothing a future does
              CompletableFuture<String> source = new CompletableFuture<>();
              CompletionStage<String> minimal = source.minimalCompletionStage();
              CompletableFuture<String> behind = (CompletableFuture<String>) minimal;
              System.out.println(shown(minimal) + " " + (minimal instanceof CompletableFuture));
              attempt(() -> behind.complete("no"));
              attempt(() -> behind.join());
              attempt(() -> behind.get());
              attempt(() -> behind.isDone());
              attempt(() -> behind.cancel(true));
              attempt(() -> behind.getNow("x"));
              attempt(() -> behind.orTimeout(1, TimeUnit.SECONDS));
              attempt(() -> {
                  behind.obtrudeValue("x");
                  return "set";
              });
              CompletionStage<String> next = minimal.thenApply(s -> s + "!");
              CompletableFuture<String> future = minimal.toCompletableFuture();
              System.out.println(shown(next) + " " + shown(behind.copy()) + " " + shown(future) + " " + (future == source));
              source.complete("done");
              System.out.println(future.join() + " " + next.toCompletableFuture().join() + " " + shown(minimal) + " "
                      + next.thenCombine(minimal, (a, b) -> a + b).toCompletableFuture().join());
              CompletableFuture<String> bad = new CompletableFuture<>();
              CompletionStage<String> lost = bad.minimalCompletionStage();
              bad.completeExceptionally(new IllegalStateException("bad"));
              System.out.println(shown(lost) + " " + lost.exceptionally(t -> "seen " + t).toCompletableFuture().join());
              attempt(() -> lost.toCompletableFuture().join());
              CompletionStage<String> ready = CompletableFuture.completedStage("ready");
              CompletionStage<String> broken = CompletableFuture.failedStage(new IllegalStateException("broken"));
              System.out.println(shown(ready) + " " + ready.toCompletableFuture().join() + " " + shown(broken) + " "
                      + shown(source.newIncompleteFuture()));
              attempt(() -> CompletableFuture.failedStage(null));
              // a subclass says what its stages are and where they run
              order.setLength(0);
              Counting<String> mine = new Counting<>();
              CompletableFuture<Integer> length = mine.thenApply(String::length);
              CompletableFuture<Integer> twice = length.thenApplyAsync(n -> n * 2);
              System.out.println((length instanceof Counting) + " " + (twice instanceof Counting) + " "
                      + (mine.copy() instanceof Counting) + " " + (mine.exceptionally(t -> "") instanceof Counting) + " "
                      + (mine.thenCombine(length, (s, n) -> s + n) instanceof Counting) + " "
                      + (mine.minimalCompletionStage() instanceof Counting) + " " + Counting.made);
              mine.complete("four");
              System.out.println(twice.join() + " " + order.toString().trim());
          }

          static final List<String> told = Collections.synchronizedList(new ArrayList<>());

          /** A task that ends when the tasks it started have told it so. */
          static class Total extends CountedCompleter<Long> {
              final int[] numbers;
              final int from;
              final int to;
              Total left;
              Total right;
              long sum;

              Total(CountedCompleter<?> above, int[] numbers, int from, int to) {
                  super(above);
                  this.numbers = numbers;
                  this.from = from;
                  this.to = to;
              }

              @Override
              public void compute() {
                  if (to - from <= 4) {
                      for (int i = from; i < to; i++) {
                          sum += numbers[i];
                      }
                  }
                  else {
                      int middle = (from + to) >>> 1;
                      left = new Total(this, numbers, from, middle);
                      right = new Total(this, numbers, middle, to);
                      setPendingCount(2);
                      left.fork();
                      right.fork();
                  }
                  tryComplete();
              }

              @Override
              public void onCompletion(CountedCompleter<?> caller) {
                  if (left != null) {
                      sum = left.sum + right.sum;
                  }
              }

              @Override
              public Long getRawResult() {
                  return sum;
              }
          }

          static class Step extends CountedCompleter<String> {
              final String name;
              String result;

              Step(CountedCompleter<?> above, String name, int pending) {
                  super(above, pending);
                  this.name = name;
              }

              @Override
              public void compute() {
                  told.add(name + " computes");
              }

              @Override
              public void onCompletion(CountedCompleter<?> caller) {
                  told.add(name + " by " + ((Step) caller).name);
              }

              @Override
              public boolean onExceptionalCompletion(Throwable ex, CountedCompleter<?> caller) {
                  told.add(name + " failed by " + ((Step) caller).name);
                  return !name.equals("stop");
              }

              @Override
              public String getRawResult() {
                  return result;
              }

              @Override
              protected void setRawResult(String value) {
                  result = value;
              }
          }

          static void told(String what) {
              System.out.println(what + ": " + told);
              told.clear();
          }

          // tasks that count what is pending and tell the task above
          static void completers() throws Exception {
              int[] numbers = new int[100];
              for (int i = 0; i < numbers.length; i++) {
                  numbers[i] = i + 1;
              }
              ForkJoinPool pool = new ForkJoinPool(3);
              Total forked = new Total(null, numbers, 0, 50);
              pool.submit(forked);
              System.out.println(new Total(null, numbers, 0, numbers.length).invoke() + " " + pool.invoke(new Total(null,
                      numbers, 0, numbers.length)) + " " + forked.get() + " " + forked.isCompletedNormally() + " "
                      + forked.getPendingCount() + " " + forked.getCompleter() + " " + (forked.left.getRoot() == forked)
                      + " " + (forked.left.getCompleter() == forked));
              // up the chain: one less pending where something is, else the task is told
              Step root = new Step(null, "root", 1);
              Step middle = new Step(root, "middle", 1);
              Step leaf = new Step(middle, "leaf", 0);
              Step other = new Step(middle, "other", 0);
              leaf.tryComplete();
              told("leaf");
              other.tryComplete();
              told("other");
              System.out.println(root.getPendingCount() + " " + middle.getPendingCount() + " " + leaf.isDone() + " "
                      + middle.isDone() + " " + root.isDone());
              middle.tryComplete();
              told("middle");
              System.out.println(middle.isDone() + " " + root.isDone() + " " + root.join());
              Step quiet = new Step(null, "quiet", 0);
              Step below = new Step(new Step(quiet, "between", 0), "below", 0);
              below.propagateCompletion();
              told("propagated");
              Step given = new Step(new Step(null, "top", 1), "given", 5);
              given.complete("a value");
              told("complete");
              System.out.println(quiet.isDone() + " " + below.isDone() + " " + given.isDone() + " " + given.getRawResult()
                      + " " + given.getPendingCount() + " " + given.getCompleter().isDone() + " "
                      + given.getCompleter().getPendingCount());
              // the counts' own members
              Step counted = new Step(new Step(null, "above", 0), "counted", 3);
              System.out.println(counted.compareAndSetPendingCount(2, 9) + " " + counted.compareAndSetPendingCount(3, 1) + " "
                      + counted.decrementPendingCountUnlessZero() + " " + counted.decrementPendingCountUnlessZero() + " "
                      + (counted.firstComplete() == counted) + " " + (counted.nextComplete() == counted.getCompleter()) + " "
                      + counted.getCompleter().isDone() + " " + (counted.getCompleter().nextComplete() == null) + " "
                      + counted.getCompleter().isDone() + " " + counted.isDone());
              counted.addToPendingCount(-4);
              counted.quietlyCompleteRoot();
              counted.helpComplete(1);
              System.out.println(counted.getPendingCount() + " " + counted.getRoot().isDone() + " " + counted.isDone());
              told("counts");
              // an exception climbs while each task says so
              Step top = new Step(null, "top", 0);
              Step stop = new Step(top, "stop", 1);
              Step under = new Step(stop, "under", 1);
              Step thrower = new Step(under, "thrower", 0);
              thrower.completeExceptionally(new IllegalStateException("broken"));
              told("failed");
              System.out.println(thrower.isCompletedAbnormally() + " " + under.isCompletedAbnormally() + " "
                      + stop.isCompletedAbnormally() + " " + top.isDone() + " " + under.getException());
              attempt(under::join);
              attempt(new CountedCompleter<Void>() {
                  public void compute() {
                      throw new IllegalArgumentException("in compute");
                  }
              }::invoke);
              // a task whose compute ends with something pending is not done
              Step unfinished = new Step(null, "unfinished", 1);
              ForkJoinTask<String> task = pool.submit(unfinished);
              while (told.isEmpty()) {
                  Thread.sleep(1);
              }
              boolean early = task.isDone();
              unfinished.tryComplete();
              boolean still = task.isDone();
              unfinished.tryComplete();
              System.out.println(early + " " + still + " " + task.isDone() + " " + task.get());
              told("unfinished");
              pool.shutdown();
          }
      }
