      class MethodRefs {
          static class Person {
              final String name;

              Person(String name) {
                  this.name = name;
              }

              static Person of(String name) {
                  return new Person(name);
              }

              String name() {
                  return name;
              }

              String shout(String suffix) {
                  return name.toUpperCase() + suffix;
              }
          }

          static class Base {
              String who() {
                  return "base";
              }
          }

          static class Derived extends Base {
              String who() {
                  return "derived";
              }

              Supplier<String> above() {
                  return super::who;
              }

              Supplier<String> own() {
                  return this::who;
              }
          }

          final int base = 10;

          int plus(int x) {
              return base + x;
          }

          Function<Integer, Integer> adder() {
              return this::plus;
          }

          static int twice(int x) {
              return x * 2;
          }

          static int apply(IntBinaryOperator op, int a, int b) {
              return op.applyAsInt(a, b);
          }

          static <T, R> List<R> map(List<T> xs, Function<T, R> f) {
              List<R> out = new ArrayList<>();
              for (T x : xs) {
                  out.add(f.apply(x));
              }
              return out;
          }

          static Person next(int[] counter) {
              counter[0]++;
              return new Person("p" + counter[0]);
          }

          public static void main(String[] args) {
              Function<String, Person> maker = Person::new;
              Function<String, Person> factory = Person::of;
              Function<Person, String> name = Person::name;
              Person eve = maker.apply("eve");
              Function<String, String> shout = eve::shout;
              Supplier<List<String>> lists = ArrayList::new;
              List<String> made = lists.get();
              made.add(name.apply(factory.apply("fay")));
              System.out.println(made + " " + shout.apply("!") + " " + new MethodRefs().adder().apply(5) + " " + new Derived().above().get() + " " + new Derived().own().get());
              IntFunction<int[]> arrays = int[]::new;
              Function<Integer, String[]> strings = String[]::new;
              IntBinaryOperator larger = Math::max;
              UnaryOperator<String> upper = String::toUpperCase;
              Predicate<String> empty = String::isEmpty;
              Function<Object, String> text = String::valueOf;
              System.out.println(arrays.apply(3).length + " " + strings.apply(2).length + " " + apply(larger, 3, 9) + " " + apply(Integer::compare, 3, 9) + " " + upper.apply("up") + " " + empty.test("") + " " + text.apply(1.5) + " " + map(made, String::length) + " " + map(map(made, String::length), MethodRefs::twice));
              int[] counter = { 0 };
              Supplier<String> once = next(counter)::name;
              System.out.println(once.get() + once.get() + " " + counter[0]);
              Consumer<String> printer = System.out::println;
              printer.accept("printed");
              // through a parameterized type, and with the method's own type arguments
              Function<List<String>, Integer> size = List<String>::size;
              BiFunction<Map<String, Integer>, String, Integer> get = Map<String, Integer>::get;
              Function<String, List<String>> single = MethodRefs::<String>single;
              // a constructor's own type arguments; a method that is not generic ignores them
              Function<Integer, Tagged> tag = Tagged::<Integer>new;
              System.out.println(size.apply(made) + " " + (get.apply(Map.of("k", 3), "k") + 1) + " " + single.apply("one").get(0).length() + " " + tag.apply(7).text + " " + new <String>Tagged("s").text + " " + MethodRefs.<String>twice(4));
          }

          static class Tagged {
              final String text;

              <U> Tagged(U u) {
                  text = "tagged " + u;
              }
          }

          static <T> List<T> single(T x) {
              List<T> out = new ArrayList<>();
              out.add(x);
              return out;
          }
      }
