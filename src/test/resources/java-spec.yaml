  # An error the run time or the host raises is the exception the table in java.lisp
  # names, made the program's object for a clause above it: a division by zero an
  # ArithmeticException, an index outside an array an ArrayIndexOutOfBoundsException,
  # any other Lisp error a RuntimeException; a clause below lets it pass.
  - name: a-lisp-error-reaches-the-catch-of-the-exception-it-is
    main: LispErrors
    source: |
      class LispErrors {
          static int divide(int a, int b) {
              try {
                  return a / b;
              } catch (ArithmeticException e) {
                  System.out.println("caught: " + e.getMessage());
                  return -1;
              } finally {
                  System.out.println("finally " + a);
              }
          }

          static String read(int[] xs, int i) {
              try {
                  try {
                      return "read " + xs[i];
                  } catch (IllegalStateException e) {
                      return "not this clause";
                  }
              } catch (RuntimeException e) {
                  return "out of bounds";
              }
          }

          public static void main(String[] args) {
              System.out.println(divide(7, 2) + " " + divide(1, 0));
              System.out.println(read(new int[] {5}, 0) + " " + read(new int[] {5}, 1) + " " + read(new int[] {5}, -1));
              try {
                  System.out.println(10 % (args.length));
              } catch (Exception e) {
                  System.out.println(e.getMessage() + " " + (e instanceof ArithmeticException) + " " + e);
              }
              try {
                  System.out.println(Integer.parseInt("12x"));
              } catch (RuntimeException e) {
                  System.out.println("no number");
              }
              // the object a clause made of an error is the one thrown again and the
              // cause of another
              int[] two = new int[2];
              RuntimeException kept = null;
              try {
                  two[args.length + 5] = 1;
              } catch (RuntimeException e) {
                  kept = e;
                  e.addSuppressed(new IllegalStateException("aside"));
              }
              try {
                  throw kept;
              } catch (ArrayIndexOutOfBoundsException e) {
                  System.out.println((e == kept) + " " + e.getSuppressed().length + " " + e.getMessage());
              }
              try {
                  throw new IllegalStateException("wrapped", kept);
              } catch (Throwable e) {
                  System.out.println(e + " <- " + e.getCause() + " " + (e instanceof Exception) + " " + (e instanceof Error));
              }
          }
      }
