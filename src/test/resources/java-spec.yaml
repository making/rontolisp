      class Smalls {
          static int sum(int first, int... rest) {
              int total = first;
              for (int r : rest) total += r;
              return total;
          }

          static String join(String sep, String... parts) {
              StringBuilder sb = new StringBuilder();
              for (int i = 0; i < parts.length; i++) {
                  if (i > 0) sb.append(sep);
                  sb.append(parts[i]);
              }
              return sb.toString();
          }

          static String which(int a) { return "one"; }

          static String which(int... a) { return "many" + a.length; }

          static String which(Object a, Object... rest) { return "objects" + rest.length; }

          static Object pick(boolean b) { return b ? "text" : 1; }

          public static void main(String[] args) {
              System.out.println(sum(1) + " " + sum(1, 2, 3) + " [" + join("-") + "] " + join("-", "a", "b") + " " + join("+", new String[] {"x", "y"}) + " " + which(1) + " " + which() + " " + which("s", 2, 3) + " " + which(new int[] {1, 2, 3}));
              int[][] grid = new int[2][3];
              grid[1][2] = 5;
              String[][][] cube = new String[2][2][];
              double[][] ds = new double[2][2];
              long[][][] deep = new long[2][1][2];
              deep[1][0][1] = 1L << 40;
              System.out.println(grid.length + " " + grid[0].length + " " + grid[1][2] + grid[0][0] + " " + cube[1][1] + " " + cube[0].length + " " + ds[1][1] + " " + deep[1][0][1] + deep[0][0][0] + " " + (grid[0] != grid[1]));
              String text = """
                  Hello,
                    "World"!
                  end\
                   joined
                  """;
              String inline = """
                  a\\b "quoted" ""\"""";
              System.out.print(text);
              System.out.println(inline + " " + text.length() + " " + """
                  x""".equals("x"));
              var _ = sum(1, 2);
              int count = 0;
              for (var _ : new int[3]) count++;
              Runnable ignore = () -> { };
              try { Integer.parseInt("x"); } catch (RuntimeException _) { count += 10; }
              final int fixed;
              fixed = count * 2;
              int total = 0;
              for (int i = 0, j = 10; i < j; i += 3, j--) total += i * j;
              System.out.println(count + " " + fixed + " " + total + " " + pick(true) + " " + pick(false) + " " + (count > 0 ? 1 : 2.5) + " " + (count > 0 ? 'a' : 0) + (count > 0 ? null : 0) + " " + (count == 13 ? Integer.valueOf(7) : "s") + " " + (count > 0 ? 'x' : "str") + (count < 0 ? 1 : 'c'));
              boolean flag = true;
              flag &= count > 100;
              flag |= true;
              flag ^= true;
              Integer boxed = 5;
              boxed += 2;
              boxed++;
              String str = "s";
              str += 1 + 2;
              str += 'c';
              char ch = 'a';
              ch += 2;
              ch <<= 1;
              long big = 1;
              big <<= 40;
              big >>>= 3;
              big |= 5;
              double dd = 7;
              dd /= 2;
              dd %= 2;
              int[] cells = {1, 2};
              cells[0] <<= 4;
              cells[1] ^= cells[0];
              System.out.println(flag + " " + boxed + " " + str + " " + ch + " " + big + " " + dd + " " + cells[0] + cells[1]);
          }
      }
