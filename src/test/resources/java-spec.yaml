      body: 'class Above { private int count() { return 1; } } class Under extends Above { int get() { return count(); } }'
      error: "cannot find symbol"
    # super.x is this as the class above sees it, so there is none in a static method
    - name: a-field-through-super-in-a-static-method
      body: 'class Above { int count; } class Under extends Above { static int get() { return super.count; } }'
      error: "non-static variable super cannot be referenced from a static context"
    # Annotations are dropped, but a name no annotation type of the library has is
    # unknown, and @Override and @FunctionalInterface are checked
    - name: an-annotation-of-no-type-the-program-sees
      body: '@Data class P { }'
      error: "cannot find symbol"
    - name: an-override-of-nothing
      body: 'class P { @Override public String toStrin() { return ""; } }'
      error: "method does not override or implement a method from a supertype"
    - name: a-functional-interface-of-two-methods
      body: '@FunctionalInterface interface F { void a(); void b(); }'
      error: "Unexpected @FunctionalInterface annotation"
    - name: an-unresolved-name
      body: 'int x = y;'
      error: "cannot find symbol"
    # A checked exception is caught or declared (JLS 11.2): what a throw's value is, what
    # the method, the constructor or the close() a body calls declares.
    - name: a-checked-exception-thrown-and-neither-caught-nor-declared
      body: 'throw new java.io.IOException("x");'
      error: "unreported exception IOException; must be caught or declared to be thrown"
    - name: a-call-of-a-method-declaring-a-checked-exception
      body: 'Thread.sleep(1);'
      error: "unreported exception InterruptedException; must be caught or declared to be thrown"
    - name: a-resource-whose-close-declares-a-checked-exception
      body: 'try (java.io.Reader in = new java.io.StringReader("x")) { }'
      error: "unreported exception IOException; must be caught or declared to be thrown"
    - name: an-initializer-throwing-what-no-constructor-declares
      body: 'class Local { int held = make(); static int make() throws Exception { return 1; } }'
      error: "unreported exception Exception; must be caught or declared to be thrown"
    - name: a-default-constructor-over-a-constructor-that-throws
      body: 'class Above { Above() throws Exception { } } class Under extends Above { }'
      error: "unreported exception Exception in default constructor"
    # A catch parameter thrown again throws what its try left it, not its type.
    - name: a-catch-parameter-thrown-again-as-what-its-try-left-it
      body: 'try { Thread.sleep(1); } catch (Exception e) { throw e; }'
      error: "unreported exception InterruptedException; must be caught or declared to be thrown"
    # A clause takes what its try can throw, and nothing a clause before it took.
    - name: a-catch-of-a-checked-exception-its-try-does-not-throw
      body: 'try { int x = 1; } catch (java.io.IOException e) { }'
      error: "exception IOException is never thrown in body of corresponding try statement"
    - name: a-catch-of-a-class-a-clause-before-it-takes
      body: 'try { Thread.sleep(1); } catch (Exception e) { } catch (InterruptedException e) { }'
      error: "exception InterruptedException has already been caught"
    # A lambda's body and a method reference's method throw what the function type does.
    - name: a-lambda-throwing-what-its-function-type-does-not
      body: 'Runnable nap = () -> Thread.sleep(1);'
      error: "unreported exception InterruptedException; must be caught or declared to be thrown"
    - name: a-method-reference-throwing-what-its-function-type-does-not
      body: 'java.util.function.LongConsumer nap = Thread::sleep;'
      error: "incompatible thrown types InterruptedException in functional expression"
    # A type parameter of a throws clause is what the lambda given for it throws.
    - name: a-type-parameter-of-a-throws-clause-found-from-a-lambda
      body: 'interface Task<X extends Exception> { void run() throws X; } class Calls { static <X extends Exception> void call(Task<X> task) throws X { task.run(); } } Calls.call(() -> Thread.sleep(1));'
      error: "unreported exception InterruptedException; must be caught or declared to be thrown"
    # An override throws no more than what it overrides (JLS 8.4.8.3), and a throws
    # clause names exceptions.
    - name: an-override-throwing-what-the-overridden-method-does-not
      body: 'class Above { void run() { } } class Under extends Above { void run() throws Exception { } }'
      error: "run() in Under cannot override run() in Above"
    - name: a-throws-clause-of-no-throwable
      body: 'class Local { void run() throws String { } }'
      error: "incompatible types: String cannot be converted to Throwable"
    - name: an-unreachable-statement
      body: 'return; int x = 1;'
      error: "unreachable statement"
    # What is assigned and reached follows every branch as the language does: an
    # assignment on one path of a switch, a try, a do, && or ?: is no assignment after it.
    - name: a-switch-without-a-default-may-assign-nothing
      body: 'int x; switch (args.length) { case 1: x = 1; } int y = x;'
      error: "variable x might not have been initialized"
    - name: a-try-may-stop-before-it-assigns
      body: 'int x; try { x = Integer.parseInt("1"); } catch (RuntimeException e) { } int y = x;'
      error: "variable x might not have been initialized"
    - name: a-do-may-break-before-it-assigns
      body: 'int x; do { if (args.length > 0) break; x = 1; } while (false); int y = x;'
      error: "variable x might not have been initialized"
    - name: an-or-may-skip-its-assignment
      body: 'int x; boolean b = args.length > 0 || (x = 1) > 0; int y = x;'
      error: "variable x might not have been initialized"
    - name: a-blank-final-assigned-twice
      body: 'final int x; if (args.length > 0) x = 1; x = 2;'
      error: "variable x might already have been assigned"
    - name: a-blank-final-assigned-in-a-loop
      body: 'final int x; for (String a : args) x = 1;'
      error: "variable x might be assigned in loop"
    - name: a-blank-local-assigned-twice-is-not-effectively-final
      body: 'int x; x = 1; x = 2; Runnable r = () -> System.out.println(x);'
      error: "local variables referenced from a lambda expression must be final or effectively final"
    - name: a-do-loop-that-completes-misses-its-return
      body: 'class L { int f(boolean b) { do { b = !b; } while (b); } }'
      error: "missing return statement"
    - name: a-labeled-block-left-by-a-break-misses-its-return
      body: 'class L { int f(boolean b) { a: { if (b) break a; return 1; } } }'
      error: "missing return statement"
    - name: a-switch-without-a-default-misses-its-return
      body: 'class L { int f(int k) { switch (k) { case 1: return 1; } } }'
      error: "missing return statement"
    - name: a-blank-final-field-no-constructor-assigns
      body: 'class L { final int f; }'
      error: "variable f not initialized in the default constructor"
    - name: a-switch-rule-that-gives-no-value
      body: 'int k = switch (args.length) { case 0 -> { } default -> 1; };'
      error: "switch rule completes without providing a value"
    - name: an-inner-superclass-with-no-instance-around-it
      body: 'class O { class I { } } class S extends O.I { }'
      error: "an enclosing instance that contains O.I is required"
    - name: a-type-argument-is-no-subtype-of-another
      body: 'Box<String> b = new Box<String>("a"); Box<Object> o = b;'
      error: "incompatible types: Box<String> cannot be converted to Box<Object>"
    - name: a-primitive-is-no-type-argument
      body: 'java.util.List<int> xs = null;'
      error: "unexpected type"
    - name: a-wrong-number-of-type-arguments
      body: 'java.util.Map<String> m = null;'
      error: "wrong number of type arguments; required 2"
    - name: a-diamond-whose-argument-and-target-disagree
      body: 'Box<String> b = new Box<>(1);'
      error: "incompatible types: cannot infer type arguments for Box<>"
    - name: a-diamond-with-the-constructor-s-type-arguments
      body: 'Box<String> b = new <Integer>Box<>("a");'
      error: "cannot infer type arguments for Box<T>"
    - name: a-type-parameter-the-argument-and-the-target-disagree-on
      body: 'String s = id(1);'
      error: "incompatible types: inference variable T has incompatible bounds"
    - name: arguments-with-no-type-above-them-under-the-target
      body: 'String s = pick(1, "a");'
      error: "incompatible types: inferred type does not conform to upper bound(s)"
    # a type an open variable makes fit is checked against every other value given
    - name: a-value-the-target-does-not-take-beside-an-open-one
      body: 'java.util.List<String> a = pick(new java.util.ArrayList<>(), new java.util.ArrayList<Integer>());'
      error: "incompatible types: inference variable T has incompatible bounds"
    - name: an-argument-outside-its-type-parameter-s-bound
      body: 'int n = max("a", 1);'
      error: "method max in class Refused cannot be applied to given types;"
    - name: an-ambiguous-overload
      body: 'int r = two(1, 2);'
      error: "reference to two is ambiguous"
    - name: a-write-through-an-extends-wildcard
      body: 'java.util.List<? extends Object> xs = new java.util.ArrayList<String>(); xs.add("a");'
      error: "no suitable method found for add(String)"
    - name: an-instanceof-the-program-that-runs-cannot-answer
      body: 'Object o = "s"; boolean b = o instanceof java.util.List<String>;'
      error: "Object cannot be safely cast to List<String>"
    - name: a-lambda-where-no-functional-interface-is-wanted
      body: 'Object o = () -> 1;'
      error: "incompatible types: Object is not a functional interface"
    - name: a-lambda-cast-to-an-intersection-of-two-functions
      body: 'Object o = (Runnable & java.util.function.Supplier<String>) () -> "x";'
      error: "incompatible types: INT#1 is not a functional interface"
    - name: a-lambda-cast-to-an-intersection-with-a-class
      body: 'Object o = (String & Runnable) () -> { };'
      error: "incompatible types: bad intersection type target for lambda or method reference"
    - name: a-conditional-of-lambdas-in-a-cast
      body: 'Object o = (Runnable) (args.length > 0 ? () -> { } : () -> { });'
      error: "lambda expression not expected here"
    - name: a-lambda-returning-what-its-interface-does-not
      body: 'java.util.function.Function<String, Integer> f = s -> s;'
      error: "incompatible types: bad return type in lambda expression"
    - name: a-lambda-of-a-value-for-an-interface-giving-none
      body: 'Runnable r = () -> 1;'
      error: "incompatible types: lambda body is not compatible with a void functional interface"
    - name: a-lambda-with-the-wrong-number-of-parameters
      body: 'java.util.function.Function<String, Integer> f = (a, b) -> 1;'
      error: "incompatible types: incompatible parameter types in lambda expression"
    - name: a-method-reference-to-no-method
      body: 'java.util.function.Supplier<String> f = Refused::missing;'
      error: "invalid method reference"
    - name: boxes-of-two-types-compared
      body: 'Integer i = 1; Long l = 1L; boolean b = i == l;'
      error: "incomparable types: Integer and Long"
    - name: a-member-typed-through-its-type-argument
      body: 'Box<String> b = new Box<>("a"); Integer i = b.get();'
      error: "incompatible types: String cannot be converted to Integer"
    - name: a-member-of-an-inner-class-typed-through-the-arguments-around-it
      body: 'class O<T> { class I { T v; } } O<String>.I i = new O<String>().new I(); Integer n = i.v;'
      error: "incompatible types: String cannot be converted to Integer"
    - name: a-type-argument-outside-its-parameter-s-bound
      body: 'class N<T extends Number> { } N<String> n = null;'
      error: "type argument String is not within bounds of type-variable T"
    - name: a-field-written-through-an-extends-wildcard
      body: 'Box<? extends Number> b = new Box<Integer>(1); b.held = 2;'
      error: "incompatible types: int cannot be converted to CAP#1"
    - name: an-enhanced-for-over-what-is-neither-an-array-nor-iterable
      body: 'for (char c : "text") { }'
      error: "for-each not applicable to expression type"
    - name: a-type-variable-out-of-scope
      body: 'T t = null;'
      error: "cannot find symbol"
    - name: multi-catch-alternatives-related-by-subclassing
      body: 'try { } catch (RuntimeException | IllegalStateException e) { }'
      error: "Alternatives in a multi-catch statement cannot be related by subclassing"
    - name: a-resource-that-is-no-auto-closeable
      body: 'try (String s = "x") { }'
      error: "incompatible types: try-with-resources not applicable to variable type"
    - name: a-monitor-of-a-primitive
      body: 'synchronized (1) { }'
      error: "unexpected type"
    - name: a-synchronized-field
      body: 'class Local { synchronized int held; }'
      error: "modifier synchronized not allowed here"
    - name: a-volatile-method
      body: 'class Local { volatile void run() { } }'
      error: "modifier volatile not allowed here"
    - name: a-final-volatile-field
      body: 'class Local { final volatile int held = 1; }'
      error: "illegal combination of modifiers: final and volatile"
    - name: an-abstract-synchronized-method
      body: 'abstract class Local { abstract synchronized void run(); }'
      error: "illegal combination of modifiers: abstract and synchronized"
