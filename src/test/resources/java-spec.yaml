  # The report asks the thrown object's own toString(), then writes the exceptions it
  # suppressed and its causes as printStackTrace does; the location line follows them.
  - name: an-uncaught-exception-of-the-program-s-own-class
    file: Own.java
    source: |
      class Rejected extends Exception {
          final int code;

          Rejected(int code) {
              this.code = code;
          }

          public String toString() {
              return "Rejected with code " + code;
          }
      }

      public class Own {
          public static void main(String[] args) throws Rejected {
              System.out.println("before");
              Rejected rejected = new Rejected(7);
              rejected.initCause(new IllegalArgumentException("middle", new Error("root")));
              rejected.addSuppressed(new IllegalStateException("aside"));
              throw rejected;
          }
      }
