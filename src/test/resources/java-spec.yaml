      public class Dies {
          static class Failing extends Thread {
              Failing() {
                  super("failing");
              }

              @Override
              public void run() {
                  int[] none = new int[0];
                  System.out.println("about to fail");
                  none[1] = 1;
              }
          }

          public static void main(String[] args) throws InterruptedException {
              Thread thrower = new Thread(() -> {
                  throw new IllegalStateException("boom");
              }, "thrower");
              thrower.start();
              thrower.join();
              System.out.println("thrower ended " + thrower.isAlive());
              Failing failing = new Failing();
              failing.start();
              failing.join();
              System.out.println("main goes on");
              // a handler is asked instead: the thread's own, else the one every thread has
              Thread.UncaughtExceptionHandler all = (t, e) -> System.out.println("default: " + t.getName() + " " + e);
              Thread.setDefaultUncaughtExceptionHandler(all);
              Failing handled = new Failing();
              handled.start();
              handled.join();
              Thread own = new Thread(() -> {
                  throw new IllegalStateException("boom");
              }, "own");
              own.setUncaughtExceptionHandler((t, e) -> {
                  System.out.println("own: " + t.getName() + " " + e.getMessage() + " " + (t == Thread.currentThread()));
                  throw new IllegalArgumentException("what a handler throws ends there");
              });
              own.start();
              own.join();
              System.out.println((Thread.getDefaultUncaughtExceptionHandler() == all) + " "
                      + (handled.getUncaughtExceptionHandler() == null) + " " + own.isAlive());
              Thread.setDefaultUncaughtExceptionHandler(null);
              Thread again = new Thread(() -> {
                  throw new IllegalStateException("no handler again", new Error("its cause"));
              }, "again");
              again.start();
              again.join();
              // a class whose initialization throws in a thread says so in every other
              Thread first = new Thread(() -> System.out.println(Unusable.n), "first");
              first.start();
              first.join();
              try {
                  System.out.println(Unusable.n);
              } catch (NoClassDefFoundError e) {
                  System.out.println(e.getMessage() + " <- " + e.getCause());
              }
          }

          static class Unusable {
              static int n;

              static {
                  if (n == 0) {
                      throw new IllegalArgumentException("unusable");
                  }
              }
          }
      }
