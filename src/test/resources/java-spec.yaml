      import java.io.BufferedReader;
      import java.io.BufferedWriter;
      import java.io.IOException;
      import java.io.InputStreamReader;
      import java.io.OutputStreamWriter;
      import java.io.PrintWriter;

      public class ReadsInput {
          public static void main(String[] args) throws IOException {
              StringBuilder first = new StringBuilder();
              int b;
              while ((b = System.in.read()) != '\n' && b >= 0) {
                  first.append(b).append(' ');
              }
              System.out.println(first);
              BufferedReader in = new BufferedReader(new InputStreamReader(System.in));
              int n = Integer.parseInt(in.readLine().trim());
              int sum = 0;
              for (int i = 0; i < n; i++) {
                  for (String part : in.readLine().split(" ")) {
                      sum += Integer.parseInt(part);
                  }
              }
              System.out.println("sum " + sum);
              // a line ends at \r\n and at a \r alone too; a read between two lines
              System.out.println(in.readLine() + "|" + in.readLine() + "|" + in.readLine() + "|" + (char) in.read() + "|" + in.readLine());
              String line;
              while ((line = in.readLine()) != null) {
                  System.out.println(line.length() + " " + line);
              }
              System.out.println(in.read() + " " + System.in.read());
              // a line there is not is null, and null is its four letters in a text
              System.out.println("at the end: " + IO.readln());
              PrintWriter out = new PrintWriter(new BufferedWriter(new OutputStreamWriter(System.out)));
              out.printf("%d lines%n", n);
              out.flush();
          }
      }
