  # A static final field of a primitive type or String with a constant initializer is
  # inlined, so the order of the classes does not matter; any other static field is set
  # before main, in order.
  - name: a-constant-variable-is-its-value-and-static-fields-are-set-in-order
    main: Statics
    source: |
      class StaticsEarly {
          static final int DOUBLE = StaticsLate.BASE * 2;
          static final String LABEL = "n=" + StaticsLate.BASE + StaticsLate.SUFFIX;
      }

      class StaticsLate {
          static final int BASE = 21;
          static final String SUFFIX = "!";
          static final long BIG = 1L << 40;
          static final boolean ON = BASE > 20;
          static final double HALF = BASE / 2.0;
      }

      class Statics {
          static final int LIMIT = 10;
          static int counter = LIMIT * 2;
          static int next = counter + 1;
          static int[] table = {1, 2, 3};
          static String unset;
          static boolean flag;
          static double ratio;

          static int bump() {
              return ++counter;
          }

          public static void main(String[] args) {
              System.out.println(StaticsEarly.DOUBLE + " " + StaticsEarly.LABEL + " " + StaticsLate.BIG + " " + StaticsLate.ON + " " + StaticsLate.HALF);
              System.out.println(counter + " " + next + " " + bump() + " " + Statics.counter + " " + table.length + " " + unset + " " + flag + " " + ratio);
              Statics.counter += 5;
              table[0] = counter;
              unset = "set";
              System.out.println(counter + " " + table[0] + " " + unset);
          }
      }
    expected: |
      42 n=21! 1099511627776 true 10.5
      20 21 21 21 3 null false 0.0
      26 26 set
  # new T[n] is filled with the default of T; an initializer lists the elements, nested
  # for an array of arrays.
  - name: an-array-is-a-vector-with-the-default-of-its-element-type
    main: Arrays
    source: |
      class ArraysItem {
          int v;
      }

      class Arrays {
          static int sum(int[] xs) {
              int s = 0;
              for (int x : xs) s += x;
              return s;
          }

          public static void main(String[] args) {
              int[] ints = new int[3];
              long[] longs = new long[2];
              double[] doubles = new double[2];
              boolean[] flags = new boolean[2];
              char[] chars = new char[2];
              String[] strings = new String[2];
              ArraysItem[] items = new ArraysItem[2];
              System.out.println(ints[0] + " " + longs[1] + " " + doubles[0] + " " + flags[1] + " " + (int) chars[0] + " " + strings[1] + " " + items[0] + " " + args.length);
              int[] xs = {3, 1, 4, 1, 5, 9, 2, 6};
              for (int i = 0; i < xs.length; i++) {
                  for (int j = 0; j + 1 < xs.length - i; j++) {
                      if (xs[j] > xs[j + 1]) {
                          int t = xs[j];
                          xs[j] = xs[j + 1];
                          xs[j + 1] = t;
                      }
                  }
              }
              StringBuilder sb = new StringBuilder();
              for (int x : xs) sb.append(x).append(',');
              int[] alias = xs;
              alias[0] = 100;
              System.out.println(sb + " " + sum(xs) + " " + sum(new int[] {1, 2, 3}) + " " + xs[0] + " " + new int[0].length);
              int[][] grid = {{1, 2, 3}, {4, 5}, {}};
              int[][] rows = new int[2][];
              rows[1] = new int[] {7, 8};
              String[][] names = {{"a"}, {"b", "c"}};
              int cells = 0;
              for (int[] row : grid) cells += row.length;
              grid[1][0] += 10;
              System.out.println(cells + " " + grid[1][0] + " " + grid[0][2] + " " + rows[0] + " " + rows[1][1] + " " + names[1][1] + names.length);
              items[1] = new ArraysItem();
              items[1].v = 5;
              doubles[1] = 3;
              longs[0] = ints.length;
              System.out.println(items[1].v + " " + doubles[1] + " " + longs[0]);
          }
      }
    expected: |
      0 0 0.0 false 0 null null 0
      1,1,2,3,4,5,6,9, 130 6 100 0
      5 14 3 null 8 c2
      5 3.0 3
  # while, do, for and the enhanced for; break and continue leave a block only a body
  # with that exit is wrapped in; a local declared with no value is assigned on every
  # path.
  - name: a-loop-is-a-while-and-its-exits-are-blocks
    main: Loops
    source: |
      class Loops {
          static String grade(int score) {
              String grade;
              if (score >= 90) {
                  grade = "A";
              } else if (score >= 80) {
                  grade = "B";
              } else {
                  grade = "C";
              }
              return grade;
          }

          static int firstNegative(int[] xs) {
              for (int i = 0; i < xs.length; i++) {
                  if (xs[i] < 0) return i;
              }
              return -1;
          }

          public static void main(String[] args) {
              int n = 0, i = 0;
              while (true) {
                  i++;
                  if (i % 2 == 0) continue;
                  if (i > 10) break;
                  n += i;
              }
              int w = 0;
              do {
                  w += 3;
                  if (w == 6) continue;
                  w++;
              } while (w < 20);
              int once = 0;
              do once++; while (once < 0);
              System.out.println(n + " " + i + " " + w + " " + once);
              int pairs = 0;
              for (int a = 0, b = 10; a < b; a++, b--) {
                  for (int c = 0; c < 3; c++) {
                      if (c == 1) continue;
                      if (a == 3) break;
                      pairs++;
                  }
              }
              int k;
              for (k = 0; k < 100; k += 7) {
              }
              int spins = 0;
              for (;;) {
                  if (++spins == 5) break;
              }
              System.out.println(pairs + " " + k + " " + spins + " " + grade(95) + grade(85) + grade(10) + " " + firstNegative(new int[] {1, -2}) + " " + firstNegative(new int[0]));
              int total = 0;
              {
                  int x = 1;
                  total += x;
              }
              {
                  double x = 2.5;
                  total += x;
              }
              for (int x = 0; x < 3; x++) total += x;
              for (var x : new int[] {10, 20}) {
                  if (x == 10) continue;
                  total += x;
              }
              var text = "t";
              var count = total;
              if (count > 0) ; else count = -1;
              System.out.println(total + " " + text + count);
          }
      }
    expected: |
      25 11 20 1
      8 105 5 ABC 1 -1
      26 t26
  # extends is :include, a field a slot with its type's default, a constructor a
  # function run on a made instance: this(..) or super(..) first, then the field
  # initializers, then its body.
  - name: a-class-is-a-structure-and-a-constructor-a-function
    main: Classes
    source: |
      class ClassesBase {
          static int made;
          protected String label = "unnamed";
          int id;
          double weight;
          boolean heavy;
          ClassesBase other;

          ClassesBase() {
              made++;
              id = made;
          }

          ClassesBase(String label) {
              this();
              this.label = label;
          }

          String describe() {
              return label + "#" + id;
          }
      }

      class ClassesChild extends ClassesBase {
          int extra = id * 10;
          final int[] slots = new int[2];

          ClassesChild(String label, int extra) {
              super(label);
              this.extra += extra;
          }

          ClassesChild() {
              this("default", 1);
          }

          int extra() {
              return extra;
          }
      }

      class ClassesPlain {
          int v;
          String name;
      }

      class Classes {
          int count;

          void add(int count) {
              this.count += count;
              count = 0;
          }

          Classes self() {
              return this;
          }

          public static void main(String[] args) {
              ClassesBase a = new ClassesBase(), b = new ClassesBase("b");
              ClassesChild c = new ClassesChild("c", 5), d = new ClassesChild();
              System.out.println(a.describe() + " " + b.describe() + " " + c.describe() + " " + d.describe() + " " + ClassesBase.made);
              System.out.println(c.extra() + " " + d.extra + " " + c.slots.length + " " + a.weight + " " + a.heavy + " " + a.other + " " + c.label);
              a.other = c;
              a.other.id += 100;
              ClassesPlain p = new ClassesPlain();
              p.v++;
              Classes k = new Classes();
              k.add(2);
              k.self().self().add(3);
              System.out.println(c.id + " " + p.v + " " + p.name + " " + k.count + " " + (a.other == c) + " " + (a.other != d) + " " + (p.name == null));
          }
      }
    expected: |
      unnamed#1 b#2 c#3 default#4 4
      35 41 2 0.0 false null c
      103 1 null 5 true true true
  # The signature is in the function's name; the candidates an argument list fits with
  # no boxing come first, and among them the most specific wins.
  - name: an-overload-is-chosen-by-the-static-types-of-the-arguments
    main: Overloads
    source: |
      class OverloadsShape {
      }

      class OverloadsSquare extends OverloadsShape {
      }

      class Overloads {
          static String f(int x) { return "int"; }
          static String f(long x) { return "long"; }
          static String f(double x) { return "double"; }
          static String f(char x) { return "char"; }
          static String f(boolean x) { return "boolean"; }
          static String f(String x) { return "String"; }
          static String f(Object x) { return "Object"; }
          static String f(int[] x) { return "int[]"; }
          static String f(OverloadsShape x) { return "Shape"; }
          static String f(int x, double y) { return "int,double"; }
          static String f(double x, double y) { return "double,double"; }

          static String g(long x) { return "long"; }
          static String g(Integer x) { return "Integer"; }
          static String h(double x) { return "double"; }
          static String h(Object x) { return "Object"; }

          static int add(int a, int b) { return a + b; }
          static double add(double a, double b) { return a + b; }
          static String add(String a, String b) { return a + b; }

          String m(Object o) { return "instance Object"; }
          String m(String s) { return "instance String"; }

          public static void main(String[] args) {
              Object o = "s";
              Integer boxed = 3;
              OverloadsShape shape = new OverloadsSquare();
              System.out.println(f(1) + " " + f(1L) + " " + f(1.5) + " " + f('c') + " " + f(true) + " " + f("s") + " " + f(o) + " " + f(new int[0]));
              System.out.println(f(new OverloadsSquare()) + " " + f(shape) + " " + f(boxed) + " " + f(1, 2) + " " + f(1.0, 2) + " " + f('a' + 1) + " " + f((long) 1) + " " + f((Object) "s"));
              System.out.println(g(1) + " " + g(boxed) + " " + h(1) + " " + h(boxed) + " " + h('c') + " " + h("s"));
              System.out.println(add(1, 2) + " " + add(1.5, 2) + " " + add("a", "b") + " " + new Overloads().m("s") + " " + new Overloads().m(o) + " " + new Overloads().m(null));
          }
      }
