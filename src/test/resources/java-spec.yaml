      class ObjectMethodsPoint {
          final int x, y;

          ObjectMethodsPoint(int x, int y) {
              this.x = x;
              this.y = y;
          }

          public boolean equals(Object o) {
              if (!(o instanceof ObjectMethodsPoint)) return false;
              ObjectMethodsPoint p = (ObjectMethodsPoint) o;
              return x == p.x && y == p.y;
          }

          public int hashCode() {
              return 31 * x + y;
          }

          public String toString() {
              return "(" + x + ", " + y + ")";
          }
      }

      class ObjectMethodsPoint3 extends ObjectMethodsPoint {
          final int z;

          ObjectMethodsPoint3(int x, int y, int z) {
              super(x, y);
              this.z = z;
          }

          public String toString() {
              return super.toString() + "^" + z + " " + hashCode() + equals(this);
          }
      }

      class ObjectMethodsPlain {
          String tag() {
              return toString().substring(0, 19) + (hashCode() == hashCode()) + equals(this);
          }
      }

      class ObjectMethods {
          public static void main(String[] args) {
              ObjectMethodsPoint p = new ObjectMethodsPoint(1, 2), q = new ObjectMethodsPoint(1, 2);
              Object o = p, third = new ObjectMethodsPoint3(1, 2, 3);
              System.out.println(p.equals(q) + " " + (p == q) + " " + o.equals(q) + " " + q.equals(third) + " " + p.equals(null) + " " + p.equals("p") + " " + p.hashCode() + " " + o.hashCode() + " " + o + " " + p.toString().length() + " " + third);
              ObjectMethodsPlain plain = new ObjectMethodsPlain(), other = new ObjectMethodsPlain();
              Object asObject = plain;
              System.out.println(plain.equals(plain) + " " + plain.equals(other) + " " + asObject.equals(plain) + " " + (plain.hashCode() == asObject.hashCode()) + " " + (plain.toString().equals(asObject.toString())) + " " + plain.toString().equals(other.toString()) + " " + plain.tag());
              Object text = "text", number = 42, real = 2.5, yes = true, letter = 'c', none = null;
              System.out.println(text + " " + number + " " + real + " " + yes + " " + letter + " " + none + " " + text.equals("text") + " " + number.equals(42) + " " + number.equals("42") + " " + real.equals(2.5) + " " + yes.equals(true) + " " + letter.equals('c') + " " + text.equals(number));
