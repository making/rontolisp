      class CharStreams {
          static class Upper extends FilterOutputStream {
              Upper(OutputStream out) { super(out); }
              public void write(int b) throws IOException { out.write(Character.toUpperCase((char) b)); }
          }

          static class Failing extends OutputStream {
              public void write(int b) throws IOException { throw new IOException("full"); }
          }

          public static void main(String[] args) {
              try {
                  run();
              } catch (IOException e) {
                  throw new UncheckedIOException(e);
              }
          }

          static void run() throws IOException {
              ByteArrayOutputStream bytes = new ByteArrayOutputStream();
              PrintStream ps = new PrintStream(bytes);
              ps.print(1);
              ps.print('c');
              ps.print(2.5);
              ps.print(true);
              ps.print(3L);
              ps.print(1.5f);
              ps.print(new char[] {'x', 'y'});
              ps.print((String) null);
              ps.print((Object) null);
              ps.println();
              ps.println("é€");
              ps.printf("%d-%s%n", 7, "q").println(new int[0].length);
              ps.write(66);
              ps.write(new byte[] {67, 68}, 0, 2);
              System.out.println(bytes.size() + " " + bytes.toString() + "|" + ps.checkError());
              PrintStream failing = new PrintStream(new Failing());
              failing.print("x");
              System.out.println(failing.checkError());
              PrintStream upper = new PrintStream(new Upper(System.out), true);
              upper.println("shouted " + 1);
              PrintStream out = System.out;
              out.println("as a value");
              out.printf("%5.2f|%n", 3.14159).print("chained\n");
              System.out.printf("%s%n", "direct").println("chained too");
              OutputStream raw = System.out;
              raw.write("bytes é€ 😀\n".getBytes(StandardCharsets.UTF_8));
              raw.write(0xc3);
              raw.write(0xa9);
              raw.write('\n');
              raw.flush();

              StringWriter sw = new StringWriter();
              PrintWriter pw = new PrintWriter(sw);
              pw.println("line " + 1);
              pw.printf("%03d", 5);
              pw.print('c');
              pw.append("app").append('!').write("w");
              pw.flush();
              System.out.println(sw.toString().replace("\n", "/") + " " + sw.getBuffer().length());

              ByteArrayOutputStream encoded = new ByteArrayOutputStream();
              OutputStreamWriter osw = new OutputStreamWriter(encoded, StandardCharsets.UTF_8);
              osw.write("aé€");
              System.out.println(encoded.size() + " " + osw.getEncoding());
              osw.write(0xD83D);
              osw.write(0xDE00);
              osw.flush();
              System.out.println(Arrays.toString(encoded.toByteArray()));
              StringBuilder big = new StringBuilder();
              for (int i = 0; i < 10000; i++) {
                  big.append((char) ('a' + i % 26));
              }
              osw.write(big.toString());
              System.out.println(encoded.size());
              osw.close();
              System.out.println(encoded.size());
              try {
                  osw.write("x");
              }
              catch (IOException e) {
                  System.out.println(e.getMessage());
              }

              BufferedWriter bw = new BufferedWriter(sw, 4);
              bw.write("ab");
              System.out.println(sw.getBuffer().length());
              bw.write("cdefg");
              bw.newLine();
              System.out.println(sw.getBuffer().length());
              bw.flush();
              System.out.println(sw.getBuffer().length());

              InputStreamReader isr = new InputStreamReader(new ByteArrayInputStream(encoded.toByteArray(), 0, 20), "UTF-8");
              char[] cs = new char[4];
              int decoded = isr.read(cs, 0, 4);
              System.out.println(decoded + " " + new String(cs, 0, decoded) + " " + isr.read() + " " + isr.read() + " " + (char) isr.read() + " " + isr.ready());
              BufferedReader br = new BufferedReader(new StringReader("one\ntwo\r\nthree\rfour\n\nlast"));
              String line;
              while ((line = br.readLine()) != null) {
                  System.out.print("[" + line + "]");
              }
              System.out.println();
              br = new BufferedReader(new StringReader("abcdef\r\nxyz"), 3);
              br.mark(10);
              System.out.println((char) br.read() + "" + (char) br.read() + br.readLine() + br.read());
              br.reset();
              System.out.println(br.readLine() + " " + br.skip(1) + " " + br.readLine() + " " + br.readLine());
              try (BufferedReader closed = br) {
