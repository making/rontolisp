              System.out.println(queue.tryTransfer("nobody") + " " + queue.tryTransfer("nobody", 5, TimeUnit.MILLISECONDS)
                      + " " + queue.offer("a") + " " + queue + " " + queue.hasWaitingConsumer() + " "
                      + queue.remainingCapacity() + " " + queue.poll() + " " + queue.poll());
              List<String> seen = Collections.synchronizedList(new ArrayList<>());
              Thread consumer = new Thread(() -> {
                  try {
                      seen.add("took " + queue.take());
                      seen.add("took " + queue.poll(60, TimeUnit.SECONDS));
                  }
                  catch (InterruptedException e) {
                      seen.add("interrupted");
                  }
              });
              consumer.start();
              while (!queue.hasWaitingConsumer()) {
                  Thread.sleep(1);
              }
              System.out.println(queue.getWaitingConsumerCount() + " " + queue.tryTransfer("handed") + " " + queue.size());
              while (!queue.hasWaitingConsumer()) {
                  Thread.sleep(1);
              }
              System.out.println(queue.offer("offered") + " " + queue.size());
              consumer.join();
              // transfer waits behind the elements ahead of its own
              queue.add("ahead");
              Thread producer = new Thread(() -> {
                  try {
                      queue.transfer("transferred");
                      seen.add("the transfer is over");
                  }
                  catch (InterruptedException e) {
                      seen.add("interrupted");
                  }
              });
              producer.start();
              while (queue.size() < 2) {
                  Thread.sleep(1);
              }
              System.out.println(queue + " " + queue.peek() + " " + queue.take() + " " + producer.isAlive());
              String taken = queue.take();
              producer.join();
              System.out.println(taken + " " + seen + " " + queue.isEmpty());
              // a transfer that gives up takes its element back
              seen.clear();
              Thread giving = new Thread(() -> {
                  try {
                      seen.add("in time: " + queue.tryTransfer("timed", 20, TimeUnit.MILLISECONDS));
                      queue.transfer("lost");
                  }
                  catch (InterruptedException e) {
                      seen.add("interrupted, " + queue.size() + " left");
                  }
              });
              giving.start();
              while (seen.isEmpty() || queue.isEmpty()) {
                  Thread.sleep(1);
              }
              giving.interrupt();
              giving.join();
              System.out.println(seen + " " + queue);
              LinkedTransferQueue<Integer> numbers = new LinkedTransferQueue<>(List.of(3, 1, 2));
              Iterator<Integer> walk = numbers.iterator();
              walk.next();
              walk.remove();
              List<Integer> into = new ArrayList<>();
              System.out.println(numbers + " " + numbers.drainTo(into, 1) + " " + into + " " + numbers.contains(2) + " "
                      + numbers.remove(2) + " " + numbers.isEmpty());
              attempt(() -> queue.offer(null));
          }

          static final List<String> events = Collections.synchronizedList(new ArrayList<>());

          /** A pool that is asked around each task and at its end. */
          static class Asked extends ThreadPoolExecutor {
              Asked(int size) {
                  super(size, size, 60, TimeUnit.SECONDS, new LinkedBlockingQueue<>(), r -> new Thread(r, "asked"));
              }

              @Override
              protected void beforeExecute(Thread t, Runnable r) {
                  events.add("before " + (t == Thread.currentThread()) + " " + (r instanceof FutureTask));
              }

              @Override
              protected void afterExecute(Runnable r, Throwable t) {
                  events.add("after " + t);
              }

              @Override
              protected void terminated() {
                  events.add("terminated " + isShutdown() + " " + isTerminated() + " " + isTerminating() + " "
                          + getPoolSize());
              }
          }

          // what a pool is asked around its tasks, its sizes set later, and the pools of one thread
          static void hooksAndSizes() throws Exception {
              Asked asked = new Asked(1);
              asked.execute(() -> events.add("one"));
              asked.submit(() -> events.add("two")).get();
              asked.execute(() -> {
                  events.add("three");
                  throw new IllegalStateException("thrown");
              });
              asked.submit(() -> {
                  throw new IllegalArgumentException("in a future");
              });
              asked.shutdown();
              System.out.println(asked.awaitTermination(60, TimeUnit.SECONDS) + " " + asked.isTerminating() + " "
                      + asked.isTerminated() + " " + asked.getCompletedTaskCount());
              System.out.println(events);
              events.clear();
              Asked idle = new Asked(2);
              idle.shutdown();
              System.out.println(events + " " + idle.isTerminated());
              events.clear();
              ThreadPoolExecutor sized = new ThreadPoolExecutor(1, 2, 1, TimeUnit.SECONDS, new LinkedBlockingQueue<>());
              attempt(() -> {
                  sized.setCorePoolSize(-1);
                  return "set";
              });
              attempt(() -> {
                  sized.setCorePoolSize(3);
                  return "set";
              });
              attempt(() -> {
                  sized.setMaximumPoolSize(0);
                  return "set";
              });
              attempt(() -> {
                  sized.setKeepAliveTime(-1, TimeUnit.SECONDS);
                  return "set";
              });
              attempt(() -> {
                  sized.setThreadFactory(null);
                  return "set";
              });
              sized.setMaximumPoolSize(4);
              sized.setKeepAliveTime(2, TimeUnit.MINUTES);
              sized.setThreadFactory(r -> new Thread(r, "by hand"));
              // a larger core size starts a worker for each task that waits
              CountDownLatch gate = new CountDownLatch(1);
              CountDownLatch running = new CountDownLatch(3);
              List<String> names = Collections.synchronizedList(new ArrayList<>());
              for (int i = 0; i < 3; i++) {
                  sized.execute(() -> {
                      names.add(Thread.currentThread().getName());
                      running.countDown();
                      try {
                          gate.await();
                      }
                      catch (InterruptedException e) {
                          return;
                      }
                  });
              }
              System.out.println(sized.getPoolSize() + " " + sized.getQueue().size());
              sized.setCorePoolSize(3);
              running.await();
              Collections.sort(names);
              System.out.println(sized.getPoolSize() + " " + sized.getQueue().size() + " " + sized.getLargestPoolSize() + " "
                      + sized.getCorePoolSize() + " " + sized.getMaximumPoolSize() + " "
                      + sized.getKeepAliveTime(TimeUnit.SECONDS) + " " + sized.prestartCoreThread() + " "
                      + names.get(1).equals(names.get(2)) + " " + names.get(2));
              gate.countDown();
              sized.setCorePoolSize(4);
              System.out.println(sized.prestartAllCoreThreads() + " " + sized.getPoolSize() + " " + sized.prestartCoreThread());
              sized.shutdown();
              // the futures that were cancelled leave the queue when the pool is asked
              ThreadPoolExecutor purged = new ThreadPoolExecutor(1, 1, 0, TimeUnit.SECONDS, new LinkedBlockingQueue<>());
              CountDownLatch hold = new CountDownLatch(1);
              purged.execute(() -> {
                  try {
                      hold.await();
                  }
                  catch (InterruptedException e) {
                      return;
                  }
              });
              Future<?> dropped = purged.submit(() -> events.add("dropped"));
              purged.submit(() -> events.add("kept"));
              dropped.cancel(false);
              int before = purged.getQueue().size();
              purged.purge();
              System.out.println(before + " " + purged.getQueue().size());
              hold.countDown();
              purged.shutdown();
              // a pool with no core thread still runs what waits in its queue
              ThreadPoolExecutor none = new ThreadPoolExecutor(0, 2, 0, TimeUnit.SECONDS, new LinkedBlockingQueue<>());
              CountDownLatch ran = new CountDownLatch(2);
              none.execute(ran::countDown);
              none.execute(ran::countDown);
              System.out.println(ran.await(60, TimeUnit.SECONDS) + " " + none.prestartCoreThread() + " "
                      + none.prestartAllCoreThreads() + " " + purged.awaitTermination(60, TimeUnit.SECONDS) + " " + events);
              none.shutdown();
              // a pool of one thread is behind a wrapper: no ThreadPoolExecutor to set the size of
              ExecutorService single = Executors.newSingleThreadExecutor();
              ScheduledExecutorService timed = Executors.newSingleThreadScheduledExecutor();
              ExecutorService fixed = Executors.newFixedThreadPool(2);
              ExecutorService wrapped = Executors.unconfigurableExecutorService(fixed);
              System.out.println((single instanceof ThreadPoolExecutor) + " " + (timed instanceof ScheduledThreadPoolExecutor)
                      + " " + (fixed instanceof ThreadPoolExecutor) + " " + (wrapped instanceof ThreadPoolExecutor) + " "
                      + named(single) + " " + named(timed) + " " + named(wrapped));
              System.out.println(single.submit(() -> "through the wrapper").get() + ", "
                      + timed.schedule(() -> "at its time", 5, TimeUnit.MILLISECONDS).get() + ", "
                      + wrapped.invokeAny(List.of(() -> "any")));
              wrapped.shutdown();
              single.shutdown();
              System.out.println(fixed.isShutdown() + " " + single.awaitTermination(60, TimeUnit.SECONDS) + " "
                      + single.isTerminated() + " " + timed.shutdownNow().size());
              attempt(() -> Executors.unconfigurableExecutorService(null));
          }

          /** The class an object's text names. */
          static String named(Object object) {
              String text = object.toString();
              return text.substring(0, text.indexOf('@'));
          }
      }
