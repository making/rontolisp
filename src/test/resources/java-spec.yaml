  # A name holding no lowercase letter is escaped, so T, NIL, LIST and a class named
  # PRINT are the program's and never the pipeline's.
  - name: a-name-that-is-a-common-lisp-symbol-stays-the-program-s
    main: LispNames
    source: |
      class T {
          static int NIL = 1;
          int CAR = 2;

          static int LIST(int T) {
              return T + NIL;
          }

          int CDR() {
              return CAR * 2;
          }
      }

      class PRINT {
          final T T = new T();

          public String toString() {
              return "PRINT" + T.CDR();
          }
      }

      class LispNames {
          static final int QUOTE = 7;
          static int LAMBDA = 8;

          public static void main(String[] args) {
              int t = 1, nil = 2, list = 3, NIL = 5, IF = 6, X = 9;
              T LET = new T();
              LET.CAR += X;
              String string = "s", length = "l";
              PRINT PROGN = new PRINT();
              System.out.println(t + nil + list + NIL + IF + " " + T.NIL + " " + T.LIST(10) + " " + LET.CAR + " " + LET.CDR() + " " + QUOTE + LAMBDA + " " + string + length + " " + PROGN + " " + (LET instanceof T) + " " + PROGN.getClass().getName() + " " + LET.toString().substring(0, 2));
          }
      }
    expected: |
      17 1 11 11 22 78 sl PRINT4 true PRINT T@
  # A class is found by its simple name through java.lang, the imports and the file, or
  # by its qualified name.
  - name: a-qualified-name-names-its-class
    main: Qualified
    source: |
      class Qualified {
          static java.lang.String join(java.util.List<java.lang.String> parts) {
              java.lang.StringBuilder sb = new java.lang.StringBuilder();
              for (String part : parts) sb.append(part).append(java.lang.String.valueOf('/'));
              return sb.toString();
          }

          public static void main(java.lang.String[] args) {
              java.util.ArrayList<String> parts = new java.util.ArrayList<>();
              parts.add("a");
              parts.add("b");
              java.util.Map<String, java.lang.Integer> sizes = new java.util.HashMap<String, Integer>();
              sizes.put("k", java.lang.Integer.MAX_VALUE);
              java.lang.Object o = join(parts);
              try {
                  throw new java.lang.IllegalStateException("q");
              } catch (java.lang.RuntimeException e) {
                  java.lang.System.out.println(o + " " + sizes.get("k") + " " + java.lang.Math.max(1, 2) + " " + e.getMessage() + " " + java.lang.Math.PI + " " + Qualified.join(parts).length());
              }
          }
      }
    expected: |
      a/b/ 2147483647 2 q 3.141592653589793 4
