# The corpus of the EXPERIMENTAL front end for a subset of the Java language
# (JavaSpecE2eTest): one case per decision of the lowering in .kb/java-frontend.md.
# Written here; nothing is copied or translated from a JDK or its tests
# (.kb/java-frontend-provenance.md).
#
# The cases are concatenated into ONE program per backend, behind `imports` and a class
# whose main calls each case's `main` class in order, and the output is sliced back per
# case -- the ci-spec.yaml idea. So every class of a case carries the case's name. A
# `standalone` case is a file of its own, named `file`: one that starts another way, or
# one that ENDS with an uncaught exception -- it prints `stdout`, then reports `error`.
#
# Every expectation is what a JDK 25 prints, and the test runs the corpus under the JDK
# running it as its first leg: an expectation that is not the JDK's fails there. Every
# case must print the same on the interpreter, the JVM, wasm and the component.
#
# `refused` holds programs that must NOT compile: its scaffold with a case's `body` as
# the statements of main. The JDK leg checks the error and its line, the front end leg
# that it refuses at the same line with a message starting the same.
