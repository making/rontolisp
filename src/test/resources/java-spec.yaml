  # The diamond, a generic method, var and a lambda find their types from the arguments,
  # from the type the value is wanted as, and from the lambdas among the arguments, each
  # lowered once its own parameters are known. Overloads are chosen with them.
  - name: a-type-argument-is-found-from-the-arguments-the-target-and-the-lambdas
    main: Inference
    source: |
      class Inference {
          static <T> T pick(T a, T b) {
              return a != null ? a : b;
          }

          static <T extends Comparable<? super T>> T clamp(T v, T lo, T hi) {
              return v.compareTo(lo) < 0 ? lo : v.compareTo(hi) > 0 ? hi : v;
          }

          static <A, B, C> Function<A, C> compose(Function<A, B> f, Function<B, C> g) {
              return a -> g.apply(f.apply(a));
          }

          static <T> List<T> filter(List<T> xs, Predicate<? super T> p) {
              List<T> out = new ArrayList<>();
              for (T x : xs) {
                  if (p.test(x)) {
                      out.add(x);
                  }
              }
              return out;
          }

          static <T, R> List<R> map(List<T> xs, Function<? super T, ? extends R> f) {
              List<R> out = new ArrayList<>();
              for (T x : xs) {
                  out.add(f.apply(x));
              }
              return out;
          }

          static <T> T fold(List<T> xs, T zero, BinaryOperator<T> op) {
              T acc = zero;
              for (T x : xs) {
                  acc = op.apply(acc, x);
              }
              return acc;
          }

          static <T> List<T> build(int n, IntFunction<T> f) {
              List<T> out = new ArrayList<>();
              for (int i = 0; i < n; i++) {
                  out.add(f.apply(i));
              }
              return out;
          }

          static <T> T make(Supplier<T> s) {
              return s.get();
          }

          static <T> List<T> empty() {
              return new ArrayList<>();
          }

          static int size(List<String> xs) {
              return xs.size();
          }

          static String which(Object o) {
              return "object";
          }

          static String which(String s) {
              return "string";
          }

          static <T> String which(List<T> xs) {
              return "list";
          }

          static String run(Runnable r) {
              r.run();
              return "ran";
          }

          static <T> String run(Supplier<T> s) {
              return "got " + s.get();
          }

          @SuppressWarnings("unchecked")
          static <T> T cast(Object o) {
              return (T) o;
          }

          public static void main(String[] args) {
              Map<String, List<Integer>> groups = new HashMap<>();
              groups.put("a", new ArrayList<>());
              groups.get("a").add(1);
              var names = build(3, i -> "n" + i);
              System.out.println(groups.get("a") + " " + names + " " + names.get(2).length() + " " + size(empty()) + " " + size(new ArrayList<>()) + " " + Inference.<Integer>empty().size());
              List<Integer> squares = build(5, i -> i * i);
              System.out.println(filter(squares, x -> x % 2 == 0) + " " + map(squares, x -> x + 0.5) + " " + map(map(squares, x -> "s" + x), String::length) + " " + fold(squares, 0, (x, y) -> x + y) + " " + fold(map(squares, x -> "" + x), "", (x, y) -> x + y));
              String chosen = pick(null, "fallback");
              int number = pick(1, 2);
              long wide = pick(3, 4);
              boolean truth = pick(true, false);
              Object either = pick("s", 1);
              System.out.println(chosen + " " + number + " " + wide + " " + truth + " " + either + " " + clamp(15, 0, 10) + " " + clamp("m", "a", "f") + " " + Inference.<Integer>pick(null, 3) + " " + compose((String s) -> s.length(), n -> n * 2).apply("four"));
              boolean on = args.length == 0;
              Supplier<String> lazy = on ? () -> "yes" : () -> "no";
              Function<Integer, Function<Integer, Integer>> adder = x -> y -> x + y;
              String text = cast("text");
              int forty = Inference.<Integer>cast(41) + 1;
              System.out.println(lazy.get() + " " + adder.apply(2).apply(3) + " " + make(() -> "made") + " " + make(ArrayList::new) + " " + text + " " + forty + " " + ((Supplier<Integer>) () -> 5).get());
              System.out.println(which("s") + " " + which(1) + " " + which(squares) + " " + which(empty()) + " " + run(() -> System.out.print("")) + " " + run(() -> 42) + " " + run(() -> {
                  return "block";
              }));
          }
      }
