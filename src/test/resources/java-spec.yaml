    source: |
      interface LocalGreeter {
          String greet(String name);
      }

      abstract class LocalBase {
          final String id;

          // what a subclass does not inherit hides nothing around the subclass
          private int base = -1;

          LocalBase(String id) { this.id = id; }

          private int offset() { return base; }

          abstract int value();

          public String toString() { return id + "=" + value(); }
      }

      class Locals {
          int field = 5;

          static int offset() { return 0; }

          LocalGreeter fromField = new LocalGreeter() {
              public String greet(String name) { return name + field; }
          };

          static LocalGreeter prefixed(String prefix) {
              return new LocalGreeter() {
                  int calls;

                  public String greet(String name) { calls++; return prefix + name + calls; }
              };
          }

          int walk(int depth) {
              class Step {
                  int down(int n) { return n == 0 ? field : new Step().down(n - 1) + depth; }
              }
              return new Step().down(depth);
          }

          public static void main(String[] args) {
              int base = 100;
              String label = "L";
              class Counter {
                  int n;

                  int next() { n++; return base + n; }

                  public String toString() { return label + n; }
              }
              class Doubling extends Counter {
                  int next() { return super.next() * 2 + base; }
              }
              record Pair(int a, int b) { int sum() { return a + b; } }
              enum Mode { ON, OFF }
              interface Scorer { int score(Pair pair); }
              Counter c = new Counter();
              c.next();
              Counter twice = new Doubling();
              Scorer scorer = pair -> pair.sum() + base;
              System.out.println(c.next() + " " + c + " " + twice.next() + " " + twice + " " + new Pair(1, 2) + " " + scorer.score(new Pair(3, 4)) + " " + Mode.OFF + Mode.values().length);
              LocalGreeter g = prefixed("p:");
              System.out.println(g.greet("a") + " " + g.greet("b") + " " + new Locals().fromField.greet("f") + " " + new Locals().walk(3));
              LocalBase b = new LocalBase("anon") {
                  int extra = base / 2;

                  int value() { return base + extra + offset(); }
              };
              System.out.println(b + " " + b.id + " " + c.getClass().getName() + " " + g.getClass().getName() + " " + b.getClass().getName() + " " + new Pair(0, 0).getClass().getName());
              ArrayList<Runnable> runs = new ArrayList<>();
              for (int i = 0; i < 3; i++) {
                  int copy = i;
                  runs.add(new Runnable() {
                      public void run() {
                          Runnable inner = new Runnable() {
                              public void run() { System.out.print("run " + copy + label + base + " "); }
                          };
                          inner.run();
                      }
                  });
                  runs.add(() -> System.out.print(new Object() { int twice() { return copy * 2; } }.twice() + " "));
              }
              for (Runnable r : runs) r.run();
              Supplier<Object> made = () -> new Object() { };
              Object after = new Object() { };
              System.out.println("done " + made.get().getClass().getName() + " " + after.getClass().getName());
          }
      }
