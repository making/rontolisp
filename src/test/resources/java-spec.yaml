      class Strings {
          public static void main(String[] args) {
              String s = "Hello, World", n = null;
              Object o = null;
              System.out.println("null: " + n + " " + null + " " + o + " " + 'c' + 1 + 2L + 1.5 + true + " \t|\"q\"\\ é \101" + (1 + 2) + 1 + 2);
              System.out.println(s.length() + " " + s.charAt(4) + " " + s.substring(7) + " " + s.substring(0, 5) + " " + s.indexOf("World") + " " + s.indexOf("xyz") + " " + s.toUpperCase() + " " + s.toLowerCase());
              System.out.println(s.isEmpty() + " " + "".isEmpty() + " " + s.equals("Hello, World") + " " + s.equals(null) + " " + s.equals(o) + " " + "ab".equals("a" + "b") + " " + s.hashCode() + " " + "".hashCode() + " " + s.toString());
              s += 1;
              s += 'c';
              s += null;
              s += 2.5;
              System.out.println(s + " " + String.valueOf(42) + String.valueOf('x') + String.valueOf(1.0) + String.valueOf(true) + Integer.toString(-7) + Integer.parseInt("-123") + Integer.parseInt("+45"));
