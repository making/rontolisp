  # The collections threads share and a value set once: a ConcurrentHashMap keeps the
  # order a program sees and its walk never refuses, a CopyOnWriteArrayList is walked as
  # it was, a ConcurrentLinkedQueue; a CompletableFuture's stages, the exception going
  # down them, every one of several and the first. Then a set and a deque, the arrays
  # of atomics and a sum; the order a future's dependents run in (the one added last
  # first, what depends on it right after it); the stages of two futures, a future with
  # a limit; a task that splits into tasks on a pool's threads. Then the accumulators,
  # what is made of a failure on another thread or by another stage, a value set over
  # a future's, a stage that is no future, a subclass whose stages are its own, and the
  # tasks that count what is pending.
