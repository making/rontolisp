      class CastsCircle extends CastsBase {
          public double area() {
              return 3.0;
          }
      }

      class CastsOther {
      }

      class Casts {
          static String kind(Object o) {
              if (o instanceof String) return "string";
              if (o instanceof CastsSquare) return "square";
              if (o instanceof CastsShape) return "shape";
              if (o instanceof CastsOther) return "other";
              return "unknown";
          }

          public static void main(String[] args) {
              Object o = new CastsSquare(2), nothing = null;
              CastsShape shape = (CastsShape) o;
              CastsNamed named = (CastsNamed) shape;
              CastsBase base = (CastsBase) named;
              CastsSquare square = (CastsSquare) base;
              CastsShape none = (CastsShape) nothing;
              String text = (String) (Object) "text";
              System.out.println(shape.area() + " " + named.name() + " " + base.name() + " " + square.s + " " + text + " " + (none == null));
