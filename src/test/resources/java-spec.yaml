  # A float is the double of its value, each operation's result rounded to the float,
  # and prints the shortest decimal that reads back as the float; a byte and a short are
  # integers that an operator promotes and an assignment or a cast narrows; their boxes
  # are the value in a cons with its tag, as a Long's.
  - name: float-byte-and-short-are-a-double-and-integers-of-their-width
    main: SmallNumbers
    source: |
      class SmallNumbersPoint {
          final float x;
          final byte b;
          SmallNumbersPoint(float x, byte b) { this.x = x; this.b = b; }
      }

      record SmallNumbersPair(float x, short s) {
      }

      class SmallNumbers {
          static final byte LIMIT = 100;
          static final float RATE = 1.5f;

          static int pick(byte b) { return 1; }
          static int pick(short s) { return 2; }
          static int pick(int i) { return 3; }
          static int pick(float f) { return 4; }

          public static void main(String[] args) {
              float f = 0.1f, acc = 0, h = 3;
              for (int i = 0; i < 10; i++) acc += f;
              h /= 0;
              System.out.println(f + " " + (f + 0.2f) + " " + (double) f + " " + f * 3 + " " + 1.0f / 3 + " " + acc + " " + -f + " " + (f == 0.1) + " " + h + " " + h * 0 + " " + 5.5f % 2 + " " + -0.0f);
              System.out.println(1e10f + " " + 1.0e-10f + " " + 100f + " " + 1234567.0f + " " + 12345678f + " " + 0.001f + " " + 0.0001f + " " + Float.MAX_VALUE + " " + Float.MIN_VALUE + " " + Float.MIN_NORMAL + " " + -1.25e-7f + " " + LIMIT + RATE);
              long big = 123456789012345678L;
              float g = 16777216f;
              g += 1;
              System.out.println((float) big + " " + (float) Long.MAX_VALUE + " " + (float) 16777217 + " " + (float) Math.PI + " " + (float) 1e40 + " " + (int) 3.9f + " " + (long) -2.5f + " " + (long) 1e19f + " " + (int) Float.NaN + " " + (char) 65.7f + " " + g + " " + (g + 1.0));
              byte b = 10;
              b += 120;
              b++;
              short s = -32768;
              s--;
              char c = 'A';
              var t = true ? b : s;
              System.out.println(b + " " + (byte) 200 + " " + (byte) -129 + " " + (short) 70000 + " " + (int) (char) (byte) -1 + " " + s + " " + (s >> 2) + " " + (b << 3) + " " + (byte) (b << 3) + " " + t + " " + (true ? c : 1) + " " + (false ? b : 'B'));
              System.out.println(pick(b) + " " + pick(s) + " " + pick('c') + " " + pick(1L) + " " + pick(LIMIT));
              switch (b) {
                  case -125 -> System.out.println("a byte selector");
                  default -> System.out.println("other");
              }
              Float boxed = 2.5f;
              Byte bb = (byte) 7;
              Short ss = (short) -3;
              Object any = boxed;
              Number n = 2.75f;
              System.out.println(boxed + " " + bb + " " + ss + " " + (any instanceof Float) + " " + (any instanceof Double) + " " + any.equals(2.5f) + " " + any.equals(2.5) + " " + boxed.hashCode() + " " + bb.hashCode() + " " + Float.compare(-0.0f, 0.0f) + " " + n.intValue() + " " + n.doubleValue() + " " + ((Number) 300).byteValue() + " " + ((Number) 70000L).shortValue());
              List<Float> list = new ArrayList<>(List.of(1.5f, f));
              float sum = 0;
              for (float x : list) sum += x;
              Map<Float, String> m = new HashMap<>();
              m.put(Float.NaN, "nan");
              Object[] objs = {1, 2L, 3.0, 4.0f, (byte) 5, (short) 6};
              StringBuilder names = new StringBuilder();
              for (Object o : objs) names.append(o).append(':').append(o.getClass().getSimpleName()).append(' ');
              System.out.println(list + " " + sum + " " + m.get(Float.NaN) + " " + names + any.getClass().getName());
              System.out.println(Float.parseFloat("3.4028236e38") + " " + Float.parseFloat("1.17549435E-38") + " " + Float.valueOf("1e-46") + " " + Byte.parseByte("-12") + " " + Short.parseShort("-7") + " " + Short.MAX_VALUE + " " + Byte.MIN_VALUE + " " + String.format("%d %x %.2f", bb, (byte) -1, boxed) + " " + Math.round(2.5f) + " " + Math.abs(-1.5f) + " " + Math.max(1f, 2f) + " " + Float.isNaN(0f / 0));
              try {
                  Byte.parseByte("200");
              } catch (NumberFormatException e) {
                  System.out.println(e.getMessage());
              }
              SmallNumbersPair p = new SmallNumbersPair(0.5f, (short) 4);
              SmallNumbersPoint q = new SmallNumbersPoint(1.25f, (byte) -2);
              System.out.println(p + " " + p.equals(new SmallNumbersPair(0.5f, (short) 4)) + " " + p.hashCode() + " " + q.x + q.b);
          }
      }
