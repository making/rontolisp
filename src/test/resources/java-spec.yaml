  # A Matcher's region with its anchoring and transparent bounds, hitEnd and requireEnd
  # as a JDK 25 answers them, appendReplacement and appendTail (a group number the pattern
  # does not have leaves what stood before it appended), a replacement by a function,
  # toMatchResult and a pattern as a predicate.
  - name: a-matcher-keeps-a-region-tells-what-it-read-and-appends-its-replacements
    main: MatcherRest
    source: |
      class MatcherRest {
          interface Step {
              Object run();
          }

          static void tell(String label, Step step) {
              try {
                  System.out.println(label + ": " + step.run());
              }
              catch (RuntimeException e) {
                  System.out.println(label + ": " + e);
              }
          }

          public static void main(String[] args) {
              // a region: the searches stay in it, and its bounds anchor and hide what is outside
              Matcher words = Pattern.compile("\\b\\w+\\b").matcher("one two three");
              words.region(2, 9);
              StringBuilder found = new StringBuilder();
              while (words.find()) {
                  found.append(words.group()).append('@').append(words.start()).append(' ');
              }
              System.out.println(found + "| " + words.regionStart() + "," + words.regionEnd() + " " + words.hasAnchoringBounds() + " " + words.hasTransparentBounds());
              words.useTransparentBounds(true).region(2, 9);
              found.setLength(0);
              while (words.find()) {
                  found.append(words.group()).append('@').append(words.start()).append(' ');
              }
              System.out.println(found + "| " + words);
              Matcher line = Pattern.compile("^two$").matcher("one two three");
              System.out.println(line.region(4, 7).matches() + " " + line.useAnchoringBounds(false).region(4, 7).matches() + " " + line.region(4, 7).lookingAt()
                      + " " + line.reset().regionEnd() + " " + line.hasAnchoringBounds() + " " + line.find());
              Matcher behind = Pattern.compile("(?<=one )two(?= three)").matcher("one two three");
              System.out.println(behind.region(4, 7).find() + " " + behind.useTransparentBounds(true).region(4, 7).find() + " " + behind.start() + " " + behind.find(0) + " " + behind.regionStart());
              // a lexer: each token is looked for where the last one ended
              Pattern token = Pattern.compile("\\s*(?:(\\d+)|([a-z]+)|(.))");
              Matcher lexer = token.matcher("let x1 = 42+y;");
              StringBuilder tokens = new StringBuilder();
              for (int at = 0; at < lexer.regionEnd() && lexer.region(at, lexer.regionEnd()).lookingAt(); at = lexer.end()) {
                  tokens.append(lexer.group(1) != null ? "num" : lexer.group(2) != null ? "id" : "op").append(lexer.end()).append(' ');
              }
              System.out.println(tokens.toString().trim());
              tell("region start", () -> words.region(-1, 2));
              tell("region end", () -> words.region(2, 14));
              tell("region order", () -> words.region(5, 4));

              // whether the search read the end of the input, and whether its match needs it
              for (String[] probe : new String[][] {{"a+", "caa"}, {"a+", "aab"}, {"ab|a", "ca"}, {"a$", "ba"}, {"a$", "ba\n"}, {"a\\b", "a"}, {"a\\z", "a"}, {"a(?!b)", "a"}, {"^a", "ba"}, {"abc", "xab"}, {"a?", "a"}}) {
                  Matcher m = Pattern.compile(probe[0]).matcher(probe[1]);
                  StringBuilder flags = new StringBuilder();
                  while (m.find()) {
                      flags.append(m.start()).append('-').append(m.end()).append(m.hitEnd() ? " hit" : "").append(m.requireEnd() ? " needed" : "").append(", ");
                  }
                  flags.append(m.hitEnd() ? "hit" : "no hit").append("; whole ").append(m.matches()).append(m.hitEnd() ? " hit" : "");
                  System.out.println(probe[0] + " over " + probe[1].replace("\n", "\\n") + ": " + flags);
              }

              // a replacement built match by match
              Matcher digits = Pattern.compile("(\\d)(\\d)?").matcher("a12b3c");
              StringBuffer buffer = new StringBuffer();
              while (digits.find()) {
                  digits.appendReplacement(buffer, "[$2$1]");
              }
              System.out.println(digits.appendTail(buffer));
              digits.reset();
              StringBuilder builder = new StringBuilder();
              digits.find();
              digits.appendReplacement(builder, Matcher.quoteReplacement("$1\\"));
              tell("twice", () -> digits.appendReplacement(builder, "again"));
              System.out.println(digits.appendTail(builder) + " " + digits.find() + " " + digits.appendReplacement(builder, "<$0>").appendTail(builder));
              tell("no match", () -> digits.reset().appendReplacement(new StringBuilder(), "x"));
              digits.find();
              tell("no group", () -> digits.appendReplacement(builder, "$3"));
              tell("no name", () -> digits.appendReplacement(builder, "${n}"));
              tell("no escape", () -> digits.appendReplacement(builder, "x\\"));
              System.out.println(builder + " " + digits.appendTail(new StringBuilder()));
              Matcher letters = Pattern.compile("[a-c]").matcher("abcd");
              System.out.println(letters.replaceAll(m -> m.group().toUpperCase() + m.start()) + " " + letters.replaceFirst(m -> "\\$" + m.end())
                      + " " + letters.replaceAll(m -> "") + " " + Pattern.compile("x").matcher("abc").replaceAll(m -> "y") + " " + letters.find());
              tell("replacer", () -> letters.replaceAll((Function<MatchResult, String>) null));

              // a match kept as it was
              Matcher pair = Pattern.compile("(?<key>\\w+)=(?<value>\\w*)|(;)").matcher("a=1;bb=;c");
              pair.find();
              MatchResult first = pair.toMatchResult();
              pair.find();
              pair.find();
              MatchResult third = pair.toMatchResult();
              System.out.println(first.group() + " " + first.start() + "-" + first.end() + " " + first.group(1) + "/" + first.group("value") + " " + first.group(3) + " " + first.start(3)
                      + " " + first.groupCount() + " " + first.hasMatch() + " | " + third.group("key") + " " + third.start("key") + "-" + third.end("value") + " [" + third.group(2) + "] " + pair.hasMatch());
              pair.find();
              pair.find();
              MatchResult none = pair.toMatchResult();
              System.out.println(none.hasMatch() + " " + none.groupCount() + " " + pair.hasMatch());
              tell("no result", none::group);
              tell("no result start", () -> none.start(1));
              tell("no such group", () -> first.group(4));
              tell("no such name", () -> first.group("other"));
              tell("null name", () -> first.start(null));

              // a pattern as a test
              Predicate<String> some = Pattern.compile("\\d+").asPredicate();
              Predicate<String> all = Pattern.compile("\\d+").asMatchPredicate();
              System.out.println(some.test("a1") + " " + all.test("a1") + " " + all.test("12") + " " + some.negate().test("ab"));
          }
      }
