      public class Traces {
          public static void main(String[] args) {
              Exception top = new Exception("top");
              Exception middle = new IllegalStateException("middle", new Error("root"));
              top.addSuppressed(middle);
              middle.addSuppressed(new RuntimeException("deep"));
              top.printStackTrace();
              Throwable loop = new Exception("loop");
              RuntimeException back = new RuntimeException("back", loop);
              loop.initCause(back);
              back.printStackTrace();
              System.out.println("printed");
          }
      }
