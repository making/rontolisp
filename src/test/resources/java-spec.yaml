      interface EnumLabeled { String label(); }

      enum EnumOp implements EnumLabeled {
          ADD("+") { int apply(int a, int b) { return a + b; } },
          MUL("*") { int apply(int a, int b) { return a * b; } },
          NEG("-") {
              int apply(int a, int b) { return -a; }
              boolean unary() { return true; }
          };

          private final String symbol;
          private static int uses;

          EnumOp(String symbol) { this.symbol = symbol; }

          abstract int apply(int a, int b);

          boolean unary() { return false; }

          public String label() { uses++; return symbol; }

          static int uses() { return uses; }
      }

      enum EnumPlanet {
          MERCURY(3.303e+23, 2.4397e6), EARTH(5.976e+24, 6.37814e6);

          private final double mass, radius;
          static final EnumPlanet HOME = EARTH;
          static final EnumPlanet[] ALL = values();

          EnumPlanet(double mass, double radius) { this.mass = mass; this.radius = radius; }

          EnumPlanet(double mass) { this(mass, 1); }

          double surfaceGravity() { return 6.67300E-11 * mass / (radius * radius); }

          public String toString() { return name().charAt(0) + name().substring(1).toLowerCase(); }
      }

      enum EnumLevel { LOW, MID, HIGH }

      class Enums {
          static EnumLevel next(EnumLevel level) {
              return switch (level) {
                  case LOW -> EnumLevel.MID;
                  case MID, HIGH -> EnumLevel.HIGH;
              };
          }

          public static void main(String[] args) {
              for (EnumOp op : EnumOp.values()) System.out.print(op + op.label() + op.apply(6, 7) + op.unary() + op.ordinal() + " ");
              System.out.println(EnumOp.uses() + " " + EnumOp.valueOf("MUL").apply(2, 3) + " " + EnumOp.ADD.name() + " " + EnumOp.ADD.compareTo(EnumOp.NEG));
              System.out.println(EnumPlanet.EARTH.surfaceGravity() + " " + EnumPlanet.valueOf("MERCURY") + " " + EnumPlanet.HOME + " " + EnumPlanet.ALL.length + " " + EnumPlanet.MERCURY.name());
              try { EnumOp.valueOf("DIV"); } catch (IllegalArgumentException e) { System.out.println(e.getMessage()); }
              EnumLevel level = EnumLevel.LOW;
              EnumLabeled labeled = EnumOp.MUL;
              Object any = EnumLevel.HIGH;
              System.out.println(next(level) + " " + next(next(level)) + " " + (level == EnumLevel.LOW) + " " + (next(level) != EnumLevel.LOW) + " " + level.equals(EnumLevel.LOW) + " " + labeled.label() + " " + any + " " + (any instanceof EnumLevel) + " " + EnumLevel.values()[1] + " " + EnumOp.NEG.getClass().getName() + " " + level.getClass().getName());
              EnumLevel[] copy = EnumLevel.values();
              copy[0] = null;
              System.out.println(EnumLevel.values()[0] + " " + copy.length + " " + EnumLevel.valueOf("HIGH").ordinal());
          }
      }
