    main: GenericPatterns
    source: |
      class GenericPatterns {
          sealed interface Expr<T> permits Const, Add, Neg {
          }

          record Const<T>(T value) implements Expr<T> {
          }

          record Add<T>(Expr<T> left, Expr<T> right) implements Expr<T> {
          }

          record Neg<T>(Expr<T> inner) implements Expr<T> {
          }

          sealed interface Option<T> {
              record Some<T>(T value) implements Option<T> {
              }

              record None<T>() implements Option<T> {
              }

              default <R> Option<R> map(Function<? super T, ? extends R> f) {
                  return switch (this) {
                      case Some<T> s -> new Some<>(f.apply(s.value()));
                      case None<T> n -> new None<>();
                  };
              }

              default T orElse(T other) {
                  return this instanceof Some<T> s ? s.value() : other;
              }

              static <T> Option<T> of(T value) {
                  return value == null ? new None<>() : new Some<>(value);
              }
          }

          static int eval(Expr<Integer> e) {
              return switch (e) {
                  case Const<Integer> c -> c.value();
                  case Add<Integer>(var l, var r) -> eval(l) + eval(r);
                  case Neg<Integer>(Expr<Integer> inner) -> -eval(inner);
              };
          }

          static <T> String show(Expr<T> e) {
              if (e instanceof Const<T>(T v)) {
                  return "" + v;
              }
              if (e instanceof Add<T> a) {
                  return "(" + show(a.left()) + " + " + show(a.right()) + ")";
              }
              if (e instanceof Neg<T> n) {
                  return "-" + show(n.inner());
              }
              return "?";
          }

          static String unwrap(Object o) {
              return switch (o) {
                  case Const<?>(String s) -> "text " + s.length();
                  case Const<?>(Integer i) -> "number " + (i + 1);
                  case Const<?> c -> "const " + c.value();
                  case List<?> xs -> "list of " + xs.size();
                  default -> "other";
              };
          }

          public static void main(String[] args) {
              Expr<Integer> e = new Add<>(new Const<>(3), new Neg<>(new Const<>(1)));
              System.out.println(eval(e) + " " + show(e) + " " + show(new Const<>("s")));
              Option<String> some = Option.of("text");
              Option<String> none = Option.of(null);
              System.out.println(some.map(String::length).orElse(-1) + " " + none.map(String::length).orElse(-1) + " " + some + " " + none + " " + some.map(s -> s + "!").orElse("?"));
              System.out.println(unwrap(new Const<>("abc")) + ", " + unwrap(new Const<>(41)) + ", " + unwrap(new Const<>(1.5)) + ", " + unwrap(new ArrayList<String>()) + ", " + unwrap(e));
          }
      }
