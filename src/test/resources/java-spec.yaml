  - name: a-box-is-its-value-but-a-long-s-and-none-is-null
    main: Boxes
    source: |
      class Boxes {
          static Integer twice(Integer x) {
              return x * 2;
          }

          static int unboxed(Integer x) {
              return x;
          }

          static String show(Object o) {
              return "<" + o + ">";
          }

          public static void main(String[] args) {
              Integer i = 5, none = null;
              int j = i + 1;
              Long big = 1L << 40;
              Double half = 0.5;
              Boolean yes = true, no = false, unknown = null;
              Character letter = 'q';
              char plain = letter;
              i++;
              i += 10;
              System.out.println(i + " " + j + " " + twice(i) + " " + unboxed(i) + " " + twice(21) + " " + (big + 1) + " " + (half * 4) + " " + (i > 3) + " " + (i == 16) + " " + (none == null) + " " + (i != null));
              System.out.println(yes + " " + no + " " + unknown + " " + (no == null) + " " + (unknown == null) + " " + (yes && !no) + " " + (no ? 1 : 2) + " " + letter + " " + plain + " " + (letter + 1) + " " + (char) (letter + 1) + " " + (letter == 'q'));
              System.out.println(show(1) + show(2L) + show(1.5) + show(true) + show(false) + show('c') + show("s") + show(null) + show(i) + show(no) + show(letter));
              Object o = 42;
              Integer back = Integer.valueOf(7);
              int value = back.intValue();
              double widened = back;
              long sum = i + big;
              Integer chosen = i > 0 ? i : null;
              int picked = no ? 1 : i;
              System.out.println(o + " " + value + " " + widened + " " + sum + " " + chosen + " " + picked + " " + i.equals(16) + " " + i.equals(17) + " " + i.hashCode() + " " + yes.equals(true) + " " + no.equals(true) + " " + letter.equals('q') + " " + letter.hashCode() + " " + i.toString() + no.toString() + letter.toString());
              BoxKinds.main(args);
          }
      }

      class BoxKinds {
          static String kind(Object o) {
              return switch (o) {
                  case null -> "null";
                  case Integer i when i > 100 -> "big int " + i;
                  case Integer i -> "int " + i;
                  case Long l -> "long " + l;
                  case Double d -> "double " + d;
                  case Character c -> "char " + c;
                  case Boolean b -> "boolean " + b;
                  case String s -> "string " + s;
                  default -> "other";
              };
          }

          static <T> String generic(T value) {
              Object o = value;
              return kind(o);
          }

          static long widen(Long boxed) {
              return boxed + 1;
          }

          static int over(int x) {
              return 1;
          }

          static int over(long x) {
              return 2;
          }

          static int over(Integer x) {
              return 3;
          }

          static int over(Object x) {
              return 4;
          }

          static int over(int... xs) {
              return 5;
          }

          static int rest(String s, Object... rest) {
              return rest.length;
          }

          public static void main(String[] args) {
              Integer i = 5;
              Long l = 5L;
              Object oi = i, ol = l;
              System.out.println(kind(1) + ", " + kind(1L) + ", " + kind(2.5) + ", " + kind('c') + ", " + kind(true) + ", " + kind("s") + ", " + kind(null) + ", " + kind(1000) + ", " + generic(7L) + ", " + generic(7));
              System.out.println(oi.equals(ol) + " " + ol.equals(5L) + " " + oi.equals(5) + " " + l.equals(5L) + " " + i.equals(5) + " " + (oi instanceof Long) + " " + (ol instanceof Long) + " " + (ol instanceof Integer));
              System.out.println(oi.hashCode() + " " + ol.hashCode() + " " + ((Object) (-1L)).hashCode() + " " + ((Object) 4294967296L).hashCode() + " " + oi.getClass().getName() + " " + ol.getClass().getSimpleName() + " " + ol + " " + l.toString());
              Integer a = 100, b = 100;
              Long x = 7L, y = 7L;
              Double d1 = 1.5, d2 = 1.5;
              Character c1 = 'q', c2 = 'q';
              Boolean t1 = true, t2 = true;
              Integer nothing = null;
              System.out.println((a == b) + " " + (x == y) + " " + (a != b) + " " + (c1 == c2) + " " + (t1 == t2) + " " + (nothing == null) + " " + (a == 100) + " " + (x == 7) + " " + (d1.equals(d2)));
              System.out.println(widen(l) + " " + (l + i) + " " + (i + 1L) + " " + (l * 2) + " " + over(1) + over(1L) + over(i) + over(l) + over("s") + over() + over(1, 2) + " " + rest("a") + rest("a", 1, 2L, "x"));
              List<Long> longs = new ArrayList<>();
              longs.add(1L);
              longs.add(Long.MAX_VALUE);
              long total = 0;
              for (long each : longs) {
                  total += each;
              }
              Map<Long, String> byLong = new HashMap<>();
              byLong.put(1L, "one");
              Map<String, Long> counts = new HashMap<>();
              counts.put("k", 1L);
              counts.put("k", counts.get("k") + 1);
              System.out.println(longs + " " + total + " " + byLong.get(1L) + " " + byLong.get(1) + " " + byLong.containsKey(1L) + " " + counts.get("k") + " " + longs.get(0).compareTo(longs.get(1)) + " " + Long.valueOf(3).longValue());
              try {
                  int unboxed = nothing;
                  System.out.println("not reached " + unboxed);
              }
              catch (RuntimeException e) {
                  System.out.println("null unboxed");
              }
              Map<String, Integer> ages = new HashMap<>();
              try {
                  int age = ages.get("nobody");
                  System.out.println("not reached " + age);
              }
              catch (RuntimeException e) {
                  System.out.println("missing unboxed");
              }
              Object o = 42;
              int n = (int) o;
              long widened = (Integer) o;
              Object ch = 'x';
              char c = (char) ch;
              System.out.println(n + " " + widened + " " + c + " " + (Integer) o + " " + (o instanceof Integer k ? k + 1 : -1));
              try {
                  long bad = (long) o;
                  System.out.println("not reached " + bad);
              }
              catch (ClassCastException e) {
                  System.out.println("an Integer is no Long");
              }
          }
      }
