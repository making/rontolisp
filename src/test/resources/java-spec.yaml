# The corpus of the EXPERIMENTAL front end for a subset of the Java language
# (JavaSpecE2eTest): one case per decision of the lowering in .kb/java-frontend.md.
# Written here; nothing is copied or translated from a JDK or its tests
# (.kb/java-frontend-provenance.md).
#
# The cases are concatenated into ONE program per backend, behind `imports` and a class
# whose main calls each case's `main` class in order, and the output is sliced back per
# case -- the ci-spec.yaml idea. So every class of a case carries the case's name. A
# `standalone` case is a file of its own, named `file`: one that starts another way, or
# one that ENDS with an uncaught exception -- it prints `stdout`, then reports `error`.
#
# Every expectation is what a JDK 25 prints, and the test runs the corpus under the JDK
# running it as its first leg: an expectation that is not the JDK's fails there. Every
# case must print the same on the interpreter, the JVM, wasm and the component.
imports: |
  import java.util.ArrayList;
  import java.util.HashMap;
  import java.util.List;
  import java.util.Map;
cases:
  # An int is an integer kept in range by an unconditional mask; a constant expression
  # is folded as the language computes it.
  - name: an-int-wraps-as-two-s-complement
    main: IntWraps
    source: |
      class IntWraps {
          static int hash(String s) {
              int h = 0;
              for (int i = 0; i < s.length(); i++) {
                  h = 31 * h + s.charAt(i);
              }
              return h;
          }

          public static void main(String[] args) {
              int max = Integer.MAX_VALUE, min = Integer.MIN_VALUE, a = 7, b = -3;
              System.out.println((max + 1) + " " + (min - 1) + " " + (max * 2) + " " + (min / -1) + " " + -min + " " + Math.abs(min));
              System.out.println(a / b + " " + a % b + " " + -a / 2 + " " + -a % 2 + " " + hash("The quick brown fox jumps over the lazy dog"));
              System.out.println((a << 30) + " " + (1 << 31) + " " + (1 << 32) + " " + (b >> 1) + " " + (b >>> 28) + " " + (b >>> 32) + " " + (a << b));
              System.out.println((a & b) + " " + (a | b) + " " + (a ^ b) + " " + ~a + " " + ~b + " " + +a + " " + -(-a));
              System.out.println(0x7fffffff + " " + 0xffffffff + " " + 0x80000000 + " " + 0b1010 + " " + 017 + " " + 1_000_000 + " " + -2147483648 + " " + (2147483647 + 1));
              int i = 5;
              i += 3.7;
              i -= 1;
              i *= 2;
              i /= 3;
              i %= 4;
              i <<= 3;
              i >>= 1;
              i >>>= 1;
              i ^= 5;
              i |= 16;
              i &= 0x1F;
              System.out.println(i + " " + (i++ + ++i) + " " + i-- + " " + --i + " " + i);
          }
      }
    expected: |
      -2147483648 2147483647 -2 -2147483648 -2147483648 -2147483648
      -2 1 -3 -1 -609428141
      -1073741824 -2147483648 1 -2 15 -3 -536870912
      5 -1 -6 -8 2 7 7
      2147483647 -1 -2147483648 10 15 1000000 -2147483648 -2147483648
      21 44 23 21 21
  # The same mask at 64 bits; an int operand is widened, never the result narrowed.
  - name: a-long-wraps-at-64-bits
    main: LongWraps
    source: |
      class LongWraps {
          static long fact(int n) {
              return n <= 1 ? 1 : n * fact(n - 1);
          }

          public static void main(String[] args) {
              long big = 1L << 62, seed = 42;
              int i = 3;
              System.out.println(big * 4 + " " + (big + big) + " " + Long.MAX_VALUE + " " + (Long.MIN_VALUE - 1) + " " + (Long.MAX_VALUE + i));
              System.out.println(fact(20) + " " + fact(21) + " " + (1L << 40) * 3 + " " + (int) (1L << 40) + " " + (int) 0x1FFFFFFFFL + " " + 0xFFFFFFFFFFL);
              seed = seed * 6364136223846793005L + 1442695040888963407L;
              System.out.println(seed + " " + (seed >> 60) + " " + (seed >>> 60) + " " + (seed << 4) + " " + (i << 33) + " " + (1L << 33) + " " + ~seed);
              System.out.println(seed / 7 + " " + seed % 7 + " " + (seed & 0xFF) + " " + (seed ^ -1L) + " " + Math.abs(-9L) + " " + Math.max(3, 7L) + " " + Math.min(i, -7L));
          }
      }
