      import java.time.Duration;
      import java.util.ArrayDeque;

      public class Waits {
          static final ArrayDeque<Integer> queue = new ArrayDeque<>();
          static final Object gate = new Object();
          static boolean open;
          static Integer handed;

          static int take() throws InterruptedException {
              synchronized (queue) {
                  while (queue.isEmpty()) {
                      queue.wait();
                  }
                  return queue.removeFirst();
              }
          }

          static void put(int item) {
              synchronized (queue) {
                  queue.addLast(item);
                  queue.notify();
              }
          }

          public static void main(String[] args) throws InterruptedException {
              // a consumer waits for what a producer puts
              long[] consumed = new long[1];
              Thread consumer = new Thread(() -> {
                  try {
                      for (int item = take(); item >= 0; item = take()) {
                          consumed[0] += item;
                      }
                  }
                  catch (InterruptedException e) {
                      consumed[0] = -1;
                  }
              });
              Thread producer = new Thread(() -> {
                  for (int i = 1; i <= 100; i++) {
                      put(i);
                  }
                  put(-1);
              });
              consumer.start();
              producer.start();
              producer.join();
              consumer.join();
              System.out.println("consumed " + consumed[0]);
              // every thread waiting at a gate goes on when it is opened
              int[] passed = new int[3];
              Thread[] waiting = new Thread[3];
              for (int i = 0; i < waiting.length; i++) {
                  int id = i;
                  waiting[i] = new Thread(() -> {
                      synchronized (gate) {
                          while (!open) {
                              try {
                                  gate.wait();
                              }
                              catch (InterruptedException e) {
                                  return;
                              }
                          }
                      }
                      passed[id] = id + 1;
                  });
                  waiting[i].start();
              }
              synchronized (gate) {
                  open = true;
                  gate.notifyAll();
              }
              for (Thread thread : waiting) {
                  thread.join();
              }
              System.out.println("passed " + (passed[0] + passed[1] + passed[2]));
              // the thread the program started on waits for a value another hands it
              new Thread(() -> {
                  synchronized (gate) {
                      handed = 7;
                      gate.notifyAll();
                  }
              }).start();
              synchronized (gate) {
                  while (handed == null) {
                      gate.wait();
                  }
              }
              System.out.println("handed " + handed);
              // a wait gives up every hold of the monitor and takes them again
              Thread opener = new Thread(() -> {
                  synchronized (gate) {
                      open = false;
                      gate.notify();
                  }
              });
              synchronized (gate) {
                  synchronized (gate) {
                      opener.start();
                      while (open) {
                          gate.wait();
                      }
                      System.out.println("held again " + Thread.holdsLock(gate));
                  }
              }
              opener.join();
              // a wait with a limit ends when nothing notifies it
              synchronized (gate) {
                  gate.wait(1);
              }
              System.out.println("timed out");
              Thread finished = new Thread(() -> { });
              finished.start();
              finished.join(1000);
              System.out.println("joined " + finished.isAlive());
              // the monitor members are refused to a thread that does not hold the monitor
              try {
                  gate.wait();
              }
              catch (IllegalMonitorStateException e) {
                  System.out.println(e);
              }
              try {
                  gate.notify();
              }
              catch (IllegalMonitorStateException e) {
                  System.out.println(e);
              }
              try {
                  gate.notifyAll();
              }
              catch (IllegalMonitorStateException e) {
                  System.out.println(e);
              }
              try {
                  synchronized (gate) {
                      gate.wait(-1);
                  }
              }
              catch (IllegalArgumentException e) {
                  System.out.println(e);
              }
              // a thread interrupted before it starts finds it out where it first sleeps
              Thread sleeper = new Thread(() -> {
                  System.out.println("starts interrupted " + Thread.currentThread().isInterrupted());
                  try {
                      Thread.sleep(10000);
                      System.out.println("slept");
                  }
                  catch (InterruptedException e) {
                      System.out.println(e + " " + Thread.currentThread().isInterrupted());
                  }
              });
              sleeper.interrupt();
              System.out.println(sleeper.isInterrupted());
              sleeper.start();
              sleeper.join();
              // a thread waiting is interrupted by another
              Thread waiter = new Thread(() -> {
                  Thread self = Thread.currentThread();
                  synchronized (gate) {
                      new Thread(self::interrupt).start();
                      try {
                          while (true) {
                              gate.wait();
                          }
                      }
                      catch (InterruptedException e) {
                          System.out.println(e + " " + self.isInterrupted() + " " + Thread.holdsLock(gate));
                      }
                  }
              });
              waiter.start();
              waiter.join();
              // the thread the program started on interrupts itself
              Thread.currentThread().interrupt();
              try {
                  synchronized (gate) {
                      gate.wait();
                  }
              }
              catch (InterruptedException e) {
                  System.out.println("wait " + e.getMessage());
              }
              Thread.currentThread().interrupt();
              try {
                  sleeper.join();
              }
              catch (InterruptedException e) {
                  System.out.println("join " + e.getMessage());
              }
              Thread.currentThread().interrupt();
              System.out.println(Thread.interrupted() + " " + Thread.interrupted());
              Thread.sleep(0);
              try {
                  Thread.sleep(-1);
              }
              catch (IllegalArgumentException e) {
                  System.out.println(e);
              }
              // a duration below zero is no sleep at all, zero is one that can be interrupted
              Thread.sleep(Duration.ofNanos(1));
              Thread.currentThread().interrupt();
              Thread.sleep(Duration.ofMillis(-1));
              try {
                  Thread.sleep(Duration.ZERO);
              }
              catch (InterruptedException e) {
                  System.out.println("a duration: " + e.getMessage() + " " + Thread.currentThread().isInterrupted());
              }
              try {
                  sleeper.join(-1);
              }
              catch (IllegalArgumentException e) {
                  System.out.println(e);
              }
              Thread.yield();
              System.out.println("done");
          }
      }
