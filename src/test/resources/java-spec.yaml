      class GenericCasts {
          interface Shape {
          }

          record Dot(int x) implements Shape {
          }

          static class Crate<T> {
              T held;
          }

          @SuppressWarnings("unchecked")
          static <T> T as(Object o) {
              return (T) o;
          }

          @SuppressWarnings("unchecked")
          static <T extends Shape> T shape(Object o) {
              return (T) o;
          }

          static String tryCast(Supplier<Object> cast) {
              try {
                  return "ok " + cast.get();
              }
              catch (ClassCastException e) {
                  return "refused";
              }
          }

          @SuppressWarnings("unchecked")
          public static void main(String[] args) {
              Object list = new ArrayList<String>();
              Object map = new HashMap<String, Integer>();
              Object text = new StringBuilder("sb");
              Object crate = new Crate<String>();
              Object dot = new Dot(1);
              List<String> strings = (List<String>) list;
              strings.add("s");
              Map<String, Integer> counts = (Map<String, Integer>) map;
              counts.put("k", 1);
              Crate<String> typed = (Crate<String>) crate;
              typed.held = "held";
              Crate<Integer> lying = (Crate<Integer>) crate;
              Object untouched = lying.held;
              System.out.println(strings + " " + counts.get("k") + " " + ((StringBuilder) text).length() + " " + untouched + " " + (list instanceof List<?>) + " " + (list instanceof ArrayList<?> a ? a.size() : -1) + " " + (map instanceof Map) + " " + (map instanceof List) + " " + (text instanceof StringBuilder) + " " + (text instanceof String) + " " + (crate instanceof Crate<?> c ? c.held : null));
              String s = as("text");
              Dot d = shape(dot);
              System.out.println(s + " " + d + " " + tryCast(() -> (List<String>) map) + " " + tryCast(() -> (Map<String, String>) list) + " " + tryCast(() -> (StringBuilder) list) + " " + tryCast(() -> (Shape) list) + " " + tryCast(() -> GenericCasts.<Shape>shape("no shape")) + " " + tryCast(() -> GenericCasts.<Integer>as("unchecked")) + " " + tryCast(() -> (Object) list) + " " + tryCast(() -> (int) dot) + " " + tryCast(() -> (int) (Object) 41 + 1));
          }
      }
