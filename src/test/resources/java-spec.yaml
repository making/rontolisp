  # String.format, formatted and printf: %d %s %f %e %x %o %c %b %n %% with flags, width,
  # precision and an argument index; %f rounds the shortest digits half up. A Locale --
  # the root and the English ones are all there are -- changes nothing.
  - name: format-renders-the-conversions-programs-write
    main: Formats
    source: |
      class Formats {
          public static void main(String[] args) {
              System.out.printf("%s has %d items, %.1f%%%n", "bag", 3, 99.5);
              System.out.println(String.format("|%10.3f|%-8s|%08d|%+d|%x|%X|%o|%c|%b|%5s|%.3s|%e|%,.2f|%(d|%s|%S|", Math.PI, "left", 42, 7, 255, 255, 8, 65, null, true, "abcdef", 123456.789, 1234567.891, -5, List.of(1, 2), "up"));
              System.out.println(String.format("%.1f %.2f %.0f %.3f %.2f %10.4f|%-10.1f|%f", 0.15, 1.005, 2.5, 1e-5, -0.001, 1e10, 1.25, 1.0 / 3) + "|" + "%d items".formatted(3) + "|" + String.format("%5d|%-5d|%05d|%,d|% d|%x|%d", -42, 42, -42, -1234567, 42, -1, 123456789012L));
              System.out.println(String.format("%2$s %1$s %1$s|", "a", "b") + String.format("%c%c|%b %b|%10s|%-10s|%s %s %s|%.3e|%E|%08.2f|%+.1f|%x", 'x', (char) 121, null, "s", "right", "left", 1.5, 'c', 10L, 0.000123456, 1e100, -3.14159, 2.0, 255L));
              try {
                  String.format("%d", "text");
              } catch (RuntimeException e) {
                  System.out.println("refused");
              }
              System.out.println(String.format(Locale.US, "%,d %.2f %s", 1234567, 3.14159, "x") + String.format(Locale.ROOT, "|%5d|", 42) + String.format((Locale) null, "%x", 255));
              System.out.printf(Locale.ENGLISH, "%d items%n", 3);
              System.out.format(Locale.UK, "%s%n", "formatted");
              PrintStream out = System.out;
              out.printf(Locale.CANADA, "%05.1f%n", 2.25).format(Locale.US, "%S%n", "chained");
              StringWriter text = new StringWriter();
              PrintWriter writer = new PrintWriter(text);
              writer.printf(Locale.ROOT, "%d-", 1).format(Locale.ROOT, "%d", 2);
              writer.flush();
              System.out.println(text + " " + "Title".toUpperCase(Locale.ROOT) + "Title".toLowerCase(Locale.ENGLISH));
              for (Locale each : new Locale[] {Locale.ROOT, Locale.ENGLISH, Locale.US, Locale.UK, Locale.CANADA}) {
                  System.out.println("[" + each + "] " + each.getLanguage() + " " + each.getCountry() + " " + each.toLanguageTag() + " " + (each == Locale.US) + " " + each.equals(Locale.UK));
              }
              hashes();
          }

          // %h is the hash code's hexadecimal digits: of a class of the program its own
          record Keyed(int key) {
              public int hashCode() {
                  return key * 16 + 1;
              }
          }

          static void hashes() {
              System.out.println(String.format("%h %h %h %H %h %h %10h|%-10h|%h %h %.2h", "hello", 255, null, "hello", 3.5, 'c', "x", "y", true, 100000L, 123456789) + " " + "%h".formatted(new Keyed(10)) + " " + String.format("%s %h", List.of(1), List.of(1)));
          }
      }
