  # A lambda is a lambda capturing its variables; an interface no class implements is
  # called with funcall, one a class implements too by a function testing for a function
  # first.
  - name: a-lambda-is-a-function-called-through-its-interface
    main: Lambdas
    source: |
      interface LambdasScorer {
          int score(String word, int base);
      }

      interface LambdasCounter {
          int next();
      }

      interface LambdasVisitor {
          void visit(int x);
      }

      interface LambdasMaker {
          LambdasCounter from(int start);
      }

      class LambdasLength implements LambdasScorer {
          public int score(String word, int base) {
              return word.length() + base;
          }
      }

      class Lambdas {
          int factor = 3;

          static int apply(LambdasScorer s, String w) {
              return s.score(w, 10);
          }

          static void each(int[] xs, LambdasVisitor v) {
              for (int x : xs) v.visit(x);
          }

          LambdasCounter times(int n) {
              return () -> n * factor;
          }

          static LambdasCounter counter(int start) {
              int[] state = {start};
              return () -> state[0]++;
          }

          public static void main(String[] args) {
              int bonus = 5;
              LambdasScorer byLength = (w, base) -> w.length() * base + bonus;
              LambdasScorer block = (String w, int base) -> {
                  if (w.isEmpty()) return 0;
                  return base + w.charAt(0);
              };
              System.out.println(apply(byLength, "hello") + " " + apply(block, "A") + " " + apply(block, "") + " " + apply(new LambdasLength(), "abc") + " " + apply((w, b) -> b, "x"));
              int[] acc = new int[1];
              each(new int[] {1, 2, 3}, x -> acc[0] += x * x);
              LambdasCounter c = counter(7), d = counter(100);
              LambdasMaker maker = start -> counter(start * 2);
              LambdasCounter made = maker.from(4);
              Lambdas self = new Lambdas();
              LambdasCounter tripled = self.times(4);
              self.factor = 5;
              System.out.println(acc[0] + " " + c.next() + c.next() + " " + d.next() + " " + c.next() + " " + made.next() + " " + tripled.next());
              Runnable r = () -> System.out.println("ran " + acc[0]);
              r.run();
              Runnable twice = () -> {
                  r.run();
                  r.run();
              };
              twice.run();
          }
      }
