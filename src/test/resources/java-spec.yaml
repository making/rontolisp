    main: Dispatch
    source: |
      interface DispatchShape {
          double area();

          String name();
      }

      interface DispatchScaled extends DispatchShape {
          DispatchShape scaled(double factor);
      }

      abstract class DispatchBase implements DispatchShape {
          static int count = 0;
          protected final String label;

          DispatchBase(String label) {
              this.label = label;
              count++;
          }

          public String name() {
              return label;
          }

          abstract int corners();

          String describe() {
              return name() + "[" + area() + "]/" + corners() + secret();
          }

          private String secret() {
              return "~";
          }
      }

      class DispatchCircle extends DispatchBase {
          private final double r;

          DispatchCircle(double r) {
              super("circle");
              this.r = r;
          }

          public double area() {
              return 3 * r * r;
          }

          int corners() {
              return 0;
          }
      }

      class DispatchRect extends DispatchBase implements DispatchScaled {
          final double w, h;

          DispatchRect(double w, double h) {
              this("rect", w, h);
          }

          DispatchRect(String label, double w, double h) {
              super(label);
              this.w = w;
              this.h = h;
          }

          public double area() {
              return w * h;
          }

          int corners() {
              return 4;
          }

          public DispatchShape scaled(double factor) {
              return new DispatchRect(w * factor, h * factor);
          }
      }

      class DispatchSquare extends DispatchRect {
          DispatchSquare(double s) {
              super("square", s, s);
          }

          @Override
          public String name() {
              return "SQUARE/" + super.name();
          }

          public DispatchShape scaled(double factor) {
              return new DispatchSquare(w * factor);
          }
      }

      class DispatchNode {
          DispatchNode next;
          int value;

          DispatchNode(int value, DispatchNode next) {
              this.value = value;
              this.next = next;
          }

          int sum() {
              return next == null ? value : value + next.sum();
          }
      }

      class Dispatch {
          public static void main(String[] args) {
              DispatchShape[] shapes = {new DispatchCircle(1.5), new DispatchRect(2, 3), new DispatchSquare(4)};
              double total = 0;
              for (DispatchShape s : shapes) {
                  System.out.println(s.name() + " " + s.area() + " " + (s instanceof DispatchRect) + " " + (s instanceof DispatchScaled));
                  total += s.area();
              }
              DispatchBase base = new DispatchSquare(2);
              DispatchScaled scaled = new DispatchSquare(3);
              DispatchRect rect = new DispatchSquare(1);
              System.out.println(total + " " + DispatchBase.count + " " + base.describe() + " " + scaled.scaled(2).area() + " " + scaled.scaled(2).name() + " " + rect.scaled(3).area() + " " + rect.name());
              System.out.println(new DispatchNode(1, new DispatchNode(2, new DispatchNode(3, null))).sum());
          }
      }
