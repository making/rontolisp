  # The instance initializers and the initializer blocks run in the order written, after
  # the superclass's constructor; statements may stand ahead of this(..) and super(..),
  # where a field may be given its value.
  - name: initializer-blocks-and-statements-ahead-of-super
    main: Blocks
    source: |
      class BlockBase {
          final String id;
          static int made;

          BlockBase(String id) {
              this.id = id;
              made++;
              System.out.print("base(" + id + ") ");
          }
      }

      class BlockOrder extends BlockBase {
          int first = note("field first");
          { note("block one"); }
          final int doubled;
          int last = note("field last");
          { note("block two"); }

          BlockOrder(int v) {
              int twice = v * 2;
              if (twice < 0) throw new IllegalArgumentException("negative " + v);
              this.doubled = twice;
              super("order" + twice);
              note("body " + doubled);
          }

          BlockOrder() {
              String chosen = made > 0 ? "again" : "once";
              this(made + 10);
              note(chosen);
          }

          int note(String what) {
              System.out.print(what + " ");
              return 1;
          }
      }

      class Blocks {
          public static void main(String[] args) {
              BlockOrder a = new BlockOrder(4);
              System.out.println("-> " + a.id + " " + a.doubled + " " + a.first + a.last);
              BlockOrder b = new BlockOrder();
              System.out.println("-> " + b.id + " " + b.doubled + " " + BlockBase.made);
              try { new BlockOrder(-1); } catch (IllegalArgumentException e) { System.out.println(e.getMessage() + " " + BlockBase.made); }
          }
      }
