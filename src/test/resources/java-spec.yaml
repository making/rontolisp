    main: Loops
    source: |
      class Loops {
          static String grade(int score) {
              String grade;
              if (score >= 90) {
                  grade = "A";
              } else if (score >= 80) {
                  grade = "B";
              } else {
                  grade = "C";
              }
              return grade;
          }

          static int firstNegative(int[] xs) {
              for (int i = 0; i < xs.length; i++) {
                  if (xs[i] < 0) return i;
              }
              return -1;
          }

          static final boolean ALWAYS = true;

          // A variable is assigned where every path to it assigns it, as the language
          // follows them: a loop whose condition is a constant, a switch with a default,
          // a try, && and ?:, a labeled block; a blank final assigned once is captured.
          static String assigned(int k, boolean b) {
              int looped;
              while (ALWAYS) { looped = k; break; }
              final boolean stop = true;
              int counted;
              do { counted = k + 1; } while (!stop);
              int picked;
              switch (k) { case 1: picked = 10; break; default: picked = 20; }
              int tried;
              try { tried = k * 2; } finally { k++; }
              int both;
              String shown = b && (both = 5) > 0 ? "both" + both : "none";
              int chosen;
              int either = b ? (chosen = 1) : (chosen = 2);
              int labeled;
              block: { if (b) { labeled = 1; break block; } labeled = 2; }
              final int captured;
              if (b) captured = 1; else captured = 2;
              Supplier<Integer> read = () -> captured * 100;
              return looped + " " + counted + " " + picked + " " + tried + " " + shown + " " + chosen + either + " " + labeled + " " + read.get();
          }

          static int spin(int n) {
              do {
                  if (n-- < 0) return n;
              } while (true);
          }

          public static void main(String[] args) {
              int n = 0, i = 0;
              while (true) {
                  i++;
                  if (i % 2 == 0) continue;
                  if (i > 10) break;
                  n += i;
              }
              int w = 0;
              do {
                  w += 3;
                  if (w == 6) continue;
                  w++;
              } while (w < 20);
              int once = 0;
              do once++; while (once < 0);
              System.out.println(n + " " + i + " " + w + " " + once);
              int pairs = 0;
              for (int a = 0, b = 10; a < b; a++, b--) {
                  for (int c = 0; c < 3; c++) {
                      if (c == 1) continue;
                      if (a == 3) break;
                      pairs++;
                  }
              }
              int k;
              for (k = 0; k < 100; k += 7) {
              }
              int spins = 0;
              for (;;) {
                  if (++spins == 5) break;
              }
              System.out.println(pairs + " " + k + " " + spins + " " + grade(95) + grade(85) + grade(10) + " " + firstNegative(new int[] {1, -2}) + " " + firstNegative(new int[0]));
              int total = 0;
              {
                  int x = 1;
                  total += x;
              }
              {
                  double x = 2.5;
                  total += x;
              }
              for (int x = 0; x < 3; x++) total += x;
              for (var x : new int[] {10, 20}) {
                  if (x == 10) continue;
                  total += x;
              }
              var text = "t";
              var count = total;
              if (count > 0) ; else count = -1;
              System.out.println(total + " " + text + count);
              System.out.println(assigned(1, true) + " | " + assigned(2, false) + " | " + spin(2));
          }
      }
