  # An int is an integer kept in range by an unconditional mask; a constant expression
  # is folded as the language computes it.
  - name: an-int-wraps-as-two-s-complement
    main: IntWraps
    source: |
      class IntWraps {
          static int hash(String s) {
              int h = 0;
              for (int i = 0; i < s.length(); i++) {
                  h = 31 * h + s.charAt(i);
              }
              return h;
          }

          public static void main(String[] args) {
              int max = Integer.MAX_VALUE, min = Integer.MIN_VALUE, a = 7, b = -3;
              System.out.println((max + 1) + " " + (min - 1) + " " + (max * 2) + " " + (min / -1) + " " + -min + " " + Math.abs(min));
              System.out.println(a / b + " " + a % b + " " + -a / 2 + " " + -a % 2 + " " + hash("The quick brown fox jumps over the lazy dog"));
              System.out.println((a << 30) + " " + (1 << 31) + " " + (1 << 32) + " " + (b >> 1) + " " + (b >>> 28) + " " + (b >>> 32) + " " + (a << b));
              System.out.println((a & b) + " " + (a | b) + " " + (a ^ b) + " " + ~a + " " + ~b + " " + +a + " " + -(-a));
              System.out.println(0x7fffffff + " " + 0xffffffff + " " + 0x80000000 + " " + 0b1010 + " " + 017 + " " + 1_000_000 + " " + -2147483648 + " " + (2147483647 + 1));
              int i = 5;
              i += 3.7;
              i -= 1;
              i *= 2;
              i /= 3;
              i %= 4;
              i <<= 3;
              i >>= 1;
              i >>>= 1;
              i ^= 5;
              i |= 16;
              i &= 0x1F;
              System.out.println(i + " " + (i++ + ++i) + " " + i-- + " " + --i + " " + i);
          }
      }
    expected: |
