  # The host's printer has the JDK's digits and layout; a cast to int goes toward zero
  # and stops at the type's ends; a division by zero is an infinity.
  - name: a-double-prints-as-the-shortest-text-that-reads-back
    main: Doubles
    source: |
      class Doubles {
          static double average(int[] xs) {
              double sum = 0;
              for (int x : xs) sum += x;
              return sum / xs.length;
          }

          public static void main(String[] args) {
              double d = 10 / 4 + 10 / 4.0, zero = 0;
              int n = 7;
              System.out.println(d + " " + 7.0 / 2 + " " + n / 2 + " " + n / 2.0 + " " + (0.1 + 0.2) + " " + 1.0 / 3 + " " + average(new int[] {3, 1, 4, 1}));
              System.out.println(1e10 + " " + 100.0 + " " + 0.001 + " " + 1.0E-5 + " " + 1e7 + " " + 9999999.0 + " " + 123456789.125 + " " + 1e23 + " " + .5 + " " + 5. + " " + 1.5e-7 + " " + -0.0 + " " + 4.9e-324);
              System.out.println((int) 3.99 + " " + (int) -3.99 + " " + (int) 1e20 + " " + (int) -1e20 + " " + (long) 1e30 + " " + (long) -2.5 + " " + (char) 97.9 + " " + (double) n + " " + (double) (1L << 53));
              System.out.println(Math.sqrt(2) + " " + Math.sqrt(-1) + " " + Math.pow(2, 10) + " " + Math.floor(-2.5) + " " + Math.abs(-2.5) + " " + Math.max(1.5, n) + " " + Math.min(1.5, n) + " " + Math.PI);
              System.out.println(1 / zero + " " + -1 / zero + " " + zero / zero + " " + 5.5 % 2 + " " + -5.5 % 2 + " " + (d > n) + " " + (n == 7.0) + " " + (d != d) + " " + 5.0 % zero + " " + -4.0 % 2 + " " + 1.0 % (1 / zero) + " " + (1 / zero) % 2);
              d += 1;
              d *= 2;
              d -= n;
              d /= 4;
              d++;
              System.out.println(d + " " + -d + " " + (d < 0 ? -d : d));
          }
      }
