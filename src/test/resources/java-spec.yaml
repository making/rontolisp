      class ClassesBase {
          static int made;
          protected String label = "unnamed";
          int id;
          double weight;
          boolean heavy;
          ClassesBase other;
          private int serial = 7;

          int serial() {
              return serial;
          }

          ClassesBase() {
              made++;
              id = made;
          }

          ClassesBase(String label) {
              this();
              this.label = label;
          }

          String describe() {
              return label + "#" + id;
          }
      }

      class ClassesChild extends ClassesBase {
          int extra = id * 10;
          final int[] slots = new int[2];

          ClassesChild(String label, int extra) {
              super(label);
              this.extra += extra;
          }

          ClassesChild() {
              this("default", 1);
          }

          int extra() {
              return extra;
          }
      }

      class ClassesHiding extends ClassesChild {
          String label = "hiding";
          long extra = 9L;
          int serial = 1;

          String all() {
              return label + " " + super.label + " " + ((ClassesBase) this).label + " " + extra + " " + super.extra + " " + extra() + " " + serial + " " + serial();
          }
      }

      class ClassesPlain {
          int v;
          String name;
      }

      class Classes {
          int count;

          void add(int count) {
              this.count += count;
              count = 0;
          }

          Classes self() {
              return this;
          }

          public static void main(String[] args) {
              ClassesBase a = new ClassesBase(), b = new ClassesBase("b");
              ClassesChild c = new ClassesChild("c", 5), d = new ClassesChild();
              System.out.println(a.describe() + " " + b.describe() + " " + c.describe() + " " + d.describe() + " " + ClassesBase.made);
              System.out.println(c.extra() + " " + d.extra + " " + c.slots.length + " " + a.weight + " " + a.heavy + " " + a.other + " " + c.label);
              a.other = c;
              a.other.id += 100;
              ClassesPlain p = new ClassesPlain();
              p.v++;
              Classes k = new Classes();
              k.add(2);
              k.self().self().add(3);
              System.out.println(c.id + " " + p.v + " " + p.name + " " + k.count + " " + (a.other == c) + " " + (a.other != d) + " " + (p.name == null));
              ClassesHiding h = new ClassesHiding();
              ClassesBase above = h;
              h.label += "!";
              above.label = "above";
              h.extra++;
              ((ClassesChild) h).extra -= 1;
              System.out.println(h.all() + " | " + h.label + " " + above.label + " " + h.describe() + " " + h.serial + " " + above.serial());
          }
      }
