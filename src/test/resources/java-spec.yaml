  # A char is an integer whose static type prints it; arithmetic promotes it to int, and
  # an int constant that fits is a char.
  - name: a-char-is-a-number-printed-as-a-character
    main: Chars
    source: |
      class Chars {
          static final char FIRST = 'a';
          static final char NEXT = FIRST + 1;

          public static void main(String[] args) {
              char c = 'x', sixtyFive = 65, tab = '\t', quote = '\'', e = 'é';
              c++;
              c += 1;
              System.out.println(c + " " + (c + 1) + " " + (char) (c + 1) + " " + 'a' + 'b' + " " + (char) ('a' + 1) + " " + (int) c + " " + sixtyFive + NEXT);
              System.out.println((c > 'b') + " " + (c == 'z') + " " + (c - 'a') + " " + (char) (c - 25) + " " + (c > 100 ? 'y' : 'n') + " " + (c > 200 ? 1 : 'q') + "|" + tab + "|" + quote + e + '\101' + '\\');
              String word = "Zebra";
              int upper = 0;
              for (int i = 0; i < word.length(); i++) {
                  char at = word.charAt(i);
                  if (at >= 'A' && at <= 'Z') upper++;
              }
              char[] letters = {'o', 'k'};
              letters[0] -= 32;
              System.out.println(upper + " " + letters[0] + letters[1] + " " + letters.length + " " + (letters[0] + letters[1]) + " " + (char) 0x263A + " " + (int) (char) -1 + " " + (int) (char) 65536L);
          }
      }
    expected: |
      z 123 { ab b 122 Ab
      true true 25 a y q|	|'éA\
      1 Ok 2 186 ☺ 65535 0
  # && and || are and/or; & | ^ run both operands.
  - name: a-boolean-operator-short-circuits-or-evaluates-both
    main: Booleans
    source: |
      class Booleans {
          static int calls = 0;

          static boolean yes() {
              calls++;
              return true;
          }

          public static void main(String[] args) {
              boolean t = true, f = false;
              System.out.println((t & f) + " " + (t | f) + " " + (t ^ f) + " " + (t ^ t) + " " + !t + " " + (t == f) + " " + (t != f));
              System.out.println((f || yes()) + " " + (f && yes()) + " " + (f & yes()) + " " + (t | yes()) + " " + (t ^ yes()) + " " + calls);
              boolean b = t;
              b &= f;
              b |= yes();
              b ^= t;
              int n = 5;
              boolean big = n > 3 && !(n < 2) || n == 0;
              System.out.println(b + " " + big + " " + (big ? "yes" : "no") + " " + (n > 3 == big) + " " + calls);
          }
      }
    expected: |
      false true true false false false true
      true false false true false 4
      false true yes true 5
  # Each operand's text is made by its static type; the host's string is immutable and
  # its elements are code points.
  - name: a-string-concatenation-converts-by-static-type
    main: Strings
