      class NestedOuter {
          private int secret = 42;
          private static int made;
          int[] cells = {1, 2};

          NestedOuter() { made++; }

          static class Counter {
              private int v;

              Counter(int v) { this.v = v; }

              int twice() { return v * 2 + made; }
          }

          interface Visitor { int visit(Inner inner); }

          class Inner {
              int bonus = 1;

              int reveal() { return secret + bonus + count(); }

              class Deep {
                  int secret = 7;

                  String all() { return secret + " " + bonus + " " + NestedOuter.this.secret + " " + Inner.this.bonus + " " + count(); }
              }

              int accept(Visitor v) { return v.visit(this); }
          }

          class Wide extends Inner {
              int reveal() { return super.reveal() * 2 + secret; }
          }

          int count() { return cells.length; }

          Inner inner() { return new Inner(); }

          static int peek(NestedOuter o) { return o.secret + new Counter(1).v; }
      }

      class Nested {
          public static void main(String[] args) {
              NestedOuter o = new NestedOuter(), other = new NestedOuter();
              other.cells = new int[5];
              NestedOuter.Counter n = new NestedOuter.Counter(21);
              NestedOuter.Inner in = o.inner();
              NestedOuter.Inner far = other.new Inner();
              NestedOuter.Inner.Deep deep = in.new Deep();
              NestedOuter.Inner wide = o.new Wide();
              far.bonus = 10;
              System.out.println(n.twice() + " " + in.reveal() + " " + far.reveal() + " " + wide.reveal() + " " + deep.all() + " " + NestedOuter.peek(o) + " " + in.accept(inner -> inner.bonus + 100));
              System.out.println(n.getClass().getName() + " " + in.getClass().getName() + " " + deep.getClass().getName() + " " + deep.getClass().getSimpleName() + " " + (wide instanceof NestedOuter.Wide) + " " + (in instanceof NestedOuter.Wide));
          }
      }
