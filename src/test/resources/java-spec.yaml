  - name: the-run-time-raises-the-language-s-exceptions
    main: Raised
    source: |
      class RaisedPoint {
          int x;

          int get() {
              return 7;
          }
      }

      class Raised {
          interface Step {
              void run() throws Exception;
          }

          static void attempt(String what, Step step) {
              try {
                  step.run();
                  System.out.println(what + ": ran");
              } catch (NullPointerException e) {
                  System.out.println(what + ": " + e.getClass().getName() + " " + (e instanceof RuntimeException));
              } catch (ClassCastException e) {
                  System.out.println(what + ": " + e.getMessage().startsWith("class java.lang.String cannot be cast to class java.lang.Integer"));
              } catch (Exception e) {
                  System.out.println(what + ": " + e);
              }
          }

          static RaisedPoint none() {
              return null;
          }

          public static void main(String[] args) {
              RaisedPoint p = none();
              int[] xs = args.length > 5 ? new int[1] : null;
              Integer boxed = args.length > 5 ? 1 : null;
              String s = args.length > 5 ? "s" : null;
              Object o = args.length > 5 ? "o" : null;
              List<String> list = args.length > 5 ? new ArrayList<>() : null;
              Object text = "text";
              StringBuilder b = new StringBuilder("ab");
              attempt("field", () -> System.out.println(p.x));
              attempt("store", () -> p.x = 3);
              attempt("call", () -> System.out.println(p.get()));
              attempt("element", () -> System.out.println(xs[0]));
              attempt("length", () -> System.out.println(xs.length));
              attempt("for", () -> { for (int x : xs) System.out.println(x); });
              attempt("unbox", () -> System.out.println(boxed + 1));
              attempt("string", () -> System.out.println(s.length()));
              attempt("object", () -> System.out.println(o.hashCode()));
              attempt("list", () -> System.out.println(list.size()));
              attempt("throw", () -> { RuntimeException e = null; throw e; });
              attempt("cast", () -> System.out.println((Integer) text));
              attempt("negative", () -> System.out.println(new int[args.length - 2].length));
              attempt("negative rows", () -> System.out.println(new int[2][args.length - 3].length));
              attempt("index", () -> (new int[2][2])[args.length][args.length + 2] = 1);
              attempt("charAt", () -> System.out.println("abc".charAt(args.length + 5)));
              attempt("charAt below", () -> System.out.println("abc".charAt(args.length - 1)));
              attempt("charAt far", () -> System.out.println("abc".charAt(Integer.MAX_VALUE - args.length)));
              attempt("charAt wide", () -> System.out.println((int) "aé日z".charAt(args.length + 2) + " " + "aé日z".charAt(3) + " " + "aé日z".substring(1).charAt(0) + " " + new StringBuilder("xy").toString().charAt(1)));
              attempt("charAt past wide", () -> System.out.println("aé日z".charAt(args.length + 4)));
              attempt("substring", () -> System.out.println("abc".substring(2, args.length + 7)));
              attempt("builder", () -> System.out.println(b.charAt(args.length - 1)));
              attempt("builder range", () -> b.delete(3, 4));
              attempt("set length", () -> b.setLength(args.length - 1));
              attempt("repeat", () -> System.out.println("x".repeat(args.length - 2)));
              attempt("chars", () -> System.out.println(new String(new char[2], 1, 5)));
              attempt("arraycopy", () -> System.arraycopy(new int[3], 1, new int[3], 0, 3));
              attempt("arraycopy to", () -> System.arraycopy(new String[3], 0, new String[2], 0, 3));
              attempt("format", () -> System.out.println(String.format("%d", "x")));
              attempt("format argument", () -> System.out.println(String.format("%s %s", "x")));
              attempt("divide", () -> System.out.println(7 / args.length));
              attempt("parse", () -> System.out.println(Integer.parseInt("7x")));
              try {
                  System.out.println(xs[1]);
              } catch (IllegalStateException | NullPointerException e) {
                  System.out.println("multi-catch " + e.getClass().getSimpleName());
              }
          }
      }
