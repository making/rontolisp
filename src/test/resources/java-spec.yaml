              BufferedOutputStream bos = new BufferedOutputStream(sink, 4);
              bos.write(1);
              bos.write(new byte[] {2, 3}, 0, 2);
              System.out.println(sink.size());
              bos.write(new byte[] {4, 5}, 0, 2);
              System.out.println(sink.size());
              bos.write(new byte[] {6, 7, 8, 9, 10}, 0, 5);
              System.out.println(sink.size());
              bos.close();
              System.out.println(sink.size() + " " + new ByteArrayInputStream(sink.toByteArray()).transferTo(new ByteArrayOutputStream()));
              try {
                  throw new UncheckedIOException("wrapped", new IOException("inner"));
              }
              catch (UncheckedIOException e) {
                  System.out.println(e.getMessage() + " " + e.getCause());
              }
          }
