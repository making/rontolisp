  - name: a-compound-assignment-evaluates-its-place-once
    main: Places
    source: |
      class PlacesBox {
          int v;
          int[] cells = new int[3];
          PlacesBox next;
      }

      class Places {
          static int calls = 0;
          static int total = 0;
          static PlacesBox shared;

          static int index() {
              return calls++;
          }

          static PlacesBox box() {
              calls++;
              return shared;
          }

          public static void main(String[] args) {
              shared = new PlacesBox();
              int[] arr = {10, 20, 30};
              int k = 0;
              arr[k++] += 5;
              arr[index()] *= 2;
              arr[index()]++;
              --arr[index()];
              System.out.println(arr[0] + " " + arr[1] + " " + arr[2] + " " + k + " " + calls);
              box().v += 7;
              box().v++;
              box().cells[index() % 3] -= 4;
              shared.next = new PlacesBox();
              box().next.v = box().v * 2;
              int post = box().next.v++;
              int pre = ++box().next.v;
              System.out.println(shared.v + " " + shared.cells[0] + shared.cells[1] + shared.cells[2] + " " + shared.next.v + " " + post + " " + pre + " " + calls);
              total += index();
              Places.total -= 1;
              String s = "a";
              s += s += "b";
              int x = 3;
              x += x++ * 2;
              int y = (x = 4) + x;
              int z = k = x;
              System.out.println(total + " " + s + " " + x + " " + y + " " + z + k);
          }
      }
