  # scope where the language says: through &&, past a ! and an early exit, after a loop;
  # a record pattern reads the components; a sealed type's cases need no default.
  - name: a-pattern-binds-where-its-test-holds
    main: Patterns
    source: |
      sealed interface PatternShape permits PatternCircle, PatternSquare, PatternGroup { }

      record PatternCircle(double r) implements PatternShape { }

      record PatternSquare(double side) implements PatternShape { }

      record PatternGroup(PatternShape first, PatternShape second) implements PatternShape { }

      record PatternPoint(int x, int y) { }

      abstract sealed class PatternNode permits PatternLeaf, PatternFork { }

      final class PatternLeaf extends PatternNode {
          final int value;

          PatternLeaf(int value) { this.value = value; }
      }

      non-sealed class PatternFork extends PatternNode {
          final PatternNode left, right;

          PatternFork(PatternNode left, PatternNode right) { this.left = left; this.right = right; }
      }

      class Patterns {
          static double area(PatternShape s) {
              return switch (s) {
                  case PatternCircle c -> 3 * c.r() * c.r();
                  case PatternSquare q -> q.side() * q.side();
                  case PatternGroup(PatternCircle a, var b) -> area(a) + area(b) + 1000;
                  case PatternGroup(PatternShape a, PatternShape b) -> area(a) + area(b);
              };
          }

          static int depth(PatternNode n) {
              return switch (n) {
                  case PatternLeaf l -> 1;
                  case PatternFork f -> 1 + Math.max(depth(f.left), depth(f.right));
              };
          }

          static String describe(Object o) {
              if (o instanceof PatternPoint p && p.x() > 0) {
                  return "point " + (p.x() + p.y());
              }
              if (!(o instanceof String s)) {
                  return "other " + o;
              }
              return "string " + s.length();
          }

          static String kind(Object o) {
              return switch (o) {
                  case null -> "null!";
                  case Integer i when i > 10 -> "big " + i;
                  case Integer i -> "int " + i;
                  case String s -> "str " + s;
                  case PatternPoint(int x, int y) when x == y -> "diag " + x;
                  case PatternPoint(var x, _) -> "pt " + x;
                  case PatternShape _ -> "shape";
                  default -> "?";
              };
          }

          static void statement(Object o) {
              switch (o) {
                  case String s when s.isEmpty() -> System.out.print("empty ");
                  case String s -> System.out.print(s + " ");
                  case PatternLeaf leaf -> { int v = leaf.value; System.out.print("leaf" + v + " "); }
                  default -> System.out.print("other ");
              }
          }

          public static void main(String[] args) {
              PatternCircle c = new PatternCircle(1.5);
              System.out.println(area(new PatternGroup(c, new PatternSquare(2))) + " " + area(new PatternGroup(new PatternSquare(1), c)) + " " + depth(new PatternFork(new PatternLeaf(1), new PatternFork(new PatternLeaf(2), new PatternLeaf(3)))));
              System.out.println(describe(new PatternPoint(1, 2)) + "; " + describe(new PatternPoint(-1, 0)) + "; " + describe("hey") + "; " + describe(3));
              System.out.println(kind(null) + ", " + kind(42) + ", " + kind(7) + ", " + kind("s") + ", " + kind(new PatternPoint(3, 3)) + ", " + kind(new PatternPoint(3, 4)) + ", " + kind(c) + ", " + kind(2.5));
              statement("");
              statement("text");
              statement(new PatternLeaf(4));
              statement(1);
              Object o = new PatternPoint(1, 2);
              if (o instanceof PatternPoint(int x, int y) && x < y) System.out.print("x<y " + x + " " + y + " ");
              String size = o instanceof PatternPoint p ? "point " + p.x() : "none";
              boolean both = o instanceof PatternPoint p && p.y() == 2 || o instanceof String;
              while (!(o instanceof String text)) { o = "done"; }
              System.out.println(text + " " + size + " " + both + " " + (o instanceof Object any ? any : "null") + " " + (o instanceof PatternShape));
              try { area(null); } catch (RuntimeException e) { System.out.println("a pattern switch over null throws"); }
          }
      }
