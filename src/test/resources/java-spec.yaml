      interface CastsShape {
          double area();
      }

      interface CastsNamed {
          String name();
      }

      abstract class CastsBase implements CastsShape, CastsNamed {
          public String name() {
              return "base";
          }
      }

      class CastsSquare extends CastsBase {
          double s;

          CastsSquare(double s) {
              this.s = s;
          }

          public double area() {
              return s * s;
          }

          public String name() {
              return "square";
          }
      }

      class CastsCircle extends CastsBase {
          public double area() {
              return 3.0;
          }
      }

      class CastsOther {
      }

      class Casts {
          static String kind(Object o) {
              if (o instanceof String) return "string";
              if (o instanceof CastsSquare) return "square";
              if (o instanceof CastsShape) return "shape";
              if (o instanceof CastsOther) return "other";
              return "unknown";
          }

          public static void main(String[] args) {
              Object o = new CastsSquare(2), nothing = null;
              CastsShape shape = (CastsShape) o;
              CastsNamed named = (CastsNamed) shape;
              CastsBase base = (CastsBase) named;
              CastsSquare square = (CastsSquare) base;
              CastsShape none = (CastsShape) nothing;
              String text = (String) (Object) "text";
              System.out.println(shape.area() + " " + named.name() + " " + base.name() + " " + square.s + " " + text + " " + (none == null));
              System.out.println((o instanceof CastsShape) + " " + (o instanceof CastsNamed) + " " + (o instanceof Object) + " " + (named instanceof CastsCircle) + " " + (nothing instanceof CastsShape) + " " + (nothing instanceof Object));
              System.out.println(kind("s") + " " + kind(o) + " " + kind(new CastsCircle()) + " " + kind(new CastsOther()) + " " + kind(null) + " " + kind(new int[0]) + " " + kind(new StringBuilder()));
              try {
                  CastsCircle circle = (CastsCircle) base;
                  System.out.println("not reached " + circle);
              } catch (ClassCastException e) {
                  System.out.println("a square is no circle");
              }
              try {
                  Object s = "s";
                  CastsShape wrong = (CastsShape) s;
                  System.out.println("not reached " + wrong);
              } catch (ClassCastException e) {
                  System.out.println("a string is no shape");
              }
              try {
                  String wrong = (String) o;
                  System.out.println("not reached " + wrong);
              } catch (RuntimeException e) {
                  System.out.println("a square is no string " + (e instanceof ClassCastException));
              }
          }
      }
