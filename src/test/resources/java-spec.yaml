      class MoreStreams {
          interface Step {
              Object run() throws Exception;
          }

          // What a LineNumberReader answers to a script: r a read, a a read into an array,
          // l a line, s and S a skip of one and of nine, m a mark, t a reset.
          static String counted(String input, String script) throws IOException {
              LineNumberReader r = new LineNumberReader(new StringReader(input), 2);
              char[] buf = new char[8];
              StringBuilder out = new StringBuilder();
              for (char op : script.toCharArray()) {
                  switch (op) {
                      case 'r' -> out.append(r.read());
                      case 'a' -> out.append(r.read(buf));
                      case 'l' -> out.append(r.readLine());
                      case 's' -> out.append(r.skip(1));
                      case 'S' -> out.append(r.skip(9));
                      case 'm' -> r.mark(1);
                      default -> r.reset();
                  }
                  out.append('@').append(r.getLineNumber()).append(' ');
              }
              return out.toString().trim();
          }

          static void tell(String label, Step step) {
              try {
                  System.out.println(label + ": " + step.run());
              }
              catch (Exception e) {
                  System.out.println(label + ": " + e);
              }
          }

          static void render(Appendable out, String name) throws IOException {
              out.append("<").append(name, 1, 3).append('>');
          }

          public static void main(String[] args) {
              try {
                  run();
                  surrogates();
              }
              catch (Exception e) {
                  throw new IllegalStateException(e);
              }
          }

          // A high surrogate that ends what was written waits in a writer for its partner,
          // whether it came in a string or in an array.
          static void surrogates() throws IOException {
              ByteArrayOutputStream bytes = new ByteArrayOutputStream();
              OutputStreamWriter writer = new OutputStreamWriter(bytes, StandardCharsets.UTF_8);
              writer.write(new String(new char[] {'a', 0xd83d}));
              writer.flush();
              int held = bytes.size();
              writer.write(new char[] {0xde00, 'b'});
              writer.close();
              ByteArrayOutputStream latin = new ByteArrayOutputStream();
              PrintWriter printed = new PrintWriter(latin, true, StandardCharsets.ISO_8859_1);
              printed.print("é€");
              printed.flush();
              System.out.println(held + " " + Arrays.toString(bytes.toByteArray()) + " " + Arrays.toString(latin.toByteArray()));
          }

          static void run() throws Exception {
              // the streams that hold nothing
              InputStream none = InputStream.nullInputStream();
              byte[] four = new byte[4];
              tell("null in", () -> none.read() + " " + none.read(four) + " " + none.read(four, 0, 0) + " " + none.available()
                      + " " + none.readAllBytes().length + " " + none.readNBytes(3).length + " " + none.readNBytes(four, 0, 2)
                      + " " + none.skip(5) + " " + none.transferTo(new ByteArrayOutputStream()) + " " + none.markSupported());
              tell("null in skipN", () -> { none.skipNBytes(0); none.skipNBytes(2); return "skipped"; });
              tell("null in range", () -> none.read(four, 3, 2));
              none.close();
              none.close();
              tell("null in closed read", () -> none.read());
              tell("null in closed read array", () -> none.read(four, 0, 0));
              tell("null in closed available", () -> none.available());
              tell("null in closed all", () -> none.readAllBytes().length);
              tell("null in closed n", () -> none.readNBytes(0).length);
              tell("null in closed skip", () -> none.skip(1));
              tell("null in closed transfer", () -> none.transferTo(new ByteArrayOutputStream()));
              OutputStream sink = OutputStream.nullOutputStream();
              tell("null out", () -> { sink.write(1); sink.write(four); sink.write(four, 1, 2); sink.flush(); return "written"; });
              tell("null out range", () -> { sink.write(four, 3, 2); return "written"; });
              sink.close();
              tell("null out closed", () -> { sink.write(1); return "written"; });
              tell("null out closed array", () -> { sink.write(four, 0, 0); return "written"; });
              tell("null out closed flush", () -> { sink.flush(); return "flushed"; });
              Reader blank = Reader.nullReader();
              char[] three = new char[3];
              tell("null reader", () -> blank.read() + " " + blank.read(three) + " " + blank.read(three, 0, 0) + " "
                      + blank.ready() + " " + blank.skip(4) + " " + blank.transferTo(new StringWriter()) + " " + blank.markSupported());
              tell("null reader range", () -> blank.read(three, 2, 2));
              tell("null reader mark", () -> { blank.mark(1); return "marked"; });
              blank.close();
              tell("null reader closed", () -> blank.read());
              tell("null reader closed array", () -> blank.read(three, 0, 0));
              tell("null reader closed ready", () -> blank.ready());
              tell("null reader closed skip", () -> blank.skip(1));
              tell("null reader closed transfer", () -> blank.transferTo(new StringWriter()));
              Writer drain = Writer.nullWriter();
              tell("null writer", () -> { drain.write('a'); drain.write("ab"); drain.write(three); drain.write("abc", 1, 2);
                      drain.write(three, 1, 2); drain.append('c').append("cd").append("cde", 1, 2).flush(); return drain.append(null) == drain; });
              tell("null writer range", () -> { drain.write(three, 2, 2); return "written"; });
              tell("null writer string range", () -> { drain.write("abc", 2, 2); return "written"; });
              tell("null writer append range", () -> { drain.append("abc", 2, 5); return "written"; });
              drain.close();
              tell("null writer closed", () -> { drain.write('a'); return "written"; });
              tell("null writer closed append", () -> { drain.append('a'); return "written"; });
              tell("null writer closed append text", () -> { drain.append("a"); return "written"; });
              tell("null writer closed flush", () -> { drain.flush(); return "flushed"; });

              // characters over an array
              CharArrayWriter chars = new CharArrayWriter();
              chars.write('a');
              chars.write("bcd", 1, 2);
              chars.write(new char[] {'e', 'f', 'g'}, 1, 1);
              chars.append('h').append("ij").append("klm", 0, 2).append(null);
              System.out.println(chars + " " + chars.size() + " " + chars.toCharArray().length);
              StringWriter copy = new StringWriter();
              chars.writeTo(copy);
              chars.reset();
              chars.write("xy");
              chars.flush();
              chars.close();
              chars.write('z');
              System.out.println(copy + " " + chars + " " + new CharArrayWriter(0).size());
              tell("writer size", () -> new CharArrayWriter(-1));
              tell("writer range", () -> { chars.write(new char[2], 1, 2); return "written"; });
              CharArrayReader letters = new CharArrayReader("abcdefgh".toCharArray());
              char[] buffer = new char[3];
              tell("array reader", () -> (char) letters.read() + " " + letters.read(buffer) + new String(buffer) + " "
                      + letters.skip(1) + " " + letters.ready() + " " + letters.markSupported() + " " + letters.read(buffer, 0, 0));
              letters.mark(0);
              tell("array reader marked", () -> (char) letters.read() + " " + letters.skip(10) + " " + letters.read() + " "
                      + letters.read(buffer) + " " + letters.ready() + " " + letters.skip(-3));
              letters.reset();
              tell("array reader reset", () -> (char) letters.read() + " " + letters.read(buffer, 1, 2) + new String(buffer));
              tell("array reader range", () -> letters.read(buffer, 2, 2));
              letters.close();
              tell("array reader closed", () -> letters.read());
              tell("array reader closed ready", () -> letters.ready());
              tell("array reader closed mark", () -> { letters.mark(0); return "marked"; });
              tell("array reader closed skip", () -> letters.skip(1));
              CharArrayReader part = new CharArrayReader("abcdefgh".toCharArray(), 2, 3);
              tell("array reader part", () -> { part.reset(); return (char) part.read() + " " + part.read(buffer) + " " + part.read() + " " + part.ready(); });
              tell("array reader bounds", () -> new CharArrayReader(new char[3], 4, 1));
              tell("array reader past", () -> new CharArrayReader(new char[3], 2, 5).read(buffer));
              tell("array reader negative", () -> new CharArrayReader(new char[3], 1, -1));

              // a reader and a stream that take back what was read
              PushbackReader back = new PushbackReader(new StringReader("abcdef"), 3);
              tell("pushback", () -> { int c = back.read(); back.unread(c); back.unread('z'); return (char) back.read() + "" + (char) back.read() + (char) back.read(); });
              tell("pushback array", () -> { back.unread(new char[] {'x', 'y'}); back.unread(new char[] {'p', 'q', 'r'}, 1, 1); return back.read(buffer) + new String(buffer) + back.read(buffer, 0, 2) + new String(buffer); });
              tell("pushback full", () -> { back.unread(new char[] {'1', '2', '3'}); back.unread('4'); return "unread"; });
              tell("pushback full array", () -> { back.unread(new char[] {'5', '6'}); return "unread"; });
              tell("pushback ready", () -> back.ready() + " " + back.markSupported() + " " + back.skip(2) + " " + (char) back.read() + " " + back.skip(1) + " " + back.skip(100) + " " + back.read() + " " + back.ready());
              tell("pushback mark", () -> { back.mark(1); return "marked"; });
              tell("pushback reset", () -> { back.reset(); return "reset"; });
              tell("pushback skip", () -> back.skip(-1));
              tell("pushback size", () -> new PushbackReader(new StringReader(""), 0));
              tell("pushback range", () -> back.read(buffer, 2, 2));
              back.close();
              back.close();
              tell("pushback closed", () -> back.read());
              tell("pushback closed unread", () -> { back.unread('a'); return "unread"; });
              tell("pushback closed ready", () -> back.ready());
              tell("pushback closed skip", () -> back.skip(1));
