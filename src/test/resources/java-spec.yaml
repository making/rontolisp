                  s.append(i > 0 ? " " : "").append(Integer.toHexString(units[i]));
              }
              return s.append(']').toString();
          }

          static void wide() {
              Charset[] sets = {StandardCharsets.UTF_16, StandardCharsets.UTF_16BE, StandardCharsets.UTF_16LE};
              int[][] texts = {{}, {'a', 0xe9, 0x20ac}, {0xd83d, 0xde00}, {'x', 0xd83d, 'y'}, {0xde00, 0xd83d}, {0xfeff, 'a'}, {0xd83d, 0xd83d, 0xde00}};
              String[] inputs = {"", "00", "feff0061", "fffe6100", "feff", "feff00", "d83dde00", "d83d0061", "de000061", "d83d", "d83dd83dde00", "0061feff0062", "fefffffe", "0061d83d00", "dc00d800"};
              try {
                  for (Charset cs : sets) {
                      StringBuilder line = new StringBuilder(cs + " " + cs.name() + " " + new InputStreamReader(new ByteArrayInputStream(new byte[0]), cs).getEncoding() + " " + new OutputStreamWriter(new ByteArrayOutputStream(), cs).getEncoding());
                      for (int[] codes : texts) {
                          char[] made = new char[codes.length];
                          for (int i = 0; i < codes.length; i++) {
                              made[i] = (char) codes[i];
                          }
                          line.append(' ').append(wideHex(new String(made).getBytes(cs)));
                      }
                      System.out.println(line);
                      line = new StringBuilder();
                      for (String in : inputs) {
                          byte[] b = new byte[in.length() / 2];
                          for (int i = 0; i < b.length; i++) {
                              b[i] = (byte) Integer.parseInt(in.substring(2 * i, 2 * i + 2), 16);
                          }
                          char[] whole = new String(b, cs).toCharArray();
                          line.append(wideUnits(whole, whole.length));
                          for (int step = 1; step <= 3; step++) {
                              final int most = step;
                              Reader reader = new InputStreamReader(new ByteArrayInputStream(b) {
                                  public int read(byte[] to, int off, int len) {
                                      return super.read(to, off, Math.min(len, most));
                                  }
                              }, cs);
                              char[] read = new char[8];
                              int got = 0;
                              for (int c = reader.read(); c >= 0; c = reader.read()) {
                                  read[got++] = (char) c;
                              }
                              line.append(wideUnits(read, got).equals(wideUnits(whole, whole.length)) ? "=" : wideUnits(read, got));
                          }
                      }
                      System.out.println(line);
                      ByteArrayOutputStream sink = new ByteArrayOutputStream();
                      Writer writer = new OutputStreamWriter(sink, cs);
                      writer.flush();
                      writer.write("a");
                      writer.write(0xd83d);
                      writer.flush();
                      writer.write(new char[] {0xde00, 'b'});
                      writer.write(0xd83d);
                      writer.write("c");
                      writer.write(0xd83d);
                      writer.close();
                      ByteArrayOutputStream printed = new ByteArrayOutputStream();
                      PrintStream stream = new PrintStream(printed, true, cs);
                      stream.print("");
                      stream.print("a");
                      stream.println("b");
                      stream.close();
                      System.out.println(wideHex(sink.toByteArray()) + " " + wideHex(printed.toByteArray()) + " " + printed.toString(cs).length() + " " + new String(printed.toByteArray(), cs.name()).trim() + " " + wideHex("hi".getBytes(cs.name())) + " " + stream.charset().name());
                  }
                  System.out.println(Charset.forName("utf-16").name() + " " + Charset.forName("UnicodeBigUnmarked") + " " + Charset.forName("X-UTF-16LE") + " " + Charset.isSupported("UTF16") + " " + Charset.isSupported("UTF-64") + " " + (Charset.forName("UTF-16") == StandardCharsets.UTF_16) + " " + (Charset.forName("utf8") == StandardCharsets.UTF_8) + " " + wideHex("hé".getBytes("UTF-8")) + wideHex("hé".getBytes("latin1")) + " " + new String(new byte[] {0, 104, 0, 105}, "UTF-16BE") + new String(new byte[] {104, 105}, 0, 1, "ASCII") + " " + new BufferedReader(new InputStreamReader(new ByteArrayInputStream(new byte[] {(byte) 0xff, (byte) 0xfe, 104, 0, 105, 0}), "UTF-16")).readLine() + " " + new InputStreamReader(new ByteArrayInputStream(new byte[0]), "utf-8").getEncoding() + " " + new PrintStream(new ByteArrayOutputStream(), false, "US-ASCII").charset());
                  String computed = "UTF-" + sets.length * 4 + "x";
                  Charset.forName(computed);
              } catch (IOException | UnsupportedCharsetException e) {
                  System.out.println(e);
              }
          }
      }
