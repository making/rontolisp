  # A class, a record and a method declare type parameters, bounded or not; the program
  # that runs has none of them. A member is typed through the arguments of the type it
  # is read through, so a boxing or an unboxing is made where a parameter is a box. A
  # type of an inner class carries the arguments of the class around it.
  - name: a-type-parameter-is-erased-and-a-member-is-typed-through-its-arguments
    main: Generics
    source: |
      class Generics {
          static class Box<T> {
              private T value;

              Box(T value) {
                  this.value = value;
              }

              T get() {
                  return value;
              }

              void set(T value) {
                  this.value = value;
              }

              <R> Box<R> map(Function<? super T, ? extends R> f) {
                  return new Box<>(f.apply(value));
              }

              public String toString() {
                  return "Box(" + value + ")";
              }
          }

          record Pair<A, B>(A first, B second) {
              <C> Pair<A, C> withSecond(C c) {
                  return new Pair<>(first, c);
              }

              static <X> Pair<X, X> twin(X x) {
                  return new Pair<>(x, x);
              }
          }

          static class Stack<T> {
              private class Cell {
                  T value;
                  Cell next;
              }

              private Cell head;
              private int size;

              void push(T v) {
                  Cell c = new Cell();
                  c.value = v;
                  c.next = head;
                  head = c;
                  size++;
              }

              T pop() {
                  T v = head.value;
                  head = head.next;
                  size--;
                  return v;
              }

              // a Cell of another Stack is that Stack's: its value is a String here
              int topLength(Stack<String> other) {
                  return other.head.value.length();
              }
          }

          static class Keyed<K> {
              class Entry<V> {
                  final K key;
                  final V value;

                  Entry(K key, V value) {
                      this.key = key;
                      this.value = value;
                  }
              }
          }

          static class Tree<T extends Comparable<T>> {
              private T value;
              private Tree<T> left, right;
              private int size;

              void add(T v) {
                  if (size++ == 0) {
                      value = v;
                  }
                  else if (v.compareTo(value) < 0) {
                      if (left == null) {
                          left = new Tree<>();
                      }
                      left.add(v);
                  }
                  else {
                      if (right == null) {
                          right = new Tree<>();
                      }
                      right.add(v);
                  }
              }

              void walk(List<? super T> out) {
                  if (size == 0) {
                      return;
                  }
                  if (left != null) {
                      left.walk(out);
                  }
                  out.add(value);
                  if (right != null) {
                      right.walk(out);
                  }
              }

              <A> A fold(A zero, BiFunction<A, ? super T, A> f) {
                  List<T> all = new ArrayList<>();
                  walk(all);
                  A acc = zero;
                  for (T each : all) {
                      acc = f.apply(acc, each);
                  }
                  return acc;
              }
          }

          static class Cache<V> {
              private final Map<String, V> map = new HashMap<>();
              private final Function<String, V> loader;
              int loads;

              Cache(Function<String, V> loader) {
                  this.loader = loader;
              }

              V get(String key) {
                  V known = map.get(key);
                  if (known == null) {
                      known = loader.apply(key);
                      map.put(key, known);
                      loads++;
                  }
                  return known;
              }
          }

          static <T> T first(List<T> xs) {
              return xs.get(0);
          }

          static <T extends Comparable<T>> T max(T a, T b) {
              return a.compareTo(b) >= 0 ? a : b;
          }

          static <T, R> List<R> map(List<T> xs, Function<T, R> f) {
              List<R> out = new ArrayList<>();
              for (T x : xs) {
                  out.add(f.apply(x));
              }
              return out;
          }

          static <T> void swap(List<T> xs, int i, int j) {
              T t = xs.get(i);
              xs.set(i, xs.get(j));
              xs.set(j, t);
          }

          public static void main(String[] args) {
              Box<String> b = new Box<>("hi");
              Box<Integer> n = b.map(String::length);
              Box<Boolean> flag = new Box<>(false);
              Box<Character> letter = new Box<>('c');
              flag.set(!flag.get());
              System.out.println(b + " " + n + " " + (n.get() + 1) + " " + flag + " " + (flag.get() ? "set" : "clear") + " " + letter + " " + (char) (letter.get() + 1));
              Pair<String, Integer> p = new Pair<>("a", 1);
              System.out.println(p + " " + p.withSecond(2.5) + " " + Pair.twin('x') + " " + p.first().length() + " " + (p.second() + 1) + " " + p.equals(new Pair<>("a", 1)) + " " + (p.hashCode() == new Pair<>("a", 1).hashCode()));
              List<Integer> xs = new ArrayList<>();
              for (int i = 1; i <= 5; i++) {
                  xs.add(i * i);
              }
              swap(xs, 0, 4);
              System.out.println(first(xs) + " " + max(3, 7) + " " + max("pear", "apple") + " " + map(xs, x -> x + 1) + " " + map(xs, x -> "n" + x).get(1).length());
              Stack<String> stack = new Stack<>();
              stack.push("a");
              stack.push("b");
              Stack<String>.Cell cell = stack.head;
              var entry = new Keyed<String>().new Entry<>("k", 2.5);
              System.out.println(cell.value.toUpperCase() + stack.topLength(stack) + stack.head.next.value.length() + " " + (entry.key.length() + entry.value));
              String top = stack.pop();
              System.out.println(top + stack.pop() + stack.size);
              Tree<String> tree = new Tree<>();
              for (String w : new String[] { "m", "c", "x", "a", "d" }) {
                  tree.add(w);
              }
              List<Object> sorted = new ArrayList<>();
              tree.walk(sorted);
              System.out.println(sorted + " " + tree.fold("", (acc, w) -> acc + w) + " " + tree.fold(0, (acc, w) -> acc + w.length()));
              Cache<Integer> cache = new Cache<>(String::length);
              System.out.println(cache.get("four") + cache.get("four") + cache.get("xy") + " " + cache.loads);
              class Local<T> {
                  final T held;

                  Local(T held) {
                      this.held = held;
                  }

                  <U> Local<U> with(U other) {
                      return new Local<>(other);
                  }
              }
              Local<String> local = new Local<>("held");
              var q = new Box<>(42);
              int unboxed = q.get();
              q.set(unboxed + 1);
              System.out.println(local.held + " " + local.with(5).held + " " + local.with(local).held.held + " " + q + " " + unboxed);
          }
      }
