  # interface's, and of a lambda; a static and a private method are plain functions; a
  # constant is a static final field, inherited by what implements the interface.
  - name: an-interface-has-defaults-static-and-private-methods-and-constants
    main: Interfaces
    source: |
      interface FaceGreeter {
          String PREFIX = "Hi ";
          int LIMIT = PREFIX.length() * 2;

          String greet(String name);

          default String twice(String name) { return greet(name) + greet(name); }

          default String help() { return helper() + twice("x"); }

          static FaceGreeter polite() { return n -> PREFIX + "dear " + n; }

          private String helper() { return "h" + LIMIT; }
      }

      interface FaceLoud extends FaceGreeter {
          default String twice(String name) { return greet(name).toUpperCase() + "!"; }

          default String help() { return "loud " + FaceGreeter.super.help(); }
      }

      class FacePlain implements FaceGreeter {
          public String greet(String name) { return PREFIX + name; }
      }

      class FaceShout extends FacePlain implements FaceLoud {
          public String greet(String name) { return "hey " + name; }

          public String help() { return FaceLoud.super.help() + "?"; }
      }

      class FaceQuiet extends FaceShout {
          public String twice(String name) { return "(" + greet(name) + ")"; }
      }

      class Interfaces {
          public static void main(String[] args) {
              FaceGreeter plain = new FacePlain(), shout = new FaceShout(), quiet = new FaceQuiet();
              FaceGreeter lambda = name -> "<" + name + ">";
              FaceLoud loud = name -> "psst " + name;
              System.out.println(plain.twice("a") + " | " + shout.twice("b") + " | " + quiet.twice("c") + " | " + lambda.twice("d") + " | " + loud.twice("e"));
              System.out.println(plain.help() + " | " + shout.help() + " | " + lambda.help() + " | " + FaceGreeter.polite().greet("q") + " | " + FaceGreeter.PREFIX + FaceGreeter.LIMIT + FacePlain.PREFIX + FaceLoud.LIMIT);
          }
      }
