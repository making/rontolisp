  # compareTo(T) of Comparable<T> and compareTo(Version) of a class implementing
  # Comparable<Version> are one method: the dispatcher of the first calls the second, and
  # there is no bridge. A string and a box are tested by their own predicates.
  - name: an-override-through-a-type-parameter-is-one-dispatch-entry
    main: Overrides
    source: |
      class Overrides {
          interface Source<T> {
              T get();
          }

          static class Fixed implements Source<String> {
              public String get() {
                  return "fixed";
              }
          }

          static abstract class Node<T extends Comparable<T>> implements Comparable<Node<T>> {
              abstract T key();

              public int compareTo(Node<T> other) {
                  return key().compareTo(other.key());
              }
          }

          static class Leaf extends Node<Integer> {
              final int k;

              Leaf(int k) {
                  this.k = k;
              }

              Integer key() {
                  return k;
              }

              public String toString() {
                  return "Leaf" + k;
              }
          }

          static class Version implements Comparable<Version> {
              final int major, minor;

              Version(int major, int minor) {
                  this.major = major;
                  this.minor = minor;
              }

              public int compareTo(Version o) {
                  return major != o.major ? major - o.major : minor - o.minor;
              }

              public String toString() {
                  return major + "." + minor;
              }
          }

          static abstract class Animal<S> {
              abstract S sound();

              String speak() {
                  return "says " + sound();
              }
          }

          static class Dog extends Animal<String> {
              String sound() {
                  return "woof";
              }
          }

          static class Counter extends Animal<Integer> {
              int n;

              Integer sound() {
                  return ++n;
              }
          }

          interface Visitor<R> {
              R num(int n);

              R add(R a, R b);
          }

          enum Planet implements Supplier<String> {
              EARTH, MARS;

              public String get() {
                  return name().toLowerCase();
              }
          }

          static <R> R visit(int depth, Visitor<R> v) {
              return depth == 0 ? v.num(1) : v.add(visit(depth - 1, v), visit(depth - 1, v));
          }

          static <T extends Comparable<T>> T best(List<T> xs) {
              T found = xs.get(0);
              for (T x : xs) {
                  if (x.compareTo(found) > 0) {
                      found = x;
                  }
              }
              return found;
          }

          @SafeVarargs
          static <T> List<T> listOf(T... items) {
              List<T> out = new ArrayList<>();
              for (T item : items) {
                  out.add(item);
              }
              return out;
          }

          public static void main(String[] args) {
              Source<String> s = new Fixed();
              Source<Integer> lambda = () -> 7;
              Supplier<String> planet = Planet.MARS;
              System.out.println(s.get() + " " + s.get().length() + " " + (lambda.get() + 1) + " " + planet.get() + " " + Planet.MARS.compareTo(Planet.EARTH));
              List<Version> versions = listOf(new Version(1, 2), new Version(1, 10), new Version(0, 9));
              Leaf a = new Leaf(3), b = new Leaf(5);
              Comparable<Version> first = versions.get(0);
              Comparable<String> text = "b";
              Comparable<Integer> number = 4;
              System.out.println(best(versions) + " " + best(listOf(3, 9, 4)) + " " + best(listOf("b", "c", "a")) + " " + best(listOf(Planet.EARTH, Planet.MARS)) + " " + a.compareTo(b) + " " + best(listOf(a, b)) + " " + first.compareTo(versions.get(2)) + " " + text.compareTo("a") + " " + number.compareTo(9) + " " + "apple".compareTo("apricot"));
              Animal<String> dog = new Dog();
              Counter counter = new Counter();
              Animal<Integer> counting = counter;
              System.out.println(dog.speak() + " " + dog.sound().length() + " " + counting.speak() + " " + (counting.sound() + 10) + " " + counter.n);
              System.out.println(visit(3, new Visitor<Integer>() {
                  public Integer num(int n) {
                      return n;
                  }

                  public Integer add(Integer a, Integer b) {
                      return a + b;
                  }
              }) + " " + visit(2, new Visitor<String>() {
                  public String num(int n) {
                      return "" + n;
                  }

                  public String add(String a, String b) {
                      return "(" + a + b + ")";
                  }
              }));
          }
      }
