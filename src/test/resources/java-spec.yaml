  # A static initialization that throws ends as the language ends it: an exception that
  # is no Error is the cause of an ExceptionInInitializerError, an Error passes as it
  # is, and every later use of the class -- and of a class whose own initialization
  # needed it -- throws NoClassDefFoundError, whose cause says what was thrown and in
  # which thread. A class whose initialization can throw and does not is initialized.
  - name: a-static-initialization-that-throws-leaves-its-class-unusable
    main: FailingInit
    source: |
      class FailConfig {
          static int n = load();

          static int load() {
              System.out.println("loading");
              if (n == 0) throw new IllegalStateException("no config");
              return 1;
          }

          static int get() { return n; }
      }

      class FailBroken {
          static int n;
          static { System.out.println("broken"); if (n == 0) throw new Error("an error"); }
      }

      class FailBase {
          static int b;
          static { System.out.println("base"); if (b == 0) throw new UnsupportedOperationException(); }
      }

      class FailDerived extends FailBase {
          static int d = 5;
          static { System.out.println("derived"); }
      }

      class FailUser { static int u = FailConfig.get() + 1; }

      class FailParsed {
          static int f = Integer.parseInt("12");
          static { System.out.println("parsed"); }
      }

      class FailingInit {
          static void show(String what, Throwable t) {
              System.out.println(what + ": " + t + " | cause " + t.getCause() + (t.getCause() != null ? " | " + t.getCause().getCause() : ""));
              if (t instanceof ExceptionInInitializerError e) System.out.println("  getException " + e.getException() + " " + e.getMessage());
          }

          static String refused(Throwable t) {
              try {
                  t.initCause(new RuntimeException("c"));
                  return "set";
              } catch (IllegalStateException e) {
                  return "refused";
              }
          }

          public static void main(String[] args) {
              for (int i = 0; i < 2; i++) {
