# Parallel test execution. Classes still run sequentially by default (the
# surefire fork configuration in pom.xml pairs the two heaviest classes across
# two JVMs); a test class opts individual methods into parallel execution with
# @Execution(ExecutionMode.CONCURRENT) at the class level. Today only
# WasmLispCompilerIntegrationTest and Uax15E2eTest (via AsdfLibraryE2eSupport)
# do that.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = same_thread
# Intra-class parallelism per surefire fork, derived from the core count of the
# machine running the build: WasmLispCompilerIntegrationTest is the longest class
# in the build by an order of magnitude and each of its methods is a compile +
# guest process round trip, so the fork is idle most of the time at a low cap --
# but a fixed cap tuned for a many-core development machine oversubscribes a
# small one. The rule, its bounds, and the property that pins it for a single run
# live in CoreCountParallelismStrategy; each run prints the value it chose.
junit.jupiter.execution.parallel.config.strategy = custom
junit.jupiter.execution.parallel.config.custom.class = am.ik.rontolisp.testsupport.CoreCountParallelismStrategy
