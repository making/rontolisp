# Parallel test execution. Classes still run sequentially by default (the
# surefire fork configuration in pom.xml pairs the two heaviest classes across
# two JVMs); a test class opts individual methods into parallel execution with
# @Execution(ExecutionMode.CONCURRENT) at the class level. Today only
# WasmLispCompilerIntegrationTest and Uax15E2eTest (via AsdfLibraryE2eSupport)
# do that.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = same_thread
# Intra-class parallelism per surefire fork, tuned for a development machine
# with many cores: WasmLispCompilerIntegrationTest is the longest class in the
# build by an order of magnitude and each of its methods is a compile + Docker
# round trip + wasmtime run, so the fork is idle most of the time at a low cap.
# CI overrides this on the command line (see .github/workflows/ci.yaml) because
# the runner has 4 vCPU shared by two forks.
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 16
