  # A raise, a built-in error, a call/cc escape and a converter error each leave the
  # value as it was; a with-exception-handler handler runs where the raise stands. A
  # parallel-execute thread starts with the caller's bindings (Gauche's threads do; not
  # checked against it: Gauche has no parallel-execute).
  - name: parameterize-is-restored-on-every-exit
    source: |
      (define prm-r (make-parameter 'outer))
      (write (guard (e (#t (list 'caught e (prm-r))))
        (parameterize ((prm-r 'raised)) (raise (prm-r)))))
      (newline)
      (write (prm-r))
      (newline)
      (write (guard (e (#t (prm-r))) (parameterize ((prm-r 'built-in)) (+ 1 'a))))
      (newline)
      (write (with-exception-handler
              (lambda (c) (list 'handler-sees (prm-r)))
              (lambda () (parameterize ((prm-r 'at-raise)) (raise-continuable 1)))))
      (newline)
      (write (call-with-current-continuation
              (lambda (k) (parameterize ((prm-r 'escaped)) (k (prm-r))))))
      (newline)
      (write (prm-r))
      (newline)
      (write (dynamic-wind (lambda () #f)
                           (lambda () (parameterize ((prm-r 'wound)) (prm-r)))
                           (lambda () (write (prm-r)) (newline))))
      (newline)
      (define prm-n (make-parameter 0 (lambda (x) (if (number? x) x (error "not a number:" x)))))
      (write (guard (e ((error-object? e) (list (error-object-message e) (error-object-irritants e))))
        (parameterize ((prm-r 'never) (prm-n 'a)) (prm-r))))
      (newline)
      (write (list (prm-r) (prm-n)))
      (newline)
      (define-syntax with-r
        (syntax-rules () ((_ v body ...) (parameterize ((prm-r v)) body ...))))
      (write (let ((prm-r (lambda () 'user))) (with-r 'macro (prm-r))))
      (newline)
      (write (with-r 'macro (prm-r)))
      (newline)
      (define prm-seen 'none)
      (parameterize ((prm-r 'in-thread))
        (parallel-execute (lambda () (set! prm-seen (prm-r)))))
      (write (list prm-seen (prm-r)))
      (newline)
    expected: |
      (caught raised outer)
      outer
      outer
      (handler-sees at-raise)
      escaped
      outer
      outer
      wound
      ("not a number:" (a))
      (outer 0)
      user
      macro
      (in-thread outer)
  # case-lambda (R7RS 4.2.9): the first clause whose formals accept the argument count
  # runs, a clause body is a <body>, a self tail call through another clause is a loop,
  # and a count no clause accepts is an error object (Gauche 0.9.15 -r7 output, except
  # that its message spells "case lambda"). A macro's template binder stays hygienic.
  # A top-level one is a defun per clause a direct call picks statically: cl-count's
  # first clause calls the second, whose self tail call is a loop; cl-pp's clauses call
  # each other, which keeps the one dispatching procedure and its jumps; apply and a
  # first-class use go through the dispatch.
  - name: case-lambda-takes-the-first-clause-that-accepts-the-arguments
    source: |
      (define cl-range
        (case-lambda
          ((e) (cl-range 0 e))
          ((b e) (do ((r '() (cons e r)) (e (- e 1) (- e 1))) ((< e b) r)))))
      (write (list (cl-range 3) (cl-range 3 5)))
      (newline)
      (define cl-kind
        (case-lambda
          ((x) (list 'one x))
          ((x . r) (list 'many x r))
          ((x y) (list 'never x y))
          (r (list 'none r))))
      (write (list (cl-kind) (cl-kind 1) (cl-kind 1 2) (cl-kind 1 2 3)))
      (newline)
      (define cl-count
        (case-lambda
          ((n) (cl-count 0 n))
          ((i n) (if (= i n) i (cl-count (+ i 1) n)))))
      (write (cl-count 100000))
      (newline)
      (define cl-pp
        (case-lambda
          ((n) (if (= n 0) 'pp (cl-pp n 1)))
          ((n k) (cl-pp (- n k)))))
      (write (cl-pp 100000))
      (newline)
      (write (list (apply cl-kind '(1 2)) (apply cl-kind '()) (map cl-kind '(1 2) '(3 4))))
      (newline)
      (define cl-sum
        (case-lambda
          ((acc) acc)
          ((acc x . xs) (apply cl-sum (+ acc x) xs))))
      (write (cl-sum 0 1 2 3 4))
      (newline)
      (write (map (case-lambda ((x) (* x 2)) ((x y) (+ x y))) '(1 2) '(10 20)))
      (newline)
      (write (apply (case-lambda ((a b c) (list c b a)) (r r)) '(1 2 3)))
      (newline)
      (define (cl-make-acc)
        (let ((n 0))
          (case-lambda
            (() n)
            ((k) (set! n (+ n k)) n))))
      (define cl-acc (cl-make-acc))
      (cl-acc 5)
      (cl-acc 7)
      (write (cl-acc))
      (newline)
      (define (cl-local x)
        (define g
          (case-lambda
            ((a) (define y (* a 10)) (+ y x))
            ((a b) (g (+ a b)))))
        (list (g 1) (g 1 2)))
      (write (cl-local 100))
      (newline)
      (write (letrec ((h (case-lambda ((n) (h n '())) ((n acc) (if (= n 0) acc (h (- n 1) (cons n acc)))))))
               (h 4)))
      (newline)
      (define cl-strict (case-lambda ((x) x) ((x y) y)))
      (write (guard (e ((error-object? e) (list 'caught (error-object-message e) (error-object-irritants e))))
               (cl-strict 1 2 3)))
      (newline)
      (write (guard (e ((error-object? e) 'caught-none)) (cl-strict)))
      (newline)
      (define-syntax cl-opt
        (syntax-rules ()
          ((_ name default body)
           (define name (case-lambda (() (let ((cl-x default)) body)) ((cl-x) body))))))
      (define cl-x 4)
      (cl-opt cl-twice 21 (* cl-x 2))
      (write (list (cl-twice) (cl-twice 5)))
      (newline)
      (write (let ((case-lambda list)) (case-lambda 1 2)))
      (newline)
      (define cl-p (make-parameter 'outer))
      (define cl-show (case-lambda (() (cl-p)) ((v) (parameterize ((cl-p v)) (cl-show)))))
      (write (list (cl-show) (cl-show 'inner) (cl-show)))
      (newline)
      (write (guard (e (#t (list 'raised e))) ((case-lambda ((x) (raise x))) 'boom)))
      (newline)
      (write (call-with-values (lambda () ((case-lambda ((a b) (values b a))) 1 2)) list))
      (newline)
    expected: |
      ((0 1 2) (3 4))
      ((none ()) (one 1) (many 1 (2)) (many 1 (2 3)))
      100000
      pp
      ((many 1 (2)) (none ()) ((many 1 (3)) (many 2 (4))))
      10
      (11 22)
      (3 2 1)
      12
      (110 130)
      (1 2 3 4)
      (caught "wrong number of arguments to case-lambda: (1 2 3)" ())
      caught-none
      (8 8)
      (1 2)
      (outer inner outer)
      (raised boom)
      (2 1)
  # Ports (.todo/873): string ports, the optional port argument; Gauche 0.9.15 -r7 output.
  - name: string-ports-write-and-read
    source: |
