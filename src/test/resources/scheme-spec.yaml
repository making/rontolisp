# The corpus of the EXPERIMENTAL Scheme front end (SchemeSpecE2eTest): one case per row of
# the lowering table in .kb/scheme-frontend.md and per procedure group of the subset.
# Cases run IN ORDER, concatenated into one .scm program per backend (shared global
# state), and the output is sliced back per case -- the ci-spec.yaml idea. Every case
# must print the same text on the interpreter, the JVM, wasm and the component.
cases:
  - name: identifiers-keep-their-case-and-never-hit-a-common-lisp-name
    source: |
      (define (loop list) (car list))
      (write (loop '(1 2 3)))
      (newline)
      (define (remove-if print) (list 'mine print))
      (write (remove-if '(1 2)))
      (newline)
      (define Foo 1)
      (define foo 2)
      (define FOO 3)
      (write (list Foo foo FOO))
      (newline)
    expected: |
      1
      (mine (1 2))
      (1 2 3)
  - name: an-identifier-without-a-lowercase-letter-is-renamed-when-bound
    source: |
      (define X 10)
      (define (CAR x) (list 'mine x X))
      (write (CAR '(1 2)))
      (newline)
      (write (car '(1 2)))
      (newline)
      (define (tn T NIL) (list T NIL))
      (write (tn 1 2))
      (newline)
      (define (amp &rest a:b) (list &rest a:b))
      (write (amp 3 4))
      (newline)
      (write (let ((LIST 5) (+ -)) (+ LIST 2)))
      (newline)
    expected: |
      (mine (1 2) 10)
      1
      (1 2)
      (3 4)
      3
  - name: symbols-as-data-round-trip-through-their-escaped-spelling
    source: |
      (write '(ABC T NIL nil t a:b &rest s%x x%y))
      (newline)
      (write (map symbol->string '(ABC T a:b s%x abc)))
      (newline)
      (write
       (list (eq? 'ABC (string->symbol "ABC")) (eq? 'abc (string->symbol "abc"))
             (eq? 'a:b (string->symbol "a:b")) (eq? 'abc 'ABC)))
      (newline)
      (write
       (list (symbol? 'T) (symbol? 'NIL) (symbol? 'nil) (null? 'NIL) (eq? 'T #t)))
      (newline)
      (write
       (list (eq? (string->symbol "#f") #f) (if (string->symbol "#f") 'true 'false)))
      (newline)
    expected: |
      (ABC T NIL nil t a:b &rest s%x x%y)
      ("ABC" "T" "a:b" "s%x" "abc")
      (#t #t #t #f)
      (#t #t #t #f #f)
      (#f true)
  # Gauche 0.9.15 -r7, except that it writes |+inf.0x| where R7RS reads an identifier.
  - name: vertical-line-identifiers-are-symbols-of-any-spelling
    source: |
      (define |hello world| 42)
      (define (|a.b;c[d]| x) (+ x 1))
      (write (list |hello world| (|a.b;c[d]| 1) (eq? 'abc '|abc|) (eq? '|#t| #t) (symbol? '|#f|)))
      (newline)
      (write '(|foo bar| || |1| |.| |a\x41;b| |a\|b| |a\\b| |\t| ABC |+inf.0| + ... .a))
      (newline)
      (display '(|foo bar| || |1| |a\|b|))
      (newline)
      (write (map symbol->string '(|foo bar| || |A:b|)))
      (newline)
      (write (list (string->symbol "a b") (string->symbol "") (string->symbol "1+") (string->symbol "λx")))
      (newline)
      (let ((|#t| #f)) (write (if |#t| 'yes 'no)))
      (newline)
    expected: |
      (42 2 #t #f #t)
      (|foo bar| || |1| |.| aAb |a\|b| |a\\b| |\x09;| ABC |+inf.0| + ... .a)
      (foo bar  1 a|b)
      ("foo bar" "" "A:b")
      (|a b| || |1+| λx)
      no
  # Gauche 0.9.15 -r7. (eqv? +nan.0 +nan.0) is left out: R7RS leaves it unspecified,
  # Gauche answers #f and every backend here #t (Common Lisp's eql of one bit pattern).
  - name: infinities-and-nan-read-print-and-compare
    source: |
      (write (list +inf.0 -inf.0 +nan.0 -nan.0 +INF.0 #x-inf.0))
      (newline)
      (write (list (= +nan.0 +nan.0) (< -inf.0 0 +inf.0) (> +nan.0 0) (< +nan.0 0) (= +inf.0 +inf.0)))
      (newline)
      (write (list (* 2 +inf.0) (/ 1. +inf.0) (- +inf.0 +inf.0) (max 1 +inf.0) (min 1 -inf.0) (abs -inf.0)))
      (newline)
      (write (list (nan? +nan.0) (infinite? -inf.0) (finite? +inf.0) (exact? +inf.0) (inexact? +nan.0)
                   (integer? +inf.0) (rational? +nan.0) (real? -inf.0)))
      (newline)
      (write (list (floor +inf.0) (ceiling -inf.0) (round +nan.0) (truncate +inf.0) (floor 2.5) (round 2.5)
                   (floor -2.5)))
      (newline)
      (write (list (number->string -inf.0) (string->number "+inf.0") (string->number "-Inf.0")
                   (string->number "+nan.0") (string->number "inf.0") (string->number "+inf.0" 16)))
      (newline)
      (write (guard (e (#t (error-object? e))) (exact +inf.0)))
      (newline)
      (write (list (sqrt +inf.0) (exp -inf.0) (atan +inf.0) (eqv? +inf.0 +inf.0) (equal? -inf.0 -inf.0)))
      (newline)
    expected: |
      (+inf.0 -inf.0 +nan.0 +nan.0 +inf.0 -inf.0)
      (#f #t #f #f #t)
      (+inf.0 0.0 +nan.0 +inf.0 -inf.0 +inf.0)
      (#t #t #f #f #t #f #f #t)
      (+inf.0 -inf.0 +nan.0 +inf.0 2.0 2.0 -3.0)
      ("-inf.0" +inf.0 -inf.0 +nan.0 #f +inf.0)
      #t
      (+inf.0 0.0 1.5707963267948966 #t #t)
  - name: the-empty-list-is-true-and-false-is-its-own-value
    source: |
      (define (truthy x) (if x 'yes 'no))
      (write (map truthy (list '() #f #t 0 "" 'a (list))))
      (newline)
      (write
       (list (null? '()) (null? #f) (eq? '() #f) (boolean? '()) (boolean? #f)
             (boolean? #t)))
      (newline)
      (write (list #t #f #true #false '#t '#f '(#t #f)))
      (newline)
      (write (list (not #f) (not '()) (not 0) (not (not 'a))))
      (newline)
    expected: |
      (yes no yes yes yes yes yes)
      (#t #f #f #f #t #t)
      (#t #f #t #f #t #f (#t #f))
      (#t #f #f #t)
  - name: a-predicate-fuses-into-a-test-and-converts-as-a-value
    source: |
      (define (kind x)
        (cond ((pair? x) 'pair)
              ((null? x) 'null)
              ((and (number? x) (not (zero? x))) 'nonzero)
              ((or (string? x) (char? x)) 'text)
              (else 'other)))
      (write (map kind (list '(1) '() 5 0 "s" #\c 'q)))
      (newline)
      (write
       (list (pair? '(1)) (pair? 1) (and (pair? '(1)) (null? '()))
             (or (pair? 1) (null? 1))))
      (newline)
      (write (map pair? '((1) 2 ())))
      (newline)
      (write
       (list (and) (or) (and 1 2) (and 1 #f 2) (or #f 3) (or #f #f) (and 1 '())))
      (newline)
    expected: |
      (pair null nonzero other text text other)
      (#t #f #t #f)
      (#t #f #f)
      (#t #f 2 #f 3 #f ())
  - name: a-top-level-define-is-lexical-not-special
    source: |
      (define gx 1)
      (define (get-gx) gx)
      (write (let ((gx 2)) (get-gx)))
      (newline)
      (set! gx 5)
      (write (get-gx))
      (newline)
    expected: |
      1
      5
  - name: lisp-1-over-lisp-2
    source: |
      (define (twice f x) (f (f x)))
      (define (add1 x) (+ x 1))
      (write (twice add1 5))
      (newline)
      (write (twice (lambda (x) (* x x)) 3))
      (newline)
      (write (twice cdr '(1 2 3)))
      (newline)
      (define op add1)
      (write (op 1))
      (newline)
      (set! op (lambda (x) (* x 10)))
      (write (op 1))
      (newline)
      (define (compose f g) (lambda (x) (f (g x))))
      (write ((compose car cdr) '(1 2 3)))
      (newline)
      (write (map (lambda (p) (p 4)) (list add1 even? - (lambda (x) x))))
      (newline)
      (define redefined 1)
      (define (redefined) 'second)
      (write (redefined))
      (newline)
      (write (let ((list vector)) (list 1 2)))
      (newline)
    expected: |
      7
      81
      (3)
      2
      10
      2
      (5 #t -4 4)
      second
      #(1 2)
  - name: lambda-formals
    source: |
      (write ((lambda args args) 1 2 3))
      (newline)
      (write ((lambda (a . r) (list a r)) 1 2 3))
      (newline)
      (write ((lambda (a b) (list b a)) 1 2))
      (newline)
      (define (sum . xs) (apply + xs))
      (write (list (sum) (sum 1) (sum 1 2 3) (apply sum 1 2 '(3 4))))
      (newline)
    expected: |
      (1 2 3)
      (1 (2 3))
      (2 1)
      (0 1 6 10)
  - name: a-named-let-is-a-loop-a-million-iterations-deep
    source: |
      (define (count n)
        (let loop ((i 0) (acc 0)) (if (< i n) (loop (+ i 1) (+ acc i)) acc)))
      (write (count 1000000))
      (newline)
      (write (let loop ((i 0)) (cond ((= i 1000000) 'done) (else (loop (+ i 1))))))
      (newline)
    expected: |
      499999500000
      done
  - name: a-do-loop-and-a-self-tail-call-are-loops-too
    source: |
      (write (do ((i 0 (+ i 1)) (acc '() (cons i acc))) ((= i 5) acc)))
      (newline)
      (write (do ((i 0 (+ i 1)) (sum 0 (+ sum i))) ((= i 1000000) sum)))
      (newline)
      (define (down n acc) (if (= n 0) acc (down (- n 1) (+ acc 1))))
      (write (down 1000000 0))
      (newline)
      (define (gather n . acc) (if (= n 0) acc (gather (- n 1) n 'x)))
      (write (gather 3))
      (newline)
      (define (walk l)
        (define (inner l n)
          (cond ((null? l) n)
                ((pair? (car l)) (inner (cdr l) (+ n (walk (car l)))))
                (else (inner (cdr l) (+ n 1)))))
        (inner l 0))
      (write (walk '(1 (2 3) ((4)) 5)))
      (newline)
      (let ((v (make-vector 3 0)))
        (do ((i 0 (+ i 1))) ((= i 3))
          (vector-set! v i (* i i)))
        (write v)
        (newline))
    expected: |
      (4 3 2 1 0)
      499999500000
      1000000
      (1 x)
      5
      #(0 1 4)
  - name: a-loop-whose-body-closes-over-its-variables-rebinds-them-per-iteration
    source: |
      (define (thunks n)
        (let loop ((i 0) (acc '()))
          (if (= i n) (reverse acc) (loop (+ i 1) (cons (lambda () i) acc)))))
      (write (map (lambda (t) (t)) (thunks 4)))
      (newline)
      (write
       (map (lambda (t) (t))
        (do ((i 0 (+ i 1)) (acc '() (cons (lambda () (* i i)) acc))) ((= i 3) acc))))
      (newline)
      (define (adders n acc)
        (if (= n 0) acc (adders (- n 1) (cons (lambda (x) (+ x n)) acc))))
      (write (map (lambda (f) (f 10)) (adders 3 '())))
      (newline)
    expected: |
      (0 1 2 3)
      (4 1 0)
      (11 12 13)
  - name: a-jump-from-where-a-loop-variable-is-shadowed-assigns-the-loop-variable
    source: |
      (write
       (let fill ((path '(3 2 1)) (count 0))
         (if (null? path) count (let ((count (+ count 1))) (fill (cdr path) count)))))
      (newline)
      (write
       (let outer ((i 0) (acc '()))
         (if (= (length acc) 3)
             (list i (reverse acc))
             (let inner ((i 10) (n 0))
               (if (= n 2) (outer (+ i 1) (cons i acc)) (inner (+ i 1) (+ n 1)))))))
      (newline)
      (define (shadowed-self n total)
        (if (= n 0)
            total
            (let ((m (- n 1))) (let* ((total (+ total n))) (shadowed-self m total)))))
      (write (shadowed-self 4 0))
      (newline)
    expected: |
      3
      (13 (12 12 12))
      10
  - name: a-named-let-whose-name-escapes-is-a-procedure
    source: |
      (write (let fact ((n 10)) (if (= n 0) 1 (* n (fact (- n 1))))))
      (newline)
      (write
       (let walk ((t '(1 (2 (3 4)) 5)))
         (cond ((null? t) 0) ((pair? t) (+ (walk (car t)) (walk (cdr t)))) (else t))))
      (newline)
      (write
       (let loop ((l '(1 2 3)))
         (if (null? l) '() (cons (* 2 (car l)) (map (lambda (x) x) (loop (cdr l)))))))
      (newline)
      (define (fib n) (if (< n 2) n (+ (fib (- n 1)) (fib (- n 2)))))
      (write (fib 20))
      (newline)
    expected: |
      3628800
      15
      (2 4 6)
      6765
  - name: internal-defines-are-letrec-star
    source: |
      (define (idef x)
        (define a (* x 2))
        (define (even? n) (if (= n 0) #t (odd? (- n 1))))
        (define (odd? n) (if (= n 0) #f (even? (- n 1))))
        (define b (+ a 1))
        (list a b (even? a) (odd? a)))
      (write (idef 5))
      (newline)
      (write
       (letrec ((ev? (lambda (n) (if (= n 0) #t (od? (- n 1)))))
                (od? (lambda (n) (if (= n 0) #f (ev? (- n 1))))))
         (ev? 100)))
      (newline)
      (write (letrec* ((a 1) (b (+ a 1))) (list a b)))
      (newline)
      (write (let* ((x 1) (x (+ x 1)) (y (* x 10))) (list x y)))
      (newline)
      (write (let ((x 1)) (let ((x 2) (y x)) (list x y))))
      (newline)
      (write (let ((a 1) (b 2)) (let ((a b) (b a)) (list a b))))
      (newline)
      (write
       (let ((a 1) (b 2))
         (let swap ((a b) (b a) (n 0)) (if (= n 3) (list a b) (swap b a (+ n 1))))))
      (newline)
    expected: |
      (10 11 #t #f)
      #t
      (1 2)
      (2 20)
      (2 1)
      (2 1)
      (1 2)
  - name: derived-forms
    source: |
      (define (classify n)
        (case n
          ((1 2 3) 'small)
          ((10) 'ten)
          ((a b) 'letter)
          ((#\x) 'char)
          (else 'big)))
      (write (map classify (list 1 3 10 'a #\x 99 "s")))
      (newline)
      (write (case 5 ((1) 'one) (else => (lambda (k) (* k 2)))))
      (newline)
      (write (cond ((assv 2 '((1 . a) (2 . b))) => cdr) (else 'none)))
      (newline)
      (write (cond ((assv 9 '((1 . a))) => cdr) (#f 'no) ((+ 1 1)) (else 'none)))
      (newline)
      (write
       (list (when (> 1 0)
               'a
               'b) (unless (> 1 0) 'c) (when #f 'd)))
      (newline)
      (define counter 0)
      (begin
        (set! counter (+ counter 1))
        (set! counter (* counter 10)))
      (write counter)
      (newline)
      (define (shadow if) (or if 'fallback))
      (write (list (shadow #f) (shadow 1)))
      (newline)
    expected: |
      (small small ten letter char big big)
      10
      b
      2
      (b #!unspecific #!unspecific)
      10
      (fallback 1)
  - name: an-effect-answers-one-unspecified-object
    source: |
      (define (show x)
        (write x)
        (newline))
      (define u-vec (make-vector 1))
      (define u-var 0)
      (show
       (list (if #f #f) (vector-set! u-vec 0 1) (for-each car '()) (set! u-var 1)
             (display "")))
      (show (length (list (when #f 1) (cond (#f 1)) (case 1 ((2) 3)))))
      (show
       (list (symbol? (if #f #f)) (eq? (if #f #f) (newline))
             (if (if #f #f) 'true 'false)))
      (show (eq? (string->symbol "#!unspecific") (if #f #f)))
      (define (u-loop i) (if (< i 3) (u-loop (+ i 1))))
      (show
       (list (u-loop 0) (do ((i 0 (+ i 1))) ((= i 2)))
             (let loop ((i 0)) (when (< i 2) (loop (+ i 1))))))
      (show (map (lambda (x) (vector-fill! u-vec x)) '(1 2)))
    expected: |
      (#!unspecific #!unspecific #!unspecific #!unspecific #!unspecific)
      3

      (#f #t true)
      #f
      (#!unspecific #!unspecific #!unspecific)
      (#!unspecific #!unspecific)
  - name: quote-and-quasiquote
    source: |
      (write '(a (b . c) #(1 x "s") "str" #\a 1.5 1/2 ()))
      (newline)
      (define n 3)
      (write `(1 ,n ,(+ n 1) ,@(list 5 6) tail))
      (newline)
      (write `(a . ,n))
      (newline)
      (write `#(1 ,n ,@(list 4 5)))
      (newline)
      (write `(1 `(2 ,(3 ,n))))
      (newline)
      (write `(plain list))
      (newline)
      (write (quasiquote (x (unquote (* 2 n)))))
      (newline)
    expected: |
      (a (b . c) #(1 x "s") "str" #\a 1.5 1/2 ())
      (1 3 4 5 6 tail)
      (a . 3)
      #(1 3 4 5)
      (1 (quasiquote (2 (unquote (3 3)))))
      (plain list)
      (x 6)
  - name: call-cc-escapes-and-dynamic-wind-runs-the-exit-half
    source: |
      (write
       (+ 1
          (call/cc
           (lambda (k)
             (map (lambda (x) (if (> x 2) (k x) x)) '(1 2 3 4))
             99))))
      (newline)
      (write (call-with-current-continuation (lambda (k) 'no-escape)))
      (newline)
      (write
       (call/cc
        (lambda (k)
          (dynamic-wind (lambda () (display "in ")) (lambda () (k 'escaped))
                        (lambda () (display "out "))))))
      (newline)
      (write
       (dynamic-wind (lambda () (display "before ")) (lambda () 'normal)
                     (lambda () (display "after "))))
      (newline)
      (define (find-first pred l)
        (call/cc
         (lambda (return)
           (for-each (lambda (x) (if (pred x) (return x))) l)
           #f)))
      (write (list (find-first even? '(1 3 4 5)) (find-first even? '(1 3))))
      (newline)
      (call-with-values (lambda () (call/cc (lambda (k) (k 1 2))))
                        (lambda (a b)
                          (write (list a b))
                          (newline)))
    expected: |
      4
      no-escape
      in out escaped
      before after normal
      (4 #f)
      (1 2)
  - name: multiple-values
    source: |
      (define (split l)
        (let loop ((l l) (evens '()) (odds '()))
          (cond ((null? l) (values (reverse evens) (reverse odds)))
                ((even? (car l)) (loop (cdr l) (cons (car l) evens) odds))
                (else (loop (cdr l) evens (cons (car l) odds))))))
      (call-with-values (lambda () (split '(1 2 3 4 5)))
                        (lambda (e o)
                          (write (list e o))
                          (newline)))
      (write (call-with-values (lambda () (values 1 2 3)) list))
      (newline)
      (define (producer) (values 'a 'b))
      (write (call-with-values producer cons))
      (newline)
      (write (let-values (((a b) (values 1 2)) ((c) (values 3))) (list a b c)))
      (newline)
      (write
       (let-values (((a . rest) (values 1 2 3)) (all (values 4 5)))
         (list a rest all)))
      (newline)
      (write
       (let ((a 'outer)) (let-values (((a) (values 1)) ((b) (values a))) (list a b))))
      (newline)
      (write (let*-values (((a b) (values 1 2)) ((c) (values (+ a b)))) (list a b c)))
      (newline)
      (define-values (q r) (values (quotient 17 5) (remainder 17 5)))
      (write (list q r))
      (newline)
      (write (+ 1 (values 2)))
      (newline)
      ; No value is no value, a procedure whose tail is an argument's or a
      ; variable's answers one, and a loop returning several returns them.
      (write (call-with-values (lambda () (values)) list))
      (newline)
      (define (two) (values 5 6))
      (write (call-with-values (lambda () (list (two))) list))
      (newline)
      (write (call-with-values (lambda () (+ 1 (values 5 6))) list))
      (newline)
      (define (count-down n acc)
        (if (= n 0) (values acc 'done) (count-down (- n 1) (+ acc n))))
      (write (call-with-values (lambda () (count-down 3 0)) list))
      (newline)
      ; A loop that exits through a call answers every value of the call: a named
      ; let, a self loop, an inner loop storing into the outer one's destination, a
      ; call of no value, and an exit through a procedure variable.
      (define (first-even l)
        (let loop ((l l))
          (cond ((null? l) (two)) ((even? (car l)) (car l)) (else (loop (cdr l))))))
      (write (list (call-with-values (lambda () (first-even '(1 3))) list)
                   (call-with-values (lambda () (first-even '(1 4))) list)))
      (newline)
      (define (skip-odd l)
        (if (and (pair? l) (odd? (car l))) (skip-odd (cdr l)) (two)))
      (write (call-with-values (lambda () (skip-odd '(1 3))) list))
      (newline)
      (define (grid n)
        (let outer ((i 0))
          (if (= i n)
              (values)
              (let inner ((j 0))
                (cond ((= j i) (outer (+ i 1)))
                      ((= (* i j) 6) (values i j (* i j)))
                      (else (inner (+ j 1))))))))
      (write (list (call-with-values (lambda () (grid 5)) list)
                   (call-with-values (lambda () (grid 3)) list)))
      (newline)
      (define (nothing) (values))
      (define (find-or p l)
        (let loop ((l l))
          (cond ((null? l) (p)) ((symbol? (car l)) (car l)) (else (loop (cdr l))))))
      (write (list (call-with-values (lambda () (find-or nothing '(1 2))) list)
                   (call-with-values (lambda () (find-or two '(1 a))) list)
                   (call-with-values (lambda () (find-or two '(1 2))) list)))
      (newline)
      ; `values` used as a first-class procedure -- applied, through a variable, or
      ; inside `eval` -- answers every value on every backend.
      (write (call-with-values (lambda () (apply values '(1 2))) list))
      (newline)
      (define first-class-values values)
      (write (call-with-values (lambda () (first-class-values 1 2)) list))
      (newline)
      (write
       (call-with-values
        (lambda () (eval '(values 1 2) (interaction-environment)))
        list))
      (newline)
    expected: |
      ((2 4) (1 3 5))
      (1 2 3)
