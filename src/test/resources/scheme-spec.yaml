  # The current ports are parameter objects: parameterize binds the standard stream too,
  # restored on every exit channel.
  - name: parameterize-redirects-the-current-ports
    source: |
      (define cp-a (open-output-string))
      (define cp-b (open-output-string))
      (parameterize ((current-output-port cp-a))
        (display "a1 ")
        (parameterize ((current-output-port cp-b)) (display "b1 ") (write "b2" (current-output-port)))
        (display "a2 ")
        (guard (e (#t (display "caught ")))
          (parameterize ((current-output-port cp-b)) (display "b3 ") (raise 'x)))
        (display "a3"))
      (write (list (get-output-string cp-a) (get-output-string cp-b)))
      (newline)
      (write (list (eq? (current-output-port) (current-output-port)) (output-port? (current-output-port))
                   (input-port? (current-input-port)) (output-port? (current-error-port))))
      (newline)
      (define cp-in (open-input-string "(hello world) 42 rest"))
      (write (peek-char cp-in))
      (parameterize ((current-input-port cp-in))
        (write (list (read-char) (read) (read) (read-line))))
      (newline)
      (parameterize ((current-error-port (current-output-port)))
        (display "via the error port" (current-error-port))
        (newline (current-error-port)))
      (flush-output-port)
      (flush-output-port (current-output-port))
    expected: |
      ("a1 a2 caught a3" "b1 \"b2\"b3 ")
      (#t #t #t #t)
      #\((#\( hello world ") 42 rest")
      via the error port
