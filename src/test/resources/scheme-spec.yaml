  - name: parallel-execute-joins-every-thunk-and-a-serializer-over-test-and-set-is-exact
    source: |
      (define tas-cell (list false))
      (write (list (test-and-set! tas-cell) (test-and-set! tas-cell) (car tas-cell)))
      (newline)
      (define (make-sicp-mutex)
        (let ((cell (list false)))
          (define (the-mutex m)
            (cond ((eq? m 'acquire) (if (test-and-set! cell) (the-mutex 'acquire)))
                  ((eq? m 'release) (set-car! cell false))))
          the-mutex))
      (define (make-serializer)
        (let ((mutex (make-sicp-mutex)))
          (lambda (p)
            (define (serialized-p . args)
              (mutex 'acquire)
              (let ((val (apply p args)))
                (mutex 'release)
                val))
            serialized-p)))
      (define serialized-total 0)
      (define protect (make-serializer))
      (define (bump-times n)
        (lambda ()
          (do ((i 0 (+ i 1))) ((= i n))
            ((protect (lambda () (set! serialized-total (+ serialized-total 1))))))))
      (parallel-execute (bump-times 5000) (bump-times 5000) (bump-times 5000))
      (write serialized-total)
      (newline)
      (define joined '())
      (apply parallel-execute
             (map (lambda (k) (protect (lambda () (set! joined (cons k joined)))))
                  '(1 2 3 4)))
      (write (length joined))
      (newline)
    expected: |
      (#f #t #t)
      15000
      4
