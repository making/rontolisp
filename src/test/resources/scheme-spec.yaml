      (write (guard-loop 0 '()))
      (newline)
      (write (guard (e ((error-object? e) (list (error-object-message e) (error-object-irritants e))))
               (error "bad thing" 1 "two" 'three)))
      (newline)
      (write (let ((e (guard (e (#t e)) (error "only message"))))
               (list (error-object? e) (error-object-message e) (error-object-irritants e))))
      (newline)
      (write (list (error-object? 5) (error-object? 'x) (guard (e (#t (error-object? e))) (raise 'x))))
      (newline)
      (write (guard (e ((string? e) (list 'reraised-caught e)))
               (guard (e ((number? e) 'num)) (raise "s"))))
      (newline)
      (write (let ((first (guard (e (#t e)) (error "inner" 1))))
               (guard (e (#t (list (eq? e first) (error-object-message e)))) (raise first))))
      (newline)
      (write (guard (e ((error-object? e) 'built-in-caught)) (+ 1 (car (list 'a)))))
      (newline)
      (write (guard (e ((read-error? e) 'read) ((file-error? e) 'file) (else 'other)) (error "x")))
      (newline)
    expected: |
      (caught boom)
      (str "s")
      (42 (b . 23))
      (else 5)
      (outer not-a-number)
      [test]x
      no-raise
      2
      [in][out][handler]dw
      (0 10 2 30 4)
      ("bad thing" (1 "two" three))
      (#t "only message" ())
      (#f #f #f)
      (reraised-caught "s")
      (#t "inner")
      built-in-caught
      other
  - name: with-exception-handler-and-raise-continuable
    source: |
      (write (with-exception-handler (lambda (e) 42) (lambda () (+ (raise-continuable 'c) 1))))
      (newline)
      (write (call/cc (lambda (k)
                        (with-exception-handler (lambda (e) (k (list 'escaped e)))
                                                (lambda () (raise 'x))))))
      (newline)
      (write (call/cc (lambda (k)
                        (with-exception-handler (lambda (e) (k (error-object-message e)))
                                                (lambda () (error "from error" 1))))))
      (newline)
      (write (guard (e (#t (list 'g e)))
               (with-exception-handler (lambda (e) (raise (list 'wrapped e)))
                                       (lambda () (raise 'inner)))))
      (newline)
      (write (guard (e ((error-object? e) (list 'secondary (error-object-irritants e))))
               (with-exception-handler (lambda (e) 'returned) (lambda () (raise 'nc)))))
      (newline)
      (write (with-exception-handler
              (lambda (e) (* e 2))
              (lambda ()
                (with-exception-handler
                 (lambda (e) (+ (raise-continuable (+ e 1)) 100))
                 (lambda () (raise-continuable 5))))))
      (newline)
      (write (call/cc (lambda (k)
                        (with-exception-handler (lambda (e) (k (list 'arith (error-object? e))))
                                                (lambda () (+ 1 (car (list 'a))))))))
      (newline)
      (define weh-handler (lambda (e) (list 'first-class e)))
      (write (apply with-exception-handler (list weh-handler (lambda () (raise-continuable 7)))))
      (newline)
      (write (map (lambda (x) (guard (e (#t (list 'r e))) (if (odd? x) (raise x) x))) '(1 2 3)))
      (newline)
    expected: |
      43
      (escaped x)
      "from error"
      (g (wrapped inner))
      (secondary ())
      112
      (arith #t)
      (first-class 7)
      ((r 1) 2 (r 3))
  - name: guard-in-macros-and-raise-inside-eval
    source: |
      (define-syntax try-or
        (syntax-rules () ((_ body fallback) (guard (e (#t fallback)) body))))
      (write (let ((e 'user-e)) (try-or (raise 'x) e)))
      (newline)
      (define-syntax catching
        (syntax-rules () ((_ var body) (guard (var ((symbol? var) (list 'sym var))) body))))
      (write (catching c (raise 'y)))
      (newline)
      (write (guard (e (#t (list 'from-eval e))) (eval '(raise 9) (interaction-environment))))
      (newline)
      (write (eval '(with-exception-handler (lambda (e) (* e 3)) (lambda () (raise-continuable 4)))
                   (interaction-environment)))
      (newline)
    expected: |
      user-e
      (sym y)
      (from-eval 9)
      12
# An uncaught application of a non-procedure ends the program, so these cannot
# join the concatenated corpus above -- one program per case, per backend, like
# ci-spec.yaml's standalone: list (.todo/851). The dynamic-wind puts the wasm
# module in EH mode, where the report is printable at all.
standalone:
  - name: applying-false-reports-not-applicable
    source: |
      (dynamic-wind (lambda () #t)
                    (lambda () ((if #t #f car) 1))
                    (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: The object is not applicable: #f
    fails: true
  - name: applying-the-unspecified-object-reports-not-applicable
    source: |
      (define standalone-unspecified (if #f #f))
      (dynamic-wind (lambda () #t)
                    (lambda () ((if #t standalone-unspecified car) 1))
                    (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: The object is not applicable: #!unspecific
    fails: true
  - name: applying-a-number-reports-not-applicable
    source: |
      (define standalone-number 3)
      (dynamic-wind (lambda () #t)
                    (lambda () (standalone-number 1))
                    (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: The object is not applicable: 3
    fails: true
  # An uncaught raise reports its object as write spells it; an uncaught error its
  # message and irritants. A guard no clause of which is taken raises again after its
  # body is unwound, so a handler's value cannot resume a raise-continuable there (Gauche
  # prints 11): the stated deviation, a secondary error.
  - name: an-uncaught-raise-reports-the-object
    source: |
      (dynamic-wind (lambda () #t) (lambda () (raise (list 1 "a" 'b))) (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: (1 "a" b)
    fails: true
  - name: an-uncaught-error-reports-its-message-and-irritants
    source: |
      (dynamic-wind (lambda () #t) (lambda () (error "bad thing" 1 "two" 'three)) (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: bad thing 1 "two" three
    fails: true
  - name: a-guard-reraise-cannot-resume-a-raise-continuable
    source: |
      (display (with-exception-handler (lambda (e) 10)
                 (lambda () (guard (e ((string? e) 's)) (+ 1 (raise-continuable 'y))))))
    stdout: |
    stderr: |
      Unhandled condition: handler returned from non-continuable exception: y
    fails: true
  # --scheme-standard: a valid R7RS program means the same under both standards, and
  # strict R7RS keeps the sicp/r5rs names out of eval's reach too.
  - name: a-valid-r7rs-program-prints-the-same-under-both-standards
    standards: [rontolisp, r7rs]
    source: |
      (import (scheme base) (scheme write) (scheme eval) (scheme cxr))
      (define-record-type point (make-point x y) point? (x point-x) (y point-y set-point-y!))
      (define (norm1 p) (+ (abs (point-x p)) (abs (point-y p))))
      (define p (make-point 3 -4))
      (set-point-y! p -5)
      (define-values (q r) (values (floor-quotient 17 5) (floor-remainder 17 5)))
      (let loop ((i 0) (acc '()))
        (if (< i 3) (loop (+ i 1) (cons (square i) acc))
            (begin (write (reverse acc)) (newline))))
      (write (list (norm1 p) (point? p) q r (caddr '(1 2 3)) (exact (floor 2.5))))
      (newline)
      (write (eval '(let ((x 2)) (* x (+ x 1))) (environment '(scheme base))))
      (newline)
      (write (eof-object? (eof-object)))
      (newline)
    stdout: |
      (0 1 4)
      (8 #t 3 2 3 2)
      6
      #t
  - name: strict-r7rs-eval-reaches-no-sicp-procedure
    standards: [r7rs]
    source: |
      (import (scheme base) (scheme write) (scheme eval))
      (display (eval '(+ 1 2) (environment '(scheme base))))
      (newline)
      (display (eval '(1+ 1) (environment '(scheme base))))
    stdout: |
      3
    stderr: |
      Unhandled condition: Unbound variable: 1+
    fails: true
  - name: strict-r7rs-eval-knows-no-sicp-keyword
    standards: [r7rs]
    source: |
      (import (scheme base) (scheme write) (scheme eval))
      (display (car (eval '(cons-stream 1 2) (environment '(scheme base)))))
    stdout: |
    stderr: |
      Unhandled condition: Unbound variable: cons-stream
    fails: true
  # An argument R7RS makes an error is refused by name on every backend.
  - name: odd-of-a-non-integer-is-an-error
    source: |
      (dynamic-wind (lambda () #t)
                    (lambda () (display (odd? 3.0)) (newline) (odd? 1.5))
                    (lambda () #t))
    stdout: |
      #t
    stderr: |
      Unhandled condition: odd?: not an integer: 1.5
    fails: true
  - name: string-of-a-non-character-is-an-error
    source: |
      (dynamic-wind (lambda () #t)
                    (lambda () (display (string #\a)) (newline) (string #\a 1))
                    (lambda () #t))
    stdout: |
      a
    stderr: |
      Unhandled condition: string: not a character: 1
    fails: true
