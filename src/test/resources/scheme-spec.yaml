  # The refusals, each an error object; the messages are ours.
  - name: port-errors-are-error-objects
    source: |
      (define (pe-message thunk) (guard (e ((error-object? e) (error-object-message e))) (thunk)))
      (for-each
       (lambda (thunk) (write (pe-message thunk)) (newline))
       (list (lambda () (write-u8 1))
             (lambda () (read-u8))
             (lambda () (display 1 (open-input-string "")))
             (lambda () (read-char (open-output-string)))
             (lambda () (get-output-string (open-input-string "")))
             (lambda () (write-u8 256 (open-output-bytevector)))
             (lambda () (let ((p (open-output-string))) (close-port p) (write 1 p)))
             (lambda () (let ((p (open-input-string "abc"))) (close-input-port p) (read-line p)))
             (lambda () (close-input-port (open-output-string)))
             (lambda () (parameterize ((current-output-port 5)) 1))
             (lambda () (parameterize ((current-input-port (open-output-string))) 1))))
      (write (list (current-output-port) (open-input-bytevector (bytevector)) (open-output-bytevector) (current-input-port)))
      (newline)
    expected: |
      "write-u8: not a binary output port: #<textual-output-port>"
      "read-u8: not a binary input port: #<textual-input-port>"
      "display: not a textual output port: #<textual-input-port>"
      "read-char: not a textual input port: #<textual-output-port>"
      "get-output-string: not a string output port: #<textual-input-port>"
      "write-u8: not a byte: 256"
      "write: the port is closed: #<textual-output-port>"
      "read-line: the port is closed: #<textual-input-port>"
      "close-input-port: not an input port: #<textual-output-port>"
      "current-output-port: not a textual output port: 5"
      "current-input-port: not a textual input port: #<textual-output-port>"
      (#<textual-output-port> #<binary-input-port> #<binary-output-port> #<textual-input-port>)
  # (scheme file) (.todo/874). Every path is built at run time under a random prefix: a
  # literal one would be folded at compile time (.kb/read-load-streams.md), and two runs
  # of this corpus at once must not share a file. Gauche 0.9.15 -r7 output.
  - name: file-ports-write-then-read
    source: |
      (define fp-dir (string-append "/tmp/rontolisp-scheme-spec-" (number->string (random 1000000000)) "-"))
      (define fp-text (string-append fp-dir "text.txt"))
      (define fp-out (open-output-file fp-text))
      (write (list (port? fp-out) (output-port? fp-out) (textual-port? fp-out) (input-port? fp-out) (output-port-open? fp-out)))
      (newline)
      (write '(a "b" #\c 1.5) fp-out)
      (newline fp-out)
      (write-string "second line" fp-out)
      (write-char #\! fp-out)
      (close-port fp-out)
      (close-output-port fp-out)
      (write (list (output-port-open? fp-out) (file-exists? fp-text)))
      (newline)
      (define fp-in (open-input-file fp-text))
      (write (list (input-port? fp-in) (read fp-in) (read-char fp-in) (peek-char fp-in) (read-line fp-in) (eof-object? (read-char fp-in))))
      (close-input-port fp-in)
      (newline)
      (write (list (input-port-open? fp-in) (call-with-input-file fp-text read-line)))
      (newline)
      (write (call-with-output-file fp-text (lambda (p) (display "replaced" p) (output-port-open? p))))
      (write (call-with-input-file fp-text (lambda (p) (list (read-string 3 p) (read-string 100 p) (eof-object? (read-string 1 p))))))
      (newline)
      (delete-file fp-text)
      (write (file-exists? fp-text))
      (newline)
    expected: |
      (#t #t #t #f #t)
      (#f #t)
      (#t (a "b" #\c 1.5) #\newline #\s "second line!" #t)
      (#f "(a \"b\" #\\c 1.5)")
      #t("rep" "laced" #t)
      #f
  # The current port is the file's for the thunk and is restored, and the file closed, on
  # every way out. Gauche leaves the file open (and unflushed) on an escape, so it reads
  # #<eof> where this reads "x".
  - name: with-output-to-file-restores-the-current-port
    source: |
      (define fw-dir (string-append "/tmp/rontolisp-scheme-spec-" (number->string (random 1000000000)) "-"))
      (define fw-file (string-append fw-dir "with.txt"))
      (write (with-output-to-file fw-file (lambda () (display "to the file ") (write "q") (newline (current-output-port)) 'done)))
      (newline)
      (write (with-input-from-file fw-file (lambda () (list (read) (read) (read-char) (eof-object? (read-char))))))
      (newline)
      (display "standard output again")
      (newline)
      (write (call/cc (lambda (k) (with-output-to-file fw-file (lambda () (display "partial") (k 'escaped))))))
      (newline)
      (write (guard (e ((symbol? e) (list 'caught e))) (with-output-to-file fw-file (lambda () (display "x") (raise 'boom)))))
      (newline)
      (display "still standard output")
      (newline)
      (define fw-saved #f)
      (write (with-input-from-file fw-file (lambda () (set! fw-saved (current-input-port)) (read-line))))
      (write (input-port-open? fw-saved))
      (newline)
      (define (fw-values n) (if (= n 0) (with-input-from-file fw-file (lambda () (values (read-char) 2))) (fw-values (- n 1))))
      (write (call-with-values (lambda () (fw-values 3)) list))
      (newline)
      (delete-file fw-file)
    expected: |
      done
      (to the #\space #f)
      standard output again
      escaped
      (caught boom)
      still standard output
      "x"#f
      (#\x 2)
  # A file port is textual or binary, never both (Gauche's are both). After the EOF peek
  # Gauche's read-bytevector answers a bytevector; R7RS says the EOF object.
  - name: binary-file-ports
    source: |
      (define fb-file (string-append "/tmp/rontolisp-scheme-spec-" (number->string (random 1000000000)) "-bytes.bin"))
      (define fb-out (open-binary-output-file fb-file))
      (write (list (binary-port? fb-out) (textual-port? fb-out) (output-port? fb-out)))
      (newline)
      (write-u8 0 fb-out)
      (write-bytevector (bytevector 1 2 3 255) fb-out 1)
      (write-bytevector (string->utf8 "hé") fb-out)
      (close-port fb-out)
      (define fb-in (open-binary-input-file fb-file))
      (write (list (binary-port? fb-in) (peek-u8 fb-in) (read-u8 fb-in) (peek-u8 fb-in) (read-bytevector 2 fb-in) (u8-ready? fb-in)))
      (newline)
      (define fb-buf (make-bytevector 6 9))
      (write (list (read-bytevector! fb-buf fb-in 1) fb-buf (eof-object? (read-u8 fb-in)) (eof-object? (peek-u8 fb-in))
                   (eof-object? (read-bytevector 1 fb-in))))
      (newline)
      (write (read-bytevector! (make-bytevector 2 0) fb-in))
      (newline)
      (close-input-port fb-in)
      (delete-file fb-file)
    expected: |
      (#t #f #t)
      (#t 0 0 2 #u8(2 3) #t)
      (4 #u8(9 255 104 195 169 9) #t #t #t)
      #<eof>
  # A failed open or delete raises an error object file-error? answers #t for. Gauche
  # raises a plain error for an output file it cannot create; R7RS says a file error.
  - name: a-failed-open-is-a-file-error
    source: |
      (define (fe-kind thunk)
        (guard (e ((file-error? e) 'file-error) ((error-object? e) 'other-error) (#t 'not-an-error-object)) (thunk) 'no-error))
      (define fe-missing (string-append "/tmp/rontolisp-scheme-spec-" (number->string (random 1000000000)) "-missing/none.txt"))
      (for-each
       (lambda (thunk) (write (fe-kind thunk)) (newline))
       (list (lambda () (open-input-file fe-missing))
             (lambda () (open-binary-input-file fe-missing))
             (lambda () (open-output-file fe-missing))
             (lambda () (open-binary-output-file fe-missing))
             (lambda () (call-with-input-file fe-missing read))
             (lambda () (with-input-from-file fe-missing read))
             (lambda () (delete-file fe-missing))
             (lambda () (read-char (open-output-string)))
             (lambda () (raise 'not-a-file-error))))
      (write (list (file-exists? fe-missing) (file-exists? "/tmp")))
      (newline)
      (write (guard (e ((file-error? e) (list (error-object-message e) (equal? (error-object-irritants e) (list fe-missing)))))
               (open-input-file fe-missing)))
      (newline)
    expected: |
      file-error
      file-error
      file-error
      file-error
      file-error
      file-error
      file-error
      other-error
      not-an-error-object
      (#f #t)
      ("open-input-file: cannot open file:" #t)
  # (scheme char): the Unicode answers are the JDK's (the backends' char-upcase tables
  # come from it), laid out by generated range tables so all four backends agree. The
  # expected text is Gauche 0.9.15's, except where .kb/scheme-frontend.md, "(scheme
  # char)", says Gauche departs from Unicode (marked below).
  - name: char-library-classifies-and-converts-ascii
    source: |
      (write
       (list (char-alphabetic? #\a) (char-alphabetic? #\1) (char-numeric? #\7)
             (char-numeric? #\x) (char-whitespace? #\space) (char-whitespace? #\tab)
             (char-whitespace? #\newline) (char-whitespace? #\a) (char-upper-case? #\A)
             (char-upper-case? #\a) (char-lower-case? #\a) (char-lower-case? #\1)))
      (newline)
      (write
       (list (digit-value #\7) (digit-value #\a) (char-upcase #\a) (char-downcase #\A)
             (char-foldcase #\Q) (char-upcase #\1)))
      (newline)
      (write
       (list (char-ci=? #\a #\A) (char-ci=? #\a #\A #\b) (char-ci<? #\a #\B #\c)
             (char-ci>? #\c #\B) (char-ci<=? #\a #\A #\b) (char-ci>=? #\b #\B #\c)
             (char-ci<? #\Z #\a) (char-ci<? #\_ #\a)))
      (newline)
      (write
       (list (string-ci=? "Hello" "hELLO") (string-ci=? "a" "A" "b")
             (string-ci<? "apple" "BANANA") (string-ci>? "b" "A") (string-ci<=? "a" "A" "b")
             (string-ci>=? "b" "B" "a") (string-ci<? "_" "A")))
      (newline)
      (write
       (list (string-upcase "Hello, World") (string-downcase "Hello, World")
             (string-foldcase "Hello, World")))
      (newline)
      (if (char-upper-case? #\A) (display "fused") (display "not fused"))
      (newline)
    expected: |
      (#t #f #t #f #t #t #t #f #t #f #t #f)
      (7 #f #\A #\a #\q #\1)
      (#t #f #t #t #t #f #f #t)
      (#t #f #t #t #t #t #t)
      ("HELLO, WORLD" "hello, world" "hello, world")
      fused
  - name: char-library-follows-unicode
    source: |
      (write
       (list (char-alphabetic? (integer->char #x3BB)) (char-alphabetic? (integer->char #x3042))
             (char-alphabetic? (integer->char #x2160)) (char-alphabetic? (integer->char #x345))
             (char-numeric? (integer->char #x664)) (char-numeric? (integer->char #xFF11))
             (char-numeric? (integer->char #x2155)) (digit-value (integer->char #x664))
             (digit-value (integer->char #xFF11)) (digit-value (integer->char #x2155))
             (digit-value (integer->char #x1D7CE))))
      (newline)
      (write
       (list (char-whitespace? (integer->char #xA0)) (char-whitespace? (integer->char #x3000))
             (char-whitespace? (integer->char #x2028)) (char-whitespace? (integer->char #x1C))
             (char-whitespace? (integer->char #x200B))))
      (newline)
      (write
       (list (char-upper-case? (integer->char #x1C5)) (char-lower-case? (integer->char #x1C5))
             (char-lower-case? (integer->char #xAA)) (char-upper-case? (integer->char #x2160))
             (char-lower-case? (integer->char #xDF)) (char-upper-case? (integer->char #x2102))
             (char-upper-case? (integer->char #x1D400))))
      (newline)
      (write
       (map char->integer
            (list (char-upcase (integer->char #xDF)) (char-foldcase (integer->char #x3C2))
                  (char-downcase (integer->char #x3C2)) (char-foldcase (integer->char #x1E9E))
                  (char-foldcase (integer->char #x130)) (char-downcase (integer->char #x130))
                  (char-foldcase (integer->char #x1C5)) (char-foldcase (integer->char #xB5))
                  (char-upcase (integer->char #x1C5)) (char-foldcase (integer->char #x131)))))
      (newline)
      (write
       (list (string-upcase "straße") (string-foldcase "Straße") (string-downcase "ΧΑΟΣ")
             (string-downcase "ΧΑΟΣ Σ") (string-foldcase "ΧΑΟΣ") (string-upcase "ﬁx")
             (string-downcase "İ") (string-downcase "AΣ.") (string-downcase "AΣ'S")))
      (newline)
      (write
       (list (string-ci=? "Straße" "STRASSE") (char-ci=? (integer->char #x3C2) (integer->char #x3A3))
             (string-ci<? "straße" "STRASSF") (string-ci=? "ΧΑΟΣ" "χαος")))
      (newline)
      ;; Unicode, not Gauche: U+0131 has no case folding and U+1E9E's full folding is
      ;; "ss" (Gauche: "i̇i", "ß"); a Cherokee small letter folds to its capital
      ;; (Gauche's tables predate Unicode 8: 43888).
      (write
       (list (string-foldcase "İı") (string-foldcase (string (integer->char #x1E9E)))
             (char->integer (char-foldcase (integer->char #xAB70)))))
      (newline)
    expected: |
      (#t #t #t #t #t #t #f 4 1 #f 0)
      (#t #t #t #f #f)
      (#f #f #t #t #t #t #t)
      (223 963 962 223 304 105 454 956 452 305)
      ("STRASSE" "strasse" "χαος" "χαος σ" "χαοσ" "FIX" "i̇" "aς." "aσ's")
      (#t #t #t #t)
      ("i̇ı" "ss" 5024)
  - name: char-library-procedures-are-first-class-and-reach-eval
    source: |
      (write
       (list (map char-upcase (string->list "abc")) (apply char-ci=? (list #\a #\A))
             (apply string-ci<? '("a" "B" "c")) (map digit-value (string->list "0x9"))
             (map string-foldcase '("A" "ß")) (char-whitespace? #\x)))
      (newline)
      (write
       (eval '(list (string-upcase "eval") (char-ci=? #\e #\E) (digit-value #\5))
             (environment '(scheme base) '(scheme char))))
      (newline)
    expected: |
      ((#\A #\B #\C) #t #t (0 #f 9) ("a" "ss") #f)
      ("EVAL" #t 5)
  # R7RS 2.1: #!fold-case folds as string-foldcase does, in the file and on a port.
  # Gauche folds only ASCII there: it reads (straße #\space ΧΑΟΣ).
  - name: fold-case-directive-folds-as-string-foldcase
    source: |
      #!fold-case
      (define Straße 1)
      (write (list STRASSE strasse))
      #!no-fold-case
      (newline)
      (write (read (open-input-string "#!fold-case (Straße #\\SPACE ΧΑΟΣ)")))
      (newline)
    expected: |
      (1 1)
      (strasse #\space χαοσ)
  # R7RS 6.1 leaves eq? on numbers unspecified; here it is eqv? on every backend
  # (.kb/eq-numbers.md), so a flonum is eq? to itself however it was stored.
  - name: eq-on-numbers-is-eqv
    source: |
      (define eqn-n (length '(1 2)))
      (define eqn-x (* 1.5 eqn-n))
      (define eqn-pinf (- (log 0)))
      (write (list (eq? eqn-x eqn-x) (eq? eqn-pinf eqn-pinf) (eq? (/ 1 eqn-n) (/ 1 eqn-n))
                   (memq (* 1.5 eqn-n) (list 1 3.0)) (assq (/ 1 eqn-n) (list (cons 1/2 'half)))
                   (eq? 2.0 2)))
      (newline)
    expected: |
      (#t #t #t (3.0) (1/2 . half) #f)
# An uncaught application of a non-procedure ends the program, so these cannot
# join the concatenated corpus above -- one program per case, per backend, like
# ci-spec.yaml's standalone: list (.todo/851). The dynamic-wind puts the wasm
# module in EH mode, where the report is printable at all.
standalone:
  - name: applying-false-reports-not-applicable
    source: |
      (dynamic-wind (lambda () #t)
                    (lambda () ((if #t #f car) 1))
                    (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: The object is not applicable: #f
    fails: true
  - name: applying-the-unspecified-object-reports-not-applicable
    source: |
      (define standalone-unspecified (if #f #f))
      (dynamic-wind (lambda () #t)
                    (lambda () ((if #t standalone-unspecified car) 1))
                    (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: The object is not applicable: #!unspecific
    fails: true
  - name: applying-a-number-reports-not-applicable
    source: |
      (define standalone-number 3)
      (dynamic-wind (lambda () #t)
                    (lambda () (standalone-number 1))
                    (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: The object is not applicable: 3
    fails: true
  # An uncaught raise reports its object as write spells it; an uncaught error its
  # message and irritants. A guard no clause of which is taken raises again after its
  # body is unwound, so a handler's value cannot resume a raise-continuable there (Gauche
  # prints 11): the stated deviation, a secondary error.
  - name: an-uncaught-raise-reports-the-object
    source: |
      (dynamic-wind (lambda () #t) (lambda () (raise (list 1 "a" 'b))) (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: (1 "a" b)
    fails: true
  - name: an-uncaught-error-reports-its-message-and-irritants
    source: |
      (dynamic-wind (lambda () #t) (lambda () (error "bad thing" 1 "two" 'three)) (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: bad thing 1 "two" three
    fails: true
  - name: a-guard-reraise-cannot-resume-a-raise-continuable
    source: |
      (display (with-exception-handler (lambda (e) 10)
                 (lambda () (guard (e ((string? e) 's)) (+ 1 (raise-continuable 'y))))))
    stdout: |
    stderr: |
      Unhandled condition: handler returned from non-continuable exception: y
    fails: true
  # A parameter object takes no argument (Gauche's sets the value: R7RS leaves it an
  # error), and parameterize refuses what is not a parameter object by name.
  - name: a-parameter-object-takes-no-argument
    source: |
      (define standalone-parameter (make-parameter 1))
      (dynamic-wind (lambda () #t) (lambda () (standalone-parameter 5)) (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: a parameter object takes no argument: 5
    fails: true
  - name: parameterize-refuses-what-is-not-a-parameter-object
    source: |
      (dynamic-wind (lambda () #t) (lambda () (parameterize ((5 1)) 'body)) (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: parameterize: not a parameter object: 5
    fails: true
  # A count no case-lambda clause accepts, uncaught.
  - name: case-lambda-with-no-matching-clause-is-an-error
    source: |
      (define standalone-cl (case-lambda ((x) x) ((x y z) z)))
      (dynamic-wind (lambda () #t) (lambda () (display (standalone-cl 1)) (newline) (standalone-cl 1 2)) (lambda () #t))
    stdout: |
      1
    stderr: |
      Unhandled condition: wrong number of arguments to case-lambda: (1 2)
    fails: true
  # --scheme-standard: a valid R7RS program means the same under both standards, and
  # strict R7RS keeps the sicp/r5rs names out of eval's reach too.
  - name: a-valid-r7rs-program-prints-the-same-under-both-standards
    standards: [rontolisp, r7rs]
    source: |
      (import (scheme base) (scheme write) (scheme eval) (scheme cxr))
      (define-record-type point (make-point x y) point? (x point-x) (y point-y set-point-y!))
      (define (norm1 p) (+ (abs (point-x p)) (abs (point-y p))))
      (define p (make-point 3 -4))
      (set-point-y! p -5)
      (define-values (q r) (values (floor-quotient 17 5) (floor-remainder 17 5)))
      (let loop ((i 0) (acc '()))
        (if (< i 3) (loop (+ i 1) (cons (square i) acc))
            (begin (write (reverse acc)) (newline))))
      (write (list (norm1 p) (point? p) q r (caddr '(1 2 3)) (exact (floor 2.5))))
      (newline)
      (write (eval '(let ((x 2)) (* x (+ x 1))) (environment '(scheme base))))
      (newline)
      (write (eof-object? (eof-object)))
      (newline)
      (write (list (bytevector 1 2) (utf8->string (string->utf8 "ok")) (vector? #u8())))
      (newline)
    stdout: |
      (0 1 4)
      (8 #t 3 2 3 2)
      6
      #t
      (#u8(1 2) "ok" #f)
  - name: strict-r7rs-imports-case-lambda-from-its-own-library
    standards: [rontolisp, r7rs]
    source: |
      (import (scheme base) (scheme write) (only (scheme case-lambda) case-lambda))
      (define area (case-lambda ((r) (* 3 r r)) ((w h) (* w h))))
      (write (list (area 2) (area 2 5)))
      (newline)
    stdout: |
      (12 10)
  - name: strict-r7rs-imports-scheme-char
    standards: [rontolisp, r7rs]
    source: |
      (import (scheme base) (scheme write) (prefix (scheme char) c:))
      (write (list (c:char-upcase #\a) (c:string-foldcase "ABC") (c:char-ci=? #\a #\A)))
      (newline)
    stdout: |
      (#\A "abc" #t)
  - name: strict-r7rs-eval-reaches-no-sicp-procedure
    standards: [r7rs]
    source: |
      (import (scheme base) (scheme write) (scheme eval))
      (display (eval '(+ 1 2) (environment '(scheme base))))
      (newline)
      (display (eval '(1+ 1) (environment '(scheme base))))
    stdout: |
      3
    stderr: |
      Unhandled condition: Unbound variable: |1+|
    fails: true
  - name: strict-r7rs-eval-knows-no-sicp-keyword
    standards: [r7rs]
    source: |
      (import (scheme base) (scheme write) (scheme eval))
      (display (car (eval '(cons-stream 1 2) (environment '(scheme base)))))
    stdout: |
    stderr: |
      Unhandled condition: Unbound variable: cons-stream
    fails: true
  # An argument R7RS makes an error is refused by name on every backend.
  - name: odd-of-a-non-integer-is-an-error
    source: |
      (dynamic-wind (lambda () #t)
                    (lambda () (display (odd? 3.0)) (newline) (odd? 1.5))
                    (lambda () #t))
    stdout: |
      #t
    stderr: |
      Unhandled condition: odd?: not an integer: 1.5
    fails: true
  - name: string-of-a-non-character-is-an-error
    source: |
      (dynamic-wind (lambda () #t)
                    (lambda () (display (string #\a)) (newline) (string #\a 1))
                    (lambda () #t))
    stdout: |
      a
    stderr: |
      Unhandled condition: string: not a character: 1
    fails: true
  # A bytevector element is a byte: a constructor or a store of anything else is refused
  # by name (the underlying pack would mask it silently).
  - name: bytevector-of-a-non-byte-is-an-error
    source: |
      (dynamic-wind (lambda () #t)
                    (lambda () (write (bytevector 0 255)) (newline) (bytevector 1 256))
                    (lambda () #t))
    stdout: |
      #u8(0 255)
    stderr: |
      Unhandled condition: bytevector: not a byte: 256
    fails: true
  - name: bytevector-u8-set-of-a-non-byte-is-an-error
    source: |
      (define standalone-bv (make-bytevector 1 0))
      (dynamic-wind (lambda () #t)
                    (lambda () (bytevector-u8-set! standalone-bv 0 -1))
                    (lambda () #t))
    stdout: |
    stderr: |
      Unhandled condition: bytevector-u8-set!: not a byte: -1
    fails: true
  # A program that uses no port procedure keeps the reader's one stream-keyed pushback
  # cell (SchemeLibrary.PORTS_FEATURE); the corpus above uses ports, so this is where the
  # other variant of the reader runs on the compiled backends.
  - name: the-reader-without-ports-reads-standard-input
    stdin: |
      #!fold-case (ABC #\SPACE #u8(1 2)) ab
      rest of line
      last
    source: |
      (write (list (peek-char) (read) (read-char) (peek-char) (read-char) (read-line)))
      (newline)
      (write (list (read-line) (read-char) (read-line) (eof-object? (read))))
      (newline)
    stdout: |
      (#\# (abc #\space #u8(1 2)) #\space #\a #\a "b")
      ("rest of line" #\l "ast" #t)
  - name: writing-to-a-closed-port-is-an-error
    source: |
      (define standalone-port (open-output-string))
      (close-port standalone-port)
      (dynamic-wind (lambda () #t)
                    (lambda () (display "open: ") (write (output-port-open? standalone-port)) (newline)
                               (write 1 standalone-port))
                    (lambda () #t))
    stdout: |
      open: #f
    stderr: |
      Unhandled condition: write: the port is closed: #<textual-output-port>
    fails: true
  # A library stands before the program that imports it (Gauche -r7 accepts it there), so
  # these cannot join the concatenated corpus: its leading forms are the program's own.
  # Expected output Gauche 0.9.15's (gosh -r7 -I.).
  - name: libraries-in-the-program-file-keep-their-names-private
    standards: [rontolisp, r7rs]
    source: |
      (define-library (stack)
        (export make-stack stack? push! pop! (rename size stack-size) pushes)
        (import (scheme base))
        (begin
          (define-record-type stack (new-stack items) stack? (items items set-items!))
          (define pushes 0)
          (define (make-stack) (new-stack '()))
          (define (size s) (length (items s)))
          (define (push! s x) (set! pushes (+ pushes 1)) (set-items! s (cons x (items s))))
          (define (pop! s) (let ((x (car (items s)))) (set-items! s (cdr (items s))) x))))
      (define-library (stack util)
        (export push-all! drain)
        (import (scheme base) (stack))
        (begin
          (define (push-all! s xs) (for-each (lambda (x) (push! s x)) xs))
          (define (drain s) (if (= (stack-size s) 0) '() (let ((x (pop! s))) (cons x (drain s)))))))
      (import (scheme base) (scheme write) (stack) (only (stack util) push-all! drain))
      (define (size x) 'mine)
      (define s (make-stack))
      (push-all! s '(1 2 3))
      (write (list (stack-size s) (size s) pushes (stack? s) (stack? 5)))
      (newline)
      (write (map stack? (list s 's)))
      (newline)
      (write (drain s))
      (newline)
      (write (list (stack-size s) pushes))
      (newline)
    stdout: |
      (3 mine 3 #t #f)
      (#t #f)
      (3 2 1)
      (0 3)
  # A library's case-lambda export: the importer's direct calls pick the clauses.
  - name: a-library-exports-a-case-lambda-called-directly
    standards: [rontolisp, r7rs]
    source: |
      (define-library (range)
        (export range)
        (import (scheme base) (scheme case-lambda))
        (begin
          (define range
            (case-lambda
              ((e) (range 0 e))
              ((b e) (range b e 1))
              ((b e s) (if (>= b e) '() (cons b (range (+ b s) e s))))))))
      (import (scheme base) (scheme write) (range))
      (write (list (range 3) (range 2 4) (range 0 6 2) (apply range '(1 3)) (map range '(1 2))))
      (newline)
    stdout: |
      ((0 1 2) (2 3) (0 2 4) (1 2) ((0) (0 1)))
  # A library found as a .sld file beside the program, its body included from another
  # file, its declarations from a third; one library two others import runs once.
  - name: libraries-and-includes-read-from-files
    standards: [rontolisp, r7rs]
    files:
      shapes/area.sld: |
        (define-library (shapes area)
          (export area describe)
          (import (scheme base) (scheme write) (shapes common))
          (include "area-body.scm"))
      shapes/area-body.scm: |
        (define (area shape)
          (case (car shape)
            ((square) (sq (cadr shape)))
            ((rect) (* (cadr shape) (cadr (cdr shape))))
            (else 0)))
        (define (describe shape)
          (display (car shape))
          (display ": ")
          (display (area shape))
          (newline))
      shapes/common.sld: |
        (define-library (shapes common)
          (export sq)
          (import (scheme base) (scheme write))
          (include-library-declarations "common-decls.scm")
          (begin (display "common instantiated") (newline)))
      shapes/common-decls.scm: |
        (include-ci "common-body.scm")
      shapes/common-body.scm: |
        (DEFINE (SQ X) (* X X))
      shapes-list.scm: |
        (define shapes '((square 3) (rect 2 5) (circle 1)))
    source: |
      (import (scheme base) (scheme write) (prefix (shapes area) a:) (shapes common))
      (include "shapes-list.scm")
      (for-each a:describe shapes)
      (write (list (sq 4) (map a:area shapes)))
      (newline)
    stdout: |
      common instantiated
      square: 9
      rect: 10
      circle: 0
      (16 (9 10 0))
