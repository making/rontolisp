# The corpus of the EXPERIMENTAL Starlark front end (StarlarkSpecE2eTest): one case per
# decision of the lowering in .kb/starlark-frontend.md.
# Cases run IN ORDER, concatenated into one .star program per backend (they share its
# globals, so each case names its own), and the output is sliced back per case -- the
# ci-spec.yaml idea. Every case must print the same text on the interpreter, the JVM,
# wasm and the component.
