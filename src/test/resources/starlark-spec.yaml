  # A loop holds its iterable until it ends -- by running out, break or a return out of
  # nested loops -- and gives it back then: the list can be appended to afterwards.
  - name: a-loop-gives-its-iterable-back-on-every-exit
    source: |
      def loop_find(rows, want):
          for row in rows:
              for cell in row:
                  if cell == want:
                      return (row, cell)
          return None
      def loop_sum():
          total = 0
          for i in range(10):
              if i % 2 == 0:
                  continue
              if i > 7:
                  break
              total += i
          for a, (b, c) in [(1, (2, 3))]:
              total += a + b + c
          return [total, i]
      loop_rows = [[1, 2], [3, 4]]
      print(loop_find(loop_rows, 3), loop_find(loop_rows, 9))
      loop_rows.append([5])
      loop_rows[1].append(6)
      print(loop_rows, loop_sum(), [(i, j) for i in range(3) if i for j in range(i)])
      def loop_join(xs, s, n):
          for x in xs:
              if x == "skip":
                  continue
              if x == "stop":
                  break
              s += x
          for i in range(n):
              for j in range(2):
                  s = s + str(i)
          return s
      def loop_seen(xs):
          s = ""
          def peek():
              return s
          seen = []
          for x in xs:
              s += x
              seen.append(peek())
          return seen
      loop_text = ""
      def loop_peek():
          return loop_text
      loop_texts = []
      for x in ["a", "b"]:
          loop_text += x
          loop_texts.append(loop_peek())
      print(loop_join(["a", "skip", "b", "stop", "c"], "<", 2), len(loop_join([], "", 100)), loop_join([[1], [2]], [0], 0), loop_join([1, 2], 10, 0), loop_seen(["x", "y"]), loop_texts)
