      def call_note(tag, value, log):
          log.append(tag)
          return value
      def call_take(a, b = 0, *rest, c = 0, **more):
          return [a, b, rest, c, more]
      def call_orders():
          log = []
          print(sorted([3, 1, 2], reverse = call_note("r", False, log), key = call_note("k", None, log)), log)
          log = []
          print(call_take(call_note(1, 1, log), c = call_note(2, 2, log), *[call_note(3, 3, log)], **{"z": call_note(4, 4, log)}), log)
          log = []
          d = {}
          d[call_note("key", "k", log)] = call_note("value", 1, log)
          print(d, log)
          return log
      call_log = call_orders()
      def call_once(v, into = []):
          into.append(v)
          return into
      print(call_once(1), call_once(2), call_once(3, []))
      call_len = len
      call_push = call_log.append
      call_push("pushed")
      print(call_len("abc"), call_len, call_push, call_log, "{a}{}".format(*[1], **{"a": 2}), dict(pairs = 1))
