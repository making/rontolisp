# A case that is a program of its own, compiled and run alone, per backend. One with an
# `error` ENDS: it prints stdout, then an uncaught error takes the process down, and every
# backend must report the same error text. One with `files` is read from a directory
# holding them, its source as the `entry` file (main.star when absent).
standalone:
  # The prototype's divergence: a struct accessor handed another struct was two different
  # texts on the interpreter and the JVM and a trap on wasm. Every helper tests first.
  - name: a-method-of-another-type-is-refused-by-name
    source: |
      print("before")
      (1, 2).append(3)
      print("after")
    stdout: |
      before
    error: tuple has no .append field or method
  - name: a-list-is-not-mutated-while-a-loop-runs-over-it
    source: |
      xs = [1, 2]
      for x in xs:
          print(x)
          xs.append(x)
    stdout: |
      1
    error: cannot append to list during iteration
  - name: a-call-that-does-not-fit-is-refused-by-the-binder
    source: |
      def f(a, b):
          return a
      print(f(1, 2))
      print(len(1, 2))
    stdout: |
      1
    error: len accepts at most 1 positional argument (2 given)
  # A loop over range counts with no range made, and refuses what range refuses.
  - name: a-counting-loop-refuses-the-step-range-refuses
    source: |
      def count(stop, step):
          for i in range(1, stop, step):
              print(i)
      count(4, 2)
      count(4, 0)
    stdout: |
      1
      3
    error: "range: step argument must not be zero"
  # A top-level def is entered directly from anywhere, but a call above it reads the
  # global the def statement assigns, which is not assigned yet.
  - name: a-call-above-its-def-is-a-read-before-the-assignment
    source: |
      print("before")
      print(early(1))
      def early(n):
          return n
    stdout: |
      before
    error: global variable early referenced before assignment
  # --starlark-standard spec: a call while a call of the same declaration runs; one
  # after another is no recursion.
  - name: the-spec-standard-refuses-recursion
    standard: spec
    source: |
      def fact(n):
          return 1 if n <= 1 else n * fact(n - 1)
      def twice(f, x):
          return f(f(x))
      def inc(x):
          return x + 1
      print(twice(inc, 1), fact(1))
      print(fact(3))
    stdout: |
      3 1
    error: function fact called recursively
  # load: a module runs once however many files load it, where the first load stands;
  # its globals are its own (three files define helper, and under spec each def has a
  # flag of its own file); a name starting with an underscore and a name it loaded
  # itself stay inside; a def above the load statement calls what it binds. When a file
  # has run, the lists and dicts made meanwhile are frozen: a frozen list is a dict key,
  # a list a module's function makes later is the caller's, and a default value made
  # while the module ran refuses mutation.
  - name: a-module-runs-once-with-globals-of-its-own-and-is-frozen
    standard: spec
    files:
      lib/words.star: |
        load("tags.star", "tag")
        print("words runs")
        COUNT = 2
        _seen = ["start"]
        seen = _seen
        def helper(x):
            return tag(x.upper())
        def shout(x):
            return helper(x) * COUNT
        def fresh():
            return [1, 2]
        def remember(x, into = _seen):
            into.append(x)
            return into
      lib/more.star: |
        load("../lib/tags.star", "tag")
        print("more runs")
        def helper(x):
            return tag(x.lower())
        def whisper(x):
            return helper(x)
      lib/tags.star: |
        print("tags runs")
        def tag(s):
            return "<" + s + ">"
    source: |
      def helper(x):
          return "main " + shout(x)
      load("lib/words.star", "shout", count = "COUNT", "fresh", "seen", "remember")
      load("lib/more.star", "whisper")
      print(helper("a"), whisper("B"), count, seen, type(shout))
      own = fresh()
      own.append(3)
      keys = {seen: "a frozen list is a key"}
      print(own, keys[seen], remember(1, []))
      remember(2)
    stdout: |
      tags runs
      words runs
      more runs
      main <A><A> <b> 2 ["start"] function
      [1, 2, 3] a frozen list is a key [1]
    error: cannot append to frozen list
  # A set made while a module ran is frozen as a list is: read, never written.
  - name: a-set-made-while-a-module-ran-is-frozen
    files:
      marks.star: |
        marks = set(["m"])
    source: |
      load("marks.star", "marks")
      print(marks, "m" in marks, marks | set(["n"]))
      marks.add("n")
    stdout: |
      set(["m"]) True set(["m", "n"])
    error: cannot insert into frozen set
  # Across languages nothing is converted. A Common Lisp file loads Starlark files: their
  # globals are its variables, and rontolisp:starlark-call calls a def, a built-in or a
  # method value with positional arguments. A Starlark file loads the functions of a
  # Common Lisp package -- load("@package", name = "symbol") -- and calls them, or a
  # function it is handed, the same way. A module two files lowered apart load runs once.
  # A call that ends in an error some handler takes gives back the loop it left counted
  # and, under spec, the declaration it left active; the file's own values are frozen,
  # and an augmented assignment to a frozen dict's item is refused as a plain one is.
  - name: common-lisp-and-starlark-call-each-other
    standard: spec
    entry: main.lisp
    files:
      rules.star: |
        load("@cl-user", "emit", twice = "|twice|")
        load("@cl", "gcd", cl_list = "list")
        load("common.star", "tag")
        targets = []
        def target(name, deps = []):
            targets.append(name)
            return emit(name, cl_list(*deps))
        def describe(*names, sep = ", "):
            return sep.join(names)
        def each(xs, f):
            return [f(x) for x in xs]
        def kinds(*xs):
            return [type(x) for x in xs]
        def fail_at(xs, bad):
            for x in xs:
                if x == bad:
                    fail("stopped at", x)
            xs.append(bad)
            return xs
        def joined(xs):
            s = ""
            for x in xs:
                s += x
            return s
        mixed = ["a", 1]
        counts = {"a": 1}
        def bump(d, k):
            d[k] += 1
            return d
        def counted():
            return {"a": 1}
        text = str
        print(target("a"), target("b", ["a"]), gcd(12, 18), twice(21), emit, each([1, 2], twice), tag("r"))
      sub/more.star: |
        load("../common.star", "tag")
        def tagged(x):
            return tag(x)
      common.star: |
        print("common runs")
        def tag(s):
            return "<" + s + ">"
    source: |
      (defun emit (name deps) (format t "emit ~a ~s~%" name deps) (length deps))
      (defun |twice| (x) (* 2 x))
      (defun show (x) (format t "~a~%" (rontolisp:starlark-call |text| x)))
      (load "rules.star")
      (load "sub/more.star")
      (show (rontolisp:starlark-call |describe| "x" (rontolisp:starlark-call |tagged| "m")))
      (show (rontolisp:starlark-call |kinds| :none t nil 1 2.5d0 "s" #'car '(1 2)))
      (let ((xs (rontolisp:starlark-call |each| |targets| #'string-upcase)))
        (show (handler-case (rontolisp:starlark-call |fail_at| xs "B") (error (e) (princ-to-string e))))
        (show (rontolisp:starlark-call |fail_at| xs "none")))
      (show (handler-case (rontolisp:starlark-call |target| "c") (error (e) (princ-to-string e))))
      (show (handler-case (rontolisp:starlark-call |joined| |mixed|) (error (e) (princ-to-string e))))
      (show (rontolisp:starlark-call |bump| (rontolisp:starlark-call |counted|) "a"))
      (dolist (d (list |counts| (rontolisp:starlark-call |counted|)))
        (show (handler-case (rontolisp:starlark-call |bump| d "b") (error (e) (princ-to-string e)))))
      (show (handler-case (rontolisp:starlark-call |bump| |counts| "a") (error (e) (princ-to-string e))))
    stdout: |
      common runs
      emit a NIL
      emit b ("a")
      0 1 6 42 <built-in function cl-user:emit> [2, 4] <r>
      x, <m>
      ["NoneType", "bool", "bool", "int", "float", "string", "builtin_function_or_method", "unknown"]
      fail: stopped at B
      ["A", "B", "none"]
      cannot append to frozen list
      unknown binary op: string + int
      {"a": 2}
      key "b" not found in dictionary
      key "b" not found in dictionary
      cannot insert into frozen dict
