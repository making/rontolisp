  # What the lowering knows answers as the generic helpers do. An operator over operands
  # that may be ints is the integer one behind a test of them, over known ints the
  # integer one alone (a variable every binding of which is an int, past a machine word
  # too); a loop over range counts, whatever the step, and its variable is the body's to
  # assign; a known int or Boolean is its own truth. A def is entered directly with its
  # defaults and names bound while lowering, a default being the one value the binder
  # hands out too; a tuple of targets takes a tuple of values with none made; a list,
  # tuple or dict of constants is made anew from quoted data each time; insert, pop and
  # remove move a list's elements in place. sorted of ints or of strings is the backend's
  # own sort where it has one (the greatest first or the smallest, items of one key in
  # their order; strings that share more than their first seven bytes, ints past 64
  # bits), as split by a separator and join are, and extend moves its elements as one
  # block; str of a known int and a template's %d, %i and {} of one are its decimal text
  # (an int at either end of the fixnum range and past it, pieces of several bytes, more
  # than four pieces); an augmented assignment to a dict's item reads and stores through
  # the item's cell, and a dict comprehension stores a key written twice once. count is
  # the backend's own walk where it has one, find and the affixes its search (a string
  # of one-byte characters, one of several, one never counted; each bound), strip reads
  # codes, upper and lower of one-byte characters move the bytes, a split's short piece
  # is made with its bytes in hand and a long one copied, pop() empties a list, and get
  # and a store reach the table for an int or a string key.
