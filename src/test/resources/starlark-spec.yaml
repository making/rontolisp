      def scope_early(n):
          return n + 1
      scope_x = 1
      def scope_shadow():
          scope_x = 2
          def inner():
              return scope_x
          scope_x = 3
          return inner()
      print(scope_shadow(), scope_x, [scope_x for scope_x in [9]], [scope_x for scope_x in range(scope_x + 2)], scope_x)
      scope_fs = []
      for scope_i in range(3):
          scope_fs.append(lambda: scope_i)
      print([f() for f in scope_fs], [g() for g in [lambda: v for v in range(3)]])
      def scope_mutual():
          def even(n):
              return True if n == 0 else odd(n - 1)
          def odd(n):
              return False if n == 0 else even(n - 1)
          return even(10)
      T = "an identifier without a lowercase letter"
