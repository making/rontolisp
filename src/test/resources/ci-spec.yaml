        (print (coerce #f(1 2 3) 'list))
        (print (typecase #f(1 2 3) (array 'arr) (t 'no)))
        (let ((w (make-array 1 :element-type 'single-float)))
          (setf (aref w 0) 0.1)
          (print (= (aref w 0) 0.1))
          (print w)
          (print (aref w 0)))
        (print (vec:add #f(1 2 3) #f(4 5 6)))
        (print (vec:arange 4 :element-type 'single-float))
        (print (vec:dot #f(1 2 3) #f(1 2 3)))
        (print (vec:sum #f(2 4 6))))
