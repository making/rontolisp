  - name: clos-defclass-slots-inheritance-and-dispatch
    source: |
      (defclass clos-animal () ((name :initarg :name :accessor clos-animal-name)))
      (defclass clos-dog (clos-animal) ((breed :initarg :breed :initform "mixed" :reader clos-dog-breed)))
      (defgeneric clos-speak (x))
      (defmethod clos-speak ((x clos-dog)) "woof")
      (defmethod clos-speak ((x clos-animal)) "...")
      (defmethod clos-speak ((x integer)) "number")
      (defmethod clos-speak (x) "?")
      (setq clos-d (make-instance 'clos-dog :name "Rex"))
      (print (list (clos-speak clos-d) (clos-speak (make-instance 'clos-animal :name "A")) (clos-speak 1) (clos-speak "s")))
      (print (list (clos-animal-name clos-d) (clos-dog-breed clos-d) (slot-value clos-d 'name)))
      (setf (clos-animal-name clos-d) "Max")
      (setf (slot-value clos-d 'name) (concatenate 'string (slot-value clos-d 'name) "!"))
      (print (clos-animal-name clos-d))
    expected: |
      ("woof" "..." "number" "?")
      ("Rex" "mixed" "Rex")
      "Max!"
  - name: clos-method-qualifiers-and-call-next-method
    source: |
      (defclass clos-mc-animal () ())
      (defclass clos-mc-dog (clos-mc-animal) ())
      (defparameter *clos-mc-log* nil)
      (defgeneric clos-mc-touch (x))
      (defmethod clos-mc-touch ((x clos-mc-animal)) (push :primary-animal *clos-mc-log*) :done)
      (defmethod clos-mc-touch ((x clos-mc-dog)) (push :primary-dog *clos-mc-log*) (call-next-method))
      (defmethod clos-mc-touch :before ((x clos-mc-animal)) (push :before-animal *clos-mc-log*))
      (defmethod clos-mc-touch :before ((x clos-mc-dog)) (push :before-dog *clos-mc-log*))
      (defmethod clos-mc-touch :after ((x clos-mc-animal)) (push :after-animal *clos-mc-log*))
      (defmethod clos-mc-touch :after ((x clos-mc-dog)) (push :after-dog *clos-mc-log*))
      (defmethod clos-mc-touch :around ((x clos-mc-animal)) (list :around (call-next-method) (next-method-p)))
      (print (clos-mc-touch (make-instance 'clos-mc-dog)))
      (print (reverse *clos-mc-log*))
    expected: |
      (:around :done t)
      (:before-dog :before-animal :primary-dog :primary-animal :after-animal :after-dog)
  - name: binary-file-round-trip-with-read-byte-write-byte
