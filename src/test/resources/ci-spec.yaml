    # embedded readers signal on #., a permanent limit -- read-load-streams.md).
    source: |
      #.`(eval-when (:compile-toplevel :load-toplevel :execute)
           ,@(loop for i from 0
                   for state in '(ci-sd-alpha ci-sd-beta ci-sd-gamma)
                   collect `(defconstant ,(intern (format nil "+~A+" state)) ,i)))
      (print +ci-sd-beta+)
      (print +ci-sd-gamma+)
      (print (list :stamp #.(* 7 6)))
    expected: |
      1
      2
      (:STAMP 42)
