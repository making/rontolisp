  - name: read-all-decodes-an-octet-chunk-stream
    # Every HTTP body stream (a fetched reply's :body, a served request's
    # :raw-body) answers OCTET chunks -- what makes a relayed body byte-exact --
    # and read-all is where the bytes become text: the chunks are joined once
    # and UTF-8 decoded once, so a code point a chunk boundary splits (the
    # three bytes of あ below straddle two chunks) decodes whole, and a byte
    # that leads no sequence (#xFF) is its own character, the lenient rule the
    # request decoder applies. stream-read answers the vector itself. A stream
    # mixing string and octet chunks is refused rather than guessed at.
    #
    # Both halves of the decoder are here: the FIRST body has a #xFF in it, so
    # it is the per-byte loop that answers it, while the second is valid UTF-8
    # (a 4-byte code point straddling the chunk boundary) and so takes the
    # native strict decoder -- one copy, no walk. %octets-to-string-strict is
    # that decoder on its own: the string when the bytes are UTF-8, nil when
    # they are not, which is how the loop learns it has work to do.
    source: |
      (defvar *ci-octet-chunks*
        (list (make-array 1 :element-type '(unsigned-byte 8) :initial-contents '(#x41))
              (make-array 2 :element-type '(unsigned-byte 8) :initial-contents '(#xE3 #x81))
              (make-array 3 :element-type '(unsigned-byte 8) :initial-contents '(#x82 #xFF #x42))))
      (defun ci-octet-next ()
        (if *ci-octet-chunks*
            (let ((c (car *ci-octet-chunks*)))
              (setq *ci-octet-chunks* (cdr *ci-octet-chunks*))
              c)
            nil))
      (defvar *ci-octet-stream* (rontolisp::%stream-new #'ci-octet-next (lambda () nil)))
      (print (map 'list #'identity (rontolisp:await (rontolisp:stream-read *ci-octet-stream*))))
      (print (map 'list #'char-code (rontolisp:await (rontolisp:read-all *ci-octet-stream*))))
      (setq *ci-octet-chunks*
            (list "text" (make-array 1 :element-type '(unsigned-byte 8) :initial-contents '(65))))
      (print (handler-case
                 (rontolisp:await (rontolisp:read-all
                                   (rontolisp::%stream-new #'ci-octet-next (lambda () nil))))
               (error () :mixed-refused)))
      (setq *ci-octet-chunks*
            (list (make-array 2 :element-type '(unsigned-byte 8) :initial-contents '(#x41 #xF0))
                  (make-array 3 :element-type '(unsigned-byte 8) :initial-contents '(#x9F #x98 #x80))))
      (print (map 'list #'char-code
                  (rontolisp:await (rontolisp:read-all
                                    (rontolisp::%stream-new #'ci-octet-next (lambda () nil))))))
      (print (list (rontolisp::%octets-to-string-strict
                    (make-array 2 :element-type '(unsigned-byte 8) :initial-contents '(#x68 #x69)))
                   (rontolisp::%octets-to-string-strict
                    (make-array 1 :element-type '(unsigned-byte 8) :initial-contents '(#xFF)))))
    expected: |
      (65)
      (12354 255 66)
      :MIXED-REFUSED
      (65 128512)
      ("hi" NIL)
  - name: stream-new-builds-a-pull-stream-on-every-backend
    # rontolisp::%stream-new is the ONE producer of a stream value that every
    # backend has, and it takes exactly what a stream IS: a read thunk, a close
    # thunk and a drained flag. Nothing is buffered -- read-all pulls chunk by
    # chunk, the close protocol runs exactly once at end of stream, and a read
    # past the end is nil. The four representations differ (a pull-mode
    # LispStream, the JVM's Object[3] with the thunk pair where the queue would
    # be, TYPE_P1_STREAM, TYPE_WASI_STREAM) and the answers must not -- which
    # covers the CONS-shaped predicates (the JVM's Object[3] is an Object[] like
    # a cons cell is, and nothing excluded it there) and the SYNCHRONOUS resolve
    # (%future-force, legal where await is not: an asyncMode module that binds no
    # async-calling interface has no scheduler to block on and nothing in it can
    # suspend, so forcing is polling there, exactly as on the Preview 1 tier).
    source: |
      (defvar *ci-stream-chunks* '("ab" "cd"))
      (defvar *ci-stream-closes* 0)
      (defun ci-stream-next ()
        (if *ci-stream-chunks*
            (let ((c (car *ci-stream-chunks*)))
              (setq *ci-stream-chunks* (cdr *ci-stream-chunks*))
              c)
            nil))
      (defvar *ci-stream* (rontolisp::%stream-new
                            #'ci-stream-next
                            (lambda () (setq *ci-stream-closes* (+ *ci-stream-closes* 1)) nil)))
      (print (rontolisp:streamp *ci-stream*))
      (print (rontolisp:streamp 42))
      (print (consp *ci-stream*))
      (print (listp *ci-stream*))
      (print (atom *ci-stream*))
      (print *ci-stream*)
      (print (rontolisp::%future-force (rontolisp:stream-read *ci-stream*)))
      (print (rontolisp:await (rontolisp:read-all *ci-stream*)))
      (print *ci-stream-closes*)
      (print (rontolisp:await (rontolisp:stream-read *ci-stream*)))
      (rontolisp:stream-close *ci-stream*)
      (print *ci-stream-closes*)
    expected: |
      T
      NIL
      NIL
      NIL
      T
      #<STREAM>
      "ab"
      "cd"
      1
      NIL
      1
