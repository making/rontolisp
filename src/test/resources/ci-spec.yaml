  - name: double-arithmetic-unboxed-and-fused
    source: |
      (let ((dbl-x 3.0d0) (dbl-y 2.0d0) (dbl-z 1.0d0))
        (print (+ (* 2.0d0 dbl-x dbl-y) dbl-z))
        (print (- (* dbl-x dbl-y) dbl-z))
        (print (+ (- dbl-x dbl-y) dbl-z))
        (print (> (+ (* dbl-x dbl-x) (* dbl-y dbl-y)) 4.0d0)))
      (print (* 3 1.5d0))
      (print (+ 1/2 1.0d0))
      (print (+ -0.0d0 0.0d0))
      (let ((dbl-nan (/ 0.0d0 0.0d0)))
        (print (list (> dbl-nan 4.0d0) (< dbl-nan 4.0d0) (= dbl-nan dbl-nan))))
      (let ((dbl-a 5) (dbl-b 2) (dbl-c 1.5d0))
        (print (+ (- dbl-a dbl-b) dbl-c)))
      (let ((dbl-acc 0.0d0))
        (dotimes (i 3) (setq dbl-acc (+ dbl-acc 1.5d0)))
        (print dbl-acc))
      (let ((dbl-p 7.5d0) (dbl-q -7.5d0))
        (print (list (mod dbl-p 2) (mod dbl-q 2) (rem dbl-p 2) (rem dbl-q 2))))
    expected: |
      13.0
      5.0
      2.0
      T
      4.5
      1.5
      0.0
      (NIL NIL NIL)
      4.5
      4.5
      (1.5 0.5 1.5 -1.5)

  - name: declared-float-scalars-answer-what-undeclared-code-answers
    source: |
      (defun dclf-declared (a b)
        (declare (type double-float a b))
        (let ((acc 0.0d0) (tmp 0.0d0))
          (declare (type double-float acc tmp))
          (dotimes (i 4)
            (setq tmp (* a b))
            (setq acc (+ acc tmp (- a b) (/ a b))))
          acc))
      (defun dclf-undeclared (a b)
        (let ((acc 0.0d0) (tmp 0.0d0))
          (dotimes (i 4)
            (setq tmp (* a b))
            (setq acc (+ acc tmp (- a b) (/ a b))))
          acc))
      (print (dclf-declared 3.5d0 -1.25d0))
      (print (= (dclf-declared 3.5d0 -1.25d0) (dclf-undeclared 3.5d0 -1.25d0)))
      (let ((dclf-nan (/ 0.0d0 0.0d0)))
        (declare (type double-float dclf-nan))
        (print (list (> dclf-nan 4.0d0) (< dclf-nan 4.0d0) (= dclf-nan dclf-nan))))
      (let ((dclf-x 1.5d0))
        (declare (type double-float dclf-x))
        (print (+ dclf-x 1/2))
        (print (* dclf-x 4))
        (print (mod dclf-x 1.0d0)))
      (defun dclf-capture (x)
        (declare (type double-float x))
        (let ((s x))
          (declare (type double-float s))
          (let ((fn (lambda () s)))
            (setq s (+ s 1.0d0))
            (funcall fn))))
      (print (dclf-capture 2.0d0))
      (let* ((dclf-p 1.5d0) (dclf-q (+ dclf-p 1.0d0)))
        (declare (type double-float dclf-p dclf-q))
        (print (+ dclf-p dclf-q)))
    expected: |
      -9.7
      T
      (NIL NIL NIL)
      2.0
      6.0
      0.5
      3.0
      4.0

