  - name: future-as-value-combinators-then-catch-finally-success
    # Exercises then / then* / catch / finally on their SUCCESS channels across
    # every backend byte-identically. The catch / finally error channels are
    # covered by the unit tests (AsyncEvalTest / JvmAsyncCompilerTest /
    # WasmLispCompilerIntegrationTest#componentCatch* /
    # componentFinallyRunsOnBothPathsAndPreservesOutcome): Preview 1's
    # degenerate synchronous async surface signals an errored body AT THE
    # CALL rather than at await (see .kb/async-await.md), so an error-path
    # combinator call top-level here would trap the concatenated program on
    # the P1 backend before any handler could intercept it.
    source: |
      (rontolisp:async-defun ci-comb-produce (v) v)
      (print (rontolisp:await
               (rontolisp:then (ci-comb-produce 21) (lambda (v) (* v 2)))))
      (print (rontolisp:await
               (rontolisp:then* (ci-comb-produce 40) #'1+ #'1+)))
      (print (rontolisp:await
               (rontolisp:catch (ci-comb-produce 99)
                                (lambda (c) (declare (ignore c)) :ci-passthrough))))
      (setq ci-comb-log nil)
      (print (rontolisp:await
               (rontolisp:finally (ci-comb-produce 5)
                                  (lambda () (push :ci-cleanup ci-comb-log)))))
      (print (reverse ci-comb-log))
    expected: |
      42
      42
      99
      5
      (:CI-CLEANUP)
