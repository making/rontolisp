  - name: fused-random-and-aref-leaves
    source: |
      (let ((fral-a (make-array 6)))
        (dotimes (fral-i 6) (setf (aref fral-a fral-i) (* fral-i 11)))
        (let ((fral-s 0))
          (dotimes (fral-i 6) (setq fral-s (+ fral-s (aref fral-a fral-i))))
          (print fral-s))
        (print (+ (aref fral-a 5) (aref fral-a (random 1))))
        (print (+ (aref fral-a (random 1)) 100)))
      (print (+ 100 (random 1)))
      (let ((fral-lim 1)) (print (+ 200 (random fral-lim))))
      (let ((fral-lim 1.0)) (print (floatp (random fral-lim))))
      (let ((fral-r (random 1000))) (print (and (>= fral-r 0) (< fral-r 1000))))
      (print (* 4611686018427387904 (+ 2 (random 1))))
