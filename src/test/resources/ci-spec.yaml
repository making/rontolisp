          (print (linalg:transpose w))
          (print (linalg:matmul w (linalg:eye 2 :element-type 'single-float)))
          (print (linalg:dot w (linalg:from-list '(1 1) :element-type 'single-float))))
        (print (linalg:outer (linalg:from-list '(1 2) :element-type 'single-float)
