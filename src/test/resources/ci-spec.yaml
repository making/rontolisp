  - name: clos-multi-dispatch-and-defstruct-options
    source: |
      (defclass cmd-animal () ())
      (defclass cmd-dog (cmd-animal) ())
      (defclass cmd-cat (cmd-animal) ())
      (defgeneric cmd-meets (cmd-a cmd-b))
      (defmethod cmd-meets ((cmd-a cmd-dog) (cmd-b cmd-cat)) :chase)
      (defmethod cmd-meets ((cmd-a cmd-cat) (cmd-b cmd-dog)) :flee)
      (defmethod cmd-meets ((cmd-a cmd-animal) (cmd-b cmd-animal)) :ignore)
      (let ((cmd-d (make-instance 'cmd-dog)) (cmd-c (make-instance 'cmd-cat)))
        (print (list (cmd-meets cmd-d cmd-c) (cmd-meets cmd-c cmd-d) (cmd-meets cmd-d cmd-d))))
      (defgeneric cmd-desc (cmd-x &rest cmd-extras)
        (:method ((cmd-x cmd-dog) &rest cmd-extras) (list :dog cmd-extras))
        (:method ((cmd-x cmd-animal) &rest cmd-extras) (list :animal cmd-extras)))
      (print (cmd-desc (make-instance 'cmd-dog) 1 2))
      (defclass cmd-conf () ((cmd-host :initarg :cmd-host) (cmd-port :initarg :cmd-port))
        (:default-initargs :cmd-host "localhost" :cmd-port 8080))
      (let ((cmd-c1 (make-instance 'cmd-conf)))
        (print (list (slot-value cmd-c1 'cmd-host) (slot-value cmd-c1 'cmd-port))))
      (defstruct (cmd-kv (:constructor make-cmd-pair) (:conc-name cmd-get-)
                         (:predicate cmd-kv?) (:copier cmd-clone))
        cmd-key cmd-val)
      (let ((cmd-k (make-cmd-pair :cmd-key 'a :cmd-val 1)))
        (print (list (cmd-get-cmd-key cmd-k) (cmd-kv? cmd-k) (cmd-kv? 5)))
        (let ((cmd-k2 (cmd-clone cmd-k)))
          (setf (cmd-get-cmd-val cmd-k2) 99)
          (print (list (cmd-get-cmd-val cmd-k) (cmd-get-cmd-val cmd-k2)))))
    expected: |
      (:CHASE :FLEE :IGNORE)
      (:DOG (1 2))
      ("localhost" 8080)
      (A T NIL)
