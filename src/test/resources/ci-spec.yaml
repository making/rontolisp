  - name: mutex-primitives
    source: |
      ; The handle is opaque (an integer index interpreted, a ReentrantLock on the
      ; JVM, a constant on WASM), so nothing here prints or orders one -- only the
      ; identity acquire/release return and the values the body yields.
      (defvar *ci-mutex* (rontolisp:make-mutex))
      (defvar *ci-mutex-counter* 0)
      (defun ci-mutex-bump (n)
        (dotimes (i n)
          (rontolisp:with-mutex (*ci-mutex*)
            (setq *ci-mutex-counter* (+ *ci-mutex-counter* 1)))))
      (ci-mutex-bump 3)
      (print *ci-mutex-counter*)
      (print (rontolisp:with-mutex (*ci-mutex*) 1 2 :held))
      (print (eq (rontolisp:mutex-release (rontolisp:mutex-acquire *ci-mutex*)) *ci-mutex*))
      ; Reentrant: the holding thread may take it again.
      (print (rontolisp:with-mutex (*ci-mutex*)
               (rontolisp:with-mutex (*ci-mutex*) :nested)))
