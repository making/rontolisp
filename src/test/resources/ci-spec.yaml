  - name: unwind-protect-values
    source: |
      ; An unwind-protect cleanup runs for effect: its values -- and its value
      ; COUNT -- are discarded, so the form answers the protected form's values,
      ; all of them. Cleanup shapes x exit shapes; the (values) cleanup is the
      ; idiomatic "I return nothing" release helper that used to truncate every
      ; resource-owning function to its primary value.
      (setq ci-uwp-log nil)
      (defun ci-uwp-zero () (values))
      (defun ci-uwp-one () (values 7))
      (defun ci-uwp-two () (values 7 8))
      (defun ci-uwp-release () (setq ci-uwp-log (cons 'released ci-uwp-log)) (values))
      (defun ci-uwp-compute () (values 1 2 3))
      (defun ci-uwp-nil () (unwind-protect (values 1 2 3) nil))
      (defun ci-uwp-v0 () (unwind-protect (values 1 2 3) (ci-uwp-zero)))
      (defun ci-uwp-v1 () (unwind-protect (values 1 2 3) (ci-uwp-one)))
      (defun ci-uwp-v2 () (unwind-protect (values 1 2 3) (values 7 8)))
      (defun ci-uwp-call () (unwind-protect (ci-uwp-compute) (ci-uwp-release)))
      (defun ci-uwp-nested ()
        (unwind-protect (values 1 2 3) (unwind-protect (ci-uwp-two) (ci-uwp-zero))))
      (defun ci-uwp-return ()
        (block b (unwind-protect (return-from b (values 1 2 3)) (ci-uwp-two))))
      (defun ci-uwp-return-call ()
        (block b (unwind-protect (return-from b (ci-uwp-compute)) (ci-uwp-release))))
      (defun ci-uwp-go ()
        (let ((r 0))
          (block b (tagbody (unwind-protect (go done) (ci-uwp-two)) done))
          (values r 2 3)))
      (defun ci-uwp-signal ()
        (handler-case (unwind-protect (error "boom") (ci-uwp-release))
          (error (e) (values 1 2 3))))
      (defun ci-uwp-signal-plain ()
        (handler-case (unwind-protect (error "boom") (ci-uwp-two)) (error (e) 'caught)))
      (print (multiple-value-list (ci-uwp-nil)))
      (print (multiple-value-list (ci-uwp-v0)))
      (print (multiple-value-list (ci-uwp-v1)))
      (print (multiple-value-list (ci-uwp-v2)))
      (print (multiple-value-list (ci-uwp-call)))
      (print (multiple-value-list (ci-uwp-nested)))
      (print (multiple-value-list (ci-uwp-return)))
      (print (multiple-value-list (ci-uwp-return-call)))
      (print (multiple-value-list (ci-uwp-go)))
      (print (multiple-value-list (ci-uwp-signal)))
      (print (multiple-value-list (ci-uwp-signal-plain)))
      (print (multiple-value-list (unwind-protect (values 1 2 3) (ci-uwp-zero))))
      (print ci-uwp-log)
    expected: |
      (1 2 3)
      (1 2 3)
      (1 2 3)
      (1 2 3)
      (1 2 3)
      (1 2 3)
      (1 2 3)
      (1 2 3)
      (0 2 3)
      (1 2 3)
      (CAUGHT)
      (1 2 3)
      (RELEASED RELEASED RELEASED)
  - name: mv-producer-function-return
    source: |
      ; A syntactic producer (gethash / floor family / find-symbol / intern /
      ; array-displacement) in a function's tail publishes through %mv-spill, so
      ; the secondary value survives the return -- including a defmethod, the
      ; shape that found this (cl-mustache's context-get IS a gethash). A
      ; non-tail producer stays single-valued.
      (defun ci-mvp-gethash (h) (gethash "K" h))
      (defun ci-mvp-floor (a b) (floor a b))
      (defun ci-mvp-disp (a) (array-displacement a))
      (defmethod ci-mvp-ctx-get ((key string) (context hash-table))
        (gethash (string-upcase key) context))
      (defun ci-mvp-cond (h k) (cond (k (gethash "K" h)) (t nil)))
      (defun ci-mvp-user-fn (x) x)
      (defun ci-mvp-find (n) (find-symbol n))
      (defun ci-mvp-intern (n) (intern n))
      (defun ci-mvp-nontail (h) (let ((v (gethash "K" h))) v))
      (setq ci-mvp-tbl (make-hash-table :test 'equal))
      (setf (gethash "K" ci-mvp-tbl) "V")
      (print (multiple-value-list (ci-mvp-gethash ci-mvp-tbl)))
      (print (multiple-value-list (ci-mvp-gethash (make-hash-table))))
      (print (multiple-value-list (ci-mvp-floor 7 2)))
      (print (multiple-value-list (ci-mvp-find "CI-MVP-USER-FN")))
      (print (multiple-value-list (ci-mvp-intern "CI-MVP-USER-FN")))
      (print (multiple-value-list (ci-mvp-disp (make-array 3))))
      (print (multiple-value-list (ci-mvp-ctx-get "k" ci-mvp-tbl)))
      (print (multiple-value-list (ci-mvp-cond ci-mvp-tbl t)))
      (print (multiple-value-list (ci-mvp-cond ci-mvp-tbl nil)))
      (multiple-value-bind (v f) (ci-mvp-ctx-get "k" ci-mvp-tbl) (print (list v f)))
      (print (multiple-value-list (ci-mvp-nontail ci-mvp-tbl)))
    expected: |
      ("V" T)
      (NIL NIL)
      (3 1)
      (CI-MVP-USER-FN :INTERNAL)
      (CI-MVP-USER-FN :INTERNAL)
      (NIL 0)
      ("V" T)
      ("V" T)
      (NIL)
      ("V" T)
      ("V")
