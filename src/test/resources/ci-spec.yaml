      10
      t
      nil
      1
      100
  - name: defstruct-setf-places-and-first-class-accessors
    source: |
      (setf (cs-point-x cs-p) 99)
      (incf (cs-point-y cs-p) 5)
      (print (list (cs-point-x cs-p) (cs-point-y cs-p)))
