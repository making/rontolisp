      (print (intern "CI-ZAP" (find-package :keyword)))
      (print (loop :for pos = 0 :then (+ pos (length arg))
                   :for arg :in '("ab" "cde" "f") :collect pos))
      (print (typep #(1 2) '(vector (unsigned-byte 8))))
      (print (typep (make-array 2 :element-type '(unsigned-byte 8))
                    '(vector (unsigned-byte 8))))
    expected: |
