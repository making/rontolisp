# Single source of truth for the native-binary E2E test.
# Cases run IN ORDER, concatenated into one program per backend
# (shared global state). Regenerate is manual; edit cases directly.
cases:
  - name: arithmetic
    source: |
      (print (+ 1 2))
      (print (- 10 3))
      (print (* 3 4))
      (print (/ 10 3))
      (print (mod 10 3))
    expected: |
      3
      7
      12
      10/3
      1
  - name: float-and-negative-mod-rem
    source: |
      (print (round (* (mod 4.6666 2.0) 1000000.0)))
      (print (round (* (rem -4.6 2.0) 1000000.0)))
      (print (mod -7 3))
      (print (rem -7 3))
      (print (mod 7 -3))
    expected: |
      666600
      -600000
      2
      -1
      -2
  - name: nested-arithmetic
    source: |
      (print (+ (* 2 3) (- 10 4)))
    expected: |
      12
  - name: comparison-operators-verified-via-if
    source: |
      (print (if (= 1 1) 42 99))
      (print (if (< 1 2) 42 99))
      (print (if (> 3 2) 42 99))
      (print (if (<= 2 2) 42 99))
      (print (if (>= 2 3) 42 99))
    expected: |
      42
      42
      42
      42
      99
  - name: conditionals
    source: |
      (print (if t 1 2))
      (print (if nil 1 2))
    expected: |
