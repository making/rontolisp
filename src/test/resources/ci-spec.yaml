  - name: user-setf-expander-and-defsetf
    source: |
      (defun ci-aget (alist key) (cdr (assoc key alist :test #'equal)))
      (defun ci-aput (alist key value)
        (let ((kv (assoc key alist :test #'equal)))
          (if kv (progn (rplacd kv value) alist) (cons (cons key value) alist))))
      (define-setf-expander ci-aget (alist key &environment env)
        (multiple-value-bind (d v n setter getter) (get-setf-expansion alist env)
          (let ((nv (first n)))
            (values d v n `(let ((,nv (ci-aput ,alist ,key ,nv))) ,setter ,nv) `(ci-aget ,getter ,key)))))
      (defun ci-ref (box) (car box))
      (defsetf ci-ref rplaca)
      (let ((d (list (cons :a 1))))
        (setf (ci-aget d :a) 100)
        (setf (ci-aget d :b) 2)
        (incf (ci-aget d :a) 5)
        (print (list (ci-aget d :a) (ci-aget d :b))))
      (print (let ((b (list 1))) (setf (ci-ref b) 9) b))
    expected: |
      (105 2)
      (9)
  - name: flet-and-labels-local-functions
    source: |
      (flet ((ci-sq (x) (* x x))
             (ci-dbl (x) (* 2 x)))
        (print (mapcar #'ci-sq '(1 2 3)))
        (print (funcall #'ci-dbl 21))
        (print (ci-sq (ci-dbl 3))))
      (defun ci-shadow-fn (x) (* 100 x))
      (print (flet ((ci-shadow-fn (x) (if (= x 0) 'zero (ci-shadow-fn 0))))
               (ci-shadow-fn 5)))
      (flet ((ci-g () 1))
        (flet ((ci-h () (ci-g)))
          (flet ((ci-g () 2))
            (print (list (ci-g) (ci-h))))))
      (flet ((ci-opt (a &optional (b 10) &rest r) (list a b r)))
        (print (ci-opt 1))
        (print (ci-opt 1 2 3 4)))
      (let ((ci-base 100))
        (flet ((ci-offs (x) (+ ci-base x)))
          (print (ci-offs 5))))
      (labels ((ci-fact (n) (if (= n 0) 1 (* n (ci-fact (- n 1))))))
        (print (ci-fact 6)))
      (labels ((ci-ev (n) (if (= n 0) t (ci-od (- n 1))))
               (ci-od (n) (if (= n 0) nil (ci-ev (- n 1)))))
        (print (list (ci-ev 10) (ci-od 10))))
      (defun ci-count-down (n)
        (labels ((ci-go-down (i acc) (if (= i 0) acc (ci-go-down (- i 1) (cons i acc)))))
          (ci-go-down n nil)))
      (print (ci-count-down 4))
    expected: |
      (1 4 9)
      42
      36
      0
      (2 1)
      (1 10 NIL)
      (1 2 (3 4))
      105
      720
      (T NIL)
      (1 2 3 4)
  - name: macrolet-compiler-macro-restart-case
    source: |
      ;; macrolet: local macros expanded away (compile path via UserMacroExpander,
      ;; interpreter natively); the body's calls to the locals are expanded.
      (macrolet ((ci-sq (x) `(* ,x ,x))
                 (ci-twice (x) `(+ ,x ,x)))
        (print (+ (ci-sq 5) (ci-twice 5))))
      (defun ci-in-body (n)
        (macrolet ((ci-mklist (&rest xs) `(list ,@xs)))
          (ci-mklist n (* n n))))
      (print (ci-in-body 4))
      ;; define-compiler-macro: rewrites the call sites of the function it names.
      (defun ci-myinc (x) (+ x 1))
      (define-compiler-macro ci-myinc (x) `(+ ,x 100))
      (print (ci-myinc 10))
      ;; returning the &whole form declines, and the ordinary function wins.
      (defun ci-mydec (x) (- x 1))
      (define-compiler-macro ci-mydec (&whole form x) (declare (ignore x)) form)
      (print (ci-mydec 10))
      ;; a body that signals is a hint that cannot be honoured, not a program error.
      (defun ci-mysafe (x) (+ x 1))
      (define-compiler-macro ci-mysafe (x) (error "no"))
      (print (ci-mysafe 10))
      ;; load-time-value: evaluated once per occurrence, however often it is reached.
      (defvar ci-ltv-n 0)
      (defun ci-ltv-bump () (setq ci-ltv-n (+ ci-ltv-n 1)) ci-ltv-n)
      (defun ci-ltv-probe () (load-time-value (ci-ltv-bump)))
      (defun ci-ltv-other () (load-time-value (ci-ltv-bump)))
      (print (ci-ltv-probe))
      (print (ci-ltv-probe))
      (print (ci-ltv-other))
      (print ci-ltv-n)
      ;; restart-case: lite lowering to the primary form (restart clauses are dead).
      (print (restart-case (+ 1 2) (continue () 99)))
    expected: |
      35
      (4 16)
      110
      9
      11
      1
      1
      2
      2
      3
  - name: multiple-values-core
    source: |
      (print (values 1 2 3))
      (print (values))
      (print (funcall #'values 1 2))
      (multiple-value-bind (a b c) (values 1 2)
        (print (list a b c)))
      (multiple-value-bind (q r) (floor 7 2) (print (list q r)))
      (multiple-value-bind (q r) (truncate -7 2) (print (list q r)))
      (multiple-value-bind (q r) (ceiling 7 2) (print (list q r)))
      (multiple-value-bind (q r) (round 7 2) (print (list q r)))
      (multiple-value-bind (q r) (floor 7.5) (print (list q r)))
      (print (multiple-value-list (values 1 2 3)))
      (print (multiple-value-list (floor 17 5)))
      (print (multiple-value-list (+ 1 2)))
      (print (nth-value 1 (floor 7 2)))
      (print (nth-value 0 (values 'a 'b)))
      (print (multiple-value-call #'+ (values 1 2)))
      (defun ci-mv-collect (&rest args) args)
      (print (multiple-value-call #'ci-mv-collect 1 (values 2 3) (floor 9 4)))
      (setq ci-mv-h (make-hash-table))
      (setf (gethash 'x ci-mv-h) nil)
      (setf (gethash 'y ci-mv-h) 42)
      (multiple-value-bind (v p) (gethash 'y ci-mv-h) (print (list v p)))
      (multiple-value-bind (v p) (gethash 'x ci-mv-h) (print (list v p)))
      (multiple-value-bind (v p) (gethash 'z ci-mv-h) (print (list v p)))
      (multiple-value-bind (v p) (gethash 'z ci-mv-h 'dflt) (print (list v p)))
      (defun ci-mv-q100r (n)
        (multiple-value-bind (q r) (floor n 3) (+ (* 100 q) r)))
      (print (ci-mv-q100r 17))
      (print (mapcar (lambda (n) (multiple-value-list (floor n 4))) '(9 10 11)))
      (print (floor 7 2))
