  - name: gray-stream-instance-dispatch
    source: |
      (defclass gsd-upcase (rontolisp:fundamental-character-output-stream)
        ((gsd-acc :initform "")))
      (defmethod rontolisp:stream-write-string ((gsd-s gsd-upcase) gsd-str)
        (setf (slot-value gsd-s 'gsd-acc)
              (concatenate 'string (slot-value gsd-s 'gsd-acc) (string-upcase gsd-str)))
        gsd-str)
      (let ((gsd-s (make-instance 'gsd-upcase)))
        (write-string "hello" gsd-s)
        (write-char #\! gsd-s)
        (print (slot-value gsd-s 'gsd-acc)))
    expected: |
      "HELLO!"
  - name: gray-stream-output-protocol-widening
    source: |
      ; The whole OUTPUT protocol reaches a Gray instance, not just the
      ; two write generics. This class defines only stream-write-char -- full
      ; Gray's one required method, and rove's indent-stream shape -- plus the
      ; column protocol fresh-line consults.
      ; (close is deliberately absent: a case further down methods CLOSE itself,
      ; and a program that owns close keeps it -- the Gray rewrite stands down
      ; for the whole concatenated program. LispEvaluatorTest /
      ; JvmLispCompilerTest pin that pair.)
      (defclass gow-col (rontolisp:fundamental-character-output-stream)
        ((gow-acc :initform "") (gow-col :initform 0)))
      (defmethod rontolisp:stream-write-char ((gow-s gow-col) gow-c)
        (setf (slot-value gow-s 'gow-acc)
              (concatenate 'string (slot-value gow-s 'gow-acc) (string gow-c)))
        (setf (slot-value gow-s 'gow-col)
              (if (char= gow-c #\Newline) 0 (+ (slot-value gow-s 'gow-col) 1)))
        gow-c)
      (defmethod rontolisp:stream-line-column ((gow-s gow-col)) (slot-value gow-s 'gow-col))
      (let ((gow-s (make-instance 'gow-col)))
        (write-char #\a gow-s)
        (write-string "bc" gow-s)
        (princ "-" gow-s)
        (prin1 :k gow-s)
        (fresh-line gow-s)
        (fresh-line gow-s)
        (terpri gow-s)
        (write-line "l" gow-s)
        (print 7 gow-s)
        (format gow-s "f~a" 1)
        (force-output gow-s)
        (finish-output gow-s)
        (clear-output gow-s)
        (print (slot-value gow-s 'gow-acc)))
      ; A broadcast stream is prelude Lisp over the same protocol, so it gained
      ; the line operators for free. It tracks no column, so fresh-line on one
      ; always breaks the line.
      (print (with-output-to-string (gow-o)
               (let ((gow-b (make-broadcast-stream gow-o)))
                 (princ "a" gow-b)
                 (terpri gow-b)
                 (write-line "b" gow-b)
                 (fresh-line gow-b)
                 (print :c gow-b))))
      (write-line "gow-past")
    expected: |
      "abc-:K

      l
      7
      f1"
      "a
      b

      :C
      "
      gow-past
  - name: gray-stream-binary-round-trip-and-file-position
    source: |
      ; The read side of the Gray protocol: write-byte/read-byte through
      ; a user binary stream class, the :eof -> eof-value translation, and the
      ; file-position protocol (the read generic + the (setf ...) writer generic).
      (defclass gbt-sink (rontolisp:fundamental-binary-output-stream)
        ((gbt-bytes :initform nil)))
      (defmethod rontolisp:stream-write-byte ((gbt-s gbt-sink) gbt-byte)
        (setf (slot-value gbt-s 'gbt-bytes) (cons gbt-byte (slot-value gbt-s 'gbt-bytes)))
        gbt-byte)
      (defclass gbt-source (rontolisp:fundamental-binary-input-stream)
        ((gbt-items :initarg :gbt-items) (gbt-pos :initform 0)))
      (defmethod rontolisp:stream-read-byte ((gbt-s gbt-source))
        (let ((gbt-items (slot-value gbt-s 'gbt-items)) (gbt-pos (slot-value gbt-s 'gbt-pos)))
          (if (>= gbt-pos (length gbt-items))
              :eof
              (progn (setf (slot-value gbt-s 'gbt-pos) (+ gbt-pos 1)) (nth gbt-pos gbt-items)))))
      (defmethod rontolisp:stream-file-position ((gbt-s gbt-source))
        (slot-value gbt-s 'gbt-pos))
      (defmethod (setf rontolisp:stream-file-position) (gbt-position (gbt-s gbt-source))
        (setf (slot-value gbt-s 'gbt-pos) gbt-position))
      (let ((gbt-out (make-instance 'gbt-sink)))
        (write-byte 7 gbt-out)
        (write-byte 250 gbt-out)
        (print (reverse (slot-value gbt-out 'gbt-bytes))))
      (let ((gbt-in (make-instance 'gbt-source :gbt-items (list 10 20 30))))
        (print (read-byte gbt-in))
        (print (file-position gbt-in))
        (file-position gbt-in 0)
        (print (read-byte gbt-in))
        (print (read-byte gbt-in nil :gbt-done))
        (print (read-byte gbt-in nil :gbt-done))
        (print (read-byte gbt-in nil :gbt-done)))
    expected: |
      (7 250)
      10
      1
      10
      20
      30
      :GBT-DONE
  - name: gray-stream-input-protocol-widening
    source: |
      ; The whole INPUT protocol reaches a Gray instance. This class
      ; defines only stream-read-char -- the ONE method a character input stream
      ; must supply -- and answers peek-char (all three peek-type forms),
      ; unread-char (through the protocol's own one-slot pushback, since the class
      ; defines no stream-unread-char), read-char-no-hang and read-line.
      ; open-stream-p / stream-element-type answer the Gray defaults because no
      ; case in this program methods either name (close is a different story: a
      ; case further down owns it, so it is deliberately absent here).
      (defclass gip-source (rontolisp:fundamental-character-input-stream)
        ((gip-text :initarg :gip-text) (gip-pos :initform 0)))
      (defmethod rontolisp:stream-read-char ((gip-s gip-source))
        (let ((gip-text (slot-value gip-s 'gip-text)) (gip-pos (slot-value gip-s 'gip-pos)))
          (if (>= gip-pos (length gip-text))
              :eof
              (progn (setf (slot-value gip-s 'gip-pos) (+ gip-pos 1))
                     (char gip-text gip-pos)))))
      (defclass gip-bytes (rontolisp:fundamental-binary-input-stream) ())
      (let ((gip-in (make-instance 'gip-source :gip-text (format nil "ab~%  cd"))))
        (print (peek-char nil gip-in))
        (print (read-char gip-in))
        (print (unread-char #\a gip-in))
        (print (read-char gip-in))
        (print (read-char-no-hang gip-in))
        (print (read-line gip-in))
        (print (peek-char t gip-in))
        (print (peek-char #\d gip-in))
        (print (read-line gip-in))
        (print (peek-char nil gip-in nil :gip-done))
        (print (open-stream-p gip-in))
        (print (stream-element-type gip-in))
        (print (stream-element-type (make-instance 'gip-bytes)))
        ; input-stream-p / output-stream-p answer the DIRECTION base class the
        ; instance extends -- a typep, not a predicate generic per class.
        (print (list (input-stream-p gip-in) (output-stream-p gip-in)))
        (print (list (input-stream-p (make-instance 'gip-bytes))
                     (output-stream-p (make-instance 'gip-bytes)))))
      ; The handle arm of unread-char parks the character in the
      ; handle-side pushback (unread-char.lisp) that read-char, peek-char and
      ; read-line all drain -- a file, a string input stream and a socket alike.
      ; A second unread with the cell still full signals, on every backend.
      (let ((gip-h (make-string-input-stream (format nil "ab~%cd"))))
        (print (read-char gip-h))
        (print (unread-char #\a gip-h))
        (print (peek-char nil gip-h))
        (print (read-char gip-h))
        (print (read-line gip-h))
        (print (read-line gip-h)))
      (let ((gip-h2 (make-string-input-stream "abc")))
        (read-char gip-h2)
        (unread-char #\a gip-h2)
        (print (handler-case (unread-char #\a gip-h2)
                 (error (gip-e) (princ-to-string gip-e))))
        ; The cell is ONE slot for the whole program, and the cases that follow
        ; share it: drain what the failed second unread left parked.
        (read-char gip-h2))
      (print (list (input-stream-p (make-string-input-stream "z"))
                   (output-stream-p (make-string-input-stream "z"))))
    expected: |
      #\a
      #\a
      NIL
      #\a
      #\b
      ""
      #\c
      #\d
      "d"
      :GIP-DONE
      T
      CHARACTER
      (UNSIGNED-BYTE 8)
      (T NIL)
      (T NIL)
      #\a
      NIL
      #\a
      #\a
      "b"
      "cd"
      "UNREAD-CHAR without an intervening READ-CHAR"
      (T T)
  - name: gray-stream-is-a-stream
    source: |
      ; A Gray stream IS a stream in Common Lisp, so streamp and
      ; (typep x 'stream) both answer t for one, and an etypecase that splits
      ; "an OS file descriptor" from "a Lisp stream" (cl+ssl's shape) reaches the
      ; stream arm. A non-stream instance and a pathname stay nil.
      (defclass gis-out (rontolisp:fundamental-character-output-stream) ())
      (defmethod rontolisp:stream-write-string ((gis-s gis-out) gis-str) gis-str)
      (defclass gis-other () ())
      (defun gis-typep (gis-x gis-ty) (typep gis-x gis-ty))
      (let ((gis-s (make-instance 'gis-out)) (gis-o (make-instance 'gis-other)))
        (print (list (streamp gis-s) (typep gis-s 'stream)))
        (print (list (streamp gis-o) (typep gis-o 'stream)))
        (print (mapcar #'streamp (list gis-s gis-o 3 t nil)))
        (print (streamp (make-pathname :name "gis")))
        (print (etypecase gis-s (integer :gis-fd) (stream :gis-lisp-stream)))
        ; A COMPUTED type specifier answers the same for an instance; an INTEGER is
        ; a number, not a stream, which is what makes the etypecase above a real
        ; dispatch rather than a coin toss.
        (print (list (gis-typep gis-s 'stream) (gis-typep gis-o 'stream)
                     (gis-typep 3 'stream))))
    expected: |
      (T T)
      (NIL NIL)
      (T NIL NIL T NIL)
      NIL
      :GIS-LISP-STREAM
      (T NIL NIL)
  - name: a-stream-is-a-self-describing-value
    source: |
      ; A stream is a VALUE carrying its backend handle and its KIND, not a small
      ; integer: streamp tells one from a file descriptor, and file-stream /
      ; string-stream are exact tests rather than "an open handle". Identical on
      ; all four backends.
      (defvar *ci-sv-path* "ci-stream-value.txt")
      (with-open-file (sv-f *ci-sv-path* :direction :output)
        (write-line "sv-line" sv-f)
        (print (list (streamp sv-f) (streamp 3) (streamp t) (streamp nil)))
        (print (list (typep sv-f 'stream) (typep sv-f 'file-stream)
                     (typep sv-f 'string-stream))))
      (let ((sv-in (make-string-input-stream "read-me")))
        (print (list (streamp sv-in) (typep sv-in 'file-stream)
                     (typep sv-in 'string-stream)))
        (print (read-line sv-in)))
      (print (with-output-to-string (sv-o)
               (princ (list (streamp sv-o) (typep sv-o 'string-stream)) sv-o)))
      (let ((sv-r (open *ci-sv-path*)))
        (print (read-line sv-r))
        (print (close sv-r)))
      ; The one stream variable that is a value rather than the t designator.
      (print (list (streamp *error-output*) (typep *error-output* 'file-stream)))
      ; cl+ssl's shape: an integer is a file descriptor, a stream is a stream.
      (print (etypecase 3 (integer :sv-fd) (stream :sv-stream)))
      (let ((sv-e (make-string-input-stream "x")))
        (print (etypecase sv-e (integer :sv-fd) (stream :sv-stream))))
    expected: |
      (T NIL T NIL)
      (T T NIL)
      (T NIL T)
      "read-me"
      "(T T)"
      "sv-line"
      T
      (T NIL)
      :SV-FD
      :SV-STREAM
