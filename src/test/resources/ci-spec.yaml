    source: |
      (print (map 'list #'+ '(1 2 3) '(10 20 30)))
      (print (map 'string #'char-upcase "abc"))
      (print (map 'list #'1+ '(1 2 3)))
      (print (map 'list #'+ '(1 2 3) nil))
      ;; Each operand is read through a cons cursor when it is a list, and by the
      ;; stringp/listp/aref three-way otherwise. It used to be (nth i s) per element,
      ;; which walks a list from the head -- so (map 'list ...) over a list, and
      ;; (map 'vector ...), which routes through it, were quadratic. Mixed
      ;; representations and mixed lengths pin the answer.
      (defvar *map-l* (list 1 2 3 4))
      (print (map 'list #'1+ *map-l*))
      (print (map 'vector #'1+ *map-l*))
      (print (map 'list #'+ *map-l* (coerce (list 10 20 30) 'vector)))
      (print (map 'list #'list *map-l* "ab"))
      (print (map 'string #'char-upcase (coerce (list #\a #\b) 'string)))
      (print (map nil #'1+ *map-l*))
      (print (map 'list #'char-code (list #\a #\b)))
      ;; The 'string accumulator is a LIST of the per-element princ pieces joined
      ;; pairwise at the end; it used to be one %string-concat of the whole result
      ;; per element, which is quadratic in the OUTPUT. Odd and even piece counts,
      ;; an empty and a one-element sequence, and multi-character pieces are what
      ;; the halving has to get right -- and every literal (coerce x 'string) runs
      ;; the same body.
      (print (map 'string #'identity nil))
      (print (map 'string #'identity (list #\a)))
      (print (map 'string #'identity (list #\a #\b #\c)))
      (print (map 'string #'identity (list #\a #\b #\c #\d)))
      (print (map 'string #'identity (list 1 2 33)))
      (print (map 'string #'identity "abcde"))
      (print (coerce (list #\x #\y #\z) 'string))
      (print (coerce (list 1 2) 'string))
      (print (length (map 'string #'char-upcase (make-string 5000 :initial-element #\q))))
      (print (subseq (map 'string #'char-upcase (make-string 5000 :initial-element #\q)) 0 4))
      (print (funcall #'map 'string #'char-upcase "abcd"))
    expected: |
      (11 22 33)
      "ABC"
      (2 3 4)
      NIL
      (2 3 4 5)
      #(2 3 4 5)
      (11 22 33)
      ((1 #\a) (2 #\b))
      "AB"
      NIL
      (97 98)
      ""
      "a"
      "abc"
      "abcd"
      "1233"
      "abcde"
      "xyz"
      "12"
      5000
      "QQQQ"
      "ABCD"
