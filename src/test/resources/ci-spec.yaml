  - name: clos-defgeneric-defmethod-eql-dispatch
    source: |
      (defgeneric clos-describe-it (x))
      (defmethod clos-describe-it (x) (list :default x))
      (defmethod clos-describe-it ((x (eql :br))) (list :special x))
      (print (list (clos-describe-it 5) (clos-describe-it :br)))
