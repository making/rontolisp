      (print .5e1)
      (print 1.)
      (print 100.)
      (print -100.)
      (print 1.e5)
      (print (integerp 1.))
      (print (floatp .4))
      (print (list 'a .5))
      (print (cdr '(a . 5)))
    expected: |
