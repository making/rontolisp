  # random draws differ per backend (interpreter/JVM use Math.random; WASM uses a
  # deterministic LCG), so the output is only asserted on deterministic properties:
  # (random 1) is always 0, the result type follows the limit, and bounds always hold.
  - name: random-deterministic-properties
    source: |
      (print (random 1))
      (print (integerp (random 100)))
      (print (floatp (random 5.0)))
      (let ((r (random 10))) (if (and (>= r 0) (< r 10)) (print "int-in-range") (print "int-oob")))
      (let ((r (random 1.0))) (if (and (>= r 0.0) (< r 1.0)) (print "float-in-range") (print "float-oob")))
    expected: |
      0
      t
      t
      "int-in-range"
      "float-in-range"

  # Float values flowing through variables/parameters (not literals) must use float
  # arithmetic on every backend, with integer contagion, while integer/ratio stay exact.
  - name: float-arithmetic-through-variables
    source: |
      (defun fadd (a b) (+ a b))
      (defun fsub (a b) (- a b))
      (defun fmul (a b) (* a b))
      (defun fdiv (a b) (/ a b))
      (defun fcmp (a b) (if (< a b) "lt" (if (> a b) "gt" "eq")))
      (print (fadd 1.5 2.5))
      (print (fsub 1.0 0.25))
      (print (fmul 1.5 2.5))
      (print (fdiv 3.0 2.0))
      (print (fadd 1 2.0))
      (print (fcmp 1.5 2.5))
      (print (fcmp 3.0 1.0))
      (print (reduce #'+ (list 1.0 2.0 3.0) :initial-value 0))
      (print (mapcar (lambda (x) (* x x)) (list 1.0 2.0 3.0)))
      (print (fadd 1 2))
      (print (fdiv 1 3))
    expected: |
      4.0
      0.75
      3.75
      1.5
      3.0
      "lt"
      "gt"
      6.0
      (1.0 4.0 9.0)
      3
      1/3

  # exp is native (Math.exp) on the interpreter/JVM and a software approximation on
  # WASM, so only values that are exact on every backend are asserted: exp(0) is 1.0
  # and sigmoid(0) = 1/(1+exp(0)) is 0.5.
  - name: exp-exact-cross-backend-cases
    source: |
      (defun sigmoid (x) (/ 1.0 (+ 1.0 (exp (- 0 x)))))
      (print (exp 0))
      (print (sigmoid 0.0))
    expected: |
      1.0
      0.5
