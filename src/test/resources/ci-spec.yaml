  # concatenate's three result families (ConcatenateForms): the string family folds the
  # binary string primitive and takes string arguments, the list / vector families walk
  # elements so any mix of sequences works, and a compound spec normalizes to its head
  # ('(vector (unsigned-byte 8)) is the vector family -- what ironclad's HKDF builds with).
  # The last case is the first-class #'concatenate wrapper, whose result type is a runtime
  # value rather than a literal.
  - name: concatenate-result-families
    source: |
      (defun ci-concatenate ()
        (print (concatenate 'string "foo" "bar" "baz"))
        (print (concatenate 'list '(1 2) "ab" #(3)))
        (print (concatenate 'vector '(1 2) #(3)))
        (print (concatenate '(vector (unsigned-byte 8)) #(1) #(2 3)))
        (print (concatenate 'list))
        (print (concatenate 'vector))
        (print (let ((a (list 1 2))) (eq a (concatenate 'list a))))
        (print (apply #'concatenate '(vector (unsigned-byte 8)) (list #(1) #(2 3))))
        (print (apply #'concatenate 'string (list "a" "b")))
        ;; The string family takes any character SEQUENCE, nil (the empty list)
        ;; included -- s-sql's expand-table-name builds "CREATE TABLE person"
        ;; as (concatenate 'string (unless tableset "TABLE ") name).
        (print (concatenate 'string "a" '(#\b #\c) #(#\d) nil "e"))
        (print (concatenate 'string (unless t "TABLE ") "person"))
        (print (apply #'concatenate 'string (list nil "x" '(#\y)))))
      (ci-concatenate)
    expected: |
      "foobarbaz"
      (1 2 #\a #\b 3)
      #(1 2 3)
      #(1 2 3)
      NIL
      #()
      NIL
      #(1 2 3)
      "ab"
      "abcde"
      "person"
      "xy"
