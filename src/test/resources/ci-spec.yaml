  # rontolisp:wasm-export (see .kb/wasm-export-no-wasi.md): a no-op returning the symbol on the
  # interpreter/JVM; on WASM Preview 1 it adds a core export, and under
  # --component it is additionally lifted into a host-callable component-model
  # export (WAVE-invokable). Either way the program's own top level (run) must
  # be unaffected -- this pins that output carrying exports still builds and
  # runs as a command on every backend.
  - name: wasm-export-directive-does-not-disturb-run
    source: |
