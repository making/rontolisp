  - name: clos-multiple-inheritance-cpl-slots-and-dispatch
    source: |
      (defclass clos-mi-a () ((x :initarg :x :accessor clos-mi-x)))
      (defclass clos-mi-b () ((y :initarg :y :accessor clos-mi-y)))
      (defclass clos-mi-c (clos-mi-a clos-mi-b) ((z :initarg :z :accessor clos-mi-z)))
      (let ((b (make-instance 'clos-mi-b :y 7))
            (c (make-instance 'clos-mi-c :x 1 :y 2 :z 3)))
        (setf (clos-mi-y c) 9)
