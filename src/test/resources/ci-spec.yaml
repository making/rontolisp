      (print (funcall #'map-into (make-array 6 :fill-pointer 3 :initial-element 0)
                      #'1+ '(1 2 3 4 5 6)))
      (print (length (funcall #'map-into (make-list 20000) (lambda (x) 1) (make-list 20000))))
      (print (car (funcall #'map-into (make-list 20000) #'1+ (make-list 20000 :initial-element 5))))
