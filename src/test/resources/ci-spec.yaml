  # Packed single-float arrays (see .kb/vec.md): the #f(...) / :element-type 'single-float
  # counterpart of packed-float-arrays-cross-backend, storing elements unboxed as f32
  # (half the memory, 2x the SIMD lanes) on every backend (interpreter float[]/int[];
  # JVM a bare float[] with a dims header; wasm-GC the shared TYPE_FARRAY struct whose data
  # is a distinct (array (mut f32)) told apart by ref.test; the component path reuses the
  # same core module). Reads widen f32 -> double, writes narrow double -> f32. A
  # single-float ELEMENT prints at its f32 width on every backend
  # (the shortest f32 round-trip decimal, so #f(0.1) prints #f(0.1) and reads back
  # to the same array); the non-exact narrowing is additionally proven by the boolean
  # (= (aref w 0) 0.1) => nil (f32(0.1) widened differs from double 0.1 identically on every
  # backend). Since vec::%make-like is unconditional (width-following on EVERY
  # backend -- the old wasm-GC double-only branch became vestigial once wasm-GC gained
  # TYPE_F32ARR), a vec: element-wise result also prints #f on every backend, so the
  # (vec:add #f #f) line below is a cross-backend regression guard alongside the two
  # reductions (dot/sum -> an f64 scalar).
