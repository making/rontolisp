  # Fill-pointer arrays (see .kb/adjustable-arrays.md): make-array :fill-pointer/:adjustable,
  # length/printing clamped to the fill pointer, fill-pointer (+ setf),
  # array-has-fill-pointer-p, adjustable-array-p, array-element-type,
  # vector-push/vector-pop/vector-push-extend, first-class wrappers, and the
  # verbatim cl-utilities copy-array. Side effects are sequenced through let*
  # bindings (the compilers evaluate list arguments right-to-left).
  # A STRING's inactive slots (between the fill pointer and the capacity) are reachable
  # by aref and writable through (setf (aref ...)) on every backend: CL says aref ignores
  # fill pointers, and the fill pointer bounds the sequence view only
  # (.kb/adjustable-arrays.md). The interpreter used to bound the index by the fill
  # pointer and signal here, where all three compile backends served the slot.
  # char / schar past the fill pointer are deliberately NOT covered: the compile backends
  # have no bounds check there at all and disagree with each other -- see the string
  # indexing section of .kb/adjustable-arrays.md.
  - name: string-fill-pointer-inactive-slots
    source: |
      (defun ci-string-inactive-aref ()
        (let ((s (make-array 6 :element-type 'character :fill-pointer 3 :initial-element #\.)))
          (setf (char s 0) #\a)
          (setf (char s 1) #\b)
          (setf (char s 2) #\c)
          (print (list (length s) s (aref s 4) (aref s 5)))
          (setf (aref s 4) #\Z)
          (setf (fill-pointer s) 6)
          (print s)))
      (ci-string-inactive-aref)
    expected: |
      (3 "abc" #\. #\.)
      "abc.Z."

  - name: fill-pointer-arrays-cross-backend
    source: |
      (defun ci-copy-array (array &key
                            (element-type (array-element-type array))
                            (fill-pointer (and (array-has-fill-pointer-p array)
                                               (fill-pointer array)))
                            (adjustable (adjustable-array-p array)))
        (let* ((dimensions (array-dimensions array))
               (new-array (make-array dimensions
                                      :element-type element-type
                                      :adjustable adjustable
                                      :fill-pointer fill-pointer)))
          (dotimes (i (array-total-size array))
            (setf (row-major-aref new-array i)
                  (row-major-aref array i)))
          new-array))
      (defun ci-fill-pointer ()
        (let ((v (make-array 5 :fill-pointer 2 :initial-element 0)))
          (print (list (length v) (fill-pointer v)
                       (array-has-fill-pointer-p v) (adjustable-array-p v)))
          (print v)
          (setf (fill-pointer v) 4)
          (print (list (length v) (fill-pointer v))))
        (let* ((w (make-array 3 :fill-pointer 0))
               (a (vector-push 10 w))
               (b (vector-push 20 w))
               (c (vector-push 30 w))
               (d (vector-push 40 w)))
          (print (list a b c d))
          (print (list (length w) (aref w 0) (aref w 1)))
          (let ((p (vector-pop w)))
            (print (list p (length w)))))
        (let ((e (make-array 2 :fill-pointer 0 :adjustable t)))
          (vector-push-extend 1 e)
          (vector-push-extend 2 e)
          (vector-push-extend 3 e)
          (print (list (length e) (adjustable-array-p e) (aref e 2))))
        (let ((s (make-array 3 :initial-element 7))
              (ft (make-array 4 :fill-pointer t :initial-element 1)))
          (print (list (array-has-fill-pointer-p s) (adjustable-array-p s)
                       (array-element-type s)))
          (print (list (length ft) (fill-pointer ft))))
        (let ((fw (make-array 3 :fill-pointer 0)))
          (funcall #'vector-push 5 fw)
          (let* ((fp (funcall #'fill-pointer fw))
                 (popped (funcall #'vector-pop fw)))
            (print (list fp popped (funcall #'array-has-fill-pointer-p fw)))))
        (let ((orig (make-array 4 :fill-pointer 3 :adjustable t :initial-element 5)))
          (setf (aref orig 1) 8)
          (let ((copy (ci-copy-array orig)))
            (setf (aref copy 0) 99)
            (print (list copy orig (fill-pointer copy) (adjustable-array-p copy))))))
      (ci-fill-pointer)
    expected: |
      (2 2 T NIL)
      #(0 0)
      (4 4)
      (0 1 2 NIL)
      (3 10 20)
      (30 2)
      (3 T 3)
      (NIL NIL T)
      (4 4)
      (1 5 T)
      (#(99 8 5) #(5 8 5) 3 T)
  # The capacity a full vector-push-extend GROWS to is observable (array-dimension reads it
  # back, and a sized sequence type tests it), so it is one policy for all four backends --
  # stated once in am.ik.rontolisp.ArrayGrowth and emitted from there: a supplied extension
  # verbatim, otherwise doubling off a floor of 1 for the zero-capacity vector. The numbers
  # are SBCL 2.2.9's (measured 2026-08-31). The character vector is here because it is the
  # one the interpreter holds in a different representation (a mutable LispString) than the
  # compile paths, and it used to grow by a different rule.
  - name: vector-push-extend-growth-cross-backend
    source: |
      (defun ci-growth-run (cap n)
        (let ((v (make-array cap :fill-pointer 0 :adjustable t)))
          (dotimes (i n) (vector-push-extend i v))
          (array-dimension v 0)))
      (defun ci-growth-run-string (cap n)
        (let ((s (make-array cap :element-type 'character :fill-pointer 0 :adjustable t)))
          (dotimes (i n) (vector-push-extend #\a s))
          (array-dimension s 0)))
      (defun ci-growth-run-ext (cap n ext)
        (let ((v (make-array cap :fill-pointer 0 :adjustable t)))
          (dotimes (i n) (vector-push-extend i v ext))
          (array-dimension v 0)))
      (defun ci-growth ()
        (print (list (ci-growth-run 2 5) (ci-growth-run-string 2 5)
                     (ci-growth-run 0 1) (ci-growth-run 0 5)))
        (print (list (ci-growth-run-ext 2 3 100) (ci-growth-run-ext 2 5 1))))
      (ci-growth)
    expected: |
      (8 8 1 8)
      (102 5)
  # A slot the GROWTH opens is below the new DIMENSION but above the fill pointer, so aref
  # may read it, and it answers the array's remembered element type's own zero -- the same
  # fill make-array gives an unsupplied element (am.ik.rontolisp.ArrayElementTypes). The
  # character vector answers #\Space, this project's ONE character fill (SBCL 2.2.9 answers
  # #\Nul for a grown slot and #\Space for make-string; CLHS leaves it undefined, so one
  # rule for the whole surface wins -- .kb/array-literals.md). The general vector keeps NIL,
  # which is this project's answer for element type t and where SBCL answers 0. adjust-array
  # opens the same kind of slot and takes the same fill, through the same
  # %array-default-element the compile backends' growth uses.
  - name: opened-slot-fill-cross-backend
    source: |
      (defun ci-opened-push (cap n)
        (let ((v (make-array cap :fill-pointer 0 :adjustable t)))
          (dotimes (i n) (vector-push-extend i v))
          (aref v (1- (array-dimension v 0)))))
      (defun ci-opened-push-string (cap n)
        (let ((s (make-array cap :element-type 'character :fill-pointer 0 :adjustable t)))
          (dotimes (i n) (vector-push-extend #\a s))
          (char-code (aref s (1- (array-dimension s 0))))))
      (defun ci-opened-push-typed (cap n)
        (let ((f (make-array cap :element-type 'double-float :fill-pointer 0 :adjustable t))
              (b (make-array cap :element-type '(unsigned-byte 8) :fill-pointer 0 :adjustable t)))
          (dotimes (i n) (vector-push-extend 1.5d0 f))
          (dotimes (i n) (vector-push-extend 7 b))
