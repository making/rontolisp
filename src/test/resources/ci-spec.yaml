  - name: make-load-form-literal-object
    source: |
      ;; CLHS 3.2.4.4: an object a macro splices into its own expansion is dumped
      ;; through its own make-load-form method, not by structure -- which is the only
      ;; way one carrying a slot nothing can spell (the hash table here, a cffi foreign
      ;; type's keyword map in the field) reaches compiled code. The interpreter needs
      ;; none of it (its literal IS the live object), which is why the four agree.
      (defclass mlf-box () ((name :initarg :name :accessor mlf-box-name) (cache :initarg :cache)))
      (defmethod make-load-form ((b mlf-box) &optional env)
        (declare (ignore env))
        (list 'make-instance ''mlf-box :name (mlf-box-name b)))
      (defparameter *mlf-box* (make-instance 'mlf-box :name "dumped" :cache (make-hash-table)))
      (defmacro mlf-splice-box () *mlf-box*)
      (print (mlf-box-name (mlf-splice-box)))
      ;; make-load-form-saving-slots answers the creation form the compilers dump an
      ;; instance as, so a method delegating to it gets the built-in behavior.
      (defstruct mlf-pt x y)
      (defmethod make-load-form ((p mlf-pt) &optional env)
        (make-load-form-saving-slots p :environment env))
      (defparameter *mlf-pt* (make-mlf-pt :x 3 :y "four"))
      (defmacro mlf-splice-pt () *mlf-pt*)
      (print (make-load-form *mlf-pt*))
      (print (list (mlf-pt-x (mlf-splice-pt)) (mlf-pt-y (mlf-splice-pt))))
    expected: |
      "dumped"
      (%OBJ-NEW (QUOTE %struct-MLF-PT) (QUOTE 3) (QUOTE "four"))
      (3 "four")
  - name: setf-function-definitions
    source: |
