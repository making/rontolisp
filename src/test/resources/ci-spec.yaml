  # Wrapped in a defun (rather than bare top-level prints) so its body compiles into its own
  # JVM method; the cross-backend driver concatenates every case into one program and the JVM
  # caps a single method at 64 KiB, which the bare top-level forms were near.
  - name: every-some-remove-remove-if
    source: |
      (defun ci-every-some ()
        (print (every #'evenp '(2 4 6)))
        (print (every #'evenp '(2 3 6)))
        (print (some #'oddp '(2 4 5)))
        (print (some #'oddp '(2 4 6)))
        (print (remove 2 '(1 2 3 2 4)))
        (print (remove-if #'evenp '(1 2 3 4 5)))
        (print (remove-if-not #'evenp '(1 2 3 4 5)))
        (print (funcall #'remove 9 '(1 2 3))))
      (ci-every-some)
    expected: |
      T
      NIL
      T
      NIL
      (1 3 4)
      (1 3 5)
      (2 4)
      (1 2 3)
  - name: sort-is-linearithmic-and-stable
    source: |
      ;; 20,000 elements: instant for the shared merge sort, and out of reach for
      ;; the quadratic sort every backend used to carry (.kb/sort.md).
      (let ((ci-sort-data nil) (ci-sort-s 42))
        (dotimes (ci-sort-i 20000)
          (setq ci-sort-s (mod (+ (* ci-sort-s 1103515245) 12345) 2147483648))
          (setq ci-sort-data (cons ci-sort-s ci-sort-data)))
        (let ((ci-sort-out (sort ci-sort-data #'<)) (ci-sort-ordered t) (ci-sort-n 0))
          (do ((ci-sort-c ci-sort-out (cdr ci-sort-c))) ((null (cdr ci-sort-c)) nil)
            (if (> (car ci-sort-c) (car (cdr ci-sort-c))) (setq ci-sort-ordered nil)))
          (do ((ci-sort-c ci-sort-out (cdr ci-sort-c))) ((null ci-sort-c) nil)
            (setq ci-sort-n (+ ci-sort-n 1)))
          (print (list ci-sort-ordered ci-sort-n))))
      ;; The permutation of elements the predicate calls equal, identical on all four
      ;; backends because they run one algorithm.
      (print (sort (list (cons 1 'a) (cons 1 'b) (cons 0 'c) (cons 1 'd) (cons 0 'e))
                   (lambda (ci-sort-x ci-sort-y) (< (car ci-sort-x) (car ci-sort-y)))))
    expected: |
      (T 20000)
      ((0 . C) (0 . E) (1 . A) (1 . B) (1 . D))
