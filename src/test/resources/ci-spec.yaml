  # Nested backquote (once-only): three levels of read-time backquote, expanded
  # entirely by the reader. Prints only integers, so gensym names never surface
  # (the expansion-time gensym runs after every counter-printing case above).
  - name: nested-backquote-once-only
    source: |
      (defmacro ci-once-only (names &body body)
        (let ((gensyms (loop for name in names collect (gensym (symbol-name name)))))
          `(let (,@(loop for g in gensyms
                         for name in names
                         collect `(,g (gensym ,(symbol-name name)))))
             `(let (,,@(loop for g in gensyms for n in names
                             collect ``(,,g ,,n)))
                ,(let (,@(loop for n in names for g in gensyms
                               collect `(,n ,g)))
                   ,@body)))))
      (defmacro ci-square (x) (ci-once-only (x) `(* ,x ,x)))
      (defvar ci-oo-calls 0)
      (defun ci-oo-bump () (setq ci-oo-calls (+ ci-oo-calls 1)) 5)
      (print (ci-square (ci-oo-bump)))
      (print ci-oo-calls)
    expected: |
      25
      1
  - name: symbol-runtime-api
    source: |
      (print (symbol-name 'foo))
      (print (symbol-name :bar))
      (print (intern "SYM-API-HELLO"))
      (print (eq (intern "FOO") 'foo))
      (print (intern (symbol-name 'sym-api-round-trip)))
      (print (find-symbol "car"))
      (print (find-symbol "cond"))
      (print (find-symbol "SYM-API-NO-SUCH-NAME"))
      (print (make-symbol "SYM-API-TEMP"))
      (print (eq (make-symbol "FOO") 'foo))
      (defvar *sym-api-var* 42)
      (print (boundp '*sym-api-var*))
      (print (boundp '*sym-api-nope*))
      (print (boundp :sym-api-kw))
      (print (symbol-value '*sym-api-var*))
      (print (symbol-value (intern "*SYM-API-VAR*")))
      (print (symbol-value :sym-api-kw))
      (defun sym-api-fn (x) x)
      (print (fboundp 'sym-api-fn))
      (print (fboundp 'car))
      (print (fboundp 'cond))
      (print (fboundp 'sym-api-no-such-fn))
      (print (fboundp (intern "SYM-API-FN")))
      (print (mapcar #'symbol-name '(a b)))
      (print (string "sym-api-str"))
      (print (string 'sym-api-sym))
      (print (string #\z))
      (print (mapcar #'string '(a b)))
      ;; The case-folding designators must strip the package qualifier exactly as
      ;; string / symbol-name do -- the compiled backends used to drop only a
      ;; LEADING keyword colon, so (string-downcase 'pkg::test) kept "pkg::".
      ;; sxql renders a column name with that call (mito's migration DDL).
      (defpackage :sym-api-other (:use :cl))
      (print (list (string-downcase 'sym-api-other::test)
                   (string-upcase 'sym-api-other::test)
                   (string-capitalize 'sym-api-other::test)
                   (string-downcase :sym-api-kw)
                   (string-downcase "AbC")))
      ;; The three standard stream variables are BOUND to their seeded defaults
      ;; through the symbol API too, not only to a direct read: the compile
      ;; backends keep a special in two homes (the global cell / the eval
      ;; runtime's mirror) and only the first one used to be seeded, so
      ;; symbol-value signalled "unbound" here while the interpreter answered.
      ;; lack's backtrace middleware reaches *error-output* exactly this way --
      ;; it carries the SYMBOL and reports through (symbol-value output).
      (print (list (boundp '*error-output*) (symbol-value '*error-output*)
                   (boundp '*standard-output*) (symbol-value '*standard-output*)
                   (boundp '*standard-input*) (symbol-value '*standard-input*)))
      (defvar *sym-api-stream-name* '*error-output*)
      (print (symbol-value *sym-api-stream-name*))
      ;; find-symbol / intern answer the ANSI accessibility status as their SECOND
      ;; value, and it is nil exactly when the symbol is (the ANSI suite reads it
      ;; once per standard symbol). The literal name and the literal designator are
      ;; what the compile paths fold it against.
      (print (multiple-value-list (find-symbol "CAR" 'common-lisp)))
      (print (multiple-value-list (find-symbol "SYM-API-NO-SUCH-NAME" 'common-lisp)))
      (print (multiple-value-list (find-symbol "CAR")))
      (print (multiple-value-list (find-symbol "SYM-API-KW" :keyword)))
      (print (multiple-value-list (intern "CAR" "COMMON-LISP")))
      (print (symbol-plist 'sym-api-no-plist))
      (setf (get 'sym-api-plist 'a) 1)
      (print (symbol-plist 'sym-api-plist))
    expected: |
      "FOO"
      "BAR"
      SYM-API-HELLO
      T
      SYM-API-ROUND-TRIP
      NIL
      NIL
      NIL
      #:SYM-API-TEMP
      NIL
      T
      NIL
      T
      42
      42
      :SYM-API-KW
      T
      T
      T
      NIL
      T
      ("A" "B")
      "sym-api-str"
      "SYM-API-SYM"
      "z"
      ("A" "B")
      ("test" "TEST" "Test" "sym-api-kw" "abc")
      (T #<STREAM :HANDLE 2 :KIND :STANDARD> T T T T)
      #<STREAM :HANDLE 2 :KIND :STANDARD>
      (CAR :EXTERNAL)
      (NIL NIL)
      (CAR :INHERITED)
      (:SYM-API-KW :EXTERNAL)
      (CAR :EXTERNAL)
      NIL
      (A 1)
  - name: macro-function-and-special-operator-p
    source: |
      ;; Every operator with no function value is EITHER a special operator OR a
      ;; macro, and the two predicates agree on which -- exactly the decision an
      ;; assertion macro makes about the form it was handed (rove's form-inspect).
      ;; Verified form for form against SBCL 2.2.9.
      (defmacro mfp-mac (x) (list 'list x))
      (defun mfp-probe (form)
        (cond ((special-operator-p (first form)) :special)
              ((macro-function (first form)) :macro)
              (t :function)))
      (print (list (mfp-probe '(if a b)) (mfp-probe '(quote a)) (mfp-probe '(mfp-mac 1))
                   (mfp-probe '(when a b)) (mfp-probe '(handler-case a))
                   (mfp-probe '(car x)) (mfp-probe '(+ 1 2))))
      ;; defun and dolist are CL MACROS that rontolisp implements as special forms
      ;; of its own: special-operator-p is nil for them (a caller only ever asks
      ;; "may I apply this name") and macro-function answers for them instead.
      (print (list (special-operator-p 'if) (special-operator-p 'defun) (special-operator-p 'car)))
      (print (list (and (macro-function 'when) t) (and (macro-function 'mfp-mac) t)
                   (and (macro-function 'defun) t) (and (macro-function (intern "WHEN")) t)
                   (macro-function 'car) (macro-function 'if)))
      ;; macroexpand-1 answers CL's expanded-p as its second value.
      (print (multiple-value-list (macroexpand-1 '(mfp-mac 1))))
      (print (multiple-value-list (macroexpand-1 '(+ 1 2))))
    expected: |
      (:SPECIAL :SPECIAL :MACRO :MACRO :MACRO :FUNCTION :FUNCTION)
      (T NIL NIL)
      (T T T T NIL NIL)
      ((LIST 1) T)
      ((+ 1 2) NIL)
