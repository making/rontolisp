  # The s-sql enablement group: the ~^ iteration escape, the
  # *standard-output* redirect of the stream-argument-less print family, the
  # readtable-case :upcase stub, intern into a found package, the sequential
  # loop `= then` referencing a LATER in-driver (strcat's position loop), and
  # the specialized (vector (unsigned-byte 8)) typep -- identical on all four
  # backends.
  - name: s-sql-enablement-language-group
    source: |
      (print (format nil "~{~a~^, ~}" '(1 2 3)))
      (print (format nil "~:['{}'~;ARRAY[~:*~{~A~^, ~}]~]" '(10 20)))
      (print (format nil "~:['{}'~;ARRAY[~:*~{~A~^, ~}]~]" nil))
      (defun ci-emit-name () (princ "foo") (write-char #\.) (write-string "bar"))
      (print (with-output-to-string (*standard-output*)
               (ci-emit-name)
