  # The restart system: handler-bind handlers run at the SIGNAL POINT
  # (before unwinding) and can invoke a restart established in another function;
  # the transfer lands back in the restart-case frame and runs the clause inline
  # (so a (go start) clause re-enters the enclosing tagbody). This case's presence
  # flips the whole concatenated program into restart mode, which every other
  # case's expectations must survive -- the signal hook is a no-op without
  # established handlers.
  - name: restart-system
    source: |
      (defun ci-rs-f ()
        (restart-case (progn (error "boom") :not-reached)
          (:reconnect (x) (list :reconnected x))))
      (print (handler-bind ((error (lambda (c) (invoke-restart :reconnect 42))))
               (ci-rs-f)))
      (defun ci-rs-retry (c)
        (let ((r (find-restart 'ci-retry-me c)))
          (if (null r) :none (invoke-restart r))))
      (print (handler-bind ((error (lambda (c) (ci-rs-retry c))))
               (let ((ci-rs-n 0))
                 (tagbody start
                   (restart-case
                       (progn (setq ci-rs-n (+ ci-rs-n 1)) (when (< ci-rs-n 3) (error "again")))
                     (ci-retry-me () (go start))))
                 ci-rs-n)))
      (print (handler-bind ((error (lambda (c) (invoke-restart :five 1 2 3 4 5))))
               (restart-case (error "x")
                 (:five (a b c d e) (list a b c d e)))))
      (print (handler-bind ((error (lambda (c) (continue))))
               (list :after (cerror "Continue." "problem"))))
      (print (handler-bind ((error (lambda (c) (invoke-restart 'ci-skip))))
               (multiple-value-list (with-simple-restart (ci-skip "Skip it") (error "x")))))
      (print (handler-bind ((warning (lambda (w) (muffle-warning))))
               (list :done (warn "noise"))))
      (print (let ((ci-rs-hit nil))
               (restart-bind ((ci-poke (lambda (v) (setq ci-rs-hit v))))
                 (invoke-restart 'ci-poke 9)
                 ci-rs-hit)))
      (print (restart-case (mapcar (function restart-name) (compute-restarts))
               (ci-aaa () nil)
               (ci-bbb () nil)))
      (print (restart-case (progn (abort) :not-reached) (abort () :aborted)))
      (print (find-restart 'ci-retry-me))
      ;; The handlers run ONCE per condition (the %hb-guard landing
      ;; pad recognizes the signal hook's walk by identity), handler-case
      ;; dispatches on the IDENTICAL instance the handlers saw, and declining
      ;; clusters run innermost-first exactly once each.
      (print (let ((ci-hb-seen nil) (ci-hb-n 0))
               (handler-case
                   (handler-bind ((error (lambda (c) (setq ci-hb-n (+ ci-hb-n 1)) (setq ci-hb-seen c))))
                     (error "boom"))
                 (error (e) (list :caught (eq e ci-hb-seen) ci-hb-n)))))
      (print (let ((ci-hb-log nil))
               (handler-case
                   (handler-bind ((error (lambda (c) (setq ci-hb-log (cons :outer ci-hb-log)))))
                     (handler-bind ((error (lambda (c) (setq ci-hb-log (cons :inner ci-hb-log)))))
                       (error 'type-error :datum 1 :expected-type 'cons)))
                 (type-error (e) (cons :caught ci-hb-log)))))
      ;; Handlers run MOST RECENT FIRST and handler-case transfers
      ;; control, so a handler-case established inside a handler-bind's extent
      ;; handles the condition and the enclosing handler never runs -- unless no
      ;; clause of it matches, or the signal comes from a clause body of its own.
      (print (block ci-hb-b
               (handler-bind ((error (lambda (e) (return-from ci-hb-b :outer-ran))))
                 (handler-case (error "boom") (error () :caught)))))
      (print (block ci-hb-b
               (handler-bind ((error (lambda (e) (return-from ci-hb-b :outer-ran))))
                 (ignore-errors (error "boom")))))
      (print (block ci-hb-b
               (handler-bind ((error (lambda (e) (return-from ci-hb-b :outer-ran))))
                 (handler-case (error "boom") (end-of-file () :caught)))))
      (print (block ci-hb-b
               (handler-bind ((error (lambda (e) (return-from ci-hb-b :outer-ran))))
                 (handler-case (error "boom") (error () (error "again"))))))
    expected: |
      (:RECONNECTED 42)
      3
      (1 2 3 4 5)
      (:AFTER NIL)
      (NIL T)
      (:DONE NIL)
      9
      (CI-AAA CI-BBB)
      :ABORTED
      NIL
      (:CAUGHT T 1)
      (:CAUGHT :OUTER :INNER)
      :CAUGHT
      NIL
      :OUTER-RAN
      :OUTER-RAN
  # A catching form in an ARGUMENT position: the enclosing call has operands live
  # when the protected region begins, and entering a handler discards them (on the
  # JVM the compiler spills them around the region). The float case keeps a raw
  # two-slot double there, and the return abandons them altogether.
  - name: handler-case-in-argument-position
    source: |
      (defun ci-hc-arg-risky (x) (if (= x 2) (error "boom") x))
      (print (list "result:" (handler-case (ci-hc-arg-risky 2) (error (e) "caught"))))
      (print (+ 1.5 (handler-case (ci-hc-arg-risky 2) (error (e) 2.0))))
      (print (list "r:" (ignore-errors (ci-hc-arg-risky 2)) (ignore-errors 42)))
      (print (mapcar (lambda (x) (list x (handler-case (ci-hc-arg-risky x) (error (e) :err))))
                     (list 1 2 3)))
      (print (list "outer"
                   (dolist (x (list 1 2 3))
                     (print (list "seen" (handler-case (ci-hc-arg-risky x)
                                           (error (e) (return :caught))))))))
    expected: |
      ("result:" "caught")
      3.5
      ("r:" NIL 42)
      ((1 1) (2 :ERR) (3 3))
      ("seen" 1)
      ("outer" :CAUGHT)
  # The cl-base64 integration residue: the language features the library forced --
  # locally, cerror (lite, not continuable), in-place string setf via schar/char
  # (setq-rebuild lowering on the compiled backends), a string as a rank-1
  # character array (make-array :element-type 'character = make-string; aref reads
  # a character), write-char, make-array :initial-contents, and the marker-free
  # symbol-name/princ spelling of keywords.
  - name: cl-base64-residue-features
    source: |
      (print (locally (declare (optimize (speed 3))) (+ 40 2)))
      (print (handler-case (cerror "Continue." "cb64 bad ~a" 7) (error (e) :cerror-caught)))
      (let ((cb64-s (make-string 3 :initial-element #\a)))
        (setf (schar cb64-s 1) #\b)
        (print cb64-s))
      (let ((cb64-t (make-array 2 :element-type 'character :initial-element #\x)))
        (setf (char cb64-t 0) #\y)
        (print cb64-t))
      (print (aref "abc" 1))
      (write-char #\o)
      (write-char #\k)
      (terpri)
      (let ((cb64-a (make-array 3 :initial-contents '(10 20 30))))
        (print (aref cb64-a 2)))
      (print (symbol-name :cb64-kw))
      (print (princ-to-string :cb64-kw))
    expected: |
      42
      :CERROR-CAUGHT
      "aba"
      "yx"
      #\b
      ok
      30
      "CB64-KW"
      "CB64-KW"
