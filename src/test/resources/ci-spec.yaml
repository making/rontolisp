  # list.
  - name: lambda-list-extensions
    source: |
      (defun ll-rest (a &rest r) (list a r))
      (print (ll-rest 1 2 3))
      (print (ll-rest 1))
      (defun ll-opt (x &optional (y 10) (z (* y 2) zp)) (list x y z zp))
      (print (ll-opt 1))
      (print (ll-opt 1 2))
