  # linalg single-float (see .kb/linalg.md): linalg is width-polymorphic -- a constructor opts
  # into packed single-float (#f) with an :element-type keyword (double stays the default
  # for precision), and every transform PRESERVES the input width, so a #f value flowing
  # in (e.g. from vec:) is never silently widened back to double (which would force a
  # mixed-width --simd error on the next vec:matvec). Unlike the earlier vec::%make-like
  # assumption, wasm-GC produces #f directly -- both linalg::%la-make branches take a
  # literal :element-type, so the compiled backend picks the TYPE_F32ARR/F64ARR repr
  # statically -- and the output is byte-identical on all four backends, using only
  # f32-EXACT values (integers / halves) so the WASM float printer agrees. Reductions
  # fold to an f64 scalar; the last two element-type probes pin width-preservation vs the
  # double default.
  - name: linalg-single-float-cross-backend
    source: |
      (defun ci-linalg-single ()
        (print (linalg:zeros '(2 2) :element-type 'single-float))
        (print (linalg:zeros '(2 2)))
        (print (linalg:eye 2 :element-type 'single-float))
        (print (linalg:arange 0 8 2 :element-type 'single-float))
        (print (linalg:from-list '((1 2) (3 4)) :element-type 'single-float))
