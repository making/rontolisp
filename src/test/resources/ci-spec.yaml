    source: |
      (deftype rtea-octet () '(unsigned-byte 8))
      (deftype rtea-buffer () 'rtea-octet)
      (deftype rtea-char () 'character)
      (defun rtea-mk (et n) (make-array n :element-type et))
      (defun rtea-mkfp (et) (make-array 4 :element-type et :fill-pointer 2))
      (print (list (array-element-type (rtea-mk 'rtea-octet 4))
