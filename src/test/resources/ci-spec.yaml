  # A runtime (export ...) is consumed by the PackageResolver like use-package, so the
  # names it publishes resolve on every backend, on either side of the definitions it
  # publishes (see export-after-the-definitions below).
  - name: export-and-unexport
    source: |
      (defpackage :ci-exp (:use :cl))
      (in-package :ci-exp)
      (export '(ci-exp-run))
      (defun ci-exp-run () 42)
      (in-package :cl-user)
      (print (ci-exp:ci-exp-run))
      (defpackage :ci-unexp (:use :cl) (:export :ci-unexp-a :ci-unexp-b))
      (in-package :ci-unexp)
      (unexport 'ci-unexp-b)
      (defun ci-unexp-a () 1)
      (defun ci-unexp-b () 2)
      (in-package :cl-user)
      (print (+ (ci-unexp:ci-unexp-a) (ci-unexp::ci-unexp-b)))
    expected: |
      42
      3
  # export grants ACCESSIBILITY and never re-keys the symbol: a defun/defvar/setf-function
  # made BEFORE the export is reachable through the external spelling afterwards. The
  # everyday CL file shape -- define, then export at the end.
  - name: export-after-the-definitions
    source: |
      (defpackage :ci-late (:use :cl))
      (defun ci-late::my-fn (x) (* x 2))
      (defvar ci-late::*ci-late-v* 7)
      (defun (setf ci-late::slot) (v c) (rplaca c v) v)
      (export '(ci-late::my-fn ci-late::*ci-late-v* ci-late::slot) :ci-late)
      (print (ci-late:my-fn 21))
      (print ci-late:*ci-late-v*)
      (let ((c (list 1 2)))
        (setf (ci-late:slot c) 9)
        (print (car c)))
    expected: |
      42
      7
      9
  # The runtime spelling of defpackage's :import-from clause, and the three package
  # registry queries: the interpreter reads its live registry, the compile paths a
  # table baked in at compile time -- so all four backends must print the same thing.
  - name: package-import-and-registry-queries
    source: |
      (defpackage :ci-imp-src (:use :cl) (:export :ci-imp-pub))
      (in-package :ci-imp-src)
      (defun ci-imp-pub () 1)
      (defun ci-imp-priv () 2)
      (in-package :cl-user)
      (import 'ci-imp-src:ci-imp-pub)
      (import '(ci-imp-src::ci-imp-priv))
      (print (+ (ci-imp-pub) (ci-imp-priv)))
      (defpackage :ci-pql (:use :cl :ci-imp-src))
      (print (package-use-list :ci-pql))
      (print (package-used-by-list :ci-pql))
      (print (package-use-list :cl))
      (print (package-shadowing-symbols :cl-user))
      (print (car (member :ci-pql (list-all-packages))))
      (defun ci-pql-use (p) (package-use-list p))
      (print (ci-pql-use (find-package "CI-IMP-SRC")))
      (print (mapcar #'package-name (funcall #'package-use-list :ci-pql)))
    expected: |
      3
      (:CL :CI-IMP-SRC)
      NIL
      NIL
      NIL
      :CI-PQL
      (:CL)
      ("CL" "CI-IMP-SRC")
  # remprop, the plist REMOVER: one prelude defun over the same %symbol-plists store
  # get / (setf get) / symbol-plist share.
  - name: symbol-plist-remprop
    source: |
      (setf (get 'ci-rp 'a) 1)
      (setf (get 'ci-rp 'b) 2)
      (setf (get 'ci-rp 'c) 3)
      (print (list (remprop 'ci-rp 'b) (symbol-plist 'ci-rp) (remprop 'ci-rp 'zz)
                   (remprop 'ci-rp 'c) (symbol-plist 'ci-rp) (get 'ci-rp 'a)))
      (print (remprop 'ci-rp-none 'x))
    expected: |
      (T (C 3 A 1) NIL T (A 1) 1)
      NIL
  # The clack-enablement batch that CAN be cross-backend: substitute-if (lack/util's
  # runtime middleware-name build), sleep (clack.handler's stop) and the load-context
  # specials clack's %load-file rebinds. file-write-date / file-length /
  # ensure-directories-exist are deliberately NOT here: they diverge on WASM by design
  # (.kb/read-load-streams.md).
  - name: clack-enablement-builtins
    source: |
      (print (substitute-if #\- (lambda (c) (member c '(#\. #\/) :test 'char=)) "lack/mw.backtrace"))
      (print (substitute-if 0 #'oddp '(1 2 3 4 5)))
      (print (substitute-if-not 0 #'oddp '(1 2 3 4 5)))
      (print (substitute-if 0 #'oddp '((1) (2) (3)) :key #'car))
      (print (nsubstitute-if 0 #'oddp (list 1 2 3)))
      (print (nsubstitute-if-not 0 #'oddp (list 1 2 3)))
      (print (funcall #'substitute-if 0 #'oddp '(1 2 3)))
