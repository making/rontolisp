  # symbol-macrolet: shadow-aware substitution shared by every backend
  # (LispMacroExpander.expandSymbolMacrolet) -- substitution, let-shadowing,
  # nesting, setq write-through, the dbi setf-through-slot-value shape, and a
  # lambda-body reference.
  - name: symbol-macrolet-substitution-and-setf
    source: |
      (symbol-macrolet ((ci-sm-x 42)) (print (list (let ((ci-sm-x 1)) ci-sm-x) ci-sm-x)))
      (symbol-macrolet ((ci-sm-x 1)) (symbol-macrolet ((ci-sm-x 2)) (print ci-sm-x)))
      (let ((ci-sm-cell (list 1 2)))
        (symbol-macrolet ((ci-sm-head (car ci-sm-cell)))
          (setq ci-sm-head 99)
          (print ci-sm-cell)))
      (defclass ci-sm-conn () ((ci-sm-auto-commit :initform nil)))
      (defvar *ci-sm-c* (make-instance 'ci-sm-conn))
      (symbol-macrolet ((ci-sm-ac (slot-value *ci-sm-c* 'ci-sm-auto-commit)))
        (setf ci-sm-ac 'on)
        (print ci-sm-ac))
      (let ((ci-sm-n 10))
        (symbol-macrolet ((ci-sm-big (* ci-sm-n ci-sm-n)))
          (print (funcall (lambda () ci-sm-big)))))
    expected: |
      (1 42)
      2
      (99 2)
      ON
      100
  # define-symbol-macro is the GLOBAL sibling: the definition is dropped on the
  # compile paths and every later top-level form substituted, while the interpreter
  # consults its table at the reference. Reads, setq/setf/incf write-through, a
  # reference inside a defun, and a let of the name shadowing it.
  - name: define-symbol-macro-read-and-write
    source: |
      (defvar *ci-dsm-buf* (make-array 3 :initial-element 0))
      (define-symbol-macro ci-dsm-slot0 (aref *ci-dsm-buf* 0))
      (setf ci-dsm-slot0 42)
      (setq ci-dsm-slot0 (+ ci-dsm-slot0 1))
      (defun ci-dsm-bump () (incf ci-dsm-slot0))
      (ci-dsm-bump)
      (print (list ci-dsm-slot0 *ci-dsm-buf*))
      (print (let ((ci-dsm-slot0 7)) ci-dsm-slot0))
    expected: |
      (44 #(44 0 0))
      7
  # ',@xs in a backquote template = (quote ,@xs) = (cons 'quote xs): the
  # one-element splice yields 'x (trivia level0's `(equal ,*what* ',@args)),
