  # The geom package (solid modeling over linalg, .kb/geom.md): the primitives, the
  # measurements and the cached model-space mesh. Everything here is float32 and every
  # number a renderer would use comes out of trigonometry, which is exactly where four
  # backends could disagree -- so the closed-form volumes are printed as ROUNDED
  # integers (the polyhedral approximation converges from below, and a facet wound the
  # wrong way would SUBTRACT from the divergence-theorem sum rather than shave a
  # percent). The exact prints -- a box's volume and area, its bounds and centroid, the
  # 120.0 prism -- are f32-exact, so they pin the packed single-float printer too.
  - name: geom-solids-cross-backend
    source: |
      (defun ci-geom-solids ()
        (let ((b (geom:box '(100 200 300))))
          (print (geom:volume b))
          (print (geom:surface-area b))
          (print (geom:centroid b))
          (print (geom:bounds-extent (geom:bounds b)))
          (print (geom:mesh-triangle-count b))
          (print (length (geom:wireframe b)))
          (print (eq (geom:mesh b) (geom:mesh b)))
          (print (array-element-type (geom:mesh b)))
          (print (array-element-type (geom:vertices-of b))))
        (print (geom:volume (geom:extrusion '((0 0 0) (4 0 0) (4 3 0) (0 3 0)) :along 10)))
        (print (round (* 6 (geom:volume (geom:polyhedron '((0 0 0) (1 0 0) (0 1 0) (0 0 1))
                                                         '((0 2 1) (0 1 3) (0 3 2) (1 2 3)))))))
        (print (round (geom:volume (geom:cylinder :radius 50 :height 100 :sides 64))))
        (print (round (geom:volume (geom:sphere :radius 50 :sides 32 :stacks 24))))
        (print (round (geom:volume (geom:torus :radius 60 :tube 20 :sides 48 :rings 24))))
        (print (round (geom:volume (geom:cone :radius 50 :height 120 :sides 64))))
        (print (round (geom:surface-area (geom:sphere :radius 50 :sides 32 :stacks 24))))
        ;; A torus's cross-section is CLOSED, so geom:revolution caps neither end:
        ;; sides * rings quads and nothing else. Capping it laid two coincident
        ;; discs across the hole, which the volume above cannot see -- they wind
        ;; opposite ways and cancel -- while the area doubles and a renderer draws
        ;; a filled disc (.kb/geom.md, "The winding convention").
        (print (length (geom:facets-of (geom:torus :radius 60 :tube 20 :sides 48 :rings 24))))
        (print (round (geom:surface-area (geom:torus :radius 60 :tube 20 :sides 48 :rings 24))))
        (let ((s (geom:box 10)))
          (setf (geom:user-data s) :mine)
          (geom:nscale s 2)
          (print (list (geom:user-data s) (geom:volume s)))))
      (ci-geom-solids)
    expected: |
