      (let ((ci-up-log nil))
        (print (handler-case
                   (unwind-protect (error "boom") (setq ci-up-log (cons :cleaned ci-up-log)))
                 (error (e) (cons :caught ci-up-log)))))
      (print (dolist (x (list 1 2 3))
               (handler-case (when (= x 2) (return :done)) (error (e) :err))))
      (print (signal "after"))
      (let ((ci-up-log2 nil))
        (dolist (x (list 1))
          (unwind-protect
              (unwind-protect (return :nested)
                (setq ci-up-log2 (cons :inner ci-up-log2)))
            (setq ci-up-log2 (cons :outer ci-up-log2))))
        (print ci-up-log2))
      (print (ignore-errors (error "x")))
      (print (ignore-errors (+ 40 2)))
