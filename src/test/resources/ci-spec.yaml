      (:RIGHT 1)
      (:A :B :DEFAULT)
      (:B :A :DEFAULT)
  - name: clos-setf-methods-and-setf-generic
    source: |
      (defclass csm-a () ((x :initarg :x :accessor csm-val)))
      (defclass csm-b () ((log :initform nil :reader csm-log)))
      (defmethod (setf csm-val) (new (b csm-b)) (setf (slot-value b 'log) (list :wrote new)) new)
      (let ((a (make-instance 'csm-a :x 1))
