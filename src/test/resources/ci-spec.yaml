  - name: packages-cl-user-default-uses-cl-and-the
    source: |
      ;; *package* holds the package KEYWORD find-package answers (so the two are eq),
      ;; and is a genuine dynamic variable: read when the form RUNS, assigned by
      ;; in-package, let-bindable, bound to CL-USER by with-standard-io-syntax.
      (print *package*)
      (print (eq *package* (find-package "CL-USER")))
      (print (car (rontolisp:version)))
      (in-package rontolisp)
      (cl:print cl:*package*)
      (cl:print (cl:car (version)))
      (cl:in-package :cl-user)
      (defvar *ci-suites* (make-hash-table :test 'eq))
      (defun ci-package-suite (package)
        (or (gethash package *ci-suites*)
            (setf (gethash package *ci-suites*) (list :suite (package-name package)))))
      (defun ci-set-test (name)
        (push name (cdr (ci-package-suite *package*)))
        name)
      (defun ci-current-package () *package*)
      (defpackage :ci-app/tests (:use :cl))
      (in-package :ci-app/tests)
      (cl-user::ci-set-test 'test-a)
      (cl-user::ci-set-test 'test-b)
      (print (cl-user::ci-current-package))
      (print (let ((*package* (find-package :cl-user))) (cl-user::ci-current-package)))
      (print (cl-user::ci-current-package))
      (print (with-standard-io-syntax (cl-user::ci-current-package)))
      (print (gethash (find-package "CI-APP/TESTS") cl-user::*ci-suites*))
      (in-package :cl-user)
      (print (ci-current-package))
    expected: |
      :CL-USER
      T
      :VERSION
      :RONTOLISP
      :VERSION
      :CI-APP/TESTS
      :CL-USER
      :CI-APP/TESTS
      :CL-USER
      (:SUITE CI-APP/TESTS::TEST-B CI-APP/TESTS::TEST-A "CI-APP/TESTS")
      :CL-USER
  - name: package-defmethod-specializer
    source: |
      ;; `package` is a defmethod specializer sharing the package TYPE test (a keyword
      ;; naming a registered package), and ranks ahead of keyword/symbol: rove's
      ;; find-suite pairs a (package) method with an unspecialized DESIGNATOR method
      ;; that calls find-package and recurses.
      (defvar *ci-rove-suites* (make-hash-table :test 'equal))
      (defgeneric ci-find-suite (package)
        (:method ((package package))
          (values (gethash package *ci-rove-suites*)))
        (:method (package-name)
          (check-type package-name string-designator)
          (let ((package (find-package package-name)))
            (unless package (error "No package '~A' found" package-name))
            (ci-find-suite package))))
      (setf (gethash :ci-app/tests *ci-rove-suites*) "suite")
      (print (ci-find-suite :ci-app/tests))
      (print (ci-find-suite "CI-APP/TESTS"))
      (print (ci-find-suite 'ci-app/tests))
      (defgeneric ci-spec-kind (x))
      (defmethod ci-spec-kind ((x symbol)) :symbol)
      (defmethod ci-spec-kind ((x keyword)) :keyword)
      (defmethod ci-spec-kind ((x package)) :package)
      (defmethod ci-spec-kind (x) :other)
      (print (list (ci-spec-kind :ci-app/tests) (ci-spec-kind :no-such-pkg-xyz)
                   (ci-spec-kind 'ci-app/tests) (ci-spec-kind 42)))
    expected: |
      "suite"
      "suite"
      "suite"
      (:PACKAGE :KEYWORD :SYMBOL :OTHER)
  - name: runtime-class-designator-spellings
    source: |
      ;; rove's make-reporter names its class by INTERNING it: (make-instance
      ;; (intern (format nil "~A-~A" style '#:reporter) package) ...). The compile
      ;; paths carry no package registry at run time, so intern always builds the
      ;; single-colon EXTERNAL spelling (CI-RCD:SPEC-REP) while the class is
      ;; registered as CI-RCD::SPEC-REP -- every generated designator dispatch
      ;; (make-instance, find-class, typep, subtypep, the condition-class arm of
      ;; error) answers to both, so the class need not be exported.
      (defpackage :ci-rcd (:use :cl))
      (in-package :ci-rcd)
      (defclass spec-rep () ((s :initarg :s)))
      (defclass sub-rep (spec-rep) ())
      (define-condition rcd-err (error) ((k :initarg :k)))
      (defun ci-make-rep (style package)
        (make-instance (intern (format nil "~A-~A" style '#:rep) package) :s 7))
      (in-package :cl-user)
      (let ((n (intern "SPEC-REP" :ci-rcd)))
        (print (slot-value (ci-rcd::ci-make-rep '#:spec (find-package :ci-rcd)) 's))
        (print (eq (find-class n) (find-class 'ci-rcd::spec-rep)))
        (print (typep (make-instance n :s 1) n))
        (print (subtypep (intern "SUB-REP" :ci-rcd) n))
        (print (handler-case (error (intern "RCD-ERR" :ci-rcd) :k 5)
                 (ci-rcd::rcd-err (c) (slot-value c 'k)))))
    expected: |
      7
      T
      T
      T
      5
  - name: type-of-foreign-package-class-name
    source: |
      ;; type-of peels the %class- / %struct- tag off %class-designator and INTERNS
      ;; the remainder, which for a class defined in another package is already a
      ;; canonical PKG:NAME spelling (rove prints (type-of (assertion-reason f)) in
      ;; its failure report). The interpreter used to home that whole string into
      ;; the CURRENT package -- CI-TOF-APP::CI-TOF-LIB:WIDGET, so (eq (type-of x)
      ;; 'ci-tof-lib:widget) was NIL there and T on the compile paths, whose intern
      ;; is package-blind. All four keep the spelling now, single colon for an
      ;; exported class and double for an internal one, agreeing with class-name.
      (defpackage :ci-tof-lib (:use :cl) (:export :widget :make-w))
      (in-package :ci-tof-lib)
      (defclass widget () ())
      (defclass gadget () ())
      (defstruct point x y)
      (defun make-w () (make-instance 'widget))
      (defun make-g () (make-instance 'gadget))
      (defpackage :ci-tof-app (:use :cl))
      (in-package :ci-tof-app)
      (print (list (type-of (ci-tof-lib:make-w))
                   (type-of (ci-tof-lib::make-g))
                   (type-of (ci-tof-lib::make-point :x 1 :y 2))))
      (print (list (eq (type-of (ci-tof-lib:make-w)) 'ci-tof-lib:widget)
                   (eq (type-of (ci-tof-lib::make-g)) 'ci-tof-lib::gadget)
                   (eq (type-of (ci-tof-lib::make-point :x 1 :y 2)) 'ci-tof-lib::point)
                   (eq (type-of (ci-tof-lib:make-w))
                       (class-name (class-of (ci-tof-lib:make-w))))
                   (type-of 42)))
      (in-package :cl-user)
    expected: |
      (CI-TOF-LIB:WIDGET CI-TOF-LIB::GADGET CI-TOF-LIB::POINT)
      (T T T T INTEGER)
  - name: lisp-2-function-namespace-via-function
