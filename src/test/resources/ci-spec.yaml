      (defclass clos-mi-base () ((v :initform :base :reader clos-mi-v)))
      (defclass clos-mi-l (clos-mi-base) ())
      (defclass clos-mi-r (clos-mi-base) ((v :initform :right)))
      (defclass clos-mi-d (clos-mi-l clos-mi-r) ())
      (print (list (clos-mi-v (make-instance 'clos-mi-d)) (length (%obj-slots (make-instance 'clos-mi-d)))))
      (defgeneric clos-mi-trace (o))
      (defmethod clos-mi-trace ((o clos-mi-a)) (cons :a (if (next-method-p) (call-next-method) nil)))
      (defmethod clos-mi-trace ((o clos-mi-b)) (cons :b (if (next-method-p) (call-next-method) nil)))
      (defmethod clos-mi-trace (o) (list :default))
      (defclass clos-mi-ba (clos-mi-b clos-mi-a) ())
      (print (clos-mi-trace (make-instance 'clos-mi-c :x 1 :y 2 :z 3)))
      (print (clos-mi-trace (make-instance 'clos-mi-ba)))
    expected: |
