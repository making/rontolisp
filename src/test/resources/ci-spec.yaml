      (print (map-into (list nil nil nil) '1+ '(7 8 9)))
      (print (map-into (list 0 0 0) (lambda () 42)))
      (print (map-into (list 0 0 0) #'+ #(1 2 3) '(10 20 30)))
      (print (map-into (make-array 3) #'+ '(1 2 3) #(10 20 30)))
      (print (length (map-into (make-list 20000) (lambda (x) 1) (make-list 20000))))
      ;; #'map-into taken as a VALUE runs a separate body from the call-position
      ;; lowering, and its store into a LIST destination was (setf (elt r i) v) --
      ;; an O(i) head-walk per element. It now walks the destination with a cons
      ;; cursor and keeps the indexed store for every other representation, so the
      ;; two spellings must answer the same thing for each of them.
      (print (funcall #'map-into (list 0 0 0 0) #'+ '(1 2 3) '(10 20 30 40)))
      (print (funcall #'map-into (make-array 3) #'* #(2 3 4) #(5 6 7)))
