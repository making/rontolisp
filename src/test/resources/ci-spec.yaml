  - name: clos-method-qualifiers-and-call-next-method
    source: |
      (defclass clos-mc-animal () ())
      (defclass clos-mc-dog (clos-mc-animal) ())
      (defparameter *clos-mc-log* nil)
      (defgeneric clos-mc-touch (x))
      (defmethod clos-mc-touch ((x clos-mc-animal)) (push :primary-animal *clos-mc-log*) :done)
      (defmethod clos-mc-touch ((x clos-mc-dog)) (push :primary-dog *clos-mc-log*) (call-next-method))
      (defmethod clos-mc-touch :before ((x clos-mc-animal)) (push :before-animal *clos-mc-log*))
      (defmethod clos-mc-touch :before ((x clos-mc-dog)) (push :before-dog *clos-mc-log*))
      (defmethod clos-mc-touch :after ((x clos-mc-animal)) (push :after-animal *clos-mc-log*))
      (defmethod clos-mc-touch :after ((x clos-mc-dog)) (push :after-dog *clos-mc-log*))
      (defmethod clos-mc-touch :around ((x clos-mc-animal)) (list :around (call-next-method) (next-method-p)))
      (print (clos-mc-touch (make-instance 'clos-mc-dog)))
      (print (reverse *clos-mc-log*))
    expected: |
      (:AROUND :DONE T)
      (:BEFORE-DOG :BEFORE-ANIMAL :PRIMARY-DOG :PRIMARY-ANIMAL :AFTER-ANIMAL :AFTER-DOG)
  - name: pathname-family-and-broadcast-streams
    source: |
      ;; The pathname DECOMPOSITION rule: the LAST dot separates the type, and a
      ;; dot at position 0 does not. One rendering (%pathname-split) is read by
      ;; pathname-name, pathname-type AND make-pathname's :defaults defaulting.
      (print (mapcar #'pathname-name (list "d/a.sql" "d/a" "d/.a" "d/a.b.c" "a.sql" ".sql" "d/")))
      (print (mapcar #'pathname-type (list "d/a.sql" "d/a" "d/.a" "d/a.b.c" "a.sql" ".sql" "d/")))
      ;; make-pathname at RUN time: a computed :name and :defaults is
      ;; the shape the compile-time folder declines. :defaults defaults
      ;; COMPONENT-WISE, so the "sql" type survives a :name-only call; the value
      ;; is a pathname, printing as #P"..." under prin1.
      (defun pn-down (up) (make-pathname :name (concatenate 'string (pathname-name up) ".down") :defaults up))
      (print (pn-down "db/migrations/20260101.up.sql"))
      (print (make-pathname :directory (list :absolute "u" "s") :name "b" :type "c"))
      ;; A pathname is a DISTINCT value carrying its namestring: a
      ;; string is not one, #P"..." denotes one, and the predicates, typecase
      ;; discrimination and the printer (prin1 #P + escaped namestring, princ the
      ;; bare namestring, nested elements included) all agree with SBCL.
      (print (list (pathnamep "/tmp/x") (pathnamep 1) (pathnamep #P"/tmp/x") (typep "/tmp/x" 'pathname)
                   (typep #P"/tmp/x" 'pathname) (typep #P"x" 'structure-object)))
      (print (etypecase #P"a.sql" (null :none) (pathname :path)))
      (print (typecase "text" (pathname :path) (t :content)))
      (print (typecase #P"f.json" (pathname :path) (t :content)))
      (print (list (namestring "d/x") (namestring #P"d/x") (pathname "d/x")))
      (princ (list #P"a b" "s"))
      (terpri)
      (print (list (equal #P"a" #P"a") (equal #P"a" "a") (equalp #P"a" #P"a")))
      (print (multiple-value-list (parse-namestring "d/a.txt")))
      (print (merge-pathnames #P"b.txt" #P"d/a.sql"))
      ;; lack's finalize-response body cond, verbatim: a STRING takes the wrap
      ;; branch, a pathname passes through.
      (defun body-shape (body)
        (cond ((or (consp body) (pathnamep body) (and (not (stringp body)) (vectorp body)))
               (list body))
              (t (list (list body)))))
      (print (list (body-shape "hello") (body-shape #P"f.txt") (body-shape (list "x"))))
      ;; make-broadcast-stream WITH components: a Gray output stream looping them.
      (let* ((s (make-string-output-stream))
             (b (make-broadcast-stream *standard-output* s)))
        (format b "fan~A~%" 1)
        (write-string "out
      " b)
        (print (get-output-stream-string s)))
      ;; and with NO components: the discarding sink, a string-stream VALUE (it is
      ;; a fresh string output stream nobody reads) and not an integer.
      (print (list (typep (make-broadcast-stream) 'integer)
                   (streamp (make-broadcast-stream))
                   (typep (make-broadcast-stream) 'string-stream)))
    expected: |
      ("a" "a" ".a" "a.b" "a" ".sql" NIL)
      ("sql" NIL NIL "c" "sql" NIL NIL)
      #P"db/migrations/20260101.up.down.sql"
      #P"/u/s/b.c"
      (NIL NIL T NIL T NIL)
      :PATH
      :CONTENT
      :PATH
      ("d/x" "d/x" #P"d/x")
      (a b s)
      (T NIL T)
      (#P"d/a.txt" 7)
      #P"d/b.txt"
      ((("hello")) (#P"f.txt") (("x")))
      fan1
      out
      "fan1
      out
      "
      (NIL T T)
  - name: pathname-algebra-over-the-flat-namestring
    source: |
      ;; The pathname operators that are pure computation over the namestring, so
      ;; the four backends run ONE prelude definition and must agree exactly.
      ;; host / device / version are components a flat namestring does not carry.
      (print (list (pathname-host "d/a.txt") (pathname-device #P"d/a.txt") (pathname-version #P"d/a.txt")))
      ;; wild-pathname-p, per field key; :host / :device / :version can never be wild.
      (print (list (wild-pathname-p "d/*.txt") (wild-pathname-p "d/a.txt") (wild-pathname-p "d/a?.txt")))
      (print (list (wild-pathname-p "d/*.txt" :name) (wild-pathname-p "d/*.txt" :type)
                   (wild-pathname-p "d/a.*" :type) (wild-pathname-p "*/a.txt" :directory)
                   (wild-pathname-p "d/*.txt" :host)))
      ;; enough-namestring is the inverse of merge-pathnames: what the merge
      ;; prefixes, this drops, so merging the answer back names the file again.
      (print (enough-namestring "/a/b/c.lisp" "/a/"))
      (print (enough-namestring "/a/b/c.lisp" "/x/"))
      (print (merge-pathnames (enough-namestring "/a/b/c.lisp" "/a/") "/a/"))
      ;; *default-pathname-defaults* is #P"" and is a genuine dynamic variable.
      (print (list (pathnamep *default-pathname-defaults*) (namestring *default-pathname-defaults*)))
      (print (let ((*default-pathname-defaults* #P"/a/b/")) (enough-namestring "/a/b/c.lisp")))
      ;; translate-pathname captures what each wildcard matched and substitutes it.
      (print (translate-pathname "src/foo.lisp" "src/*.lisp" "build/*.fasl"))
      (print (namestring (translate-pathname "a/b.c" "*/*.*" "x/*-y.*")))
      (print (handler-case (translate-pathname "d/a.txt" "e/*.*" "f/*.*") (error () :no-match)))
      ;; Every rontolisp pathname is PHYSICAL, so translate-logical-pathname is the
      ;; identity and logical-pathname can never succeed.
      (print (translate-logical-pathname "d/a.txt"))
      (print (handler-case (logical-pathname "SYS:SRC;") (error () :signalled)))
    expected: |
      (NIL NIL NIL)
      (T NIL T)
      (T NIL T T NIL)
      "b/c.lisp"
      "/a/b/c.lisp"
      #P"/a/b/c.lisp"
      (T "")
      "c.lisp"
      #P"build/foo.fasl"
      "x/a-y.b"
      :NO-MATCH
      #P"d/a.txt"
      :SIGNALLED
  - name: uiop-pathname-algebra
    source: |
      ;; The uiop/pathname family (uiop-pathname.lisp): one Lisp definition per
      ;; member over the flat namestring, so the four backends must answer
      ;; identically -- exactly the family that would otherwise diverge silently
      ;; between the interpreter and the codegen paths.
      (print (uiop:subpathname #P"/tmp/foo/" "bar/baz.txt"))
      (print (uiop:subpathname #P"/tmp/foo/x.lisp" "n" :type "txt"))
      (print (uiop:subpathp #P"/tmp/foo/bar.txt" #P"/tmp/"))
      (print (uiop:subpathp #P"/other/x" #P"/tmp/"))
      (print (uiop:enough-pathname #P"/tmp/a/b.txt" #P"/tmp/"))
      (print (uiop:enough-pathname #P"/x/a.txt" #P"/tmp/"))
      (print (uiop:parse-unix-namestring "a//b/./c.txt"))
      (print (uiop:parse-unix-namestring "foo/bar" :type "lisp"))
      (print (uiop:parse-unix-namestring "foo/bar" :ensure-directory t))
      ;; The four predicates: absolute / relative / file answer the parsed
      ;; PATHNAME (a generalized boolean), directory-pathname-p answers T.
      (print (list (uiop:absolute-pathname-p "/a/b") (uiop:absolute-pathname-p "a/b")))
      (print (list (uiop:relative-pathname-p "a/b") (uiop:relative-pathname-p "/a/b")))
      (print (list (uiop:directory-pathname-p "/a/b/") (uiop:directory-pathname-p "/a/b")))
      (print (list (uiop:file-pathname-p "/a/b") (uiop:file-pathname-p "/a/b/")))
      ;; split-name-type is a multiple-value producer; a lone leading dot makes
      ;; the whole filename the NAME.
      (print (append (multiple-value-list (uiop:split-name-type "foo.lisp"))
                     (multiple-value-list (uiop:split-name-type ".hidden"))))
      ;; The wild family, wilden, and the output-translations wrapper.
      (print (list uiop:*wild* uiop:*wild-file* uiop:*wild-path* (uiop:wilden #P"/tmp/foo")))
      (print (uiop:translate-pathname* #P"/src/a/b.lisp" #P"/src/**/*.*" #P"/out/**/*.*"))
      ;; ensure-pathname transforms and checks; the failed check is catchable.
      (print (uiop:ensure-pathname "a/b" :ensure-directory t))
      (print (handler-case (uiop:ensure-pathname "/a/b" :want-relative t) (error () :err)))
      ;; get-pathname-defaults reads the *default-pathname-defaults* special, and
      ;; the two macros expand into a dynamic rebinding / call-with-enough-pathname.
      (print (uiop:get-pathname-defaults))
      (uiop:with-pathname-defaults (#P"/wpd/") (print *default-pathname-defaults*))
      (let ((p #P"/tmp/a/b.txt"))
        (uiop:with-enough-pathname (p :defaults #P"/tmp/") (print p)))
    expected: |
      #P"/tmp/foo/bar/baz.txt"
      #P"/tmp/foo/n.txt"
      #P"foo/bar.txt"
      NIL
      #P"a/b.txt"
      #P"/x/a.txt"
      #P"a/b/c.txt"
      #P"foo/bar.lisp"
      #P"foo/bar/"
      (#P"/a/b" NIL)
      (#P"a/b" NIL)
      (T NIL)
      (#P"/a/b" NIL)
      ("foo" "lisp" ".hidden" NIL)
      ("*" #P"*.*" #P"**/*.*" #P"/tmp/**/*.*")
      #P"/out/a/b.lisp"
      #P"a/b/"
      :ERR
      #P""
      #P"/wpd/"
      #P"a/b.txt"
  - name: clos-call-next-method-optional-and-meet-branch
    source: |
      ;; (1) a bare call-next-method forwards the &optional section too: &rest
      ;; binds what is left AFTER the optionals, so forwarding it alone dropped
      ;; them (cl-dbi's (do-sql conn sql &optional params) reached its driver
      ;; method with params NIL and sent a raw ? to PostgreSQL).
      (defclass cnm-base () ())
      (defclass cnm-sub (cnm-base) ())
      (defgeneric cnm-g (x &optional p))
      (defmethod cnm-g ((x cnm-base) &optional p) (list :base p))
      (defmethod cnm-g ((x cnm-sub) &optional p) (list :sub p (call-next-method)))
      (print (cnm-g (make-instance 'cnm-sub) 42))
      (print (cnm-g (make-instance 'cnm-sub)))
      (defgeneric cnm-h (c s &optional p)
        (:method ((c cnm-base) s &optional p) (list :primary s p))
        (:method :around ((c cnm-base) s &optional p) (call-next-method)))
      (print (cnm-h (make-instance 'cnm-base) "x" 1))
      (defgeneric cnm-k (x &optional p &rest r))
      (defmethod cnm-k ((x cnm-base) &optional p &rest r) (list :base p r))
      (defmethod cnm-k ((x cnm-sub) &optional p &rest r) (list :sub p r (call-next-method)))
      (print (cnm-k (make-instance 'cnm-sub) 1 2 3))
      ;; (2) a MEET branch: two specializer vectors neither of which applies to
      ;; the other. Without a branch for (cnm-sub, string) the coarser
      ;; (cnm-sub, DEFAULT) branch dropped the (cnm-base, string) primary and
      ;; call-next-method had no next method.
      (defgeneric cnm-m (x s)
        (:method ((x cnm-base) (s string)) (list :base-string s))
        (:method ((x cnm-sub) s) (cons :sub (if (next-method-p) (call-next-method) (list :none))))
        (:method :before ((x cnm-base) (s string)) (print :before-base-string))
        (:method :after ((x cnm-sub) s) (print :after-sub)))
      (print (cnm-m (make-instance 'cnm-sub) "q"))
      (print (cnm-m (make-instance 'cnm-sub) 7))
      (print (cnm-m (make-instance 'cnm-base) "q"))
    expected: |
      (:SUB 42 (:BASE 42))
      (:SUB NIL (:BASE NIL))
      (:PRIMARY "x" 1)
      (:SUB 1 (2 3) (:BASE 1 (2 3)))
      :BEFORE-BASE-STRING
      :AFTER-SUB
      (:SUB :BASE-STRING "q")
      :AFTER-SUB
      (:SUB :NONE)
      :BEFORE-BASE-STRING
      (:BASE-STRING "q")
  - name: clos-unbound-slots-shadowing-change-class-and-print-object
    source: |
      (defclass clos-u-base ()
        ((open-p :initform t :accessor clos-u-open-p)
         (conn :initarg :conn :reader clos-u-conn)
         (tag)))
      (defclass clos-u-sub (clos-u-base)
        ((open-p :initform :maybe :accessor clos-u-sub-open-p)
         (extra :initarg :extra :initform :none :accessor clos-u-extra)))
      (setq clos-u-b (make-instance 'clos-u-base :conn "c"))
      (print (list (clos-u-open-p clos-u-b) (slot-boundp clos-u-b 'tag) (slot-boundp clos-u-b 'conn)))
      (print (handler-case (slot-value clos-u-b 'tag)
               (unbound-slot (e) (list :unbound (cell-error-name e) (type-of (unbound-slot-instance e))))))
      (setf (slot-value clos-u-b 'tag) 7)
      (print (list (slot-boundp clos-u-b 'tag) (slot-value clos-u-b 'tag)))
      (slot-makunbound clos-u-b 'tag)
      (print (slot-boundp clos-u-b 'tag))
      (setq clos-u-s (make-instance 'clos-u-sub :conn "d"))
      (print (list (clos-u-open-p clos-u-s) (clos-u-sub-open-p clos-u-s) (clos-u-conn clos-u-s)))
      (with-accessors ((o clos-u-open-p) (x clos-u-extra)) clos-u-s
        (setf x (list o x))
        (print (clos-u-extra clos-u-s)))
      (setq clos-u-alias clos-u-b)
      (change-class clos-u-b 'clos-u-sub :extra :pooled)
      (print (list (type-of clos-u-alias) (clos-u-conn clos-u-alias) (clos-u-extra clos-u-alias)
                   (clos-u-open-p clos-u-alias) (slot-boundp clos-u-alias 'tag)))
      (defmethod print-object ((b clos-u-base) stream)
        (print-unreadable-object (b stream :type t) (princ (clos-u-conn b) stream)))
      (print (list (princ-to-string clos-u-s) (format nil "~a|~s" clos-u-s clos-u-s)))
    expected: |
      (T NIL T)
      (:UNBOUND TAG CLOS-U-BASE)
      (T 7)
      NIL
      (:MAYBE :MAYBE "d")
      (:MAYBE :NONE)
      (CLOS-U-SUB "c" :POOLED T NIL)
      ("#<CLOS-U-SUB d>" "#<CLOS-U-SUB d>|#<CLOS-U-SUB d>")
  - name: with-slots-write-only-unbound-slot-and-missing-slot
    source: |
      ;; with-slots BINDS, it never reads: a body that only assigns a slot
      ;; declared without an :initform must not signal on entry (fast-io's
      ;; initialize-instance fills its buffer slot exactly that way). A read the
      ;; body really performs still signals unbound-slot, and a slot NO class
      ;; declares is a run-time error on every backend, never a compile-time one
      ;; (fast-io's open-stream-p reads a typo'd slot name).
      (defclass clos-ws-box () ((buffer)))
      (defmethod initialize-instance ((self clos-ws-box) &key)
        (call-next-method)
        (with-slots (buffer) self (setf buffer (list 1 2))))
      (print (slot-value (make-instance 'clos-ws-box) 'buffer))
      (print (handler-case (with-slots (buffer) (allocate-instance 'clos-ws-box) buffer)
               (unbound-slot (e) (cell-error-name e))))
      (print (handler-case (slot-value (make-instance 'clos-ws-box) 'nope)
               (error (e) (princ-to-string e))))
    expected: |
      (1 2)
      BUFFER
      "The slot NOPE is missing"
  - name: binary-file-round-trip-with-read-byte-write-byte
    source: |
      (with-open-file (out "bin.dat" :direction :output :element-type '(unsigned-byte 8))
        (write-byte 0 out) (write-byte 10 out) (write-byte 34 out) (write-byte 255 out))
      (with-open-file (in "bin.dat" :element-type '(unsigned-byte 8))
        (print (read-byte in)) (print (read-byte in))
        (print (read-byte in)) (print (read-byte in))
        (print (read-byte in nil -1)))
    expected: |
      0
      10
      34
      255
      -1
  - name: file-length-of-a-file-of-a-known-size
    # file-length is REAL on all four backends: the interpreter and the JVM stat
    # the path the stream was opened with, both WASM backends stat the descriptor
    # through fd_filestat_get (component mode: the adapter's re-encode of
    # wasi:filesystem's descriptor.stat). What still answers nil is what has no
    # length -- a string stream, a standard stream, a closed handle -- which is
    # Common Lisp's "cannot be determined". The trailing (min 4096 ...) is the
    # caller shape that used to TRAP one call later on the two WASM backends
    # rather than take a fallback.
    source: |
      (with-open-file (out "fl.dat" :direction :output :if-exists :supersede
                            :element-type '(unsigned-byte 8))
        (dotimes (i 300) (write-byte (mod i 256) out))
        (print (file-length out)))
      (with-open-file (in "fl.dat" :element-type '(unsigned-byte 8))
        (print (file-length in)))
      (with-input-from-string (s "abcdef") (print (file-length s)))
      (print (file-length *standard-output*))
      (print (file-length t))
      (let ((h (open "fl.dat"))) (close h) (print (file-length h)))
      (with-open-file (in "fl.dat" :element-type '(unsigned-byte 8))
        (print (min 4096 (file-length in))))
    expected: |
      300
      300
      NIL
      NIL
      NIL
      NIL
      300
  - name: open-if-exists-append-keeps-the-existing-content
    # smart-buffer's disk-spill path writes every chunk past the memory limit
    # this way, so the option is real on all four backends: :direction :output
    # :if-exists :append normalizes to the :append pseudo-direction (mode 5/7,
    # compiler/OpenModes) -- O_CREAT without O_TRUNC plus FDFLAGS_APPEND on WASI.
    source: |
      (with-open-file (out "app.dat" :direction :output) (write-string "one" out))
      (with-open-file (out "app.dat" :direction :output :if-exists :append)
        (write-string "two" out))
      (with-open-file (in "app.dat") (print (read-line in)))
      (with-open-file (out "app.dat" :direction :output :if-exists :append
                            :element-type '(unsigned-byte 8))
        (write-byte 33 out))
      (with-open-file (in "app.dat") (print (read-line in)))
    expected: |
      "onetwo"
      "onetwo!"
  - name: defgeneric-short-form-method-combination
    # yason's encode-slots hook (the blocker that stood in front of http-body):
    # the operator applied to EVERY applicable method carrying the combination
    # name as its qualifier, most specific first unless :most-specific-last.
    source: |
      (defclass ci-mc-base () ())
      (defclass ci-mc-leaf (ci-mc-base) ())
      (defgeneric ci-mc-trace (x) (:method-combination progn :most-specific-last))
      (defmethod ci-mc-trace progn ((x ci-mc-base)) (print :base))
      (defmethod ci-mc-trace progn ((x ci-mc-leaf)) (print :leaf))
      (defgeneric ci-mc-sum (x) (:method-combination +))
      (defmethod ci-mc-sum + ((x ci-mc-base)) 1)
      (defmethod ci-mc-sum + ((x ci-mc-leaf)) 100)
      (defgeneric ci-mc-names (x) (:method-combination list))
      (defmethod ci-mc-names list ((x ci-mc-base)) 'base)
      (defmethod ci-mc-names list ((x ci-mc-leaf)) 'leaf)
      (ci-mc-trace (make-instance 'ci-mc-leaf))
      (print (ci-mc-sum (make-instance 'ci-mc-leaf)))
      (print (ci-mc-sum (make-instance 'ci-mc-base)))
      (print (ci-mc-names (make-instance 'ci-mc-leaf)))
    expected: |
      :BASE
      :LEAF
      101
      1
      (LEAF BASE)
  - name: defstruct-keyword-conc-name
    # :conc-name is a STRING DESIGNATOR, so a keyword designates its name WITHOUT
    # the colon -- fast-http's (defstruct (http (:conc-name :http-))).
    source: |
      (defstruct (ci-kw-thing (:conc-name :ci-kw-thing-)) (state 0))
      (let ((it (make-ci-kw-thing)))
        (setf (ci-kw-thing-state it) 5)
        (print (ci-kw-thing-state it)))
    expected: |
      5
  - name: defstruct-print-object-and-print-function
    # The two printer options ride the print-object seam: (:print-object fn) takes
    # (object stream), the CLtL1 (:print-function fn) an extra depth (0 -- nothing
    # tracks a print level). map-set's one struct is the :print-function shape, and
    # its printer is the whole reason the library loads.
    source: |
      (defstruct (ci-po-pt (:print-object ci-po-pt-printer)) (x 1) (y 2))
      (defun ci-po-pt-printer (obj stream)
        (format stream "<~D,~D>" (ci-po-pt-x obj) (ci-po-pt-y obj)))
      (defstruct (ci-pf-set (:print-function (lambda (obj stream depth)
                                               (print-unreadable-object (obj stream :type t)
                                                 (format stream "of ~D element~:P at ~D"
                                                         (ci-pf-set-size obj) depth)))))
        (size 1))
      (print (make-ci-po-pt))
      (print (princ-to-string (make-ci-po-pt :x 3)))
      (format t "~A|~S~%" (make-ci-po-pt) (make-ci-po-pt :y 9))
      (print (make-ci-pf-set))
      (princ (make-ci-pf-set :size 3))
      (terpri)
    expected: |
      <1,2>
      "<3,2>"
      <1,2>|<1,9>
      #<CI-PF-SET of 1 element at 0>
      #<CI-PF-SET of 3 elements at 0>
  - name: read-line-strips-one-trailing-carriage-return
    source: |
      (with-open-file (out "crlf.dat" :direction :output :element-type '(unsigned-byte 8))
        (write-byte 104 out) (write-byte 105 out) (write-byte 13 out) (write-byte 10 out)
        (write-byte 13 out) (write-byte 10 out))
      (with-open-file (in "crlf.dat")
        (print (read-line in))
        (print (string= (read-line in) "")))
    expected: |
      "hi"
      T
  - name: read-sequence-and-write-sequence-round-trip
    source: |
      (let ((buf (make-array 4)))
        (setf (aref buf 0) 65) (setf (aref buf 1) 0)
        (setf (aref buf 2) 10) (setf (aref buf 3) 34)
        (with-open-file (out "seq.dat" :direction :output :element-type '(unsigned-byte 8))
          (write-sequence buf out)))
      (let ((buf (make-array 8 :initial-element 99)))
        (with-open-file (in "seq.dat" :element-type '(unsigned-byte 8))
          (print (read-sequence buf in)))
        (print (aref buf 2))
        (print (aref buf 4)))
    expected: |
      4
      10
      99
  - name: probe-file-existing-and-missing
    source: |
      ;; probe-file answers a PATHNAME value carrying the argument namestring,
      ;; and takes both designator spellings.
      (with-open-file (out "probe.dat" :direction :output) (write-line "x" out))
      (print (probe-file "probe.dat"))
      (print (probe-file #P"probe.dat"))
      (print (probe-file "probe-absent.dat"))
      (print (if (uiop:file-exists-p "probe.dat") 'yes 'no))
      (print (mapcar #'probe-file (list "probe.dat" "probe-absent.dat")))
    expected: |
      #P"probe.dat"
      #P"probe.dat"
      NIL
      YES
      (#P"probe.dat" NIL)
  - name: runtime-absolute-path-open-probe-and-load
    source: |
      ;; An ABSOLUTE path BUILT AT RUN TIME opens, probes and loads the same on all
      ;; four backends. Building it with concatenate is load-bearing twice over: a
      ;; LITERAL absolute path is not a test of this, because the compile paths bundle
      ;; the file's compile-time contents instead of opening anything, and on WASM the
      ;; path has to be resolved against the preopen whose name COVERS it (/tmp here)
      ;; rather than handed to the first preopened directory whole.
      (defvar *abs-dir* "/tmp")
      (defvar *abs-file* (concatenate 'string *abs-dir* "/ronto-abs-432.txt"))
      (with-open-file (out *abs-file* :direction :output) (write-line "absolute" out))
      (print (with-open-file (in *abs-file*) (read-line in)))
      (print (probe-file *abs-file*))
      (print (probe-file (concatenate 'string *abs-dir* "/ronto-absent-432.txt")))
      (with-open-file (out (concatenate 'string *abs-dir* "/ronto-abs-432.lisp")
                       :direction :output)
