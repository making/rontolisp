  - name: directory-listing-and-uiop-walkers
    source: |
      ;; The whole matching family over the one %list-directory primitive: ANSI wild
      ;; components, sorted, the pathspec's own directory prefix kept, subdirectories
      ;; carrying a trailing "/", every entry a PATHNAME value. The entries
      ;; are written by this case so the answer does not depend on what else the run
      ;; directory holds.
      (with-open-file (out "dls-b.txt" :direction :output) (write-line "b" out))
      (with-open-file (out "dls-a.txt" :direction :output) (write-line "a" out))
      (defun dls-ours (paths)
        (remove-if-not (lambda (p)
                         (let ((n (namestring p)))
                           (and (> (length n) 6) (string= (subseq n 0 6) "./dls-"))))
                       paths))
      (print (directory "./dls-*.txt"))
      (print (directory #P"./dls-?.txt"))
      (print (dls-ours (directory "./*.*")))
      (print (dls-ours (uiop:directory-files ".")))
      (print (uiop:directory-exists-p "."))
      (print (uiop:directory-exists-p "dls-a.txt"))
      (print (uiop:directory-exists-p "no-such-directory"))
      (print (directory "no-such-directory/*.*"))
      (print (uiop:subdirectories "no-such-directory/"))
    expected: |
      (#P"./dls-a.txt" #P"./dls-b.txt")
      (#P"./dls-a.txt" #P"./dls-b.txt")
      (#P"./dls-a.txt" #P"./dls-b.txt")
      (#P"./dls-a.txt" #P"./dls-b.txt")
      #P"./"
      NIL
      NIL
      NIL
      NIL
