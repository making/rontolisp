  # length is a sequence operation: it returns the element count of a vector (rank-1
  # array) just as for a list or string. A rank-2 array is not a sequence, so length
  # signals an error on it (not covered here, since the cases share one program).
  - name: length-of-vector-cross-backend
    source: |
      (defun ci-vector-length ()
        (print (length (make-array 5 :initial-element 0)))
        (print (length #(10 20 30)))
        (print (length #())))
      (ci-vector-length)
    expected: |
      5
      3
      0

  # Regression for .todo/13: getenv's environ scratch addresses must not overlap the
  # interned-string data segment on the WASM backends. An unset variable keeps the output
  # deterministic across backends; the bug corrupted the shared newline byte so any newline
  # printed after a getenv came out as NUL. The component backend reuses this expected value.
  - name: getenv-does-not-corrupt-newline
    source: |
      (defun ci-getenv-newline ()
        (getenv "RONTOLISP_NO_SUCH_VAR")
        (format t "alpha~%beta~%"))
      (ci-getenv-newline)
    expected: |
      alpha
      beta

  # Regression for .todo/07 + .todo/13: a top-level global special variable
  # (defvar/defparameter) must be readable and assignable from inside a defun/lambda
  # body, not just at top level. Each global gets its own backing store (a JVM static
  # field / a WASM module-level global), so the reference resolves from any function.
  - name: global-special-var-in-function-body
    source: |
      (defparameter *ci-k* 3)
      (defun ci-scale (x) (* x *ci-k*))
      (print (ci-scale 5))
      (defvar *ci-acc* 0)
      (defun ci-bump () (setq *ci-acc* (+ *ci-acc* 1)))
      (ci-bump)
      (ci-bump)
      (print *ci-acc*)
      (defparameter *ci-base* 10)
      (defun ci-adders (xs) (mapcar (lambda (x) (+ x *ci-base*)) xs))
      (print (ci-adders '(1 2 3)))
    expected: |
      15
      2
      (11 12 13)

  # A lambda capturing a local (a surrounding let variable or an enclosing defun
  # parameter) that shadows a same-named top-level global must read/write the
  # captured binding, not the global (the interpreter always got this right; the
  # compilers used to resolve the name to the global).
  - name: closure-capture-shadowing-globals
    source: |
      (setq ci-shad-a 777)
      (print (let ((ci-shad-a 5)) (funcall (lambda () ci-shad-a))))
      (setq ci-shad-b 666)
      (print (let ((ci-shad-b 5)) (funcall (lambda () (setq ci-shad-b (+ ci-shad-b 1)) ci-shad-b))))
      (print ci-shad-b)
      (setq ci-shad-e 555)
      (defun ci-shad-g (ci-shad-e) (funcall (lambda () ci-shad-e)))
      (print (ci-shad-g 42))
      (print ci-shad-e)
    expected: |
      5
      6
      666
      42
      555

  # defmacro (user macros) with backquote templates. The interpreter expands macro
  # calls at evaluation time; the compile path (JVM / WASM / component) expands them
  # in a pre-pass (eval.UserMacroExpander) before the compilers run, so all four
  # backends must agree. Covers &body splicing, unevaluated argument forms (swap!),
  # expansion-time helper calls, and a macro expanding into another macro call.
  - name: defmacro-user-macros
    source: |
      (defmacro ci-my-when (test &body body)
        `(if ,test (progn ,@body) nil))
      (defmacro ci-swap (a b)
        `(let ((__ci-tmp ,a))
           (setq ,a ,b)
           (setq ,b __ci-tmp)))
      (defun ci-expand-helper (n) (* n 2))
      (defmacro ci-with-doubled (n x) `(+ ,(ci-expand-helper n) ,x))
      (defmacro ci-inner (x) `(+ ,x 1))
      (defmacro ci-outer (x) `(ci-inner ,x))
      (print (ci-my-when (> 3 1) 10 20))
      (print (ci-my-when nil 1))
      (setq ci-p 1)
      (setq ci-q 2)
      (ci-swap ci-p ci-q)
      (print (list ci-p ci-q))
      (print (ci-with-doubled 5 1))
      (print (ci-outer 41))
      (print `(a ,(+ 1 2) ,@(list 3 4) b))
    expected: |
      20
      nil
      (2 1)
      11
      42
      (a 3 3 4 b)

  # gensym + macroexpand/macroexpand-1. Runtime gensym names print identically on
  # all four backends only while no earlier form runs gensym at macro-expansion
  # time: the interpreter shares one counter between expansion time and run time,
  # the compile path does not. Keep the runtime prints BEFORE the gensym-using
  # macro below, and never print a name generated inside a macro body.
  # ci-my-when / ci-outer come from the defmacro-user-macros case above (cases
  # share global state and run in order).
  - name: gensym-and-macroexpand
    source: |
      (print (gensym))
      (print (gensym "ci"))
      (print (eq (gensym) (gensym)))
      (print (symbolp (gensym)))
      (defmacro ci-swap-safe (a b)
        (let ((tmp (gensym "swap")))
          `(let ((,tmp ,a))
             (setq ,a ,b)
             (setq ,b ,tmp))))
      (setq ci-tmp 90)
      (setq ci-other 9)
      (ci-swap-safe ci-tmp ci-other)
      (print (list ci-tmp ci-other))
      (print (macroexpand-1 '(ci-my-when a b)))
      (print (macroexpand-1 '(unless c x)))
      (print (macroexpand '(ci-outer 41)))
      (print (macroexpand-1 '(+ 1 2)))
    expected: |
      #:g1
      #:ci2
      nil
      t
      (9 90)
      (if a (progn b) nil)
      (if c nil x)
      (+ 41 1)
      (+ 1 2)

  # JSON: the Lisp-source library (json.lisp) is spliced by the compile path and
  # loaded lazily by the interpreter, so one implementation runs on all four
  # backends. Integers wider than 9 digits become floats (WASM i31 range); a
  # float with magnitude >= 2^31 cannot be *printed* on WASM (see .todo/46), so
  # the wide-integer case asserts floatp instead of printing the value.
  # Hash-table object mode uses single-key objects here because iteration order
  # is backend-specific.
  - name: json-parse-and-stringify
    source: |
      (print (rontolisp:json-parse "{\"name\": \"rontolisp\", \"n\": 2}"))
      (print (getf (rontolisp:json-parse "{\"a\": {\"b\": [1, true, null]}}") :a))
      (print (rontolisp:json-parse "[1, 2.5, \"x\", false, null]"))
      (print (rontolisp:json-parse "1e3"))
      (print (floatp (rontolisp:json-parse "1234567890123")))
      (print (rontolisp:json-parse "\"a\\tb\\u3042\""))
      (print (rontolisp:json-parse "{}"))
      (let ((h (rontolisp:json-parse "{\"content-type\": \"text/html\"}" :hash-table)))
        (print (gethash "content-type" h))
        (print (hash-table-count h)))
      (print (rontolisp:json-stringify (list :name "rontolisp" :ok t :ver 1.5)))
      (print (rontolisp:json-stringify (list 1 (list 2 3) nil)))
      (print (rontolisp:json-stringify "a\"b"))
      (print (rontolisp:json-stringify 3/2))
      (let ((h (make-hash-table)))
        (setf (gethash "x" h) (list 1 2))
        (print (rontolisp:json-stringify h)))
      (print (rontolisp:json-stringify (rontolisp:json-parse "{\"deep\": {\"list\": [{\"k\": \"v\"}, 2.5, true]}}")))
      (print (funcall #'rontolisp:json-stringify (list 7)))
    expected: |
      (:name "rontolisp" :n 2)
      (:b (1 t nil))
      (1 2.5 "x" nil nil)
      1000.0
      t
      "a	bあ"
      nil
      "text/html"
      1
      "{"name":"rontolisp","ok":true,"ver":1.5}"
      "[1,[2,3],null]"
      ""a\"b""
      "1.5"
      "{"x":[1,2]}"
      "{"deep":{"list":[{"k":"v"},2.5,true]}}"
      "[7]"

  # The URL / query-string library (url.lisp, spliced by UrlLibrary): percent
  # decoding/encoding must agree across the UTF-16-indexed backends
  # (interpreter/JVM) and the UTF-8 byte-indexed WASM backends, including
  # multi-byte %E3%81%82-style escapes and surrogate-pair code points.
  - name: url-and-query-string-library
    source: |
      (print (rontolisp:url-decode "Will+it+work%3F"))
      (print (rontolisp:url-decode "%E3%81%82%E3%81%84"))
      (print (rontolisp:url-decode "%F0%9F%98%80"))
      (print (rontolisp:url-encode "a b/c~d"))
      (print (rontolisp:url-encode "あ"))
      (print (rontolisp:url-decode (rontolisp:url-encode "日本語 text?&=")))
      (print (rontolisp:query-params "a=1&b=two&flag"))
      (print (rontolisp:query-params nil))
      (print (rontolisp:query-param "a=1&name=ronto%20lisp" "name"))
      (print (rontolisp:query-param "a=1" "missing"))
      (print (rontolisp:url-path "/get?a=1"))
      (print (rontolisp:url-query "/get?a=1"))
      (print (rontolisp:url-query "/get"))
      (print (mapcar #'rontolisp:url-decode (list "a%2Bb" "1+2")))
    expected: |
      "Will it work?"
      "あい"
      "😀"
      "a%20b%2Fc~d"
      "%E3%81%82"
      "日本語 text?&="
      (("a" . "1") ("b" . "two") ("flag" . ""))
      nil
      "ronto lisp"
      nil
      "/get"
      "a=1"
      nil
      ("a+b" "1 2")

  # Double-colon package qualifiers, mirroring Common Lisp: pkg::name also
  # reaches external symbols, so rontolisp::json-parse names the same function
  # as rontolisp:json-parse (a single colon reaches external symbols only and
  # is rejected for internals like rontolisp::%json-parse at read/compile time).
  - name: json-double-colon-qualifier
    source: |
      (print (rontolisp::json-stringify (list 1 2 3)))
      (print (getf (rontolisp::json-parse "{\"n\": 5}") :n))
    expected: |
      "[1,2,3]"
      5

  # equal on strings compares content on every backend (the WASM _equal/_hash
  # runtime folds string bytes), so runtime-built strings work as hash-table
  # keys and equal partners of interned literals.
  - name: string-equal-content-and-hash-keys
    source: |
      (print (equal (concatenate 'string "a" "b") "ab"))
      (print (equal "ab" 'ab))
      (let ((h (make-hash-table)))
        (setf (gethash (concatenate 'string "a" "b") h) 1)
        (print (gethash "ab" h))
        (setf (gethash (subseq "xaby" 1 3) h) 2)
        (print (gethash "ab" h))
        (print (hash-table-count h)))
    expected: |
      t
      nil
      1
      2
      1

  # Lambda-list extensions: &optional/&key/&aux/&allow-other-keys are desugared
  # (LambdaLists) into the native "required + &rest" shape shared by all
  # backends; funcall/apply/eval dispatch packages surplus args into the rest
  # list.
  - name: lambda-list-extensions
    source: |
      (defun ll-rest (a &rest r) (list a r))
      (print (ll-rest 1 2 3))
      (print (ll-rest 1))
      (defun ll-opt (x &optional (y 10) (z (* y 2) zp)) (list x y z zp))
      (print (ll-opt 1))
      (print (ll-opt 1 2))
      (print (ll-opt 1 2 3))
      (defun ll-key (a &key (k 1 kp) m) (list a k kp m))
      (print (ll-key 0))
      (print (ll-key 0 :k 5))
      (print (ll-key 0 :m 7 :k 9))
      (print (ll-key 0 :other 1 :allow-other-keys t))
      (defun ll-mix (a &optional b &rest r &key c &allow-other-keys) (list a b r c))
      (print (ll-mix 1 2 :c 3 :d 4))
      (defun ll-aux (x &aux (y (+ x 1)) z) (list x y z))
      (print (ll-aux 5))
    expected: |
      (1 (2 3))
      (1 nil)
      (1 10 20 nil)
      (1 2 4 nil)
      (1 2 3 t)
      (0 1 nil nil)
      (0 5 t nil)
      (0 9 t 7)
      (0 1 nil nil)
      (1 2 (:c 3 :d 4) 3)
      (5 6 nil)
  - name: lambda-list-first-class-and-eval
    source: |
      (print (funcall (lambda (&rest xs) xs) 1 2 3))
      (print (funcall #'ll-rest 1 2 3))
      (print (apply #'ll-rest 1 (list 2 3)))
      (print (mapcar (lambda (x &optional (y 100)) (+ x y)) (list 1 2 3)))
      (print ((lambda (a &rest r) (list a r)) 1 2 3))
      (print (eval (quote (ll-rest 1 2 3))))
    expected: |
      (1 2 3)
      (1 (2 3))
      (1 (2 3))
      (101 102 103)
      (1 (2 3))
      (1 (2 3))
  - name: defstruct-constructor-accessors-predicate-copier
    source: |
      (defstruct cs-point x (y 10))
      (setq cs-p (make-cs-point :x 1))
      (print (cs-point-x cs-p))
      (print (cs-point-y cs-p))
      (print (cs-point-p cs-p))
      (print (cs-point-p (list 1 2)))
      (setq cs-q (copy-cs-point cs-p))
