# Single source of truth for the native-binary E2E test.
# Cases run IN ORDER, concatenated into one program per backend
# (shared global state). Regenerate is manual; edit cases directly.
cases:
  - name: arithmetic
    source: |
      (print (+ 1 2))
      (print (- 10 3))
      (print (* 3 4))
      (print (/ 10 3))
      (print (mod 10 3))
    expected: |
      3
      7
      12
      10/3
      1
  - name: float-and-negative-mod-rem
    source: |
      (print (round (* (mod 4.6666 2.0) 1000000.0)))
      (print (round (* (rem -4.6 2.0) 1000000.0)))
      (print (mod -7 3))
      (print (rem -7 3))
      (print (mod 7 -3))
    expected: |
      666600
      -600000
      2
      -1
      -2
  - name: number-literals-with-a-leading-or-trailing-dot
