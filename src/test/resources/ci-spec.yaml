        (print (list (mapl #'identity '(1 2 3)) tails)))
      ;; equalp: case-insensitive strings/chars, recursive
      (print (list (equalp "ABC" "abc") (equalp '(1 "A") '(1 "a")) (equalp "a" "b")))
      ;; string<: mismatch index or nil
      (print (list (string< "abc" "abd") (string< "abc" "abc") (string< "ab" "abc")))
      ;; sort with :key (routes through stable-sort)
      (print (sort (list (cons 3 'c) (cons 1 'a) (cons 2 'b)) #'< :key #'car))
      ;; (intern name :keyword) builds a keyword
      (print (list (intern "FOO" :keyword) (keywordp (intern "BAR" :keyword))))
      ;; define-modify-macro: read-modify-write of a place
      (define-modify-macro maxf (lo) max)
      (print (let ((v 3)) (maxf v 5) (maxf v 1) v))
      ;; loop being the hash-keys ... using (hash-value ...) over a single-entry table
      (let ((h (make-hash-table :test #'equal)))
