  - name: backquote-quoted-splice
    source: |
      (print `(a ',@'(b)))
      (let ((ci-bq-args '(v))) (print `(equal x ',@ci-bq-args)))
      (let ((ci-bq-args nil)) (print `(f ',@ci-bq-args)))
      (let ((ci-bq-args '(a b))) (print `(f ',@ci-bq-args)))
