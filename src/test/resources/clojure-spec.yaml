  - name: protocols-dispatch-over-the-type-tag
    # b13: the InstantProvider/SimClock slice of instant.clj, adapted (the oracle
    # extends to the Instant/Date host classes, which no wasm backend has; the
    # kinds class answers stand in). extend-protocol rows dispatch nil/String/
    # Number separately with Object as the catch-all; the deftype body sees its
    # fields as locals, so (swap! tick inc) advances the simulated clock.
    source: |
      (defprotocol B13Time (b13-to-ms [source]))
      (extend-protocol B13Time
        nil (b13-to-ms [src] :b13-nil)
        Object (b13-to-ms [src] :b13-object)
        String (b13-to-ms [s] :b13-string)
        Number (b13-to-ms [n] n))
      (println (b13-to-ms nil))
      (println (b13-to-ms "oops"))
      (println (b13-to-ms 42))
      (println (b13-to-ms 4.5))
      (println (b13-to-ms :k))
      (println (satisfies? B13Time nil))
      (println (satisfies? B13Time "s"))
      (defprotocol B13Sim (b13-advance! [s]))
      (deftype B13Clock [start granularity tick]
        B13Sim (b13-advance! [_] (swap! tick inc))
        B13Time (b13-to-ms [_] (+ start (* granularity @tick))))
      (def b13-clock (->B13Clock 1000 100 (atom 0)))
      (println (b13-to-ms b13-clock))
      (b13-advance! b13-clock)
      (b13-advance! b13-clock)
      (println (b13-to-ms b13-clock))
      (println (satisfies? B13Sim b13-clock))
      (println (satisfies? B13Time b13-clock))
      (println (instance? B13Clock b13-clock))
      (println (class b13-clock))
      (println (get b13-clock :start))
      (println (.-granularity b13-clock))
    expected: |
      :b13-nil
      :b13-string
      42
      4.5
      :b13-object
      true
      true
      1000
      1200
      true
      true
      true
      :B13Clock
      nil
      100
  - name: object-extension-keeps-a-row-per-method
    # An Object extension of a several-method protocol answers each method's own
    # implementation (one shared default slot used to keep only the last one, so
    # evm-area ran evm-scale's lambda and signalled its arity).
    source: |
      (defprotocol EvmShape (evm-area [s]) (evm-name [s]) (evm-scale [s k]))
      (extend-protocol EvmShape Object
        (evm-area [s] :area) (evm-name [s] :name) (evm-scale [s k] k))
      (println (evm-area 1) (evm-name "x") (evm-scale [] 3))
      (defprotocol EvmSize (evm-width [s]) (evm-height [s]))
      (extend Object EvmSize {:evm-width (fn [s] :w) :evm-height (fn [s] :h)})
      (println (evm-width 1) (evm-height 1) (satisfies? EvmSize :k))
    expected: |
      :area :name 3
      :w :h true
  - name: protocols-extend-via-metadata
    # The ToDo-as-MidiNote slice of note.clj (Programming Clojure 4th ed.), minus
    # the MIDI synthesizer: with-meta attaches implementations under the
    # protocol-qualified method symbols. The oracle's order: an inline body wins,
    # then metadata, then extend-type rows and Object; a bare symbol key misses, a
    # protocol without the flag ignores metadata. Metadata round-trips through
    # meta/vary-meta, never changes =, rides on reader literals, and with-meta
    # refuses what is no IObj (strings, keywords). long: the oracle's ratio
    # arithmetic prints 2000N.
    source: |
      (defprotocol EvmNote
        :extend-via-metadata true
        (evm-msec [this tempo] "Note duration in ms")
        (evm-key-number [this] "MIDI key number")
        (evm-velocity [this] "MIDI velocity"))
      (defn evm-beats->msec [beats tempo] (* (/ beats tempo) 4 60 1000))
      (defn evm-note->key [pitch octave]
        (let [scale {:C 0 :E 4 :G 7}]
          (+ (* 12 (inc octave)) (scale pitch))))
      (defrecord EvmToDo [desc est type])
      (defn evm-to-note [todo theme]
        (let [{:keys [est type]} todo
              {:keys [mpb pitches volume]} theme
              octave 4]
          (with-meta todo
            {`evm-msec (fn [_ bpm] (evm-beats->msec (/ est mpb) bpm))
             `evm-key-number (fn [_] (evm-note->key (get pitches type) octave))
             `evm-velocity (constantly volume)})))
      (defrecord EvmTheme [mpb pitches volume])
      (def evm-theme (->EvmTheme 60 {:errand :C, :house :E, :personal :G} 64))
      (doseq [note (map #(evm-to-note % evm-theme)
                        [(->EvmToDo "Grocery shopping" 60 :errand)
                         (->EvmToDo "Mow yard" 30 :house)
                         (->EvmToDo "Brush teeth" 2 :personal)])]
        (println (:desc note) (long (evm-msec note 120)) (evm-key-number note) (evm-velocity note)))
      (defrecord EvmInline [x] EvmNote
        (evm-msec [_ t] :inline) (evm-key-number [_] :inline) (evm-velocity [_] :inline))
      (extend-type EvmToDo EvmNote
        (evm-msec [_ t] :extended) (evm-key-number [_] :extended) (evm-velocity [_] :extended))
      (extend-protocol EvmNote Object
        (evm-msec [_ t] :object) (evm-key-number [_] :object) (evm-velocity [_] :object))
      (def evm-meta {`evm-key-number (fn [_] :meta)})
      (println (evm-key-number (with-meta (->EvmToDo "d" 1 :house) evm-meta))
               (evm-key-number (->EvmToDo "d" 1 :house))
               (evm-key-number (with-meta (->EvmInline 1) evm-meta))
               (evm-key-number (with-meta [1] evm-meta))
               (evm-key-number (with-meta [1] {'evm-key-number (fn [_] :bare)}))
               (evm-msec (with-meta {} evm-meta) 1))
      (defprotocol EvmPlain (evm-plain [this]))
      (extend-protocol EvmPlain Object (evm-plain [_] :object))
      (println (evm-plain (with-meta {} {`evm-plain (fn [_] :meta)})))
      (def evm-v [1 2])
      (def evm-w (with-meta evm-v {:k 1}))
      (println (meta evm-v) (meta evm-w) (= evm-v evm-w)
               (let [m (meta (vary-meta evm-w assoc :j 2))] [(:k m) (:j m)]))
      (println (meta ^:flag [1]) (meta ^{:a 1} {}) (meta (with-meta '(1) {:l 1})) (meta 5))
      (def evm-f (with-meta inc {:doc "inc"}))
      (println (evm-f 1) (meta evm-f) (fn? evm-f))
      (println (try (with-meta "s" {}) (catch Exception e :not-iobj))
               (try (with-meta :k {}) (catch Exception e :not-iobj)))
    expected: |
      Grocery shopping 2000 60 64
      Mow yard 1000 64 64
      Brush teeth 66 67 64
      :meta :extended :inline :meta :object :object
      :object
      nil {:k 1} true [1 2]
      {:flag true} {:a 1} {:l 1} nil
      2 {:doc inc} true
      :not-iobj :not-iobj
  - name: hangman-players-guess-through-the-protocol
    # b13: the Player slice of hangman/core.clj (random-player/interactive-player
    # via reify, ChoicesPlayer via defrecord, the pure game loop). Letters are
    # strings (the char-coercion helpers are outside the subset); the two games
    # below differ by one wrong guess, like the oracle's 2 and 3.
    source: |
      (defprotocol B13Player (b13-next-guess [player progress]))
      (def b13-letters ["e" "t" "a" "o" "i" "n" "h" "x"])
      (def b13-random-player (reify B13Player (b13-next-guess [_ progress] :rand)))
      (def b13-interactive-player (reify B13Player (b13-next-guess [_ progress] :human)))
      (println (b13-next-guess b13-random-player nil))
      (println (b13-next-guess b13-interactive-player nil))
      (println (satisfies? B13Player b13-random-player))
      (println (= b13-random-player b13-random-player))
      (println (= b13-random-player b13-interactive-player))
      (defrecord B13Choices [choices]
        B13Player
        (b13-next-guess [_ progress]
          (let [guess (first @choices)]
            (swap! choices rest)
            guess)))
      (defn b13-choices-player [choices] (->B13Choices (atom choices)))
      (def b13-alpha (b13-choices-player b13-letters))
      (println (b13-next-guess b13-alpha nil))
      (println (b13-next-guess b13-alpha nil))
      (println (satisfies? B13Player b13-alpha))
      (println (satisfies? B13Player {}))
      (println (instance? B13Choices b13-alpha))
      (extend-type String B13Player (b13-next-guess [s progress] :str-player))
      (println (b13-next-guess "x" nil))
      (extend String B13Player {:b13-next-guess (fn [s progress] :ext-fn)})
      (println (b13-next-guess "y" nil))
      (defn b13-new-progress [word] (repeat (count word) "_"))
      (defn b13-update-progress [progress word guess]
        (map #(if (= %1 guess) guess %2) word progress))
      (defn b13-complete? [progress word] (= progress (seq word)))
      (defn b13-game [word player]
        (loop [progress (b13-new-progress word) guesses 1]
          (let [guess (b13-next-guess player progress)
                progress2 (b13-update-progress progress word guess)]
            (if (b13-complete? progress2 word) guesses (recur progress2 (inc guesses))))))
      (println (b13-game ["h" "i"] (b13-choices-player ["h" "i" "x"])))
      (println (b13-game ["h" "i"] (b13-choices-player ["x" "h" "i"])))
    expected: |
      :rand
      :human
      true
      true
      false
      e
      t
      true
      false
      true
      :str-player
      :ext-fn
      2
      3
  - name: reify-values-dispatch-and-deftypes-stay-opaque
    # b13: each reify is a distinct dispatch value (= is identity); a deftype is
    # opaque to the map verbs (reads miss, writers and seq/count/empty? signal,
    # caught here) while instance?/class still see its tag.
    source: |
      (defprotocol B13Greet (b13-hello [g]))
      (def b13-ga (reify B13Greet (b13-hello [_] :a)))
      (def b13-gb (reify B13Greet (b13-hello [_] :b)))
      (println (b13-hello b13-ga))
      (println (b13-hello b13-gb))
      (println (satisfies? B13Greet b13-ga))
      (println (= b13-ga b13-ga))
      (println (= b13-ga b13-gb))
      (deftype B13Box [v])
      (def b13-box (B13Box. 1))
      (println (= b13-box b13-box))
      (println (= b13-box (B13Box. 1)))
      (println (get b13-box :v))
      (println (contains? b13-box :v))
      (println (try (keys b13-box) (catch Exception e :threw)))
      (println (try (count b13-box) (catch Exception e :threw)))
      (println (try (seq b13-box) (catch Exception e :threw)))
      (println (try (assoc b13-box :w 2) (catch Exception e :threw)))
      (println (try (b13-hello 1.5) (catch Exception e :threw)))
      (println (class b13-box))
      (println (instance? B13Box b13-box))
      (extend-type String B13Greet (b13-hello [s] :str))
      (println (b13-hello "x"))
      (extend String B13Greet {:b13-hello (fn [s] :fn)})
      (println (b13-hello "y"))
    expected: |
      :a
      :b
      true
      true
      false
      true
      false
      nil
      false
      :threw
      :threw
      :threw
      :threw
      :threw
      :B13Box
      true
      :str
      :fn
  - name: deftype-mutable-fields-assign-through-set
    # b61: ^:unsynchronized-mutable / ^:volatile-mutable fields are assignable with
    # set! inside the type's own methods (set! answers the value); a read after
    # another method's write sees it; a closure (fn, #(), letfn, reify, lazy-seq,
    # for) copies the field at creation; a parameter shadows a mutable or an
    # immutable field (before b61 the immutable field shadowed it back); the field is
    # private to .-field; a non-dynamic global's set! signals at run time. Every
    # line matches the oracle (Clojure CLI 1.12) byte for byte.
    source: |
      (defprotocol B61Counter
        (b61-bump! [c]) (b61-peek [c]) (b61-via-self [c]) (b61-reader [c])
        (b61-shadow [c x]) (b61-captures [c]))
      (deftype B61Box [^:unsynchronized-mutable x ^:volatile-mutable n label]
        B61Counter
        (b61-bump! [_] (set! n (+ n 10)) (set! x (inc x)))
        (b61-peek [_] [x n label])
        (b61-via-self [this] (b61-bump! this) x)
        (b61-reader [_] (fn [] x))
        (b61-shadow [_ x] x)
        (b61-captures [_]
          (let [r (reify B61Counter (b61-peek [_] x))
                s (lazy-seq (list x))]
            (letfn [(g [] x)]
              (loop [i 0] (when (< i 3) (set! x (+ x i)) (recur (inc i))))
              [(b61-peek r) (first s) (g) (vec (for [i [1]] x)) (#(+ x %) 100) x]))))
      (def b61-a (B61Box. 1 0 :a))
      (println (b61-bump! b61-a))
      (println (b61-peek b61-a))
      (println (b61-via-self b61-a))
      (def b61-r (b61-reader b61-a))
      (b61-bump! b61-a)
      (println (b61-r) (b61-peek b61-a))
      (println (b61-shadow b61-a 42))
      (deftype B61Pair [x] B61Counter (b61-shadow [_ x] x))
      (println (b61-shadow (B61Pair. 1) 43))
      (println (b61-captures b61-a))
      (def b61-b (->B61Box 10 0 :b))
      (b61-bump! b61-b)
      (println (b61-peek b61-a) (b61-peek b61-b))
      (println (.-label b61-a))
      (println (try (.-x b61-a) (catch Exception e :private)))
      (def b61-y 1)
      (println (try (set! b61-y 2) (catch Exception e :root-binding)) b61-y)
    expected: |
      2
      [2 10 :a]
      3
      3 [4 30 :a]
      42
      43
      [4 4 4 [7] 107 7]
      [7 30 :a] [11 10 :b]
      :a
      :private
      :root-binding 1
  - name: jio-reader-resolves-on-every-backend
    # clojure.java.io resolves beside clojure.string, for reader only: the alias,
    # the referred bare var and the fully-qualified spelling all name the same
    # one-argument open, which prints as a function value without touching the
    # filesystem -- so this case runs unmodified on all four backends. Opening a
    # path, reading a reader through line-seq and closing through with-open need
    # files and live in ClojureInteropTest (interpreter and JVM); without a
    # preopened directory both wasm backends refuse with the file-error
    # (ClojureWasmFileRefusalTest); an unknown jio fn is a lowering refusal
    # (ClojureLoweringTest).
    source: |
      (ns b22jio (:require [clojure.java.io :as jio :refer [reader]]))
      (println jio/reader)
      (println reader)
      (println clojure.java.io/reader)
      (println (map jio/reader []))
      (println (map reader []))
    expected: |
      #<procedure>
      #<procedure>
      #<procedure>
      nil
      nil
  - name: mapv-answers-vectors
    # mapv maps over one or more collections and answers a vector (never a lazy
    # wrapper, even over lazy inputs); class pins the vector answer. The hangman
    # letters shape (mapv char over a range) counts 26 from a to z.
    source: |
      (println (mapv inc [1 2 3]))
      (println (mapv + [1 2 3] [10 20]))
      (println (mapv inc []))
      (println (mapv inc nil))
      (println (class (mapv inc [1])))
      (println (mapv char (range 97 101)))
      (let [b18-letters (mapv char (range 97 123))] (println (count b18-letters) (first b18-letters) (last b18-letters)))
      (println (mapv inc (concat (lazy-seq [1 2]) [3])))
      (println (map mapv [inc] [[1 2]]))
    expected: |
      [2 3 4]
      [11 22]
      []
      []
      :vector
      [a b c d]
      26 a z
      [2 3 4]
      ([2 3])
  - name: filterv-answers-vectors
    # filterv is the strict vector arm of filter: Clojure truthiness (false drops
    # like nil), sets work as predicates through the dispatcher, empty answers [].
    source: |
      (println (filterv odd? [1 2 3 4]))
      (println (filterv odd? []))
      (println (filterv odd? nil))
      (println (class (filterv odd? [1])))
      (println (filterv #{:h} [:h :t :h]))
      (println (filterv odd? (concat (lazy-seq [1 2 3]) [4])))
      (println (map filterv [odd?] [[1 2 3]]))
    expected: |
      [1 3]
      []
      []
      :vector
      [:h :h]
      [1 3]
      ([1 3])
  - name: mapcat-concats-mapped-views
    # mapcat concats the mapped seq views strictly (nil-safe like concat); the
    # eager.clj shape maps vals over single-entry maps in order.
    source: |
      (println (mapcat reverse [[1 2] [3 4]]))
      (println (mapcat identity [nil [1] nil]))
      (println (mapcat reverse []))
      (println (mapcat reverse nil))
      (println (mapcat vector [1 2] [3 4]))
      (println (mapcat vals [{:a 1} {:b 2}]))
      (println (map vals [{:a 1} {:b 2}]))
      (println (mapcat vector (concat (lazy-seq [1]) [2])))
      (println (map mapcat [vector] [[[1 2]]]))
    expected: |
      (2 1 4 3)
      (1)
      nil
      nil
      (1 3 2 4)
      (1 2)
      ((1) (2))
      (1 2)
      (([1 2]))
  - name: ffirst-and-nfirst-read-heads
    # ffirst is the head of the head, nfirst the tail of the head, each level
    # through the seq view (a vector head seqs before its own head is read); of
    # empty, nil.
    source: |
      (println (ffirst [[1 2]]))
      (println (ffirst [[1 2] [3 4]]))
      (println (ffirst []) (ffirst nil))
      (println (nfirst [[1 2 3]]))
      (println (nfirst [[1]]))
      (println (nfirst []) (nfirst nil))
      (println (map ffirst [[[1 2]] [[3]]]))
      (println (map nfirst [[[1 2 3]] [[4 5]]]))
    expected: |
      1
      1
      nil nil
      (2 3)
      nil
      nil nil
      (1 3)
      ((2 3) (5))
  - name: boolean-answers-truthiness
    # boolean is true for anything truthy (only nil and false are falsey,
    # including 0, empty strings and empty collections).
    source: |
      (println (boolean 1))
      (println (boolean nil) (boolean false))
      (println (boolean 0) (boolean "") (boolean []) (boolean {}))
      (println (map boolean [1 nil false 0 ""]))
    expected: |
      true
      false false
      true true true true
      (true false false true true)
  - name: char-converts-code-points
    # char answers the character itself, or the truncated code point of a number;
