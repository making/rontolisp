  - name: try-catch-finally-and-throw
    # try guards handler-case inside unwind-protect; every catch class answers
    # the catch-all error clause, so the first clause handles any condition (the
    # oracle would run the second clause of the iae/ex pair); throw renders in
    # Clojure notation, so strings keep their message.
    source: |
      (println (try (throw "boom") (catch Exception e "caught")))
      (println (try (throw "boom") (catch IllegalArgumentException e "iae") (catch Exception e "ex")))
      (println (try 1 (finally (println "fin"))))
      (println (try (throw "x") (catch Exception e (str "got-" e)) (finally (println "done"))))
      (println (try (+ 1 2) (catch Exception e "no")))
    expected: |
      caught
      iae
      fin
      1
      done
      got-x
      3
  - name: atoms-are-shared-cells
    # An atom is a tagged one-vector cell every verb reads and writes; swap!
    # spreads extra arguments over the function, compare-and-set! compares with
    # eql and answers a boolean. An atom itself prints unreadably (#<Atom value>),
    # not the oracle's object syntax.
    source: |
      (def a05 (atom 1))
      (println @a05)
      (println (swap! a05 inc))
      (println (swap! a05 + 10 20))
      (println (reset! a05 2))
      (println (compare-and-set! a05 2 3))
      (println (compare-and-set! a05 2 9))
      (println @a05)
      (println (deref a05))
      (println @(volatile! 5))
      (println (map deref [(atom 1) (atom 2)]))
      (println (let [b05 (atom 0)] (reset! b05 41) (swap! b05 inc)))
    expected: |
      1
      2
      32
      2
      true
      false
      3
      3
      5
      (1 2)
      42
  - name: multimethods-dispatch-over-a-table
    # defmulti is a method table plus a dispatcher defun; defmethod stores,
    # remove-method drops, get-method reads, and a miss falls back to the
    # default dispatch value (:default without an option) or signals.
    source: |
      (defmulti m05 :shape)
      (defmethod m05 :circle [m] 1)
      (defmethod m05 :square [m] 2)
      (defmethod m05 :default [m] 0)
      (println (m05 {:shape :circle}))
      (println (m05 {:shape :square}))
      (println (m05 {:shape :tri}))
      (defmulti m05b "adds" (fn [x] (:t x)) :default :other)
      (defmethod m05b :other [x] 99)
      (println (m05b {:t :zzz}))
      (println (m05b {:t :other}))
      (defmulti m05c (fn [x y] (:t x)))
      (defmethod m05c :a [x y] (+ y 1))
      (println (m05c {:t :a} 41))
      (println ((get-method m05 :circle) {:shape :circle}))
      (remove-method m05 :circle)
      (println (get-method m05 :circle))
      (println (m05 {:shape :circle}))
    expected: |
      1
      2
      0
      99
      99
      42
      1
      nil
      0
  - name: hierarchies-derive-isa-and-prefer
    # derive/underive rewrite the global hierarchy value; isa?/parents/ancestors/
    # descendants read it (sets print in #{...}, single members only here -- the walk
    # order is unspecified); a multimethod
    # miss walks every method the dispatch value descends from, the strictly most
    # specific wins, prefer-method breaks ties, and an unbroken tie or a miss with
    # no default method signals. A custom hierarchy value is pure: derive returns
    # an updated map, and defmulti :hierarchy dispatches through it.
    source: |
      (derive :h-circle :h-shape)
      (derive :h-square :h-shape)
      (println (isa? :h-circle :h-shape))
      (println (isa? :h-shape :h-circle))
      (println (isa? :h-circle :h-circle))
      (println (parents :h-circle))
      (println (ancestors :h-circle))
      (println (count (descendants :h-shape)))
      (println (contains? (descendants :h-shape) :h-circle))
      (println (contains? (descendants :h-shape) :h-square))
      (defmulti h08 :shape)
      (defmethod h08 :h-shape [m] 0)
      (defmethod h08 :h-circle [m] 1)
      (println (h08 {:shape :h-circle}))
      (println (h08 {:shape :h-square}))
      (println (try (h08 {:shape :h-tri}) (catch Exception e "miss")))
      (println (underive :h-circle :h-shape))
      (println (isa? :h-circle :h-shape))
      (println (h08 {:shape :h-circle}))
      (def h08map (make-hierarchy))
      (def h08map2 (derive h08map :h-p :h-q))
      (println (isa? h08map2 :h-p :h-q))
      (println (isa? h08map :h-p :h-q))
      (println (parents h08map2 :h-p))
      (defmulti h08c :t :hierarchy h08map2)
      (defmethod h08c :h-q [x] "q!")
      (println (h08c {:t :h-p}))
      (println (try (h08c {:t :h-zzz}) (catch Exception e "miss")))
      (defmulti h08p :t)
      (defmethod h08p :h-x [m] "x")
      (defmethod h08p :h-y [m] "y")
      (derive :h-a :h-x)
      (derive :h-a :h-y)
      (prefer-method h08p :h-x :h-y)
      (println (h08p {:t :h-a}))
      (println (try (do (defmulti h08amb :t) (defmethod h08amb :h-x [m] 1) (defmethod h08amb :h-y [m] 2) (h08amb {:t :h-a})) (catch Exception e "amb")))
    expected: |
      true
      false
      true
      #{:h-shape}
      #{:h-shape}
      2
      true
      true
      1
      0
      miss
      nil
      false
      1
      true
      false
      #{:h-q}
      q!
      miss
      x
      amb
  - name: auto-resolved-keywords-use-the-file-ns
    # ::kw resolves against the file's ns name, ::alias/kw against the alias;
    # :a/b stays opaque. The corpus shapes: interest-rate/account-level over :tag,
    # service-charge2 vector pairs, derive plus service-charge3 over the parent.
    source: |
      (ns b19auto (:require [clojure.string :as str]))
      (println ::checking)
      (println ::str/join)
      (println (name ::str/join))
      (println (namespace ::str/join))
      (println (= ::checking :b19auto/checking))
      (println (::checking {:b19auto/checking 7}))
      (println (::missing {:b19auto/checking 7} :dflt))
      (defmulti b19rate :tag)
      (defmethod b19rate ::checking [_] 0)
      (defmethod b19rate ::savings [_] 5)
      (println (b19rate {:tag ::checking}))
      (println (b19rate {:tag ::savings}))
      (derive ::savings ::account)
      (derive ::checking ::account)
      (println (isa? ::savings ::account))
      (println (parents ::savings))
      (defmulti b19level :tag)
      (defmethod b19level ::checking [a] (if (>= (:balance a) 5000) ::premium ::basic))
      (defmethod b19level ::savings [a] (if (>= (:balance a) 1000) ::premium ::basic))
      (defmulti b19charge (fn [a] [(b19level a) (:tag a)]))
      (defmethod b19charge [::basic ::checking] [_] 25)
      (defmethod b19charge [::basic ::savings] [_] 10)
      (defmethod b19charge [::premium ::account] [_] 0)
      (println (b19charge {:tag ::checking :balance 100}))
      (println (b19charge {:tag ::savings :balance 100}))
      (println (b19charge {:tag ::checking :balance 9000}))
      (println (b19charge {:tag ::savings :balance 9000}))
    expected: |
      :b19auto/checking
      :clojure.string/join
      join
      clojure.string
      true
      7
      :dflt
      0
      5
      true
      #{:b19auto/account}
      25
      10
      0
      0
  - name: class-dispatch-maps-host-spellings-to-kind-keywords
    # A defmethod over class names stores under the keyword class answers
    # (Long/Double merge into :number, like every numeric spelling); dotted and
    # clojure.lang names resolve first. nil answers both the :nil keyword and the
    # identity nil; Object catches past the search but ahead of the default; the
    # pi.clj run-simulation shape dispatches [Map Number] pairs element-wise.
    source: |
      (defmulti b19print class)
      (defmethod b19print String [s] (str "str:" s))
      (defmethod b19print Number [n] (str "num:" n))
      (defmethod b19print nil [_] "was-nil")
      (defmethod b19print :default [x] "dflt")
      (println (b19print "a"))
      (println (b19print 1))
      (println (b19print 1.5))
      (println (b19print nil))
      (println (b19print :k))
      (println (b19print [1 2]))
      (defmethod b19print java.util.Map [m] "map!")
      (println (b19print {:a 1}))
      (defmethod b19print clojure.lang.IPersistentVector [v] "vec!")
      (println (b19print [1 2]))
      (defmethod b19print java.util.Collection [c] "coll!")
      (println (b19print (list 1)))
      (prefer-method b19print clojure.lang.IPersistentVector java.util.Collection)
      (println (b19print [1 2]))
      (defmulti b19id identity)
      (defmethod b19id nil [_] "was-nil")
      (defmethod b19id :default [x] "dflt")
      (println (b19id nil))
      (println (b19id 1))
      (println ((get-method b19id nil) nil))
      (remove-method b19id nil)
      (println (b19id nil))
      (defmulti b19obj class :default :dflt)
      (defmethod b19obj Object [x] "obj!")
      (defmethod b19obj :dflt [x] "d!")
      (println (b19obj "a"))
      (println (b19obj :k))
      (defmulti b19sim (fn [& args] (into [] (map class args))))
      (defmethod b19sim [Number] [n] (str "n:" n))
      (defmethod b19sim [java.util.Map] [m] "m")
      (defmethod b19sim [java.util.Map Number] [m n] "mn")
      (println (b19sim 5))
      (println (b19sim {:a 1}))
      (println (b19sim {:a 1} 2))
      (println (try (b19sim [1] 2) (catch Exception e "miss")))
    expected: |
      str:a
      num:1
      num:1.5
      was-nil
      dflt
      dflt
      map!
      vec!
      coll!
      vec!
      was-nil
      dflt
      was-nil
      dflt
      obj!
      obj!
      n:5
      m
      mn
      miss
  - name: ex-info-carries-data-through-throw
    # ex-info builds a condition with message and data slots (its report prints
    # the message); throw signals an ex-info value as its own condition, anything
    # else through its Clojure-notation rendering; ex-data answers the map (nil for
    # any other condition) and ex-message the message. Each works as a function
    # value.
    source: |
      (println (try (throw (ex-info "boom" {:code 42})) (catch Exception e (get (ex-data e) :code))))
      (println (try (throw (ex-info "boom" {:code 42})) (catch Exception e (ex-message e))))
      (println (try (throw "plain") (catch Exception e (ex-data e))))
      (println (try (throw "plain") (catch Exception e (str "got-" e))))
      (println (map ex-data [(ex-info "m" 1) "nope"]))
      (println (map ex-message [(ex-info "m" 1) "nope"]))
      (println (ex-data (apply ex-info ["v" 2])))
    expected: |
      42
      boom
      nil
      got-plain
      (1 nil)
      (m nope)
      2
  - name: memfn-calls-a-method-on-its-target
    # memfn is a function of a target and the named arguments calling the method
    # on it; string receivers take the mapped core operation, like any instance
    # call, so this case runs on all four backends.
    source: |
      (println ((memfn toUpperCase) "hi"))
      (println ((memfn substring s e) "hello" 1 2))
      (println (map (memfn length) ["a" "bb"]))
      (println (apply (memfn substring s e) "hello" [1 2]))
    expected: |
      HI
      e
      (1 2)
      e
  - name: string-replace-and-split-stay-literal
    # There is no regex runtime: split/replace match literal strings, so a
    # pattern that is special in regex syntax matches only itself. Regex
    # literals (#"...") stay refused at the reader.
    source: |
      (ns b08lit (:require [clojure.string :as s]))
      (println (s/replace "aaa" "." "b"))
      (println (s/split "aaa" "."))
      (println (s/replace-first "aaa" "a+" "b"))
      (println (.split "aaa" "."))
    expected: |
      aaa
      (aaa)
      aaa
      (aaa)
  - name: pr-and-pr-str-are-readable
    # pr/prn are the readable arms of print/println, pr-str of str: strings print
    # quoted, chars with their backslash, collections in Clojure notation.
    source: |
      (pr \a)
      (newline)
      (pr "x" [1 :a] {:b 2} #{3})
      (newline)
      (println (pr-str [1 :a] "x" \a))
      (println (pr-str))
      (println (pr-str nil))
      (println (map pr-str ["a" 1]))
    expected: |
      \a
      "x" [1 :a] {:b 2} #{3}
      [1 :a] "x" \a

      nil
      ("a" 1)
  - name: collections-nest-in-clojure-notation
    # Vectors, maps, sets and lists nest with their own brackets; nil stays nil
    # (never ()).
    source: |
      (println [{:a [1 :b]} #{:c} (list true false nil)])
      (println (list {:a 1} [2] #{3} "s" \c))
      (println [])
      (println {})
      (println #{})
    expected: |
      [{:a [1 :b]} #{:c} (true false nil)]
      ({:a 1} [2] #{3} s c)
      []
      {}
      #{}
  - name: cycles-print-with-datum-labels
    # A value that closes a cycle prints with a datum label, like Scheme's write:
    # an atom holding itself, and a map reaching itself through an atom.
    source: |
      (def cyc07 (atom nil))
      (reset! cyc07 cyc07)
      (println cyc07)
      (def cyc07m {:self cyc07})
      (reset! cyc07 cyc07m)
      (println cyc07)
      (println @cyc07)
    expected: |
      #0=#<Atom #0#>
      #0=#<Atom {:self #0#}>
      #0={:self #<Atom #0#>}
  - name: unreadable-values-print-in-angle-brackets
    # Functions and atoms have no readable notation: a function prints
    # #<procedure>, an atom #<Atom value>.
    source: |
      (println (atom 1))
      (println (fn [x] x))
      (println (map deref [(atom 1) (atom 2)]))
    expected: |
      #<Atom 1>
      #<procedure>
      (1 2)
  - name: throw-and-miss-messages-use-clojure-notation
    # throw of a non-ex-info value signals its Clojure-notation rendering, and a
    # multimethod miss names its dispatch value the same way.
    source: |
      (println (try (throw {:a 1}) (catch Exception e (ex-message e))))
      (println (try (throw [1 :a]) (catch Exception e (str "got-" e))))
      (defmulti b07m :t)
      (defmethod b07m :a [x] 1)
      (println (try (b07m {:t :zzz}) (catch Exception e (ex-message e))))
    expected: |
      {:a 1}
      got-[1 :a]
      No method in b07m for dispatch value: :zzz
  - name: doseq-prints-and-answers-nil
    # doseq iterates the seq view for side effects and answers nil: nested pairs
    # cross like for, patterns destructure, :when skips, :while ends its level,
    # :let binds sequentially. An empty vector runs the body once; nil runs it
    # never.
    source: |
      (println (doseq [x [1 2] :let [y (* x 10)]] (print y)))
      (println (doseq [x [1 2 3] :when (odd? x)] (print x)))
      (println (doseq [x [1 2 3 4] :while (< x 3)] (print x)))
      (def b10-log (atom []))
      (defn b10-push [v e] (conj v e))
      (doseq [x [1 2 3]] (swap! b10-log b10-push x))
      (println @b10-log)
      (println (doseq [x [1 2 3]] x))
      (doseq [x [1 2] y [3 4]] (swap! b10-log b10-push [x y]))
      (println @b10-log)
      (doseq [c "ab"] (swap! b10-log b10-push c))
      (println @b10-log)
      (doseq [e {:k 9}] (swap! b10-log b10-push e))
      (println @b10-log)
      (println (doseq [x [1]]))
      (println (doseq [] (print 9)))
      (println (doseq [x nil] 1))
    expected: |
      1020nil
      13nil
      12nil
      [1 2 3]
      nil
      [1 2 3 [1 3] [1 4] [2 3] [2 4]]
      [1 2 3 [1 3] [1 4] [2 3] [2 4] a b]
      [1 2 3 [1 3] [1 4] [2 3] [2 4] a b [:k 9]]
      nil
      9nil
      nil
  - name: dotimes-counts
    # dotimes binds 0 below the count and answers nil. The count runs through
    # truncate first (the oracle's intCast): 2.5 counts 0 1, and a non-number
    # signals there.
    source: |
      (def b10-n (atom []))
      (dotimes [i 3] (swap! b10-n b10-push i))
      (println @b10-n)
      (println (dotimes [i 3] i))
      (println (dotimes [i 0] 1))
      (dotimes [i 2] (swap! b10-n b10-push (* i 10)))
      (println @b10-n)
      (dotimes [i 2.5] (swap! b10-n b10-push i))
      (println @b10-n)
      (println (dotimes [i 2] (dotimes [j 2] (swap! b10-n b10-push [i j]))))
      (println @b10-n)
    expected: |
      [0 1 2]
      nil
      nil
      [0 1 2 0 10]
      [0 1 2 0 10 0 1]
      nil
      [0 1 2 0 10 0 1 [0 0] [0 1] [1 0] [1 1]]
  - name: for-with-when-let-while
    # for answers the strict list of its body over every combination; :when skips,
    # :while ends its level (an outer one ends the whole comprehension), :let binds
    # sequentially. An empty result is nil, where the oracle prints ().
    source: |
      (println (for [x [1 2 3] :when (odd? x)] (* x 10)))
      (println (for [x [1 2 3 4] :while (< x 3)] x))
      (println (for [x [1 2] :let [y (* x 10)]] y))
      (println (for [x [1 2 3] :when (odd? x) :while (< x 3)] x))
      (println (for [x []] x))
      (println (for [x nil] x))
    expected: |
      (10 30)
      (1 2)
      (10 20)
      (1)
      nil
      nil
  - name: for-nesting-and-destructuring
    # Nested pairs cross left to right; vector and map patterns destructure through
    # the let lowering. An inner :while ends only its own level while the outer
    # loops continue, measured on the oracle (Clojure CLI 1.12).
    source: |
      (println (for [x [1 2] y [3 4]] [x y]))
      (println (for [x [1 2 3] y [10 20] :while (< y 15)] [x y]))
      (println (for [[a b] [[1 2] [3 4]]] (+ a b)))
      (println (for [{:keys [k]} [{:k 1} {:k 2}]] k))
      (println (for [x [1 2] :let [[a b] [x (* x 10)]]] [a b]))
      (println (for [[[a b] c] [[[1 2] 3]]] [a b c]))
    expected: |
      ([1 3] [1 4] [2 3] [2 4])
      ([1 10] [2 10] [3 10])
      (3 7)
      (1 2)
      ([1 10] [2 20])
      ([1 2 3])
  - name: dorun-doall
    # Seqs are already strict, so realizing one is evaluating it: dorun answers
    # nil, doall the collection itself (never coerced -- a vector stays a vector).
    # Both take an optional count, and both name function values.
    source: |
      (println (dorun [1 2 3]))
      (println (doall [1 2 3]))
      (println (dorun 2 [1 2 3]))
      (println (doall 2 [1 2 3]))
      (println (doall nil))
      (def b10-seen (atom []))
      (println (dorun (map #(swap! b10-seen b10-push %) [1 2])))
      (println @b10-seen)
      (println (doall (map inc [1 2])))
      (println (map dorun [[1] [2]]))
      (println (map doall [[1] [2]]))
    expected: |
      nil
      [1 2 3]
      nil
      [1 2 3]
      nil
      nil
      [1 2]
      (2 3)
      (nil nil)
      ([1] [2])
  - name: defmacro-unless-expands-before-backends
    # A defmacro is a compile-time expander plus its runtime table entry: call sites
    # expand while lowering (every backend runs expanded code), and macroexpand-1 sees
    # the same function at run time. Expansions print demangled and uppercased, like
    # every other symbol spelling here.
    source: |
      (defmacro sp-unless [c t] (list 'if c nil t))
      (println (macroexpand-1 '(sp-unless true 1)))
      (println (macroexpand '(sp-unless false 42)))
      (println (sp-unless false 42))
      (println (sp-unless true 1))
      (println (macroexpand-1 '(+ 1 2)))
    expected: |
      (IF true nil 1)
      (IF false nil 42)
      42
      nil
      (+ 1 2)
  - name: chain-macros-rebuild-dot-forms
    # The book's chain_1..5, ported: list/concat bodies, then syntax-quote bodies with
    # ~ and ~@ (chain_4's ~more keeps the list whole -- the wrong shape, like the
    # book's). Expansions print; the runnable ones run through the string-method
    # mapping, so every backend agrees.
    source: |
      (defmacro sp-chain1 [x form] (list '. x form))
      (defmacro sp-chain2 ([x form] (list '. x form)) ([x form & more] (concat (list 'sp-chain2 (list '. x form)) more)))
      (defmacro sp-chain3 [x form] `(. ~x ~form))
      (defmacro sp-chain4 ([x form] `(. ~x ~form)) ([x form & more] `(sp-chain4 (. ~x ~form) ~more)))
      (defmacro sp-chain5 ([x form] `(. ~x ~form)) ([x form & more] `(sp-chain5 (. ~x ~form) ~@more)))
      (println (macroexpand-1 '(sp-chain1 a b)))
      (println (macroexpand-1 '(sp-chain2 a b c)))
      (println (macroexpand-1 '(sp-chain3 a b)))
      (println (macroexpand-1 '(sp-chain4 a b c)))
      (println (macroexpand-1 '(sp-chain5 a b c)))
      (println (macroexpand '(sp-chain5 a b c)))
      (println (macroexpand '(sp-chain2 a b c d)))
      (println (sp-chain1 "hi" toUpperCase))
      (println (sp-chain5 "hi" toUpperCase length))
    expected: |
      (. A B)
      (SP-CHAIN2 (. A B) C)
      (. A B)
      (SP-CHAIN4 (. A B) (C))
      (SP-CHAIN5 (. A B) C)
      (. (. A B) C)
      (. (. (. A B) C) D)
      HI
      2
  - name: bench-hygiene-through-gensyms
    # The book's bench: x# binds one gensym per expansion (fresh across expansions,
    # one symbol within one), so the measurement locals never capture. The timer is a
    # portable count here -- System/nanoTime has no wasm leg -- and only the
    # deterministic answers print.
    source: |
      (defmacro sp-bench [expr] `(let [start# (count [1]) result# ~expr] {:result result# :elapsed (- (count [1 2]) start#)}))
      (println (:result (sp-bench (+ 1 2))))
      (println (:elapsed (sp-bench (+ 1 2))))
      (println (not (= (macroexpand-1 '(sp-bench 1)) (macroexpand-1 '(sp-bench 1)))))
      (let [sp-e (macroexpand-1 '(sp-bench 41)) sp-bv (nth sp-e 1)]
        (println (list (= (nth sp-bv 0) (nth sp-bv 0)) (= (nth sp-bv 0) (get (nth sp-e 2) :result)) (= (nth sp-bv 2) (get (nth sp-e 2) :result)))))
    expected: |
      3
      1
      true
      (true false true)
  - name: gensym-answers-fresh-symbols
    source: |
      (let [sp-g1 (gensym "sp-t") sp-g2 (gensym "sp-t")]
        (println (list (= sp-g1 sp-g1) (= sp-g1 sp-g2))))
      (println (= (gensym) (gensym)))
    expected: |
      (true false)
      false
  - name: keep-and-keep-indexed
    # keep answers the non-nil results (false is kept, like the oracle); a
    # signalling function signals -- (keep inc [1 nil 2]) throws on the oracle,
    # so the signal (not a silent skip) is pinned in ClojureInteropTest.
    # keep-indexed threads the index (the index_of_any.clj shape).
    source: |
      (defn b15-index-filter [pred coll]
        (keep-indexed (fn [idx item] (when (pred item) idx)) coll))
      (defn b15-index-of-any [pred coll]
        (first (b15-index-filter pred coll)))
      (println (b15-index-of-any #{:a} [:b :a :c]))
      (println (b15-index-of-any #{:z} [:b :a]))
      (println (keep inc [1 2 3]))
      (println (keep (fn [x] x) [1 nil 2 false]))
      (println (map-indexed vector [:a :b]))
    expected: |
      1
      nil
      (2 3 4)
      (1 2 false)
      ([0 :a] [1 :b])
  - name: exploring-indexed-and-literal-join
    # The exploring.clj shapes without regex: indexed over map-indexed, and a
    # join over a literal split (regex stays refused at the reader).
    source: |
      (ns b15-str (:require [clojure.string :as s]))
      (defn b15-indexed [coll] (map-indexed vector coll))
      (println (b15-indexed [:a :b]))
      (println (s/join "-" (conj (into [] (s/split "a b c" " ")) "...")))
      (println (format "Hello, %s" "world"))
    expected: |
      ([0 :a] [1 :b])
      a-b-c-...
      Hello, world
  - name: count-runs-over-partitions
    # The functional.clj shape: count-if over comp, runs over partition, heads
    # over partial applied to a set predicate.
    source: |
      (def b15-count-if (comp count filter))
      (defn b15-count-runs [n pred coll]
        (b15-count-if (fn [run] (every? pred run)) (partition n 1 coll)))
      (println (b15-count-runs 2 #{:h} [:h :t :h :h]))
      (def b15-count-heads-pairs (partial b15-count-runs 2 #{:h}))
      (println (b15-count-heads-pairs [:h :h :t]))
      (println (partition 2 [1 2 3]))
    expected: |
      1
      1
      ((1 2))
  - name: nested-map-updates
    # The note.clj slice over plain maps: update, update-in, assoc-in, get-in.
    source: |
      (println (update {:octave 4} :octave dec))
      (println (update-in {:a {:b 1}} [:a :b] inc))
      (println (assoc-in {} [:a :b] 1))
      (println (assoc-in {} [] 5))
      (println (get-in {:a {:b 1}} [:a :b]))
      (println (get-in {} [:a :b] :dflt))
      (println (update {:a 1} :a + 10 20))
    expected: |
      {:octave 3}
      {:a {:b 2}}
      {:a {:b 1}}
      {nil 5}
      1
      :dflt
      {:a 31}
  - name: seq-combinators
    source: |
      (println (remove odd? [1 2 3 4]))
      (println (distinct [3 1 3 2 1]))
      (println (partition 3 [1 2 3 4 5 6 7]))
      (println (take-while pos? [3 1 -1 5]))
