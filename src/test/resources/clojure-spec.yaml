  - name: bigint-and-bigdec-strings-refuse-surrounding-whitespace
    # Oracle-identical (clj 1.12.6): BigInteger and BigDecimal parse the whole string, so a space,
    # tab or newline on either side refuses; a leading sign is accepted.
    source: |
      (defn bw-refused [f] (try (f) :no (catch Exception e :refused)))
      (prn (map #(str (bigint %)) ["12" "+12" "-12" "0" "007" "-0"]) (map #(str (biginteger %)) ["12" "+12"]))
      (prn (map bw-refused [#(bigint " 12 ") #(bigint " 12") #(bigint "12 ") #(bigint "\t12") #(bigint "12\n") #(bigint "1 2") #(bigint "") #(bigint " ") #(bigint "-") #(bigint "+") #(bigint "1_0") #(bigint "1.5") #(bigint "0x1F") #(biginteger " 12") #(biginteger "12 ")]))
      (prn (map #(double (bigdec %)) ["1.5" "+1.5" "-1.5" ".5" "1." "1e3" "1E+3" "0"]))
      (prn (map bw-refused [#(bigdec " 1.5") #(bigdec "1.5 ") #(bigdec "\t1.5") #(bigdec "1.5\n") #(bigdec "1 .5") #(bigdec "") #(bigdec " ") #(bigdec "-") #(bigdec "+") #(bigdec "1e") #(bigdec "1_0") #(bigdec "a")]))
    expected: |
      ("12" "12" "-12" "0" "7" "0") ("12" "12")
      (:refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused)
      (1.5 1.5 -1.5 0.5 1.0 1000.0 1000.0 0.0)
      (:refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused)
  - name: sorted-collections-refuse-like-the-oracle
    # The first three lines are the oracle's messages (clj 1.12.6); on the last the
    # oracle names Java casts (PersistentVector cannot be cast to clojure.lang.Sorted,
    # Keyword to java.util.Comparator, to java.lang.Number).
    source: |
      (defn sc-msg [f] (try (pr-str (f)) (catch Exception e (ex-message e))))
      (println (sc-msg #(sorted-map :a)) "|" (sc-msg #(sorted-map nil)))
      (println (sc-msg #(sorted-set '(1 2))) "|" (sc-msg #(conj (sorted-set) {:a 1})) "|" (sc-msg #(assoc (sorted-map) (sorted-set 1) 1)))
      (println (sc-msg #(vector-of :foo 1)) "|" (sc-msg #(vector-of :byte 200)) "|" (sc-msg #(vector-of :short 70000)) "|" (sc-msg #(vector-of :int 3000000000)) "|" (sc-msg #(vector-of :char 65536)))
      (println (sc-msg #(subseq [1 2 3] > 1)) "|" (sc-msg #(sorted-set-by :foo 1)) "|" (sc-msg #(compare 1 :a)) "|" (sc-msg #(get (sorted-map :a 1) 1)))
    expected: |
      No value supplied for key: :a | No value supplied for key: null
      Default comparator requires nil, Number, or Comparable: (1 2) | Default comparator requires nil, Number, or Comparable: {:a 1} | Default comparator requires nil, Number, or Comparable: #{1}
      Unrecognized type :foo | Value out of range for byte: 200 | Value out of range for short: 70000 | integer overflow | Value out of range for char: 65536
      subseq needs a sorted collection | a sorted collection needs a comparator function | compare needs two values of one comparable kind | compare needs two values of one comparable kind
  - name: clojure-set-grows-and-shrinks-a-sorted-set
    # Oracle-identical (clj 1.12.6): union grows the larger input, so a sorted set
    # stays one, and rename-keys keeps a sorted map sorted.
    source: |
      (prn (clojure.set/union (sorted-set 1 2) #{3}) (clojure.set/union #{3} (sorted-set 1 2)) (clojure.set/difference (sorted-set 1 2 3) #{3 2}) (clojure.set/intersection (sorted-set 1 2 3) #{2}))
      (prn (clojure.set/subset? (sorted-set 1) #{1 2}) (clojure.set/superset? (sorted-set 1 2) #{1}) (clojure.set/select odd? (sorted-set 1 2 3)) (clojure.set/rename-keys (sorted-map :a 1 :b 2) {:a :c}))
    expected: |
      #{1 2 3} #{1 2 3} #{1} #{2}
      true true #{1 3} {:b 2, :c 1}
  - name: sorted-collections-carry-metadata-and-travel-through-macros
    # Oracle-identical (clj 1.12.6): with-meta keeps the order, and a macro answering a
    # sorted collection gives back a literal of its kind, which is unsorted, like the
    # oracle's compiler.
    source: |
      (defmacro sc-sorted [] (sorted-map-by > :a 1))
      (prn (meta (with-meta (sorted-map :a 1) {:m 1})) (with-meta (sorted-set 2 1) {:m 1}) (sc-sorted) (sorted? (sc-sorted)))
    expected: |
      {:m 1} #{1 2} {:a 1} false
  - name: empty-answers-the-empty-collection-of-its-kind
    # Oracle-identical (clj 1.12.6): a vector, map, set or sorted collection answers an empty
    # one (a sorted one keeping its comparator), carrying the metadata; a string, nil and
    # anything that is no collection answer nil; a record refuses. Not pinned: a list, a seq
    # and a map entry (nil and [] here, () and nil in the oracle).
    source: |
      (defrecord EmptyRec [a])
      (prn (empty [1 2]) (empty {:a 1}) (empty #{1}) (empty "ab") (empty nil) (empty 1) (empty :a) (empty false))
      (prn (map empty [[1] {1 2} #{1} "ab" nil]) (= (empty [1]) []) (conj (empty [1 2]) 3) (assoc (empty {:a 1}) :b 2) (conj (empty #{1}) 2))
      (prn (empty (sorted-set 3 1)) (empty (sorted-map :a 1)) (conj (empty (sorted-set-by > 3 1)) 1 2 3) (assoc (empty (sorted-map-by > 1 :a)) 1 :x 2 :y))
      (prn (sorted? (empty (sorted-set 1))) (map? (empty (sorted-map :a 1))) (set? (empty (sorted-set 1))) (count (empty (sorted-map :a 1))))
      (prn (meta (empty (with-meta [1] {:a 1}))) (meta (empty (with-meta {1 2} {:b 1}))) (meta (empty (with-meta #{1} {:c 1}))) (meta (empty (with-meta (sorted-set 1) {:a 1}))) (meta (empty [1])))
      (prn (empty (atom 1)) (try (empty (->EmptyRec 1)) (catch Exception e (some? (re-find #"^Can't create empty: .*EmptyRec$" (ex-message e))))) (try (apply empty []) (catch Exception e :refused)))
    expected: |
      [] {} #{} nil nil nil nil nil
      ([] {} #{} nil nil) true [3] {:b 2} #{2}
      #{} {} #{3 2 1} {2 :y, 1 :x}
      true true true 0
      {:a 1} {:b 1} {:c 1} {:a 1} nil
      nil true :refused
  - name: comparator-answers-minus-one-one-or-zero-from-a-predicate
    # Oracle-identical (clj 1.12.6).
    source: |
      (prn (sort (comparator >) [1 3 2]) (sort (comparator (fn [a b] (< (count a) (count b)))) ["ccc" "a" "bb"]) (sort (comparator <) [3 1 2]))
      (prn ((comparator <) 1 2) ((comparator <) 2 1) ((comparator <) 1 1) ((comparator (fn [a b] nil)) 1 1) ((comparator (fn [a b] (= a 1))) 1 2) ((comparator (fn [a b] (= a 1))) 2 1))
      (prn (sorted-set-by (comparator >) 1 3 2) (sorted-map-by (comparator >) 1 :a 2 :b) (map (comparator >) [1 2] [2 1]) (sort-by - (comparator >) [1 3 2]))
      (prn (try (apply comparator []) (catch Exception e :refused)) (try (apply comparator [< <]) (catch Exception e :refused)) (try ((comparator false?) 1 2) (catch Exception e :refused)))
    expected: |
      (3 2 1) ("a" "bb" "ccc") (1 2 3)
      -1 1 0 0 -1 1
      #{3 2 1} {2 :b, 1 :a} (1 -1) (1 2 3)
      :refused :refused :refused
  - name: hash-set-builds-a-set-of-its-arguments
    # Oracle-identical (clj 1.12.6).
    source: |
      (prn (hash-set 1 2) (hash-set) (hash-set 1 1 2) (hash-set [1] [1]) (count (hash-set :a "b" nil :a)) (count (hash-set 1 2 3 1)))
      (prn (= (apply hash-set [1 2 3]) #{1 2 3}) (conj (hash-set 1) 2) (contains? (hash-set 1 2) 2) (= (hash-set 1 2) #{2 1}) (set? (hash-set)) (map hash-set [1 2]) (hash-set (sorted-set 1)))
    expected: |
      #{1 2} #{} #{1 2} #{[1]} 3 3
      true #{1 2} true true true (#{1} #{2}) #{#{1}}
  - name: a-double-prints-its-exponent-marker-in-uppercase
    # Oracle-identical (clj 1.12.6): Double.toString spells 1.0E19 and 1.5E-7; the plain
    # range (1.0E-3 up to 1.0E7) stays positional.
    source: |
      (println 1.0E19 (str 1.0E19) (pr-str 1.5e-7) [1e300] -1.0E-5 (str "x" 1e20 "y"))
      (prn 1e7 9999999.0 0.001 1.0E-4 1.2345E10 12345678.9 1.7976931348623157e308 4.9e-324 -1.0E22)
      (println (format "%s|%s" 1.0E19 [1e-10]) (pr-str 1e20 {:a 1e-10}) (with-out-str (prn 1e300)) (with-out-str (print 2.5e-8)))
      (println (str [1e20 1.5]) (str {:k 1e21}) (pr-str #{1e30}) (str '(1e-9)) (str ##Inf ##NaN) (pr-str ##Inf) (* 1.0 123456789012))
    expected: |
      1.0E19 1.0E19 1.5E-7 [1.0E300] -1.0E-5 x1.0E20y
      1.0E7 9999999.0 0.001 1.0E-4 1.2345E10 1.23456789E7 1.7976931348623157E308 4.9E-324 -1.0E22
      1.0E19|[1.0E-10] 1.0E20 {:a 1.0E-10} 1.0E300
       2.5E-8
      [1.0E20 1.5] {:k 1.0E21} #{1.0E30} (1.0E-9) InfinityNaN ##Inf 1.23456789012E11
  - name: ns-is-the-current-namespace-and-the-load-specials-have-their-values
    # Oracle-identical (clj 1.12.6, clj -M file) but for two spellings: the oracle prints a
    # namespace with its identity hash (#object[clojure.lang.Namespace 0x1dfd5f51 "nsv-a"])
    # and class answers the class, where class answers a keyword here. *ns* is the
    # namespace ns and in-ns switch to while the file runs, read when a function runs, so
    # nsv-here answers its caller's; binding rebinds it. *file* and *source-path* name the
    # file (a path that differs per leg), *repl* is false and not thread-bound, and the REPL
    # history vars are nil and thread-bound.
    source: |
      (ns nsv-a)
      (prn *ns* (str *ns*) (ns-name *ns*) (symbol? (ns-name *ns*)))
      (println *ns*)
      (defn nsv-here [] (str *ns*))
      (in-ns 'nsv-b)
      (clojure.core/prn (clojure.core/str clojure.core/*ns*) (nsv-a/nsv-here))
      (clojure.core/in-ns 'nsv-a)
      (prn (= *ns* (the-ns 'nsv-a)) (identical? *ns* (find-ns 'nsv-a)) (find-ns 'nsv-none) (str (the-ns *ns*)) (ns-name 'nsv-b))
      (prn (binding [*ns* (the-ns 'nsv-b)] (nsv-here)) (nsv-here) (map ns-name [(the-ns 'nsv-b)]) (some? (find-ns 'clojure.core)))
      (prn (try (the-ns 'nsv-none) (catch Exception e (ex-message e))))
      (prn (class *ns*) (thread-bound? #'*ns*) #'*ns* (meta *ns*) (seq? *ns*) (coll? *ns*))
      (prn [(string? *file*) (string? *source-path*) *repl* *1 *2 *3 *e])
      (prn (map thread-bound? [#'*file* #'*source-path* #'*1 #'*2 #'*3 #'*e #'*repl*]))
      (prn (try (set! *repl* true) (catch Exception e (ex-message e))) (set! *3 5) *3 (binding [*repl* 1] [*repl* (thread-bound? #'*repl*)]))
    expected: |
      #object[clojure.lang.Namespace "nsv-a"] "nsv-a" nsv-a true
      #object[clojure.lang.Namespace nsv-a]
      "nsv-b" "nsv-b"
      true true nil "nsv-a" nsv-b
      "nsv-b" "nsv-a" (nsv-b) true
      "No namespace: nsv-none found"
      :clojure.lang.Namespace true #'clojure.core/*ns* nil false false
      [true true false nil nil nil nil]
      (true true true true true true false)
      "Can't change/establish root binding of: *repl* with set" 5 5 [1 true]
  - name: ring-util-response-builds-and-augments-response-maps
    # The built-in ring.util.response (a Clojure source resource, .kb/clojure-frontend.md
    # "Ring util namespaces"); clj 1.12.6 + ring-core 1.15.5 prints the same. Each map
    # prints through its keys in a fixed order (map walk order is unspecified here).
    source: |
      (ns ring-resp (:require [ring.util.response :as r :refer [response]]))
      (def shape (juxt :status :headers :body))
      (prn (= (response "hi") {:status 200 :headers {} :body "hi"}) (shape (response "hi")))
      (prn (map shape [(r/redirect "/next") (r/redirect "/next" :see-other) (r/redirect "/next" 307)]))
      (prn (map shape [(r/created "/item/1") (r/created "/item/1" "made")]))
      (prn (map shape [(r/not-found "nf") (r/bad-request "br") (r/status 204) (r/redirect-after-post "/p")]))
      (let [resp (-> (response "x") (r/status 201) (r/header "X-Count" 3) (r/content-type "text/html"))]
        (prn (:status resp) (:body resp) (into (sorted-map) (:headers resp))))
      (prn (shape (r/status {:status 200 :headers {} :body "b"} 500)))
      (prn (into (sorted-map) (get-in (r/set-cookie (response "") "session" "abc" {:max-age 60}) [:cookies "session"])))
      (prn (:cookies (r/set-cookie (response "") "session" "abc")))
      (prn (r/response? (response "")) (r/response? {:status "200" :headers {}}) (r/response? nil))
      (prn (r/redirect-status-codes :permanent-redirect) (map (comp shape r/response) ["a" "b"]))
    expected: |
      true [200 {} "hi"]
      ([302 {"Location" "/next"} ""] [303 {"Location" "/next"} ""] [307 {"Location" "/next"} ""])
      ([201 {"Location" "/item/1"} nil] [201 {"Location" "/item/1"} "made"])
      ([404 {} "nf"] [400 {} "br"] [204 {} nil] [303 {"Location" "/p"} ""])
      201 "x" {"Content-Type" "text/html", "X-Count" "3"}
      [500 {} "b"]
      {:max-age 60, :value "abc"}
      {"session" {:value "abc"}}
      true false false
      308 ([200 {} "a"] [200 {} "b"])
  - name: ring-util-response-reads-headers-case-insensitively
    source: |
      (ns ring-hdr (:require [ring.util.response :as r]))
      (def page {:status 200 :headers {"content-type" "text/html; charset=ISO-8859-1"} :body ""})
      (prn (r/get-header page "Content-Type") (r/find-header page "CONTENT-TYPE") (r/get-header page "X-None"))
      (prn (r/get-charset page) (r/get-charset (r/content-type (r/response "") "text/plain")))
      (prn (:headers (r/charset page "UTF-8")))
      (prn (:headers (r/charset (r/response "") "UTF-8")))
      (prn (:headers (r/update-header page "Content-Type" str ";q=1")))
      (prn (r/get-charset {:headers {"Content-Type" "text/plain; Charset=\"utf-16\" ; x=y"}}))
    expected: |
      "text/html; charset=ISO-8859-1" ["content-type" "text/html; charset=ISO-8859-1"] nil
      "ISO-8859-1" nil
      {"content-type" "text/html; charset=UTF-8"}
      {"Content-Type" "text/plain; charset=UTF-8"}
      {"content-type" "text/html; charset=ISO-8859-1;q=1"}
      "utf-16"
  - name: ring-util-codec-percent-and-url-coding
    # A malformed UTF-8 escape run decodes as the JDK's new String replaces it (one
    # U+FFFD per ill-formed subpart, a truncated tail ending the run); oracle-identical.
    source: |
      (ns ring-codec (:require [ring.util.codec :as codec]))
      (prn (codec/url-encode "a b+c/é~日") (codec/url-decode "a%20b+c%2F%C3%A9%E6%97%A5"))
      (prn (codec/percent-encode "aé") (codec/percent-decode "%41%42c"))
      (prn (mapv int (codec/url-decode "%C0%80%ED%A0%80%E6%97%41%F0%9F%98")))
      (prn (codec/url-decode "%zz%4") (codec/url-encode "é" "ISO-8859-1") (codec/url-decode "%E9" "latin1"))
      (prn (codec/url-decode "%E9%41" "US-ASCII"))
      (prn (try (codec/url-decode "x" "EBCDIC-NOPE") (catch IllegalArgumentException e (ex-message e))))
    expected: |
      "a%20b+c%2F%C3%A9~%E6%97%A5" "a b+c/é日"
      "%61%C3%A9" "ABc"
      [65533 65533 65533 65533 65 65533]
      "%zz%4" "%E9" "é"
      "�A"
      "EBCDIC-NOPE"
  - name: ring-util-codec-form-coding
