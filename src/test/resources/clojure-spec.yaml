  - name: methods-answers-the-method-table-as-a-map
    # (methods mt) is a copy of the table: the nil row keyed by nil, the Object and the
    # default rows in it, a later defmethod or remove-method not reaching it. A host
    # class row is under the keyword class answers for the class (the oracle keys it by
    # the Class itself). Measured against clj 1.12.6, identical on what is printed here.
    source: |
      (defmulti mt-f class)
      (defmethod mt-f String [x] :s)
      (defmethod mt-f nil [x] :n)
      (defmethod mt-f Object [x] :o)
      (defmethod mt-f :default [x] :d)
      (defmethod mt-f clojure.lang.Keyword [x] :kw)
      (println (map? (methods mt-f)) (count (methods mt-f)) (contains? (methods mt-f) nil) (contains? (methods mt-f) :default))
      (println ((get (methods mt-f) nil) 1) ((get (methods mt-f) (class "x")) 1) (sort (map #(% 1) (vals (methods mt-f)))))
      (defmulti mt-g :t)
      (println (methods mt-g) (empty? (methods mt-g)) (count (methods mt-g)))
      (defmethod mt-g :a [x] 1)
      (defmethod mt-g [:v 1] [x] 3)
      (let [m (methods mt-g)]
        (defmethod mt-g :b [x] 2)
        (println (count m) (count (methods mt-g)))
        (remove-method mt-g :a)
        (println (count m) (count (methods mt-g)) (map str (sort-by str (keys (methods mt-g))))))
      (println (get (into {} (map (fn [[k v]] [k (v {})])) (methods mt-g)) :b))
      (println (= (methods mt-g) (methods mt-g)) ((get (methods mt-g) [:v 1]) {}) (count (assoc (methods mt-g) :z 1)) (count (methods mt-g)))
      (ns mt-ns)
      (defmulti mt-m :t)
      (defmethod mt-m :x [_] 1)
      (ns auto (:require [mt-ns :as mt]))
      (defmethod mt/mt-m :y [_] 2)
      (println (sort (keys (methods mt/mt-m))) (sort (keys (methods mt-ns/mt-m))) (count (methods mt-f)))
      (println (count (clojure.core/methods mt-g)))
      (println (let [methods (fn [x] [:mine x])] (methods 1)))
    expected: |
      true 5 true true
      :n :s (:d :kw :n :o :s)
      {} true 0
      2 3
      2 2 (:b [:v 1])
      2
      true 3 3 2
      (:x :y) (:x :y) 5
      2
      [:mine 1]
  - name: a-multimethod-dispatches-on-an-exception-class-by-inheritance
    # A throwable class as a dispatch value is the keyword class answers for it, and the
    # hierarchy follows the class chain like the oracle's isa? follows Java inheritance:
    # the most specific method wins, prefer-method breaks a tie, derive on a class reaches
    # its subclasses. isa? and derive read a class spelling as that keyword too, so a core
    # class matches its kind. .getClass of an exception answers what class answers (the
    # oracle answers the host class, which prints without the colon).
    source: |
      (defmulti xdh-handle class)
      (defmethod xdh-handle IllegalArgumentException [e] :iae)
      (defmethod xdh-handle Exception [e] :exception)
      (defmethod xdh-handle :default [e] :default)
      (println (xdh-handle (NumberFormatException. "x")) (xdh-handle (IllegalStateException. "x")) (xdh-handle (ex-info "m" {})) (xdh-handle 1))
      (println (xdh-handle (try (+ 1 "a") (catch Exception e e))) (xdh-handle (try (inc nil) (catch Exception e e))))
      (defmulti xdh-fails class)
      (defmethod xdh-fails RuntimeException [e] :runtime)
      (defmethod xdh-fails Throwable [e] :throwable)
      (println (xdh-fails (try (+ 1 nil) (catch Exception e e))) (xdh-fails (AssertionError. "x")))
      (prefer-method xdh-fails Throwable RuntimeException)
      (println (xdh-fails (ex-info "x" {})))
      (println (isa? (class (NumberFormatException. "x")) IllegalArgumentException) (isa? IllegalArgumentException (class (NumberFormatException. "x"))) (isa? NumberFormatException RuntimeException))
      (derive Exception ::xdh-failure)
      (println (isa? (class (ex-info "a" {})) ::xdh-failure) (isa? (class "a") String) (isa? (class [1]) String))
      (println (.getClass (Exception. "x")) (try (+ 1 "a") (catch Exception e (.getClass e))))
    expected: |
      :iae :exception :exception :default
      :exception :exception
      :runtime :throwable
      :throwable
      true false true
      true true false
      :java.lang.Exception :java.lang.ClassCastException
  - name: parents-and-ancestors-of-a-class-add-its-java-supers
    # Oracle-identical (clj 1.12.6) but for the colon a class keyword prints with (the
    # oracle prints a class object): parents of a class adds its bases, ancestors its
    # supers and their hierarchy ancestors, interfaces and Object included, and isa?
    # follows them; Object takes every class, an interface's supers stop short of it.
    # Empty answers are nil, and descendants of a class is the oracle's refusal. A core
    # kind or a record isa Object (its host classes' interfaces are not modeled). The
    # earlier case's (derive Exception ::xdh-failure) shows through Exception's subclasses.
    source: |
      (defn pa-names [s] (sort (map #(apply str (remove #{\:} (pr-str %))) s)))
      (println (parents NumberFormatException) (parents java.io.Closeable) (parents Object) (ancestors java.lang.AutoCloseable))
      (println (pa-names (ancestors IllegalArgumentException)))
      (derive Exception :pa/f)
      (println (pa-names (ancestors Exception)) (pa-names (parents Exception)) (descendants :pa/f))
      (println (pa-names (ancestors java.io.StringWriter)))
      (println (isa? NumberFormatException java.io.Serializable) (isa? (class (java.io.StringWriter.)) java.io.Closeable) (isa? (class "a") Object) (isa? java.io.Closeable Object) (isa? :pa/k Object) (isa? java.io.Closeable :pa/f) (isa? (class (ex-info "m" {})) clojure.lang.IExceptionInfo))
      (println (parents :pa/none) (ancestors :pa/none) (descendants :pa/none) (parents (make-hierarchy) Exception))
      (println (try (descendants Exception) (catch UnsupportedOperationException e (ex-message e))))
      (println (pa-names (ancestors (class (try (/ 1 0) (catch ArithmeticException e e))))))
      (derive Object :pa/o)
      (defrecord PaR [a])
      (println (isa? (class 1) :pa/o) (isa? java.io.Closeable :pa/o) (contains? (ancestors String) :pa/o) (contains? (ancestors (class "a")) :pa/o) (isa? (class (->PaR 1)) :pa/o) (isa? PaR Object))
    expected: |
      #{:java.lang.IllegalArgumentException} #{:java.lang.AutoCloseable} nil nil
      (auto/xdh-failure java.io.Serializable java.lang.Exception java.lang.Object java.lang.RuntimeException java.lang.Throwable)
      (auto/xdh-failure java.io.Serializable java.lang.Object java.lang.Throwable pa/f) (auto/xdh-failure java.lang.Throwable pa/f) #{:java.lang.Exception}
      (java.io.Closeable java.io.Flushable java.io.Writer java.lang.Appendable java.lang.AutoCloseable java.lang.Object)
      true true true true false false true
      nil nil nil #{:java.lang.Throwable}
      Can't get descendants of classes
      (auto/xdh-failure java.io.Serializable java.lang.Exception java.lang.Object java.lang.RuntimeException java.lang.Throwable pa/f)
      true false true true true true
  - name: memfn-calls-a-method-on-its-target
    # memfn is a function of a target and the named arguments calling the method
    # on it; string receivers take the mapped core operation, like any instance
    # call, so this case runs on all four backends.
    source: |
      (println ((memfn toUpperCase) "hi"))
      (println ((memfn substring s e) "hello" 1 2))
      (println (map (memfn length) ["a" "bb"]))
      (println (apply (memfn substring s e) "hello" [1 2]))
    expected: |
      HI
      e
      (1 2)
      e
  - name: string-replace-and-split-stay-literal
    # There is no regex runtime: split/replace match literal strings, so a
    # pattern that is special in regex syntax matches only itself. Regex
    # literals (#"...") stay refused at the reader.
    source: |
      (ns lit (:require [clojure.string :as s]))
      (println (s/replace "aaa" "." "b"))
      (println (s/split "aaa" "."))
      (println (s/replace-first "aaa" "a+" "b"))
      (println (.split "aaa" "."))
    expected: |
      aaa
      (aaa)
      aaa
      (aaa)
  - name: pr-and-pr-str-are-readable
    # pr/prn are the readable arms of print/println, pr-str of str: strings print
    # quoted, chars with their backslash, collections in Clojure notation.
    source: |
      (pr \a)
      (newline)
      (pr "x" [1 :a] {:b 2} #{3})
      (newline)
      (println (pr-str [1 :a] "x" \a))
      (println (pr-str))
      (println (pr-str nil))
      (println (map pr-str ["a" 1]))
    expected: |
      \a
      "x" [1 :a] {:b 2} #{3}
      [1 :a] "x" \a

      nil
      ("a" 1)
  - name: print-str-prn-str-and-println-str-answer-what-print-writes
    # The string arms of print/prn/println: parts joined by a space, nil spelled
    # nil, a collection printing its strings bare under print-str/println-str and
    # quoted under prn-str; prn-str and println-str end with a newline. The parts
    # evaluate first, so what one prints goes to the real output.
    source: |
      (println (pr-str (print-str 1 "a" ["a" \b nil])))
      (println (pr-str (prn-str 1 "a" ["a" \b nil] nil)))
      (println (pr-str (println-str 1 "a" ["a"] nil)))
      (println (pr-str (print-str)) (pr-str (prn-str)) (pr-str (println-str)))
      (println (pr-str (print-str nil) (print-str "x")))
      (println (pr-str (apply println-str [1 2]) (map prn-str ["a" 1])))
      (println (pr-str (println-str "a\nb")))
      (println (pr-str (with-out-str (prn (print-str (do (print "in") 1))))))
      (println (pr-str (str (println-str {:a "s"}))))
    expected: |
      "1 a [a b nil]"
      "1 \"a\" [\"a\" \\b nil] nil\n"
      "1 a [a] nil\n"
      "" "\n" "\n"
      "nil" "x"
      "1 2\n" ("\"a\"\n" "1\n")
      "a\nb\n"
      "in\"1\"\n"
      "{:a s}\n"
  - name: collections-nest-in-clojure-notation
    # Vectors, maps, sets and lists nest with their own brackets; nil stays nil
