    # cast to map entries, which a map, list, nil or string member is not. (A vector
    # member of a set stays accepted: an entry is a plain two-vector here.)
    source: |
      (defn conj-list-try [f] (try (pr-str (f)) (catch Exception e :refused)))
      (println (conj-list-try #(conj {} '(1 2))) (conj-list-try #(into {} ['(1 2)])) (conj-list-try #(merge {} '(1 2))) (conj-list-try #(conj {:a 1} (list :b 2))) (conj-list-try #(conj {} '(1))) (conj-list-try #(conj {} '())))
      (println (conj-list-try #(conj (sorted-map) '(1 2))) (conj-list-try #(into (sorted-map) ['(1 2)])) (conj-list-try #(merge (sorted-map :a 1) '(:b 2))))
      (println (conj-list-try #(conj {} #{{1 2}})) (conj-list-try #(conj {} #{nil})) (conj-list-try #(conj {} #{'(1 2)})) (conj-list-try #(conj (sorted-map) #{{1 2}})) (conj-list-try #(conj (sorted-map) (sorted-set '(1 2)))))
      (println (conj-list-try #(conj {} "ab")) (conj-list-try #(conj (sorted-map) "ab")) (conj-list-try #(into {} #{[1 2]})) (conj-list-try #(conj {} {1 2} [3 4])) (conj-list-try #(conj (sorted-map) {1 2})))
    expected: |
      :refused :refused :refused :refused :refused {}
      :refused :refused :refused
      :refused :refused :refused :refused :refused
      :refused :refused {1 2} {1 2, 3 4} {1 2}
  - name: conj-onto-a-map-takes-a-sorted-map-and-a-seq-of-entries
    # Oracle-identical (clj 1.12.6): a sorted map is a Map, and a seq (strict or lazy) of
    # real map entries is walked entry by entry. A seq of plain vectors is accepted here
    # (an entry is a plain two-vector) and refused by the oracle, so it is not pinned.
    source: |
      (defn conj-seq-try [f] (try (pr-str (f)) (catch Exception e :refused)))
      (println (conj-seq-try #(conj {} (sorted-map 1 2))) (conj-seq-try #(conj {:a 1} (sorted-map :b 2 :c 3))) (conj-seq-try #(conj {} (sorted-map))) (conj-seq-try #(conj (sorted-map) (sorted-map 1 2))))
      (println (conj-seq-try #(conj {} (seq {1 2}))) (conj-seq-try #(= {1 2, 3 4} (conj {} (map identity {1 2 3 4})))) (conj-seq-try #(conj {:a 1} (seq {:b 2}))) (conj-seq-try #(conj {} (seq {}))) (conj-seq-try #(conj {} (lazy-seq (seq {5 6})))))
      (println (conj-seq-try #(conj (sorted-map) (seq {1 2}))) (conj-seq-try #(conj (sorted-map) (map identity {1 2 3 4}))))
      (println (conj-seq-try #(conj {} (seq [1 2]))) (conj-seq-try #(conj {} (seq [(first {1 2}) 3]))) (conj-seq-try #(conj {} (seq ["ab"]))) (conj-seq-try #(conj {} :a)) (conj-seq-try #(conj {} (atom 1))))
    expected: |
      {1 2} {:a 1, :b 2, :c 3} {} {1 2}
      {1 2} true {:a 1, :b 2} {} {5 6}
      {1 2} {1 2, 3 4}
      :refused :refused :refused :refused :refused
  - name: merge-takes-an-entry-vector-and-a-seq-of-entries-after-the-first-map
    # Oracle-identical (clj 1.12.6): merge is conj folded over the maps, so a later item
    # is a map, a sorted map, a [k v] vector or a seq of entries, nil adding nothing; a
    # record keeps contributing its entries. A list of non-entries is refused.
    source: |
      (defrecord MRec [a])
      (defn merge-try [f] (try (pr-str (f)) (catch Exception e :refused)))
      (println (merge-try #(merge {} (seq {1 2}))) (merge-try #(merge {} [1 2])) (merge-try #(merge (sorted-map) (seq {1 2}))) (merge-try #(merge {} (sorted-map 1 2))))
      (println (merge-try #(merge {:a 1} [:b 2] (seq {:c 3}) nil {:d 4})) (merge-try #(merge (sorted-map :a 1) [:b 2])) (merge-try #(merge nil [1 2])) (merge-try #(merge {} (map identity {5 6}))))
      (println (merge-try #((fn [f] (f {} [1 2] (seq {3 4}))) merge)) (merge-try #((fn [f] (f (sorted-map :a 1) (seq {:b 2}) [:c 3])) merge)) (merge-try #((fn [f] (f {} (->MRec 1))) merge)) (merge-try #(:a (merge {} (->MRec 1)))))
      (println (merge-try #(merge {} [1])) (merge-try #(merge {} [1 2 3])) (merge-try #(merge {} (seq [1 2]))) (merge-try #(merge {} "ab")) (merge-try #((fn [f] (f {} [1])) merge)))
    expected: |
      {1 2} {1 2} {1 2} {1 2}
      {:a 1, :b 2, :c 3, :d 4} {:a 1, :b 2} {1 2} {5 6}
      {1 2, 3 4} {:a 1, :b 2, :c 3} {:a 1} 1
      :refused :refused :refused :refused :refused
