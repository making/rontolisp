    source: |
      (println (nil? *in*))
    expected: |
      false
  - name: records-are-maps-with-a-type-tag
    # b13: a record is a (:C%RECORD tag fields table class) wrapper over the same
    # equal table every map uses, so the map verbs read through it on all four
    # backends; it prints as its literal, #ns.R{...}, like the oracle (b58) --
    # here #b15_str.B13Rock, the namespace an earlier case switched to.
    # (assoc b13-r :hard true) keeps the type; (dissoc r :hard) of the extension
    # key keeps it while (dissoc r :mass) of the base field drops to a plain map.
    source: |
      (defrecord B13Rock [mass])
      (def b13-r (->B13Rock 7))
      (println (= b13-r (->B13Rock 7)))
      (println (= b13-r {:mass 7}))
      (println (get b13-r :mass))
