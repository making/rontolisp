  - name: vec-of-a-non-collection-refuses-with-the-runtime-exception-the-oracle-throws
    # Oracle-identical (clj 1.12.6, 2026-10-05): vec casts a non-collection to an
    # array before it seqs, so a number, keyword, symbol, boolean, character,
    # function, atom, var, reduced value or matcher is the oracle's RuntimeException
    # ("Unable to convert: class ... to Object[]"), which an IllegalArgumentException
    # catch does not take (each probe catches that class first). A lazy seq whose
    # thunk answers a non-collection stays seq's IllegalArgumentException. The last
    # line is what vec still answers.
    source: |
      (defmacro vnc [form] `(try (try ~form :none (catch InterruptedException e# :decoy) (catch IllegalArgumentException e# :iae) (catch RuntimeException e# :ok)) (catch Throwable e# (class e#))))
      (def vnc-a (atom 1))
      (println [(vnc (vec 5)) (vnc (vec 1.5)) (vnc (vec :a)) (vnc (vec 'a)) (vnc (vec false)) (vnc (vec true)) (vnc (vec \a)) (vnc (vec inc)) (vnc (vec vnc-a)) (vnc (vec #'vnc-a)) (vnc (vec (reduced 1))) (vnc (vec (re-matcher #"a" "a")))])
      (println [(vnc (apply vec [5])) (vnc (mapv vec [5])) (vnc (vec (lazy-seq 5))) (vnc (vec (cons 1 (lazy-seq 5)))) (vnc (into [] 5))])
      (println [(vec nil) (vec "ab") (vec {:a 1}) (vec #{1}) (vec '(1 2)) (vec [1 2]) (vec (map inc [1 2])) (vec (range 3)) (vec (sorted-map 1 2)) (vec (lazy-seq nil))])
    expected: |
      [:ok :ok :ok :ok :ok :ok :ok :ok :ok :ok :ok :ok]
      [:ok :ok :iae :iae :iae]
      [[] [a b] [[:a 1]] [1] [1 2] [1 2] [2 3] [0 1 2] [[1 2]] []]
  - name: nth-of-a-matcher-reads-its-group
    # Oracle-identical (clj 1.12.6, 2026-10-05): nth of a matcher reads
    # Matcher.group(n): an IllegalStateException before a match and after a failed
    # find (even with a default, for an index the pattern has), an unmatched group
    # nil, an index past the pattern's groups or below zero the default. Deviations:
    # past the groups without a default the answer is nil, where the oracle throws
    # IndexOutOfBoundsException (nth past the end answers nil, "Deviations"); and a
    # pattern without groups reads group 0 whatever the call, where the oracle's
    # three-argument nth answers the default (its rule is groupCount > 0 && n <=
    # groupCount; a non-nil default is the one call shape that tells them apart here).
    # second, first and count of a matcher are the seq verbs' and count's refusals.
    source: |
      (defmacro nmc [form] `(try ~form (catch InterruptedException e# :decoy) (catch IllegalStateException e# :ise) (catch IllegalArgumentException e# :iae) (catch UnsupportedOperationException e# :uoe) (catch Throwable e# (class e#))))
      (def nmc-m (re-matcher #"(a)(b)?" "ac"))
      (println [(nmc (nth nmc-m 0)) (nmc (nth nmc-m 1 :d)) (nmc (nth nmc-m 4 :d)) (nmc (nth nmc-m -1 :d))])
      (re-find nmc-m)
      (println [(nth nmc-m 0) (nth nmc-m 1) (nth nmc-m 2) (nth nmc-m 1 :d) (nth nmc-m 2 :d) (nth nmc-m 3 :d) (nth nmc-m 5 :d) (nth nmc-m -1 :d)])
      (println (let [[w g1 g2 g3] nmc-m] [w g1 g2 g3]) (map #(nth nmc-m %) [0 1 2]) ((fn [c] (nth c 1)) nmc-m))
      (println [(nmc (second nmc-m)) (nmc (first nmc-m)) (nmc (count nmc-m))])
      (re-find nmc-m)
      (println [(nmc (nth nmc-m 0)) (nmc (nth nmc-m 1 :d)) (nmc (nth nmc-m 3 :d)) (nmc (nth nmc-m -1 :d))])
      (def nmc-w (re-matcher #"ab" "xab"))
      (re-find nmc-w)
      (println (nth nmc-w 0))
    expected: |
      [:ise :ise :d :d]
      [a a nil a nil :d :d :d]
      [a a nil nil] (a a nil) a
      [:iae :iae :uoe]
      [:ise :ise :d :d]
      ab
  - name: a-string-substring-and-charat-refuse-with-the-oracles-class
    # Oracle-identical (clj 1.12.6): .substring and .charAt of a
    # string past its bounds (a literal, a built string and an empty one) throw
    # StringIndexOutOfBoundsException (every probe answers :ok there, a class
    # that is none printing itself), which an IndexOutOfBoundsException catch
    # takes too; an in-range call answers. The message is the runtime's own, and
    # class answers a keyword (the oracle prints the host class without the colon).
    source: |
      (defmacro sbc [form] `(try (try ~form :none (catch InterruptedException e# :decoy) (catch StringIndexOutOfBoundsException e# :ok)) (catch Throwable e# (class e#))))
      (def sbc-built (apply str ["ab" "c"]))
      (def sbc-empty (apply str []))
      (println [(sbc (.substring "abc" 5)) (sbc (.substring sbc-built 5)) (sbc (.substring sbc-built -1)) (sbc (.substring sbc-built 1 5)) (sbc (.substring sbc-built 2 1)) (sbc (.substring sbc-empty 1))])
      (println [(sbc (.charAt "abc" 5)) (sbc (.charAt sbc-built 3)) (sbc (.charAt sbc-built -1)) (sbc (.charAt sbc-empty 0))])
      (println (try (.charAt sbc-built 9) (catch Exception e (class e))) (try (.substring sbc-built 9) (catch Exception e (class e))))
      (println [(try (.charAt sbc-built 9) (catch IndexOutOfBoundsException e :ioobe)) (try (.substring sbc-built 9) (catch IndexOutOfBoundsException e :ioobe))])
      (println [(.substring sbc-built 1) (.substring sbc-built 0 3) (.substring sbc-built 3) (.charAt sbc-built 0) (.charAt sbc-built 2) (.substring sbc-empty 0)])
    expected: |
      [:ok :ok :ok :ok :ok :ok]
      [:ok :ok :ok :ok]
      :java.lang.StringIndexOutOfBoundsException :java.lang.StringIndexOutOfBoundsException
      [:ioobe :ioobe]
      [bc abc  a c ]
  - name: subs-and-substring-truncate-a-double-or-ratio-bound
    # Oracle-identical (clj 1.12.6): subs, .substring and .charAt take a double
    # or ratio bound as its truncation toward zero (a literal or a computed one, a
    # built string or a literal one, a bound a lambda or apply hands over). No
    # try, so the program reads no condition's class.
    source: |
      (def sb-built (apply str ["ab" "c"]))
      (def sb-i 1.0)
      (def sb-j 2.9)
      (def sb-r 1/2)
      (println [(subs "abc" 1.0) (.substring "abc" 1.0) (.substring "abc" 1 2.9) (subs sb-built 1.5) (subs sb-built 0 2.5)])
      (println [(subs "abc" sb-i) (subs sb-built sb-i sb-j) (.substring sb-built sb-i) (.substring sb-built sb-i sb-j) (subs sb-built sb-r) (subs sb-built 0 (+ sb-r sb-r))])
      (println [(subs "abc" -0.5) (subs "abc" 0 3.5) (subs "abc" 1.0 2.0) (subs "abc" 0 2N) (subs "abc" 1.5M) (subs "abc" (float 1.5)) (subs "abc" (/ 3 2))])
      (println [(.charAt "abc" 1.5) (.charAt sb-built sb-i) (.charAt sb-built sb-j) (.charAt "abc" 1/2) (.charAt sb-built sb-r)])
      (println (map #(subs sb-built %) [0.0 1.5 2.9 3.0]))
      (println (map #(subs sb-built 1 %) [1.0 2.5 3.0]))
      (println (apply subs sb-built [1.5 2.5]))
    expected: |
      [bc bc b bc ab]
      [bc b bc b abc a]
      [abc abc b ab bc bc bc]
      [b b c a a]
      (abc bc c )
      ( b bc)
      b
  - name: subs-and-substring-refuse-a-truncated-bound-outside-the-string
    # Oracle-identical (clj 1.12.6): a truncated bound outside the string is
    # StringIndexOutOfBoundsException; NaN truncates to 0. (A double past the int
    # range is that class here; the oracle's subs makes it an ArithmeticException
    # or an IllegalArgumentException: not pinned.)
    source: |
      (defmacro sbd [form] `(try (try ~form (catch InterruptedException e# :decoy) (catch StringIndexOutOfBoundsException e# :sioobe) (catch ArithmeticException e# :arith) (catch IllegalArgumentException e# :iae)) (catch Throwable e# (class e#))))
      (def sbd-built (apply str ["ab" "c"]))
      (def sbd-nan (/ 0.0 0))
      (println [(sbd (subs sbd-built 4.5)) (sbd (subs sbd-built 1 0.5)) (sbd (subs sbd-built 2 1.9)) (sbd (subs sbd-built -1.5)) (sbd (subs sbd-built 0 3.5)) (sbd (.charAt sbd-built 9.5)) (sbd (.charAt sbd-built -1.5))])
      (println [(sbd (subs sbd-built 2147483647.5)) (sbd (subs sbd-built 0 2147483647.5)) (sbd (.charAt sbd-built 2147483647.5)) (sbd (.substring sbd-built -2147483648.5))])
      (println [(subs sbd-built sbd-nan) (.charAt sbd-built sbd-nan) (.substring sbd-built 0 sbd-nan)])
    expected: |
      [:sioobe :sioobe :sioobe :sioobe abc :sioobe :sioobe]
      [:sioobe :sioobe :sioobe :sioobe]
      [abc a ]
  - name: subs-and-substring-refuse-a-non-number-bound-with-the-oracles-class
    # Oracle-identical (clj 1.12.6): nil is a NullPointerException; any other
    # non-number is a ClassCastException from subs, and from .substring / .charAt
    # of a receiver the compiler types (a literal), but an
    # IllegalArgumentException (no matching method) of one it does not. An end
    # of nil is refused too. (A hinted receiver is typed in the oracle only: a
    # ClassCastException there; and a double past the int range is
    # StringIndexOutOfBoundsException here, not the oracle's ArithmeticException:
    # neither is pinned.)
    source: |
      (defmacro nbd [form] `(try (try ~form (catch InterruptedException e# :decoy) (catch NullPointerException e# :npe) (catch ClassCastException e# :cce) (catch IllegalArgumentException e# :iae)) (catch Throwable e# (class e#))))
      (def nbd-built (apply str ["ab" "c"]))
      (println [(nbd (subs nbd-built nil)) (nbd (subs nbd-built "a")) (nbd (subs nbd-built \a)) (nbd (subs nbd-built :a)) (nbd (subs nbd-built 1 nil)) (nbd (subs nbd-built 1 "a"))])
      (println [(nbd (.substring nbd-built nil)) (nbd (.substring nbd-built "a")) (nbd (.substring nbd-built \a)) (nbd (.substring nbd-built 1 nil)) (nbd (.substring nbd-built 1 "a"))])
      (println [(nbd (.charAt nbd-built nil)) (nbd (.charAt nbd-built "a")) (nbd (.charAt nbd-built :a))])
      (println [(nbd (subs "abc" nil)) (nbd (.substring "abc" "a")) (nbd (.substring "abc" 1 nil)) (nbd (.charAt "abc" nil)) (nbd (.charAt "abc" :a))])
      (println [(nbd (apply subs nbd-built [nil])) (nbd (apply subs nbd-built [1 :a])) (nbd (doall (map #(subs nbd-built %) [nil])))])
      (println [(subs nbd-built 1) (subs nbd-built 1 2) (.substring nbd-built 1 2) (.charAt nbd-built 1)])
    expected: |
      [:npe :cce :cce :cce :npe :cce]
      [:npe :iae :iae :npe :iae]
      [:npe :iae :iae]
      [:npe :cce :npe :npe :cce]
      [:npe :cce :npe]
      [bc b b b]
  - name: class-instance-and-stack-traces-of-an-exception
    # class of an exception, a runtime error or a refusal answers its class as a
    # keyword, the shape class answers for every kind (the oracle answers the host
    # class, which prints without the colon). instance? of a throwable class is
    # the oracle's.
    # .printStackTrace writes the toString line to *err* (the oracle writes it
    # and a line per frame to the process's stderr, whatever *err* is bound to)
    # and .getStackTrace answers no frames (the oracle's thirteen here).
    source: |
      (println (class (ex-info "m" {})) (class (IllegalArgumentException. "x")))
      (println (try (+ 1 "a") (catch Exception e (class e))) (try (inc nil) (catch Throwable e (class e))))
      (println (try (first 5) (catch Exception e (class e))))
      (println (= (class (Exception. "a")) (class (Exception. "b"))) (= (class (Exception. "a")) (class (RuntimeException. "b"))))
      (println (instance? Exception (IllegalArgumentException. "x")) (instance? RuntimeException (Exception. "x")) (instance? clojure.lang.ExceptionInfo (ex-info "m" {})))
      (println (try (+ 1 "a") (catch Exception e [(instance? ClassCastException e) (instance? RuntimeException e) (instance? IllegalArgumentException e)])))
      (println (instance? Exception 5) (instance? Exception nil))
      (println (try (throw (Exception. "boom")) (catch Exception e (binding [*err* *out*] (.printStackTrace e)) :printed)))
      (println (count (.getStackTrace (Exception. "x"))) (seq (.getStackTrace (Exception. "x"))))
    expected: |
      :clojure.lang.ExceptionInfo :java.lang.IllegalArgumentException
      :java.lang.ClassCastException :java.lang.NullPointerException
      :java.lang.IllegalArgumentException
      true false
      true false true
      [true true false]
      false false
      java.lang.Exception: boom
      :printed
      0 nil
