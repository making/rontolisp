    expected: |
      -1 1 0 -2 1 -2 -1 1 -2 -2
      -1 -1 1 0 -1 -1 1 0 0 0
      (-1 1) (1 2 3) (3 2 1) (3 2 1) 1
  - name: sort-reads-a-comparator-answering-a-number
    # Oracle-identical (clj 1.12.6): a comparator answering a number orders by its
    # integer part's sign (it was read by truthiness, so every number meant less).
    source: |
      (prn (sort (fn [a b] (- a b)) [3 1 2 5 4]) (sort-by - (fn [a b] (- a b)) [3 1 2]) (sort > [3 1 2]) (sort (fn [a b] (* 0.5 (- a b))) [2 1]) (sort-by count compare ["ccc" "a" "bb"]))
    expected: |
      (1 2 3 4 5) (3 2 1) (3 2 1) (2 1) ("a" "bb" "ccc")
  - name: sort-without-a-comparator-orders-by-compare
    # Oracle-identical (clj 1.12.6): the default order is compare's, so nil, booleans,
    # symbols and vectors sort too; kinds with no common order refuse (the message
    # differs: the oracle names a Java cast).
    source: |
      (prn (sort [[1 2] [0 1]]) (sort [:b nil :a]) (sort [true false]) (sort ['b 'a]))
      (prn (sort [3 1.5 2 1/2]) (sort ["b" "a" "ab"]) (sort [\b \a]) (sort [:b/a :a :b]) (sort ['b/a 'a 'b]))
      (prn (sort [[1 2 3] [9] [1 3] [1 2]]) (sort-by first [[2 :a] [1 :b]]) (sort-by :k [{:k nil} {:k 2} {:k 1}]) (sort-by identity [nil nil 1]))
      (prn (sort [1]) (apply sort [[2 1]]) (map sort [[2 1] [:b :a]]))
