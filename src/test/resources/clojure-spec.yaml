# The corpus of the EXPERIMENTAL Clojure front end (ClojureSpecE2eTest): one case per
# row of the lowering table in .kb/clojure-frontend.md and per builtin group of the
# subset. Cases run IN ORDER, concatenated into one .clj program per backend (shared
# global state), and the output is sliced back per case -- the ci-spec.yaml idea.
# Every case must print the same text on the interpreter, the JVM, wasm and the
# component. Divergences from real Clojure are the documented deviations in
# .kb/clojure-frontend.md, not failures: what is pinned here is that every backend
# agrees. Where the oracle (Clojure CLI 1.12) answers differently, a comment says so.
cases:
  - name: identifiers-keep-their-case-and-mangle-behind-the-prefix
    source: |
      (def cid-Foo 1)
      (def cid-foo 2)
      (def cid-FOO 3)
      (println cid-Foo cid-foo cid-FOO)
    expected: |
      1 2 3
  - name: a-definition-may-use-a-name-defined-below-it
    source: |
      (defn fwd-a [] (fwd-b))
      (defn fwd-b [] 42)
      (println (fwd-a))
    expected: |
      42
  - name: defn-with-docstring-and-variadic-rest
    source: |
      (defn vrest "a docstring" [x & xs] xs)
      (println (vrest 1 2 3))
    expected: |
      (2 3)
  - name: fn-and-anon-fn-are-lambdas
    source: |
      (println ((fn [a b] (+ (* a 10) b)) 4 2))
      (println (map #(* % %) '(1 2 3)))
      (println (#(+ %1 %2) 10 20))
      (println ((fn [x & xs] xs) 1 2 3))
    expected: |
      42
      (1 4 9)
      30
      (2 3)
  - name: let-is-sequential
    source: |
      (println (let [x 1 y x] y))
      (let [lx 10 ly (+ lx 5)]
        (println lx ly))
    expected: |
      1
      10 15
  - name: loop-recur-is-a-self-call
    source: |
      (defn fib10 [n]
        (loop [a 0 b 1 i 0]
          (if (= i n) a (recur b (+ a b) (inc i)))))
      (println (fib10 10))
      (println (loop [i 0] (if (= i 3) i (recur (inc i)))))
    expected: |
      55
      3
  - name: if-when-cond-do-and-or
    # Clojure rejects the odd trailing arm (cond requires an even number of forms);
    # here it is the default, per .kb/clojure-frontend.md.
    source: |
      (println (cond (= 1 2) :one (= 1 1) :two :else :other))
      (println (cond (= 1 2) :one :fallback))
      (println (list (and 1 2 3) (or nil nil 3) (not nil) (not 1)))
      (println (do 1 2 3))
      (println (when true 1 2))
    expected: |
      :two
      :fallback
      (3 3 true false)
      3
      2
  - name: arithmetic-and-comparison
    source: |
      (println (list (+ 1 2 3) (- 10 4) (* 2 3 4) (/ 7 2)))
      (println (list (max 3 9 4) (min 3 9 4) (rem 7 2) (mod -7 2) (quot 7 2) (quot -7 2) (abs -5) (expt 2 10)))
      (println (list (inc 5) (dec 5)))
      (println (list (= 1 1) (= 1 2) (not= 1 2) (< 1 2) (> 2 1) (<= 2 2) (>= 3 4)))
    expected: |
      (6 6 24 7/2)
      (9 3 1 1 3 -3 5 1024)
      (6 4)
      (true false true true true true false)
  - name: seq-ops-run-over-lists
    source: |
      (println (map #(* % %) '(1 2 3)))
      (println (filter odd? '(1 2 3 4)))
      (println (reduce + 0 '(1 2 3)))
      (println (reduce + '(1 2 3)))
      (println (apply max '(3 9 4)))
      (println (concat '(1 2) '(3 4)))
      (println (list (first '(1 2)) (rest '(1 2 3)) (nth '(10 20 30) 1) (count '(1 2 3)) (cons 0 '(1 2)) (reverse '(1 2 3))))
    expected: |
      (1 4 9)
      (1 3)
      6
      6
      9
      (1 2 3 4)
      (1 (2 3) 20 3 (0 1 2) (3 2 1))
  - name: seqs-run-over-vectors
    # Vectors (and every other collection) seq like the oracle; an empty result is
    # nil, where the oracle prints ().
    source: |
      (println (first [1 2]))
      (println (rest [1 2 3]))
      (println (next [1 2 3]))
      (println (cons 0 [1 2]))
      (println (concat '(1 2) [3 4]))
      (println (concat))
      (println (map #(inc %) [1 2 3]))
      (println (filter odd? [1 2 3 4]))
      (println (reduce + 0 [1 2 3]))
      (println (reduce + [1 2 3]))
      (println (apply max [3 9 4]))
      (println (list (nth [10 20 30] 1) (nth [10 20] 5 :nf) (count [1 2 3])))
    expected: |
      1
      (2 3)
      (2 3)
      (0 1 2)
      (1 2 3 4)
      nil
      (2 3 4)
      (1 3)
      6
      6
      9
      (20 :nf 3)
  - name: seq-and-next
    # seq coerces any collection to a strict list; a map entry is a two-vector, a
    # string seqs to chars, and the table walk order is unspecified
    # (so map/set seqs are only counted here).
    source: |
      (println (seq '(1 2)))
      (println (seq [1 2]))
      (println (seq nil))
      (println (seq []))
      (println (next '(1 2 3)))
      (println (next [1]))
      (println (rest []))
      (println (count (seq {:a 1 :b 2})))
      (println (first {:a 1}))
      (println (count (seq #{1 2})))
      (println (count (seq "ab")))
      (println (first "ab"))
      (println (rest "ab"))
    expected: |
      (1 2)
      (1 2)
      nil
      nil
      (2 3)
      nil
      nil
      2
      [:a 1]
      2
      2
      a
      (b)
  - name: finite-range-take-and-drop
    # range with an end builds the strict list; an over-long take/drop answers the
    # whole/empty seq as nil, where the oracle prints (). An end-less (range) and
    # lazy-seq are refused by name (ClojureLoweringTest).
    source: |
      (println (range 5))
      (println (range 2 8))
      (println (range 0 10 3))
      (println (range 5 0 -2))
      (println (take 3 (range 10)))
      (println (drop 8 (range 10)))
      (println (take 2 [1 2 3 4]))
      (println (drop 2 [1 2 3 4]))
      (println (take 10 [1 2]))
      (println (drop 10 [1 2]))
    expected: |
      (0 1 2 3 4)
      (2 3 4 5 6 7)
      (0 3 6 9)
      (5 3 1)
      (0 1 2)
      (8 9)
      (1 2)
      (3 4)
      (1 2)
      nil
  - name: nth-and-quot-as-values
    # nth/quot as values are lambdas with the Clojure argument order (a bare #'NTH
    # would take the index first).
    source: |
      (println (apply quot [7 2]))
      (println (apply nth [[10 20] 1]))
      (def b03-qv quot)
      (println (apply b03-qv [7 2]))
      (println (map (fn [v] (nth v 0)) [[1 2] [3 4]]))
    expected: |
      3
      20
      3
      (1 3)
  - name: builtins-in-value-position
    # inc/dec/str and the seq verbs name function values, so map/filter take them
    # bare; apply spreads leading arguments over the seq-coerced last one, like the
    # oracle; =/not= compare chains of neighbours.
    source: |
      (println (map inc '(1 2)))
      (println (map inc [1 2 3]))
      (println (map str [1 :a false]))
      (println (filter first [[1] [] [2 3]]))
      (println (apply + 1 2 [3 4]))
      (println (apply concat [[1 2] [3]]))
      (println (list (= 1 1 1) (= 1 1 2) (not= 1 2 1)))
    expected: |
      (2 3)
      (2 3 4)
      (1 :a false)
      ([1] [2 3])
      10
      (1 2 3)
      (true false true)
  - name: predicates
    source: |
      (println (list (even? 4) (odd? 3) (zero? 0) (pos? 5) (neg? -2) (vector? [1]) (vector? '(1)) (empty? '()) (empty? '(1)) (nil? nil) (some? 0)))
    expected: |
      (true true true true true true false true false true true)
  - name: vectors-print-in-clojure-notation
    # A vector prints in brackets, a nested keyword with its colon, a nested
    # string bare; true/false/nil nest as themselves.
    source: |
      (println [1 :a "s"])
      (println (count [10 20 30]))
      (println (vector 1 2))
      (println (list (vector? [1]) (vector? '(1))))
      (println [true false nil])
      (println [])
    expected: |
      [1 :a s]
      3
      [1 2]
      (true false)
      [true false nil]
      []
  - name: quote-mangles-symbols-and-re-emits-vectors
    source: |
      (println 'qi-a)
      (println '(1 2 qi-b))
      (println '[1 :a])
    expected: |
      qi-a
      (1 2 qi-b)
      [1 :a]
  - name: keywords-are-case-sensitive-and-print-with-colon
    # Clojure prints :a :A distinctly and (= :a :A) is false; a keyword in call
    # position is the map lookup, per .kb/clojure-frontend.md.
    source: |
      (println :a)
      (println :A)
      (println (= :a :a))
      (println (= :a :A))
      (println (str :a))
      (println (:a {:a 1}))
      (println (:b {:a 1}))
      (println (:b {:a 1} 9))
      (println (str :a/b))
      (println (:a/b {:a/b 1}))
      (println (= :a/b :a/b))
      (println (= :a "a"))
      (println (map :a (list {:a 1} {:a 2})))
      (println (map :a [{:a 1} {:a 2}]))
      (println (:a #{:a}))
    expected: |
      :a
      :A
      true
      false
      :a
      1
      nil
      9
      :a/b
      1
      true
      false
      (1 2)
      (1 2)
      :a
  - name: false-is-distinct-from-nil
    # Clojure prints true/false/nil, (= false nil) is false and (nil? false) is
    # false; false is a distinct object from nil here too.
    source: |
      (println true)
      (println false)
      (println nil)
      (println (= false nil))
      (println (= false false))
      (println (nil? false))
      (println (nil? nil))
      (println (false? false))
      (println (false? nil))
      (println (true? true))
      (println (true? 1))
      (println (boolean? false))
      (println (boolean? nil))
      (println (boolean? 0))
      (println (str nil))
      (println (str false))
      (println (str true))
      (println (str "a" nil false true))
      (println (if false 1 2))
      (println (if nil 1 2))
      (println (and false 1))
      (println (or nil false))
      (println (not false))
      (println (not nil))
    expected: |
      true
      false
      nil
      false
      true
      false
      true
      true
      false
      true
      false
      true
      false
      false

      false
      true
      afalsetrue
      2
      2
      false
      false
      true
      true
  - name: str-print-println-and-newline
    # println/print/pr/prn separate their parts with spaces, like the oracle; str
    # concatenates with no separator; pr/prn convert readably, so strings print
    # quoted. (println (str nil)) prints the empty string and a newline.
    source: |
      (println (str))
      (println (str "a" 1))
      (println (str "x=" 42))
      (println (str nil))
      (print "a" "b")
      (newline)
      (println "x" "y")
      (pr "a" 1 :k)
      (newline)
      (prn "x" "y")
      (prn [1 2])
      (prn nil true false)
    expected: |

      a1
      x=42

      a b
      x y
      "a" 1 :k
      "x" "y"
      [1 2]
      nil true false
  - name: numbers
    # 1M is an exact ratio (1), not a double: decimal arithmetic stays exact and
    # prints as the ratio. The oracle prints 1M and 2N with their suffixes.
    source: |
      (println (list 42 -17 1/2 1.5 1e3))
      (println (list 1M 2N))
    expected: |
      (42 -17 1/2 1.5 1000.0)
      (1 2)
  - name: reader-comments-commas-discard-and-string-escapes
    source: |
      ;; a comment line
      (println 1) ; a trailing comment
      (println [1, 2, 3])
      (println #_skip-me 42)
      (println "a\nb")
    expected: |
      1
      [1 2 3]
      42
      a
      b
  - name: ns-defines-nothing
    source: |
      (ns corpus-ns)
      (println "after-ns")
    expected: |
      after-ns
  - name: def-without-a-value-is-nil-and-defn-is-called-directly
    source: |
      (def dv-no-val)
      (println dv-no-val)
      (defn dv-twice [x] (* 2 x))
      (println (dv-twice 21))
    expected: |
      nil
      42
  - name: higher-order-compose-over-map-filter-reduce
    source: |
      (defn comp-sq [coll]
        (reduce + 0 (map #(* % %) (filter odd? coll))))
      (println (comp-sq '(1 2 3 4 5 6 7)))
    expected: |
      84
  - name: head-position-calls-reach-the-value-cell
    # A head-position call to a VARIABLE-kind name (a defn parameter, a let
    # binding, a def'd variable) is a funcall of the value cell, while a defn
    # name stays a direct call.
    source: |
      (defn hoc-call-it [f x] (f x))
      (println (hoc-call-it inc 41))
      (println (let [lf inc] (lf 41)))
      (def hoc-to-up (memfn toUpperCase))
      (println (hoc-to-up "hey"))
      (println (get (ex-data ((fn [mk] (mk "v" {:code 7})) ex-info)) :code))
    expected: |
      42
      42
      HEY
      7
  - name: recursion-fact
    source: |
      (defn fact-r [n]
        (if (< n 2) 1 (* n (fact-r (- n 1)))))
      (println (fact-r 10))
    expected: |
      3628800
  - name: map-literals-print-in-clojure-notation
    # A map prints in braces with ", " between entries (the walk order stays
    # unspecified, like keys/vals, so only single-entry maps print here).
    source: |
      (println {:a 1})
      (println {})
      (println {:a {:b [1 2]}})
    expected: |
      {:a 1}
      {}
      {:a {:b [1 2]}}
  - name: set-literals-print-in-clojure-notation
    # A set prints in #{} with spaces between members (the walk order stays
    # unspecified, so only single-member sets print here).
    source: |
      (println (count #{1 2}))
      (println (contains? #{1 2} 2))
      (println #{1})
      (println #{})
    expected: |
      2
      true
      #{1}
      #{}
  - name: assoc-builds-a-fresh-map
    source: |
      (def mm-base {:a 1})
      (println (get (assoc mm-base :b 2) :b))
      (println (get mm-base :b))
      (println (get (assoc mm-base :a 9 :c 3) :c))
      (println (get (assoc nil :a 1) :a))
      (println (get {:a false} :a :d))
      (println (contains? {:a false} :a))
    expected: |
      2
      nil
      3
      1
      false
      true
  - name: dissoc-removes-keys
    source: |
      (println (get (dissoc {:a 1 :b 2} :a) :a))
      (println (count (dissoc {:a 1 :b 2} :a :b)))
      (println (dissoc nil :a))
      (println (get (dissoc {:a 1} :zz) :a))
    expected: |
      nil
      0
      nil
      1
  - name: get-with-and-without-a-default
    source: |
      (println (get {:a 1} :a))
      (println (get {:a 1} :b))
      (println (get {:a 1} :b :dflt))
      (println (get {:a false} :b))
      (println (get [10 20 30] 1))
      (println (get [10 20 30] 5 :d))
      (println (get "abc" 1))
      (println (get '(1 2) 0 :d))
      (println (get nil :a :d))
      (println (get #{1 2} 2))
      (println (get #{1 2} 9 :d))
    expected: |
      1
      nil
      :dflt
      nil
      20
      :d
      b
      :d
      :d
      2
      :d
  - name: contains-checks-maps-sets-and-indexes
    source: |
      (println (list (contains? {:a 1} :a) (contains? {:a 1} :b) (contains? nil :a)))
      (println (list (contains? #{1 2} 2) (contains? #{1 2} 9)))
      (println (list (contains? [:a :b] 1) (contains? [:a :b] 5) (contains? "abc" 0)))
      (println (contains? #{false} false))
    expected: |
      (true false false)
      (true false)
      (true false true)
      true
  - name: keys-and-vals
    source: |
      (println (keys {:a 1}))
      (println (vals {:a 1}))
      (println (keys nil))
      (println (count (keys {:a 1 :b 2})))
      (println (count (vals {:a 1 :b 2})))
    expected: |
      (:a)
      (1)
      nil
      2
      2
  - name: merge-combines-maps
    source: |
      (println (count (merge {:a 1} {:b 2})))
      (println (get (merge {:a 1} {:a 2 :b 3}) :a))
      (println (merge))
      (println (get (merge nil {:a 1}) :a))
      (println (get (merge {:a 1}) :a))
    expected: |
      2
      2
      nil
      1
      1
  - name: conj-adds-to-every-collection
    source: |
      (println (conj [1 2] 3))
      (println (conj '(1 2) 3))
      (println (conj nil 1))
      (println (get (conj {:a 1} [:b 2]) :b))
      (println (get (conj {:a 1} {:b 2} [:c 3]) :c))
      (println (count (conj #{1 2} 3)))
      (println (contains? (conj #{1} 2) 2))
      (println (contains? (conj #{1} false) false))
    expected: |
      [1 2 3]
      (3 1 2)
      (1)
      2
      3
      3
      true
      true
  - name: disj-removes-set-members
    source: |
      (println (count (disj #{1 2 3} 2)))
      (println (contains? (disj #{1 2 3} 2) 2))
      (println (count (disj #{1 2} 9)))
      (println (disj nil 1))
    expected: |
      2
      false
      2
      nil
  - name: set-hash-map-and-array-map-construct
    source: |
      (println (count (set [1 2 2 3])))
      (println (contains? (set [1 2 2 3]) 2))
      (println (count (set nil)))
      (println (get (hash-map :a 1 :b 2) :b))
      (println (count (array-map)))
      (println (count (hash-map)))
    expected: |
      3
      true
      0
      2
      0
      0
  - name: count-and-empty-reach-maps-and-sets
    source: |
      (println (count {:a 1 :b 2}))
      (println (count #{1 2 3}))
      (println (count {}))
      (println (count #{}))
      (println (count false))
      (println (list (empty? {}) (empty? #{}) (empty? {:a 1}) (empty? []) (empty? [1]) (empty? false)))
    expected: |
      2
      3
      0
      0
      0
      (true true false true false false)
  - name: equality-reaches-maps-and-sets
    source: |
      (println (= {:a 1} {:a 1}))
      (println (= {:a 1} {:a 2}))
      (println (= {:a {:b 2}} {:a {:b 2}}))
      (println (= #{1 2} #{2 1}))
      (println (= {:a 1} #{:a}))
      (println (= {:a false} {:a false}))
      (println (= {:a false} {:a nil}))
      (println (= 1 1 1))
      (println (= {:a 1} {:a 1} {:a 1}))
      (println (not= {:a 1} {:a 2}))
    expected: |
      true
      false
      true
      true
      false
      true
      false
      true
      true
      true
  - name: quoted-maps-and-sets-build-tables
    source: |
      (println (get '{:a 1} :a))
      (println (count '#{1 2}))
      (println (count '{:a {:b 2}}))
    expected: |
      1
      2
      1
  - name: sequential-destructuring-binds-positionally
    # A vector pattern binds through the seq view (past the end is nil, a map
    # contributes entry vectors); & takes the rest as a seq, :as the whole.
    source: |
      (println (let [[a b] [1 2]] [a b]))
      (println (let [[a & r] [1 2 3]] [a r]))
      (println (let [[a :as v] [1 2]] [a v]))
      (println (let [[[x y] z] [[1 2] 3]] [x y z]))
      (println (let [[a b] [1]] [a b]))
      (println (let [[e] {:a 1}] e))
      (println (loop [[a b] [3 4]] (+ a b)))
    expected: |
      [1 2]
      [1 (2 3)]
      [1 [1 2]]
      [1 2 3]
      [1 nil]
      [:a 1]
      7
  - name: map-destructuring-reads-through-get
    # :keys/:syms/:strs, explicit locals, :as and :or defaults; a nested map
    # pattern recurses through the same read.
    source: |
      (println (let [{:keys [a b]} {:a 1 :b 2}] [a b]))
      (println (let [{:keys [a] :as m} {:a 1}] [a (get m :a)]))
      (println (let [{:keys [a b] :or {a 9 b 10}} {:b 2}] [a b]))
      (println (let [{s :s} {:s 3}] s))
      (println (let [{:strs [t]} {"t" 4}] t))
      (println (let [{:syms [u]} {'u 5}] u))
      (println (let [{:keys [n/m]} {:n/m 6}] m))
      (println (let [{:keys [a] {:keys [b]} :nested} {:a 1 :nested {:b 2}}] [a b]))
    expected: |
      [1 2]
      [1 1]
      [9 2]
      3
      4
      5
      6
      [1 2]
  - name: fn-and-loop-destructure-their-parameters
    source: |
      (println ((fn [[a b]] (+ a b)) [3 4]))
      (println ((fn [{:keys [a]}] a) {:a 5}))
      (println ((fn [x & [y z]] [x y z]) 1 2 3))
      (println (loop [[a b] [6 7]] (* a b)))
    expected: |
      7
      5
      [1 2 3]
      42
  - name: threading-threads-first-and-last
    source: |
      (println (-> 5 inc inc))
      (println (->> 5 inc inc))
      (println (-> 5))
      (println (-> {:a 1} :a))
      (println (->> [3 1] (apply max)))
      (println (-> [1 2] (conj 3) (conj 4)))
      (println (->> [1 2] (map inc)))
      (println (as-> 5 x (inc x) (* x 2)))
      (println (as-> 5 x x))
      (println (doto 5 (inc) (dec)))
      (println (cond-> 5 true inc false inc))
      (println (cond->> 5 true (conj [1]) false (conj [2])))
      (println (some-> 5 (inc) (inc)))
      (println (some-> nil (inc)))
      (println (some->> [1 2] (map inc)))
      (println (list* 1 2 [3 4]))
      (println (list* [1 2]))
    expected: |
      7
      7
      5
      1
      3
      [1 2 3 4]
      (2 3)
      12
      5
      5
      6
      [1 5]
      7
      nil
      (2 3)
      (1 2 3 4)
      (1 2)
  - name: multi-arity-defn-and-fn-dispatch-by-count
    source: |
      (defn mar-f ([x] x) ([x y] (+ x y)))
      (println (mar-f 1))
      (println (mar-f 1 2))
      (defn mar-g "adds" ([x] (mar-g x 0)) ([x y] (+ x y)) ([x y & z] (+ x y (reduce + 0 z))))
      (println (mar-g 1))
      (println (mar-g 1 2))
      (println (mar-g 1 2 3 4))
      (println ((fn ([x] x) ([x y] (* x y))) 6))
      (println ((fn ([x] x) ([x y] (* x y))) 6 7))
      (println ((fn mn ([x] :one) ([x y] :two)) 1 2))
      (println ((fn mar-n [x] (if (= x 0) 0 (+ 1 (mar-n (dec x))))) 3))
    expected: |
      1
      3
      1
      3
      10
      6
      42
      :two
      3
  - name: declare-forward-declares
    source: |
      (declare dcl-f)
      (defn dcl-g [] (dcl-f 1))
      (defn dcl-f [x] (* 2 x))
      (println (dcl-g))
    expected: |
      2
  - name: chars-are-characters
    # Character literals print as their glyphs; equality and str see through.
    # Whitespace characters only ever print inside strings here, so no expected
    # line carries a bare blank or trailing space.
    source: |
      (println \a)
      (println \A)
      (println (str "n" \newline "l"))
      (println (str "s" \space "s"))
      (println \u0041)
      (println \o141)
      (println (= \a \a))
      (println (= \a \b))
      (println (str "a" \b "c"))
      (println (nth "ab" 0))
      (println (get "abc" 1))
      (println (if (= \a \a) "same" "diff"))
    expected: |
      a
      A
      n
      l
      s s
      A
      a
      true
      false
      abc
      a
      b
      same
  - name: radix-integers-and-exact-decimals
    # 0x, Nr and leading-0 octal spell integers; M is an exact ratio (0.1M is
    # 1/10, so (+ 0.1M 0.2M) is 3/10); big N values keep their magnitude. The
    # oracle prints each with its mark (0xFF, 1M, 2N, ...).
    source: |
      (println (list 0xFF 2r101 8r17 16rFF -0xFF 017 36rzz))
      (println (list 2N 99999999999999999999999N))
      (println (list 1M 0.1M 1e3M))
      (println (+ 0.1M 0.2M))
    expected: |
      (255 5 15 255 -255 15 1295)
      (2 99999999999999999999999)
      (1 1/10 1000)
      3/10
  - name: ns-require-wires-clojure-string
    # (:require [clojure.string :as s :refer [join]]) wires the alias and the
    # referred var; every verb runs over the core string operations. split takes
    # a string pattern (regex literals are refused at the reader).
    source: |
      (ns b05-str (:require [clojure.string :as s :refer [join]]))
      (println (s/join "," ["a" "b"]))
      (println (join "-" ["x" "y"]))
      (println (clojure.string/upper-case "hi"))
      (println (s/lower-case "HI"))
      (println (s/capitalize "hELLO"))
      (println (s/trim "  hi  "))
      (println (str "[" (s/triml "  hi  ") "]"))
      (println (str "[" (s/trimr "  hi  ") "]"))
      (println (s/trim-newline "a\r\n"))
      (println (s/blank? "  "))
      (println (s/blank? nil))
      (println (s/blank? "x"))
      (println (s/starts-with? "hi" "h"))
      (println (s/ends-with? "hi" "i"))
      (println (s/includes? "hi" "i"))
      (println (s/index-of "hihi" "i"))
      (println (s/index-of "hihi" "i" 2))
      (println (s/last-index-of "hihi" "i"))
      (println (s/replace "aaa" "a" "b"))
      (println (s/replace "aaa" \a \b))
      (println (s/replace-first "aaa" "a" "b"))
      (println (s/split "a,b" ","))
      (println (s/split "a,b," "," -1))
      (println (s/split-lines "a\r\nb"))
      (println (s/re-quote-replacement "a$b"))
      (println (s/escape "hi" {\i "I"}))
      (println (s/reverse "hi"))
      (println (subs "hello" 1 3))
      (println (subs "hello" 1))
      (println (map s/upper-case ["a" "b"]))
    expected: |
      a,b
      x-y
      HI
      hi
      Hello
      hi
      [hi  ]
      [  hi]
      a
      true
      true
      false
      true
      true
      true
      1
      3
      3
      bbb
      bbb
      baa
      (a b)
      (a b )
      (a b)
      a\$b
      hI
      ih
      el
      ello
      (A B)
  - name: try-catch-finally-and-throw
    # try guards handler-case inside unwind-protect; every catch class answers
    # the catch-all error clause, so the first clause handles any condition (the
    # oracle would run the second clause of the iae/ex pair); throw renders in
    # Clojure notation, so strings keep their message.
    source: |
      (println (try (throw "boom") (catch Exception e "caught")))
      (println (try (throw "boom") (catch IllegalArgumentException e "iae") (catch Exception e "ex")))
      (println (try 1 (finally (println "fin"))))
      (println (try (throw "x") (catch Exception e (str "got-" e)) (finally (println "done"))))
      (println (try (+ 1 2) (catch Exception e "no")))
    expected: |
      caught
      iae
      fin
      1
      done
      got-x
      3
  - name: atoms-are-shared-cells
    # An atom is a tagged one-vector cell every verb reads and writes; swap!
    # spreads extra arguments over the function, compare-and-set! compares with
    # eql and answers a boolean. An atom itself prints unreadably (#<Atom value>),
    # not the oracle's object syntax.
    source: |
      (def a05 (atom 1))
      (println @a05)
      (println (swap! a05 inc))
      (println (swap! a05 + 10 20))
      (println (reset! a05 2))
      (println (compare-and-set! a05 2 3))
      (println (compare-and-set! a05 2 9))
      (println @a05)
      (println (deref a05))
      (println @(volatile! 5))
      (println (map deref [(atom 1) (atom 2)]))
      (println (let [b05 (atom 0)] (reset! b05 41) (swap! b05 inc)))
    expected: |
      1
      2
      32
      2
      true
      false
      3
      3
      5
      (1 2)
      42
  - name: multimethods-dispatch-over-a-table
    # defmulti is a method table plus a dispatcher defun; defmethod stores,
    # remove-method drops, get-method reads, and a miss falls back to the
    # default dispatch value (:default without an option) or signals.
    source: |
      (defmulti m05 :shape)
      (defmethod m05 :circle [m] 1)
      (defmethod m05 :square [m] 2)
      (defmethod m05 :default [m] 0)
      (println (m05 {:shape :circle}))
      (println (m05 {:shape :square}))
      (println (m05 {:shape :tri}))
      (defmulti m05b "adds" (fn [x] (:t x)) :default :other)
      (defmethod m05b :other [x] 99)
      (println (m05b {:t :zzz}))
      (println (m05b {:t :other}))
      (defmulti m05c (fn [x y] (:t x)))
      (defmethod m05c :a [x y] (+ y 1))
      (println (m05c {:t :a} 41))
      (println ((get-method m05 :circle) {:shape :circle}))
      (remove-method m05 :circle)
      (println (get-method m05 :circle))
      (println (m05 {:shape :circle}))
    expected: |
      1
      2
      0
      99
      99
      42
      1
      nil
      0
  - name: hierarchies-derive-isa-and-prefer
    # derive/underive rewrite the global hierarchy value; isa?/parents/ancestors/
    # descendants read it (sets print in #{...}, single members only here -- the walk
    # order is unspecified); a multimethod
    # miss walks every method the dispatch value descends from, the strictly most
    # specific wins, prefer-method breaks ties, and an unbroken tie or a miss with
    # no default method signals. A custom hierarchy value is pure: derive returns
    # an updated map, and defmulti :hierarchy dispatches through it.
    source: |
      (derive :h-circle :h-shape)
      (derive :h-square :h-shape)
      (println (isa? :h-circle :h-shape))
      (println (isa? :h-shape :h-circle))
      (println (isa? :h-circle :h-circle))
      (println (parents :h-circle))
      (println (ancestors :h-circle))
      (println (count (descendants :h-shape)))
      (println (contains? (descendants :h-shape) :h-circle))
      (println (contains? (descendants :h-shape) :h-square))
      (defmulti h08 :shape)
      (defmethod h08 :h-shape [m] 0)
      (defmethod h08 :h-circle [m] 1)
      (println (h08 {:shape :h-circle}))
      (println (h08 {:shape :h-square}))
      (println (try (h08 {:shape :h-tri}) (catch Exception e "miss")))
      (println (underive :h-circle :h-shape))
      (println (isa? :h-circle :h-shape))
      (println (h08 {:shape :h-circle}))
      (def h08map (make-hierarchy))
      (def h08map2 (derive h08map :h-p :h-q))
      (println (isa? h08map2 :h-p :h-q))
      (println (isa? h08map :h-p :h-q))
      (println (parents h08map2 :h-p))
      (defmulti h08c :t :hierarchy h08map2)
      (defmethod h08c :h-q [x] "q!")
      (println (h08c {:t :h-p}))
      (println (try (h08c {:t :h-zzz}) (catch Exception e "miss")))
      (defmulti h08p :t)
      (defmethod h08p :h-x [m] "x")
      (defmethod h08p :h-y [m] "y")
      (derive :h-a :h-x)
      (derive :h-a :h-y)
      (prefer-method h08p :h-x :h-y)
      (println (h08p {:t :h-a}))
      (println (try (do (defmulti h08amb :t) (defmethod h08amb :h-x [m] 1) (defmethod h08amb :h-y [m] 2) (h08amb {:t :h-a})) (catch Exception e "amb")))
    expected: |
      true
      false
      true
      #{:h-shape}
      #{:h-shape}
      2
      true
      true
      1
      0
      miss
      nil
      false
      1
      true
      false
      #{:h-q}
      q!
      miss
      x
      amb
  - name: ex-info-carries-data-through-throw
    # ex-info builds a condition with message and data slots (its report prints
    # the message); throw signals an ex-info value as its own condition, anything
    # else through its Clojure-notation rendering; ex-data answers the map (nil for
    # any other condition) and ex-message the message. Each works as a function
    # value.
    source: |
      (println (try (throw (ex-info "boom" {:code 42})) (catch Exception e (get (ex-data e) :code))))
      (println (try (throw (ex-info "boom" {:code 42})) (catch Exception e (ex-message e))))
      (println (try (throw "plain") (catch Exception e (ex-data e))))
      (println (try (throw "plain") (catch Exception e (str "got-" e))))
      (println (map ex-data [(ex-info "m" 1) "nope"]))
      (println (map ex-message [(ex-info "m" 1) "nope"]))
      (println (ex-data (apply ex-info ["v" 2])))
    expected: |
      42
      boom
      nil
      got-plain
      (1 nil)
      (m nope)
      2
  - name: memfn-calls-a-method-on-its-target
    # memfn is a function of a target and the named arguments calling the method
    # on it; string receivers take the mapped core operation, like any instance
    # call, so this case runs on all four backends.
    source: |
      (println ((memfn toUpperCase) "hi"))
      (println ((memfn substring s e) "hello" 1 2))
      (println (map (memfn length) ["a" "bb"]))
      (println (apply (memfn substring s e) "hello" [1 2]))
    expected: |
      HI
      e
      (1 2)
      e
  - name: string-replace-and-split-stay-literal
    # There is no regex runtime: split/replace match literal strings, so a
    # pattern that is special in regex syntax matches only itself. Regex
    # literals (#"...") stay refused at the reader.
    source: |
      (ns b08lit (:require [clojure.string :as s]))
      (println (s/replace "aaa" "." "b"))
      (println (s/split "aaa" "."))
      (println (s/replace-first "aaa" "a+" "b"))
      (println (.split "aaa" "."))
    expected: |
      aaa
      (aaa)
      aaa
      (aaa)
  - name: pr-and-pr-str-are-readable
    # pr/prn are the readable arms of print/println, pr-str of str: strings print
    # quoted, chars with their backslash, collections in Clojure notation.
    source: |
      (pr \a)
      (newline)
      (pr "x" [1 :a] {:b 2} #{3})
      (newline)
      (println (pr-str [1 :a] "x" \a))
      (println (pr-str))
      (println (pr-str nil))
      (println (map pr-str ["a" 1]))
    expected: |
      \a
      "x" [1 :a] {:b 2} #{3}
      [1 :a] "x" \a

      nil
      ("a" 1)
  - name: collections-nest-in-clojure-notation
    # Vectors, maps, sets and lists nest with their own brackets; nil stays nil
    # (never ()).
    source: |
      (println [{:a [1 :b]} #{:c} (list true false nil)])
      (println (list {:a 1} [2] #{3} "s" \c))
      (println [])
      (println {})
      (println #{})
    expected: |
      [{:a [1 :b]} #{:c} (true false nil)]
      ({:a 1} [2] #{3} s c)
      []
      {}
      #{}
  - name: cycles-print-with-datum-labels
    # A value that closes a cycle prints with a datum label, like Scheme's write:
    # an atom holding itself, and a map reaching itself through an atom.
    source: |
      (def cyc07 (atom nil))
      (reset! cyc07 cyc07)
      (println cyc07)
      (def cyc07m {:self cyc07})
      (reset! cyc07 cyc07m)
      (println cyc07)
      (println @cyc07)
    expected: |
      #0=#<Atom #0#>
      #0=#<Atom {:self #0#}>
      #0={:self #<Atom #0#>}
  - name: unreadable-values-print-in-angle-brackets
    # Functions and atoms have no readable notation: a function prints
    # #<procedure>, an atom #<Atom value>.
    source: |
      (println (atom 1))
      (println (fn [x] x))
      (println (map deref [(atom 1) (atom 2)]))
    expected: |
      #<Atom 1>
      #<procedure>
      (1 2)
  - name: throw-and-miss-messages-use-clojure-notation
    # throw of a non-ex-info value signals its Clojure-notation rendering, and a
    # multimethod miss names its dispatch value the same way.
    source: |
      (println (try (throw {:a 1}) (catch Exception e (ex-message e))))
      (println (try (throw [1 :a]) (catch Exception e (str "got-" e))))
      (defmulti b07m :t)
      (defmethod b07m :a [x] 1)
      (println (try (b07m {:t :zzz}) (catch Exception e (ex-message e))))
    expected: |
      {:a 1}
      got-[1 :a]
      No method in b07m for dispatch value: :zzz
