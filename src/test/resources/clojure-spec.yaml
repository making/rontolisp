      (println (get (conj b13-r [:hard true]) :hard))
      (println (get-in b13-r [:mass]))
      (println (get (assoc-in b13-r [:mass] 8) :mass))
      (println (get (update-in b13-r [:mass] inc) :mass))
    expected: |
