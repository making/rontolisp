      true [:a 1] [[:containsKey :a] [:entryAt :a]] {:a 2} [[:valAt :a] [:assoc :a 2]] {:a 1} [[:entryAt :a]]
      1 (:a) (1) true true true false {:a 1} [{:a 1}]
      {:a 1}
      11 [[:iterator]] {:a 1} [[:iterator]] [:a 1] [[:iterator]]
      {:a 1, :c 3} [[:cons {:c 3}]] {:c 3} true false 1 [[:valAt :a]]
      1 :nf 1 1 true [:a 1] ([:a 1]) false (:a) true true {:a 1}
  - name: a-set-type-disjs-contains-and-prints-as-a-set
    # clojure.lang.IPersistentSet in a deftype body (.kb/clojure-frontend.md "Collection
    # interfaces"): disj reaches its disjoin, contains? its contains, get and a keyword's
    # call its get (with a default, past its contains); set? is true and it prints as a
    # set; a set on the left of = is no java.util.Set's. Every line is the oracle's (clj
    # 1.12.6), on all four backends.
    source: |
      (ns iface-set)
      (def log (atom []))
      (defn note [& xs] (swap! log conj (vec xs)))
      (defn calls [] (let [l @log] (reset! log []) l))
      (deftype SetT [s]
        clojure.lang.IPersistentSet
        (count [_] (count s))
        (cons [_ x] (note :cons x) (SetT. (conj s x)))
        (empty [_] (SetT. #{}))
        (equiv [_ o] (= s o))
        (seq [_] (seq s))
        (disjoin [_ k] (note :disjoin k) (SetT. (disj s k)))
        (contains [_ k] (note :contains k) (contains? s k))
        (get [_ k] (note :get k) (get s k)))
      (def ss (SetT. #{1}))
      (prn (.-s (disj ss 1)) (calls) (contains? ss 1) (get ss 1) (get ss 9 :nf) (:a ss) (calls))
      (prn (set? ss) (count ss) ss (= ss #{1}) (= #{1} ss) (.-s (conj ss 1)) (calls) (into #{} ss))
      (in-ns 'user)
    expected: |
      #{} [[:disjoin 1]] true 1 :nf nil [[:contains 1] [:get 1] [:contains 9] [:get :a]]
      true 1 #{1} true false #{1} [[:cons 1]] #{1}
  - name: a-vector-type-indexes-stacks-reverses-and-prints-as-a-vector
    # clojure.lang.IPersistentVector in a deftype body (.kb/clojure-frontend.md
    # "Collection interfaces"): vector?, sequential?, reversible? and indexed? are true, it
    # prints as a vector, a vector on the left of = reads its count and nth, a list its
    # seq; assoc reaches its assoc, rseq its rseq, peek and pop theirs, subvec its nth.
    # Every line is the oracle's (clj 1.12.6), on all four backends.
    source: |
      (ns iface-vector)
      (def log (atom []))
      (defn note [& xs] (swap! log conj (vec xs)))
      (defn calls [] (let [l @log] (reset! log []) l))
      (deftype VecT [v]
        clojure.lang.IPersistentVector
        (count [_] (count v))
        (cons [_ x] (note :cons x) (VecT. (conj v x)))
        (empty [_] (VecT. []))
        (equiv [_ o] (= v o))
        (seq [_] (seq v))
        (peek [_] (note :peek) (peek v))
        (pop [_] (note :pop) (VecT. (pop v)))
        (valAt [_ k] (get v k))
        (valAt [_ k nf] (get v k nf))
        (containsKey [_ k] (contains? v k))
        (entryAt [_ k] (find v k))
        (assoc [_ k x] (note :assoc k x) (VecT. (assoc v k x)))
        (assocN [_ k x] (VecT. (assoc v k x)))
        (length [_] (count v))
        (rseq [_] (note :rseq) (rseq v))
        (nth [_ i] (nth v i))
        (nth [_ i nf] (nth v i nf)))
      (def vv (VecT. [1 2 3]))
      (prn (vector? vv) (sequential? vv) (reversible? vv) (indexed? vv) vv [vv] (= vv [1 2 3]) (= [1 2 3] vv) (= '(1 2 3) vv))
      (prn (.-v (assoc vv 0 9)) (nth vv 1) (get vv 1) (rseq vv) (peek vv) (.-v (pop vv)) (calls) (subvec vv 1) (let [[a b] vv] [a b]))
      (prn (mapv inc vv) (reduce + vv) (count vv) (contains? vv 1) (find vv 1) (.-v (into vv [4])) (calls) (last vv))
      (in-ns 'user)
    expected: |
      true true true true [1 2 3] [[1 2 3]] true true true
      [9 2 3] 2 2 (3 2 1) 3 [1 2] [[:assoc 0 9] [:rseq] [:peek] [:pop]] [2 3] [1 2]
      [2 3 4] 6 3 true [1 2] [1 2 3 4] [[:cons 4]] 3
  - name: a-seq-type-walks-through-its-first-and-next
    # clojure.lang.ISeq and Sequential in a deftype body (.kb/clojure-frontend.md
    # "Collection interfaces"): a seq answering the type itself walks through its first
    # and next -- first, second, map, into, reduce, count, last, apply, vec -- and prints
    # as a seq; seq? is true, sequential? only with Sequential, whose seq a vector or list
    # on the other side of = walks, like nth and vector destructuring. Every line is the
    # oracle's (clj 1.12.6), on all four backends.
    source: |
      (ns iface-seq)
      (deftype SeqT [v i]
        clojure.lang.ISeq
        (first [_] (nth v i))
        (next [_] (when (< (inc i) (count v)) (SeqT. v (inc i))))
        (more [_] (if (< (inc i) (count v)) (SeqT. v (inc i)) ()))
        (cons [this x] (cons x this))
        (count [_] (- (count v) i))
        (empty [_] ())
        (equiv [this o] (= (seq v) o))
        (seq [this] this))
      (def qq (SeqT. [1 2 3] 0))
      (prn (first qq) (second qq) (seq? qq) (sequential? qq) (coll? qq) qq (count qq) (conj qq 0) (cons 0 qq) (map inc qq) (into [] qq))
      (prn (reduce + qq) (= [1 2 3] qq) (= qq [1 2 3]) (last qq) (apply + qq) (empty? qq) (vec qq))
      (deftype SeqViewT [v] clojure.lang.Sequential clojure.lang.Seqable (seq [_] (seq v)))
      (prn (sequential? (SeqViewT. [1 2])) (= [1 2] (SeqViewT. [1 2])) (= '(1 2) (SeqViewT. [1 2])) (= (SeqViewT. [1 2]) [1 2]) (nth (SeqViewT. [1 2]) 1) (let [[a b] (SeqViewT. [1 2])] [a b]))
      (in-ns 'user)
    expected: |
      1 2 true false true (1 2 3) 3 (0 1 2 3) (0 1 2 3) (2 3 4) [1 2 3]
      6 false true 3 6 false [1 2 3]
      true true true true 2 [1 2]
  - name: an-iterable-type-seqs-and-reduces-through-its-iterator
    # java.lang.Iterable, java.util.Iterator and the java.util collections in a deftype or
    # reify body (.kb/clojure-frontend.md "Collection interfaces"): the seq of an Iterable
    # steps its iterator, and so do reduce, into, vec and sort; iterator-seq steps an
    # iterator -- a type's, a collection's .iterator, a clojure.lang.SeqIterator -- whose
    # next past its end is the oracle's NoSuchElementException; a java.util.List counts
    # through its size, a RandomAccess one indexes through its get and prints readably as
    # a vector, a java.util.Set answers contains? and = through its contains and prints
    # readably as a set. Every line is the oracle's (clj 1.12.6), on all four backends.
    source: |
      (ns iface-iter)
      (deftype ThreeT []
        java.lang.Iterable
        (iterator [_]
          (let [i (atom 0)]
            (reify java.util.Iterator
              (hasNext [_] (< @i 3))
              (next [_] (let [x @i] (swap! i inc) x))))))
      (prn (seq (ThreeT.)) (first (ThreeT.)) (reduce + (ThreeT.)) (reduce + 10 (ThreeT.)) (into [] (ThreeT.)) (map inc (ThreeT.)) (vec (ThreeT.)) (sort > (ThreeT.)) (seqable? (ThreeT.)) (coll? (ThreeT.)) (empty? (ThreeT.)))
      (prn (iterator-seq (.iterator (ThreeT.))) (iterator-seq (.iterator [1 2 3])) (iterator-seq (clojure.lang.SeqIterator. (seq [4 5]))) (iterator-seq (.iterator {:a 1})))
      (prn (let [it (.iterator [7 8])] [(.hasNext it) (.next it) (.next it) (.hasNext it)]) (try (.next (.iterator [])) (catch java.util.NoSuchElementException e :done)))
      (deftype JListT [v] java.util.List java.util.RandomAccess (size [_] (count v)) (get [_ i] (nth v i)) (iterator [_] (.iterator v)))
      (deftype JSetT [s] java.util.Set (size [_] (count s)) (contains [_ x] (contains? s x)) (iterator [_] (.iterator s)))
      (prn (count (JListT. [1 2])) (nth (JListT. [1 2]) 1) (seq (JListT. [1 2])) (= [1 2] (JListT. [1 2])) (= '(1 2) (JListT. [1 2])) (pr-str (JListT. [1 2])) (reduce + (JListT. [1 2])))
      (prn (count (JSetT. #{1})) (contains? (JSetT. #{1}) 1) (seq (JSetT. #{1})) (= #{1} (JSetT. #{1})) (pr-str (JSetT. #{1})) (set? (JSetT. #{1})))
      (in-ns 'user)
    expected: |
      (0 1 2) 0 3 13 [0 1 2] (1 2 3) [0 1 2] (2 1 0) true false false
      (0 1 2) (1 2 3) (4 5) ([:a 1])
      [true 7 8 false] :done
      2 2 (1 2) true true "[1 2]" 3
      1 true (1) true "#{1}" false
  - name: pending-comparable-and-sorted-types-answer-through-their-methods
    # clojure.lang.IPending, java.lang.Comparable and clojure.lang.Sorted in a deftype body
    # (.kb/clojure-frontend.md "Collection interfaces"): realized? reaches isRealized;
    # compare, sort and a sorted set's default order compareTo; subseq and rsubseq walk a
    # Sorted through its seqFrom, seq, comparator and entryKey, like the oracle's. A
    # method the body leaves out is the oracle's AbstractMethodError when a verb calls it
    # (an IPersistentMap is an Iterable, whose iterator reduce reads). Every line is the
    # oracle's (clj 1.12.6), on all four backends.
    source: |
      (ns iface-misc)
      (deftype CellT [r] clojure.lang.IPending (isRealized [_] r))
      (prn (realized? (CellT. true)) (realized? (CellT. false)) (instance? clojure.lang.IPending (CellT. 1)))
      (deftype CentsT [c] java.lang.Comparable (compareTo [_ o] (compare c (.-c ^CentsT o))))
      (prn (compare (CentsT. 1) (CentsT. 2)) (compare (CentsT. 2) (CentsT. 2)) (map #(.-c %) (sort [(CentsT. 3) (CentsT. 1) (CentsT. 2)])) (map #(.-c %) (sorted-set (CentsT. 2) (CentsT. 1))) (compare nil (CentsT. 1)))
      (deftype IndexT [m]
        clojure.lang.Sorted
        (comparator [_] compare)
        (entryKey [_ e] (key e))
        (seq [_ asc] (if asc (seq m) (rseq m)))
        (seqFrom [_ k asc] (if asc (subseq m >= k) (rsubseq m <= k))))
      (def ix (IndexT. (sorted-map 1 :a 2 :b 3 :c 4 :d)))
      (prn (sorted? ix) (subseq ix > 2) (subseq ix < 3) (rsubseq ix < 3) (rsubseq ix >= 3) (subseq ix >= 2 < 4) (rsubseq ix > 1 <= 3))
      (deftype HolderT [] clojure.lang.IPersistentMap (count [_] 0) (seq [_] nil))
      (prn (try (reduce + 0 (HolderT.)) (catch AbstractMethodError e :no-iterator)) (try (conj (HolderT.) [:a 1]) (catch AbstractMethodError e :no-cons)))
      (prn (instance? clojure.lang.IPersistentMap (HolderT.)) (instance? java.lang.Iterable (HolderT.)) (instance? clojure.lang.Associative (HolderT.)) (instance? java.util.Map (HolderT.)) (instance? clojure.lang.IHashEq (reify clojure.lang.IHashEq (hasheq [_] 1))))
      (in-ns 'user)
    expected: |
      true false true
      -1 0 (1 2 3) (1 2) -1
      true ([3 :c] [4 :d]) ([1 :a] [2 :b]) ([2 :b] [1 :a]) ([4 :d] [3 :c]) ([2 :b] [3 :c]) ([3 :c] [2 :b])
      :no-iterator :no-cons
      true true true false true
  - name: a-protocol-extended-to-a-collection-interface-reaches-a-type-implementing-it
    # extend-protocol to clojure.lang.IPersistentMap, IPersistentVector, IPersistentSet and
    # java.util.Map, which also key the core kinds' rows, and to ISeq
    # (.kb/clojure-frontend.md "Collection interfaces"): a deftype or reify implementing one
    # takes its row, an extension to none the Object row; satisfies? agrees. Every line is
    # the oracle's (clj 1.12.6), on all four backends.
    source: |
      (ns iface-extend)
      (defprotocol Kind (kind [x]))
      (extend-protocol Kind
        clojure.lang.IPersistentMap (kind [_] :map)
        clojure.lang.IPersistentVector (kind [_] :vector)
        clojure.lang.ISeq (kind [_] :seq)
        clojure.lang.IPersistentSet (kind [_] :set)
        java.util.Map (kind [_] :java-map)
        Object (kind [_] :object))
      (deftype KindMapT [m] clojure.lang.IPersistentMap (seq [_] (seq m)) (count [_] (count m)))
      (deftype KindVecT [v] clojure.lang.IPersistentVector (seq [_] (seq v)) (count [_] (count v)) (nth [_ i] (nth v i)))
      (deftype KindSeqT [v] clojure.lang.ISeq (seq [this] (seq v)) (first [_] (first v)) (next [_] (next v)))
      (deftype KindSetT [s] clojure.lang.IPersistentSet (seq [_] (seq s)) (count [_] (count s)))
      (deftype KindJMapT [m] java.util.Map (size [_] (count m)))
      (prn (kind (KindMapT. {})) (kind (KindVecT. [])) (kind (KindSeqT. [])) (kind (KindSetT. #{})) (kind (KindJMapT. {})) (kind (reify clojure.lang.Counted (count [_] 0))))
      (prn (kind #{1}) (satisfies? Kind (KindMapT. {})) (satisfies? Kind (KindVecT. [])))
      (in-ns 'user)
    expected: |
      :map :vector :seq :set :java-map :object
      :set true true
  - name: a-protocol-extended-to-an-interface-reaches-every-value-implementing-it
    # extend-protocol to an interface spelled like a core kind whose instances go past
    # that kind (.kb/clojure-frontend.md "Collection interfaces"): a record reaches
    # clojure.lang.IPersistentMap and java.util.Map, a vector and a set java.util.Collection,
    # a keyword, a symbol and a map clojure.lang.IFn, a vector clojure.lang.Sequential; a
    # list takes clojure.lang.ISeq ahead of IPersistentCollection, the more specific one,
    # and a keyword its own class ahead of IFn. Every line is the oracle's (clj 1.12.6),
    # on all four backends.
    source: |
      (ns iface-extend-kinds)
      (defrecord ExtKindRec [a])
      (defprotocol Shape (shape [x]))
      (extend-protocol Shape
        clojure.lang.IPersistentMap (shape [_] :pmap)
        Object (shape [_] :other))
      (prn (shape (->ExtKindRec 1)) (shape {}) (shape (sorted-map)) (shape []) (satisfies? Shape (->ExtKindRec 1)))
      (defprotocol JShape (jshape [x]))
      (extend-protocol JShape
        java.util.Map (jshape [_] :jmap)
        java.util.Collection (jshape [_] :coll)
        Object (jshape [_] :other))
      (prn (jshape (->ExtKindRec 1)) (jshape {}) (jshape [1]) (jshape #{1}) (jshape '(1)) (jshape (map inc [1])) (jshape "s"))
      (defprotocol Order (order [x]))
      (extend-protocol Order
        clojure.lang.IPersistentCollection (order [_] :pcoll)
        clojure.lang.ISeq (order [_] :iseq)
        Object (order [_] :other))
      (prn (order '(1)) (order [1]) (order {}) (order (->ExtKindRec 1)) (order #{}) (order "s"))
      (defprotocol Call (call-kind [x]))
      (extend-protocol Call
        clojure.lang.IFn (call-kind [_] :ifn)
        clojure.lang.Keyword (call-kind [_] :keyword)
        Object (call-kind [_] :other))
      (prn (call-kind :k) (call-kind 's) (call-kind {}) (call-kind []) (call-kind inc) (call-kind 1) (satisfies? Call 's))
      (defprotocol Line (line [x]))
      (extend-protocol Line
        clojure.lang.Sequential (line [_] :sequential))
      (prn (line [1]) (line '(1)) (satisfies? Line [1]) (satisfies? Line {}))
      (in-ns 'user)
    expected: |
      :pmap :pmap :pmap :other true
      :jmap :jmap :coll :coll :coll :coll :other
      :iseq :pcoll :pcoll :pcoll :pcoll :other
      :keyword :ifn :ifn :ifn :ifn :other true
      :sequential :sequential true false
  - name: clojure-java-io-file-names-a-path
    # clojure.java.io/file and (java.io.File. ...) make a java.io.File value of this
    # front end's own on every backend: the path as java.io.File normalizes it on Unix
    # (no doubled or trailing slash, an empty parent the root), its name and parent read
    # off the spelling, = and the hash by path. Oracle-identical (clj 1.12.6,
    # 2026-10-08), the hash included (String.hashCode xor 1234321).
    source: |
      (require '[clojure.java.io :as io])
      (println (str (io/file "a/b//c/")) (str (io/file "a" "b" "c")) (.getPath (io/file "" "b"))
               (.getPath (io/file nil "b")) (.getPath (io/file (io/file "a") "b/")) (.getPath (io/file "/")))
      (prn (.getName (io/file "a/b.txt")) (.getParent (io/file "a/b.txt")) (.getParent (io/file "a"))
           (.getParent (io/file "/a")) (.getParent (io/file "/")) (str (.getParentFile (io/file "a/b"))))
      (prn (.isAbsolute (io/file "/a")) (.isAbsolute (io/file "a")) (= (io/file "a") (io/file "a/"))
           (= (io/file "a") "a") (.compareTo (io/file "a") (io/file "b")) (.hashCode (io/file "a")))
      (prn (instance? java.io.File (io/file "a")) (instance? Comparable (io/file "a"))
           (instance? java.io.Serializable (io/file "a")) (instance? java.io.File "a")
           (= (java.io.File. "x" "y") (io/file "x/y")))
      (prn (io/as-relative-path "a/b") (io/as-file nil) (str (io/file (io/as-url "file:/tmp/%C3%A9+x"))))
      (prn (try (io/file "a" "/b") (catch IllegalArgumentException e (ex-message e)))
           (try (io/as-relative-path "/a") (catch IllegalArgumentException e (ex-message e)))
           (try (io/file 1) (catch IllegalArgumentException e :refused)))
    expected: |
      a/b/c a/b/c /b b a/b /
      "b.txt" "a" nil "/" nil "a"
      true false true false -1 1234416
      true true true false true
      "a/b" nil "/tmp/é+x"
      "/b is not a relative path" "/a is not a relative path" :refused
  - name: a-java-io-file-prints-as-the-host-object-its-hash-left-out
    # A deviation: the oracle's #object carries the identity hash
    # (#object[java.io.File 0x649725e3 a]), which no value here has, like a stream's;
    # class answers the class's keyword, the oracle the class (java.io.File).
    source: |
      (println (io/file "a") [(io/file "b")])
      (prn (io/file "c") (str [(io/file "d")]) (class (io/file "e")))
    expected: |
      #object[java.io.File a] [#object[java.io.File b]]
      #object[java.io.File "c"] "[#object[java.io.File \"d\"]]" :java.io.File
  - name: clojure-java-io-opens-the-four-kinds-of-stream-over-a-file
    # reader and writer (:append) open a character stream over a File, input-stream and
    # output-stream a byte stream; a writer over a byte stream encodes into it, a reader
    # over one decodes it. Writer.write of an int writes that character, of a string and
    # two ints a part of it; OutputStream.write writes an int's low octet. On wasm the
    # paths need a --dir preopen covering /tmp. Oracle-identical (clj 1.12.6, 2026-10-08).
    source: |
      (def jio-base (str "/tmp/rontolisp-jio-" (rand-int 1000000000) "-" (rand-int 1000000000)))
      (def jio-a (io/file (str jio-base "-a.txt")))
      (spit jio-a "héllo\nworld\n")
      (prn (slurp jio-a) (.exists jio-a) (.isFile jio-a) (.isDirectory jio-a) (.length jio-a))
      (with-open [r (io/reader jio-a)] (prn (line-seq r)))
      (with-open [w (io/writer jio-a :append true)]
        (.write w "more") (.write w 10) (.write w "xBCx" 1 2) (.newLine w) (.append w \!))
      (prn (slurp jio-a))
      (with-open [in (io/input-stream jio-a)]
        (prn [(.read in) (.read in) (.read in) (.available in) (.skip in 2) (.read in)]))
      (with-open [o (io/output-stream jio-a)] (.write o 65) (.write o 300) (.write o 10))
      (prn (slurp jio-a) (.length jio-a))
      (with-open [o (io/output-stream jio-a :append true)] (.write o 66))
      (prn (slurp jio-a))
      (with-open [w (io/writer (io/output-stream jio-a))] (.write w "via bytes é"))
      (prn (slurp jio-a))
      (prn (slurp (io/input-stream jio-a)))
      (with-open [r (io/reader (io/input-stream jio-a))] (prn (.readLine r)))
    expected: |
      "héllo\nworld\n" true true false 13
      ("héllo" "world")
      "héllo\nworld\nmore\nBC\n!"
      [104 195 169 19 2 111]
      "A,\n" 3
      "A,\nB"
      "via bytes é"
      "via bytes é"
      "via bytes é"
  - name: clojure-java-io-copy-moves-what-one-holds-into-another
    # copy takes a byte stream, a reader, a File or a string's characters to a byte
    # stream, a writer or a File, characters in :encoding (UTF-8 by default), and
    # refuses any other pair in the words of the oracle's do-copy multimethod.
    # Oracle-identical (clj 1.12.6, 2026-10-08).
    source: |
      (def jio-b (io/file (str jio-base "-b.txt")))
      (prn (io/copy "copied é" jio-a))
      (io/copy jio-a jio-b)
      (prn (slurp jio-b) (.length jio-b))
      (let [w (java.io.StringWriter.)] (io/copy jio-a w) (prn (str w)))
      (let [w (java.io.StringWriter.)] (with-open [in (io/input-stream jio-a)] (io/copy in w)) (prn (str w)))
      (with-open [r (io/reader jio-a) o (io/output-stream jio-b)] (io/copy r o))
      (prn (slurp jio-b))
      (io/copy "é" jio-b :encoding "ISO-8859-1")
      (prn (.length jio-b) (slurp jio-b :encoding "ISO-8859-1"))
      (prn (try (io/copy 1 jio-b) (catch IllegalArgumentException e (ex-message e))))
      (prn (try (io/copy "a" nil) (catch IllegalArgumentException e (ex-message e))))
    expected: |
      nil
      "copied é" 9
      "copied é"
      "copied é"
      "copied é"
      1 "é"
      "No method in multimethod 'do-copy' for dispatch value: [java.lang.Long java.io.File]"
      "No method in multimethod 'do-copy' for dispatch value: [java.lang.String nil]"
  - name: clojure-java-io-reads-and-writes-in-an-encoding
    # :encoding names UTF-8, ISO-8859-1 or US-ASCII (and their aliases); any other name
    # is the oracle's UnsupportedEncodingException, where the oracle knows the JDK's
    # other charsets too. Oracle-identical (clj 1.12.6, 2026-10-08).
    source: |
      (spit jio-a "é" :encoding "ISO-8859-1")
      (prn (.length jio-a) (slurp jio-a :encoding "latin1"))
      (with-open [r (io/reader jio-a :encoding "ISO-8859-1")] (prn (slurp r)))
      (prn (try (io/reader jio-a :encoding "bogus") (catch java.io.UnsupportedEncodingException e (ex-message e))))
    expected: |
      1 "é"
      "é"
      "bogus"
  - name: clojure-java-io-refuses-what-it-cannot-open
    # IOFactory's refusals in the oracle's words, slurp's and spit's of what no path
    # names among them; a missing file is its FileNotFoundException, a read of a closed
    # byte stream its IOException. Oracle-identical (clj 1.12.6, 2026-10-08).
    source: |
      (prn (try (io/reader 1) (catch IllegalArgumentException e (ex-message e)))
           (try (io/reader nil) (catch IllegalArgumentException e (ex-message e)))
           (try (io/writer 1) (catch IllegalArgumentException e (ex-message e)))
           (try (io/input-stream :a) (catch IllegalArgumentException e (ex-message e)))
           (try (io/output-stream 1) (catch IllegalArgumentException e (ex-message e))))
      (prn (try (slurp (io/file (str jio-base "-missing"))) (catch java.io.FileNotFoundException e :not-found))
           (try (.read (doto (io/input-stream jio-a) .close)) (catch java.io.IOException e (ex-message e))))
      (prn (try (slurp 1) (catch IllegalArgumentException e (ex-message e)))
           (try (spit 2 "x") (catch IllegalArgumentException e (ex-message e)))
           (try (slurp nil) (catch IllegalArgumentException e (ex-message e))))
    expected: |
      "Cannot open <1> as an InputStream." "Cannot open <nil> as a Reader." "Cannot open <1> as an OutputStream." "Cannot open <:a> as an InputStream." "Cannot open <1> as an OutputStream."
      :not-found "Stream closed"
      "Cannot open <1> as an InputStream." "Cannot open <2> as an OutputStream." "Cannot open <nil> as a Reader."
  - name: java-io-files-are-made-renamed-and-deleted
    # createNewFile, renameTo, delete-file (silently answering its second argument),
    # make-parents of a path with no parent, and a missing file's lastModified and
    # length (0). Oracle-identical (clj 1.12.6, 2026-10-08).
    source: |
      (def jio-c (io/file (str jio-base "-c.txt")))
      (prn (.createNewFile jio-c) (.createNewFile jio-c) (.exists jio-c))
      (prn (.renameTo jio-c (io/file (str jio-base "-d.txt"))) (.exists jio-c))
      (prn (io/delete-file (str jio-base "-d.txt")) (io/delete-file (str jio-base "-d.txt") :quietly))
      (prn (try (io/delete-file jio-c) (catch java.io.IOException e :refused)))
      (prn (io/make-parents "zz-jio-no-parent") (.lastModified jio-c) (.length jio-c))
      (io/delete-file jio-a)
      (io/delete-file jio-b)
      (prn (.exists jio-a) (.exists jio-b))
    expected: |
      true false true
      true false
      true :quietly
      :refused
      nil 0 0
      false false
  - name: clojure-java-io-urls-and-uris
    # as-url of a string, a File (its file: URL, quoted like java.net.URI quotes a
    # path) and a URI; a URL's parts as java.net.URL reads them; as-file of a URL of
    # any protocol but file is the oracle's refusal. Oracle-identical (clj 1.12.6,
    # 2026-10-08).
    source: |
      (let [u (io/as-url "http://u@h.com:81/p/a.txt?q=1#r")]
        (prn (str u) (.getProtocol u) (.getHost u) (.getPort u) (.getPath u) (.getFile u)
             (.getQuery u) (.getRef u) (.getAuthority u) (.getUserInfo u) (.getDefaultPort u)))
      (let [u (io/as-url "file:/tmp/x")]
        (prn (.getProtocol u) (.getHost u) (.getPort u) (.getPath u) (.getFile u) (.getQuery u)))
      (prn (str (io/as-url (io/file "/tmp/é x#y?z"))) (str (.toURI (io/file "/tmp/a b")))
           (= (io/as-url "file:/a") (io/as-url "file:/a")) (str (io/as-url (.toURI (io/file "/a")))))
      (prn (try (io/as-url "foo:bar") (catch java.net.MalformedURLException e (ex-message e)))
           (try (io/as-url "/no/protocol") (catch java.net.MalformedURLException e :malformed))
           (try (io/file (io/as-url "http://x/y")) (catch IllegalArgumentException e (ex-message e))))
      (prn (io/resource "no/such/resource-jio.txt"))
    expected: |
      "http://u@h.com:81/p/a.txt?q=1#r" "http" "h.com" 81 "/p/a.txt" "/p/a.txt?q=1" "q=1" "r" "u@h.com:81" "u" 80
      "file" "" -1 "/tmp/x" "/tmp/x" nil
      "file:/tmp/é%20x%23y%3Fz" "file:/tmp/a%20b" true "file:/a"
      "unknown protocol: foo" :malformed "Not a file: http://x/y"
      nil
  - name: clojure-java-io-protocols-a-program-extends
    # Coercions and IOFactory are protocols: a record extending Coercions is a file to
    # file, one extending IOFactory opens through its own rows, reader included.
    # Oracle-identical (clj 1.12.6, 2026-10-08).
    source: |
      (defrecord JioNamed [path])
      (extend-protocol io/Coercions JioNamed (as-file [n] (io/file (:path n))) (as-url [n] nil))
      (prn (str (io/file (->JioNamed "p/q"))) (satisfies? io/Coercions "a") (satisfies? io/Coercions 1)
           (satisfies? io/IOFactory 1) (sort (keys io/default-streams-impl)))
      (defrecord JioText [s])
      (extend-protocol io/IOFactory JioText
        (make-reader [t _] (java.io.BufferedReader. (java.io.StringReader. (:s t))))
        (make-writer [t _] (throw (IllegalArgumentException. "read only")))
        (make-input-stream [t _] (throw (IllegalArgumentException. "no bytes")))
        (make-output-stream [t _] (throw (IllegalArgumentException. "read only"))))
      (with-open [r (io/reader (->JioText "one\ntwo"))] (prn (line-seq r)))
      (prn (try (io/writer (->JioText "x")) (catch IllegalArgumentException e (ex-message e))))
    expected: |
      "p/q" true false true (:make-input-stream :make-output-stream :make-reader :make-writer)
      ("one" "two")
      "read only"
  - name: extend-takes-a-map-computed-at-run-time
    # extend with a map the program computes -- clojure.java.io's default-streams-impl
    # with one row replaced, a var's map, merge's and hash-map's -- stores each entry as
    # a row, like a map literal's, and takes several protocol and map pairs; slurp and
    # spit open a type extended to IOFactory through it. Oracle-identical (clj 1.12.6,
    # 2026-10-08).
    source: |
      (defrecord JioSrc [s])
      (extend JioSrc io/IOFactory (assoc io/default-streams-impl :make-input-stream (fn [x _] (io/input-stream (:s x)))))
      (def jio-e (str jio-base "-e.txt"))
      (spit jio-e "one\ntwo")
      (with-open [r (io/reader (->JioSrc jio-e))] (prn (line-seq r)))
      (prn (slurp (->JioSrc jio-e)))
      (prn (try (io/output-stream (->JioSrc "x")) (catch IllegalArgumentException e (ex-message e)))
           (try (io/writer (->JioSrc "y")) (catch IllegalArgumentException e (ex-message e))))
      (def jio-coercions {:as-file (fn [x] (io/file (:s x))) :as-url (fn [_] nil)})
      (extend JioSrc io/Coercions jio-coercions)
      (prn (str (io/file (->JioSrc "a/b"))) (io/as-url (->JioSrc "c")) (satisfies? io/Coercions (->JioSrc "d")))
      (defprotocol JioTwo (jio-one [x]) (jio-two [x y]))
      (defn jio-one-impl [x] [:one x])
      (extend String JioTwo (merge {:jio-one jio-one-impl} {:jio-two (fn [x y] [:two x y])}))
      (extend Object JioTwo (hash-map :jio-one (fn [x] [:object x])))
      (prn (jio-one "s") (jio-two "s" 2) (jio-one 1))
      (extend Long JioTwo {:jio-one (fn [x] [:long x])} io/Coercions {:as-file (fn [n] (io/file (str n))) :as-url (fn [_] nil)})
      (prn (jio-one 5) (str (io/file 7)))
      (defrecord JioDst [path])
      (extend JioDst io/IOFactory
        (assoc io/default-streams-impl
               :make-output-stream (fn [x opts] (io/output-stream (:path x) :append (:append opts)))))
      (spit (->JioDst jio-e) "a")
      (spit (->JioDst jio-e) "b" :append true)
      (prn (slurp jio-e))
      (io/delete-file jio-e)
    expected: |
      ("one" "two")
      "one\ntwo"
      "Cannot open <#user.JioSrc{:s \"x\"}> as an OutputStream." "Cannot open <#user.JioSrc{:s \"y\"}> as an OutputStream."
      "a/b" nil true
      [:one "s"] [:two "s" 2] [:object 1]
      [:long 5] "7"
      "ab"
  - name: clojure-repl-doc-prints-a-definitions-metadata-like-the-oracle
    # The built-in clojure.repl (.kb/clojure-frontend.md "clojure.jar namespaces"): doc of a
    # defn, a defmacro, a defn without a docstring and a def with :doc metadata prints the
    # oracle's lines from the var's recorded metadata. Oracle-identical (clj 1.12.6,
    # 2026-10-09), on all four backends.
    source: |
      (ns repl-doc (:require [clojure.repl :refer [doc]]))
      (defn inc-one "Adds one." [x] (inc x))
      (defmacro first-arg "Answers its first argument." [a & more] a)
      (defn no-doc ([x] x) ([x y] y))
      (def ^{:doc "A documented value."} documented 1)
      (doc inc-one)
      (doc first-arg)
      (doc no-doc)
      (doc documented)
      (prn (with-out-str (doc inc-one)))
      (in-ns 'user)
    expected: |
      -------------------------
      repl-doc/inc-one
      ([x])
        Adds one.
      -------------------------
      repl-doc/first-arg
      ([a & more])
      Macro
        Answers its first argument.
      -------------------------
      repl-doc/no-doc
      ([x] [x y])
      -------------------------
      repl-doc/documented
        A documented value.
      "-------------------------\nrepl-doc/inc-one\n([x])\n  Adds one.\n"
  - name: clojure-repl-doc-of-a-special-form-and-a-core-var
    # A deviation: a special form's doc names it, Special Form and its clojure.org page,
    # without the forms and the text of the oracle's (clojure.jar's own words, not copied);
    # catch documents try, like the oracle's. A core var carries only :name and :ns here,
    # so doc of map prints its name alone where the oracle adds arglists and docstring.
    source: |
      (ns repl-special (:require [clojure.repl :refer [doc]]))
      (doc if)
      (doc catch)
      (doc new)
      (doc map)
      (in-ns 'user)
    expected: |
      -------------------------
      if
      Special Form

        Please see http://clojure.org/special_forms#if
      -------------------------
      try
      Special Form

        Please see http://clojure.org/special_forms#try
      -------------------------
      new
      Special Form

        Please see http://clojure.org/java_interop#new
      -------------------------
      clojure.core/map
  - name: clojure-repl-demunges-and-finds-the-root-cause
    # clojure.repl/demunge and root-cause, and clojure.main's, which clj -M has loaded before
    # the program, so a qualified name reaches it without a require. Oracle-identical
    # (clj 1.12.6, 2026-10-09), on all four backends.
    source: |
      (ns repl-trace (:require [clojure.repl :as r]))
      (prn (r/demunge "clojure.core$map$fn__123") (r/demunge "my_app.core$foo_bar_QMARK_") (r/demunge "x_PLUS__GT_y")
           (r/demunge "a$$b") (r/demunge "_PLUS_GT_") (r/demunge "user$_LT__EQ_") (r/demunge "a_SINGLEQUOTE__STAR_"))
      (def trace-inner (ex-info "boom" {:x 1}))
      (def trace-outer (Exception. "outer" (RuntimeException. "middle" trace-inner)))
      (prn (= trace-inner (r/root-cause trace-outer)) (ex-message (r/root-cause (Exception. "alone"))))
      (prn (clojure.main/demunge "a_b$c") (= trace-inner (clojure.main/root-cause trace-outer)))
      (in-ns 'user)
    expected: |
      "clojure.core/map/fn--123" "my-app.core/foo-bar?" "x+>y" "a//b" "+GT-" "user/<=" "a'*"
      true "alone"
      "a-b/c" true
  - name: clojure-repl-pst-prints-no-frames
    # A deviation: pst prints a throwable's simple class name, message and ex-data, the
    # reader-or-compiler note of a compile phase and each cause after Caused by:, but a
    # throwable carries no stack frames here, so none of the oracle's frame lines; with no
    # throwable and *e nil it prints nothing.
    source: |
      (ns repl-pst (:require [clojure.repl :as r]))
      (binding [*err* *out*]
        (r/pst (Exception. "outer" (RuntimeException. "middle" (ex-info "boom" {:x 1}))))
        (r/pst (ex-info "compile" {:clojure.error/phase :compilation}) 3)
        (r/pst))
      (prn (with-out-str (binding [*err* *out*] (r/pst (Exception.)))))
      (in-ns 'user)
    expected: |
      Exception outer
      Caused by:
      RuntimeException middle
      Caused by:
      ExceptionInfo boom {:x 1}
      Note: The following stack trace applies to the reader or compiler, your code was not executed.
      ExceptionInfo compile #:clojure.error{:phase :compilation}
      "Exception \n"
  - name: clojure-main-triages-throwable-data-like-the-oracle
    # clojure.main/ex-triage and ex-str over Throwable->map data of the compile, execution,
    # read and print phases (frames given in the data are read like the oracle's), the
    # prompt, repl-requires, with-read-known and repl-exception. Oracle-identical
    # (clj 1.12.6, 2026-10-09), on all four backends.
    source: |
      (ns main-triage (:require [clojure.main :as m]))
      (def compile-data
        {:via [{:type 'clojure.lang.Compiler$CompilerException :message "Syntax error compiling at (x.clj:3:1)."
                :data {:clojure.error/phase :compile-syntax-check :clojure.error/line 3 :clojure.error/column 1
                       :clojure.error/source "NO_SOURCE_PATH" :clojure.error/symbol 'foo}}
               {:type 'java.lang.RuntimeException :message "Unable to resolve symbol: y in this context"}]
         :trace [] :cause "Unable to resolve symbol: y in this context" :phase :compile-syntax-check})
      (prn (into (sorted-map) (m/ex-triage compile-data)))
      (print (m/ex-str (m/ex-triage compile-data)))
      (def execution-data
        {:via [{:type 'java.lang.ArithmeticException :message "Divide by zero"}]
         :trace '[[clojure.lang.Numbers divide "Numbers.java" 190] [user$eval1$fn__2 invoke "NO_SOURCE_FILE" 7]]
         :cause "Divide by zero"})
      (prn (into (sorted-map) (m/ex-triage execution-data)))
      (print (m/ex-str (m/ex-triage execution-data)))
      (def read-data
        {:via [{:type 'clojure.lang.ExceptionInfo :message "read"
                :data {:clojure.error/phase :read-source :clojure.error/source "/a/b/c.clj" :clojure.error/line 2
                       :clojure.error/column 5}}
               {:type 'java.lang.RuntimeException :message "EOF while reading"}]
         :trace [] :phase :read-source})
      (prn (into (sorted-map) (m/ex-triage read-data)))
      (print (m/ex-str (m/ex-triage read-data)))
      (print (m/ex-str {:clojure.error/phase :print-eval-result :clojure.error/symbol 'clojure.core/pr
                        :clojure.error/class 'java.lang.IllegalStateException :clojure.error/cause "bad"}))
      (print (m/ex-str {:clojure.error/phase :macroexpansion :clojure.error/class 'java.lang.Exception
                        :clojure.error/cause "m" :clojure.error/source "a.clj" :clojure.error/line 4 :clojure.error/column 2}))
      (prn (with-out-str (m/repl-prompt)))
      (prn m/repl-requires)
      (prn (m/with-read-known *read-eval*) (ex-message (m/repl-exception (Exception. "o" (ex-info "i" {})))))
      (in-ns 'user)
    expected: |
      #:clojure.error{:cause "Unable to resolve symbol: y in this context", :class java.lang.RuntimeException, :column 1, :line 3, :phase :compile-syntax-check, :symbol foo}
      Syntax error compiling foo at (REPL:3:1).
      Unable to resolve symbol: y in this context
      #:clojure.error{:cause "Divide by zero", :class java.lang.ArithmeticException, :line 7, :phase :execution, :symbol user/eval1$fn}
      Execution error (ArithmeticException) at user/eval1$fn (REPL:7).
      Divide by zero
      #:clojure.error{:cause "EOF while reading", :column 5, :line 2, :path "/a/b/c.clj", :phase :read-source, :source "c.clj"}
      Syntax error reading source at (/a/b/c.clj:2:5).
      EOF while reading
      Error printing return value (IllegalStateException) at clojure.core/pr (REPL:1).
      bad
      Unexpected error macroexpanding at (a.clj:4:2).
      m
      "main-triage=> "
      [[clojure.repl :refer (source apropos dir pst doc find-doc)] [clojure.java.javadoc :refer (javadoc)] [clojure.pprint :refer (pp pprint)] [clojure.repl.deps :refer (add-libs add-lib sync-deps)]]
      true "i"
  - name: clojure-main-reports-an-error-without-its-location
    # A deviation: a throwable here has no frames, so the triage of one names no symbol,
    # source or line, and err->msg and repl-caught report it at (REPL:1) where the oracle
    # names the function and the line that threw.
    source: |
      (ns main-report (:require [clojure.main :as m]))
      (print (m/err->msg (ex-info "boom" {:a 1})))
      (print (m/err->msg (IllegalStateException. "state" (Exception. "x"))))
      (binding [*err* *out*] (m/repl-caught (RuntimeException. "caught")))
      (prn (into (sorted-map) (m/ex-triage (Throwable->map (ex-info "boom" {})))))
      (in-ns 'user)
    expected: |
      Execution error (ExceptionInfo) at (REPL:1).
      boom
      Execution error at (REPL:1).
      x
      Execution error at (REPL:1).
      caught
      #:clojure.error{:cause "boom", :class clojure.lang.ExceptionInfo, :phase :execution}
  - name: clojure-xml-parses-a-document-like-the-oracle
    # The built-in clojure.xml reads the document itself on every target: the declaration
    # and its encoding, a byte order mark, line ends, the internal subset's entities (with
    # markup, in attributes too), CDATA, comments and processing instructions merged into
    # the text around them, references, attribute normalization, white-space-only text
    # dropped (Java's isWhitespace: a no-break space is kept), a File and an InputStream
    # alike; emit writes it back. Attributes print sorted: a map's walk order is the
    # backend's. On wasm the paths need a --dir preopen covering /tmp. Oracle-identical
    # (clj 1.12.6, 2026-10-09), on all four backends.
    source: |
      (ns xml-parse (:require [clojure.xml :as xml] [clojure.java.io :as io]))
      (def xml-file (str "/tmp/rontolisp-xml-" (rand-int 1000000000) "-" (rand-int 1000000000) ".xml"))
      (defn parsed [text] (spit xml-file text) (xml/parse xml-file))
      (defn shape [e]
        (if (string? e) e [(xml/tag e) (some-> (xml/attrs e) sort) (some->> (xml/content e) (mapv shape))]))
      (prn (shape (parsed (str "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE note [\n  <!ENTITY who \"World\">\n]>\n"
                               "<!-- a comment -->\n<note id=\"n1\" lang='en' xmlns:x=\"urn:x\">\n  <to>Tove &amp; &who;</to>\n"
                               "  <x:from a=\"1\" b=\"2\">Jani</x:from>\n"
                               "  <body>\n    Don't <b>forget</b> me &lt;this&gt;! &#65;&#x42;<![CDATA[<raw> & stuff]]>tail\n  </body>\n"
                               "  <empty/><empty2></empty2><ws>   </ws><?pi something?>\n"
                               "  <mixed>a<!-- c -->b<?p q?>c</mixed>\n  <attrs t=\"a&#9;b&#10;c\nd\" q=\"&quot;&apos;&lt;\"/>\n</note>\n"))))
      (prn (shape (parsed "<a>x\r\ny\rz</a>")) (shape (parsed "<a> </a>")) (shape (parsed "<a>&#32;\t</a>")))
      (prn (shape (parsed "<?xml version='1.0' encoding='latin1'?><a>é</a>")) (shape (parsed "<a>éあ</a>"))
           (shape (parsed "﻿<a/>")))
      (prn (shape (parsed "<!DOCTYPE a [<!ENTITY y 'x<b>y</b>z'>]><a>[&y;]</a>"))
           (shape (parsed "<!DOCTYPE a [<!ENTITY y \"&#60;b/>\">]><a>&y;</a>"))
           (shape (parsed "<!DOCTYPE a [<!ENTITY y 'a&#13;b'>]><a x='&y;'>&y;</a>")))
      (def note (parsed "<note to=\"Tove\"><body>Hi</body><empty/></note>"))
      (prn (= note (xml/parse (io/file xml-file)) (with-open [in (io/input-stream xml-file)] (xml/parse in))))
      (prn (xml/tag note) (xml/attrs note) (count (xml/content note)))
      (xml/emit note)
      (xml/emit-element "text")
      (xml/emit-element {:tag :a :attrs {:x "1"} :content ["t" {:tag :b}]})
      (io/delete-file xml-file)
      (in-ns 'user)
    expected: |
