      (:refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused)
      (:refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused :refused)
  - name: unchecked-arithmetic-verbs-wrap-at-long-and-int-width
    # Oracle-identical (clj 1.12.6) for every integer a long holds: the long verbs wrap at 64 bits,
    # the -int verbs cast their arguments to int (a double or ratio truncates, one past the int range
    # signals) and wrap at 32. Deviation, not pinned here: an integer past 64 bits is a plain integer
    # here, where the oracle keeps a bigint literal unwrapped (see unchecked-add in deviations.md).
    # The refusal texts are ours (only that it signals is pinned).
    source: |
      (defn uv-refused [f] (try (f) :no (catch Exception e :refused)))
      (prn (unchecked-add 9223372036854775807 1) (unchecked-add -9223372036854775808 -1) (unchecked-add 1 2) (unchecked-add 1.5 2) (unchecked-add 1/2 1) (unchecked-add 1.5 1/2) (unchecked-add ##Inf 1) (unchecked-add 4611686018427387904 4611686018427387904))
      (prn (unchecked-subtract -9223372036854775808 1) (unchecked-subtract 9223372036854775807 -1) (unchecked-subtract 3 1) (unchecked-subtract 1.5 1) (unchecked-subtract 1/2 1))
      (prn (unchecked-multiply 9223372036854775807 2) (unchecked-multiply 4611686018427387904 4) (unchecked-multiply 3 4) (unchecked-multiply 1.5 2) (unchecked-multiply 3037000500 3037000500) (unchecked-multiply -9223372036854775808 -1))
      (prn (unchecked-inc 9223372036854775807) (unchecked-inc 1) (unchecked-inc 1.5) (unchecked-inc 1/2) (unchecked-dec -9223372036854775808) (unchecked-dec 1) (unchecked-dec 1.5) (unchecked-dec 1/2))
      (prn (unchecked-negate -9223372036854775808) (unchecked-negate 5) (unchecked-negate 1.5) (unchecked-negate 1/2) (unchecked-negate 0) (unchecked-negate -0.0) (unchecked-negate -5))
      (prn (unchecked-add-int 2147483647 1) (unchecked-add-int 1 2) (unchecked-add-int 1.5 1) (unchecked-add-int 1/2 1) (unchecked-add-int -2147483648 -1) (unchecked-add-int 2147483647 2147483647))
      (prn (unchecked-subtract-int -2147483648 1) (unchecked-subtract-int 5 3) (unchecked-subtract-int 2147483647 -1) (unchecked-subtract-int 7.9 2.9))
      (prn (unchecked-multiply-int 65536 65536) (unchecked-multiply-int 46341 46341) (unchecked-multiply-int 3 4) (unchecked-multiply-int -2147483648 -1) (unchecked-multiply-int 2.9 3.9))
      (prn (unchecked-negate-int -2147483648) (unchecked-negate-int 5) (unchecked-negate-int 0) (unchecked-negate-int 2.9) (unchecked-inc-int 2147483647) (unchecked-inc-int 1) (unchecked-dec-int -2147483648) (unchecked-dec-int 1))
