  - name: a-collection-type-conjs-empties-counts-and-compares-through-its-methods
    # clojure.lang.IPersistentCollection in a deftype body (.kb/clojure-frontend.md
    # "Collection interfaces"): conj and into reach its cons, empty its empty, = its equiv
    # on either side (a vector on the left reads it as no sequential, nil and the value
    # itself never ask); count of one that is no Counted walks its seq, like the oracle's
    # countFrom. Every line is the oracle's (clj 1.12.6), on all four backends.
    source: |
      (ns iface-coll)
      (def log (atom []))
      (defn note [& xs] (swap! log conj (vec xs)))
      (defn calls [] (let [l @log] (reset! log []) l))
      (deftype BagT [xs]
        clojure.lang.IPersistentCollection
        (cons [_ x] (note :cons x) (BagT. (conj xs x)))
        (empty [_] (note :empty) (BagT. []))
        (equiv [_ o] (note :equiv) (= xs o))
        (count [_] (note :count) 99)
        (seq [_] (seq xs)))
      (prn (.-xs (conj (BagT. [1]) 2 3)) (calls) (.-xs (into (BagT. []) [4 5])) (calls) (.-xs (empty (BagT. [1]))) (calls))
      (prn (count (BagT. [1 2 3])) (calls) (counted? (BagT. [])) (coll? (BagT. [])) (sequential? (BagT. [])) (seq (BagT. [7 8])) (first (BagT. [7 8])) (reduce + (BagT. [1 2 3])))
      (prn (= (BagT. [1 2]) [1 2]) (calls) (= :k (BagT. [])) (calls) (= [1 2] (BagT. [1 2])) (calls) (= nil (BagT. [])) (let [b (BagT. [])] (= b b)) (calls))
      (prn (instance? clojure.lang.IPersistentCollection (BagT. [])) (instance? clojure.lang.Seqable (BagT. [])) (map? (BagT. [])) (vector? (BagT. [])))
      (in-ns 'user)
    expected: |
      [1 2 3] [[:cons 2] [:cons 3]] [4 5] [[:cons 4] [:cons 5]] [] [[:empty]]
      3 [] false true false (7 8) 7 6
      true [[:equiv]] false [[:equiv]] false [] false true []
      true true false false
  - name: a-map-type-assocs-dissocs-reads-and-prints-as-a-map
    # clojure.lang.IPersistentMap in a deftype body (.kb/clojure-frontend.md "Collection
    # interfaces"): assoc, update and merge reach its assoc and cons, dissoc its without,
    # get and a keyword's call its valAt, contains? its containsKey, find and select-keys
    # its entryAt; map? is true and it prints as a map over its seq; reduce, into and
    # reduce-kv step its iterator (an IPersistentMap is an Iterable), like the oracle; a
    # map on the left of = is no java.util.Map's. A java.util.Map body answers get,
    # count, contains?, find, seq and = through its get, size, containsKey and entrySet.
    # Every line is the oracle's (clj 1.12.6), on all four backends.
    source: |
      (ns iface-map)
      (def log (atom []))
      (defn note [& xs] (swap! log conj (vec xs)))
      (defn calls [] (let [l @log] (reset! log []) l))
      (deftype MapT [m]
        clojure.lang.IPersistentMap
        (count [_] (count m))
        (cons [_ x] (note :cons x) (MapT. (conj m x)))
        (empty [_] (MapT. {}))
        (equiv [_ o] (= m o))
        (seq [_] (seq m))
        (valAt [_ k] (note :valAt k) (get m k))
        (valAt [_ k nf] (note :valAt k nf) (get m k nf))
        (containsKey [_ k] (note :containsKey k) (contains? m k))
        (entryAt [_ k] (note :entryAt k) (find m k))
        (assoc [_ k v] (note :assoc k v) (MapT. (assoc m k v)))
        (assocEx [_ k v] (MapT. (assoc m k v)))
        (without [_ k] (note :without k) (MapT. (dissoc m k)))
        (iterator [_] (note :iterator) (.iterator m)))
      (def mm (MapT. {:a 1}))
      (prn (.-m (assoc mm :b 2)) (calls) (.-m (dissoc mm :a)) (calls) (get mm :a) (get mm :z :nf) (:a mm) (calls))
      (prn (contains? mm :a) (find mm :a) (calls) (.-m (update mm :a inc)) (calls) (select-keys mm [:a]) (calls))
      (prn (count mm) (keys mm) (vals mm) (map? mm) (associative? mm) (counted? mm) (empty? mm) mm [mm])
      (println mm)
      (prn (reduce (fn [a [k v]] (+ a v)) 10 mm) (calls) (into {} mm) (calls) (reduce-kv (fn [a k v] (conj a k v)) [] mm) (calls))
      (prn (.-m (merge mm {:c 3})) (calls) (merge {:c 3} (MapT. {})) (= mm {:a 1}) (= {:a 1} mm) (let [{:keys [a]} mm] a) (calls))
      (deftype JMapT [m] java.util.Map (size [_] (count m)) (containsKey [_ k] (contains? m k)) (get [_ k] (get m k)) (entrySet [_] (set m)))
      (def jm (JMapT. {:a 1}))
      (prn (get jm :a) (get jm :z :nf) (:a jm) (count jm) (contains? jm :a) (find jm :a) (seq jm) (map? jm) (keys jm) (= {:a 1} jm) (= jm {:a 1}) jm)
      (in-ns 'user)
    expected: |
