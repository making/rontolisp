                   (valAt [_ k] [:two k])
                   (valAt [_ k nf] [:three k nf])))
      (prn (get arity :a) (get arity :a :d) (:b arity) (:b arity :d) ('c arity) (get-in {:u arity} [:u :e]))
      (prn (let [{:keys [x]} arity] x) (let [{y :y :or {y :dy}} arity] y) (map? arity) (instance? clojure.lang.ILookup arity))
      (prn (try (get (reify clojure.lang.ILookup (valAt [_ k] k)) :k :d) (catch AbstractMethodError e :abstract)))
      (in-ns 'user)
    expected: |
