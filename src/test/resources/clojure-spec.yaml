  - name: auto-resolved-keywords-use-the-file-ns
    # ::kw resolves against the file's ns name, ::alias/kw against the alias;
    # :a/b stays opaque. The corpus shapes: interest-rate/account-level over :tag,
    # service-charge2 vector pairs, derive plus service-charge3 over the parent.
    source: |
      (ns auto (:require [clojure.string :as str]))
      (println ::checking)
      (println ::str/join)
      (println (name ::str/join))
      (println (namespace ::str/join))
      (println (= ::checking :auto/checking))
      (println (::checking {:auto/checking 7}))
      (println (::missing {:auto/checking 7} :dflt))
      (defmulti rate :tag)
      (defmethod rate ::checking [_] 0)
      (defmethod rate ::savings [_] 5)
      (println (rate {:tag ::checking}))
      (println (rate {:tag ::savings}))
      (derive ::savings ::account)
      (derive ::checking ::account)
      (println (isa? ::savings ::account))
      (println (parents ::savings))
      (defmulti level :tag)
      (defmethod level ::checking [a] (if (>= (:balance a) 5000) ::premium ::basic))
      (defmethod level ::savings [a] (if (>= (:balance a) 1000) ::premium ::basic))
      (defmulti charge (fn [a] [(level a) (:tag a)]))
      (defmethod charge [::basic ::checking] [_] 25)
      (defmethod charge [::basic ::savings] [_] 10)
      (defmethod charge [::premium ::account] [_] 0)
      (println (charge {:tag ::checking :balance 100}))
      (println (charge {:tag ::savings :balance 100}))
      (println (charge {:tag ::checking :balance 9000}))
      (println (charge {:tag ::savings :balance 9000}))
    expected: |
      :auto/checking
      :clojure.string/join
      join
      clojure.string
      true
      7
      :dflt
      0
      5
      true
      #{:auto/account}
      25
      10
      0
      0
  - name: class-dispatch-maps-host-spellings-to-kind-keywords
    # A defmethod over class names stores under the keyword class answers
    # (Long/Double merge into :number, like every numeric spelling); dotted and
    # clojure.lang names resolve first. nil answers both the :nil keyword and the
    # identity nil; Object catches past the search but ahead of the default; the
    # pi.clj run-simulation shape dispatches [Map Number] pairs element-wise.
    source: |
      (defmulti print-mm class)
      (defmethod print-mm String [s] (str "str:" s))
      (defmethod print-mm Number [n] (str "num:" n))
      (defmethod print-mm nil [_] "was-nil")
      (defmethod print-mm :default [x] "dflt")
      (println (print-mm "a"))
      (println (print-mm 1))
      (println (print-mm 1.5))
      (println (print-mm nil))
      (println (print-mm :k))
      (println (print-mm [1 2]))
      (defmethod print-mm java.util.Map [m] "map!")
      (println (print-mm {:a 1}))
      (defmethod print-mm clojure.lang.IPersistentVector [v] "vec!")
      (println (print-mm [1 2]))
      (defmethod print-mm java.util.Collection [c] "coll!")
      (println (print-mm (list 1)))
      (prefer-method print-mm clojure.lang.IPersistentVector java.util.Collection)
      (println (print-mm [1 2]))
      (defmulti id-nil-mm identity)
      (defmethod id-nil-mm nil [_] "was-nil")
      (defmethod id-nil-mm :default [x] "dflt")
      (println (id-nil-mm nil))
      (println (id-nil-mm 1))
      (println ((get-method id-nil-mm nil) nil))
      (remove-method id-nil-mm nil)
      (println (id-nil-mm nil))
      (defmulti obj class :default :dflt)
      (defmethod obj Object [x] "obj!")
      (defmethod obj :dflt [x] "d!")
      (println (obj "a"))
      (println (obj :k))
      (defmulti sim (fn [& args] (into [] (map class args))))
      (defmethod sim [Number] [n] (str "n:" n))
      (defmethod sim [java.util.Map] [m] "m")
      (defmethod sim [java.util.Map Number] [m n] "mn")
      (println (sim 5))
      (println (sim {:a 1}))
      (println (sim {:a 1} 2))
      (println (try (sim [1] 2) (catch Exception e "miss")))
    expected: |
      str:a
      num:1
      num:1.5
      was-nil
      dflt
      dflt
      map!
      vec!
      coll!
      vec!
      was-nil
      dflt
      was-nil
      dflt
      obj!
      obj!
      n:5
      m
      mn
      miss
  - name: nil-method-stays-distinct-from-nil-keyword
    # A nil method answers a true nil dispatch value only: identity dispatch on
    # a literal :nil keyword falls past it to the :nil method or the default,
    # while a bare class dispatch still answers the nil method for nil (and the
    # default for :nil, whose class is Keyword). Oracle: clj 1.12.6.1673.
    source: |
      (defmulti id-mm identity)
      (defmethod id-mm nil [_] "was-nil")
      (defmethod id-mm :default [x] "dflt")
      (println (id-mm nil))
      (println (id-mm :nil))
      (defmulti both identity)
      (defmethod both nil [_] "was-nil")
      (defmethod both :nil [_] "was-kw")
      (defmethod both :default [x] "dflt")
      (println (both nil))
      (println (both :nil))
      (println (both :other))
      (defmulti by-class class)
      (defmethod by-class nil [_] "was-nil")
      (defmethod by-class :default [x] "dflt")
      (println (by-class nil))
      (println (by-class :nil))
      (println ((get-method both nil) nil))
      (println ((get-method both :nil) :nil))
    expected: |
      was-nil
      dflt
      was-nil
      was-kw
      dflt
      was-nil
      dflt
      was-nil
      was-kw
  - name: wrapped-class-dispatch-still-hits-the-nil-method
    # A `class` call wrapped in another function answers nil itself for nil (like
    # the bare dispatch and the oracle), so the nil method answers it while a
    # literal `:nil` (whose class is Keyword) falls to the default. An explicit
    # `:nil` out of a class-wrapped dispatch keeps its keyword row. Oracle: clj
    # 1.12.6.1673.
    source: |
      (defmulti inline-class-mm (fn [x] (class x)))
      (defmethod inline-class-mm nil [_] "was-nil")
      (defmethod inline-class-mm :default [x] "dflt")
      (println (inline-class-mm nil))
      (println (inline-class-mm :nil))
      (defmulti inline-kw-mm (fn [x] (if (= x :foo) :nil (class x))))
      (defmethod inline-kw-mm nil [_] "was-nil")
      (defmethod inline-kw-mm :nil [_] "was-kw")
      (defmethod inline-kw-mm :default [x] "dflt")
      (println (inline-kw-mm nil))
      (println (inline-kw-mm :foo))
      (println (inline-kw-mm :nil))
      (println (inline-kw-mm "a"))
    expected: |
      was-nil
      dflt
      was-nil
      was-kw
      dflt
      dflt
  - name: named-class-dispatch-hits-the-nil-method
    # A dispatch through a NAMED class-calling function answers the nil method
    # for nil: the defmulti re-lowers the recorded definition with the dispatch
    # lowering, so a defn name and a def'd fn value behave like the inline
    # datum, while :nil (whose class is Keyword) still falls to the default, a
    # direct call to the definition keeps answering :nil, and an explicit :nil
    # out of a named dispatch keeps its keyword row. Oracle: clj 1.12.6.1673.
    source: |
      (defn class-fn [x] (class x))
      (defmulti named-class-mm class-fn)
      (defmethod named-class-mm nil [_] "was-nil")
      (defmethod named-class-mm :default [x] "dflt")
      (println (named-class-mm nil))
      (println (named-class-mm :nil))
      (println (class-fn nil))
      (def class-value (fn [x] (class x)))
      (defmulti value-class-mm class-value)
      (defmethod value-class-mm nil [_] "was-nil")
      (defmethod value-class-mm :default [x] "dflt")
      (println (value-class-mm nil))
      (println (value-class-mm :nil))
      (defn kw-class-fn [x] (if (= x :foo) :nil (class x)))
      (defmulti kw-class-mm kw-class-fn)
      (defmethod kw-class-mm nil [_] "was-nil")
      (defmethod kw-class-mm :nil [_] "was-kw")
      (defmethod kw-class-mm :default [x] "dflt")
      (println (kw-class-mm nil))
      (println (kw-class-mm :foo))
      (println (kw-class-mm :nil))
      (println (kw-class-mm "a"))
    expected: |
      was-nil
      dflt
      :nil
      was-nil
      dflt
      was-nil
      was-kw
      dflt
      dflt
  - name: indirect-named-class-dispatch-hits-the-nil-method
    # A call to a named class-calling function nested inside an inline dispatch
