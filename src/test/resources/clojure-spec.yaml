    expected: |
      :b
      :a
      :a
      :a/b
      :a/b
      :a/b
      nil
      nil
      :b
      (:x :y)
      :a/b
      true
  - name: symbol-builds-mangled-names
    # symbol answers itself for a symbol and the spelled symbol (mangled behind
    # the prefix, so it prints and compares whole) for a keyword or a string; a
    # nil namespace is the one-argument shape; anything else signals.
    source: |
      (println (symbol "b"))
      (println (symbol 'a))
      (println (symbol :a/b))
      (println (symbol "a" "b"))
      (println (symbol nil "b"))
      (println (= (symbol "a") 'a))
      (println (name (symbol "a" "b")))
      (println (namespace (symbol "a" "b")))
      (println (map symbol ["x" "y"]))
      (println (apply symbol ["a" "b"]))
      (println (try (symbol 1) (catch Exception e :refused)))
    expected: |
      b
      a
      a/b
      a/b
      b
      true
      b
      a
      (x y)
      a/b
      :refused
  - name: assert-answers-nil-and-throws-lazily
    # assert answers nil when the test is truthy and signals otherwise; the
    # message form sits in the else branch, so it never evaluates on success.
    source: |
      (println (assert (= 1 1)))
      (println (assert (= 1 1) "msg"))
      (let [b18-evaluated (atom false)] (assert true (do (reset! b18-evaluated true) "x")) (println @b18-evaluated))
      (println (try (assert (= 1 2)) (catch Exception e :failed)))
      (println (try (assert (= 1 2) "oops") (catch Exception e (ex-message e))))
      (println (try (assert false (str "m" "sg")) (catch Exception e :failed-with-msg)))
    expected: |
      nil
      nil
      false
      :failed
      Assert failed: oops
      :failed-with-msg
  - name: rand-draws-scaled-doubles
    # rand answers a double in [0,1) bare, one scaled draw with a bound (never a
    # domain check: a negative bound answers a negative double, like the oracle's
    # multiply); only predicates pin, never values.
    source: |
      (println (let [b18-r (rand)] (and (<= 0.0 b18-r) (< b18-r 1.0))))
      (println (let [b18-r (rand 5)] (and (<= 0.0 b18-r) (< b18-r 5))))
      (println (let [b18-r (rand -5)] (and (< -5.0 b18-r) (<= b18-r 0.0))))
      (println (let [b18-r ((fn [b18-f] (b18-f)) rand)] (and (<= 0.0 b18-r) (< b18-r 1.0))))
      (println (every? (fn [b18-r] (and (<= 0.0 b18-r) (< b18-r 5))) (map rand [5 5 5])))
    expected: |
      true
      true
      true
      true
      true
  - name: rand-int-draws-below-the-bound
    # rand-int truncates one scaled draw (an int in [0,n) for a positive bound; 0
    # and negative bounds answer without a domain check, like the oracle's
    # int-of-rand); shapes pin, values never do, except the forced zeros.
    source: |
      (println (contains? #{0 1 2 3 4} (rand-int 5)))
      (println (rand-int 1))
      (println (rand-int 0))
      (println (let [b18-r (rand-int -5)] (and (< -5 b18-r) (<= b18-r 0))))
      (println (map rand-int [1 1]))
    expected: |
      true
      0
      0
      true
      (0 0)
  - name: rand-nth-draws-a-member
    # rand-nth indexes the realized list by one scaled draw: nil (and the empty
    # list, by the seq-view past-the-end rule our nth keeps) answers nil; an
    # empty vector signals, like the oracle's throw; maps and sets signal too
    # (none are indexed there). The hangman players shape pins membership.
    source: |
      (println (contains? #{:a :b} (rand-nth [:a :b])))
      (println (rand-nth [:only]))
      (println (rand-nth nil))
      (println (try (rand-nth []) (catch Exception e :signalled)))
      (println (try (rand-nth '()) (catch Exception e :signalled)))
      (println ((fn [b18-f] (contains? #{1 2} (b18-f [1 2]))) rand-nth))
      (println (try (rand-nth #{:a}) (catch Exception e :signalled)))
    expected: |
      true
      :only
      nil
      :signalled
      nil
      true
      :signalled
  - name: shuffle-draws-permutations
    # shuffle Fisher-Yates over a fresh vector (membership and count pin, never
    # order); nil, strings and maps signal, like the oracle.
    source: |
      (println (let [b18-s (shuffle [1 2 3])] [(= (set b18-s) #{1 2 3}) (= (count b18-s) 3) (vector? b18-s)]))
      (println (shuffle []))
      (println (shuffle [1]))
      (println (let [b18-s ((fn [b18-f] (b18-f [1 2])) shuffle)] [(= (set b18-s) #{1 2}) (vector? b18-s)]))
      (println (try (shuffle nil) (catch Exception e :refused)))
      (println (try (shuffle "ab") (catch Exception e :refused)))
      (println (try (shuffle {:a 1}) (catch Exception e :refused)))
    expected: |
      [true true true]
      []
      [1]
      [true true]
      :refused
      :refused
      :refused
  - name: bare-require-accepts-quoted-libspecs
    # Bare require/use spell their libspecs quoted (the oracle's spelling):
    # (quote [ns :as alias :refer [vars]]) and 'spec both wire like the ns
    # clause does -- the life_without_multi.clj/sequences.clj shape. An unquoted
    # vector stays accepted too (a lenient superset: the oracle rejects it with
    # a ClassNotFoundException). use refers the names the same way.
    source: |
      (require '[clojure.string :as qs :refer [join]])
      (println (qs/join "," ["a" "b"]))
      (println (join "-" ["x" "y"]))
      (require (quote [clojure.string :as qs2]))
      (println (qs2/upper-case "hi"))
      (require '[clojure.string])
      (println (clojure.string/lower-case "HI"))
      (use '[clojure.string :only [capitalize]])
      (println (capitalize "hello"))
    expected: |
      a,b
      x-y
      HI
      hi
      Hello
  - name: bare-require-accepts-prefix-lists
    # Prefix lists wire each member under the prefix on the shared requireSpecs
    # path: '(prefix [sub :as alias]/[sub :refer [vars]]/bare) quoted (the
    # oracle's spelling) or bare (the unquoted-vector leniency extended); use
    # refers through the same path.
    source: |
      (require '(clojure [string :as ps :refer [join]]))
      (println (ps/join "," ["a" "b"]))
      (println (join "-" ["x" "y"]))
      (require '(clojure string))
      (println (clojure.string/upper-case "HI"))
      (use '(clojure [string :only [capitalize]]))
      (println (capitalize "hello"))
    expected: |
      a,b
      x-y
      HI
      Hello
  - name: use-only-and-exclude-narrow
    # use :only narrows the referred set (winning over the refer-all default)
    # and :exclude subtracts from it -- and from :refer :all -- like the oracle
    # (clj 1.12.6.1673). Absence stays a lowering refusal ("unknown name",
    # pinned in ClojureLoweringTest); here the narrowed wirings run on all
    # four backends. upper-case/split-lines are first bare-referred here.
    source: |
      (use '[clojure.string :only [upper-case join] :exclude [join]])
      (println (upper-case "hi"))
      (require '[clojure.string :refer :all :exclude [join]])
      (println (split-lines "a\nb"))
    expected: |
      HI
      (a b)
  - name: vec-coerces-every-collection-to-a-vector
    # vec is the vector-over-seq-view coercion: lists pass through member by
    # member, strings become character vectors, maps contribute one two-vector
    # per entry, sets one member per element, nil is []. Lazy inputs realize
    # fully (an infinite input hangs, like the oracle's). class pins the vector
    # answer (:vector here; the oracle names its own class).
    source: |
      (println (vec '(1 2)))
      (println (vec [1 2 3]))
      (println (vec "ab"))
      (println (vec nil))
      (println (vec #{1}))
      (println (vec {:a 1}))
      (println (count (vec #{1 2 3})))
      (println (vec (map inc [1 2])))
      (println (vec (concat (lazy-seq [1]) [2])))
      (println (class (vec '(1))))
      (println (map vec (list '(1 2) [3])))
    expected: |
      [1 2]
      [1 2 3]
      [a b]
      []
      [1]
      [[:a 1]]
      3
      [2 3]
      [1 2]
      :vector
      ([1 2] [3])
  - name: assoc-and-dissoc-answer-values
    # assoc as a value grows one copy from the rest pairs (later pairs winning,
    # onto nil from empty); an odd rest count signals at run time. dissoc as a
    # value drops each rest key (of nil, nil).
    source: |
      (println (get ((fn [b23-f] (b23-f {:a 1} :b 2 :c 3)) assoc) :c))
      (println (map #(get % :b) (map assoc [{:a 1} {:x 0}] [:b :b] [2 3])))
      (println (get ((fn [b23-f] (b23-f nil :a 1)) assoc) :a))
      (println (try ((fn [b23-f] (b23-f {:a 1} :b)) assoc) (catch Exception e :signalled)))
      (println (map dissoc [{:a 1 :b 2} {:x 1}] [:a :x]))
      (println ((fn [b23-f] (b23-f {:a 1 :b 2} :a :b)) dissoc))
      (println ((fn [b23-f] (b23-f nil :a)) dissoc))
    expected: |
      3
      (2 3)
      1
      :signalled
      ({:b 2} {})
      {}
      nil
  - name: get-and-contains-answer-values
    # get as a value is the two- or three-argument read (the default threading
    # through); any other count signals at run time. contains? as a value is the
    # same sentinel presence test, answering T-or-false.
    source: |
      (println (map get [{:a 1} {:b 2}] [:a :b]))
      (println (map get [{:a 1}] [:b] [:d]))
      (println ((fn [b23-f] (b23-f {:a 1} :b :dflt)) get))
      (println ((fn [b23-f] (b23-f [10 20] 5 :d)) get))
      (println (map contains? [{:a 1} #{1}] [:a 1]))
      (println ((fn [b23-f] (b23-f [1 2] 5)) contains?))
      (println (try ((fn [b23-f] (b23-f {:a 1} :a :x :y)) get) (catch Exception e :signalled)))
    expected: |
      (1 2)
      (:d)
      :dflt
      :d
      (true true)
      false
      :signalled
  - name: merge-conj-and-disj-answer-values
    # merge as a value appends every rest map's pairs in one copy (of none,
    # nil); conj as a value folds the rest items through the same per-kind
    # read, so alter/swap! over conj run what a call would run (the chat.clj
    # and introduction.clj shapes); disj as a value drops each rest member
    # (of nil, nil).
    source: |
      (println (map #(get % :b) (map merge [{:a 1} nil] [{:b 2} {:c 3}])))
      (println (count ((fn [b23-f] (b23-f {:a 1} {:b 2} {:c 3})) merge)))
      (println ((fn [b23-f] (b23-f)) merge))
      (println (map conj [[1] [2]] [3]))
      (println ((fn [b23-f] (b23-f [1] 2 3)) conj))
      (println (get ((fn [b23-f] (b23-f {:a 1} [:b 2])) conj) :b))
      (println (map disj [#{1 2} #{3}] [1 3]))
      (println ((fn [b23-f] (b23-f #{1 2} 1 2)) disj))
      (println (let [b23-a (atom [1])] (swap! b23-a conj 2) @b23-a))
      (println (dosync (let [b23-r (ref [1])] (alter b23-r conj 2) (commute b23-r conj 3) @b23-r)))
    expected: |
      (2 nil)
      3
      nil
      ([1 3])
      [1 2 3]
      2
      (#{2} #{})
      #{}
      [1 2]
      [1 2 3]
  - name: set-and-map-constructors-answer-values
    # set as a value builds the member table over one collection; hash-map and
    # array-map as values build one table from the rest pairs (an odd rest count
    # signals at run time, like a call's pair refusal).
    source: |
      (println (map set [[1]]))
      (println (map count (map set [[1 1 2] nil])))
      (println (get ((fn [b23-f] (b23-f :a 1)) hash-map) :a))
      (println (get ((fn [b23-f] (b23-f :a 1)) array-map) :a))
      (println (count ((fn [b23-f] (b23-f)) hash-map)))
      (println (try ((fn [b23-f] (b23-f :a)) hash-map) (catch Exception e :signalled)))
      (println (get ((fn [b23-f] (apply b23-f [:a 1 :b 2])) hash-map) :b))
    expected: |
      (#{1})
      (2 0)
      1
      1
      0
      :signalled
      2
  - name: corpus-pins-over-vec-and-conj-values
    # The shcloj4 shapes the gaps blocked: eager.clj squares-seq (vec over a
    # mapped range), hangman available-words (vec over a filtered word list),
    # snake add-points (vec over an applied map), chat add-message (alter and
    # commute over conj, dereferenced back).
    source: |
      (defn b23-square [x] (* x x))
      (defn b23-squares-seq [n] (vec (map b23-square (range n))))
      (println (b23-squares-seq 4))
      (println (vec (filter (fn [b23-w] (not (contains? #{\a} (first b23-w)))) ["apple" "avocado" "berry"])))
      (println (vec (apply map + [[1 2] [10 20]])))
      (println (dosync (let [b23-msgs (ref [])] (alter b23-msgs conj "hi") (commute b23-msgs conj "yo") @b23-msgs)))
    expected: |
      [0 1 4 9]
      [berry]
      [11 22]
      [hi yo]
