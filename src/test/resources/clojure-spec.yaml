  - name: ex-info-carries-data-through-throw
    # ex-info builds a condition with message and data slots (its report prints
    # the message); throw signals an ex-info value as its own condition, anything
    # else as a ClassCastException whose message is its Clojure-notation
    # rendering; ex-data answers the map (nil for any other condition) and
    # ex-message the message. Each works as a function value.
    source: |
      (println (try (throw (ex-info "boom" {:code 42})) (catch Exception e (get (ex-data e) :code))))
      (println (try (throw (ex-info "boom" {:code 42})) (catch Exception e (ex-message e))))
      (println (try (throw "plain") (catch Exception e (ex-data e))))
      (println (try (throw "plain") (catch Exception e (str "got-" e))))
      (println (map ex-data [(ex-info "m" 1) "nope"]))
      (println (map ex-message [(ex-info "m" 1) "nope"]))
      (println (ex-data (apply ex-info ["v" 2])))
    expected: |
      42
      boom
      nil
      got-java.lang.ClassCastException: plain
      (1 nil)
      (m nil)
      2
  - name: get-message-reads-a-caught-runtime-error
    # Oracle-identical (clj 1.12.6, 2026-10-03): a caught runtime error is a
    # condition, and .getMessage/.getLocalizedMessage answer its message like
    # ex-message; .toString and str answer an exception's toString.
    source: |
      (println (try (assoc [0 1] :a :x) (catch Exception e (.getMessage e))))
      (println (try (assoc [0 1] :a :x) (catch Exception e (.getLocalizedMessage e))))
      (println (try (throw (ex-info "boom" {})) (catch Exception e (. e getMessage))))
      (println (map #(.getMessage %) [(ex-info "a" {}) (ex-info "b" {})]))
      (prn (str (ex-info "x" {:a 1})) (.toString (ex-info "y" {})))
      (prn (ex-cause (ex-info "a" {})) (.getCause (ex-info "a" {})))
    expected: |
      Key must be integer
      Key must be integer
      boom
      (a b)
      "clojure.lang.ExceptionInfo: x {:a 1}" "clojure.lang.ExceptionInfo: y {}"
      nil nil
  - name: throwable-constructions-are-exceptions-on-every-backend
    # Oracle-identical (clj 1.12.6, 2026-10-03): a java.lang throwable built with
    # a message, a cause or both is an exception ex-message, ex-data, ex-cause,
    # .getMessage, .getCause, str and throw read the oracle's way.
    source: |
      (prn (ex-message (Exception. "boo")) (ex-data (Exception. "boo")) (.getMessage (Exception.)))
      (prn (try (throw (Exception. "boo")) (catch Exception e (ex-message e))))
      (prn (try (throw (IllegalArgumentException. "bad arg")) (catch IllegalArgumentException e (.getMessage e))))
      (prn (str (Exception. "boo")) (str (Exception.)) (.toString (RuntimeException. "r")))
      (prn (.getMessage (Exception. (IllegalStateException. "inner"))))
      (prn (ex-message (ex-cause (Exception. "outer" (IllegalStateException. "inner")))))
      (prn (ex-message (.getCause (new RuntimeException "o" (Exception. "i")))))
      (prn (ex-message (ex-cause (ex-info "a" {} (Exception. "c")))) (ex-data (ex-info "x" nil)))
      (prn (map ex-cause [(Exception. "x") "s" nil]))
      (prn (.getMessage (Throwable. "th")) (ex-message (Error. "er")) (str (ArithmeticException. "ar")))
      (prn (try (throw (try (throw (Exception. "inner")) (catch Exception e e))) (catch Exception f (str f))))
      (prn (try (Exception. 5) (catch Exception e (ex-message e))))
    expected: |
      "boo" nil nil
      "boo"
      "bad arg"
      "java.lang.Exception: boo" "java.lang.Exception" "java.lang.RuntimeException: r"
      "java.lang.IllegalStateException: inner"
      "inner"
      "i"
      "c" {}
      (nil nil nil)
      "th" "er" "java.lang.ArithmeticException: ar"
      "java.lang.Exception: inner"
      "No matching ctor found for class java.lang.Exception"
  - name: catch-takes-an-exception-of-its-class-or-a-subclass
    # Oracle-identical (clj 1.12.6, 2026-10-03): a catch clause takes an
    # exception whose class is the class it names or a subclass of it, the
    # clauses in order; an exception no clause takes passes on to the handlers
    # outside, after the finally. ExceptionInfo is what ex-info builds, a thrown
    # nil a NullPointerException and any other value no exception a
    # ClassCastException.
    source: |
      (println (try (throw (IllegalArgumentException. "x")) (catch ArithmeticException e :arith) (catch IllegalArgumentException e :iae)))
      (println (try (throw (NumberFormatException. "m")) (catch IllegalArgumentException e :iae)))
      (println (try (throw (IllegalArgumentException. "m")) (catch NumberFormatException e :nfe) (catch IllegalArgumentException e :iae)))
      (println (try (try (throw (Exception. "m")) (catch RuntimeException e :rte)) (catch Exception e :outer)))
      (println (try (try (throw (AssertionError. "m")) (catch Exception e :ex)) (catch Error e :error)))
      (println (try (throw (ex-info "m" {})) (catch IllegalArgumentException e :iae) (catch clojure.lang.ExceptionInfo e :ex-info)))
      (println (try (throw (ex-info "m" {})) (catch RuntimeException e :rte)))
      (println (try (try (throw (Exception. "m")) (catch clojure.lang.ExceptionInfo e :ex-info)) (catch Throwable t :outer)))
      (println (try (try (throw (java.io.IOException. "io")) (catch RuntimeException e :rte)) (catch java.io.IOException e (.getMessage e))))
      (println (try (throw (StringIndexOutOfBoundsException. "m")) (catch ArrayIndexOutOfBoundsException e :array) (catch IndexOutOfBoundsException e :index)))
      (println (try (try (throw (Exception. "inner")) (catch IllegalStateException e :ise) (finally (println "fin"))) (catch Exception e (ex-message e))))
      (println (try (throw (try (throw (IllegalStateException. "again")) (catch Exception e e))) (catch IllegalStateException e (ex-message e))))
      (println (try (throw nil) (catch ClassCastException e :cce) (catch NullPointerException e :npe)))
      (println (try (throw "s") (catch NullPointerException e :npe) (catch ClassCastException e :cce)))
    expected: |
      :iae
      :iae
      :iae
      :outer
      :error
      :ex-info
      :rte
      :outer
      io
      :index
      fin
      inner
      again
      :npe
      :cce
  - name: catch-takes-a-runtime-error-by-the-class-the-oracle-throws
    # Oracle-identical (clj 1.12.6, 2026-10-03): a runtime error is the Common
    # Lisp condition the runtime signals, and a catch takes it by the class the
    # oracle throws there -- a type error a ClassCastException, a
    # NullPointerException for nil, an IndexOutOfBoundsException for an index
    # past its bound, an UnsupportedOperationException for count of a value that
    # is no collection; a wrong argument count an ArityException (an
    # IllegalArgumentException). A runtime error is never an ExceptionInfo.
    source: |
      (println (try (+ 1 "a") (catch ArithmeticException e :arith) (catch ClassCastException e :cce)))
      (println (try (inc nil) (catch ClassCastException e :cce) (catch NullPointerException e :npe)))
      (println (try (aget (make-array Object 2) 5) (catch IndexOutOfBoundsException e :index)))
      (println (try (count 5) (catch UnsupportedOperationException e :unsupported)))
      (println (try ((fn [a] a) 1 2) (catch clojure.lang.ArityException e :arity)))
      (println (try ((fn [a] a) 1 2) (catch IllegalArgumentException e :iae)))
      (println (try (try (+ 1 "a") (catch IllegalArgumentException e :iae)) (catch RuntimeException e :rte)))
      (println (try (try (first 5) (catch clojure.lang.ExceptionInfo e :ex-info)) (catch Exception e :ex)))
    expected: |
      :cce
      :npe
      :index
      :unsupported
      :arity
      :iae
      :rte
      :ex
  - name: catch-takes-a-division-by-zero-as-an-arithmetic-exception
    # Oracle-identical (clj 1.12.6): an exact division by zero is taken by an
    # ArithmeticException catch -- /, quot, rem and mod, through a literal and a
    # var -- and by its superclasses (on the wasm pair it trapped past the try).
    source: |
      (def cdz-zero 0)
      (println (try (/ 1 0) (catch ArithmeticException e :arith)))
      (println (try (/ 1 cdz-zero) (catch ArithmeticException e :arith)))
      (println (try (/ 1/2 cdz-zero) (catch ArithmeticException e :arith)))
      (println (try (quot 7 cdz-zero) (catch ArithmeticException e :arith)))
      (println (try (rem 7 cdz-zero) (catch ArithmeticException e :arith)))
      (println (try (mod 7 cdz-zero) (catch ArithmeticException e :arith)))
      (println (try (/ 1 cdz-zero) (catch IllegalArgumentException e :iae) (catch RuntimeException e :rte)))
      (println (try (/ 1 cdz-zero) (catch Exception e :ex)))
    expected: |
      :arith
      :arith
      :arith
      :arith
      :arith
      :arith
      :rte
      :ex
  - name: a-refusal-of-the-runtime-is-caught-by-the-class-the-oracle-throws
    # Oracle-identical (clj 1.12.6, 2026-10-04): a refusal of the Clojure runtime
    # carries the class the oracle throws there, so an IllegalArgumentException
    # passes an ArithmeticException catch and an AssertionError an Exception one.
    source: |
      (println (try (try (first 5) (catch ArithmeticException e :taken)) (catch IllegalArgumentException e :oracle)))
      (println (try (assert false) (catch Exception e :taken) (catch Error e :oracle)))
    expected: |
      :oracle
      :oracle
  - name: refusals-of-the-runtime-carry-the-oracles-classes
    # Oracle-identical (clj 1.12.6, 2026-10-04): each refusal passes a catch of a
    # class no refusal is and is taken by one of the class the oracle throws for
    # the same call (every probe answers :ok there). nil where the oracle casts a
    # value is its NullPointerException.
    # The last line deviates as documented: class answers a keyword, and the
    # message is the runtime's own (the oracle's "Don't know how to create ISeq
    # from: java.lang.Long").
    source: |
      (defmacro rfc [cls form] `(try (try ~form :none (catch InterruptedException e# :decoy) (catch ~cls e# :ok)) (catch Throwable e# (class e#))))
      (declare rfc-unbound)
      (defmulti rfc-area :shape)
      (defprotocol RfcP (rfc-m [x]))
      (def ^:dynamic *rfc-dyn* 1)
      (defrecord Rfc [a])
      (println [(rfc IllegalArgumentException (seq 5)) (rfc IllegalArgumentException (reduce + 5)) (rfc IllegalArgumentException (conj {} 5)) (rfc IllegalArgumentException (assoc [1 2] :a 1)) (rfc IllegalArgumentException (rfc-area {:shape :c})) (rfc IllegalArgumentException (rfc-m 5)) (rfc IllegalArgumentException (find #{1} 1)) (rfc IllegalArgumentException (sorted-map 1 2 3))])
      (println [(rfc ClassCastException (name 5)) (rfc ClassCastException (deref 5)) (rfc ClassCastException (re-pattern 5)) (rfc ClassCastException (peek #{1})) (rfc ClassCastException (char "a")) (rfc ClassCastException (compare 1 "a")) (rfc ClassCastException (let [f "abc"] (f 1))) (rfc ClassCastException (conj {} "ab")) (rfc ClassCastException (swap! 5 inc))])
      (println [(rfc NullPointerException (name nil)) (rfc NullPointerException (deref nil)) (rfc NullPointerException (let [f nil] (f 1))) (rfc NullPointerException (.foo nil)) (rfc NullPointerException (subvec nil 0)) (rfc NullPointerException (with-meta nil {}))])
      (println [(rfc IndexOutOfBoundsException (assoc [1 2] 5 1)) (rfc IndexOutOfBoundsException (rand-nth [])) (rfc IndexOutOfBoundsException (subvec [1 2] 0 5)) (rfc IndexOutOfBoundsException (.get [1 2] 5))])
      (println [(rfc IllegalStateException (alter (ref 1) inc)) (rfc IllegalStateException (pop [])) (rfc IllegalStateException (rfc-unbound 1)) (rfc IllegalStateException (set! *rfc-dyn* 2)) (rfc IllegalStateException (re-groups (re-matcher #"a" "b")))])
      (println [(rfc RuntimeException (read-string "(1 2")) (rfc NumberFormatException (bigint "abc")) (rfc NumberFormatException (bigdec "abc")) (rfc StringIndexOutOfBoundsException (subs "abc" 5)) (rfc clojure.lang.ArityException (let [k :a] (k {} 1 2))) (rfc AssertionError (assert false))])
      (println [(rfc UnsupportedOperationException (empty (->Rfc 1))) (rfc ArithmeticException (unchecked-divide-int 1 0)) (rfc java.util.regex.PatternSyntaxException (re-pattern "(a")) (rfc Exception (the-ns 'no.such.ns)) (rfc java.util.IllegalFormatConversionException (format "%d" "a"))])
      (println (try (first 5) (catch Exception e [(class e) (instance? IllegalArgumentException e) (instance? ClassCastException e) (ex-message e)])))
    expected: |
      [:ok :ok :ok :ok :ok :ok :ok :ok]
      [:ok :ok :ok :ok :ok :ok :ok :ok :ok]
      [:ok :ok :ok :ok :ok :ok]
      [:ok :ok :ok :ok]
      [:ok :ok :ok :ok :ok]
      [:ok :ok :ok :ok :ok :ok]
      [:ok :ok :ok :ok :ok]
      [:java.lang.IllegalArgumentException true false seq needs a collection]
  - name: seq-verbs-refuse-a-wrapper-or-a-scalar-with-the-oracles-class
    # Oracle-identical (clj 1.12.6, 2026-10-05): a keyword, var, reduced value,
    # namespace, unbound root, atom, deftype or scalar (false among them) is no
    # collection, so the seq verbs and empty? refuse it as the oracle's seq does
    # (IllegalArgumentException), count and nth as its count and nth do
    # (UnsupportedOperationException; nth of a map, set or record too, and a
    # vector pattern destructures through nth), contains? anything but nil, a map,
    # a record, a set, a vector or a string (the oracle also refuses a string under
    # a key that is no number). The last line is what each verb still answers.
    source: |
      (defmacro swr [cls form] `(try (try ~form :none (catch InterruptedException e# :decoy) (catch ~cls e# :ok)) (catch Throwable e# (class e#))))
      (def swr-a (atom 1))
      (declare swr-unbound)
      (deftype SwrT [x])
      (defrecord SwrR [x])
      (println [(swr IllegalArgumentException (first :a)) (swr IllegalArgumentException (seq :a)) (swr IllegalArgumentException (rest :a)) (swr IllegalArgumentException (next :a)) (swr IllegalArgumentException (doall (map inc :a))) (swr IllegalArgumentException (into [] (reduced 1))) (swr IllegalArgumentException (first #'swr-a)) (swr IllegalArgumentException (first *ns*)) (swr IllegalArgumentException (first swr-unbound)) (swr IllegalArgumentException (first false)) (swr IllegalArgumentException (second :a)) (swr IllegalArgumentException (second 5))])
