      (println (:id (struct b14-acct 1 100)))
      (println (:balance (struct b14-acct 2)))
      (println (:balance (struct-map b14-acct :id 9)))
      (println (:id (struct-map b14-acct :id 9)))
      (println (try (struct b14-acct 1 2 3) (catch Exception e :too-many)))
    expected: |
      1
      nil
      nil
      9
      :too-many
  - name: defonce-keeps-its-root
    # defonce is def unless bound: the first evaluation wins, a reload keeps it.
    source: |
      (defonce b14-dict ["a" "b"])
      (println b14-dict)
      (defonce b14-dict ["c"])
      (println b14-dict)
      (def b14-red 1)
      (defonce b14-red 2)
      (println b14-red)
      (defonce b14-fresh)
      (println b14-fresh)
    expected: |
      [a b]
      [a b]
      1
      nil
  - name: refs-transact-singly
    # The chat.clj slice: a validated ref altered and commuted in transactions,
    # ref-set and ensure inside one, every verb refused outside one. Commute runs
    # once here (the oracle may run its function twice); Validators run, retries
    # do not -- the documented single-threaded deviation.
    source: |
      (def b14-room (ref [] :validator (fn [msgs] (<= (count msgs) 3))))
      (dosync (alter b14-room (fn [m x] (conj m x)) :hi))
      (println @b14-room)
      (dosync (commute b14-room (fn [m x] (conj m x)) :yo) (alter b14-room (fn [m x] (conj m x)) :bye))
      (println @b14-room)
      (println (try (dosync (alter b14-room (fn [m x] (conj m x)) :full)) (catch Exception e :rejected)))
      (println @b14-room)
      (def b14-count (ref 0))
      (dosync (alter b14-count inc) (ref-set b14-count 41) (ensure b14-count))
      (println @b14-count)
      (println (try (alter b14-count inc) (catch Exception e :no-txn)))
      (println (try (ref-set b14-count 0) (catch Exception e :no-txn)))
      (println (try (ensure b14-count) (catch Exception e :no-txn)))
      (println (dosync (ensure b14-count) :ok))
    expected: |
      [:hi]
      [:hi :yo :bye]
      :rejected
      [:hi :yo :bye]
      41
      :no-txn
      :no-txn
      :no-txn
      :ok
  - name: binding-rebinds-dynamic-vars
    # The concurrency.clj slice (without the sleeps): ^:dynamic vars rebind with
    # dynamic extent -- a callee sees the binding, the root returns after -- while
    # inits run sequentially like let.
    source: |
      (def ^:dynamic *b14-verbose* false)
      (def ^:dynamic *b14-tag* :a)
      (def ^:dynamic *b14-level* 0)
      (defn b14-status [] (if *b14-verbose* :loud :quiet))
      (println (b14-status))
      (println (binding [*b14-verbose* true] (b14-status)))
      (println (b14-status))
      (println (binding [*b14-verbose* true] (binding [*b14-verbose* false] (b14-status))))
      (println (binding [*b14-verbose* true *b14-tag* :b] (list (b14-status) *b14-tag*)))
      (println (list (b14-status) *b14-tag*))
      (println (binding [*b14-level* 1 *b14-tag* *b14-level*] *b14-tag*))
      (println *b14-tag*)
    expected: |
      :quiet
      :loud
      :quiet
      :quiet
      (:loud :b)
      (:quiet :a)
      1
      :a
  - name: binding-rebinds-dynamic-defn
    # The concurrency.clj demo-memoize shape: a ^:dynamic defn holds its function
    # in the value cell (the defun stays for recur and the arity helpers), so
    # binding rebinds it with dynamic extent -- a callee sees the binding, the
    # root returns after -- for plain values and memoized ones alike, every arity.
    # A defn without the marker stays refused (ClojureLoweringTest pins the
    # refusal: the oracle reports it at run time, here it is a named refusal).
    source: |
      (defn ^:dynamic b25-slow-double [n] (* n 2))
      (defn b25-calls-slow-double [] (b25-slow-double 21))
      (println (b25-calls-slow-double))
      (println (binding [b25-slow-double (memoize b25-slow-double)] (b25-calls-slow-double)))
      (println (b25-calls-slow-double))
      (println (binding [b25-slow-double (fn [n] 7)] (b25-slow-double 21)))
      (println (binding [b25-slow-double (memoize b25-slow-double)] [(b25-slow-double 21) (b25-slow-double 21)]))
      (defn ^:dynamic b25-madd ([x] (b25-madd x 1)) ([x y] (+ x y)))
      (println (b25-madd 5))
      (println (binding [b25-madd (memoize b25-madd)] (b25-madd 5 6)))
    expected: |
      42
      42
      42
      7
      [42 42]
      6
      11
  - name: set-bang-assigns-thread-bound-vars
    # b75: set! of a ^:dynamic var sets the thread-local value inside an
    # enclosing binding (the binding-depth counter beside the var says whether
    # it is bound, so a callee outside the binding's lexical extent still sets
    # it) and signals Can't change/establish root binding outside one, after
    # the value evaluates; a nested binding restores the outer value. A
    # clojure.main-bound compiler flag answers the value with no effect here
    # (the instant.clj line-13 shape). Every line matches the oracle (Clojure
    # CLI 1.12) byte for byte.
    source: |
      (def ^:dynamic *b75-d* 1)
      (println (binding [*b75-d* 5] (set! *b75-d* 2)))
      (println *b75-d*)
      (println (binding [*b75-d* 5] (set! *b75-d* 2) *b75-d*))
      (println (try (set! *b75-d* 9) (catch Exception e :root-binding)) *b75-d*)
      (defn b75-read [] *b75-d*)
      (defn b75-write [v] (set! *b75-d* v))
      (println (binding [*b75-d* 5] (b75-write 6) (b75-read)))
      (println (b75-read))
      (println (binding [*b75-d* 5] (binding [*b75-d* 6] (b75-write 7)) (b75-read)))
      (println (set! *warn-on-reflection* true))
      (println (set! *unchecked-math* false))
    expected: |
      2
      1
      2
      :root-binding 1
      6
      1
      5
      true
      false
  - name: agents-send-synchronously
    # The pi.clj slice: two agents count a partitioned sample, await rendezvous,
    # and the estimate combines deterministically. Sends apply at once (there is
    # no thread pool, so async ordering is out); *agent* is bound while one runs.
    source: |
      (defn b14-inside? [[x y]] (<= (+ (* x x) (* y y)) 1))
      (def b14-left (agent 0))
      (def b14-right (agent 0))
      (send b14-left (fn [n] (+ n (count (filter b14-inside? [[0 0] [1 1] [0 1]])))))
      (send-off b14-right (fn [n] (+ n (count (filter b14-inside? [[1 0] [2 2]])))))
      (await b14-left b14-right)
      (println (list @b14-left @b14-right (/ (* 4 (+ @b14-left @b14-right)) 5)))
      (def b14-seen (atom nil))
      (def b14-probe (agent 0))
      (println @(send b14-probe + 41))
      (send b14-probe (fn [_] (reset! b14-seen *agent*) 1))
      (println (list @b14-probe (if @b14-seen :bound :unbound) (= @b14-seen b14-probe)))
      (println (list (await b14-probe) (shutdown-agents)))
    expected: |
      (2 1 12/5)
      41
      (1 :bound true)
      (nil nil)
  - name: with-out-str-captures-output-and-time-answers
    # with-out-str binds *standard-output* to a string stream (never a literal
    # with-output-to-string); time reports Elapsed time and answers its value.
    # Only the value and the report prefix pin: the millisecond count never is.
    source: |
      (println (with-out-str (print 1) (pr :a)))
      (println (subs (with-out-str (time (+ 1 2))) 0 13))
      (with-out-str (def b14-timed (time (+ 40 2))))
      (println b14-timed)
    expected: |
      1:a
      Elapsed time:
      42
  - name: streams-write-through-out-and-import-answers-nil
    # *out* is *standard-output*: .write prints through princ on streams, .flush
    # finishes them, on every backend. import wires names and defines nothing.
    source: |
      (println (with-out-str (. *out* write "hi") (. *out* flush) (pr :!)))
      (println (do (import 'java.util.ArrayList) :ok))
    expected: |
      hi:!
      :ok
  - name: make-array-aget-aset-and-alength-round-trip
    # The book's interop.clj painstakingly-create-array shape: the class spells the
    # element type and is ignored -- every array here is general. Only the Clojure
    # spellings are new, so this case runs on all four backends.
    source: |
      (let [b20-a (make-array String 3)] (aset b20-a 0 "x") (println (aget b20-a 0)) (println (alength b20-a)))
      (let [b20-b (make-array String 2 2)] (aset b20-b 0 1 "y") (println (aget b20-b 0 1)) (println (alength b20-b)))
    expected: |
      x
