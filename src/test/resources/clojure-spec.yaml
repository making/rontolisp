  - name: an-ifn-type-is-called-through-its-invoke-and-applied-through-its-apply-to
    # clojure.lang.IFn (.kb/clojure-frontend.md "Host interfaces"): a call, map, filter and
    # a record's call reach the invoke of the call's count, apply the applyTo (here
    # through clojure.lang.AFn/applyToHelper, the usual body); a count or an applyTo the
    # body leaves out is the oracle's AbstractMethodError. Every line is the oracle's
    # (clj 1.12.6), on all four backends.
    source: |
      (ns iface-fn)
      (def f (reify clojure.lang.IFn
               (invoke [_] :none)
               (invoke [_ a] [:one a])
               (invoke [_ a b] [:two a b])
               (applyTo [this args] (clojure.lang.AFn/applyToHelper this args))))
      (prn (f) (f 1) (f 1 2) (apply f [1 2]) (map f [1 2]) (ifn? f) (fn? f))
      (prn (try (f 1 2 3) (catch AbstractMethodError e :abstract)) (try (apply (reify clojure.lang.IFn (invoke [_ a] a)) [1]) (catch AbstractMethodError e :abstract)))
      (defrecord Adder [n] clojure.lang.IFn (invoke [_ x] (+ n x)))
      (prn ((->Adder 10) 5) (map (->Adder 1) [1 2]) (filter (reify clojure.lang.IFn (invoke [_ x] (odd? x))) [1 2 3]))
      (prn (apply (reify clojure.lang.IFn (invoke [_ a] a) (applyTo [_ args] [:applied args])) [7]))
      (in-ns 'user)
    expected: |
      :none [:one 1] [:two 1 2] [:two 1 2] ([:one 1] [:one 2]) true false
      :abstract :abstract
      15 (2 3) (1 3)
      [:applied (7)]
  - name: an-ideref-type-derefs-through-its-deref
