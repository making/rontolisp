  - name: if-let-and-when-let-destructure-only-in-the-taken-branch
    # The else branch sees the names as they were outside, and a falsey init
    # destructures nothing (until 2026-10-08 both answered nil and the when-let
    # signalled "nth not supported on this type"); oracle-identical.
    source: |
      (let [x 1] (println (if-let [x nil] :then x)))
      (let [x 1] (println (if-let [[x] nil] :then x)))
      (println (when-let [[a] false] a))
      (println (if-let [{:keys [a]} false] a :no))
    expected: |
      1
      1
      nil
      :no
  - name: if-some-and-when-some-test-against-nil-only
    source: |
      (println (if-some [x false] [:then x] :else))
      (println (if-some [x nil] [:then x] :else))
      (println (if-some [x nil] [:then x]))
      (let [x 1] (println (if-some [x nil] :then x)))
      (println (if-some [[a b] [1 2]] [a b] :no))
      (println (if-some [{:keys [a]} {:a 1}] a :no))
      (println (when-some [x false] [:body x]))
      (println (when-some [x nil] [:body x]))
      (println (when-some [x 0] (print "side ") [:body x]))
      (println (when-some [x 1]))
    expected: |
      [:then false]
      :else
      nil
      1
      [1 2]
      1
      [:body false]
      nil
      side [:body 0]
      nil
  - name: case-dispatches-on-unevaluated-constants
