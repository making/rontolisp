  - name: metadata-is-parsed-and-dropped
    # ^:private/^:dynamic/^{...}/defn-/with-meta parse and drop: metadata never
    # affects dispatch, so every shape below answers its bare value.
    source: |
      (defn- b14-double [x] (* x 2))
      (println (b14-double 21))
      (def ^:private b14-secret 7)
      (println b14-secret)
      (def ^{:doc "kept"} b14-kept 11)
      (println b14-kept)
      (defn b14-hint [^String s] s)
      (println (b14-hint "s"))
      (println (with-meta [1 2] {:tag :x}))
      (println (with-meta :a nil))
    expected: |
      42
      7
      11
      s
      [1 2]
      :a
  - name: defstruct-struct-and-struct-map
    # A defstruct holds its key vector; struct pairs keys with values (missing
    # values are nil, too many signal), struct-map seeds the same keys. Only
    # single-key reads print: multi-entry map order is unspecified.
    source: |
      (defstruct b14-acct :id :balance)
      (println (:id (struct b14-acct 1 100)))
      (println (:balance (struct b14-acct 2)))
      (println (:balance (struct-map b14-acct :id 9)))
      (println (:id (struct-map b14-acct :id 9)))
      (println (try (struct b14-acct 1 2 3) (catch Exception e :too-many)))
    expected: |
      1
      nil
      nil
      9
      :too-many
  - name: defonce-keeps-its-root
    # defonce is def unless bound: the first evaluation wins, a reload keeps it.
    source: |
      (defonce b14-dict ["a" "b"])
      (println b14-dict)
      (defonce b14-dict ["c"])
      (println b14-dict)
      (def b14-red 1)
      (defonce b14-red 2)
      (println b14-red)
      (defonce b14-fresh)
      (println b14-fresh)
    expected: |
      [a b]
      [a b]
      1
      nil
  - name: refs-transact-singly
    # The chat.clj slice: a validated ref altered and commuted in transactions,
    # ref-set and ensure inside one, every verb refused outside one. Commute runs
    # once here (the oracle may run its function twice); Validators run, retries
    # do not -- the documented single-threaded deviation.
    source: |
      (def b14-room (ref [] :validator (fn [msgs] (<= (count msgs) 3))))
      (dosync (alter b14-room (fn [m x] (conj m x)) :hi))
      (println @b14-room)
      (dosync (commute b14-room (fn [m x] (conj m x)) :yo) (alter b14-room (fn [m x] (conj m x)) :bye))
      (println @b14-room)
      (println (try (dosync (alter b14-room (fn [m x] (conj m x)) :full)) (catch Exception e :rejected)))
      (println @b14-room)
      (def b14-count (ref 0))
      (dosync (alter b14-count inc) (ref-set b14-count 41) (ensure b14-count))
      (println @b14-count)
      (println (try (alter b14-count inc) (catch Exception e :no-txn)))
      (println (try (ref-set b14-count 0) (catch Exception e :no-txn)))
      (println (try (ensure b14-count) (catch Exception e :no-txn)))
      (println (dosync (ensure b14-count) :ok))
    expected: |
      [:hi]
      [:hi :yo :bye]
      :rejected
      [:hi :yo :bye]
      41
      :no-txn
      :no-txn
      :no-txn
      :ok
  - name: binding-rebinds-dynamic-vars
    # The concurrency.clj slice (without the sleeps): ^:dynamic vars rebind with
    # dynamic extent -- a callee sees the binding, the root returns after -- while
    # inits run sequentially like let.
    source: |
      (def ^:dynamic *b14-verbose* false)
      (def ^:dynamic *b14-tag* :a)
      (def ^:dynamic *b14-level* 0)
      (defn b14-status [] (if *b14-verbose* :loud :quiet))
      (println (b14-status))
      (println (binding [*b14-verbose* true] (b14-status)))
      (println (b14-status))
      (println (binding [*b14-verbose* true] (binding [*b14-verbose* false] (b14-status))))
      (println (binding [*b14-verbose* true *b14-tag* :b] (list (b14-status) *b14-tag*)))
      (println (list (b14-status) *b14-tag*))
      (println (binding [*b14-level* 1 *b14-tag* *b14-level*] *b14-tag*))
      (println *b14-tag*)
    expected: |
      :quiet
      :loud
      :quiet
      :quiet
      (:loud :b)
      (:quiet :a)
      1
      :a
  - name: binding-rebinds-dynamic-defn
    # The concurrency.clj demo-memoize shape: a ^:dynamic defn holds its function
    # in the value cell (the defun stays for recur and the arity helpers), so
    # binding rebinds it with dynamic extent -- a callee sees the binding, the
    # root returns after -- for plain values and memoized ones alike, every arity.
    # A defn without the marker stays refused (ClojureLoweringTest pins the
    # refusal: the oracle reports it at run time, here it is a named refusal).
    source: |
      (defn ^:dynamic b25-slow-double [n] (* n 2))
      (defn b25-calls-slow-double [] (b25-slow-double 21))
      (println (b25-calls-slow-double))
      (println (binding [b25-slow-double (memoize b25-slow-double)] (b25-calls-slow-double)))
      (println (b25-calls-slow-double))
      (println (binding [b25-slow-double (fn [n] 7)] (b25-slow-double 21)))
      (println (binding [b25-slow-double (memoize b25-slow-double)] [(b25-slow-double 21) (b25-slow-double 21)]))
      (defn ^:dynamic b25-madd ([x] (b25-madd x 1)) ([x y] (+ x y)))
      (println (b25-madd 5))
      (println (binding [b25-madd (memoize b25-madd)] (b25-madd 5 6)))
    expected: |
      42
      42
      42
      7
      [42 42]
      6
      11
  - name: agents-send-synchronously
    # The pi.clj slice: two agents count a partitioned sample, await rendezvous,
    # and the estimate combines deterministically. Sends apply at once (there is
    # no thread pool, so async ordering is out); *agent* is bound while one runs.
    source: |
      (defn b14-inside? [[x y]] (<= (+ (* x x) (* y y)) 1))
      (def b14-left (agent 0))
      (def b14-right (agent 0))
      (send b14-left (fn [n] (+ n (count (filter b14-inside? [[0 0] [1 1] [0 1]])))))
      (send-off b14-right (fn [n] (+ n (count (filter b14-inside? [[1 0] [2 2]])))))
      (await b14-left b14-right)
      (println (list @b14-left @b14-right (/ (* 4 (+ @b14-left @b14-right)) 5)))
      (def b14-seen (atom nil))
      (def b14-probe (agent 0))
      (println @(send b14-probe + 41))
      (send b14-probe (fn [_] (reset! b14-seen *agent*) 1))
      (println (list @b14-probe (if @b14-seen :bound :unbound) (= @b14-seen b14-probe)))
      (println (list (await b14-probe) (shutdown-agents)))
    expected: |
      (2 1 12/5)
      41
      (1 :bound true)
      (nil nil)
  - name: with-out-str-captures-output-and-time-answers
    # with-out-str binds *standard-output* to a string stream (never a literal
    # with-output-to-string); time reports Elapsed time and answers its value.
    # Only the value and the report prefix pin: the millisecond count never is.
    source: |
      (println (with-out-str (print 1) (pr :a)))
      (println (subs (with-out-str (time (+ 1 2))) 0 13))
      (with-out-str (def b14-timed (time (+ 40 2))))
      (println b14-timed)
    expected: |
      1:a
      Elapsed time:
      42
  - name: streams-write-through-out-and-import-answers-nil
    # *out* is *standard-output*: .write prints through princ on streams, .flush
    # finishes them, on every backend. import wires names and defines nothing.
    source: |
      (println (with-out-str (. *out* write "hi") (. *out* flush) (pr :!)))
      (println (do (import 'java.util.ArrayList) :ok))
    expected: |
      hi:!
      :ok
  - name: make-array-aget-aset-and-alength-round-trip
    # The book's interop.clj painstakingly-create-array shape: the class spells the
    # element type and is ignored -- every array here is general. Only the Clojure
    # spellings are new, so this case runs on all four backends.
    source: |
      (let [b20-a (make-array String 3)] (aset b20-a 0 "x") (println (aget b20-a 0)) (println (alength b20-a)))
      (let [b20-b (make-array String 2 2)] (aset b20-b 0 1 "y") (println (aget b20-b 0 1)) (println (alength b20-b)))
    expected: |
      x
      3
      y
      2
  - name: in-is-bound-to-standard-input
    # *in* is *standard-input*: bound on every backend. Reading from a rebound *in*
    # is pinned in ClojureInteropTest instead -- never real stdin in either place.
    source: |
      (println (nil? *in*))
    expected: |
      false
  - name: records-are-maps-with-a-type-tag
    # b13: a record is a (:C%RECORD tag fields table) wrapper over the same equal
    # table every map uses, so the map verbs read through it on all four backends
    # (the oracle answers #user.R{...}; this prints the wrapper -- the documented
    # record-printing deviation -- so cases read through get/class instead).
    # (assoc b13-r :hard true) keeps the type; (dissoc r :hard) of the extension
    # key keeps it while (dissoc r :mass) of the base field drops to a plain map.
    source: |
      (defrecord B13Rock [mass])
      (def b13-r (->B13Rock 7))
      (println (= b13-r (->B13Rock 7)))
      (println (= b13-r {:mass 7}))
      (println (get b13-r :mass))
      (println (:mass b13-r))
      (println (contains? b13-r :mass))
      (println (count b13-r))
      (println (keys b13-r))
      (println (vals b13-r))
      (println (class b13-r))
      (println (instance? B13Rock b13-r))
      (println (instance? B13Rock {:mass 7}))
      (println (get (assoc b13-r :hard true) :hard))
      (println (class (assoc b13-r :hard true)))
      (println (get (map->B13Rock {:mass 1 :color :red}) :color))
      (println (get (map->B13Rock {:mass 1}) :color :gone))
      (println (B13Rock. 42))
      (def b13-r2 (dissoc (assoc b13-r :hard true) :hard))
      (println (class b13-r2))
      (println (get b13-r2 :hard :gone))
      (def b13-r3 (dissoc b13-r :mass))
      (println b13-r3)
      (println (get (merge b13-r {:hard true}) :hard))
      (println (class (merge b13-r {:hard true})))
      (println (class (merge {:hard true} b13-r)))
      (println (get (merge-with + b13-r {:mass 10}) :mass))
      (println (class (merge-with + b13-r {:mass 10})))
      (println (get (update b13-r :mass inc) :mass))
      (println (select-keys (assoc b13-r :hard true) [:mass]))
      (println (into {} b13-r))
      (println (empty? b13-r))
      (println (empty? (B13Rock. nil)))
      (println (seq b13-r))
      (println (get (conj b13-r [:hard true]) :hard))
      (println (get-in b13-r [:mass]))
      (println (get (assoc-in b13-r [:mass] 8) :mass))
      (println (get (update-in b13-r [:mass] inc) :mass))
    expected: |
      true
      false
      7
      7
      true
      1
      (:mass)
      (7)
      :B13Rock
      true
      false
      true
      :B13Rock
      :red
      :gone
      (:C%RECORD :B13Rock (:mass) {:mass 42})
      :B13Rock
      :gone
      {}
      true
      :B13Rock
      :map
      17
      :B13Rock
      8
      {:mass 7}
      {:mass 7}
      false
      false
      ([:mass 7])
      true
      7
      8
      8
  - name: protocols-dispatch-over-the-type-tag
    # b13: the InstantProvider/SimClock slice of instant.clj, adapted (the oracle
    # extends to the Instant/Date host classes, which no wasm backend has; the
    # kinds class answers stand in). extend-protocol rows dispatch nil/String/
    # Number separately with Object as the catch-all; the deftype body sees its
    # fields as locals, so (swap! tick inc) advances the simulated clock.
    source: |
      (defprotocol B13Time (b13-to-ms [source]))
      (extend-protocol B13Time
        nil (b13-to-ms [src] :b13-nil)
        Object (b13-to-ms [src] :b13-object)
        String (b13-to-ms [s] :b13-string)
        Number (b13-to-ms [n] n))
      (println (b13-to-ms nil))
      (println (b13-to-ms "oops"))
      (println (b13-to-ms 42))
      (println (b13-to-ms 4.5))
      (println (b13-to-ms :k))
      (println (satisfies? B13Time nil))
      (println (satisfies? B13Time "s"))
      (defprotocol B13Sim (b13-advance! [s]))
      (deftype B13Clock [start granularity tick]
        B13Sim (b13-advance! [_] (swap! tick inc))
        B13Time (b13-to-ms [_] (+ start (* granularity @tick))))
      (def b13-clock (->B13Clock 1000 100 (atom 0)))
      (println (b13-to-ms b13-clock))
      (b13-advance! b13-clock)
      (b13-advance! b13-clock)
      (println (b13-to-ms b13-clock))
      (println (satisfies? B13Sim b13-clock))
      (println (satisfies? B13Time b13-clock))
      (println (instance? B13Clock b13-clock))
      (println (class b13-clock))
      (println (get b13-clock :start))
      (println (.-granularity b13-clock))
    expected: |
      :b13-nil
      :b13-string
      42
      4.5
      :b13-object
      true
      true
      1000
      1200
      true
      true
      true
      :B13Clock
      nil
      100
  - name: hangman-players-guess-through-the-protocol
    # b13: the Player slice of hangman/core.clj (random-player/interactive-player
    # via reify, ChoicesPlayer via defrecord, the pure game loop). Letters are
    # strings (the char-coercion helpers are outside the subset); the two games
    # below differ by one wrong guess, like the oracle's 2 and 3.
    source: |
      (defprotocol B13Player (b13-next-guess [player progress]))
      (def b13-letters ["e" "t" "a" "o" "i" "n" "h" "x"])
      (def b13-random-player (reify B13Player (b13-next-guess [_ progress] :rand)))
      (def b13-interactive-player (reify B13Player (b13-next-guess [_ progress] :human)))
      (println (b13-next-guess b13-random-player nil))
      (println (b13-next-guess b13-interactive-player nil))
      (println (satisfies? B13Player b13-random-player))
      (println (= b13-random-player b13-random-player))
      (println (= b13-random-player b13-interactive-player))
      (defrecord B13Choices [choices]
        B13Player
        (b13-next-guess [_ progress]
          (let [guess (first @choices)]
            (swap! choices rest)
            guess)))
      (defn b13-choices-player [choices] (->B13Choices (atom choices)))
      (def b13-alpha (b13-choices-player b13-letters))
      (println (b13-next-guess b13-alpha nil))
      (println (b13-next-guess b13-alpha nil))
      (println (satisfies? B13Player b13-alpha))
      (println (satisfies? B13Player {}))
      (println (instance? B13Choices b13-alpha))
      (extend-type String B13Player (b13-next-guess [s progress] :str-player))
      (println (b13-next-guess "x" nil))
      (extend String B13Player {:b13-next-guess (fn [s progress] :ext-fn)})
      (println (b13-next-guess "y" nil))
      (defn b13-new-progress [word] (repeat (count word) "_"))
      (defn b13-update-progress [progress word guess]
        (map #(if (= %1 guess) guess %2) word progress))
      (defn b13-complete? [progress word] (= progress (seq word)))
      (defn b13-game [word player]
        (loop [progress (b13-new-progress word) guesses 1]
          (let [guess (b13-next-guess player progress)
                progress2 (b13-update-progress progress word guess)]
            (if (b13-complete? progress2 word) guesses (recur progress2 (inc guesses))))))
      (println (b13-game ["h" "i"] (b13-choices-player ["h" "i" "x"])))
      (println (b13-game ["h" "i"] (b13-choices-player ["x" "h" "i"])))
    expected: |
      :rand
      :human
      true
      true
      false
      e
      t
      true
      false
      true
      :str-player
      :ext-fn
      2
      3
  - name: reify-values-dispatch-and-deftypes-stay-opaque
    # b13: each reify is a distinct dispatch value (= is identity); a deftype is
    # opaque to the map verbs (reads miss, writers and seq/count/empty? signal,
    # caught here) while instance?/class still see its tag.
    source: |
      (defprotocol B13Greet (b13-hello [g]))
      (def b13-ga (reify B13Greet (b13-hello [_] :a)))
      (def b13-gb (reify B13Greet (b13-hello [_] :b)))
      (println (b13-hello b13-ga))
      (println (b13-hello b13-gb))
      (println (satisfies? B13Greet b13-ga))
      (println (= b13-ga b13-ga))
      (println (= b13-ga b13-gb))
      (deftype B13Box [v])
      (def b13-box (B13Box. 1))
      (println (= b13-box b13-box))
      (println (= b13-box (B13Box. 1)))
      (println (get b13-box :v))
      (println (contains? b13-box :v))
      (println (try (keys b13-box) (catch Exception e :threw)))
      (println (try (count b13-box) (catch Exception e :threw)))
      (println (try (seq b13-box) (catch Exception e :threw)))
      (println (try (assoc b13-box :w 2) (catch Exception e :threw)))
      (println (try (b13-hello 1.5) (catch Exception e :threw)))
      (println (class b13-box))
      (println (instance? B13Box b13-box))
      (extend-type String B13Greet (b13-hello [s] :str))
      (println (b13-hello "x"))
      (extend String B13Greet {:b13-hello (fn [s] :fn)})
      (println (b13-hello "y"))
    expected: |
      :a
      :b
      true
      true
      false
      true
      false
      nil
      false
      :threw
      :threw
      :threw
      :threw
      :threw
      :B13Box
      true
      :str
      :fn
  - name: jio-reader-resolves-on-every-backend
    # clojure.java.io resolves beside clojure.string, for reader only: the alias,
    # the referred bare var and the fully-qualified spelling all name the same
    # one-argument open, which prints as a function value without touching the
    # filesystem -- so this case runs unmodified on all four backends. Opening a
    # path, reading a reader through line-seq and closing through with-open need
    # files and live in ClojureInteropTest (interpreter and JVM); without a
    # preopened directory both wasm backends refuse with the file-error
    # (ClojureWasmFileRefusalTest); an unknown jio fn is a lowering refusal
    # (ClojureLoweringTest).
    source: |
      (ns b22jio (:require [clojure.java.io :as jio :refer [reader]]))
      (println jio/reader)
      (println reader)
      (println clojure.java.io/reader)
      (println (map jio/reader []))
      (println (map reader []))
    expected: |
      #<procedure>
      #<procedure>
      #<procedure>
      nil
      nil
  - name: mapv-answers-vectors
    # mapv maps over one or more collections and answers a vector (never a lazy
    # wrapper, even over lazy inputs); class pins the vector answer. The hangman
    # letters shape (mapv char over a range) counts 26 from a to z.
    source: |
      (println (mapv inc [1 2 3]))
      (println (mapv + [1 2 3] [10 20]))
      (println (mapv inc []))
      (println (mapv inc nil))
      (println (class (mapv inc [1])))
      (println (mapv char (range 97 101)))
      (let [b18-letters (mapv char (range 97 123))] (println (count b18-letters) (first b18-letters) (last b18-letters)))
      (println (mapv inc (concat (lazy-seq [1 2]) [3])))
      (println (map mapv [inc] [[1 2]]))
    expected: |
      [2 3 4]
      [11 22]
      []
      []
      :vector
      [a b c d]
      26 a z
      [2 3 4]
      ([2 3])
  - name: filterv-answers-vectors
    # filterv is the strict vector arm of filter: Clojure truthiness (false drops
    # like nil), sets work as predicates through the dispatcher, empty answers [].
    source: |
      (println (filterv odd? [1 2 3 4]))
      (println (filterv odd? []))
      (println (filterv odd? nil))
      (println (class (filterv odd? [1])))
      (println (filterv #{:h} [:h :t :h]))
      (println (filterv odd? (concat (lazy-seq [1 2 3]) [4])))
      (println (map filterv [odd?] [[1 2 3]]))
    expected: |
      [1 3]
      []
      []
      :vector
      [:h :h]
      [1 3]
      ([1 3])
  - name: mapcat-concats-mapped-views
    # mapcat concats the mapped seq views strictly (nil-safe like concat); the
    # eager.clj shape maps vals over single-entry maps in order.
    source: |
      (println (mapcat reverse [[1 2] [3 4]]))
      (println (mapcat identity [nil [1] nil]))
      (println (mapcat reverse []))
      (println (mapcat reverse nil))
      (println (mapcat vector [1 2] [3 4]))
      (println (mapcat vals [{:a 1} {:b 2}]))
      (println (map vals [{:a 1} {:b 2}]))
      (println (mapcat vector (concat (lazy-seq [1]) [2])))
      (println (map mapcat [vector] [[[1 2]]]))
    expected: |
      (2 1 4 3)
      (1)
      nil
      nil
      (1 3 2 4)
      (1 2)
      ((1) (2))
      (1 2)
      (([1 2]))
  - name: ffirst-and-nfirst-read-heads
    # ffirst is the head of the head, nfirst the tail of the head, each level
    # through the seq view (a vector head seqs before its own head is read); of
    # empty, nil.
    source: |
      (println (ffirst [[1 2]]))
      (println (ffirst [[1 2] [3 4]]))
      (println (ffirst []) (ffirst nil))
      (println (nfirst [[1 2 3]]))
      (println (nfirst [[1]]))
      (println (nfirst []) (nfirst nil))
      (println (map ffirst [[[1 2]] [[3]]]))
      (println (map nfirst [[[1 2 3]] [[4 5]]]))
    expected: |
      1
      1
      nil nil
      (2 3)
      nil
      nil nil
      (1 3)
      ((2 3) (5))
  - name: boolean-answers-truthiness
    # boolean is true for anything truthy (only nil and false are falsey,
    # including 0, empty strings and empty collections).
    source: |
      (println (boolean 1))
      (println (boolean nil) (boolean false))
      (println (boolean 0) (boolean "") (boolean []) (boolean {}))
      (println (map boolean [1 nil false 0 ""]))
    expected: |
      true
      false false
      true true true true
      (true false false true true)
  - name: char-converts-code-points
    # char answers the character itself, or the truncated code point of a number;
    # int reads it back (int exists).
    source: |
      (println (char 97))
      (println (char \a))
      (println (= (char 97) \a))
      (println (int (char 97)))
      (println (int \a) (long \a))
      (println (map char [97 98]))
      (println (char 97.5))
