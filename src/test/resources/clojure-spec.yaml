      (println (case nil nil :nil :no))
      (println (case false false :f nil :n :no))
      (println (case 3 1 :one 2 :two (+ 1 2)))
      (println (case (+ 1 1) 2 :two))
      (println (case 1 :only-default))
      (println (case 12345678901234567890 12345678901234567890 :big :no))
