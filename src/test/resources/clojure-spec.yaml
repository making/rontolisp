  - name: sorted-map-by-and-sorted-set-by-order-through-a-comparator
    # Oracle-identical (clj 1.12.6): a comparator answering a boolean is less-than (its
    # false asks the reversed call), one answering a number is read by its integer part
    # (0.5 is equal), and keys it calls equal collapse into the first.
    source: |
      (prn (sorted-map-by > 1 :a 2 :b 3 :c) (sorted-set-by > 1 2 3) (sorted-map-by compare :b 1 :a 2) (sorted-map-by #(compare %2 %1) :b 1 :a 2 :c 3))
      (prn (sorted-set-by (fn [a b] (compare (count a) (count b))) "ab" "cd" "x") (sorted-map-by (fn [a b] (compare (count a) (count b))) "ab" 1 "cd" 2))
      (prn (sorted-set-by (fn [a b] 0.5) 1 2) (sorted-set-by (fn [a b] (- a b)) 3 1 2) (sorted-set-by (fn [a b] (> a b)) 3 1 2) (apply sorted-map-by > [1 :a 2 :b]))
      (prn (sorted-set-by compare '(1 2)) (conj (sorted-set-by >) 1 3 2) (assoc (sorted-map-by >) 1 :a 2 :b))
    expected: |
      {3 :c, 2 :b, 1 :a} #{3 2 1} {:a 2, :b 1} {:c 3, :b 1, :a 2}
      #{"x" "ab"} {"ab" 2}
      #{1} #{1 2 3} #{3 2 1} {2 :b, 1 :a}
      #{(1 2)} #{3 2 1} {2 :b, 1 :a}
  - name: subseq-and-rsubseq-walk-a-bounded-range
    # Oracle-identical (clj 1.12.6) but for the last line: a > or >= test (a < or <=
    # for rsubseq) starts at the key, any other walks from the start while it holds,
    # each in the comparator's order; a test passed as a value is recognized by how it
    # answers. Where nothing passes after a walk from the start the oracle prints its
    # empty lazy seq, (), and here nil, like every strict seq verb.
    source: |
      (prn (subseq (sorted-set 1 2 3) > 1) (subseq (sorted-set 1 2 3) >= 2) (subseq (sorted-set 1 2 3) < 3) (subseq (sorted-set 1 2 3) <= 2) (subseq (sorted-set 1 2 3) > 5))
      (prn (subseq (sorted-set 1 2 3 4 5) > 1 < 4) (subseq (sorted-set 1 2 3 4 5) >= 2 <= 4) (subseq (sorted-set 1 2 3 4 5) > 10 < 20))
      (prn (rsubseq (sorted-set 1 2 3) < 3) (rsubseq (sorted-set 1 2 3) > 1) (rsubseq (sorted-set 1 2 3) <= 2) (rsubseq (sorted-set 1 2 3 4 5) > 1 < 4) (rsubseq (sorted-set 1 2 3 4 5) >= 2 <= 4))
      (prn (subseq (sorted-map :a 1 :b 2 :c 3) > :a) (rsubseq (sorted-map :a 1 :b 2 :c 3) < :c) (subseq (sorted-set-by > 1 2 3) > 2) (subseq (sorted-set-by > 1 2 3) < 2))
      (prn (let [t >] (subseq (sorted-set 1 2 3) t 1)) (subseq (sorted-set) > 1) (subseq (sorted-set 1 2 3) > 1.5) (apply subseq [(sorted-set 1 2 3) >= 2]) (apply rsubseq [(sorted-set 1 2 3) < 3]))
      (prn (subseq (sorted-set 1 2 3) < 0) (rsubseq (sorted-set 1 2 3) > 5))
    expected: |
      (2 3) (2 3) (1 2) (1 2) nil
      (2 3) (2 3 4) nil
      (2 1) (3 2) (2 1) (3 2) (4 3 2)
      ([:b 2] [:c 3]) ([:b 2] [:a 1]) (1) (3)
      (2 3) nil (2 3) (2 3) (2 1)
      nil nil
  - name: sorted-collections-and-the-type-predicates
    # Oracle-identical (clj 1.12.6) but for class: here it answers the kind keyword (a
    # sorted map is :map, a sorted set :set), the oracle its host class
    # (clojure.lang.PersistentTreeMap, ...PersistentTreeSet).
    source: |
      (prn (sorted? (sorted-map)) (sorted? (sorted-set)) (sorted? {}) (reversible? (sorted-map)) (reversible? (sorted-set)) (reversible? []) (reversible? {}))
      (prn (map? (sorted-map)) (set? (sorted-set)) (map? (sorted-set)) (set? (sorted-map)) (coll? (sorted-set)) (seqable? (sorted-set)) (counted? (sorted-set)) (counted? (sorted-map)))
      (prn (associative? (sorted-map)) (associative? (sorted-set)) (ifn? (sorted-set)) (ifn? (sorted-map)) (sequential? (sorted-set)) (seq? (sorted-set)) (vector? (sorted-set)) (list? (sorted-set)) (fn? (sorted-set)) (record? (sorted-map)))
      (prn (map sorted? [(sorted-map) {}]) (filter set? [(sorted-set) #{} {}]) (class (sorted-map)) (class (sorted-set)))
    expected: |
      true true false true true true false
      true true false false true true true true
      true false true true false false false false false false
      (true false) (#{} #{}) :map :set
  - name: compare-orders-like-the-oracle
    # Oracle-identical (clj 1.12.6): numbers by value across their kinds, strings,
    # keywords and symbols as compareTo (the difference of the first differing
    # characters; a name without a namespace first), false before true, nil before
    # anything, vectors by length then member by member.
    source: |
      (prn (compare 1 2) (compare 2 1) (compare 1 1.0) (compare "a" "c") (compare "abc" "ab") (compare :a :c) (compare :a :a/b) (compare :b/a :a/b) (compare 'a 'c) (compare \a \c))
      (prn (compare false true) (compare nil 1) (compare 1 nil) (compare nil nil) (compare [1 2] [1 3]) (compare [1 2] [1 2 3]) (compare [1 2 3] [9 9]) (compare ##NaN 1) (compare 1/2 0.5) (compare [] []))
      (prn (map compare [1 2] [2 1]) (sort compare [3 1 2]) (sort #(compare %2 %1) [3 1 2]) (sort-by identity #(compare %2 %1) [3 1 2]) (apply compare ["b" "a"]))
    expected: |
      -1 1 0 -2 1 -2 -1 1 -2 -2
      -1 -1 1 0 -1 -1 1 0 0 0
      (-1 1) (1 2 3) (3 2 1) (3 2 1) 1
  - name: sort-reads-a-comparator-answering-a-number
    # Oracle-identical (clj 1.12.6): a comparator answering a number orders by its
    # integer part's sign (it was read by truthiness, so every number meant less).
    source: |
      (prn (sort (fn [a b] (- a b)) [3 1 2 5 4]) (sort-by - (fn [a b] (- a b)) [3 1 2]) (sort > [3 1 2]) (sort (fn [a b] (* 0.5 (- a b))) [2 1]) (sort-by count compare ["ccc" "a" "bb"]))
    expected: |
      (1 2 3 4 5) (3 2 1) (3 2 1) (2 1) ("a" "bb" "ccc")
  - name: sort-without-a-comparator-orders-by-compare
    # Oracle-identical (clj 1.12.6): the default order is compare's, so nil, booleans,
    # symbols and vectors sort too; kinds with no common order refuse (the message
    # differs: the oracle names a Java cast).
    source: |
      (prn (sort [[1 2] [0 1]]) (sort [:b nil :a]) (sort [true false]) (sort ['b 'a]))
      (prn (sort [3 1.5 2 1/2]) (sort ["b" "a" "ab"]) (sort [\b \a]) (sort [:b/a :a :b]) (sort ['b/a 'a 'b]))
      (prn (sort [[1 2 3] [9] [1 3] [1 2]]) (sort-by first [[2 :a] [1 :b]]) (sort-by :k [{:k nil} {:k 2} {:k 1}]) (sort-by identity [nil nil 1]))
      (prn (sort [1]) (apply sort [[2 1]]) (map sort [[2 1] [:b :a]]))
      (defn sort-refusal [f] (try (pr-str (f)) (catch Exception e :refused)))
      (prn (sort-refusal #(sort [1 "a"])) (sort-refusal #(sort [[1] '(2)])) (sort-refusal #(sort [:a 1])) (sort-refusal #(sort-by identity [{:a 1} {:a 2}])))
    expected: |
      ([0 1] [1 2]) (nil :a :b) (false true) (a b)
      (1/2 1.5 2 3) ("a" "ab" "b") (\a \b) (:a :b :b/a) (a b b/a)
      ([9] [1 2] [1 3] [1 2 3]) ([1 :b] [2 :a]) ({:k nil} {:k 1} {:k 2}) (nil nil 1)
      (1) (1 2) ((1 2) (:a :b))
      :refused :refused :refused :refused
  - name: vector-of-stores-each-member-as-its-primitive
    # Oracle-identical (clj 1.12.6) but for the last line: the answer is an ordinary
    # vector, so a later conj or assoc stores its value as given (the oracle's Vec keeps
    # casting: [1 2]).
    source: |
      (prn (vector-of :int 1 2) (vector-of :int 1.7 -1.7) (vector-of :long 1 2) (vector-of :double 1 2) (vector-of :float 1 2) (vector-of :char 97 98) (vector-of :char \a))
      (prn (vector-of :boolean true false) (vector-of :boolean 1) (vector-of :int) (vector-of :double 1/2) (vector-of :long 1.5) (vector-of :int ##NaN))
      (prn (vector-of :boolean false nil 0) (vector-of :char 97.6) (vector-of :int \a) (vector-of :byte 1.9) (vector-of :short 32767 -32768) (vector-of :int 2147483647 -2147483648))
      (prn (= (vector-of :int 1 2) [1 2]) (vector? (vector-of :int 1 2)) (map (partial vector-of :int) [1 2]) (apply vector-of :int [1 2.5]))
      (prn (vector-of :long 9.223372036854776E18 -9.223372036854776E18 9.223372036854774E18))
      (prn (conj (vector-of :int 1) 2.5))
    expected: |
      [1 2] [1 -1] [1 2] [1.0 2.0] [1.0 2.0] [\a \b] [\a]
      [true false] [true] [] [0.5] [1] [0]
      [false false true] [\a] [97] [1] [32767 -32768] [2147483647 -2147483648]
      true true ([1] [2]) [1 2]
      [9223372036854775807 -9223372036854775808 9223372036854773760]
      [1 2.5]
  - name: primitive-casts-double-float-byte-short-and-num
    # Oracle-identical (clj 1.12.6) but for two deviations: float answers a double (the
    # oracle a Float, so (float 1/3) prints 0.3333333333333333 here and 0.33333334 there,
    # which this case does not print), and the refusal texts of a cast taking a value the
    # oracle's Java cast refuses are ours (only that it signals is pinned).
    source: |
      (defn pc-msg [f] (try (pr-str (f)) (catch Exception e (ex-message e))))
      (defn pc-head [f] (first (clojure.string/split (pc-msg f) #":")))
      (defn pc-refused [f] (try (f) :no (catch Exception e :refused)))
      (prn (double 1) (double 1/2) (double 1.5) (double -3) (double ##Inf) (map double [1 2 3]) (apply double [4]))
      (prn (float 1) (float 0.5) (float 3) (float ##NaN) (map float [1 2]))
      (prn (byte 1.9) (byte -1.9) (byte 127) (byte -128) (byte \a) (byte 1/2) (byte 127.0) (byte 100N))
      (prn (short 1.9) (short 32767) (short -32768) (short \a) (short 99/2) (map short [1 2.5]) (apply byte [5]))
      (prn (num 1) (num 1.5) (num 1/2) (num nil) (map num [1 2]))
      (println (pc-msg #(byte 200)) "|" (pc-msg #(byte -129)) "|" (pc-msg #(byte 127.9)) "|" (pc-msg #(byte ##NaN)))
      (println (pc-msg #(short 70000)) "|" (pc-msg #(short -32769)) "|" (pc-msg #(short 32767.5)))
      (println (pc-head #(byte 1e20)) "|" (pc-head #(short 1e20)) "|" (pc-head #(float 1e300)) "|" (pc-head #(float -1e300)) "|" (pc-head #(float 3.4028235E38)) "|" (pc-head #(float ##Inf)))
      (println (pc-refused #(double "a")) (pc-refused #(double nil)) (pc-refused #(double \a)) (pc-refused #(float \a)) (pc-refused #(byte "a")) (pc-refused #(short nil)) (pc-refused #(num "a")) (pc-refused #(num \a)))
      (prn (vector-of :byte 1.9) (vector-of :byte 127.9) (pc-head #(vector-of :float 1e300)))
    expected: |
      1.0 0.5 1.5 -3.0 ##Inf (1.0 2.0 3.0) 4.0
      1.0 0.5 3.0 ##NaN (1.0 2.0)
      1 -1 127 -128 97 0 127 100
      1 32767 -32768 97 49 (1 2) 5
      1 1.5 1/2 nil (1 2)
      Value out of range for byte: 200 | Value out of range for byte: -129 | Value out of range for byte: 127.9 | Value out of range for byte: NaN
      Value out of range for short: 70000 | Value out of range for short: -32769 | Value out of range for short: 32767.5
      Value out of range for byte | Value out of range for short | Value out of range for float | Value out of range for float | Value out of range for float | Value out of range for float
      :refused :refused :refused :refused :refused :refused :refused :refused
      [1] [127] "Value out of range for float"
  - name: int-and-long-are-the-oracles-range-checked-casts
    # Oracle-identical (clj 1.12.6), messages included: a literal argument takes the cast
    # of its own type (a double literal's "Value out of range for int: 1.0E10"), any other
    # the object cast (longCast first, so the same double through a var is "integer
    # overflow"). Only the class of a non-number's refusal is pinned (the texts differ).
    source: |
      (defn ilc [f] (try (pr-str (f)) (catch Exception e (str (cond (instance? ArithmeticException e) "AE" (instance? IllegalArgumentException e) "IAE" :else "other") " " (ex-message e)))))
      (defn ilc-refused [f] (try (f) :no (catch Exception e :refused)))
      (def ilc-d10 1e10) (def ilc-d19 1e19) (def ilc-l 3000000000) (def ilc-r 30000000001/2) (def ilc-inf ##-Inf) (def ilc-nan ##NaN) (def ilc-big 92233720368547758080)
      (println (ilc #(long 1e19)) "|" (ilc #(long 9.223372036854776E18)) "|" (ilc #(long -9.223372036854776E18)) "|" (ilc #(long 92233720368547758080N)) "|" (ilc #(long ##NaN)) "|" (ilc #(long ##Inf)))
      (println (ilc #(int 3000000000)) "|" (ilc #(int 1e10)) "|" (ilc #(int ##Inf)) "|" (ilc #(int ##NaN)) "|" (ilc #(int -2147483648.5)) "|" (ilc #(int 99999999999999999999)))
      (println (int 2.7) (long -2.7) (int 7/2) (long -7/2) (int \a) (long \a) (int 2147483647) (int -2147483648) (long 9223372036854775807) (long -9223372036854775808) (long 1.5e18))
      (println (ilc #(int ilc-d10)) "|" (ilc #(long ilc-d19)) "|" (ilc #(int ilc-l)) "|" (ilc #(int ilc-r)) "|" (ilc #(long ilc-inf)) "|" (ilc #(long ilc-nan)) "|" (ilc #(int ilc-big)))
      (println (ilc #(doall (map int [1e10]))) "|" (ilc #(doall (map long [1e19]))) "|" (ilc #(apply int [3000000000])) "|" (map int [2.5 -2.5 1/2]) (map long [\b 7]) (apply long [9.5]))
      (println (map ilc-refused [#(int nil) #(long nil) #(int "a") #(long :k) #(apply int [1 2])]))
    expected: |
      IAE Value out of range for long: 1.0E19 | 9223372036854775807 | -9223372036854775808 | IAE Value out of range for long: 92233720368547758080 | 0 | IAE Value out of range for long: Infinity
      AE integer overflow | IAE Value out of range for int: 1.0E10 | IAE Value out of range for int: Infinity | 0 | IAE Value out of range for int: -2.1474836485E9 | IAE Value out of range for long: 99999999999999999999
      2 -2 3 -3 97 97 2147483647 -2147483648 9223372036854775807 -9223372036854775808 1500000000000000000
      AE integer overflow | IAE Value out of range for long: 1.0E19 | AE integer overflow | AE integer overflow | IAE Value out of range for long: -Infinity | 0 | IAE Value out of range for long: 92233720368547758080
      AE integer overflow | IAE Value out of range for long: 1.0E19 | AE integer overflow | (2 -2 0) (98 7) 9
      (:refused :refused :refused :refused :refused)
  - name: number-conversions-bigint-bigdec-rationalize-and-the-unchecked-casts
    # Oracle-identical (clj 1.12.6) in the values; the representation deviates (see
    # decimal-and-bigint-literals-are-plain-rationals), so a bigint prints through str and a
    # bigdec through double, and the refusal texts are ours (only that it signals is pinned).
    # bigdec of a double and rationalize read the shortest decimal the double prints as
    # (0.1 is 1/10, not the nearest ratio of its bits).
    source: |
      (defn nc-refused [f] (try (f) :no (catch Exception e :refused)))
      (prn (map #(str (bigint %)) [1 1.5 -1.5 1/2 7/2 -7/2 1e20 "123" "-45" 1N 1.5M -0.9]) (map #(str (biginteger %)) [1 1.5 7/2 "12"]) (str (apply bigint [3])))
      (prn (map #(double (bigdec %)) [1 1.5 1/2 0.1 "1.5" "0.25" "1e3" "-.5" 2N 1e20 1e-5 123.456 -7/8 3/20]) (apply double [(bigdec 1)]))
      (prn (rationalize 0.5) (rationalize 1) (rationalize 1/2) (rationalize 0.1) (rationalize 1.5) (rationalize nil) (str (rationalize 3.0)) (rationalize 1e-5) (rationalize 0.3333333333333333) (rationalize -0.25) (rationalize 123.456) (str (rationalize 1e20)) (rationalize 1.5M) (map rationalize [0.5 2]))
      (prn (numerator 1/2) (denominator 1/2) (numerator 6/4) (denominator -3/6) (numerator -3/6) (map numerator [1/2 3/4]) (map denominator [1/2 3/4]) (apply numerator [5/3]))
      (prn (unchecked-int 1) (unchecked-int 2.7) (unchecked-int -2.7) (unchecked-int 3000000000) (unchecked-int -3000000000) (unchecked-int 2147483648) (unchecked-int 1/2) (unchecked-int \a) (unchecked-int 1e20) (unchecked-int -1e20) (unchecked-int ##NaN) (unchecked-int ##Inf) (unchecked-int 100000000000000000000) (map unchecked-int [4294967297 5]))
      (prn (unchecked-long 1) (unchecked-long 2.7) (unchecked-long 9223372036854775807) (unchecked-long 9223372036854775808) (unchecked-long 1e20) (unchecked-long -1e20) (unchecked-long ##NaN) (unchecked-long 7/2) (unchecked-long -9223372036854775809) (unchecked-long 100000000000000000000) (map unchecked-long [18446744073709551617 5]))
      (prn (unchecked-short 1) (unchecked-short 70000) (unchecked-short 32768) (unchecked-short -32769) (unchecked-short 2.7) (unchecked-short 1e20) (unchecked-short 1/2) (unchecked-short 3000000000) (map unchecked-short [65537 5]))
      (prn (unchecked-byte 200) (unchecked-byte 128) (unchecked-byte -129) (unchecked-byte 127.9) (unchecked-byte 1e20) (unchecked-byte 3000000000) (unchecked-byte 1/2) (unchecked-byte -1.9) (map unchecked-byte [200 1]))
      (prn (unchecked-double 1) (unchecked-double 1/2) (unchecked-double 1.5) (unchecked-double 100000000000000000000) (unchecked-float 1) (unchecked-float 1/2) (unchecked-float 1.5) (unchecked-float 1e300) (unchecked-float -1e300) (unchecked-float ##NaN) (map unchecked-double [1 2]) (map unchecked-float [1 2]))
      (prn (unchecked-char 97) (unchecked-char 97.5) (unchecked-char \a) (int (unchecked-char 65537)) (int (unchecked-char -1)) (int (unchecked-char 1e20)) (int (unchecked-char 1/2)) (map unchecked-char [98 99]) (apply unchecked-char [100]))
      (prn (map nc-refused [#(bigint nil) #(bigint \a) #(bigint "a") #(bigint ##NaN) #(bigint ##Inf) #(biginteger nil) #(bigdec nil) #(bigdec \a) #(bigdec ##NaN) #(bigdec 1/3) #(bigdec "a") #(rationalize "a") #(rationalize ##NaN) #(rationalize ##Inf) #(numerator 4) #(denominator 4) #(numerator 1.5) #(numerator nil) #(denominator "a")]))
      (prn (map nc-refused [#(unchecked-int nil) #(unchecked-int "a") #(unchecked-long \a) #(unchecked-long nil) #(unchecked-short \a) #(unchecked-byte \a) #(unchecked-byte nil) #(unchecked-double \a) #(unchecked-double nil) #(unchecked-float \a) #(unchecked-char nil) #(unchecked-char "a")]))
    expected: |
      ("1" "1" "-1" "0" "3" "-3" "100000000000000000000" "123" "-45" "1" "1" "0") ("1" "1" "3" "12") "3"
      (1.0 1.5 0.5 0.1 1.5 0.25 1000.0 -0.5 2.0 1.0E20 1.0E-5 123.456 -0.875 0.15) 1.0
