  - name: clojure-format-args
    # format over Java directives: %s converts like str (nil spells "null", like
    # String/valueOf), %b the boolean spelling, numbers the matching directive.
    source: |
      (println (format "%s=%d" :a 5))
      (println (format "%s" nil))
      (println (format "%5s|%.2f|%x|%b|%%" "ab" 3.14159 255 nil))
      (println (format "a%sb" [1 2]))
    expected: |
      :a=5
      null
         ab|3.14|ff|false|%
      a[1 2]b
  - name: metadata-is-parsed-and-dropped
    # ^:private/^:dynamic/^{...}/defn-/type hints parse and drop: reader metadata
    # on a name or a local never affects dispatch, so every shape below answers
    # its bare value; with-meta answers a copy that prints like the original.
    source: |
      (defn- double-it [x] (* x 2))
      (println (double-it 21))
      (def ^:private secret 7)
      (println secret)
      (def ^{:doc "kept"} kept 11)
      (println kept)
      (defn hint [^String s] s)
      (println (hint "s"))
      (println (with-meta [1 2] {:tag :x}))
      (println (hint ^String (str "a" "b")))
    expected: |
      42
      7
      11
      s
      [1 2]
      ab
  - name: defstruct-struct-and-struct-map
    # A defstruct holds its key vector; struct pairs keys with values (missing
    # values are nil, too many signal), struct-map seeds the same keys. Only
    # single-key reads print: multi-entry map order is unspecified.
    source: |
      (defstruct acct :id :balance)
      (println (:id (struct acct 1 100)))
      (println (:balance (struct acct 2)))
      (println (:balance (struct-map acct :id 9)))
      (println (:id (struct-map acct :id 9)))
      (println (try (struct acct 1 2 3) (catch Exception e :too-many)))
    expected: |
      1
      nil
      nil
      9
      :too-many
  - name: defonce-keeps-its-root
    # defonce is def unless bound: the first evaluation wins, a reload keeps it.
    source: |
      (defonce dict ["a" "b"])
      (println dict)
      (defonce dict ["c"])
      (println dict)
      (def red 1)
      (defonce red 2)
      (println red)
      (defonce fresh)
      (println fresh)
    expected: |
      [a b]
      [a b]
      1
      nil
  - name: refs-transact-singly
    # The chat.clj slice: a validated ref altered and commuted in transactions,
    # ref-set and ensure inside one, every verb refused outside one. Commute runs
    # once here (the oracle may run its function twice); Validators run, retries
    # do not -- the documented single-threaded deviation.
    source: |
      (def room (ref [] :validator (fn [msgs] (<= (count msgs) 3))))
      (dosync (alter room (fn [m x] (conj m x)) :hi))
      (println @room)
      (dosync (commute room (fn [m x] (conj m x)) :yo) (alter room (fn [m x] (conj m x)) :bye))
      (println @room)
      (println (try (dosync (alter room (fn [m x] (conj m x)) :full)) (catch Exception e :rejected)))
      (println @room)
      (def ref-count (ref 0))
      (dosync (alter ref-count inc) (ref-set ref-count 41) (ensure ref-count))
      (println @ref-count)
      (println (try (alter ref-count inc) (catch Exception e :no-txn)))
      (println (try (ref-set ref-count 0) (catch Exception e :no-txn)))
      (println (try (ensure ref-count) (catch Exception e :no-txn)))
      (println (dosync (ensure ref-count) :ok))
    expected: |
      [:hi]
      [:hi :yo :bye]
      :rejected
      [:hi :yo :bye]
      41
      :no-txn
      :no-txn
      :no-txn
      :ok
  - name: binding-rebinds-dynamic-vars
    # The concurrency.clj slice (without the sleeps): ^:dynamic vars rebind with
    # dynamic extent -- a callee sees the binding, the root returns after -- while
    # inits run sequentially like let.
    source: |
      (def ^:dynamic *verbose* false)
      (def ^:dynamic *tag* :a)
      (def ^:dynamic *level* 0)
      (defn status [] (if *verbose* :loud :quiet))
      (println (status))
      (println (binding [*verbose* true] (status)))
      (println (status))
      (println (binding [*verbose* true] (binding [*verbose* false] (status))))
      (println (binding [*verbose* true *tag* :b] (list (status) *tag*)))
      (println (list (status) *tag*))
      (println (binding [*level* 1 *tag* *level*] *tag*))
      (println *tag*)
    expected: |
      :quiet
      :loud
      :quiet
      :quiet
      (:loud :b)
      (:quiet :a)
      1
      :a
  - name: binding-rebinds-dynamic-defn
    # The concurrency.clj demo-memoize shape: a ^:dynamic defn holds its function
    # in the value cell (the defun stays for recur and the arity helpers), so
    # binding rebinds it with dynamic extent -- a callee sees the binding, the
    # root returns after -- for plain values and memoized ones alike, every arity.
    # A defn without the marker stays refused (ClojureLoweringTest pins the
    # refusal: the oracle reports it at run time, here it is a named refusal).
    source: |
      (defn ^:dynamic slow-double [n] (* n 2))
      (defn calls-slow-double [] (slow-double 21))
      (println (calls-slow-double))
      (println (binding [slow-double (memoize slow-double)] (calls-slow-double)))
      (println (calls-slow-double))
      (println (binding [slow-double (fn [n] 7)] (slow-double 21)))
      (println (binding [slow-double (memoize slow-double)] [(slow-double 21) (slow-double 21)]))
      (defn ^:dynamic madd ([x] (madd x 1)) ([x y] (+ x y)))
      (println (madd 5))
      (println (binding [madd (memoize madd)] (madd 5 6)))
    expected: |
      42
      42
      42
      7
      [42 42]
      6
      11
  - name: set-bang-assigns-thread-bound-vars
    # set! of a ^:dynamic var sets the thread-local value inside an
    # enclosing binding (the binding-depth counter beside the var says whether
    # it is bound, so a callee outside the binding's lexical extent still sets
    # it) and signals Can't change/establish root binding outside one, after
    # the value evaluates; a nested binding restores the outer value. A
    # clojure.main-bound compiler flag answers the value with no effect here
    # (the instant.clj line-13 shape). Every line matches the oracle (Clojure
    # CLI 1.12) byte for byte.
    source: |
      (def ^:dynamic *d* 1)
      (println (binding [*d* 5] (set! *d* 2)))
      (println *d*)
      (println (binding [*d* 5] (set! *d* 2) *d*))
      (println (try (set! *d* 9) (catch Exception e :root-binding)) *d*)
      (defn read-dyn [] *d*)
      (defn write-dyn [v] (set! *d* v))
      (println (binding [*d* 5] (write-dyn 6) (read-dyn)))
      (println (read-dyn))
      (println (binding [*d* 5] (binding [*d* 6] (write-dyn 7)) (read-dyn)))
      (println (set! *warn-on-reflection* true))
      (println (set! *unchecked-math* false))
    expected: |
      2
      1
      2
      :root-binding 1
      6
      1
      5
      true
      false
  - name: a-local-named-like-a-dynamic-var-stays-lexical
    # A local spelled like a ^:dynamic var (a parameter of every arity, a let,
    # loop, letfn, for, doseq, dotimes, catch or if-let binding, a destructured
    # name, a deftype field) is its own lexical local: a function called in its
    # scope reads the var, the local reads its own value, and a binding inside it
    # rebinds the var. That holds for a local written above the var's definition
    # (the special proclamation is program-wide). A local *out* is a plain value,
    # not the stream. Every line matches the oracle (Clojure CLI 1.12) byte for
    # byte.
    source: |
      (declare lexdyn-show)
      (defn lexdyn-early [*lexdyn*] [(lexdyn-show) *lexdyn*])
      (def ^:dynamic *lexdyn* 1)
      (defn lexdyn-show [] *lexdyn*)
      (defn lexdyn-f [*lexdyn*] (lexdyn-show))
      (println (lexdyn-f 2) (lexdyn-early 3))
      (println (let [*lexdyn* 5] (lexdyn-show)) (binding [*lexdyn* 7] (lexdyn-show)))
      (println ((fn [*lexdyn*] (lexdyn-show)) 3))
      (defn lexdyn-multi ([*lexdyn*] (lexdyn-show)) ([a *lexdyn*] [a (lexdyn-show) *lexdyn*]))
      (println (lexdyn-multi 2) (lexdyn-multi 3 4))
      (println (let [[*lexdyn* b] [5 6]] [(lexdyn-show) *lexdyn* b]))
      (println (let [{:keys [*lexdyn*]} {:*lexdyn* 8}] [(lexdyn-show) *lexdyn*]))
      (println (loop [*lexdyn* 0 acc []] (if (< *lexdyn* 2) (recur (inc *lexdyn*) (conj acc (lexdyn-show) *lexdyn*)) acc)))
      (println (letfn [(g [*lexdyn*] (lexdyn-show))] (g 9)))
      (println (for [*lexdyn* [10 11]] [(lexdyn-show) *lexdyn*]))
      (doseq [*lexdyn* [12]] (println (lexdyn-show) *lexdyn*))
      (dotimes [*lexdyn* 1] (println (lexdyn-show) *lexdyn*))
      (println (try (throw (ex-info "e" {})) (catch Exception *lexdyn* (lexdyn-show))))
      (println (if-let [*lexdyn* 13] [(lexdyn-show) *lexdyn*] :no))
      (println (let [*lexdyn* 15] (binding [*lexdyn* 16] [(lexdyn-show) *lexdyn*])))
      (println (map (fn [*lexdyn*] (lexdyn-show)) [1 2]))
      (defprotocol LexdynP (lexdyn-pm [this]))
      (deftype LexdynT [*lexdyn*] LexdynP (lexdyn-pm [this] [(lexdyn-show) *lexdyn*]))
      (println (lexdyn-pm (->LexdynT 6)))
      (println (let [*out* 5] [*out* (with-out-str (print "p"))]))
    expected: |
      1 [1 3]
      1 7
      1
      1 [3 1 4]
      [1 5 6]
      [1 8]
      [1 0 1 1]
      1
      ([1 10] [1 11])
      1 12
      1 0
      1
      [1 13]
      [16 15]
      (1 1)
      [1 6]
      [5 p]
  - name: agents-send-synchronously
    # The pi.clj slice: two agents count a partitioned sample, await rendezvous,
    # and the estimate combines deterministically. Sends apply at once (there is
    # no thread pool, so async ordering is out); *agent* is bound while one runs.
    source: |
      (defn inside? [[x y]] (<= (+ (* x x) (* y y)) 1))
      (def left (agent 0))
      (def right (agent 0))
      (send left (fn [n] (+ n (count (filter inside? [[0 0] [1 1] [0 1]])))))
      (send-off right (fn [n] (+ n (count (filter inside? [[1 0] [2 2]])))))
      (await left right)
      (println (list @left @right (/ (* 4 (+ @left @right)) 5)))
      (def agent-seen (atom nil))
      (def probe (agent 0))
      (println @(send probe + 41))
      (send probe (fn [_] (reset! agent-seen *agent*) 1))
      (println (list @probe (if @agent-seen :bound :unbound) (= @agent-seen probe)))
      (println (list (await probe) (shutdown-agents)))
    expected: |
      (2 1 12/5)
      41
      (1 :bound true)
      (nil nil)
  - name: with-out-str-captures-output-and-time-answers
    # with-out-str binds *standard-output* to a string stream (never a literal
    # with-output-to-string); time reports Elapsed time and answers its value.
    # Only the value and the report prefix pin: the millisecond count never is.
    source: |
      (println (with-out-str (print 1) (pr :a)))
      (println (subs (with-out-str (time (+ 1 2))) 0 13))
      (with-out-str (def timed (time (+ 40 2))))
      (println timed)
    expected: |
      1:a
      Elapsed time:
      42
  - name: streams-write-through-out-and-import-answers-nil
    # *out* is *standard-output*: .write prints through princ on streams, .flush
    # finishes them, on every backend. import wires names and defines nothing.
    source: |
      (println (with-out-str (. *out* write "hi") (. *out* flush) (pr :!)))
      (println (do (import 'java.util.ArrayList) :ok))
    expected: |
      hi:!
      :ok
  - name: make-array-aget-aset-and-alength-round-trip
    # The book's interop.clj painstakingly-create-array shape: the class spells the
    # element type and is ignored -- every array here is general. Only the Clojure
    # spellings are new, so this case runs on all four backends.
    source: |
      (let [a (make-array String 3)] (aset a 0 "x") (println (aget a 0)) (println (alength a)))
      (let [b (make-array String 2 2)] (aset b 0 1 "y") (println (aget b 0 1)) (println (alength b)))
    expected: |
      x
      3
      y
      2
  - name: in-is-bound-to-standard-input
    # *in* is *standard-input*: bound on every backend. Reading from a rebound *in*
    # is pinned in ClojureInteropTest instead -- never real stdin in either place.
    source: |
      (println (nil? *in*))
    expected: |
      false
  - name: records-are-maps-with-a-type-tag
    # a record is a (:C%RECORD tag fields table class) wrapper over the same
    # equal table every map uses, so the map verbs read through it on all four
    # backends; it prints as its literal, #ns.R{...}, like the oracle --
    # here #runs_ns.Rock, the namespace an earlier case switched to.
    # (assoc rock :hard true) keeps the type; (dissoc r :hard) of the extension
    # key keeps it while (dissoc r :mass) of the base field drops to a plain map.
    source: |
      (defrecord Rock [mass])
      (def rock (->Rock 7))
      (println (= rock (->Rock 7)))
      (println (= rock {:mass 7}))
      (println (get rock :mass))
      (println (:mass rock))
      (println (contains? rock :mass))
      (println (count rock))
      (println (keys rock))
      (println (vals rock))
      (println (class rock))
      (println (instance? Rock rock))
      (println (instance? Rock {:mass 7}))
      (println (get (assoc rock :hard true) :hard))
      (println (class (assoc rock :hard true)))
      (println (get (map->Rock {:mass 1 :color :red}) :color))
      (println (get (map->Rock {:mass 1}) :color :gone))
      (println (Rock. 42))
      (def r2 (dissoc (assoc rock :hard true) :hard))
      (println (class r2))
      (println (get r2 :hard :gone))
      (def r3 (dissoc rock :mass))
      (println r3)
      (println (get (merge rock {:hard true}) :hard))
      (println (class (merge rock {:hard true})))
