  - name: primitive-casts-double-float-byte-short-and-num
    # Oracle-identical (clj 1.12.6) but for two deviations: float answers a double (the
    # oracle a Float, so (float 1/3) prints 0.3333333333333333 here and 0.33333334 there,
    # which this case does not print), and the refusal texts of a cast taking a value the
    # oracle's Java cast refuses are ours (only that it signals is pinned).
