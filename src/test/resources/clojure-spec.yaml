      (prn (sorted-set-by compare '(1 2)) (conj (sorted-set-by >) 1 3 2) (assoc (sorted-map-by >) 1 :a 2 :b))
    expected: |
      {3 :c, 2 :b, 1 :a} #{3 2 1} {:a 2, :b 1} {:c 3, :b 1, :a 2}
      #{"x" "ab"} {"ab" 2}
      #{1} #{1 2 3} #{3 2 1} {2 :b, 1 :a}
      #{(1 2)} #{3 2 1} {2 :b, 1 :a}
  - name: subseq-and-rsubseq-walk-a-bounded-range
    # Oracle-identical (clj 1.12.6) but for the last line: a > or >= test (a < or <=
    # for rsubseq) starts at the key, any other walks from the start while it holds,
    # each in the comparator's order; a test passed as a value is recognized by how it
    # answers. Where nothing passes after a walk from the start the oracle prints its
    # empty lazy seq, (), and here nil, like every strict seq verb.
    source: |
      (prn (subseq (sorted-set 1 2 3) > 1) (subseq (sorted-set 1 2 3) >= 2) (subseq (sorted-set 1 2 3) < 3) (subseq (sorted-set 1 2 3) <= 2) (subseq (sorted-set 1 2 3) > 5))
      (prn (subseq (sorted-set 1 2 3 4 5) > 1 < 4) (subseq (sorted-set 1 2 3 4 5) >= 2 <= 4) (subseq (sorted-set 1 2 3 4 5) > 10 < 20))
      (prn (rsubseq (sorted-set 1 2 3) < 3) (rsubseq (sorted-set 1 2 3) > 1) (rsubseq (sorted-set 1 2 3) <= 2) (rsubseq (sorted-set 1 2 3 4 5) > 1 < 4) (rsubseq (sorted-set 1 2 3 4 5) >= 2 <= 4))
      (prn (subseq (sorted-map :a 1 :b 2 :c 3) > :a) (rsubseq (sorted-map :a 1 :b 2 :c 3) < :c) (subseq (sorted-set-by > 1 2 3) > 2) (subseq (sorted-set-by > 1 2 3) < 2))
      (prn (let [t >] (subseq (sorted-set 1 2 3) t 1)) (subseq (sorted-set) > 1) (subseq (sorted-set 1 2 3) > 1.5) (apply subseq [(sorted-set 1 2 3) >= 2]) (apply rsubseq [(sorted-set 1 2 3) < 3]))
      (prn (subseq (sorted-set 1 2 3) < 0) (rsubseq (sorted-set 1 2 3) > 5))
    expected: |
      (2 3) (2 3) (1 2) (1 2) nil
      (2 3) (2 3 4) nil
      (2 1) (3 2) (2 1) (3 2) (4 3 2)
      ([:b 2] [:c 3]) ([:b 2] [:a 1]) (1) (3)
      (2 3) nil (2 3) (2 3) (2 1)
      nil nil
  - name: sorted-collections-and-the-type-predicates
    # Oracle-identical (clj 1.12.6) but for class: here it answers the kind keyword (a
