      (defrecord ViNsR [] ViNsP (vi-ns-m [_] 2))
      (ns vi-use
        (:import [java.io File] [java.util Map List] (java.util TreeMap) [vi_ns.core ViNsP]))
      (println (instance? File "x") (instance? Map {}) (instance? Map [1]) (instance? List [1]) (instance? TreeMap {}))
      (println (instance? ViNsP (vi-ns.core/->ViNsR)) (instance? ViNsP {}))
      (import '[java.util Set] '(java.util Collection))
