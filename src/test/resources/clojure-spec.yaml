  - name: clojure-xml-refuses-a-malformed-document-in-the-parsers-words
    # A document that is not well-formed is the oracle's SAXParseException with its
    # parser's message, an encoding no JDK charset names its UnsupportedEncodingException.
    # Oracle-identical (clj 1.12.6, 2026-10-09), on all four backends.
    source: |
      (ns xml-errors (:require [clojure.xml :as xml] [clojure.java.io :as io]))
      (def xml-bad (str "/tmp/rontolisp-xml-bad-" (rand-int 1000000000) "-" (rand-int 1000000000) ".xml"))
      (defn refusal [text]
        (spit xml-bad text)
        (try (xml/parse xml-bad)
             (catch org.xml.sax.SAXParseException e (ex-message e))
             (catch java.io.UnsupportedEncodingException e [:encoding (ex-message e)])))
      (doseq [text ["<a>" "<a></b>" "" "<a x='1' x='2'/>" "<a>&foo;</a>" "<a/><b/>" "text" "<a x=1/>" "<a><</a>"
                    "<a b=\"1\"c=\"2\"/>" "<a b=\"<\"/>" "<a>]]></a>" "<a>&#xZZ;</a>" "<a>&amp</a>" "<a><!-- -- --></a>"
                    "<a b/>" " <?xml version=\"1.0\"?><a/>" "</a>" "<a/>x" "<a>&#0;</a>" "<a>\u0001</a>" "<a x='\u0001'/>"
                    "<!DOCTYPE a [<!ENTITY x '&y;'><!ENTITY y '&x;'>]><a>&x;</a>" "<a>&#65 </a>"
                    "<?xml version='2.0'?><a/>" "<?xml encoding='UTF-8'?><a/>" "<!DOCTYPE a><!DOCTYPE a><a/>"
                    "<a><? x?></a>" "<?xml version='1.0' encoding='bogus'?><a/>"]]
        (prn (refusal text)))
      (io/delete-file xml-bad)
      (in-ns 'user)
    expected: |
      "XML document structures must start and end within the same entity."
      "The element type \"a\" must be terminated by the matching end-tag \"</a>\"."
      "Premature end of file."
      "Attribute \"x\" was already specified for element \"a\"."
      "The entity \"foo\" was referenced, but not declared."
      "The markup in the document following the root element must be well-formed."
      "Content is not allowed in prolog."
      "Open quote is expected for attribute \"x\" associated with an  element type  \"a\"."
      "The content of elements must consist of well-formed character data or markup."
      "Element type \"a\" must be followed by either attribute specifications, \">\" or \"/>\"."
      "The value of attribute \"b\" associated with an element type \"a\" must not contain the '<' character."
      "The character sequence \"]]>\" must not appear in content unless used to mark the end of a CDATA section."
      "A hexadecimal representation must immediately follow the \"&#x\" in a character reference."
      "The reference to entity \"amp\" must end with the ';' delimiter."
      "The string \"--\" is not permitted within comments."
      "Attribute name \"b\" associated with an element type \"a\" must be followed by the ' = ' character."
      "The processing instruction target matching \"[xX][mM][lL]\" is not allowed."
      "The markup in the document preceding the root element must be well-formed."
      "Content is not allowed in trailing section."
      "Character reference \"&#0\" is an invalid XML character."
      "An invalid XML character (Unicode: 0x1) was found in the element content of the document."
      "An invalid XML character (Unicode: 0x1) was found in the value of attribute \"x\" and element is \"a\"."
      "Recursive entity reference \"x\". (Reference path: x -> y -> x),"
      "The character reference must end with the ';' delimiter."
      "XML version \"2.0\" is not supported, only XML 1.0 is supported."
      "The version is required in the XML declaration."
      "Already seen doctype."
      "The processing instruction must begin with the name of the target."
      [:encoding "bogus"]
