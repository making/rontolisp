      (println [(swr UnsupportedOperationException (count :a)) (swr UnsupportedOperationException (count #'swr-a)) (swr UnsupportedOperationException (count (reduced 1))) (swr UnsupportedOperationException (count *ns*)) (swr UnsupportedOperationException (count swr-unbound)) (swr UnsupportedOperationException (count false)) (swr UnsupportedOperationException (count swr-a)) (swr UnsupportedOperationException (count (SwrT. 1)))])
      (println [(swr UnsupportedOperationException (nth :a 0)) (swr UnsupportedOperationException (nth 5 0)) (swr UnsupportedOperationException (nth #'swr-a 0 :d)) (swr UnsupportedOperationException (nth {:a 1} 0)) (swr UnsupportedOperationException (nth #{1} 0)) (swr UnsupportedOperationException (nth (SwrR. 1) 0)) (swr UnsupportedOperationException (nth swr-a 0)) (swr UnsupportedOperationException (let [[x] {:a 1}] x))])
      (println [(swr IllegalArgumentException (contains? :a 1)) (swr IllegalArgumentException (contains? 5 1)) (swr IllegalArgumentException (contains? false 1)) (swr IllegalArgumentException (contains? '(1 2) 1)) (swr IllegalArgumentException (contains? (map inc [1]) 0)) (swr IllegalArgumentException (contains? 'a 1)) (swr IllegalArgumentException (contains? swr-a 1)) (swr IllegalArgumentException (contains? (reduced 1) 1))])
      (println [(count (SwrR. 1)) (empty? (SwrR. 1)) (contains? (SwrR. 1) :x) (contains? nil 1) (contains? [1 2] :a) (contains? "ab" 5) (contains? "ab" 1) (nth nil 0 :d) (nth "abc" 1) (nth (map inc [1 2]) 1) (second (sorted-map 1 2 3 4)) (second #{7}) (count (sorted-set 1 2)) (empty? (lazy-seq nil))])
