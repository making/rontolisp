      (println (keyword "a/b"))
      (println (keyword 'a/b))
      (println (keyword 1))
      (println (keyword nil))
      (println (keyword nil "b"))
      (println (map keyword ["x" "y"]))
      (println (apply keyword ["a" "b"]))
