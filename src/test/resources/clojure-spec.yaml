  - name: clojure-pprint-dispatch-logical-blocks-write-and-print-table
    # simple-dispatch takes a method per record class, *print-pprint-dispatch* a function
    # whose logical blocks take fill, miser, mandatory and per-line-prefix newlines and
    # indentation like the oracle's; write, the radix printing (its negative-number
    # quirks included) and print-table answer alike. Every line is the oracle's
    # (clj 1.12.6), on all four backends.
    source: |
      (ns pp-api (:require [clojure.pprint :as pp :refer [pprint]]))
      (defrecord PPoint [x y])
      (pprint (->PPoint 1 [2 3]))
      (defmethod pp/simple-dispatch PPoint [p] (print (str "<" (:x p) "," (:y p) ">")))
      (pprint [(->PPoint 1 2) (->PPoint 3 4)])
      (pp/with-pprint-dispatch (fn [x] (if (number? x) (print (str "#" x)) (pp/simple-dispatch x))) (pprint [1 [2 "s"]]))
      (println (pp/write [1 2 3] :stream nil) (pp/write (vec (range 12)) :stream nil :right-margin 10 :length 3))
      (pp/write {:a 1} :pretty false)
      (println)
      (prn (with-out-str (pprint "x")) (with-out-str (pprint {:k "v"} *out*)))
      (defn fill-dispatch [x]
        (if (sequential? x)
          (pp/pprint-logical-block :prefix "<<" :suffix ">>"
            (pp/print-length-loop [s (seq x)]
              (when s
                (pp/write-out (first s))
                (when (next s) (print " ") (pp/pprint-newline :fill) (recur (next s))))))
          (pr x)))
      (binding [pp/*print-right-margin* 20] (pp/with-pprint-dispatch fill-dispatch (pprint (range 25))))
      (binding [pp/*print-right-margin* 20 pp/*print-miser-width* nil] (pp/with-pprint-dispatch fill-dispatch (pprint (range 25))))
      (defn per-line [x]
        (pp/pprint-logical-block :per-line-prefix ";; "
          (doseq [y x] (pr y) (pp/pprint-newline :mandatory))))
