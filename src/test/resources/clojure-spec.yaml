      (println (instance? B13Rock {:mass 7}))
      (println (get (assoc b13-r :hard true) :hard))
      (println (class (assoc b13-r :hard true)))
      (println (get (map->B13Rock {:mass 1 :color :red}) :color))
      (println (get (map->B13Rock {:mass 1}) :color :gone))
      (println (B13Rock. 42))
      (def b13-r2 (dissoc (assoc b13-r :hard true) :hard))
      (println (class b13-r2))
      (println (get b13-r2 :hard :gone))
      (def b13-r3 (dissoc b13-r :mass))
      (println b13-r3)
      (println (get (merge b13-r {:hard true}) :hard))
      (println (class (merge b13-r {:hard true})))
      (println (class (merge {:hard true} b13-r)))
      (println (get (merge-with + b13-r {:mass 10}) :mass))
      (println (class (merge-with + b13-r {:mass 10})))
      (println (get ((fn [b33-f] (b33-f + b13-r {:mass 10})) merge-with) :mass))
      (println (class ((fn [b33-f] (b33-f + b13-r {:mass 10})) merge-with)))
      (println (class ((fn [b33-f] (b33-f + {:mass 10} b13-r)) merge-with)))
      (println (class (merge nil b13-r)))
      (println (get (merge nil b13-r) :mass))
      (println (class ((fn [b23-f] (b23-f nil b13-r)) merge)))
      (println (class (merge-with + nil b13-r {:mass 10})))
      (println (get (merge-with + nil b13-r {:mass 10}) :mass))
      (println (class ((fn [b33-f] (b33-f + nil b13-r {:mass 10})) merge-with)))
      (println (merge-with + nil nil))
