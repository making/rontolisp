      (prn (codec/form-encode {:a #{"y" "x"}}) (codec/form-encode nil) (codec/form-encode :k) (codec/form-encode 12))
      (prn (codec/form-decode-str "a+b%20c") (codec/form-decode-str "%zz") (codec/form-decode-str "plain"))
