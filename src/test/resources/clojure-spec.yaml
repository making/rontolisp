    source: |
      (println (char 97))
      (println (char \a))
      (println (= (char 97) \a))
      (println (int (char 97)))
      (println (int \a) (long \a))
      (println (map char [97 98]))
      (println (char 97.5))
      (println (try (char "a") (catch Exception e :refused)))
    expected: |
      a
      a
      true
      97
      97 97
      (a b)
      a
      :refused
  - name: name-reads-past-the-slash
    # name answers a string itself, and a keyword's or symbol's spelling past the
    # first slash (the whole spelling when none); anything else signals.
    source: |
      (println (name :foo/bar))
      (println (name :foo))
      (println (name "hello"))
      (println (name "a/b"))
      (println (name 'foo/bar))
      (println (name 'foo))
      (println (map name [:a/b :c "s"]))
      (println (try (name 1) (catch Exception e :refused)))
    expected: |
      bar
      foo
      hello
      a/b
      bar
      foo
      (b c s)
      :refused
  - name: namespace-reads-before-the-slash
    # namespace answers the spelling before the first slash, nil when absent;
    # strings and anything else signal, like the oracle.
    source: |
      (println (namespace :foo/bar))
      (println (namespace :foo))
      (println (namespace 'a/b))
      (println (namespace 'a))
      (println (map namespace [:a/b :c]))
      (println (try (namespace "a/b") (catch Exception e :refused)))
    expected: |
      foo
      nil
      a
      nil
      (a nil)
      :refused
  - name: keyword-builds-colon-spellings
    # keyword is itself for a keyword, the demangled spelling for a symbol, the
