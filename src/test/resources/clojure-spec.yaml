      (prn (meta (Tagged. 1 {:a 1})) (meta (with-meta (Tagged. 1 nil) {:b 2})) (sort (meta (vary-meta (Tagged. 1 {:a 1}) assoc :c 3))) (instance? clojure.lang.IMeta (Tagged. 1 nil)))
