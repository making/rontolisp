  - name: assert-reads-the-assert-flag-where-it-expands
    # Oracle-identical (clj 1.12.6): assert reads *assert* when it expands, so a top-level
    # set! of it to a literal switches off every assert that follows -- its test and
    # message unevaluated -- and none before it; a binding around an expanded assert does
    # not.
    source: |
      (defn asf-checked [] (assert false "early"))
      (set! *assert* false)
      (prn (assert false) (assert (do (println "unevaluated") false) "m") *assert*)
      (defn asf-unchecked [] (assert false))
      (prn (asf-unchecked) (try (asf-checked) (catch AssertionError e (ex-message e))))
      (set! *assert* nil)
      (prn (assert false))
      (set! *assert* true)
      (prn (try (assert false) (catch AssertionError e (ex-message e))) (asf-unchecked))
      (prn (try (binding [*assert* false] (assert false)) (catch AssertionError e (ex-message e))))
    expected: |
      nil nil false
      nil "Assert failed: early\nfalse"
      nil
      "Assert failed: false" nil
      "Assert failed: false"
  - name: with-in-str-binds-in-to-the-string-and-read-line-reads-it
    # Oracle-identical (clj 1.12.6): with-in-str binds *in* to a reader over the string
    # (thread-bound inside), which read-line (nil past the end, a function value too),
    # read and .read take from.
    source: |
      (prn (with-in-str "one\ntwo" [(read-line) (read-line) (read-line)]))
      (prn (with-in-str "(+ 1 2) :k" [(read) (read)]) (with-in-str "ab" [(.read *in*) (.read *in*)]))
      (prn (with-in-str "x" (thread-bound? #'*in*)) (thread-bound? #'*in*) (with-in-str "x"))
      (prn (with-in-str "p\nq" (doall (repeatedly 2 read-line))))
    expected: |
      ["one" "two" nil]
      [(+ 1 2) :k] [97 98]
      true false nil
      ("p" "q")
  - name: unbound-vars-answer-the-unbound-root
    # Oracle-identical (clj 1.12.6): a declared-never-defined name and a value-less def are
    # unbound vars -- deref and the name answer the unbound root (truthy, str "Unbound: #'v"),
    # calling it signals, bound? is false until a definition binds it, defonce binds it. A
    # value-less def or declare leaves a bound root alone; declare adds :declared to the
    # metadata and a ^:dynamic declare rebinds. The root prints #<Unbound: #'v> (the
    # oracle's #object carries a hash).
    source: |
      (declare ub-y)
      (def ub-v #'ub-y)
      (prn (bound? #'ub-y) (bound? ub-v) (var? ub-v) ub-v (str @ub-v) (str ub-y) (bound?))
      (prn (= @ub-v @ub-v) (= @ub-v ub-y) (nil? @ub-v) (if ub-y :truthy :falsy) (bound? ub-v 1) (try (bound? 1 ub-v) (catch Exception e :refused)) (map bound? [ub-v]))
      (prn (try (ub-y 1) (catch Exception e (ex-message e))) (try (#'ub-y) (catch Exception e (ex-message e))) (try (@ub-v 1 2) (catch Exception e (ex-message e))))
      (prn (:declared (meta #'ub-y)) (:name (meta ub-v)))
      (def ub-z)
      (prn (bound? #'ub-z) (str ub-z) (try (ub-z) (catch Exception e (ex-message e))))
      (defonce ub-z 9)
      (prn ub-z (bound? #'ub-z))
      (def ub-w 1)
      (def ub-w)
      (declare ub-w)
      (prn ub-w (bound? #'ub-w) (:declared (meta #'ub-w)))
      (declare ub-q)
      (defn ub-rq [] ub-q)
      (prn (bound? #'ub-q) (str (ub-rq)) (:declared (meta #'ub-q)))
      (def ub-q 7)
      (prn (bound? #'ub-q) (ub-rq) (:declared (meta #'ub-q)))
      (defmacro ub-m [] 1)
      (declare ub-f)
      (defn ub-g [x] (ub-f x))
      (defn ub-f [x] (* x 2))
      (prn (bound? #'ub-m #'ub-g #'ub-f) (ub-g 4))
      (declare ^:dynamic *ub-d*)
      (prn (bound? #'*ub-d*) (thread-bound? #'*ub-d*))
      (binding [*ub-d* 2] (prn *ub-d* (bound? #'*ub-d*) (thread-bound? #'*ub-d*)))
      (def ^:dynamic *ub-e*)
      (prn (bound? #'*ub-e*))
      (binding [*ub-e* 3] (prn *ub-e* (bound? #'*ub-e*)))
      (prn (bound? #'*ub-e*) (str *ub-e*))
    expected: |
      false false true #'reading/ub-y "Unbound: #'reading/ub-y" "Unbound: #'reading/ub-y" true
      true true false :truthy false :refused (false)
      "Attempting to call unbound fn: #'reading/ub-y" "Attempting to call unbound fn: #'reading/ub-y" "Attempting to call unbound fn: #'reading/ub-y"
      true ub-y
      false "Unbound: #'reading/ub-z" "Attempting to call unbound fn: #'reading/ub-z"
      9 true
      1 true true
      false "Unbound: #'reading/ub-q" true
      true 7 nil
      true 8
      false false
      2 true true
      false
      3 true
      false "Unbound: #'reading/*ub-e*"
  - name: predicates-of-kinds-no-value-has-answer-false
    # Oracle-identical (clj 1.12.6): an unsorted map, vector or set is not sorted?, and no
    # chunked seq, decimal, byte array, delay, future, reader conditional, tagged literal
    # or host object exists in these programs. The host kinds answer true on the
    # interpreter and the JVM (ClojureInteropTest); sorted? of a sorted collection is
    # sorted-collections-and-the-type-predicates.
    source: |
      (prn (sorted? {}) (sorted? []) (chunked-seq? (lazy-seq [1])) (chunked-seq? '(1)) (decimal? 1.5) (bytes? [1]) (bytes? "s") (delay? 1) (future? 1) (reader-conditional? '(1)) (tagged-literal? 1) (class? 1) (inst? 1) (uuid? "x") (uri? "http://a"))
      (prn (map sorted? [nil #{}]) (map delay? [nil]) (map future? [nil]) (map class? [nil]) (map inst? [nil]) (map uuid? [nil]) (map uri? [nil]))
    expected: |
      false false false false false false false false false false false false false false false
      (false false) (false) (false) (false) (false) (false) (false)
  - name: future-verbs-refuse-a-value-that-is-no-future
    # Oracle-identical (clj 1.12.6): future-done?, future-cancelled? and future-cancel
    # cast their argument to java.util.concurrent.Future, which only a host object can be
    # here, so every other value is a ClassCastException (nil a NullPointerException);
    # the host Future's own answers are pinned by ClojureInteropTest.
    source: |
      (defn fvk [f] (try (f) (catch ClassCastException e :cce) (catch NullPointerException e :npe)))
      (println [(fvk #(future-done? 1)) (fvk #(future-done? nil)) (fvk #(future-done? (atom 1))) (fvk #(future-cancelled? "s")) (fvk #(future-cancelled? nil)) (fvk #(future-cancel [1])) (fvk #(future-cancel nil)) (fvk #(realized? 1))])
      (println (fvk #(apply future-done? [1])) (fvk #(first (map future-cancel [nil]))) (map future? [1 nil]))
    expected: |
      [:cce :npe :cce :cce :npe :cce :npe :cce]
      :cce :npe (false false)
  - name: special-symbol-names-the-special-forms
    # Oracle-identical (clj 1.12.6).
    source: |
      (prn (map special-symbol? '[if def let* fn* do quote var recur loop* throw try catch finally new . set! & case* letfn* deftype* reify* monitor-enter monitor-exit]))
      (prn (map special-symbol? '[let fn loop defn x import* when nil]) (special-symbol? "if") (special-symbol? :if) (special-symbol? 'clojure.core/if) (special-symbol? 'clojure.core/import*))
    expected: |
      (true true true true true true true true true true true true true true true true true true true true true true true)
      (false false false false false false false false) false false false true
  - name: extends-reads-the-protocol-table
    # Oracle-identical (clj 1.12.6): an inline implementation or an extension counts; an
    # Object extension counts for Object alone.
    source: |
      (defprotocol TpP (tp-m [x]))
      (defprotocol TpQ (tp-q [x]))
      (defrecord TpPR [a] TpP (tp-m [x] 1))
      (defrecord TpPS [a])
      (deftype TpPT [a])
      (deftype TpPU [a] TpP (tp-m [x] 2))
      (extend-type String TpP (tp-m [x] 2))
      (extend-protocol TpQ Object (tp-q [x] 3))
      (extend TpPS TpQ {:tp-q (fn [x] 4)})
      (prn (extends? TpP TpPR) (extends? TpP TpPS) (extends? TpP TpPT) (extends? TpP TpPU) (extends? TpP String) (extends? TpP Long) (extends? TpQ Object) (extends? TpQ TpPS) (extends? TpP Object) (extends? TpQ TpPR))
    expected: |
      true false false true true false true true false false
  - name: extend-takes-a-package-qualified-class-spelling
    # Oracle-identical (clj 1.12.6): extend-protocol, extend-type, extend and extends? take
    # java.lang./clojure.lang./java.util. spellings the way defmethod does; java.lang.Object
    # is the Object default row.
    source: |
      (defprotocol QcP (qc-m [x]))
      (defprotocol QcQ (qc-q [x]))
      (defprotocol QcR (qc-r [x]))
      (extend-protocol QcP java.lang.String (qc-m [s] :str) clojure.lang.IPersistentMap (qc-m [m] :map) java.lang.Object (qc-m [_] :other))
      (extend-type clojure.lang.Keyword QcQ (qc-q [k] :kw))
      (extend java.lang.Boolean QcR {:qc-r (fn [b] :bool)})
      (prn (qc-m "x") (qc-m {:a 1}) (qc-m 1) (qc-q :a) (qc-r true))
      (prn (extends? QcP java.lang.String) (extends? QcP clojure.lang.IPersistentMap) (extends? QcP String) (extends? QcQ clojure.lang.Keyword) (extends? QcQ java.lang.String) (extends? QcP java.lang.Object))
    expected: |
      :str :map :other :kw :bool
      true true true true false true
  - name: extend-forms-answer-nil
    # Oracle-identical (clj 1.12.6): extend-protocol, extend-type and extend answer nil,
    # not the last method row stored.
    source: |
      (defprotocol EanP (ean-m [x]))
      (defprotocol EanQ (ean-q [x]))
      (defprotocol EanR (ean-r [x]))
      (prn (extend-protocol EanP Long (ean-m [n] n)))
      (prn (extend-type String EanQ (ean-q [s] s)))
      (prn (extend Boolean EanR {:ean-r (fn [b] b)}))
      (prn (let [v (extend-protocol EanP String (ean-m [s] s))] [v (ean-m "a") (ean-q "b") (ean-r true)]))
    expected: |
      nil
      nil
      nil
      [nil "a" "b" true]
  - name: the-seq-predicates-follow-the-list-representation
    # A deviation: nil is the empty list, so the seq and collection predicates answer
    # false for () (the oracle: true); a strict seq is a list, so list? and counted? are
    # true and realized? is true for one (the oracle: a LazySeq, false); no seq is
    # chunked, and an iterate seq is realized only once forced.
    source: |
      (prn (seq? '()) (list? ()) (coll? ()) (counted? '()) (sequential? ()) (seqable? ()))
      (prn (list? (map inc [1 2])) (list? (range 3)) (list? (seq [1 2])) (list? (rest [1 2 3])) (counted? (map inc [1])) (chunked-seq? (seq [1 2])) (realized? (map inc [1 2])) (realized? (iterate inc 1)))
    expected: |
      false false false false false true
      true true true true true false true false
  - name: decimal-and-bigint-literals-are-plain-rationals
    # A deviation: 1.5M reads as the exact ratio 3/2 and 1M, 2N as integers, so decimal?
    # is false and ratio?, integer? and int? answer for the rational (the oracle: true
    # false false false).
    source: |
      (prn (decimal? 1.5M) (ratio? 1.5M) (integer? 1M) (int? 2N) (rational? 1.5M))
    expected: |
      false true true true true
  - name: identical-compares-numbers-and-symbols-by-value
    # A deviation: identical? is eql here, so two numbers or two symbols of one value are
    # identical (the oracle: false for boxed 1000, 1.5 and two read symbols), while two
    # empty map literals are two tables (the oracle: one constant).
    source: |
      (prn (identical? 1000 1000) (identical? 'a 'a) (identical? 1.5 1.5) (identical? {} {}))
    expected: |
      true true true false
  - name: sorted-map-and-sorted-set-print-in-comparator-order
    # Oracle-identical (clj 1.12.6): compare orders the keys (nil first, numbers across
    # their kinds, vectors by length first); of keys comparing equal the first stays and,
    # in a map, the last value wins.
    source: |
      (prn (sorted-map :b 1 :a 2 :c 3) (sorted-set 3 1 2) (sorted-map) (sorted-set))
      (prn (sorted-map :a 1 :a 2) (sorted-set 1 1.0) (sorted-set 1.0 1) (sorted-map 1 :x 1.0 :y))
      (prn (sorted-set nil 1 2) (sorted-map nil 1 :a 2) (sorted-set [1 2] [1 1] [0 5 6]) (sorted-set 1 2.5 3/2 -1))
      (prn (sorted-set "b" "a" "ab") (sorted-set \c \a) (sorted-set true false) (sorted-set 'b 'a 'a/b) (sorted-set :b :a :a/b :c/a))
      (println (sorted-map :a "x") (str (sorted-map :a 1 :b "x")) (pr-str (sorted-set "a" "b")))
      (prn (apply sorted-map [:b 1 :a 2]) (apply sorted-set [3 1 2]) (map sorted-set [3 1]))
    expected: |
      {:a 2, :b 1, :c 3} #{1 2 3} {} #{}
      {:a 2} #{1} #{1.0} {1 :y}
      #{nil 1 2} {nil 1, :a 2} #{[1 1] [1 2] [0 5 6]} #{-1 1 3/2 2.5}
      #{"a" "ab" "b"} #{\a \c} #{false true} #{a b a/b} #{:a :b :a/b :c/a}
      {:a x} {:a 1, :b "x"} #{"a" "b"}
      {:a 2, :b 1} #{1 2 3} (#{3} #{1})
  - name: sorted-collections-look-up-through-their-comparator
    # Oracle-identical (clj 1.12.6): a key comparing equal to a stored one finds it, so
    # 1.0 finds 1; an empty sorted map compares nothing.
    source: |
      (prn (get (sorted-map 1 :a) 1.0) (get (sorted-map) "x") (get (sorted-set 1 2) 2.0) (contains? (sorted-set 1 2) 2.0) (contains? (sorted-map :a 1) :b))
      (prn ((sorted-set 1 2) 2) ((sorted-map :a 1) :a) ((sorted-map :a 1) :b :dflt) (:a (sorted-map :a 1)) (:b (sorted-map :a 1) :d))
      (prn (find (sorted-map :a 1) :a) (find (sorted-map :a 1) :b) (get-in (sorted-map :a (sorted-map :b 1)) [:a :b]))
      (prn (let [{:keys [a b]} (sorted-map :a 1 :b 2)] [a b]) (let [{x 1.0} (sorted-map 1 :one)] x) (map get [(sorted-map :a 1)] [:a]) (filter (sorted-set 1 3) [1 2 3]))
    expected: |
      :a nil 2 true false
      2 1 :dflt 1 :d
      [:a 1] nil 1
      [1 2] :one (1) (1 3)
  - name: sorted-collections-grow-and-shrink-in-order
    # Oracle-identical (clj 1.12.6): every verb answers a sorted collection under the
    # same comparator, keeping a stored key a new one compares equal to; select-keys
    # answers a plain map, like the oracle's.
    source: |
      (prn (assoc (sorted-map :b 1) :a 2) (assoc (sorted-map :b 1) :b 2 :c 3) (assoc (sorted-map 1 :a) 1.0 :b))
      (prn (dissoc (sorted-map :b 1 :a 2) :a) (dissoc (sorted-map :b 1 :a 2) :z) (dissoc (sorted-map) "z") (dissoc (sorted-map 1 :a 2 :b) 1.0))
      (prn (conj (sorted-set 2) 1) (conj (sorted-set 2) 2.0) (conj (sorted-map :b 1) [:a 2]) (conj (sorted-map :b 1) {:a 2 :c 3}) (conj (sorted-map :b 1) nil))
      (prn (disj (sorted-set 1 2 3) 2) (disj (sorted-set 1 2 3) 2.0) (disj (sorted-set 1 2 3) 5))
      (prn (into (sorted-map) {:b 1 :a 2}) (into (sorted-set) [3 1 2]) (into [] (sorted-set 3 1 2)) (into (sorted-map-by >) {1 :a 2 :b}))
      (prn (merge (sorted-map :b 1) {:a 2}) (merge {} (sorted-map :a 2)) (merge-with + (sorted-map :b 1) {:b 2 :a 2}) (merge-with + (sorted-map 1 1) {1.0 2}))
      (prn (update (sorted-map :a 1) :a inc) (assoc-in (sorted-map) [:a :b] 1) (update-in (sorted-map :a {:b 1}) [:a :b] inc))
      (prn (select-keys (sorted-map :a 1 :b 2) [:b]) (select-keys (sorted-map 1 :a) [1.0]))
      (prn (apply assoc (sorted-map :b 1) [:a 2]) (apply dissoc (sorted-map :a 1 :b 2) [:a]) (apply disj (sorted-set 1 2 3) [1 2]) (reduce conj (sorted-set) [3 1 2]))
      (prn (apply merge [(sorted-map :b 1) {:a 2}]) (apply merge-with + [(sorted-map :b 1) {:b 2 :a 2}]) (map dissoc [(sorted-map 1 :a 2 :b)] [1.0]))
    expected: |
      {:a 2, :b 1} {:b 2, :c 3} {1 :b}
      {:b 1} {:a 2, :b 1} {} {2 :b}
      #{1 2} #{2} {:a 2, :b 1} {:a 2, :b 1, :c 3} {:b 1}
      #{1 3} #{1 3} #{1 2 3}
      {:a 2, :b 1} #{1 2 3} [1 2 3] {2 :b, 1 :a}
      {:a 2, :b 1} {:a 2} {:a 2, :b 3} {1 3}
      {:a 2} {:a {:b 1}} {:a {:b 2}}
      {:b 2} {1 :a}
      {:a 2, :b 1} {:b 2} #{3} #{1 2 3}
      {:a 2, :b 1} {:a 2, :b 3} ({2 :b})
  - name: sorted-collections-seq-in-order
