  - name: var-volatile-bound-and-realized-predicates
    # Oracle-identical (clj 1.12.6): a volatile is no atom, a defined var is bound, a lazy
    # seq is realized once its body ran; realized? of anything but a seq signals.
    source: |
      (def tp-bx 1)
      (prn (var? #'tp-bx) (var? 'tp-bx) (var? tp-bx) (var? (atom 1)) (map var? [#'tp-bx 1]))
      (prn (volatile? (volatile! 1)) (volatile? (atom 1)) (volatile? (ref 1)) (volatile? (agent 1)) (volatile? nil) (let [v (volatile! 1)] (vswap! v inc) [(volatile? v) @v]) (map volatile? [(volatile! 0) 0]))
      (let [v (volatile! 1)] (vreset! v 5) (prn @v (deref v) (volatile? v)))
      (prn (bound? #'tp-bx) (bound? #'tp-bx #'tp-bx) (bound?) (try (bound? 1) (catch Exception e :refused)) (apply bound? [#'tp-bx]))
      (let [s (lazy-seq [1 2])] (prn (realized? s) (first s) (realized? s)))
      (let [s (map inc (iterate inc 1))] (prn (realized? s) (first s) (realized? s)))
      (prn (realized? (lazy-seq nil)) (try (realized? [1]) (catch Exception e :refused)) (try (realized? nil) (catch Exception e :refused)) (try (realized? 1) (catch Exception e :refused)) (try (realized? (atom 1)) (catch Exception e :refused)))
    expected: |
      true false false false (true false)
      true false false false false [true 2] (true false)
      5 5 true
      true true true :refused true
      false 1 true
      false 2 true
      false :refused :refused :refused :refused
  - name: thread-bound-predicate-follows-the-binding-extent
    # Oracle-identical (clj 1.12.6): true while a binding of every given var is in effect,
    # false for a root, a non-dynamic var and an unbound var, a non-var signals (only when
    # reached: every? stops at the first false).
    source: |
      (def ^:dynamic *tb-d* 1)
      (def ^:dynamic *tb-e* 2)
      (def tb-plain 3)
      (defn probe [] (thread-bound? #'*tb-d*))
      (prn (thread-bound? #'*tb-d*) (thread-bound?) (thread-bound? #'tb-plain))
      (binding [*tb-d* 10]
        (prn (thread-bound? #'*tb-d*) (thread-bound? #'*tb-e*) (thread-bound? #'*tb-d* #'*tb-e*) (probe) (thread-bound? #'tb-plain))
        (binding [*tb-e* 20]
          (prn (thread-bound? #'*tb-d* #'*tb-e*) (apply thread-bound? [#'*tb-d* #'*tb-e*]) (map thread-bound? [#'*tb-d* #'*tb-e*]))))
      (prn (thread-bound? #'*tb-d*) (probe))
      (prn (try (thread-bound? 1) (catch Exception e :refused)) (try (thread-bound? 'tb-plain) (catch Exception e :refused)))
      (prn (try (thread-bound? #'*tb-e* 1) (catch Exception e :refused)) (try (binding [*tb-e* 1] (thread-bound? #'*tb-e* 1)) (catch Exception e :refused)))
      (defn ^:dynamic *tb-f* [] 1)
      (prn (thread-bound? #'*tb-f*))
      (binding [*tb-f* (fn [] 2)] (prn (thread-bound? #'*tb-f*) (*tb-f*)))
    expected: |
      false true false
      true false false true false
      true true (true true)
      false false
      :refused :refused
      false :refused
      false
      true 2
  - name: core-vars-read-their-core-value-and-the-stream-binding-depth
    # Oracle-identical (clj 1.12.6): #'name of a clojure.core name is the core var, one per
    # name, printing #'clojure.core/name; deref and a call read its core value. thread-bound?
    # of *out* / *in* / *agent* is false at the root (clojure.main binds none of them) and
    # true under a binding, with-out-str and an agent action. Not compared: the oracle's
    # core var metadata also carries :arglists, :doc and the position, and deref of a macro's
    # var answers its expander where it signals here.
    source: |
      (prn (var? #'inc) #'inc #'clojure.core/str (str #'map) (= #'inc (var inc)) (= #'inc #'dec))
      (prn (#'inc 1) (@#'inc 2) (#'map inc [1 2]) (apply #'+ [1 2]) (map #'dec [1 2]))
      (prn (:name (meta #'inc)) (:macro (meta #'when)) (:macro (meta #'inc)) (bound? #'inc #'when #'*out*))
      (prn (thread-bound? #'inc) (thread-bound? #'*out*) (thread-bound? #'*in*) (thread-bound? #'*agent*))
      (prn (with-out-str (print (thread-bound? #'*out*))) (binding [*out* *out*] (thread-bound? #'*out*)))
      (prn (binding [*in* *in*] [(thread-bound? #'*in*) (thread-bound? #'*in* #'*out*)]))
      (def cv-agent (agent 0))
      (send cv-agent (fn [x] (prn (thread-bound? #'*agent*)) x))
      (await cv-agent)
      (prn (identical? *out* @#'*out*) (let [inc 5] (#'inc inc)) (thread-bound? #'*out*))
    expected: |
      true #'clojure.core/inc #'clojure.core/str "#'clojure.core/map" true false
      2 3 (2 3) 3 (0 1)
      inc true nil true
      false false false false
      "true" true
      [true false]
      true
      true 6 false
  - name: core-flag-specials-read-bind-and-assign
    # Oracle-identical (clj 1.12.6, clj -M file): the clojure.core flags read their root,
    # rebind under binding and assign under set!. clojure.main binds *print-length*,
    # *assert*, *warn-on-reflection*, *command-line-args* and the other compiler and print
    # flags around a script, so thread-bound? is true and set! assigns at the top level;
    # *err*, *print-dup*, *flush-on-newline* and *compile-files* it does not bind, so set!
    # outside a binding is the root-binding error. A local of a flag's name is lexical. An
    # earlier case sets *warn-on-reflection*, so this one sets it back first.
    source: |
      (prn *print-length* *print-level* *print-meta* *print-dup* *print-readably* *print-namespace-maps* *flush-on-newline*)
      (set! *warn-on-reflection* false)
      (prn *warn-on-reflection* *assert* *unchecked-math* *compile-files* *read-eval* *math-context* *data-readers* *default-data-reader-fn* *command-line-args* *compile-path* (:minor *clojure-version*))
      (prn (map thread-bound? [#'*print-length* #'*assert* #'*warn-on-reflection* #'*err* #'*print-dup* #'*flush-on-newline* #'*compile-files* #'*command-line-args*]))
      (prn (binding [*assert* false *print-dup* true] [*assert* *print-dup* (thread-bound? #'*print-dup*)]) *assert* *print-dup*)
      (prn (try (set! *print-dup* true) (catch Exception e (ex-message e))))
      (prn (binding [*print-dup* 1] (set! *print-dup* 2) *print-dup*) (set! *warn-on-reflection* true) *warn-on-reflection*)
      (set! *warn-on-reflection* false)
      (prn #'*print-length* #'clojure.core/*err* (binding [clojure.core/*unchecked-math* true] *unchecked-math*))
      (let [*assert* 5] (prn *assert*))
    expected: |
      nil nil false false true true true
      false true false false true nil {} nil nil "classes" 12
      (true true true false false false false true)
      [false true true] true false
      "Can't change/establish root binding of: *print-dup* with set"
      2 true true
      #'clojure.core/*print-length* #'clojure.core/*err* true
      5
  - name: err-is-the-error-stream-and-rebinds-like-out
    # Oracle-identical (clj 1.12.6): *err* is the error stream, a special of its own that
    # binding rebinds and *out* can be bound to; thread-bound? of it is false at the root
    # and set! there is the root-binding error, as for *out*.
    source: |
      (prn (with-out-str (binding [*err* *out*] (binding [*out* *err*] (print "via err")))))
      (prn (identical? *err* *out*) (thread-bound? #'*err*) (binding [*err* *out*] (thread-bound? #'*err*)))
      (prn (try (set! *err* *out*) (catch Exception e (ex-message e))) (try (set! *out* *out*) (catch Exception e (ex-message e))))
    expected: |
      "via err"
      false false true
      "Can't change/establish root binding of: *err* with set" "Can't change/establish root binding of: *out* with set"
  - name: a-stream-prints-as-the-host-object-of-its-kind
    # The oracle (clj 1.12.6) with its identity hashes removed (#object[C 0x.. "C@.."]
    # here is #object[C "C"]): *out*, *in* and *err* at the root are the process standard
    # streams, stream values apart from true, and every stream prints as the #object of the
    # host class its kind is, str answering its toString (a StringWriter's text so far).
    # One deviation: a string input stream is a LineNumberingPushbackReader, with-in-str's
    # *in*, so the PushbackReader over a StringReader prints that where the oracle says
    # java.io.PushbackReader.
    source: |
      (prn *out* *in* *err*)
      (println *out* *in* *err*)
      (println (str *out*) (str *in*) (str *err*) (.toString *out*))
      (prn (= *out* *in*) (identical? *out* *out*) (= *out* *out*) (= *out* *err*) (true? *out*))
      (binding [*out* *out*] (println "through the root stream"))
      (.write *out* "written\n")
      (.flush *out*)
      (prn (with-out-str (prn *out*)))
      (prn (java.io.StringWriter.) [*out*] (pr-str *err*) (print-str *in*))
      (let [w (java.io.StringWriter.)] (.write w "a\"b") (prn w (str w)) (println w))
      (with-in-str "abc" (prn *in*))
      (prn (java.io.PushbackReader. (java.io.StringReader. "x")))
      (prn @#'*out* @#'*in*)
    expected: |
      #object[java.io.OutputStreamWriter "java.io.OutputStreamWriter"] #object[clojure.lang.LineNumberingPushbackReader "clojure.lang.LineNumberingPushbackReader"] #object[java.io.PrintWriter "java.io.PrintWriter"]
      #object[java.io.OutputStreamWriter java.io.OutputStreamWriter] #object[clojure.lang.LineNumberingPushbackReader clojure.lang.LineNumberingPushbackReader] #object[java.io.PrintWriter java.io.PrintWriter]
      java.io.OutputStreamWriter clojure.lang.LineNumberingPushbackReader java.io.PrintWriter java.io.OutputStreamWriter
      false true true false false
      through the root stream
      written
      "#object[java.io.StringWriter \"\"]\n"
      #object[java.io.StringWriter ""] [#object[java.io.OutputStreamWriter "java.io.OutputStreamWriter"]] "#object[java.io.PrintWriter \"java.io.PrintWriter\"]" "#object[clojure.lang.LineNumberingPushbackReader clojure.lang.LineNumberingPushbackReader]"
      #object[java.io.StringWriter "a\"b"] "a\"b"
      #object[java.io.StringWriter a"b]
      #object[clojure.lang.LineNumberingPushbackReader "clojure.lang.LineNumberingPushbackReader"]
      #object[clojure.lang.LineNumberingPushbackReader "clojure.lang.LineNumberingPushbackReader"]
      #object[java.io.OutputStreamWriter "java.io.OutputStreamWriter"] #object[clojure.lang.LineNumberingPushbackReader "clojure.lang.LineNumberingPushbackReader"]
  - name: class-of-a-stream-answers-the-host-class-of-its-kind
    # class answers a keyword for every kind (the oracle answers the host class, which
    # prints without the colon): a stream answers the class its printer names, :java.io.X
    # where the oracle says java.io.X. *out*, *in* and *err* at the root, a StringWriter,
    # with-in-str's *in*, with-out-str's *out* (a StringWriter) and a PushbackReader over a
    # StringReader (the oracle's java.io.PushbackReader deviates, see the printer case).
    # Dispatch on class tells the kinds apart like any keyword.
    source: |
      (prn (class *out*) (class *in*) (class *err*))
      (prn (class (java.io.StringWriter.)) (with-out-str (prn (class *out*))))
      (with-in-str "abc" (prn (class *in*)))
      (prn (class (java.io.PushbackReader. (java.io.StringReader. "x"))))
      (prn (= (class *out*) (class *out*)) (= (class *out*) (class *err*)) (= (class (java.io.StringWriter.)) (class (java.io.StringWriter.))))
      (prn (map class [*out* (java.io.StringWriter.) 1 "s"]))
      (defmulti stream-kind class)
      (defmethod stream-kind :java.io.StringWriter [_] :writer)
      (defmethod stream-kind :java.io.OutputStreamWriter [_] :stdout)
      (defmethod stream-kind :default [_] :other)
      (prn (stream-kind (java.io.StringWriter.)) (stream-kind *out*) (stream-kind *err*) (stream-kind 1))
    expected: |
      :java.io.OutputStreamWriter :clojure.lang.LineNumberingPushbackReader :java.io.PrintWriter
      :java.io.StringWriter ":java.io.StringWriter\n"
      :clojure.lang.LineNumberingPushbackReader
      :clojure.lang.LineNumberingPushbackReader
      true false true
      (:java.io.OutputStreamWriter :java.io.StringWriter :number :string)
      :writer :stdout :other :other
  - name: a-multimethod-dispatches-on-a-stream-class-by-inheritance
    # A stream's host class as a dispatch value is the keyword class answers for it, and
    # java.io.Writer / java.io.Reader take every stream of their kind, like the oracle's
    # Java inheritance. .getClass of a stream answers what class answers (the oracle
    # answers the host class, which prints without the colon).
    source: |
      (defmulti xds-kind class)
      (defmethod xds-kind java.io.StringWriter [w] :string-writer)
      (defmethod xds-kind java.io.Writer [w] :writer)
      (defmethod xds-kind java.io.Reader [w] :reader)
      (println (xds-kind (java.io.StringWriter.)) (xds-kind *out*) (xds-kind *err*) (xds-kind *in*) (with-in-str "x" (xds-kind *in*)))
      (println (isa? (class *out*) java.io.Writer) (isa? (class *in*) java.io.Writer) (.getClass (java.io.StringWriter.)))
    expected: |
      :string-writer :writer :writer :reader :reader
      true false :java.io.StringWriter
  - name: var-get-answers-the-root-of-a-var
    # Oracle-identical (clj 1.12.6): var-get is the root of a var, the same as deref of
    # it, a binding included, over a function value and a core var, and a non-var signals
    # where deref of an atom would answer (a reduced value is no var).
    source: |
      (def vg-x 5)
      (def ^:dynamic *vg-d* 1)
      (defn vg-f [] 7)
      (prn (var-get #'vg-x) (var-get #'*vg-d*) ((var-get (var vg-f))) (identical? (var-get #'*out*) *out*))
      (binding [*vg-d* 9] (prn (var-get #'*vg-d*) @#'*vg-d*))
      (prn (map var-get [#'vg-x #'*vg-d*]) (apply var-get [#'vg-x]) ((var-get #'inc) 1))
      (prn (try (var-get 1) (catch Exception e :refused)) (try (var-get (atom 1)) (catch Exception e :refused)) (try (var-get (reduced 1)) (catch Exception e :refused)))
    expected: |
      5 1 7 true
      9 9
      (5 1) 5 2
      :refused :refused :refused
  - name: print-length-level-and-readably-shape-the-printer
    # Oracle-identical (clj 1.12.6): *print-length* cuts a seq, vector, map, set, sorted
    # collection or record after that many members with ... (an infinite seq realizes only
    # as far), *print-level* prints a collection that deep as #, and *print-readably* false
    # makes pr write like print -- for pr-str, prn-str and str of a collection too. Only
    # single-member hash sets and maps are cut here: their walk order is unspecified. The
    # record spells the namespace an earlier case switched to.
    source: |
      (binding [*print-length* 3] (prn (range 10) [1 2 3 4 5] [1 2 3] (iterate inc 0) (sorted-map 1 2 3 4 5 6 7 8) (sorted-set 5 4 3 2 1)))
      (binding [*print-length* 0] (prn [1] [] '(1) #{1} {:a 1} 5 "s"))
      (binding [*print-level* 2] (prn [1 [2 [3 [4]]]] '(1 (2 (3))) {:a {:b {:c 1}}} 7))
      (binding [*print-level* 0] (prn [1 2] 5 :k "s" nil))
      (binding [*print-length* 2 *print-level* 1] (prn [[1 2 3] [4] [5]]))
      (binding [*print-length* 1] (prn (pr-str [1 2]) (str [1 2]) (prn-str '(1 2))))
      (defrecord PlfR [a b c])
      (binding [*print-length* 2] (prn (->PlfR 1 2 3)))
      (binding [*print-readably* false] (prn "a" \b [1 "c"] nil) (prn (pr-str "x")))
      (set! *print-length* 1) (prn [1 2]) (set! *print-length* nil) (prn [1 2])
    expected: |
      (0 1 2 ...) [1 2 3 ...] [1 2 3] (0 1 2 ...) {1 2, 3 4, 5 6, ...} #{1 2 3 ...}
      [...] [] (...) #{...} {...} 5 "s"
      [1 [2 #]] (1 (2 #)) {:a {:b #}} 7
      # 5 :k "s" nil
      [# # ...]
      "[1 ...]" "[1 ...]" "(1 ...)\n"
      #reading.PlfR{:a 1, :b 2, ...}
      a b [1 c] nil
      x
      [1 ...]
      [1 2]
  - name: an-integer-and-a-ratio-print-as-their-digits-under-every-flag
    # Oracle-identical (clj 1.12.6): a number is no collection, so *print-level* and
    # *print-length* leave it whole, at any depth, under pr, print and str alike.
    source: |
      (prn 0 -7 9223372036854775807 3/4 -3/4 [1 -2 3/4])
      (binding [*print-level* 0] (prn 5 -5 3/4 [1]))
      (binding [*print-level* 1 *print-length* 2] (prn [[1 2 3] -4 5 6] '(7 (8))))
      (println 12 -34 5/6 [7 -8 9/10] (pr-str [1 2]) (str [-1 2/3]))
      (binding [*print-readably* false] (prn -1 [2 3/4]))
    expected: |
      0 -7 9223372036854775807 3/4 -3/4 [1 -2 3/4]
      5 -5 3/4 #
      [# -4 ...] (7 #)
      12 -34 5/6 [7 -8 9/10] [1 2] [-1 2/3]
      -1 [2 3/4]
  - name: a-keyword-string-character-and-float-print-the-same-under-every-flag
    # Oracle-identical (clj 1.12.6): these scalars carry no metadata and are no collection,
    # so *print-meta*, *print-level* and *print-length* leave them whole, at any depth;
    # *print-readably* alone picks the quoted spelling of a string and character.
    source: |
      (prn :a :b/c "s\"t\n" \a \space 1.5 -0.25 1.0E19 1.5E-7 ##NaN ##Inf ##-Inf [:k "v" 2.5 \z])
      (binding [*print-level* 0] (prn :a "s" \c 1.5 [:a]))
      (binding [*print-level* 1 *print-length* 2] (prn [[:a "b"] :c "d" 1.5] '(:e (:f))))
      (binding [*print-meta* true] (prn :a "s" \c 2.5 [:a "s"] ^{:m 1} [:b "t"]))
      (println :a :b/c "s\"t" \a 1.5 ##NaN ##-Inf [:k "v" 2.5 \z] (pr-str [:k "v\n" 2.5]) (str [:k "v" 2.5 \z]) (str :a "s" \c 1.5 ##Inf))
      (binding [*print-readably* false] (prn :a "s\"t" \c 1.5 [:k "v" 2.5 \z]))
      (prn {:a "s"} {"k" 1.5} {2.5 :v} {:a/x "s" :a/y 1.5})
    expected: |
      :a :b/c "s\"t\n" \a \space 1.5 -0.25 1.0E19 1.5E-7 ##NaN ##Inf ##-Inf [:k "v" 2.5 \z]
      :a "s" \c 1.5 #
      [# :c ...] (:e #)
      :a "s" \c 2.5 [:a "s"] ^{:m 1} [:b "t"]
      :a :b/c s"t a 1.5 ##NaN ##-Inf [:k v 2.5 z] [:k "v\n" 2.5] [:k "v" 2.5 \z] :asc1.5Infinity
      :a s"t c 1.5 [:k v 2.5 z]
      {:a "s"} {"k" 1.5} {2.5 :v} #:a{:x "s", :y 1.5}
  - name: a-map-whose-keys-share-a-namespace-prints-it-lifted
    # Oracle-identical (clj 1.12.6): under *print-namespace-maps*, which clojure.main binds
    # true, a map whose every key is a keyword or symbol of one namespace prints as
    # #:ns{...} with the keys bare -- under pr, print, str and the print flags alike, a
    # sorted map too; bound or set false, it prints plainly. A record keeps its own
    # notation. Hash maps hold one entry: their walk order is unspecified.
    source: |
      (prn {:a/b 1} {'a/c 2} {:a/b 'a/c} [{:a/b {:c/d 1}}] {:a/b nil} {} {"a/b" 1})
      (prn (sorted-map :a/b 1 :a/c 2) (sorted-map :a/b 1 :b/c 2) {(keyword "k" "x") 1} {(symbol "s/y") 2})
      (println {:a/b "x"} (pr-str {:a/b "x"}) (str {:a/b "x"}) (print-str {:a/b "x"}))
      (binding [*print-length* 1] (prn (sorted-map :a/b 1 :a/c 2) {:a/b 1}))
      (binding [*print-length* 0] (prn {:a/b 1}))
      (binding [*print-level* 1] (prn {:a/b {:a/c 2}} (sorted-map :a/b [1])))
      (binding [*print-namespace-maps* false] (prn {:a/b 1} (pr-str (sorted-map :a/b 1))))
      (set! *print-namespace-maps* false) (prn {:a/b 1}) (set! *print-namespace-maps* true) (prn {:a/b 1})
      (defrecord NsmR [x])
      (prn (assoc (->NsmR 1) :a/b 2))
    expected: |
      #:a{:b 1} #:a{c 2} #:a{:b a/c} [#:a{:b #:c{:d 1}}] #:a{:b nil} {} {"a/b" 1}
      #:a{:b 1, :c 2} {:a/b 1, :b/c 2} #:k{:x 1} #:s{y 2}
      #:a{:b x} #:a{:b "x"} #:a{:b "x"} #:a{:b x}
      #:a{:b 1, ...} #:a{:b 1}
      #:a{...}
      #:a{:b #} #:a{:b #}
      {:a/b 1} "{:a/b 1}"
      {:a/b 1}
      #:a{:b 1}
      #reading.NsmR{:x 1, :a/b 2}
  - name: print-meta-writes-the-metadata-ahead-of-the-value
    # Oracle-identical (clj 1.12.6): under *print-meta*, pr (and pr-str, str) writes a
    # value's non-empty metadata as ^m ahead of it -- a lone :tag as its value -- at the
    # value's own level and under the print flags; print and *print-readably* false write
    # none. The oracle's reader also gives a quoted list :line/:column metadata, which no
    # value carries here.
    source: |
      (binding [*print-meta* true]
        (prn (with-meta [1] {:a 1}) (with-meta {:x 1} {:a 1}) (with-meta #{1} {:a 1}) (with-meta (list 1 2) {:a 1}))
        (prn (with-meta [1] {:tag 'String}) (with-meta [1] {}) [(with-meta [2] {:b 1})] (with-meta [1] (with-meta {:a 1} {:z 2})))
        (prn ^:foo [1] (vary-meta [1] assoc :k 2) (pr-str (with-meta [1] {:a 1})) (str (with-meta [1] {:a 1})))
        (prn (with-meta (->NsmR 1) {:a 1}) (with-meta (sorted-map 1 2) {:a 1}) (with-meta {:a/b 1} {:c/d 1}) (with-meta [1] (sorted-map :s 1)))
        (print (with-meta [1] {:a 1})) (newline)
        (println (with-meta [1] {:a 1}) (print-str (with-meta [1] {:a 1}))))
      (binding [*print-meta* true *print-readably* false] (prn (with-meta [1] {:a 1})))
      (binding [*print-meta* true *print-length* 1] (prn (with-meta [1 2] {:a 1})))
      (binding [*print-meta* true *print-level* 1] (prn [(with-meta [1 2] {:a 1})] (with-meta [1 2] {:a [1]})))
      (prn (with-meta [1] {:a 1}))
      (set! *print-meta* true) (prn (with-meta [1] {:a 1})) (set! *print-meta* false) (prn (with-meta [1] {:a 1}))
    expected: |
      ^{:a 1} [1] ^{:a 1} {:x 1} ^{:a 1} #{1} ^{:a 1} (1 2)
      ^String [1] [1] [^{:b 1} [2]] ^^{:z 2} {:a 1} [1]
