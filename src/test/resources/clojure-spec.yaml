  - name: a-type-overriding-object-answers-str-and-equals-through-it
    # Object's toString, equals and hashCode in a deftype, reify or defrecord body
    # (.kb/clojure-frontend.md "Host interfaces"), under any group like the oracle's
    # class: str and = read them, a record still prints its literal. A deviation: the
    # oracle prints such a value as #object[iface_object$reify__410 0x7b60c3e "a reify"],
    # its class's counter and identity hash, where the line below has neither.
    source: |
      (ns iface-object)
      (deftype Money [cents]
        Object
        (toString [_] (str "$" (quot cents 100) "." (mod cents 100)))
        (equals [_ o] (and (instance? Money o) (= cents (.-cents ^Money o))))
        (hashCode [_] cents))
      (prn (str (Money. 150)) (str "total: " (Money. 205)) (= (Money. 1) (Money. 1)) (= (Money. 1) (Money. 2)) (= (Money. 1) 1) (.hashCode (Money. 7)))
      (defprotocol Named (label [x]))
      (def r (reify Named (label [_] :lbl) (toString [_] "a reify")))
      (prn (label r) (str r) (str [1 r]))
      (defrecord Point [x y] Object (toString [_] (str "<" x "," y ">")))
      (prn (str (->Point 1 2)) (->Point 1 2))
      (in-ns 'user)
    expected: |
      "$1.50" "total: $2.5" true false false 7
      :lbl "a reify" "[1 #object[iface_object$reify \"a reify\"]]"
      "<1,2>" #iface_object.Point{:x 1, :y 2}
  - name: a-deftype-implementing-iobj-carries-its-own-metadata
    # clojure.lang.IMeta and IObj in a deftype body (.kb/clojure-frontend.md "Host
