    expected: |
      a
      a
      true
      97
      97 97
      (a b)
      a
      :refused
  - name: name-reads-past-the-slash
    # name answers a string itself, and a keyword's or symbol's spelling past the
    # first slash (the whole spelling when none); anything else signals.
    source: |
      (println (name :foo/bar))
      (println (name :foo))
      (println (name "hello"))
      (println (name "a/b"))
      (println (name 'foo/bar))
      (println (name 'foo))
      (println (map name [:a/b :c "s"]))
