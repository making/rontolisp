# The corpus of the experimental Java subset's java.net.http client
# (FetchSpecE2eTest#javaHttpClient): each program is a Java file run under the JDK
# running the test and on every transport rontolisp:fetch has -- the interpreter, the
# JVM, a --native output and a --component -- against the test's one local origin,
# which stands for @ORIGIN@ in a source; @LEG@ stands for the leg's name. Written
# here; nothing is copied or translated from a JDK or its tests
# (.kb/java-frontend-provenance.md).
#
# A program prints a line `== name` ahead of each case, and its output is cut into
# cases at those lines, so a failure names its case and its leg. `expected` is what a
# JDK 25 prints, and the JDK leg checks that it still is; a program `skip`s a leg with
# the reason: the one of what the subset's client refuses by name has no JDK leg.
programs:
  # the blocking client: verbs, fields both ways, bodies, statuses, redirects, java.net.URI
  - name: client
    file: Client.java
    source: |
      import java.io.ByteArrayInputStream;
      import java.io.IOException;
      import java.io.InputStream;
      import java.net.ConnectException;
      import java.net.URI;
      import java.net.URISyntaxException;
      import java.net.http.HttpClient;
      import java.net.http.HttpHeaders;
      import java.net.http.HttpRequest;
      import java.net.http.HttpResponse;
      import java.nio.charset.StandardCharsets;
      import java.util.Arrays;
      import java.util.HashMap;
      import java.util.List;
      import java.util.Map;
      import java.util.Optional;

      public class Client {

          static final String ORIGIN = "@ORIGIN@";

          static final HttpClient CLIENT = HttpClient.newHttpClient();

          static HttpRequest.Builder to(String path) {
              return HttpRequest.newBuilder(URI.create(ORIGIN + path));
          }

          static String text(HttpRequest request) throws IOException, InterruptedException {
              HttpResponse<String> response = CLIENT.send(request, HttpResponse.BodyHandlers.ofString());
              return response.statusCode() + " [" + response.body() + "]";
          }

          static String local(Object value) {
              return String.valueOf(value).replace(ORIGIN, "");
          }

          interface Refused {
              Object run() throws Exception;
          }

          static void refused(String what, Refused attempt) {
              try {
                  System.out.println(what + ": " + local(attempt.run()));
              }
              catch (Exception thrown) {
                  System.out.println(what + ": " + local(thrown));
              }
          }

          static void get() throws IOException, InterruptedException {
              System.out.println("== a-get-answers-its-status-its-fields-and-its-body");
              HttpRequest request = to("/hello").header("X-Custom", "abc").build();
              HttpResponse<String> response = CLIENT.send(request, HttpResponse.BodyHandlers.ofString());
              System.out.println(local(response));
              System.out.println(response.statusCode() + " " + response.body() + " " + local(response.uri()) + " "
                      + response.version() + " " + response.previousResponse());
              HttpHeaders fields = response.headers();
              System.out.println(fields.firstValue("X-Test") + " " + fields.firstValue("x-test") + " " + fields.allValues("X-TEST")
                      + " " + fields.firstValue("absent") + " " + fields.allValues("absent"));
              System.out.println(fields.map().get("content-length") + " " + fields.map().get("Content-Length") + " "
                      + fields.map().containsKey("x-test") + " " + fields.map().keySet().contains("x-test"));
              System.out.println(local(request) + " | " + request.method() + " " + request.headers().map() + " "
                      + request.bodyPublisher() + " " + request.version() + " " + request.expectContinue());
              System.out.println(local(response.request()) + " " + text(to("/query?a=1&b=%20x#fragment").build()));
          }

          static void verbs() throws IOException, InterruptedException {
              System.out.println("== the-verbs-and-a-request-body");
              HttpRequest post = to("/echo").POST(HttpRequest.BodyPublishers.ofString("héllo")).build();
              System.out.println(post.method() + " " + post.bodyPublisher().get().contentLength() + " " + text(post));
              System.out.println(text(to("/echo").PUT(HttpRequest.BodyPublishers.ofByteArray(new byte[] { 104, 105 })).build()));
              System.out.println(text(to("/echo").DELETE().build()));
              System.out.println(text(to("/echo").method("PATCH", HttpRequest.BodyPublishers.ofString("p")).build()));
              System.out.println(text(to("/echo").method("OPTIONS", HttpRequest.BodyPublishers.noBody()).build()));
              System.out.println(text(to("/echo").POST(HttpRequest.BodyPublishers.noBody()).build()));
              System.out.println(text(to("/echo").POST(HttpRequest.BodyPublishers.ofByteArray("abcdef".getBytes(), 2, 3)).build()));
              System.out.println(text(to("/echo")
                  .POST(HttpRequest.BodyPublishers.ofInputStream(() -> new ByteArrayInputStream("from a stream".getBytes())))
                  .build()));
              System.out.println(text(to("/echo").POST(HttpRequest.BodyPublishers.ofString("ignored")).GET().build()));
              HttpResponse<String> head = CLIENT.send(to("/hello").HEAD().build(), HttpResponse.BodyHandlers.ofString());
              System.out.println(head.request().method() + " " + head.statusCode() + " [" + head.body() + "] "
                      + head.headers().firstValue("x-test"));
              System.out.println(HttpRequest.BodyPublishers.noBody().contentLength() + " "
                      + HttpRequest.BodyPublishers.ofString("héllo", StandardCharsets.ISO_8859_1).contentLength() + " "
                      + HttpRequest.BodyPublishers.ofInputStream(() -> null).contentLength());
              byte[] octets = { (byte) 0xff, (byte) 0xfe, 0x41, 0x00, (byte) 0x80, 0x7f };
              System.out.println(text(to("/octets-echo").header("Content-Type", "application/octet-stream")
                  .POST(HttpRequest.BodyPublishers.ofByteArray(octets))
                  .build()));
          }

          static void statuses() throws IOException, InterruptedException {
              System.out.println("== a-status-other-than-200");
              System.out.println(text(to("/status/404").build()) + " " + text(to("/status/500").build()) + " "
                      + text(to("/status/204").build()));
              HttpResponse<String> moved = CLIENT.send(to("/redirect").build(), HttpResponse.BodyHandlers.ofString());
              System.out.println(local(moved) + " " + moved.body() + " " + moved.headers().firstValue("Location"));
          }

          static void fields() throws IOException, InterruptedException {
              System.out.println("== fields-both-ways");
              HttpRequest request = to("/headers").header("X-A", "1")
                  .header("x-a", "2")
                  .headers("X-B", "3", "Accept", "text/plain")
                  .setHeader("X-C", "4")
                  .setHeader("x-c", " 5 ")
                  .build();
              System.out.println(request.headers().map() + " " + text(request));
              HttpResponse<String> cookies = CLIENT.send(to("/cookies").build(), HttpResponse.BodyHandlers.ofString());
              System.out.println(cookies.headers().allValues("set-cookie") + " " + cookies.headers().firstValue("Set-Cookie") + " "
                      + cookies.headers().map().get("SET-COOKIE"));
              HttpHeaders made = HttpHeaders.of(Map.of("B", List.of("1", "2"), "a", List.of(" 3 ")),
                      (name, value) -> !value.equals("2"));
              HttpHeaders same = HttpHeaders.of(Map.of("b", List.of("1"), "A", List.of("3")), (name, value) -> true);
              System.out.println(made.map() + " " + made.firstValue("b") + " " + made.equals(same) + " "
                      + (made.hashCode() == same.hashCode()) + " " + made.toString().equals(
                              "java.net.http.HttpHeaders@" + Integer.toHexString(made.hashCode()) + " { {a=[3], B=[1]} }"));
              HttpRequest.Builder builder = to("/a").header("X", "1");
              HttpRequest.Builder copy = builder.copy().header("Y", "2");
              HttpRequest one = builder.build();
              System.out.println(one.headers().map() + " " + copy.build().headers().map() + " "
                      + one.equals(to("/a").header("x", "1").build()) + " " + one.equals(to("/b").header("X", "1").build()) + " "
                      + (one.hashCode() == to("/a").header("x", "1").build().hashCode()));
          }

          static void refusals() {
              System.out.println("== what-a-builder-refuses");
              refused("restricted", () -> to("/").header("Host", "x"));
              refused("restricted", () -> to("/").setHeader("content-length", "1"));
              refused("restricted", () -> to("/").headers("A", "1", "Upgrade", "x"));
              refused("name", () -> to("/").header("X A", "x"));
              refused("name", () -> to("/").header("", "x"));
              refused("name", () -> to("/").header(null, "x"));
              refused("value", () -> to("/").header("X-A", "a\nb"));
              refused("value", () -> to("/").header("X-A", null));
              refused("value", () -> to("/").header("X-A", "a\u00e9\tb").build().headers().map().toString().replace('\t', '_'));
              refused("count", () -> to("/").headers("X-A"));
              refused("count", () -> to("/").headers());
              refused("scheme", () -> HttpRequest.newBuilder(URI.create("ftp://x/y")));
              refused("scheme", () -> HttpRequest.newBuilder(URI.create("/x/y")));
              refused("host", () -> HttpRequest.newBuilder(URI.create("http:///y")));
              refused("host", () -> HttpRequest.newBuilder(URI.create("http:x")));
              refused("uri", () -> HttpRequest.newBuilder().uri(null));
              refused("uri", () -> HttpRequest.newBuilder().build());
              refused("method", () -> to("/").method("G T", HttpRequest.BodyPublishers.noBody()));
              refused("method", () -> to("/").method("", HttpRequest.BodyPublishers.noBody()));
              refused("method", () -> to("/").method("CONNECT", HttpRequest.BodyPublishers.noBody()));
              refused("method", () -> to("/").method("POST", null));
              refused("range", () -> HttpRequest.BodyPublishers.ofByteArray(new byte[5], 3, 3));
              refused("client", () -> CLIENT.send(null, HttpResponse.BodyHandlers.ofString()));
              refused("client", () -> CLIENT.send(to("/hello").build(), null));
              refused("client", () -> HttpClient.newBuilder().followRedirects(null));
              Map<String, List<String>> twice = new HashMap<>();
              twice.put("a", List.of("1"));
              twice.put("A", List.of("2"));
              refused("fields", () -> HttpHeaders.of(twice, (name, value) -> true));
              refused("fields", () -> to("/").header("X", "1").build().headers().map().put("Y", List.of()));
          }

          static void bodies() throws IOException, InterruptedException {
              System.out.println("== a-body-is-what-its-handler-makes");
              System.out.println(CLIENT.send(to("/utf8").build(), HttpResponse.BodyHandlers.ofString()).body() + " "
                      + CLIENT.send(to("/latin1").build(), HttpResponse.BodyHandlers.ofString()).body() + " "
                      + CLIENT.send(to("/latin1").build(), HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8)).body()
                      + " "
                      + CLIENT.send(to("/utf8").build(), HttpResponse.BodyHandlers.ofString(StandardCharsets.ISO_8859_1))
                          .body()
                          .length());
              StringBuilder points = new StringBuilder();
              for (char c : CLIENT.send(to("/octets").build(), HttpResponse.BodyHandlers.ofString()).body().toCharArray()) {
                  points.append((int) c).append(' ');
              }
              System.out.println(points + Arrays.toString(CLIENT.send(to("/octets").build(), HttpResponse.BodyHandlers.ofByteArray()).body()));
              System.out.println(CLIENT.send(to("/hello").build(), HttpResponse.BodyHandlers.discarding()).body() + " "
                      + CLIENT.send(to("/hello").build(), HttpResponse.BodyHandlers.replacing(42)).body());
              InputStream stream = CLIENT.send(to("/hello").build(), HttpResponse.BodyHandlers.ofInputStream()).body();
              System.out.println((char) stream.read() + new String(stream.readAllBytes()) + " " + stream.read());
              HttpResponse.BodyHandler<String> byStatus = info -> info.statusCode() == 404
                      ? HttpResponse.BodySubscribers.replacing("gone " + info.headers().firstValue("content-length") + " " + info.version())
                      : HttpResponse.BodySubscribers.ofString(StandardCharsets.UTF_8);
              System.out.println(CLIENT.send(to("/status/404").build(), byStatus).body() + " "
                      + CLIENT.send(to("/hello").build(), byStatus).body() + " "
                      + CLIENT.send(to("/hello").build(), info -> HttpResponse.BodySubscribers
                          .mapping(HttpResponse.BodySubscribers.ofString(StandardCharsets.UTF_8), String::length)).body());
          }

          static String followed(HttpClient client, HttpRequest request) throws IOException, InterruptedException {
              HttpResponse<String> response = client.send(request, HttpResponse.BodyHandlers.ofString());
              StringBuilder before = new StringBuilder();
              Optional<HttpResponse<String>> previous = response.previousResponse();
              while (previous.isPresent()) {
                  HttpResponse<String> hop = previous.get();
                  before.append(" < ").append(local(hop)).append(' ').append(hop.body()).append(' ')
                      .append(hop.headers().firstValue("location").orElse("-"));
                  previous = hop.previousResponse();
              }
              return local(response) + " [" + response.body() + "] " + local(response.uri()) + before;
          }

          static void redirects() throws IOException, InterruptedException {
              System.out.println("== redirects-as-the-policy-says");
              HttpClient normal = HttpClient.newBuilder().followRedirects(HttpClient.Redirect.NORMAL).build();
              HttpClient always = HttpClient.newBuilder().followRedirects(HttpClient.Redirect.ALWAYS).build();
              System.out.println(CLIENT.followRedirects() + " " + normal.followRedirects() + " " + always.followRedirects());
              System.out.println(followed(normal, to("/redirect").build()));
              System.out.println(followed(always, to("/redirect").build()));
              System.out.println(followed(normal, to("/loop").build()));
              HttpRequest.BodyPublisher body = HttpRequest.BodyPublishers.ofString("body");
              System.out.println(followed(normal, to("/redirect-post").POST(body).build()));
              System.out.println(followed(normal, to("/redirect-post").PUT(body).build()));
              System.out.println(followed(normal, to("/redirect-307").POST(body).build()));
              System.out.println(followed(normal, to("/redirect-303").PUT(body).build()));
              refused("no location", () -> followed(normal, to("/no-location").build()));
          }

          static String parts(URI uri) {
              return uri.getScheme() + " " + uri.getRawAuthority() + " " + uri.getRawUserInfo() + " " + uri.getHost() + " "
                      + uri.getPort() + " " + uri.getRawPath() + " " + uri.getRawQuery() + " " + uri.getRawFragment() + " "
                      + uri.isAbsolute() + " " + uri.isOpaque() + " | " + uri.getPath() + " " + uri.getQuery() + " "
                      + uri.getFragment() + " " + uri.getRawSchemeSpecificPart() + " .";
          }

          static void uris() {
              System.out.println("== a-uri-is-cut-checked-and-resolved");
              String[] taken = { "HTTP://user:pw@Example.COM:8080/a%20b/c?x=%41&y#%42", "http://host", "http://[::1]:80/p",
                      "http://a_b/p", "http://host:x/p", "http://1.2.3.4:/", "http://1.2.3/", "http://h-/", "http://3com.com./",
                      "mailto:a@b.c#f", "/a/b", "a/b?q", "", "#f", "//host:1", "///p", "http:/a", "x://h/?a[b]" };
              for (String text : taken) {
                  System.out.println(text + " -> " + parts(URI.create(text)));
              }
              String[] refused = { "http://a b/", "http://h/a b", "http://h/a?b c", "http://h/a#b#c", "http://h/%zz", "http://h/%4",
                      "http://h/a|b", "http://h/\u3000", "mailto:a b", "mailto:", "http:", "http://", "//", ":a", "1a:b", "a_b:x",
                      "http://[::1/p", "http://[v1.a]/" };
              for (String text : refused) {
                  try {
                      System.out.println(new URI(text));
                  }
                  catch (URISyntaxException e) {
                      System.out.println(e.getMessage() + " | " + e.getReason() + " | " + e.getIndex() + " | " + e.getInput());
                  }
              }
              refused("create", () -> URI.create("http://a b/"));
              URI base = URI.create("http://h/a/b/c?q#f");
              StringBuilder resolved = new StringBuilder();
              for (String reference : new String[] { "d", "./d", "../d", "../../../d", "/d", "//o/d", "?x", "#y", "", "http://o/z",
                      "d/./e/../f", "mailto:x", "d?x#y" }) {
                  resolved.append(base.resolve(reference)).append(' ');
              }
              System.out.println(resolved + "" + URI.create("mailto:a").resolve("b") + " " + URI.create("a/b").resolve("c") + " "
                      + URI.create("http://h").resolve("c") + " " + base.resolve(URI.create("../x")));
              URI one = URI.create("http://Host/a%2f");
              System.out.println(one.equals(URI.create("HTTP://host/a%2F")) + " " + (one.hashCode() == URI.create("HTTP://host/a%2F").hashCode())
                      + " " + one.equals(URI.create("http://host/A%2f")) + " " + one.compareTo(URI.create("HTTP://host/a%2F")) + " "
                      + (one.compareTo(URI.create("http://host/b")) < 0) + " " + one.equals("http://Host/a%2f") + " " + one);
          }

          static void failures() throws InterruptedException {
              System.out.println("== a-transport-that-fails-and-a-client-closed");
              try {
                  CLIENT.send(HttpRequest.newBuilder(URI.create("http://127.0.0.1:1/x")).build(), HttpResponse.BodyHandlers.ofString());
              }
              catch (ConnectException e) {
                  System.out.println(e + " / " + e.getCause());
              }
              catch (IOException e) {
                  System.out.println("not refused: " + e);
              }
              HttpClient closing = HttpClient.newBuilder().version(HttpClient.Version.HTTP_1_1).build();
              System.out.println(closing.version() + " " + CLIENT.version() + " " + closing.executor() + " " + closing.isTerminated());
              try (HttpClient scoped = closing) {
                  System.out.println(text(to("/hello").build()).length() + " " + scoped.send(to("/hello").build(), HttpResponse.BodyHandlers.ofString()).body());
              }
              catch (IOException e) {
                  System.out.println("failed: " + e);
              }
              try {
                  closing.send(to("/hello").build(), HttpResponse.BodyHandlers.ofString());
              }
              catch (IOException e) {
                  System.out.println(closing.isTerminated() + " " + e);
              }
          }

          public static void main(String[] args) throws IOException, InterruptedException {
              get();
              verbs();
              statuses();
              fields();
              refusals();
              bodies();
              redirects();
              uris();
              failures();
          }
      }
