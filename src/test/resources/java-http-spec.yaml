  # sendAsync and threads: a program that starts threads, which a wasm target lowers resumable
  - name: async
    file: Async.java
    source: |
      import java.io.IOException;
      import java.net.URI;
      import java.net.http.HttpClient;
      import java.net.http.HttpRequest;
      import java.net.http.HttpResponse;
      import java.util.ArrayList;
      import java.util.List;
      import java.util.concurrent.CompletableFuture;
      import java.util.concurrent.CompletionException;
      import java.util.concurrent.CountDownLatch;
      import java.util.concurrent.ExecutionException;
      import java.util.concurrent.Executor;

      public class Async {

          static final String ORIGIN = "@ORIGIN@";

          static final HttpClient CLIENT = HttpClient.newHttpClient();

          static HttpRequest to(String path) {
              return HttpRequest.newBuilder(URI.create(ORIGIN + path)).build();
          }

          static CompletableFuture<String> text(String path) {
              return CLIENT.sendAsync(to(path), HttpResponse.BodyHandlers.ofString())
                  .thenApply(response -> response.statusCode() + " [" + response.body() + "]");
          }

          static void futures() throws Exception {
              System.out.println("== send-async-answers-a-future-of-the-reply");
              CompletableFuture<HttpResponse<String>> sent = CLIENT.sendAsync(to("/hello"), HttpResponse.BodyHandlers.ofString());
              System.out.println("sent");
              System.out.println(sent.thenApply(HttpResponse::body).thenApply(body -> body.toUpperCase()).join());
              System.out.println(sent.isDone() + " " + sent.get().statusCode() + " " + sent.join().uri().getPath());
              CompletableFuture<String> slow = text("/slow");
              CompletableFuture<String> missing = text("/status/404");
              System.out.println(slow.thenCombine(missing, (one, other) -> one + " + " + other).get());
              List<CompletableFuture<String>> all = new ArrayList<>();
              for (int i = 0; i < 5; i++) {
                  all.add(text("/query?n=" + i));
              }
              CompletableFuture.allOf(all.toArray(new CompletableFuture[0])).join();
              StringBuilder joined = new StringBuilder();
              for (CompletableFuture<String> one : all) {
                  joined.append(one.join()).append(' ');
              }
              System.out.println(joined.toString().trim());
              HttpClient following = HttpClient.newBuilder().followRedirects(HttpClient.Redirect.NORMAL).build();
              System.out.println(following.sendAsync(to("/redirect"), HttpResponse.BodyHandlers.ofString())
                  .thenApply(response -> response.statusCode() + " " + response.body() + " " + response.previousResponse().isPresent())
                  .join());
          }

          static void failures() throws InterruptedException {
              System.out.println("== a-failure-completes-the-future");
              HttpRequest nowhere = HttpRequest.newBuilder(URI.create("http://127.0.0.1:1/x")).build();
              try {
                  CLIENT.sendAsync(nowhere, HttpResponse.BodyHandlers.ofString()).join();
              }
              catch (CompletionException e) {
                  System.out.println(e + " / " + e.getCause());
              }
              try {
                  CLIENT.sendAsync(nowhere, HttpResponse.BodyHandlers.ofString()).get();
              }
              catch (ExecutionException e) {
                  System.out.println(e + " / " + e.getCause());
              }
              System.out.println(CLIENT.sendAsync(nowhere, HttpResponse.BodyHandlers.ofString())
                  .handle((response, thrown) -> response + " " + (thrown == null ? null : thrown.getClass().getName()))
                  .join());
          }

          static void overlapping() throws Exception {
              System.out.println("== a-request-is-on-its-way-when-send-async-returns");
              // the reply to the first ends once the second has arrived
              CompletableFuture<HttpResponse<String>> held = CLIENT.sendAsync(to("/held?java-@LEG@"),
                      HttpResponse.BodyHandlers.ofString());
              System.out.println(CLIENT.send(to("/release?java-@LEG@"), HttpResponse.BodyHandlers.ofString()).body());
              System.out.print(held.get().body());
          }

          static void threads() throws InterruptedException {
              System.out.println("== a-thread-sends-and-waits-for-its-reply");
              String[] answers = new String[3];
              Thread[] senders = new Thread[3];
              CountDownLatch started = new CountDownLatch(3);
              for (int i = 0; i < 3; i++) {
                  int n = i;
                  senders[i] = new Thread(() -> {
                      started.countDown();
                      try {
                          answers[n] = CLIENT.send(to("/query?thread=" + n), HttpResponse.BodyHandlers.ofString()).body();
                      }
                      catch (IOException | InterruptedException e) {
                          answers[n] = String.valueOf(e);
                      }
                  });
                  senders[i].start();
              }
              started.await();
              for (Thread sender : senders) {
                  sender.join();
              }
              System.out.println(String.join(" ", answers));
              List<String> ran = new ArrayList<>();
              Executor inline = task -> {
                  ran.add("task");
                  task.run();
              };
              HttpClient own = HttpClient.newBuilder().executor(inline).build();
              System.out.println(own.executor().isPresent() + " "
                      + own.sendAsync(to("/hello"), HttpResponse.BodyHandlers.ofString()).thenApply(HttpResponse::body).join() + " "
                      + !ran.isEmpty());
          }

          public static void main(String[] args) throws Exception {
              futures();
              failures();
              overlapping();
              threads();
          }
      }
    expected: |
