  - name: subset
    file: Subset.java
    skip:
      jdk: "what the subset's client refuses by name, a JDK's sends or reads"
    source: |
      import java.net.URI;
      import java.net.http.HttpClient;
      import java.net.http.HttpRequest;
      import java.net.http.HttpResponse;
      import java.util.concurrent.CompletableFuture;
      import java.util.concurrent.CompletionStage;

      public class Subset {

          static final String ORIGIN = "@ORIGIN@";

          static final HttpClient CLIENT = HttpClient.newHttpClient();

          static HttpRequest.Builder to(String path) {
              return HttpRequest.newBuilder(URI.create(ORIGIN + path));
          }

          static void refused(HttpRequest request, HttpResponse.BodyHandler<String> handler) throws Exception {
              try {
                  System.out.println(CLIENT.send(request, handler).body());
              }
              catch (UnsupportedOperationException e) {
                  System.out.println(e.getMessage());
              }
          }

          public static void main(String[] args) throws Exception {
              System.out.println("== what-the-subsets-client-refuses-by-name");
              HttpResponse.BodyHandler<String> text = HttpResponse.BodyHandlers.ofString();
              refused(to("/echo").method("TRACE", HttpRequest.BodyPublishers.noBody()).build(), text);
              refused(to("/echo").method("get", HttpRequest.BodyPublishers.noBody()).build(), text);
              refused(to("/echo").expectContinue(true).POST(HttpRequest.BodyPublishers.ofString("x")).build(), text);
              refused(to("/echo").POST(() -> 1L).build(), text);
              refused(to("/hello").build(), info -> new HttpResponse.BodySubscriber<String>() {
                  public CompletionStage<String> getBody() {
                      return CompletableFuture.completedFuture("mine");
                  }
              });
              try {
                  CLIENT.sendAsync(to("/echo").method("TRACE", HttpRequest.BodyPublishers.noBody()).build(), text);
              }
              catch (UnsupportedOperationException e) {
                  System.out.println("refused where it is sent");
              }
              // a reply's version is not told: HTTP_1_1 whatever the transport spoke
              System.out.println(CLIENT.send(to("/hello").build(), text).version());
          }
      }
    expected: |
      == what-the-subsets-client-refuses-by-name
      the method TRACE is not supported by the experimental Java subset: a request is sent as GET, HEAD, POST, PUT, DELETE, OPTIONS or PATCH
      the method get is not supported by the experimental Java subset: a request is sent as GET, HEAD, POST, PUT, DELETE, OPTIONS or PATCH
      expectContinue(true) is not supported by the experimental Java subset
      a BodyPublisher of a program's own class is not supported by the experimental Java subset: HttpRequest.BodyPublishers makes the ones a client sends
      a BodySubscriber of a program's own class is not supported by the experimental Java subset: HttpResponse.BodySubscribers makes the ones a client reads
      refused where it is sent
      HTTP_1_1
