[package]
name = "rlclif"
version = "0.1.0"
edition = "2024"

[dependencies]
cranelift-codegen = "0.132.3"
cranelift-module = "0.132.3"
cranelift-native = "0.132.3"
cranelift-object = "0.132.3"
cranelift-reader = "0.132.3"
object = { version = "=0.39.1", default-features = false, features = ["write"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
